Container@MAP_PREVIEW:
	Logic: MapPreviewLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		Container@MAP_LARGE:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Container@MAP_BG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT - 50
					Children:
						ColorBlock@MAP_BG_FILL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Color: 141414FF
						ColorBlock@MAP_BG_BEVEL_TOP:
							Width: PARENT_WIDTH
							Height: 1
							Color: 3A3A3AFF
						ColorBlock@MAP_BG_BEVEL_LEFT:
							Width: 1
							Height: PARENT_HEIGHT
							Color: 3A3A3AFF
						ColorBlock@MAP_BG_BEVEL_RIGHT:
							X: PARENT_WIDTH - 1
							Width: 1
							Height: PARENT_HEIGHT
							Color: 030303FF
						ColorBlock@MAP_BG_BEVEL_BOTTOM:
							Y: PARENT_HEIGHT - 1
							Width: PARENT_WIDTH
							Height: 1
							Color: 030303FF
						MapPreview@MAP_PREVIEW:
							X: 1
							Y: 1
							Width: PARENT_WIDTH - 2
							Height: PARENT_HEIGHT - 2
							TooltipContainer: TOOLTIP_CONTAINER
				# === Phase 3 — corner brackets (Westwood touch).
				# Eight ColorBlocks composing four 12x12 L-marks. MapPreviewLogic
				# (UpdateBrackets) repositions them every tick to hug the
				# letterboxed preview image; the X/Y below are only the fallback
				# when no minimap is loaded. Replace with a single corner-bracket
				# sprite in Phase 8 if asset work happens. accent #B4B4B4.
				ColorBlock@BRACKET_TL_H:
					X: 8
					Y: 8
					Width: 12
					Height: 2
					Color: B4B4B4FF
				ColorBlock@BRACKET_TL_V:
					X: 8
					Y: 8
					Width: 2
					Height: 12
					Color: B4B4B4FF
				ColorBlock@BRACKET_TR_H:
					X: PARENT_WIDTH - 20
					Y: 8
					Width: 12
					Height: 2
					Color: B4B4B4FF
				ColorBlock@BRACKET_TR_V:
					X: PARENT_WIDTH - 10
					Y: 8
					Width: 2
					Height: 12
					Color: B4B4B4FF
				ColorBlock@BRACKET_BL_H:
					X: 8
					Y: PARENT_HEIGHT - 60
					Width: 12
					Height: 2
					Color: B4B4B4FF
				ColorBlock@BRACKET_BL_V:
					X: 8
					Y: PARENT_HEIGHT - 70
					Width: 2
					Height: 12
					Color: B4B4B4FF
				ColorBlock@BRACKET_BR_H:
					X: PARENT_WIDTH - 20
					Y: PARENT_HEIGHT - 60
					Width: 12
					Height: 2
					Color: B4B4B4FF
				ColorBlock@BRACKET_BR_V:
					X: PARENT_WIDTH - 10
					Y: PARENT_HEIGHT - 70
					Width: 2
					Height: 12
					Color: B4B4B4FF
				# === Phase 3 — title strip
				# Strip grew 30 → 50 to host BigBold 24 map name. Background
				# colour swapped to bg-banner (#1C1C1C, fully opaque). The
				# old 3px left accent stripe is repurposed as a 1px bevel-dark
				# top edge of the strip (matches the panel-head bevel pattern).
				ColorBlock@MAP_TITLE_STRIP:
					Y: PARENT_HEIGHT - 50
					Width: PARENT_WIDTH
					Height: 50
					Color: 1C1C1CFF
				ColorBlock@MAP_TITLE_ACCENT:
					X: 0
					Y: PARENT_HEIGHT - 51
					Width: PARENT_WIDTH
					Height: 1
					Color: 030303FF
				LabelWithTooltip@MAP_TITLE:
					X: 14
					Y: PARENT_HEIGHT - 42
					Width: PARENT_WIDTH * 11 / 20 - 14
					Height: 36
					Font: BigBold
					Align: Left
					TextColor: D4D4D4
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipTemplate: SIMPLE_TOOLTIP
		Container@MAP_SMALL:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Container@MAP_BG:
					Width: PARENT_WIDTH
					Height: 142
					Children:
						ColorBlock@MAP_BG_FILL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Color: 141414FF
						ColorBlock@MAP_BG_BEVEL_TOP:
							Width: PARENT_WIDTH
							Height: 1
							Color: 3A3A3AFF
						ColorBlock@MAP_BG_BEVEL_LEFT:
							Width: 1
							Height: PARENT_HEIGHT
							Color: 3A3A3AFF
						ColorBlock@MAP_BG_BEVEL_RIGHT:
							X: PARENT_WIDTH - 1
							Width: 1
							Height: PARENT_HEIGHT
							Color: 030303FF
						ColorBlock@MAP_BG_BEVEL_BOTTOM:
							Y: PARENT_HEIGHT - 1
							Width: PARENT_WIDTH
							Height: 1
							Color: 030303FF
						MapPreview@MAP_PREVIEW:
							X: 1
							Y: 1
							Width: PARENT_WIDTH - 2
							Height: PARENT_HEIGHT - 2
							TooltipContainer: TOOLTIP_CONTAINER
				LabelWithTooltip@MAP_TITLE:
					Y: 143
					Width: PARENT_WIDTH
					Height: 25
					Font: Bold
					Align: Center
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipTemplate: SIMPLE_TOOLTIP
		Container@MAP_AVAILABLE:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				# WW3MOD: pinned to the bottom title strip (now 50px tall — see
				# MAP_LARGE.MAP_TITLE_STRIP) so the meta lives alongside the
				# BigBold map name on the right. Author on top, type below.
				Label@MAP_AUTHOR:
					X: PARENT_WIDTH * 11 / 20
					Y: PARENT_HEIGHT - 40
					Width: PARENT_WIDTH * 9 / 20 - 14
					Height: 16
					Font: Tiny
					Align: Right
					TextColor: 686868
					IgnoreMouseOver: true
				Label@MAP_TYPE:
					X: PARENT_WIDTH * 11 / 20
					Y: PARENT_HEIGHT - 22
					Width: PARENT_WIDTH * 9 / 20 - 14
					Height: 16
					Font: TinyBold
					Align: Right
					TextColor: 686868
					IgnoreMouseOver: true
		Container@MAP_INCOMPATIBLE:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@MAP_STATUS_A:
					Y: 188
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
					TextColor: 969696
					Text: label-map-incompatible-status-a
					IgnoreMouseOver: true
				Label@MAP_STATUS_B:
					Y: 201
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
					TextColor: 969696
					Text: label-map-incompatible-status-b
		Container@MAP_VALIDATING:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@MAP_STATUS_VALIDATING:
					Y: 174
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
					TextColor: 969696
					Text: label-map-validating-status
					IgnoreMouseOver: true
				ProgressBar@MAP_VALIDATING_BAR:
					Y: 194
					Width: PARENT_WIDTH
					Height: 25
					Indeterminate: True
		Container@MAP_DOWNLOAD_AVAILABLE:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@MAP_TYPE:
					Y: 158
					Width: PARENT_WIDTH
					Height: 25
					Font: TinyBold
					Align: Center
					IgnoreMouseOver: true
				Label@MAP_AUTHOR:
					Y: 171
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
				Button@MAP_INSTALL:
					Y: 194
					Width: PARENT_WIDTH
					Height: 25
					Font: Bold
					Text: button-map-download-available-install
		Button@MAP_UPDATE:
			Y: 195
			Width: PARENT_WIDTH
			Height: 25
			Font: Bold
			Text: button-map-preview-update
		Container@MAP_UPDATE_DOWNLOAD_AVAILABLE:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Button@MAP_INSTALL:
					Y: 166
					Width: PARENT_WIDTH
					Height: 25
					Font: Bold
					Text: button-map-update-download-available-install
		Label@MAP_SEARCHING:
			Y: 158
			Width: PARENT_WIDTH
			Height: 25
			Font: Tiny
			Align: Center
			TextColor: 969696
			Text: label-map-preview-searching
			IgnoreMouseOver: true
		Container@MAP_UNAVAILABLE:
			Width: PARENT_WIDTH
			Children:
				Label@a:
					Y: 158
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
					TextColor: 969696
					Text: label-map-unavailable-a
				Label@b:
					Y: 171
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
					TextColor: 969696
					Text: label-map-unavailable-b
		Label@MAP_ERROR:
			Y: 158
			Width: PARENT_WIDTH
			Height: 25
			Font: Tiny
			Align: Center
			TextColor: 969696
			Text: label-map-preview-error
		Container@MAP_DOWNLOADING:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@MAP_STATUS_DOWNLOADING:
					Y: 158
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
					TextColor: 969696
				ProgressBar@MAP_PROGRESSBAR:
					Y: 194
					Width: PARENT_WIDTH
					Height: 25
					Indeterminate: True
		Button@MAP_RETRY:
			Y: 194
			Width: PARENT_WIDTH
			Height: 25
			Font: Bold
		Container@MAP_UPDATE_AVAILABLE:
			Width: PARENT_WIDTH
			Children:
				Label@a:
					Y: 158
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
					TextColor: 969696
					Text: label-map-update-available-a
				Label@b:
					Y: 171
					Width: PARENT_WIDTH
					Height: 25
					Font: Tiny
					Align: Center
					TextColor: 969696
					Text: label-map-update-available-b
