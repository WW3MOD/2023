Container@LOBBY_MUSIC_BIN:
	Logic: MusicPlayerLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		LogicTicker@SONG_WATCHER:
		# === WW3MOD — panel chrome. This bin overlays LOBBYCHAT (via
		# MUSIC_PANEL_ROOT in lobby.yaml), so it carries the same bg-panel
		# fill + 4-edge 1px bevel so the quadrant keeps one visual language
		# when the Chat / Music tab switches.
		ColorBlock@MUSIC_BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Color: 141414FF
		ColorBlock@MUSIC_BEVEL_TOP:
			Width: PARENT_WIDTH
			Height: 1
			Color: 3A3A3AFF
		ColorBlock@MUSIC_BEVEL_LEFT:
			Width: 1
			Height: PARENT_HEIGHT
			Color: 3A3A3AFF
		ColorBlock@MUSIC_BEVEL_RIGHT:
			X: PARENT_WIDTH - 1
			Width: 1
			Height: PARENT_HEIGHT
			Color: 030303FF
		ColorBlock@MUSIC_BEVEL_BOTTOM:
			Y: PARENT_HEIGHT - 1
			Width: PARENT_WIDTH
			Height: 1
			Color: 030303FF
		# Column headers sit INSIDE the panel top. Stock chrome floated this
		# container at Y: 0 - 24 (24px ABOVE the panel), which detached the
		# Track/Length headers into the tab-toggle gap in the WW3MOD lobby.
		# MUSIC label kept — LobbyLogic hides it by ID.
		Container@LABEL_CONTAINER:
			Y: 4
			Width: PARENT_WIDTH
			Children:
				Label@MUSIC:
					Width: 268
					Height: 20
					Text: label-music-title
					Align: Center
					Font: TinyBold
					TextColor: 969696
				Label@TITLE:
					X: 282
					Width: 230
					Height: 20
					Text: label-container-title
					Font: TinyBold
					TextColor: 969696
				Label@LENGTH:
					X: PARENT_WIDTH - 80
					Height: 20
					Width: 50
					Text: label-music-controls-length
					Font: TinyBold
					TextColor: 969696
					Align: Right
		# Flat inner card (bg-panel-2, no bevel) replacing the stock dialog3
		# chrome. Interior compacted so the bottom-most widget (volume slider,
		# Y 130 + 20 = 150) stays inside the card at panel heights down to
		# ~190px (card height = PARENT_HEIGHT - 32 >= 157 there).
		Container@CONTROLS:
			X: 4
			Y: 28
			Width: 264
			Height: PARENT_HEIGHT - 32
			Children:
				ColorBlock@CONTROLS_BG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Color: 1A1A1AFF
				Label@MUTE_LABEL:
					X: 45
					Y: 8
					Width: PARENT_WIDTH - 55
					Height: 20
					Font: Small
					TextColor: 969696
				Label@TITLE_LABEL:
					Y: 28
					Width: PARENT_WIDTH
					Height: 25
					Align: Center
					Font: Bold
				Label@TIME_LABEL:
					Y: 48
					Width: PARENT_WIDTH
					Height: 25
					Align: Center
					TextColor: 969696
				Container@BUTTONS:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 72
					Width: 131
					Children:
						Button@BUTTON_PREV:
							Width: 26
							Height: 26
							Background: lobby-button
							IgnoreChildMouseOver: true
							Children:
								Image@IMAGE_PREV:
									X: 5
									Y: 5
									ImageCollection: music
									ImageName: prev
						Button@BUTTON_PLAY:
							X: 35
							Width: 26
							Height: 26
							Background: lobby-button
							IgnoreChildMouseOver: true
							Children:
								Image@IMAGE_PLAY:
									X: 5
									Y: 5
									ImageCollection: music
									ImageName: play
						Button@BUTTON_PAUSE:
							Visible: false
							X: 35
							Width: 26
							Height: 26
							Background: lobby-button
							IgnoreChildMouseOver: true
							Children:
								Image@IMAGE_PAUSE:
									X: 5
									Y: 5
									ImageCollection: music
									ImageName: pause
						Button@BUTTON_STOP:
							X: 70
							Width: 26
							Height: 26
							Background: lobby-button
							IgnoreChildMouseOver: true
							Children:
								Image@IMAGE_STOP:
									X: 5
									Y: 5
									ImageCollection: music
									ImageName: stop
						Button@BUTTON_NEXT:
							X: 105
							Width: 26
							Height: 26
							Background: lobby-button
							IgnoreChildMouseOver: true
							Children:
								Image@IMAGE_NEXT:
									X: 5
									Y: 5
									ImageCollection: music
									ImageName: next
				Checkbox@SHUFFLE:
					X: 25
					Y: 104
					Width: 85
					Height: 20
					Font: Regular
					Text: checkbox-music-controls-shuffle
				Checkbox@REPEAT:
					X: PARENT_WIDTH - 15 - WIDTH
					Y: 104
					Width: 70
					Height: 20
					Font: Regular
					Text: checkbox-music-controls-loop
				Label@VOLUME_LABEL:
					Y: 126
					Width: 65
					Height: 25
					Align: Right
					TextColor: 969696
					Text: label-music-controls-volume
				ExponentialSlider@MUSIC_SLIDER:
					X: 70
					Y: 130
					Width: PARENT_WIDTH - 80
					Height: 20
					Ticks: 7
		ScrollPanel@MUSIC_LIST:
			X: 272
			Y: 28
			Width: PARENT_WIDTH - 276
			Height: PARENT_HEIGHT - 32
			Background: ""
			Children:
				ScrollItem@MUSIC_TEMPLATE:
					Width: PARENT_WIDTH - 27
					Height: 25
					X: 2
					Visible: false
					EnableChildMouseOver: True
					Children:
						LabelWithTooltip@TITLE:
							X: 10
							Width: PARENT_WIDTH - 50
							Height: 25
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
						Label@LENGTH:
							X: PARENT_WIDTH - 60
							Width: 50
							Height: 25
							Align: Right
							TextColor: 969696
		Container@NO_MUSIC_LABEL:
			X: 272
			Y: 28
			Width: PARENT_WIDTH - 276
			Visible: false
			Children:
				Label@TITLE:
					Y: 56
					Width: PARENT_WIDTH - 24
					Height: 25
					Font: Bold
					Align: Center
					Text: label-no-music-title
				Label@DESCA:
					Y: 76
					Width: PARENT_WIDTH - 24
					Height: 25
					Align: Center
					TextColor: 969696
					Text: label-no-music-desc-a
				Label@DESCB:
					Y: 96
					Width: PARENT_WIDTH - 24
					Height: 25
					Align: Center
					TextColor: 969696
					Text: label-no-music-desc-b
