Container@LOBBY_PLAYER_BIN:
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		# Two-column layout. Left column is always visible (map + players + chat).
		# Right column swaps via tabs: Match settings (this file), Advanced (lobby-options),
		# or Music (lobby-music). Map preview, scenario picker, Change Map button, and
		# chat are rendered at lobby-root level (see lobby.yaml) because LobbyLogic loads
		# them before LOBBY_PLAYER_BIN exists. This file owns:
		#   • LEFT_COLUMN_PLAYERS  — players list, full left-col width (always visible)
		#   • RIGHT_COLUMN_MATCH   — match settings + active changes + preset (Match tab)

		# === Phase 4 — RIGHT column: players list (top 60% of right side).
		# Was bottom-left; swapped to top-right per the locked design
		# (mockups/full-page-realistic.html). Map stays top-left, settings
		# moves under it, chat sits under players on the right.
		# Widget ID kept as LEFT_COLUMN_PLAYERS for grep/back-compat —
		# only the X/Y/H math moved.
		Container@LEFT_COLUMN_PLAYERS:
			X: PARENT_WIDTH / 2 + 8
			Y: 0
			Width: PARENT_WIDTH / 2 - 8
			Height: PARENT_HEIGHT * 3 / 5 - 8
			Children:
				ColorBlock@CELL_BG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Color: 141414FF
				ColorBlock@CELL_BEVEL_TOP:
					Width: PARENT_WIDTH
					Height: 1
					Color: 3A3A3AFF
				ColorBlock@CELL_BEVEL_LEFT:
					Width: 1
					Height: PARENT_HEIGHT
					Color: 3A3A3AFF
				ColorBlock@CELL_BEVEL_RIGHT:
					X: PARENT_WIDTH - 1
					Width: 1
					Height: PARENT_HEIGHT
					Color: 030303FF
				ColorBlock@CELL_BEVEL_BOTTOM:
					Y: PARENT_HEIGHT - 1
					Width: PARENT_WIDTH
					Height: 1
					Color: 030303FF
				Label@CELL_LABEL:
					X: 12
					Y: 14
					Width: PARENT_WIDTH - 24
					Height: 20
					Font: TinyBold
					Align: Left
					Text: PLAYERS
					TextColor: B4B4B4
				ColorBlock@CELL_LABEL_ACCENT:
					X: 12
					Y: 38
					Width: 28
					Height: 2
					Color: B4B4B4FF
				# === Phase 10 — column rhythm: square Color, two-square Faction/Spawn.
				# 40-tall row + Color 40 · Faction 120 (flag 80 + chevron 40) · Spawn 80
				# (letter 40 + chevron 40) · Name stretches · Ready 40 square.
				Container@LABEL_CONTAINER:
					X: 9
					Y: 48
					Width: PARENT_WIDTH - 18
					Height: 20
					Children:
						Label@LABEL_LOBBY_COLOR:
							X: 4
							Width: 40
							Height: 20
							Text: label-lobby-players-color
							Align: Center
							Font: TinyBold
						Label@LABEL_LOBBY_FACTION:
							X: 48
							Width: 120
							Height: 20
							Text: label-lobby-players-faction
							Align: Center
							Font: TinyBold
						Label@LABEL_LOBBY_SPAWN:
							X: 172
							Width: 80
							Height: 20
							Text: label-lobby-players-spawn
							Align: Center
							Font: TinyBold
						Label@LABEL_LOBBY_TEAM:
							X: 256
							Width: 80
							Height: 20
							Text: label-lobby-players-team
							Align: Center
							Font: TinyBold
						Label@LABEL_LOBBY_NAME:
							X: 340
							Width: PARENT_WIDTH - 392
							Height: 20
							Text: label-lobby-players-name
							Align: Left
							Font: TinyBold
						Label@LABEL_LOBBY_STATUS:
							X: PARENT_WIDTH - 44
							Width: 40
							Height: 20
							Text: label-lobby-players-ready
							Align: Center
							Font: TinyBold
				ScrollPanel@LOBBY_PLAYERS:
					X: 4
					Y: 76
					Width: PARENT_WIDTH - 8
					Height: PARENT_HEIGHT - 124
					TopBottomSpacing: 8
					ItemSpacing: 7
					Background: ""
					ScrollBar: Hidden
					Children:
						# === Phase 10 — V5 row, squared cells + two-square dropdowns.
						# Color 40x40 · Faction 120x40 (flag fills 80, chevron square 40) ·
						# Spawn 80x40 (letter square 40 + chevron square 40) ·
						# Name stretches · Status 40x40 square.
						# PITFALL: empty MiniYaml values must be written as a bare
						# trailing colon (`Separators:`) — *not* `Separators: ""`, which
						# parses as the literal 2-char string `""` (FieldLoader.ParseString
						# returns the raw value). The non-empty literal passes
						# IsNullOrEmpty in DropDownButtonWidget.Draw and crashes lookup
						# with `Sprite ""/separator was not found`. Clearing the field
						# this way removes the DropDownButton vertical line so the row
						# reads as two adjacent squares.
						Container@TEMPLATE_EDITABLE_PLAYER:
							X: 5
							Width: PARENT_WIDTH - 10
							Height: 40
							Visible: false
							Children:
								# Phase 11 — row hover bg. Visibility wired in LobbyUtils.SetupRowHover
								# (called per-row in UpdatePlayerList). First child = lowest z-order, so
								# the colored fill paints under every other widget on the row.
								ColorBlock@ROW_HOVER_BG:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Color: 222222FF
									Visible: false
								# Latency chip deliberately overlays the color tile's bottom-left corner.
								Container@LATENCY:
									X: 4
									Y: 26
									Width: 11
									Height: 14
									Visible: false
									Children:
										ColorBlock@LATENCY_COLOR:
											X: 2
											Y: 2
											Width: PARENT_WIDTH - 4
											Height: PARENT_HEIGHT - 4
								ClientTooltipRegion@LATENCY_REGION:
									X: 4
									Width: 11
									Height: 40
									TooltipContainer: TOOLTIP_CONTAINER
									Template: LATENCY_TOOLTIP
								DropDownButton@COLOR:
									X: 4
									Width: 40
									Height: 40
									IgnoreChildMouseOver: true
									Background: lobby-button
									Separators:
									Children:
										ColorBlock@COLORBLOCK:
											X: 4
											Y: 4
											Width: PARENT_WIDTH - 8
											Height: PARENT_HEIGHT - 8
										# 1px inner bevel over the dynamic player color (later siblings
										# draw on top): top/left light, bottom/right dark alpha overlays.
										ColorBlock:
											X: 4
											Y: 4
											Width: PARENT_WIDTH - 8
											Height: 1
											Color: FFFFFF3C
										ColorBlock:
											X: 4
											Y: 4
											Width: 1
											Height: PARENT_HEIGHT - 8
											Color: FFFFFF3C
										ColorBlock:
											X: 4
											Y: PARENT_HEIGHT - 5
											Width: PARENT_WIDTH - 8
											Height: 1
											Color: 0000005A
										ColorBlock:
											X: PARENT_WIDTH - 5
											Y: 4
											Width: 1
											Height: PARENT_HEIGHT - 8
											Color: 0000005A
								DropDownButton@FACTION:
									X: 48
									Width: 120
									Height: 40
									IgnoreChildMouseOver: true
									Background: lobby-button
									Separators:
									TooltipContainer: TOOLTIP_CONTAINER
									PanelRoot: FACTION_DROPDOWN_PANEL_ROOT
									Children:
										# WW3MOD: flag scales to fill the dropdown's left square (40px
										# tall matches the row height; 76px wide leaves a 4px gap before
										# the 40px chevron square on the right).
										Image@FACTIONFLAG:
											X: 2
											Y: 0
											Width: 76
											Height: 40
											ScaleToBounds: True
										Label@FACTIONNAME:
											X: -200
											Width: 1
											Height: 1
											Text: label-lobby-players-faction
								DropDownButton@SPAWN_DROPDOWN:
									X: 172
									Width: 80
									Height: 40
									Font: MediumBold
									Background: lobby-button
									Separators:
									Text: label-lobby-players-spawn
								TextField@NAME:
									X: 340
									Width: PARENT_WIDTH - 392
									Height: 40
									Text: Name
									LeftMargin: 28
									MaxLength: 16
									Font: MediumBold
									Background: lobby-textfield
									Visible: false
									Children:
										Image@PROFILE:
											ImageCollection: lobby-bits
											X: 8
											Y: 12
											Visible: false
										ClientTooltipRegion@PROFILE_TOOLTIP:
											X: 8
											Y: 12
											Width: 16
											Height: 16
											TooltipContainer: TOOLTIP_CONTAINER
											Template: ANONYMOUS_PLAYER_TOOLTIP
								DropDownButton@SLOT_OPTIONS:
									X: 340
									Width: PARENT_WIDTH - 392
									Height: 40
									Text: label-lobby-players-name
									Font: MediumBold
									Align: Left
									LeftMargin: 10
									Background: lobby-button
									Separators:
									Visible: false
								DropDownButton@TEAM_DROPDOWN:
									X: 256
									Width: 80
									Height: 40
									Font: MediumBold
									Align: Center
									Background: lobby-button
									Separators:
									Text: label-lobby-players-team
									Visible: false
								DropDownButton@HANDICAP_DROPDOWN:
									X: -200
									Width: 1
									Height: 1
									TooltipContainer: TOOLTIP_CONTAINER
									TooltipText: dropdownbutton-lobby-players-handicap-tooltip
								Checkbox@STATUS_CHECKBOX:
									X: PARENT_WIDTH - 44
									Y: 0
									Width: 40
									Height: 40
									Background: lobby-checkbox
									Visible: false
								Image@STATUS_IMAGE:
									X: PARENT_WIDTH - 32
									Y: 12
									Width: 16
									Height: 16
									ImageCollection: checkmark-tick
									ImageName: checked
									Visible: false
						# === Phase 10 — non-editable player row, mirrors editable column positions.
						# Mirrors TEMPLATE_EDITABLE_PLAYER column positions exactly so
						# the visual rhythm is consistent whether a row is host-edited or not.
						Container@TEMPLATE_NONEDITABLE_PLAYER:
							X: 5
							Width: PARENT_WIDTH - 10
							Height: 40
							Visible: false
							Children:
								ColorBlock@ROW_HOVER_BG:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Color: 222222FF
									Visible: false
								# Latency chip deliberately overlays the color tile's bottom-left corner.
								Container@LATENCY:
									X: 4
									Y: 26
									Width: 11
									Height: 14
									Visible: false
									Children:
										ColorBlock@LATENCY_COLOR:
											X: 2
											Y: 2
											Width: PARENT_WIDTH - 4
											Height: PARENT_HEIGHT - 4
								ClientTooltipRegion@LATENCY_REGION:
									X: 4
									Width: 11
									Height: 40
									TooltipContainer: TOOLTIP_CONTAINER
									Template: LATENCY_TOOLTIP
								Image@PROFILE:
									ImageCollection: lobby-bits
									X: 348
									Y: 12
									Visible: false
								ClientTooltipRegion@PROFILE_TOOLTIP:
									X: 348
									Y: 12
									Width: 16
									Height: 16
									TooltipContainer: TOOLTIP_CONTAINER
									Template: ANONYMOUS_PLAYER_TOOLTIP
								ColorBlock@COLORBLOCK:
									X: 8
									Y: 4
									Width: 32
									Height: 32
								# 1px inner bevel over the dynamic player color (later siblings
								# draw on top): top/left light, bottom/right dark alpha overlays.
								ColorBlock:
									X: 8
									Y: 4
									Width: 32
									Height: 1
									Color: FFFFFF3C
								ColorBlock:
									X: 8
									Y: 4
									Width: 1
									Height: 32
									Color: FFFFFF3C
								ColorBlock:
									X: 8
									Y: 35
									Width: 32
									Height: 1
									Color: 0000005A
								ColorBlock:
									X: 39
									Y: 4
									Width: 1
									Height: 32
									Color: 0000005A
								Container@FACTION:
									X: 48
									Width: 120
									Height: 40
									Children:
										# WW3MOD: flag scales to fill the same 76x40 box as the
										# editable variant so both row types read identically.
										Image@FACTIONFLAG:
											X: 2
											Y: 0
											Width: 76
											Height: 40
											ScaleToBounds: True
										Label@FACTIONNAME:
											X: -200
											Width: 1
											Height: 1
											Text: label-lobby-players-faction
								Label@SPAWN:
									X: 172
									Width: 80
									Height: 40
									Align: Center
									Font: MediumBold
								DropDownButton@SPAWN_DROPDOWN:
									X: 172
									Width: 80
									Height: 40
									Font: MediumBold
									Background: lobby-button
									Separators:
									Visible: false
								Label@NAME:
									X: 368
									Width: PARENT_WIDTH - 420
									Height: 40
									Font: MediumBold
									Text: label-lobby-players-name
								DropDownButton@PLAYER_ACTION:
									X: 340
									Width: PARENT_WIDTH - 392
									Height: 40
									Font: MediumBold
									Visible: false
									Align: Left
									LeftMargin: 34
									Background: lobby-button
									Separators:
									Children:
										Image@PROFILE:
											ImageCollection: lobby-bits
											X: 5
											Y: 12
											Visible: false
										ClientTooltipRegion@PROFILE_TOOLTIP:
											X: 5
											Y: 12
											Width: 16
											Height: 16
											TooltipContainer: TOOLTIP_CONTAINER
											Template: ANONYMOUS_PLAYER_TOOLTIP
								Label@TEAM:
									X: 256
									Width: 80
									Height: 40
									Font: MediumBold
									Text: label-lobby-players-team
									Align: Center
								DropDownButton@TEAM_DROPDOWN:
									X: -200
									Width: 1
									Height: 1
									Visible: false
								Label@HANDICAP:
									X: -200
									Width: 1
									Height: 1
									Align: Center
								DropDownButton@HANDICAP_DROPDOWN:
									X: -200
									Width: 1
									Height: 1
									TooltipContainer: TOOLTIP_CONTAINER
									TooltipText: dropdownbutton-lobby-players-handicap-tooltip
								Image@STATUS_IMAGE:
									X: PARENT_WIDTH - 32
									Y: 12
									Width: 16
									Height: 16
									ImageCollection: checkmark-tick
									ImageName: checked
									Visible: false
						# === WW3MOD — empty-slot row matches the player-row column rhythm.
						# Color: hollow 40x40 box at X:4 (no fill = "no player").
						# Play covers Faction (X:48 W:120) + Spawn (X:172 W:80) cells.
						# Add bot covers the Name cell (X:256 W: PW-304).
						# Close is a 40x40 X-icon over the Ready cell (X: PW-44).
						# JOIN keeps full-width when shown alone (non-host, open slot).
						# PITFALL: Text icons that aren't in the bundled font render as
						# tofu boxes. "▸"/"✕" both fail; stick to ASCII (>, X, +).
						Container@TEMPLATE_EMPTY:
							X: 5
							Width: PARENT_WIDTH - 10
							Height: 40
							Visible: false
							Children:
								# bg-panel-2 at 38% alpha — sanctioned translucent variant
								ColorBlock@EMPTY_BG:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Color: 1A1A1A60
								# Hollow color box marking the empty slot — outer frame
								# in bevel-top gray, inner block in panel-bg so it reads
								# as a transparent placeholder column.
								ColorBlock@EMPTY_COLOR_FRAME:
									X: 4
									Y: 0
									Width: 40
									Height: 40
									Color: 3A3A3AFF
								ColorBlock@EMPTY_COLOR_INNER:
									X: 5
									Y: 1
									Width: 38
									Height: 38
									Color: 141414FF
								Button@PLAY:
									X: 48
									Y: 0
									Width: 204
									Height: 40
									Font: Bold
									Background: lobby-button
									Text: Play
									TooltipText: Play in this slot
									TooltipContainer: TOOLTIP_CONTAINER
									Visible: false
								Button@ADD_AI:
									X: 256
									Y: 0
									Width: PARENT_WIDTH - 304
									Height: 40
									Font: Bold
									Background: lobby-button
									Text: + Add bot
									TooltipText: Add bot (faction can be picked on the row after)
									TooltipContainer: TOOLTIP_CONTAINER
									Visible: false
								Button@TOGGLE_CLOSED:
									X: PARENT_WIDTH - 44
									Y: 0
									Width: 40
									Height: 40
									Font: Bold
									Background: lobby-button
									Text: X
									TooltipText: Close this slot
									TooltipContainer: TOOLTIP_CONTAINER
									Visible: false
								Button@JOIN:
									X: 4
									Width: PARENT_WIDTH - 8
									Y: 2
									Height: 36
									Font: Bold
									Background: lobby-button
									Text: button-lobby-players-join
								Label@CLOSED_LABEL:
									X: 48
									Width: PARENT_WIDTH - 40
									Height: 40
									Align: Left
									Font: MediumBold
									Text: Closed
									Visible: false
						# === Phase 9 — full-width editable spectator row.
						# Bigger TextField + status anchored to PARENT_WIDTH so
						# the spectator slot lines up visually with the player rows above.
						Container@TEMPLATE_EDITABLE_SPECTATOR:
							X: 5
							Width: PARENT_WIDTH - 10
							Height: 36
							Visible: false
							Children:
								ColorBlock@ROW_HOVER_BG:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Color: 222222FF
									Visible: false
								# Latency chip removed from spectator rows — no color tile to anchor it, read
								# as a stray square. LATENCY_REGION only parked off-row (not deleted) because
								# LobbyUtils.SetupLatencyWidget fetches it with a plain Get() (crash-on-missing).
								ClientTooltipRegion@LATENCY_REGION:
									X: -200
									Width: 1
									Height: 1
									TooltipContainer: TOOLTIP_CONTAINER
									Template: LATENCY_TOOLTIP
								TextField@NAME:
									X: 15
									Width: 380
									Height: 36
									Text: Name
									LeftMargin: 28
									MaxLength: 16
									Font: MediumBold
									Background: lobby-textfield
									Children:
										Image@PROFILE:
											ImageCollection: lobby-bits
											X: 4
											Y: 10
											Visible: false
										ClientTooltipRegion@PROFILE_TOOLTIP:
											X: 4
											Y: 10
											Width: 16
											Height: 16
											TooltipContainer: TOOLTIP_CONTAINER
											Template: ANONYMOUS_PLAYER_TOOLTIP
								# WW3MOD: spectator label de-emphasised — it's a status indicator,
								# not an action. Left-aligned next to the name in a regular weight
								# instead of bold-centered, which read like a column header.
								Label@SPECTATOR:
									X: 405
									Width: PARENT_WIDTH - 470
									Height: 36
									Text: label-lobby-players-spectator
									Align: Left
									Font: Regular
								Checkbox@STATUS_CHECKBOX:
									X: PARENT_WIDTH - 42
									Y: 0
									Width: 36
									Height: 36
									Background: lobby-checkbox
									Visible: false
								Image@STATUS_IMAGE:
									X: PARENT_WIDTH - 32
									Y: 10
									Width: 16
									Height: 16
									ImageCollection: checkmark-tick
									ImageName: checked
									Visible: false
						# === Phase 9 — full-width non-editable spectator row.
						# Same dimensions as TEMPLATE_EDITABLE_SPECTATOR so the column
						# rhythm is consistent whether the local player is the host or a remote viewer.
						Container@TEMPLATE_NONEDITABLE_SPECTATOR:
							X: 5
							Width: PARENT_WIDTH - 10
							Height: 36
							Visible: false
							Children:
								ColorBlock@ROW_HOVER_BG:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Color: 222222FF
									Visible: false
								# Latency chip removed from spectator rows — no color tile to anchor it, read
								# as a stray square. LATENCY_REGION only parked off-row (not deleted) because
								# LobbyUtils.SetupLatencyWidget fetches it with a plain Get() (crash-on-missing).
								ClientTooltipRegion@LATENCY_REGION:
									X: -200
									Width: 1
									Height: 1
									TooltipContainer: TOOLTIP_CONTAINER
									Template: LATENCY_TOOLTIP
								Image@PROFILE:
									ImageCollection: lobby-bits
									X: 22
									Y: 10
									Visible: false
								ClientTooltipRegion@PROFILE_TOOLTIP:
									X: 22
									Y: 10
									Width: 16
									Height: 16
									TooltipContainer: TOOLTIP_CONTAINER
									Template: ANONYMOUS_PLAYER_TOOLTIP
								Label@NAME:
									X: 43
									Width: 352
									Height: 36
									Font: MediumBold
									Text: label-lobby-players-name
								DropDownButton@PLAYER_ACTION:
									X: 15
									Width: 380
									Height: 36
									Font: MediumBold
									Visible: false
									Align: Left
									LeftMargin: 28
									Background: lobby-button
									Separators:
									Children:
										Image@PROFILE:
											ImageCollection: lobby-bits
											X: 4
											Y: 10
											Visible: false
										ClientTooltipRegion@PROFILE_TOOLTIP:
											X: 4
											Y: 10
											Width: 16
											Height: 16
											TooltipContainer: TOOLTIP_CONTAINER
											Template: ANONYMOUS_PLAYER_TOOLTIP
								# WW3MOD: spectator label de-emphasised — it's a status indicator,
								# not an action. Left-aligned next to the name in a regular weight
								# instead of bold-centered, which read like a column header.
								Label@SPECTATOR:
									X: 405
									Width: PARENT_WIDTH - 470
									Height: 36
									Text: label-lobby-players-spectator
									Align: Left
									Font: Regular
								Image@STATUS_IMAGE:
									X: PARENT_WIDTH - 32
									Y: 10
									Width: 16
									Height: 16
									ImageCollection: checkmark-tick
									ImageName: checked
									Visible: false
				# === Phase 10 — SPECTATE_AREA: pulled out of the player rows and
				# anchored to the bottom-right of LEFT_COLUMN_PLAYERS so the spectate
				# control is always visible regardless of how many roster rows exist.
				# Phase 11 — tightened TOGGLE 130→110, SPECTATE 180→160, total 320→284
				# to give the bottom strip more breathing room at 1920×1080.
				# Visibility (per local-client-is-in-a-slot) and SPECTATE/TOGGLE_SPECTATORS
				# wireup happen in LobbyLogic.cs at startup, not via row-template cloning.
				Container@SPECTATE_AREA:
					X: PARENT_WIDTH - 296
					Y: PARENT_HEIGHT - 42
					Width: 284
					Height: 32
					Children:
						Checkbox@TOGGLE_SPECTATORS:
							X: 0
							Y: 5
							Width: 110
							Height: 22
							Font: Regular
							Background: lobby-checkbox
							Text: checkbox-lobby-players-new-spectator-toggle
						Button@SPECTATE:
							X: 120
							Y: 0
							Width: 164
							Height: 32
							Background: lobby-button
							Text: button-lobby-players-spectate
							Font: Bold
				# WW3MOD RETURN_AREA — the inverse of SPECTATE_AREA, and deliberately a
				# SIBLING of it rather than a child: SPECTATE_AREA also carries the admin
				# spectator toggle and the kick-spectators wireup, and those must stay gated
				# on being in a slot. The two containers are mutually exclusive (Slot != null
				# vs Slot == null) and RETURN_TO_SLOT lands on the exact pixels SPECTATE
				# vacates, so the button that got you out is replaced in place by the one
				# that brings you back. Visibility and label live in LobbyLogic.cs.
				Container@RETURN_AREA:
					X: PARENT_WIDTH - 296
					Y: PARENT_HEIGHT - 42
					Width: 284
					Height: 32
					Children:
						# PITFALL: LobbyLogic sets GetText on this button, which overrides the
						# Text: below — the label flips to "No Open Slot" when the lobby has
						# no free slot. Edit there, not here, to change either wording.
						Button@RETURN_TO_SLOT:
							X: 120
							Y: 0
							Width: 164
							Height: 32
							Background: lobby-button
							Text: Return to Slot
							Font: Bold
				# Phase 11 — tighter setup-row buttons (110/130/130/140 → 90/110/110/110,
				# 10px gaps → 6px). Total span 540 → 438. Setup row width PW-360 → PW-308.
				# 1920×1080 now has 130px headroom (was 36px); 1366×768 still overflows
				# slightly into SPECTATE_AREA — documented limit, no fix planned.
				Container@LOBBY_SETUP_ROW:
					Logic: LobbySetupRowLogic
					X: 12
					Y: PARENT_HEIGHT - 42
					Width: PARENT_WIDTH - 308
					Height: 32
					Children:
