								ClientTooltipRegion@PROFILE_TOOLTIP:
									X: 264
									Y: 12
									Width: 16
									Height: 16
									TooltipContainer: TOOLTIP_CONTAINER
									Template: ANONYMOUS_PLAYER_TOOLTIP
								ColorBlock@COLORBLOCK:
									X: 4
									Y: 0
									Width: 40
									Height: 40
								Container@FACTION:
									X: 48
									Width: 120
									Height: 40
									Children:
										Image@FACTIONFLAG:
											X: 4
											Y: 4
											Width: 72
											Height: 32
										Label@FACTIONNAME:
											X: -200
											Width: 1
											Height: 1
											Text: label-lobby-players-faction
								Label@SPAWN:
									X: 172
									Width: 80
									Height: 40
									Align: Center
									Font: MediumBold
								DropDownButton@SPAWN_DROPDOWN:
									X: 172
									Width: 80
									Height: 40
									Font: MediumBold
									Separators:
									Visible: false
								Label@NAME:
									X: 284
									Width: PARENT_WIDTH - 332
									Height: 40
									Font: MediumBold
									Text: label-lobby-players-name
								DropDownButton@PLAYER_ACTION:
									X: 256
									Width: PARENT_WIDTH - 304
									Height: 40
									Font: MediumBold
									Visible: false
									Align: Left
									LeftMargin: 34
									Separators:
									Children:
										Image@PROFILE:
											ImageCollection: lobby-bits
											X: 5
											Y: 12
											Visible: false
										ClientTooltipRegion@PROFILE_TOOLTIP:
											X: 5
											Y: 12
											Width: 16
											Height: 16
											TooltipContainer: TOOLTIP_CONTAINER
											Template: ANONYMOUS_PLAYER_TOOLTIP
								Label@TEAM:
									X: -200
									Width: 1
									Height: 1
