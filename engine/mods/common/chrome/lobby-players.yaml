											X: 4
											Y: 10
											Width: 16
											Height: 16
											TooltipContainer: TOOLTIP_CONTAINER
											Template: ANONYMOUS_PLAYER_TOOLTIP
								# WW3MOD: spectator label de-emphasised — it's a status indicator,
								# not an action. Left-aligned next to the name in a regular weight
								# instead of bold-centered, which read like a column header.
								Label@SPECTATOR:
									X: 405
									Width: PARENT_WIDTH - 470
									Height: 36
