								TextField@NAME:
									X: 15
									Width: 380
									Height: 36
									Text: Name
									LeftMargin: 28
									MaxLength: 16
									Font: MediumBold
									Children:
										Image@PROFILE:
											ImageCollection: lobby-bits
											X: 4
											Y: 10
											Visible: false
