						Button@SAVE_PRESET_BUTTON:
							X: 298
							Y: 3
							Width: 72
							Height: 30
							Font: Bold
							Text: Save
						Button@RENAME_PRESET_BUTTON:
							X: 378
							Y: 3
							Width: 72
							Height: 30
							Font: Bold
							Text: Rename
						Button@DELETE_PRESET_BUTTON:
							X: 458
							Y: 3
							Width: 72
							Height: 30
							Font: Bold
							Text: Delete
						# Row must end <= 619: bar width is PARENT_WIDTH - 32 = 619 @1366
						# (quadrant 651 wide). 48+8+150+8+76+8+72*4+8*3 = 610, 9px slack.
						Button@RESET_PRESET_BUTTON:
							X: 538
							Y: 3
							Width: 72
							Height: 30
							Font: Bold
							Text: Reset

