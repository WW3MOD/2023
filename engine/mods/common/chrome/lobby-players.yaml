							X: 0
							Y: 0
							Width: 90
							Height: 32
							Font: Bold
							Background: lobby-button
							Text: Add Bots
						Button@REMOVE_BOTS_BUTTON:
							X: 96
							Y: 0
							Width: 110
							Height: 32
							Font: Bold
							Background: lobby-button
							Text: Remove Bots
						DropDownButton@AUTO_TEAM_BUTTON:
							X: 212
							Y: 0
							Width: 110
							Height: 32
							Font: Bold
							Background: lobby-button
							Text: Auto-Team
						Button@REPLAY_LAST_BUTTON:
							X: 328
							Y: 0
							Width: 110
							Height: 32
							Font: Bold
							Background: lobby-button
							Text: Replay last

		# RIGHT column for the Match tab: settings + active changes + preset bar.
		# LobbyLogic hides this whole block when the Advanced or Music tab is active —
		# those tabs overlay LOBBY_OPTIONS_BIN / LOBBY_MUSIC_BIN over this column.
		#
		# WW3MOD layout (top to bottom) — bottom-left quadrant, proportional split.
		# Spacing pass: 8px base grid, 16px content inset left/right throughout.
		#   Y 0-40            OPTIONS section header + accent line
		#   Y 40 to PH*3/5-12 COMMON_OPTIONS_PANEL (ScrollPanel; scrolls when short)
		#   Y PH*3/5          divider, then LOBBY_ACTIVE_CHANGES at PH*3/5+6,
		#                     Height PH*2/5-60 (chip renderer caps rows to fit)
		#   Y PH-44 to PH-8   LOBBY_PRESET_BAR (bottom-anchored, 36 tall)
		# === Phase 4 — LEFT column bottom: settings (under map preview).
		# Was full-right; swapped to bottom-left per the locked design.
		# Widget ID kept as RIGHT_COLUMN_MATCH for grep/back-compat.
		Container@RIGHT_COLUMN_MATCH:
			X: 0
			Y: PARENT_HEIGHT * 3 / 5 + 8
			Width: PARENT_WIDTH / 2 - 8
			Height: PARENT_HEIGHT * 2 / 5 - 8
			Children:
				ColorBlock@CELL_BG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Color: 141414FF
				ColorBlock@CELL_BEVEL_TOP:
					Width: PARENT_WIDTH
					Height: 1
					Color: 3A3A3AFF
				ColorBlock@CELL_BEVEL_LEFT:
					Width: 1
					Height: PARENT_HEIGHT
					Color: 3A3A3AFF
				ColorBlock@CELL_BEVEL_RIGHT:
					X: PARENT_WIDTH - 1
					Width: 1
					Height: PARENT_HEIGHT
					Color: 030303FF
				ColorBlock@CELL_BEVEL_BOTTOM:
					Y: PARENT_HEIGHT - 1
					Width: PARENT_WIDTH
					Height: 1
					Color: 030303FF
				Label@CELL_LABEL:
					X: 16
					Y: 12
					Width: PARENT_WIDTH - 32
					Height: 16
					Font: TinyBold
					Align: Left
					Text: OPTIONS
					TextColor: B4B4B4
				ColorBlock@CELL_LABEL_ACCENT:
					X: 16
					Y: 30
					Width: 28
					Height: 2
					Color: B4B4B4FF
				ScrollPanel@COMMON_OPTIONS_PANEL:
					Logic: LobbyOptionsLogic
					X: 0
					Y: 40
					# Full quadrant width minus 4 so the scrollbar (24px, drawn inside
					# the panel's right edge) sits just off the right bevel. Row
					# templates keep their content 4px clear of the scrollbar track.
					Width: PARENT_WIDTH - 4
					# Proportional split: options gets the top 3/5 of the quadrant
					# (minus the 40px header and a 12px gap to the divider at PH*3/5).
					# 155 tall @1080, 241 @1440, 80 @768 — short screens scroll,
					# which is fine for a ScrollPanel-backed grid. A fixed-offset
					# height (PARENT_HEIGHT - 240) went negative at 768.
					Height: PARENT_HEIGHT * 3 / 5 - 52
					Background: ""
					ScrollBar: Right
					Children:
						Label@CATEGORY_FILTER:
							Visible: False
							Text: All
						Container@LOBBY_OPTIONS:
							Y: 8
							Width: PARENT_WIDTH
							Children:
								# === Spacing pass — section header matches the quadrant
								# rhythm: label at the 16px inset, accent rail below,
								# 8px bottom margin inside the 36px strip.
								Container@SECTION_HEADER_TEMPLATE:
									Width: PARENT_WIDTH
									Height: 36
									Visible: False
									Children:
										Label@HEADER_LABEL:
											X: 16
											Y: 8
											Width: PARENT_WIDTH - 32
											Height: 14
											Font: TinyBold
											Align: Left
											TextColor: B4B4B4
										ColorBlock@HEADER_ACCENT:
											X: 16
											Y: 26
											Width: 28
											Height: 2
											Color: B4B4B4FF
								# === Spacing pass — 8px grid: 38 row, 28 box at Y:4 with a
								# 6px rhythm margin below. Grid: 4 columns, 12px gutters,
								# 16px insets — cell X/Width derive from (PW - 32) / 4.
								# The checkbox label offset (box + Height/2) is engine-fixed
								# in CheckboxWidget.Draw.
								Container@CHECKBOX_ROW_TEMPLATE:
									Width: PARENT_WIDTH
									Height: 38
									Children:
										Checkbox@A:
											X: 16
											Y: 4
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 28
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
										Checkbox@B:
											X: (PARENT_WIDTH - 32) / 4 + 16
											Y: 4
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 28
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
										Checkbox@C:
											X: (PARENT_WIDTH - 32) * 2 / 4 + 16
											Y: 4
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 28
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
										Checkbox@D:
											X: (PARENT_WIDTH - 32) * 3 / 4 + 16
											Y: 4
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 28
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
								# === Spacing pass — 54 row: micro-label Y:0 H:12 (TinyBold,
								# muted ink, uppercased sans colon in LobbyOptionsLogic),
								# 6px gap, control Y:18 H:30, 6px rhythm margin below.
								# Same 4-column grid as the checkbox row.
								Container@DROPDOWN_ROW_TEMPLATE:
									Height: 54
									Width: PARENT_WIDTH
									Children:
										LabelForInput@A_DESC:
											X: 16
											Y: 0
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 12
											Visible: False
											Align: Left
											Font: TinyBold
											TextColor: 686868
											For: A
										DropDownButton@A:
											X: 16
											Y: 18
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 30
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
										LabelForInput@B_DESC:
											X: (PARENT_WIDTH - 32) / 4 + 16
											Y: 0
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 12
											Visible: False
											Align: Left
											Font: TinyBold
											TextColor: 686868
											For: B
										DropDownButton@B:
											X: (PARENT_WIDTH - 32) / 4 + 16
											Y: 18
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 30
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
										LabelForInput@C_DESC:
											X: (PARENT_WIDTH - 32) * 2 / 4 + 16
											Y: 0
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 12
											Visible: False
											Align: Left
											Font: TinyBold
											TextColor: 686868
											For: C
										DropDownButton@C:
											X: (PARENT_WIDTH - 32) * 2 / 4 + 16
											Y: 18
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 30
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
										LabelForInput@D_DESC:
											X: (PARENT_WIDTH - 32) * 3 / 4 + 16
											Y: 0
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 12
											Visible: False
											Align: Left
											Font: TinyBold
											TextColor: 686868
											For: D
										DropDownButton@D:
											X: (PARENT_WIDTH - 32) * 3 / 4 + 16
											Y: 18
											Width: (PARENT_WIDTH - 32) / 4 - 12
											Height: 30
											Visible: False
											TooltipContainer: TOOLTIP_CONTAINER
				# === WW3MOD — proportional split, active-changes sized for chips.
				# Options takes the top 3/5 of the quadrant, active changes the
				# bottom 2/5 minus the preset bar: divider at PH*3/5, active
				# changes at PH*3/5+6 with Height PH*2/5-60, preset bar bottom-
				# anchored (PH-44, H 36). Active-changes bottom lands at ~PH-54,
				# leaving a ~10px gap above the preset bar at every resolution
				# (78 tall @1080, 135 @1440, 28 @768). Container spans the full
				# quadrant width; the 16px content inset lives inside it (title
				# X:16 here, chip startX 16 in LobbyActiveChangesLogic).
				# PITFALL (2026-06): chips render from internal Y:36 downward —
				# a too-short container used to push every chip OUTSIDE it, behind
				# the preset bar with no way to scroll into view. The chip renderer
				# now caps visible rows to the measured container height, so short
				# containers (e.g. 768p) truncate gracefully instead of overflowing.
				ColorBlock@RIGHT_DIVIDER_1:
					X: 16
					Y: PARENT_HEIGHT * 3 / 5
					Width: PARENT_WIDTH - 32
					Height: 1
					Color: 030303FF
				Container@LOBBY_ACTIVE_CHANGES:
					Logic: LobbyActiveChangesLogic
					X: 0
					Y: PARENT_HEIGHT * 3 / 5 + 6
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT * 2 / 5 - 60
					Children:
