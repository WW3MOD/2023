				# Spacing pass — bar inset to the quadrant's 16px content margin,
				# 36 tall with 30px controls vertically centered (Y:3), uniform
				# 8px gaps. Translucent SECTION_BG dropped: the flat quadrant
				# panel is the background; the extra tint read as a seam.
				Container@LOBBY_PRESET_BAR:
					Logic: LobbyPresetLogic
					X: 16
					Y: PARENT_HEIGHT - 44
					Width: PARENT_WIDTH - 32
					Height: 36
