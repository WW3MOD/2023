			Width: 1
			Height: PARENT_HEIGHT
			Color: 3A3A3AFF
		ColorBlock@INLINE_BEVEL_RIGHT:
			X: PARENT_WIDTH - 1
			Width: 1
			Height: PARENT_HEIGHT
			Color: 030303FF
		ColorBlock@INLINE_BEVEL_BOTTOM:
