# WW3MOD Phase 12 — inline variant of MAPCHOOSER_PANEL for the lobby's
# Change Map tab. Same widget IDs (MapChooserLogic looks them up by name)
# but parent-relative sizing so the chooser fills MAP_BROWSE_ROOT inside
# the lobby instead of opening as a 900x600 modal that hides the lobby.
# Caller passes closeOnExit=false so Ui.CloseWindow isn't invoked; lobby
# manages visibility via the Map/Change Map tab toggle.
Container@MAPCHOOSER_INLINE:
	Logic: MapChooserLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		ColorBlock@INLINE_BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
