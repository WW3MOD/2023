Background@SERVER_LOBBY:
	Logic: LobbyLogic
		ChatTemplates:
			Chat: CHAT_LINE_TEMPLATE
			Join: SYSTEM_LINE_TEMPLATE
			Leave: SYSTEM_LINE_TEMPLATE
			System: SYSTEM_LINE_TEMPLATE
			Mission: CHAT_LINE_TEMPLATE
			Feedback: TRANSIENT_LINE_TEMPLATE
	# Full-screen lobby — covers the entire window so the shellmap behind doesn't show.
	X: 0
	Y: 0
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Children:
		Background@SOLID_FILL:
			X: 0
			Y: 0
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: dialog-lobby-fill
		# === Top banner bar (Phase 1 — see mods/ww3mod/chrome/_lobby-palette.yaml)
		# bg-banner fill (#1c1c1c) + bevel-dark bottom edge (#030303).
		ColorBlock@TOP_BANNER_FILL:
			X: 0
			Y: 0
			Width: PARENT_WIDTH
			Height: 60
			Color: 1C1C1CFF
		ColorBlock@TOP_BANNER_BEVEL:
			X: 0
			Y: 60
			Width: PARENT_WIDTH
			Height: 1
			Color: 030303FF
		# Top header bar — Back left, title centered, preset/quick-actions right.
		Button@DISCONNECT_BUTTON:
			X: 20
			Y: 16
			Width: 90
			Height: 28
			Text: button-server-lobby-disconnect
			Font: Bold
		Label@SERVER_NAME:
			Y: 14
			Align: Center
			Width: PARENT_WIDTH
			Height: 32
			Font: BigBold
			TextColor: B4B4B4
		# Status indicator on the right side of the top bar
		# (8x8 go-coloured square + Tiny "LOBBY READY" label).
		ColorBlock@STATUS_DOT:
			X: PARENT_WIDTH - 132
			Y: 26
			Width: 8
			Height: 8
			Color: 6EC890FF
		Label@STATUS_LABEL:
			X: PARENT_WIDTH - 120
			Y: 22
			Width: 110
			Height: 16
			Font: Tiny
			Text: LOBBY READY
			TextColor: 969696
		# Old HEADER_SEPARATOR superseded by full-width TOP_BANNER_BEVEL above.
		# Kept so any external reference to its widget ID still resolves;
		# colour neutralised so it no longer paints.
		ColorBlock@HEADER_SEPARATOR:
			X: 24
			Y: 60
			Width: PARENT_WIDTH - 48
			Height: 1
			Color: 00000000
		# Map/Music toggle — local view switch for the top-left panel. Replaces the
		# old global tab strip (no more right-side tabs; all options live in one scroll).
		Container@MAP_MUSIC_TOGGLE:
			X: 24
			Y: 72
			Width: 200
			Height: 32
			Children:
				Button@MAP_VIEW_BUTTON:
					Width: 90
					Height: 32
					Font: Bold
					Text: Map
				Button@MUSIC_VIEW_BUTTON:
					X: 96
					Width: 90
					Height: 32
					Font: Bold
					Text: Music
				ColorBlock@MAP_VIEW_INDICATOR:
					X: 0
					Y: 30
					Width: 90
					Height: 2
					Color: B4B4B4FF
				ColorBlock@MUSIC_VIEW_INDICATOR:
					X: 96
					Y: 30
					Width: 90
					Height: 2
					Color: B4B4B4FF
		Container@SKIRMISH_TABS:
			X: 24
			Width: 360
			Height: PARENT_HEIGHT
			Visible: False
			Children:
				Button@PLAYERS_TAB:
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-skirmish-tabs-players-tab
				Button@OPTIONS_TAB:
					X: 110
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-skirmish-tabs-options-tab
				Button@MUSIC_TAB:
					X: 220
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: label-music-title
				ColorBlock@PLAYERS_TAB_INDICATOR:
					X: 0
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@OPTIONS_TAB_INDICATOR:
					X: 110
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@MUSIC_TAB_INDICATOR:
					X: 220
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
		Container@MULTIPLAYER_TABS:
			X: 24
			Width: 460
			Height: PARENT_HEIGHT
			Visible: False
			Children:
				Button@PLAYERS_TAB:
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-multiplayer-tabs-players-tab
				Button@OPTIONS_TAB:
					X: 110
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-multiplayer-tabs-options-tab
				Button@MUSIC_TAB:
					X: 220
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: label-music-title
				Button@SERVERS_TAB:
					X: 330
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-multiplayer-tabs-servers-tab
				ColorBlock@PLAYERS_TAB_INDICATOR:
					X: 0
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@OPTIONS_TAB_INDICATOR:
					X: 110
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@MUSIC_TAB_INDICATOR:
					X: 220
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@SERVERS_TAB_INDICATOR:
					X: 330
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
		# Tab content area — fills the screen between the tab strip and the bottom CTA bar.
		# Left column is always visible (map / players / chat); right column swaps via tabs.
		Container@TOP_PANELS_ROOT:
			X: 24
			Y: 116
			Width: PARENT_WIDTH - 48
			Height: PARENT_HEIGHT - 196
		# Map preview, scenario picker, and Change Map button live at lobby-root
		# level (LobbyLogic loads MapPreviewLogic into MAP_PREVIEW_ROOT before
		# LOBBY_PLAYER_BIN exists). They sit at the top of the LEFT column, bigger
		# than the old 2x2 TL cell. The players list below them uses the same
		# left-column width (PARENT_WIDTH - 64) / 2.
		Container@MAP_PREVIEW_ROOT:
			X: 24
			Y: 116
			Width: (PARENT_WIDTH - 64) / 2
			Height: (PARENT_HEIGHT - 196) * 3 / 5 - 40
		Container@MUSIC_PANEL_ROOT:
			X: 24
			Y: 116
			Width: (PARENT_WIDTH - 64) / 2
			Height: (PARENT_HEIGHT - 196) * 3 / 5 - 40
			Visible: False
		# Scenario picker is rare (most maps run the default skirmish) so it
		# takes the narrower slot. Change Map is the primary action — wider
		# button on the right with the green CTA tint matching Start Game.
		DropDownButton@SCENARIO_DROPDOWNBUTTON:
			X: 24
			Y: 116 + (PARENT_HEIGHT - 196) * 3 / 5 - 32
			Width: ((PARENT_WIDTH - 64) / 2) * 2 / 5 - 4
			Height: 32
			Font: Bold
		Button@CHANGEMAP_BUTTON:
			X: 24 + ((PARENT_WIDTH - 64) / 2) * 2 / 5 + 4
			Y: 116 + (PARENT_HEIGHT - 196) * 3 / 5 - 32
			Width: ((PARENT_WIDTH - 64) / 2) * 3 / 5 - 4
			Height: 32
			Text: button-server-lobby-changemap
			Font: Bold
		DropDownButton@SLOTS_DROPDOWNBUTTON:
			X: 24
			Y: PARENT_HEIGHT - 80
			Width: 185
			Height: 25
			Font: Bold
			Text: dropdownbutton-server-lobby-slots
		Button@RESET_OPTIONS_BUTTON:
			X: 24
			Y: PARENT_HEIGHT - 80
			Width: 185
			Height: 25
			Font: Bold
			Text: button-server-lobby-reset-options
		# === Phase 4 — Chat moved from bottom-left to bottom-right.
		# Sits under the players panel (LEFT_COLUMN_PLAYERS, now on the
		# right side) and above the CTA bar. Takes the same width as the
		# right column. Fills the vertical space from end-of-players to
		# top-of-CTA so chat reads as a substantial pane, not a strip.
		Container@LOBBYCHAT:
			X: PARENT_WIDTH / 2 + 32
			Y: 116 + (PARENT_HEIGHT - 196) * 3 / 5 + 8
			Width: (PARENT_WIDTH - 64) / 2
			Height: PARENT_HEIGHT - (PARENT_HEIGHT - 196) * 3 / 5 - 192
			Children:
				ScrollPanel@CHAT_DISPLAY:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT - 32
					TopBottomSpacing: 2
					ItemSpacing: 2
				Button@CHAT_MODE:
					Y: PARENT_HEIGHT - HEIGHT
					Width: 50
					Height: 28
					Text: button-lobbychat-chat-mode.label
					Font: Bold
					Key: ToggleChatMode
					TooltipText: button-lobbychat-chat-mode.tooltip
					TooltipContainer: TOOLTIP_CONTAINER
				TextField@CHAT_TEXTFIELD:
					X: 55
					Y: PARENT_HEIGHT - HEIGHT
					Width: PARENT_WIDTH - 55
					Height: 28
		# === Bottom CTA banner (Phase 1 — see mods/ww3mod/chrome/_lobby-palette.yaml)
		# bg-banner fill (#1c1c1c) + bevel-dark top edge (#030303). Behind START_GAME.
		ColorBlock@CTA_BANNER_BEVEL:
			X: 0
			Y: PARENT_HEIGHT - 61
			Width: PARENT_WIDTH
			Height: 1
			Color: 030303FF
		ColorBlock@CTA_BANNER_FILL:
			X: 0
			Y: PARENT_HEIGHT - 60
			Width: PARENT_WIDTH
			Height: 60
			Color: 1C1C1CFF
		# === Phase 8 — Start Game proper green chrome.
		# Three layers: bevel-light top+left (#98E0B4), green fill (#6EC890),
		# bevel-dark bottom+right (#2A623A). The Button itself sits on top
		# with Background: '' to disable its default theme so the layered
		# fill shows through. Text is dark (#0B110D) for contrast on green.
		ColorBlock@START_GAME_BEVEL_LIGHT:
			X: 24
			Y: PARENT_HEIGHT - 60
			Width: PARENT_WIDTH - 48
			Height: 1
			Color: 98E0B4FF
		ColorBlock@START_GAME_BEVEL_LEFT:
			X: 24
			Y: PARENT_HEIGHT - 60
			Width: 1
			Height: 48
			Color: 98E0B4FF
		ColorBlock@START_GAME_FILL:
			X: 25
			Y: PARENT_HEIGHT - 59
			Width: PARENT_WIDTH - 50
			Height: 46
			Color: 6EC890FF
		ColorBlock@START_GAME_BEVEL_RIGHT:
			X: PARENT_WIDTH - 25
			Y: PARENT_HEIGHT - 60
			Width: 1
			Height: 48
			Color: 2A623AFF
		ColorBlock@START_GAME_BEVEL_DARK:
			X: 24
			Y: PARENT_HEIGHT - 13
			Width: PARENT_WIDTH - 48
			Height: 1
			Color: 2A623AFF
		Button@START_GAME_BUTTON:
			X: 24
			Y: PARENT_HEIGHT - 60
			Width: PARENT_WIDTH - 48
			Height: 48
			Text: button-server-lobby-start-game
			Font: BigBold
			TextColor: 0B110D
			Background: ""
		Container@FACTION_DROPDOWN_PANEL_ROOT:
		TooltipContainer@TOOLTIP_CONTAINER:
