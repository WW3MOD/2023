Background@SERVER_LOBBY:
	Logic: LobbyLogic
		ChatTemplates:
			Chat: CHAT_LINE_TEMPLATE
			Join: SYSTEM_LINE_TEMPLATE
			Leave: SYSTEM_LINE_TEMPLATE
			System: SYSTEM_LINE_TEMPLATE
			Mission: CHAT_LINE_TEMPLATE
			Feedback: TRANSIENT_LINE_TEMPLATE
	# Full-screen lobby — covers the entire window so the shellmap behind doesn't show.
	X: 0
	Y: 0
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Children:
		Background@SOLID_FILL:
			X: 0
			Y: 0
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: dialog-lobby-fill
		# === Top banner bar (Phase 1 — see mods/ww3mod/chrome/_lobby-palette.yaml)
		# bg-banner fill (#1c1c1c) + bevel-dark bottom edge (#030303).
		ColorBlock@TOP_BANNER_FILL:
			X: 0
			Y: 0
			Width: PARENT_WIDTH
			Height: 60
			Color: 1C1C1CFF
		ColorBlock@TOP_BANNER_BEVEL:
			X: 0
			Y: 60
			Width: PARENT_WIDTH
			Height: 1
			Color: 030303FF
		# Top header bar — Back left, title centered, preset/quick-actions right.
		Button@DISCONNECT_BUTTON:
			X: 16
			Y: 16
			Width: 90
			Height: 28
			Text: button-server-lobby-disconnect
			Font: Bold
		Label@SERVER_NAME:
			Y: 14
			Align: Center
			Width: PARENT_WIDTH
			Height: 32
			Font: BigBold
			TextColor: B4B4B4
		# Status indicator on the right side of the top bar
		# (8x8 go-coloured square + Tiny "LOBBY READY" label).
		# Label right edge at PW-24 to match the global right margin.
		ColorBlock@STATUS_DOT:
			X: PARENT_WIDTH - 146
			Y: 26
			Width: 8
			Height: 8
			Color: 6EC890FF
		Label@STATUS_LABEL:
			X: PARENT_WIDTH - 134
			Y: 22
			Width: 110
			Height: 16
			Font: Tiny
			Text: LOBBY READY
			TextColor: 969696
		# Old HEADER_SEPARATOR superseded by full-width TOP_BANNER_BEVEL above.
		# Kept so any external reference to its widget ID still resolves;
		# colour neutralised so it no longer paints.
		ColorBlock@HEADER_SEPARATOR:
			X: 24
			Y: 60
			Width: PARENT_WIDTH - 48
			Height: 1
			Color: 00000000
		# === Phase 12 — TL panel tab strip: [Map] [Change Map].
		# Music tab no longer lives here; it now overlays the chat panel
		# (see CHAT_MUSIC_TOGGLE / MUSIC_PANEL_ROOT below). MAP_MUSIC_TOGGLE
		# widget ID kept for grep; the wireup in LobbyLogic switched from
		# map↔music to map↔changemap.
		Container@MAP_MUSIC_TOGGLE:
			X: 24
			Y: 72
			Width: 230
			Height: 32
			Children:
				Button@MAP_VIEW_BUTTON:
					Width: 90
					Height: 32
					Font: Bold
					Background: ""
					Text: MAP
				Button@CHANGE_MAP_VIEW_BUTTON:
					X: 96
					Width: 130
					Height: 32
					Font: Bold
					Background: ""
					Text: CHANGE MAP
				ColorBlock@MAP_VIEW_INDICATOR:
					X: 0
					Y: 30
					Width: 90
					Height: 2
					Color: B4B4B4FF
				ColorBlock@CHANGE_MAP_VIEW_INDICATOR:
					X: 96
					Y: 30
					Width: 130
					Height: 2
					Color: B4B4B4FF
		# === WW3MOD — Chat/Music toggle parked in the gap between the players
		# panel (above) and the chat panel (below). Players bottom sits at
		# (PH-196)*3/5 + 108; chat top at 116 + (PH-196)*3/5 + 40. The 32-tall
		# toggle sits centered in that 48px gap: 8px above, 8px below.
		# X aligned to PARENT_WIDTH/2 + 8 to match LEFT_COLUMN_PLAYERS's
		# absolute X (= TOP_PANELS_ROOT.X(24) + (PW-48)/2 + 8). The legacy
		# PARENT_WIDTH/2 + 32 left the chat 24px to the right of the players
		# panel and the toggle overhanging the players area above.
		Container@CHAT_MUSIC_TOGGLE:
			X: PARENT_WIDTH / 2 + 8
			Y: 116 + (PARENT_HEIGHT - 196) * 3 / 5
			Width: 230
			Height: 32
			Children:
				Button@CHAT_VIEW_BUTTON:
					Width: 90
					Height: 32
					Font: Bold
					Background: ""
					Text: CHAT
				Button@MUSIC_VIEW_BUTTON:
					X: 96
					Width: 130
					Height: 32
					Font: Bold
					Background: ""
					Text: MUSIC
				ColorBlock@CHAT_VIEW_INDICATOR:
					X: 0
					Y: 30
					Width: 90
					Height: 2
					Color: B4B4B4FF
				ColorBlock@MUSIC_VIEW_INDICATOR:
					X: 96
					Y: 30
					Width: 130
					Height: 2
					Color: B4B4B4FF
		Container@SKIRMISH_TABS:
			X: 24
			Width: 360
			Height: PARENT_HEIGHT
			Visible: False
			Children:
				Button@PLAYERS_TAB:
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-skirmish-tabs-players-tab
				Button@OPTIONS_TAB:
					X: 110
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-skirmish-tabs-options-tab
				Button@MUSIC_TAB:
					X: 220
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: label-music-title
				ColorBlock@PLAYERS_TAB_INDICATOR:
					X: 0
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@OPTIONS_TAB_INDICATOR:
					X: 110
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@MUSIC_TAB_INDICATOR:
					X: 220
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
		Container@MULTIPLAYER_TABS:
			X: 24
			Width: 460
			Height: PARENT_HEIGHT
			Visible: False
			Children:
				Button@PLAYERS_TAB:
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-multiplayer-tabs-players-tab
				Button@OPTIONS_TAB:
					X: 110
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-multiplayer-tabs-options-tab
				Button@MUSIC_TAB:
					X: 220
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: label-music-title
				Button@SERVERS_TAB:
					X: 330
					Y: 72
					Width: 110
					Height: 32
					Font: Bold
					Text: button-multiplayer-tabs-servers-tab
				ColorBlock@PLAYERS_TAB_INDICATOR:
					X: 0
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@OPTIONS_TAB_INDICATOR:
					X: 110
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@MUSIC_TAB_INDICATOR:
					X: 220
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
				ColorBlock@SERVERS_TAB_INDICATOR:
					X: 330
					Y: 102
					Width: 110
					Height: 3
					Color: B4B4B4FF
		# Tab content area — fills the screen between the tab strip and the bottom CTA bar.
		# Left column is always visible (map / players / chat); right column swaps via tabs.
		Container@TOP_PANELS_ROOT:
			X: 24
			Y: 116
			Width: PARENT_WIDTH - 48
			Height: PARENT_HEIGHT - 196
		# Map preview, scenario picker, and Change Map button live at lobby-root
		# level (LobbyLogic loads MapPreviewLogic into MAP_PREVIEW_ROOT before
		# LOBBY_PLAYER_BIN exists). They sit at the top of the LEFT column, bigger
		# than the old 2x2 TL cell. The players list below them uses the same
		# left-column width (PARENT_WIDTH - 64) / 2.
		Container@MAP_PREVIEW_ROOT:
			X: 24
			Y: 116
			Width: (PARENT_WIDTH - 64) / 2
			Height: (PARENT_HEIGHT - 196) * 3 / 5 - 40
		# === Phase 12 — inline map browser host. Same bounds as MAP_PREVIEW_ROOT;
		# LobbyLogic toggles visibility based on the Map / Change Map tab. Lazy-loads
		# MAPCHOOSER_INLINE into this container on first switch to the Change Map tab.
		Container@MAP_BROWSE_ROOT:
			X: 24
			Y: 116
			Width: (PARENT_WIDTH - 64) / 2
			Height: (PARENT_HEIGHT - 196) * 3 / 5 - 40
			Visible: False
		# === WW3MOD — MUSIC_PANEL_ROOT overlays LOBBYCHAT. Bounds must match
		# LOBBYCHAT exactly (X PW/2+8, Width PW/2-32, Y/H shifted down 32 to
		# clear the CHAT_MUSIC_TOGGLE strip in the gap above).
		Container@MUSIC_PANEL_ROOT:
			X: PARENT_WIDTH / 2 + 8
			Y: 116 + (PARENT_HEIGHT - 196) * 3 / 5 + 40
			Width: PARENT_WIDTH / 2 - 32
			Height: PARENT_HEIGHT - (PARENT_HEIGHT - 196) * 3 / 5 - 236
			Visible: False
		# Scenario picker is rare (most maps run the default skirmish) so it
		# takes the narrower slot. Phase 12 — CHANGEMAP_BUTTON dropped from the
		# bottom row (replaced by the [Change Map] tab above the panel); scenario
		# dropdown spans the bottom strip inset 16px per side from the map
		# column (column X 24, width (PW-64)/2) so it reads as panel content
		# rather than full-bleed chrome. Sits flush under the map preview
		# (top = preview bottom = 116 + (PH-196)*3/5 - 40); its bottom
		# edge at (PH-196)*3/5 + 108 lines up with the TR players panel bottom.
		DropDownButton@SCENARIO_DROPDOWNBUTTON:
			X: 40
			Y: 116 + (PARENT_HEIGHT - 196) * 3 / 5 - 40
			Width: (PARENT_WIDTH - 64) / 2 - 32
			Height: 32
			Font: Bold
		# Phase 12 — CHANGEMAP_BUTTON parked off-screen. Replaced by the
		# [Change Map] tab above the map panel. Kept in the YAML so any
		# external lookup (gh issues / mod refs) still resolves and the C#
		# wireup in LobbyLogic.cs doesn't crash. Its C# OnClick opens the
		# inline Change Map tab (kept for programmatic/back-compat triggers).
		Button@CHANGEMAP_BUTTON:
			X: -2000
			Y: -2000
			Width: 1
			Height: 1
			Text: button-server-lobby-changemap
			Font: Bold
			Visible: False
		# Parked off-screen (same pattern as CHANGEMAP_BUTTON): both are hidden
		# by C# IsVisible, but at their old Y (PARENT_HEIGHT - 80) they overlapped
		# the CTA banner if that guard ever slipped.
		DropDownButton@SLOTS_DROPDOWNBUTTON:
			X: -2000
			Y: PARENT_HEIGHT - 80
			Width: 185
			Height: 25
			Font: Bold
			Text: dropdownbutton-server-lobby-slots
		Button@RESET_OPTIONS_BUTTON:
			X: -2000
			Y: PARENT_HEIGHT - 80
			Width: 185
			Height: 25
			Font: Bold
			Text: button-server-lobby-reset-options
		# === WW3MOD — Chat aligned to the players panel above.
		# X PW/2+8 + Width PW/2-32 = right edge at PW-24, exactly matching
		# LEFT_COLUMN_PLAYERS so the right column reads as one stacked unit.
		# Y shifted down 32 (Y +40 instead of +8) to leave a 32-tall gap above
		# for CHAT_MUSIC_TOGGLE without overhanging the players panel. Height
		# term -236 puts the bottom edge at PH-80, aligned (within 1px) with
		# the BL settings quadrant.
		Container@LOBBYCHAT:
			X: PARENT_WIDTH / 2 + 8
			Y: 116 + (PARENT_HEIGHT - 196) * 3 / 5 + 40
			Width: PARENT_WIDTH / 2 - 32
			Height: PARENT_HEIGHT - (PARENT_HEIGHT - 196) * 3 / 5 - 236
			Children:
				ColorBlock@CHAT_BG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Color: 141414FF
				ColorBlock@CHAT_BEVEL_TOP:
					Width: PARENT_WIDTH
					Height: 1
					Color: 3A3A3AFF
				ColorBlock@CHAT_BEVEL_LEFT:
					Width: 1
					Height: PARENT_HEIGHT
					Color: 3A3A3AFF
				ColorBlock@CHAT_BEVEL_RIGHT:
					X: PARENT_WIDTH - 1
					Width: 1
					Height: PARENT_HEIGHT
					Color: 030303FF
				ColorBlock@CHAT_BEVEL_BOTTOM:
					Y: PARENT_HEIGHT - 1
					Width: PARENT_WIDTH
					Height: 1
					Color: 030303FF
				# Internal CHAT header dropped — the [CHAT] tab in the strip above
				# already labels the panel; the display reclaims the header space.
				# 8px insets all round; display bottom at PH-46 keeps an 8px gap
				# above the 30-tall compose row (row top PH-38, 8px to panel bottom).
				ScrollPanel@CHAT_DISPLAY:
					X: 8
					Y: 8
					Width: PARENT_WIDTH - 16
					Height: PARENT_HEIGHT - 54
					TopBottomSpacing: 2
					ItemSpacing: 2
					Background: ""
				Button@CHAT_MODE:
					X: 8
					Y: PARENT_HEIGHT - 38
					Width: 50
					Height: 30
					Text: button-lobbychat-chat-mode.label
					Font: Bold
					Key: ToggleChatMode
					TooltipText: button-lobbychat-chat-mode.tooltip
					TooltipContainer: TOOLTIP_CONTAINER
					Background: lobby-button
				TextField@CHAT_TEXTFIELD:
					X: 62
					Y: PARENT_HEIGHT - 38
					Width: PARENT_WIDTH - 70
					Height: 30
					Background: lobby-textfield
		# === Bottom CTA banner (Phase 1 — see mods/ww3mod/chrome/_lobby-palette.yaml)
		# bg-banner fill (#1c1c1c) + bevel-dark top edge (#030303). Behind START_GAME.
		ColorBlock@CTA_BANNER_BEVEL:
			X: 0
			Y: PARENT_HEIGHT - 61
			Width: PARENT_WIDTH
			Height: 1
			Color: 030303FF
		ColorBlock@CTA_BANNER_FILL:
			X: 0
			Y: PARENT_HEIGHT - 60
			Width: PARENT_WIDTH
			Height: 60
			Color: 1C1C1CFF
		# === WW3MOD — CTA stats strip: live SLOTS / BOTS / SPECTATORS counts on
		# the quiet left side of the banner. Text filled by LobbyLogic; labels
		# span the full 60px bar height so VAlign: Middle centers them.
		# Pitch tuned for visually even ~44px gaps between the end of one
		# TinyBold text and the next label (was 150px pitch — ragged 90/105).
		Label@STATS_SLOTS:
			X: 24
			Y: PARENT_HEIGHT - 60
			Width: 100
			Height: 60
			Font: TinyBold
			TextColor: 686868
		Label@STATS_BOTS:
			X: 132
			Y: PARENT_HEIGHT - 60
			Width: 80
			Height: 60
			Font: TinyBold
			TextColor: 686868
		Label@STATS_SPECTATORS:
			X: 220
			Y: PARENT_HEIGHT - 60
			Width: 160
			Height: 60
			Font: TinyBold
			TextColor: 686868
		# === WW3MOD — Start Game compact + right-aligned (was full-width).
		# 400px wide button hugging the right edge (24px margin), so the
		# CTA banner's left side reads as a quiet bar rather than a giant
		# green wall. Vertically centered in the 60px banner: 8px above the
		# frame (banner top PH-60), 8px below (frame bottom edge PH-8).
		# Three layers: bevel-light top+left (#98E0B4), green fill (#6EC890),
		# bevel-dark bottom+right (#2A623A). Button itself has
		# Background: "" so the layered chrome paints through.
		ColorBlock@START_BEVEL_LIGHT_TOP:
			X: PARENT_WIDTH - 424
			Y: PARENT_HEIGHT - 52
			Width: 400
			Height: 1
			Color: 98E0B4FF
		ColorBlock@START_BEVEL_LIGHT_LEFT:
			X: PARENT_WIDTH - 424
			Y: PARENT_HEIGHT - 52
			Width: 1
			Height: 44
			Color: 98E0B4FF
		ColorBlock@START_FILL:
			X: PARENT_WIDTH - 423
			Y: PARENT_HEIGHT - 51
			Width: 398
			Height: 42
			Color: 6EC890FF
		ColorBlock@START_BEVEL_DARK_RIGHT:
			X: PARENT_WIDTH - 25
			Y: PARENT_HEIGHT - 52
			Width: 1
			Height: 44
			Color: 2A623AFF
		ColorBlock@START_BEVEL_DARK_BOTTOM:
			X: PARENT_WIDTH - 424
			Y: PARENT_HEIGHT - 9
			Width: 400
			Height: 1
			Color: 2A623AFF
		Button@START_GAME_BUTTON:
			X: PARENT_WIDTH - 424
			Y: PARENT_HEIGHT - 52
			Width: 400
			Height: 44
			Text: button-server-lobby-start-game
			Font: BigBold
			TextColor: 0B110D
			Background: ""
		Container@FACTION_DROPDOWN_PANEL_ROOT:
		TooltipContainer@TOOLTIP_CONTAINER:
