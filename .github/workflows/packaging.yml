name: Release Packaging

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

permissions:
  contents: write #  for release creation (svenstaro/upload-release-action)

jobs:
  linux:
    name: Linux AppImages
    runs-on: ubuntu-22.04
    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Install .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Prepare Environment
      run: |
        if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}
        else
          echo "GIT_TAG=dryrun-${GITHUB_SHA:0:8}" >> ${GITHUB_ENV}
        fi

    - name: Package AppImage
      run: |
        make engine
        mkdir -p build/linux
        sudo apt install libfuse2
        ./packaging/linux/buildpackage.sh "${GIT_TAG}" "${PWD}/build/linux"

    # Always retained, so a workflow_dispatch run proves packaging works
    # without publishing a public release.
    #
    # Deliberately BEFORE the two smoke steps below: if a smoke test fails we want the
    # artifact that failed available for download, and we want the release upload (which
    # follows them) skipped.
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-appimage
        path: build/linux/*

    # Guard 2. v0.1.0 shipped unable to reach the main menu: a MapFolders entry pointing at
    # ^EngineDir|../tools/autotest/scenarios, a dev-checkout directory installers do not
    # ship. No gate caught it because every other check runs against the git checkout,
    # where tools/ exists. This one runs against the ARTIFACT.
    #
    # Deterministic, offline, ~0.1s, and it cannot flake -- so it runs first and is the
    # half of the packaging smoke test that is allowed to be load-bearing.
    - name: Check packaged mounts
      run: |
        set -o pipefail
        cd build/linux
        chmod +x WW3MOD-"${GIT_TAG}"-x86_64.AppImage
        ./WW3MOD-"${GIT_TAG}"-x86_64.AppImage --appimage-extract > /dev/null
        cd "${GITHUB_WORKSPACE}"
        python3 tools/mount-gate/mount_gate.py check \
          --tree build/linux/squashfs-root/usr/lib/openra

    # Guard 1. Actually start the packaged build and require it to get past the main menu.
    #
    # Red Alert content is NOT optional for this: mods/ww3mod/cursors.yaml declares
    # mouse.shp, which no packaged tree contains (it lives in RA's local.mix), and
    # CursorProvider builds every CursorSequence eagerly in its constructor
    # (engine/OpenRA.Game/Graphics/CursorSequence.cs:35) -- so mod load throws
    # FileNotFoundException on a bare runner, long before any menu. Fetching quickinstall
    # is therefore a prerequisite, not a nicety, and it puts a third-party mirror
    # (openra.net) in the release path. If that mirror is the thing that breaks a release
    # job, this step is why.
    #
    # The positive signal is a file, not a timeout: Test.OpenSkirmishLobby makes
    # MainMenuLogic click through to the lobby once the menu's logic has run
    # (MainMenuLogic.cs:598), and LobbyLogic writes Test.LobbyReadyFile once the map is
    # playable (LobbyLogic.cs:999-1003). Both of those are past the point v0.1.0 died.
    - name: Smoke test the AppImage
      run: |
        set -o errexit -o pipefail
        sudo apt-get install -y xvfb unzip
        SMOKE="${RUNNER_TEMP}/smoke"
        mkdir -p "${SMOKE}/Content/ra/v2"

        # Red Alert freeware content, same package the in-game installer downloads
        # (mods/ww3mod/installer/downloads.yaml, quickinstall). Try each mirror in turn.
        curl -fsSL --retry 3 http://www.openra.net/packages/ra-quickinstall-mirrors.txt -o mirrors.txt
        got=""
        while read -r mirror; do
          [ -n "${mirror}" ] || continue
          echo "Trying content mirror: ${mirror}"
          if curl -fsSL --retry 2 "${mirror}" -o quickinstall.zip; then got=1; break; fi
        done < mirrors.txt
        if [ -z "${got}" ]; then echo "::error::no Red Alert content mirror reachable"; exit 1; fi
        unzip -qo quickinstall.zip -d "${SMOKE}/Content/ra/v2"

        cd build/linux/squashfs-root
        set +e
        timeout 180 xvfb-run -a ./AppRun \
          Game.Mod=ww3mod \
          Engine.SupportDir="${SMOKE}/" \
          Graphics.Mode=Windowed \
          Test.Mode=true \
          Test.Name=packaged-smoke \
          Test.ResultPath="${SMOKE}/result.json" \
          Test.OpenSkirmishLobby=true \
          Test.LobbyReadyFile="${SMOKE}/lobby-ready" \
          > "${SMOKE}/stdout.log" 2>&1 &
        GAME_PID=$!

        # Poll for the marker rather than blind-sleeping, and give up the moment the
        # process dies -- a crash must be reported as a crash, not as a timeout.
        ok=""
        for _ in $(seq 1 180); do
          if [ -f "${SMOKE}/lobby-ready" ]; then ok=1; break; fi
          kill -0 "${GAME_PID}" 2>/dev/null || break
          sleep 1
        done
        kill "${GAME_PID}" 2>/dev/null
        wait "${GAME_PID}" 2>/dev/null
        RC=$?
        set -e

        echo "----- stdout -----"; tail -n 200 "${SMOKE}/stdout.log" || true
        if [ -f "${SMOKE}/Logs/exception.log" ]; then
          echo "----- exception.log -----"; cat "${SMOKE}/Logs/exception.log"
          echo "::error::the packaged build threw during startup"; exit 1
        fi
        if [ -z "${ok}" ]; then
          echo "----- debug.log -----"; tail -n 200 "${SMOKE}/Logs/debug.log" || true
          echo "::error::packaged build never reached the skirmish lobby (exit ${RC})"; exit 1
        fi
        echo "Packaged build reached the skirmish lobby."

    - name: Upload smoke logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-smoke-logs
        path: ${{ runner.temp }}/smoke/**/*.log
        if-no-files-found: ignore

    - name: Upload Packages
      if: startsWith(github.ref, 'refs/tags/')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        file: build/linux/*

  macos:
    name: macOS Disk Image
    runs-on: macos-15
    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Install .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Prepare Environment
      run: |
        if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}
        else
          echo "GIT_TAG=dryrun-${GITHUB_SHA:0:8}" >> ${GITHUB_ENV}
        fi

    - name: Package Disk Image
      env:
        MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
        MACOS_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_BASE64 }}
        MACOS_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_PASSWORD }}
        MACOS_DEVELOPER_USERNAME: ${{ secrets.MACOS_DEVELOPER_USERNAME }}
        MACOS_DEVELOPER_PASSWORD: ${{ secrets.MACOS_DEVELOPER_PASSWORD }}
      run: |
        make engine
        mkdir -p build/macos
        ./packaging/macos/buildpackage.sh "${GIT_TAG}" "${PWD}/build/macos"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: build/macos/*

    - name: Upload Package
      if: startsWith(github.ref, 'refs/tags/')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        file: build/macos/*

  windows:
    name: Windows Installers
    runs-on: ubuntu-22.04
    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Install .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Prepare Environment
      run: |
        if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}
        else
          echo "GIT_TAG=dryrun-${GITHUB_SHA:0:8}" >> ${GITHUB_ENV}
        fi
        sudo apt-get update
        sudo apt-get install nsis wine64

    - name: Package Installers
      run: |
        make engine
        mkdir -p build/windows
        ./packaging/windows/buildpackage.sh "${GIT_TAG}" "${PWD}/build/windows"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installers
        path: build/windows/*

    - name: Upload Packages
      if: startsWith(github.ref, 'refs/tags/')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        file: build/windows/*
