name: Release Packaging

on:
  push:
    tags:
    - '*'
  workflow_dispatch:

permissions:
  contents: write #  for release creation (svenstaro/upload-release-action)

jobs:
  linux:
    name: Linux AppImages
    runs-on: ubuntu-22.04
    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Install .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Prepare Environment
      run: |
        if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}
        else
          echo "GIT_TAG=dryrun-${GITHUB_SHA:0:8}" >> ${GITHUB_ENV}
        fi

    - name: Package AppImage
      run: |
        make engine
        mkdir -p build/linux
        sudo apt install libfuse2
        ./packaging/linux/buildpackage.sh "${GIT_TAG}" "${PWD}/build/linux"

    # Always retained, so a workflow_dispatch run proves packaging works
    # without publishing a public release.
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-appimage
        path: build/linux/*

    - name: Upload Packages
      if: startsWith(github.ref, 'refs/tags/')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        file: build/linux/*

  macos:
    name: macOS Disk Image
    runs-on: macos-15
    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Install .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Prepare Environment
      run: |
        if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}
        else
          echo "GIT_TAG=dryrun-${GITHUB_SHA:0:8}" >> ${GITHUB_ENV}
        fi

    - name: Package Disk Image
      env:
        MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
        MACOS_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_BASE64 }}
        MACOS_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_PASSWORD }}
        MACOS_DEVELOPER_USERNAME: ${{ secrets.MACOS_DEVELOPER_USERNAME }}
        MACOS_DEVELOPER_PASSWORD: ${{ secrets.MACOS_DEVELOPER_PASSWORD }}
      run: |
        make engine
        mkdir -p build/macos
        ./packaging/macos/buildpackage.sh "${GIT_TAG}" "${PWD}/build/macos"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: build/macos/*

    - name: Upload Package
      if: startsWith(github.ref, 'refs/tags/')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        file: build/macos/*

  windows:
    name: Windows Installers
    runs-on: ubuntu-22.04
    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Install .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Prepare Environment
      run: |
        if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}
        else
          echo "GIT_TAG=dryrun-${GITHUB_SHA:0:8}" >> ${GITHUB_ENV}
        fi
        sudo apt-get update
        sudo apt-get install nsis wine64

    - name: Package Installers
      run: |
        make engine
        mkdir -p build/windows
        ./packaging/windows/buildpackage.sh "${GIT_TAG}" "${PWD}/build/windows"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installers
        path: build/windows/*

    - name: Upload Packages
      if: startsWith(github.ref, 'refs/tags/')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        file: build/windows/*
