# Y/U/I is the contiguous free run on the top row and matches the tab order.
# The keys these once wanted (E/R/T) are all taken in the Player context now:
# E=Evacuate, R=Resupply (common|hotkeys/game.yaml), T=ShowTerritory below.
ProductionTypeInfantry: Y
	Description: Infantry Tab
	Types: Production
	Contexts: Player

ProductionTypeVehicle: U
	Description: Vehicle Tab
	Types: Production
	Contexts: Player

ProductionTypeAircraft: I
	Description: Aircraft Tab
	Types: Production
	Contexts: Player

# O continues the Y/U/I run on the top row and is unbound in the Player context.
ProductionTypePowers: O
	Description: Support Powers Tab
	Types: Production
	Contexts: Player

# Support-power bin slots 07-10. common|hotkeys/supportpowers.yaml defines 01-06 and stops there;
# the nuclear arsenal took the mod to ten powers, of which a player can hold nine at once, so the
# bin's HotkeyCount was raised to 10 in chrome/ingame-player.yaml and these four have to exist or
# CheckChromeHotkeys fails the gate.
#
# UNBOUND BY DEFAULT, exactly like 01-06 above them -- every SupportPowerNN in the common file
# carries a Description and no key, so the slots are bindable rather than bound. Giving these four
# defaults while the first six have none would be the odd choice, not the other way round.
SupportPower07:
	Description: Slot 07
	Types: SupportPower
	Contexts: Player

SupportPower08:
	Description: Slot 08
	Types: SupportPower
	Contexts: Player

SupportPower09:
	Description: Slot 09
	Types: SupportPower
	Contexts: Player

SupportPower10:
	Description: Slot 10
	Types: SupportPower
	Contexts: Player

# Slots 11-13, added 2026-09-07 with the four Russian warheads. A russia player can hold thirteen
# powers at once -- all fourteen in the mod less the america-locked GBU-57 -- so the bin's
# HotkeyCount went to 13 and these three have to exist or CheckChromeHotkeys fails the gate.
# Unbound by default, like every slot above 01.
SupportPower11:
	Description: Slot 11
	Types: SupportPower
	Contexts: Player

SupportPower12:
	Description: Slot 12
	Types: SupportPower
	Contexts: Player

SupportPower13:
	Description: Slot 13
	Types: SupportPower
	Contexts: Player

GroupScatter: G Shift
	Description: Scatter queued waypoints among selected units
	Types: World
	Contexts: Player

ToLastEvent: BACKSPACE
	Description: Jump to last radar event
	Types: World
	Contexts: Player, Spectator

ShowAllOrders: Space
	Description: Hold to show all friendly unit orders
	Types: Viewport
	Contexts: Player

ShowTerritory: T
	Description: Hold to show the territory (control) overlay
	Types: Viewport
	Contexts: Player

PowerDown: # X
	Description: Power-down mode
	Types: OrderGenerator
	Contexts: Player

# A key, not a mouse gesture, because the viewport has none left to give: right-click issues
# orders (UseClassicMouseStyle is false and nothing in the mod overrides it), Ctrl / Alt /
# Ctrl+Alt / Shift + right are ForceMove / AttackMove / ForceAttack / queue, left+modifier is
# selection priority, and double-left is select-all-of-type. J and K are the only unbound
# letters left; J is the closer reach.
# The description deliberately does not say "at the cursor". The menu opens there, but the
# men do not come out there: both unload orders pass Target.Invalid and the exit cell is only
# chosen when the activity runs, shuffled per passenger among the transport's adjacent cells
# (UnloadCargo.cs:69). Wording that ties the gesture to a location would promise placement
# this feature does not have.
UnloadMenu: J
	Description: Unload menu — choose which class leaves the transport
	Types: World
	Contexts: Player
