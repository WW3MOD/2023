# Y/U/I is the contiguous free run on the top row and matches the tab order.
# The keys these once wanted (E/R/T) are all taken in the Player context now:
# E=Evacuate, R=Resupply (common|hotkeys/game.yaml), T=ShowTerritory below.
ProductionTypeInfantry: Y
	Description: Infantry Tab
	Types: Production
	Contexts: Player

ProductionTypeVehicle: U
	Description: Vehicle Tab
	Types: Production
	Contexts: Player

ProductionTypeAircraft: I
	Description: Aircraft Tab
	Types: Production
	Contexts: Player

GroupScatter: G Shift
	Description: Scatter queued waypoints among selected units
	Types: World
	Contexts: Player

ToLastEvent: BACKSPACE
	Description: Jump to last radar event
	Types: World
	Contexts: Player, Spectator

ShowAllOrders: Space
	Description: Hold to show all friendly unit orders
	Types: Viewport
	Contexts: Player

ShowTerritory: T
	Description: Hold to show the territory (control) overlay
	Types: Viewport
	Contexts: Player

PowerDown: # X
	Description: Power-down mode
	Types: OrderGenerator
	Contexts: Player

# A key, not a mouse gesture, because the viewport has none left to give: right-click issues
# orders (UseClassicMouseStyle is false and nothing in the mod overrides it), Ctrl / Alt /
# Ctrl+Alt / Shift + right are ForceMove / AttackMove / ForceAttack / queue, left+modifier is
# selection priority, and double-left is select-all-of-type. J and K are the only unbound
# letters left; J is the closer reach.
UnloadMenu: J
	Description: Unload menu — pick a class to drop, at the cursor
	Types: World
	Contexts: Player
