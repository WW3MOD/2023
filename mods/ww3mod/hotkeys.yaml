	Description: Vehicle Tab
	Types: Production
	Contexts: Player

ProductionTypeAircraft: I
	Description: Aircraft Tab
	Types: Production
	Contexts: Player

# O continues the Y/U/I run on the top row.
#
# THE LINE HERE USED TO CLAIM O WAS "unbound in the Player context". IT WAS NOT, AND WAS NOT WHEN
# WRITTEN: 746c592c had already given bare O to WaypointMode in common|hotkeys/game.yaml, so the
# two collided under HotkeyManager.GetFirstDuplicate (equal value, overlapping Contexts) and the
# settings panel drew both red. This side WON the clash and keeps its key -- Widget's reverse
# child walk reaches the production sidebar (PLAYER_WIDGETS index 24) before the command bar
# (index 15) -- so nothing about this binding changes. WaypointMode moved to O+Shift on
# 2026-09-22; the reasoning is written out where that key lives.
#
# A NEW BINDING IN THIS FILE IS NOT PROVEN FREE BY THE FILES IN THIS FILE. The mod loads nine
# hotkey files (mod.yaml:281-290) and a clash only needs overlapping Contexts, not a shared file.
ProductionTypePowers: O
	Description: Support Powers Tab
	Types: Production
	Contexts: Player

# Support-power bin slots 07-16. common|hotkeys/supportpowers.yaml defines 01-06 and stops there;
# the bin's HotkeyCount is 16 in chrome/ingame-player.yaml and EVERY slot it promises has to exist
# here or CheckChromeHotkeys fails the gate (CheckChromeHotkeys.cs:97).
#
# IF YOU ARE RESOLVING A CONFLICT IN THIS BLOCK, TAKE THE LONGER SIDE. A concurrent branch
# (wt/ru-nukes) added 11-13 for a fourteen-power roster; this is the same three definitions plus
# 14 and 15, in the same place and the same shape, so taking this side drops nothing of theirs.
# Taking the shorter side silently leaves HotkeyCount promising two slots that do not exist.
#
# WHY 16 AND NOT 6. A normal match draws one faction's buy ladder and nothing else. The count is
# sized to the SANDBOX lobby option, which hands a single player all three tiers at once --
# 5 america + 6 russia + 5 event -- because that is the mode these slots exist to make usable.
# Russia's column went to six with the Oreshnik (rules/powers.yaml, power.oreshnik), which is what
# took this from 15 to 16. The full reasoning, including why the earlier 13 was right for its own
# tree, is written out where the number lives, in chrome/ingame-player.yaml.
#
# UNBOUND BY DEFAULT, like every slot above 01.
#
# UNBOUND BY DEFAULT, exactly like 01-06 above them -- every SupportPowerNN in the common file
# carries a Description and no key, so the slots are bindable rather than bound. Giving these four
# defaults while the first six have none would be the odd choice, not the other way round.
