					TooltipContainer: TOOLTIP_CONTAINER
					ReadyText: READY
					HoldText: ON HOLD
					IconSize: 62, 46
					# WW3Caption, not FreeSansBold: a 1-bit pixel font, so the caption is solid white
					# instead of the grey stipple a vector face gives at 7px (measured through the
					# engine's own freetype6: 3 opaque pixels out of 1307 before, all 481 after).
					# Its Size in mod.yaml is a pixel-grid constant -- see the comment there.
					CaptionFont: CameoCaption
					CaptionBackgroundColor: 000000FF
					# Bottom-anchored at 1, and padding >= margin, both for the reasons spelled out on
					# SUPPORT_PALETTE above -- including why this was 0 until 2026-09-20 and why 0 put
					# the fifth glyph row on a slot row that is painted over. The two palettes MUST
					# agree: a unit's cameo appears in this one and a power's in that one, and the
					# user's direction is that generated captions look the same everywhere. Stated
					# explicitly so CameoCaptionBandTest can check them from this file rather than
					# assuming engine defaults.
					#
					# The frame that eats slot row 45 is a DIFFERENT image here -- `background-iconrow`
					# (sidebar.png 0,116,238,47), cloned once per ROW by ClassicProductionLogic and
					# composited by PALETTE_FOREGROUND below. Its row 46 is 238 opaque pixels, which
					# is slot row 45 given the palette's Y: 1; its opaque columns 103 and 166 are slot
					# column 61 of the first two cells. Same geometry, same consequence.
					CaptionBottomMargin: 1
					CaptionBackgroundPadding: 2
					IconMargin: 1, 1
					IconSpriteOffset: -1, -1
					HotkeyPrefix: Production
					HotkeyCount: 24
					SelectProductionBuildingHotkey: SelectProductionBuilding
