Container@PLAYER_WIDGETS:
	Logic: LoadIngameChatLogic
	Children:
		Container@CHAT_ROOT:
		LogicKeyListener@PLAYER_KEYHANDLER:
			Logic: RemoveFromControlGroupHotkeyLogic, CargoUnloadMenuLogic
				RemoveFromControlGroupKey: RemoveFromControlGroup
				UnloadMenuKey: UnloadMenu
		ControlGroups@CONTROLGROUPS:
			SelectGroupKeyPrefix: ControlGroupSelect
			CreateGroupKeyPrefix: ControlGroupCreate
			AddToGroupKeyPrefix: ControlGroupAddTo
			CombineWithGroupKeyPrefix: ControlGroupCombineWith
			JumpToGroupKeyPrefix: ControlGroupJumpTo
		LogicTicker@SIDEBAR_TICKER:
		Container@SUPPORT_POWERS:
			Logic: SupportPowerBinLogic
			X: 10
			Y: 10
			Children:
				SupportPowers@SUPPORT_PALETTE:
					IconSize: 62, 46
					# WW3Caption, not FreeSansBold: a 1-bit pixel font, so the caption is solid white
					# instead of the grey stipple a vector face gives at 7px (measured through the
					# engine's own freetype6: 3 opaque pixels out of 1307 before, all 481 after).
					# Its Size in mod.yaml is a pixel-grid constant -- see the comment there.
					CaptionFont: CameoCaption
					CaptionBackgroundColor: 000000FF
					# THE CAPTION IS BOTTOM-ANCHORED, AND ONE IS THE MEASURED ANSWER, not a taste
					# call. The runtime caption has to land where the BAKED lettering already is,
					# because it is replacing it -- the user's direction on 2026-09-08 was that this
					# treatment becomes the standard for every unit in the game and that swapping a
					# cameo for an untexted version plus a CameoCaption should be a visual no-op.
					#
					# CORRECTED 2026-09-20 FROM 0, WHICH WAS TWO ERRORS THAT CANCELLED. The old note
					# measured the art right and placed it wrong, and each half on its own still
					# yields 0, so neither could be caught by re-reading the other.
					#
					#   THE ART. Every shipped cameo is 48 rows tall and carries 5 ink rows of baked
					#   caption on SPRITE rows 42-46. Re-measured 2026-09-20 on e1americaicon,
					#   t90icon, abramsicon, e4americaicon, apcicon and mediamericaicon -- four of
					#   those are antialiased rather than 1-bit, so a bright-pixel threshold has to be
					#   loose enough to see rows 45-46 at all or the span reads as 42-44.
					#
					#   WHERE IT LANDS. IconSpriteOffset does NOT offset the sprite's top-left; it
					#   moves the sprite's CENTRE. The widget draws at `0.5 * IconSize +
					#   IconSpriteOffset` (SupportPowersWidget.cs:160) through DrawSpriteCentered,
					#   which subtracts half the SPRITE (WidgetUtils.cs:86-89) -- so a 48-row cameo in
					#   a 46-row slot starts at slot row (46 - 48) / 2 + (-1) = -2, not -1. SPRITE ROW
					#   42 IS SLOT ROW 40 and the baked ink ends on SLOT ROW 44, not 45.
					#
					# AND SLOT ROW 45 CANNOT BE DRAWN ON AT ALL. PALETTE_FOREGROUND below composites
					# `background-supportoverlay` (sidebar.png 12,324,64,48 nato / 77,324,64,48 brics) at -2,-2
					# AFTER the palette widget has drawn, and that frame's row 47 is 64 opaque pixels
					# -- exactly slot row 45. Its columns 0 and 63 cover slot columns -2 and 61 the
					# same way. So anything a caption puts on slot row 45 is painted over before the
					# frame ends: at margin 0 that was the caption's FIFTH GLYPH ROW, and every
					# caption in the game read four rows tall (I as T, L as I, E as F).
					#
					# The generated text's last ink row is `IconSize.Y - CaptionBottomMargin - 1`.
					# SpriteFont.DrawText treats the position as the line box and adds `size` to get
					# the baseline (SpriteFont.cs:99), so a cap occupies baseline-5..baseline-1, and
					# CameoCaptionCache puts the line box at `slotHeight - bottomMargin - lineHeight`
					# where lineHeight IS size. The font drops out entirely: 46 - 1 - 1 = 44, so the
					# ink is slot rows 40-44 -- the baked rows exactly, and clear of the frame.
					#
					# THE PADDING MUST STILL BE AT LEAST THE MARGIN so the band reaches the bottom of
					# the slot and covers the baked lettering underneath. That was free at margin 0
					# and is not any more: at margin 1 the padding has to be at least 1. 2 leaves the
					# band at slot rows 36-45, three rows of clearance above the letters' own 1px
					# surround. Both keys are stated explicitly so CameoCaptionBandTest can check the
					# relationship without keeping a copy of the engine defaults.
					CaptionBottomMargin: 1
					CaptionBackgroundPadding: 2
					IconSpriteOffset: -1, -1
					TooltipContainer: TOOLTIP_CONTAINER
					ReadyText: READY
					HoldText: ON HOLD
					HotkeyPrefix: SupportPower
					# FIFTEEN. RAISED FROM 10 ON 2026-09-07, AND THIS NUMBER SUPERSEDES A 13 WRITTEN
					# THE SAME DAY ON A CONCURRENT BRANCH -- if you are resolving a conflict here,
					# 15 is the answer and the 13 is not wrong so much as earlier. Both reasonings
					# are kept below because each is correct about its own tree.
					#
					# THE 13 (wt/ru-nukes, four Russian warheads): fourteen powers existed, only the
					# two conventional strikes were faction-locked, and every nuclear power was open
					# to both sides -- so a russia player could hold all fourteen less the
					# america-locked GBU-57. Thirteen. That is exactly right for a roster where the
					# nuclear entries are ungated.
					#
					# THE 15 (wt/powers-roster, three-tier faction gating): every power now names a
					# tier, so the count is no longer "the roster minus what your faction misses".
					# A NORMAL MATCH DRAWS AT MOST FIVE -- one faction's buy ladder -- so on that
					# reading 6 would do. The binding case is the SANDBOX lobby option, which hands
					# one player all three tiers at once and makes the bin draw the entire roster:
					# 5 america + 5 russia + 5 event = 15. Sandbox is the mode the user tests in, so
					# sizing to the normal match would leave exactly the person using the feature
					# reaching for a mouse.
					#
					# THE 16 (wt/oreshnik): the same reading, one power later. Russia's buy ladder
					# went from five rungs to six when the Oreshnik was added (rules/powers.yaml,
					# power.oreshnik), so the sandbox total is 5 america + 6 russia + 5 event = 16.
					# Nothing else about the sizing rule changed -- the columns are simply no longer
					# the same height, which is why the count is not a multiple of the tier count.
					#
					# 10 was itself up from 6 on 2026-09-06 for the same reason two steps earlier,
					# when the arsenal took the mod from four powers to ten.
					#
					# IT IS SAFE TO RAISE THIS AND IT ALWAYS WILL BE. The binding is POSITIONAL, not
					# per-power: SupportPowersWidget assigns hotkeys[IconCount] by DRAW INDEX
					# (SupportPowersWidget.cs:161) over the non-Disabled powers, in
					# SupportPowerPaletteOrder. Slot N is "whatever is Nth on screen right now" -- it
					# already differs between an america player and a russia player, and it always
					# has. Raising the count only ever ADDS slots at the end; it cannot rebind an
					# existing slot to a different weapon, because no slot was ever bound to a weapon.
					#
					# THE COUNT IS NOT FREE: SupportPowersWidget.LinterHotkeyNames turns it into the
					# names SupportPower01..SupportPower16 and CheckChromeHotkeys errors on any that
					# is not defined (CheckChromeHotkeys.cs:97). common|hotkeys/supportpowers.yaml
					# stops at 06, so 07-16 are defined in ww3mod|hotkeys.yaml. Raising this again
					# means adding definitions in the same edit.
					HotkeyCount: 16
				Container@PALETTE_FOREGROUND:
					Children:
						Image@ICON_TEMPLATE:
							Logic: AddFactionSuffixLogic
							X: 0 - 2
							Y: 0 - 2
							Width: 62
							Height: 46
							IgnoreMouseOver: true
							ImageCollection: sidebar
							ImageName: background-supportoverlay
		# THE DEFCON READOUT. Drawn by DefconReadoutWidget, which stacks the nuclear release block
		# ABOVE the DEFCON strip and anchors both to the BOTTOM of these bounds -- so the strip stays
		# in one place for a whole match while the nuclear block appears, and the strip grows upward
		# when DEFCON 2 adds its trigger line. Height is the reserve for both blocks at their tallest,
		# not the drawn height.
		#
		# MOVED TO THE BOTTOM-RIGHT 2026-09-14, ON REQUEST. It docked bottom-left until then, and the
		# rationale that put it there claimed "the right 250px is the sidebar for the whole height of
		# the window". THAT WAS FALSE and a capture settles it: in
		# 260913_223739_p79561_demo-defcon-readout/008_08-ledger-asymmetric.png the sidebar stops at
		# the bottom of the production palette, a little over halfway down, and everything below it on
		# that side is empty playfield. Do not restore the old claim.
		#
		# WHAT IS ACTUALLY IN THIS CORNER, and it is two panels rather than a wall:
		#   - GARRISON_PANEL and CARGO_PANEL (below, X: WINDOW_WIDTH - 240, Y: WINDOW_HEIGHT - 260,
		#     228x240) share one footprint and are up only while a hold or a transport is selected.
		#     AvoidPanels below is how the readout gets out of their way -- the widget draws from
		#     whichever panel is visible, 5px above its top edge, instead of from its own bottom.
		#   - the sidebar proper (X: WINDOW_WIDTH - 250, 238 wide) ends far above all of this.
		# The readout is 341 wide against the sidebar's 238, so its left edge sits ~100px further left
		# than the sidebar's -- clear of the chat root (550 wide, centred, bottom-anchored) at every
		# window width this mod supports.
		#
		# 341 IS SET BY THE COMMAND BAR AT 1280 WIDE, NOT BY THE CONTENT. CMD_BG_A..RESUPPLY_BG below
		# are absolutely positioned and do NOT move with the window. RESUPPLY_BG is the rightmost:
		# X:809 Width:120, so the bar's last pixel is 928 and the first free column is 929. This
		# widget's left edge is WINDOW_WIDTH - WIDTH - 5, which at the narrowest supported window is
		# 1275 - WIDTH. WIDTH 341 lands it at 934 -- clear of 929 by the same 5px every other pair of
		# bottom-docked panels in this file uses, and the same gap AvoidPanelGap keeps below.
		#
		# IT WAS 352 UNTIL 2026-09-14 AND IT OVERLAPPED. At 352 the left edge landed at 923 and the
		# bottom 44px of the strip drew under the last 6px of RESUPPLY_BG at any window narrower than
		# 1286 -- 1280x720 included. Shrinking was chosen over the alternative this comment used to
		# name (Y: WINDOW_HEIGHT - HEIGHT - 54 clears the bar at every width) because that lifts the
		# readout off the corner at EVERY width to fix one that is only wrong below 1286, and over
		# re-anchoring the command bar, which is 24 absolute X values across six panels.
		#
		# WHAT THE 11px COSTS, since the widget derives everything from Bounds.Width: contentWidth is
		# WIDTH - 22, so 330 -> 319.
		#
		# THE BAND BOXES GOT NARROWER AT EXCHANGE v2 (2026-09-15) and this arithmetic moved with them.
		# Each row now ends in a 34px clock column with a 4px gap (one READY / m:ss per ROW, where v1
		# drew a small countdown inside every box), so the five boxes are (WIDTH - 110) / 5 rather than
		# (WIDTH - 72) / 5: 52 -> 46 at the shipped 341, and 56 -> 50 at 352.
		# "100kt" measures ~30px in Tiny (read off the ledger crop of frame 08 in
		# 260914_122039_p8182_demo-defcon-readout), so it still fits a 46px box with ~8px of slack each
		# side, and "READY" fits its own column -- but this is ARITHMETIC AND NOT A CAPTURE: no frame
		# has been taken at the narrower width. Frame 08 of the next demo-defcon-readout run is what
		# settles it. The
		# rule and foot lines wrap 11px earlier; in every captured frame their second line runs under a
		# third of the width, so none of them gains a third line.
		DefconReadout@DEFCON_READOUT:
			X: WINDOW_WIDTH - WIDTH - 5
			Y: WINDOW_HEIGHT - HEIGHT - 5
			Width: 341
			# 170 UNTIL 2026-09-13, WHEN THE NUCLEAR BLOCK GAINED A SECOND LEDGER ROW.
			#
			# THIS NUMBER IS A RESERVE, NOT A CLIP. DefconReadoutWidget draws UPWARD from
			# its draw bottom, and that bottom is (Y + Height) = WINDOW_HEIGHT - 5 whatever Height
			# says -- so raising it moves the declared top up and moves nothing that is drawn. What it
			# is for is being HONEST about how much of the screen this can occupy, because the widget
			# does not set a scissor and content taller than the reserve simply draws over whatever is
			# above it.
			#
			# THE WORST CASE IS DEFCON 2 WITH THE GATE ALREADY OPEN -- possible since the phase clocks
			# landed, because "First warheads" can expire inside DEFCON 2 -- which is the only state
			# that draws the trigger line AND the nuclear block at once:
			#   strip  8 + 17 + 7 + 3 + 6 + (2 rule lines x 16) + 9   = 82
			#          + trigger  6 + 12 + 4                          = 104
			#   gap                                                   =   6
			#   nuclear 8 + 12 + 7 + (2 rows x 22) + 2 + 6 + (2 foot lines x 16) + 9 = 120
			#                                                      total = 230
			# 240 leaves ten pixels of slack. The font heights are FreeSans at the sizes mod.yaml's
			# Fonts block gives (Bold 14, Tiny 10, Small 12) and are estimates, not measurements --
			# no frame has been captured in that state.
			Height: 240
			# Both, because the two are mutually exclusive but either can be the one on screen. The
			# widget resolves them once and drops any it cannot find, so this list is safe to extend
			# with a panel some other chrome file declares and this one does not.
			AvoidPanels: GARRISON_PANEL, CARGO_PANEL
			# 14 RATHER THAN THE WIDGET'S DEFAULT 5, BECAUSE THOSE PANELS NOW DRAW A FRAME OUTSIDE THEIR
			# OWN BOUNDS. DefconReadoutWidget measures the gap from Container.RenderBounds.Top, and
			# GARRISON_BG/CARGO_BG below sit at Y: 0 - 9 -- nine pixels above that line. 14 - 9 leaves the
			# same 5px of clear air between the readout and what the player actually sees as the panel's
			# top edge. Change either number and re-check the other.
			AvoidPanelGap: 14
		# Full-width and deliberately not parented to anything: the band runs off both edges of the
		# screen, which is what makes it read as the screen changing state rather than as a dialog.
		# It draws only during the four seconds after a level change and is invisible the rest of the
		# match. A third of the way down keeps it clear of the top-centre notification area and well
		# above the chat.
		DefconTransitionBanner@DEFCON_BANNER:
			X: 0
			Y: (WINDOW_HEIGHT - HEIGHT) / 3
			Width: WINDOW_WIDTH
			Height: 96
		# THE NUCLEAR MOMENTS -- the release gate opening, and your own side being ARMED with a
		# retaliation grant. Same full-width unparented band as the other two, drawn only for four
		# seconds on an edge; NuclearArmedBannerWidget is invisible the rest of the match.
		#
		# IT SITS ABOVE THE DEFCON BANNER, AND THAT IS A DELIBERATE CHOICE BETWEEN TWO BAD OPTIONS.
		# All three of these bands can be on screen at once and none may overlap another:
		#   - ARMED + DEFCON: a nuke that causes the first casualty of the match moves 2 -> 1 AND
		#     arms the side it landed on, on that side's screen, on the same tick;
		#   - ARMED + FINAL EXCHANGE: firing a game-ender begins the final exchange and arms the
		#     other side with a game-ender window, so the victim gets both.
		# Slotting this one BELOW the DEFCON banner would have meant pushing FINAL_EXCHANGE_BANNER
		# down to make room, and that band's position is the one of the three confirmed by captured
		# frames (demo-doomsday-deadhand). Moving a verified thing to make room for an unverified one
		# is the wrong way round, so this goes above instead: it ends exactly where the DEFCON banner
		# begins, and the three read as one column when more than one fires.
		NuclearArmedBanner@NUCLEAR_ARMED_BANNER:
			X: 0
			Y: (WINDOW_HEIGHT - HEIGHT) / 3 - HEIGHT
			Width: WINDOW_WIDTH
			Height: 96
		# THE FINAL EXCHANGE COUNTDOWN. On screen for the whole fifteen-second window and nowhere
		# else -- FinalExchangeBannerWidget draws only while DoomsdayStrike.FinalExchangeOpen. Same
		# full-width, unparented band as the DEFCON banner above, for the same reason: it has to read
		# as the screen changing state rather than as a dialog the player could dismiss.
		#
		# IT SITS BELOW THE DEFCON BANNER, not on it. Both are anchored a third of the way down; this
		# one is offset by its own height so that a DEFCON transition landing inside the window -- the
		# first kill of a match that then runs to the time limit is enough -- draws the two stacked
		# instead of one over the other. Change either height and re-check this.
		FinalExchangeBanner@FINAL_EXCHANGE_BANNER:
			X: 0
			Y: (WINDOW_HEIGHT - HEIGHT) / 3 + HEIGHT
			Width: WINDOW_WIDTH
			Height: 110
