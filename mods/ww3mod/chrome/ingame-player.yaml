		Container@GARRISON_PANEL:
			Logic: GarrisonPanelLogic
			X: WINDOW_WIDTH - 240
			Y: WINDOW_HEIGHT - 260
			Width: 228
			Height: 240
			Children:
				# THE PANEL'S ONLY BACKGROUND, ADDED 2026-09-14. Both of these containers shipped as bare
				# Container@ with no background of any kind, so every row drew straight onto the map and the
				# panel read as loose text rather than as a panel -- see frame 009 of
				# 260914_122039_p8182_demo-defcon-readout. The Contrast: true on every label below was the
				# only thing keeping it legible, and it is kept: it still earns its place over the frame's
				# black centre, and removing it from thirty labels would be a second unverified change.
				#
				# IT SITS 9px OUTSIDE THE CONTAINER ON EVERY SIDE, and that is what makes the padding even.
				# The children run x 0..220 and y 0..232 inside a container declared 228x240, so the slack
				# is 8px right, 8px bottom and NOTHING top or left -- a frame drawn at the container bounds
				# would put commandbar-background's 9px bevel straight under the header text. Drawing from
				# (-9, -9) at 238x250 gives 9px of clear black on all four sides instead. Nothing clips it:
				# ContainerWidget sets no scissor, and PALETTE_FOREGROUND's ICON_TEMPLATE above already
				# relies on the same thing.
				#
				# ClickThrough: true IS LOAD-BEARING. BackgroundWidget swallows the left button by default
				# (ClickThrough is a readonly field defaulting to FALSE, BackgroundWidget.cs:18), which
				# would take 238x250 of playfield out of the map's reach whenever a hold or a transport is
				# selected. This change is meant to be pixels only.
				#
				# BOTH PANELS CARRY THE IDENTICAL RECTANGLE, for the reason CARGO_PANEL's own comment gives:
				# they are mutually exclusive and share one footprint, and a frame that changed size with
				# the kind of hold you clicked would undo that.
				Background@GARRISON_BG:
					X: 0 - 9
					Y: 0 - 9
					Width: 238
					Height: 250
					Background: commandbar-background
					ClickThrough: true
				# NO TICKER LIVES HERE, AND NOTHING THAT HAS TO RUN WHILE THE PANEL IS DOWN EVER CAN.
				# Widget.TickOuter is gated on IsVisible() (Widget.cs:512-518), so every child of this
				# container stops ticking the moment the container hides -- and this container is hidden
				# for almost the whole match. GARRISON_TICKER used to sit on this line and carry the only
				# write that could ever SHOW the panel, which is why the panel never appeared for any
				# selection. GarrisonPanelLogic now drives visibility from an IsVisible delegate, which
				# the visible PARENT evaluates every frame. CARGO_PANEL below has the same shape.
