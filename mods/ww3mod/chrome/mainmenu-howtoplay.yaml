Background@HOWTOPLAY_BRIEFING:
	Logic: HowToPlayBriefingLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 620
	Height: 530
	Children:
		Label@BRIEFING_TITLE:
			X: 0
			Y: 14
			Width: PARENT_WIDTH
			Height: 25
			Text: How to Play
			Align: Center
			Font: Bold
		# 420 -> 435 on 2026-09-21, for HOWTOPLAY_PANEL's FOOT_L3 row (412..429). Nothing clips
		# to this number -- no scissor is set anywhere on this path and the child labels size off
		# PARENT_WIDTH only -- so it is bookkeeping rather than a constraint; it is moved so the
		# declared box still describes the content it holds. 50 + 435 = 485 is exactly
		# BACK_BUTTON's Y below, and the last label's real bottom is 50 + 429 = 479, clear of it.
		Container@BRIEFING_CONTENT:
			X: 20
			Y: 50
			Width: 580
			Height: 435
		Button@BACK_BUTTON:
			X: (PARENT_WIDTH - WIDTH) / 2
			Y: 485
			Width: 140
			Height: 25
			Text: Back
			Font: Bold
			Key: escape
