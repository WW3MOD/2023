# WW3MOD-local copy of common|chrome/ingame-infostats.yaml.
#
# Header and row were two unreconciled coordinate systems: the header row is a
# container at X:22 while the data rows sit inside PLAYER_LIST (X:20) at item
# X:2, and the four header labels were authored against neither. Every X below
# is stated as its ABSOLUTE offset inside the 580px PANEL_ROOT so the two can be
# checked against each other:
#
#   column   header (this container X:20)   row (list X:20 + item X:2)
#   Name     20 + 31 = 51                   22 + 29 = 51
#   Faction  20 + 266 = 286                 22 + 264 = 286
#   Score    20 + 394 = 414 (right-aligned) 22 + 392 = 414 (right-aligned)
#   Actions  20 + 459 = 479                 22 + 457 = 479
#
# Do NOT give PLAYER_TEMPLATE or SPECTATOR_TEMPLATE `Visible: False`. They are
# cloned per row, and Widget's copy constructor shares the IsVisible delegate —
# every clone would ask the hidden template whether to draw and the panel would
# render empty. Only TEAM_TEMPLATE may carry it, because ScrollItemWidget.Setup
# reassigns IsVisible on the clone.
Container@SKIRMISH_STATS:
	Height: PARENT_HEIGHT
	Width: PARENT_WIDTH
	Logic: GameInfoStatsLogic
	Children:
		# Read by GameInfoStatsLogic: the smallest Y the header may be moved to
		# when the objective block is hidden for a spectator. Shifting by the
		# block's full height would put the header at Y:6, and this panel is
		# pinned at Y:65 under a tab strip that ends at Y:75 — i.e. 4px inside
		# the tabs. 30 keeps a 20px gutter below them.
		Label@MIN_TOP_INSET:
			Visible: False
			Text: 30
		Container@OBJECTIVE:
			Width: PARENT_WIDTH
			Height: 75
			Children:
				Label@MISSION:
					X: 20
					Y: 22
					Width: 482
					Height: 25
					Font: MediumBold
					Text: label-mission-objective
				Label@STATS_STATUS:
					X: 100
					Y: 22
					# Was PARENT_WIDTH - 10 against a container with no declared
					# Width, so this resolved to -10.
					Width: PARENT_WIDTH - 110
					Height: 25
					Font: MediumBold
				Checkbox@STATS_CHECKBOX:
					X: 20
					Y: 55
					Width: 482
					Height: 20
					Font: Bold
					Text: checkbox-stats-objective
					Disabled: true
					TextColorDisabled: FFFFFF
		Container@STATS_HEADERS:
			X: 20
			Y: 81
			Width: PARENT_WIDTH - 40
			Height: 27
			Children:
				# Declared before the labels: OpenRA paints children in
				# declaration order with no z-sort.
				ColorBlock@HEADER_BAND:
					Width: PARENT_WIDTH
					Height: 26
					Color: 464E53FF
				ColorBlock@HEADER_RULE:
					Y: 26
					Width: PARENT_WIDTH
					Height: 1
					Color: 5C656BFF
				Label@NAME:
					X: 31
					Width: 200
					Height: 26
					Text: label-stats-player
					Font: Bold
				Label@FACTION:
					X: 266
					Width: 114
					Height: 26
					Text: label-stats-faction
					Font: Bold
				Label@SCORE:
					X: 394
					Width: 54
					Height: 26
					Align: Right
					Text: label-stats-score
					Font: Bold
				Label@ACTIONS:
					X: 459
					Width: 80
					Height: 26
					Text: label-stats-actions
					Font: Bold
		ScrollPanel@PLAYER_LIST:
			X: 20
			Y: 112
			Width: PARENT_WIDTH - 40
			Height: 273
			ItemSpacing: 5
			Children:
				ScrollItem@TEAM_TEMPLATE:
					Background: scrollheader
					Width: PARENT_WIDTH - 26
					Height: 20
					X: 2
					Visible: false
					Children:
						Label@TEAM:
							X: 6
							Y: 0
							Width: 160
							Height: 20
							Font: Bold
						Label@TEAM_SCORE:
							X: 392
							Y: 0
							Width: 54
							Height: 20
							Align: Right
							Font: Bold
				Container@PLAYER_TEMPLATE:
					Width: PARENT_WIDTH - 26
					Height: 25
					X: 2
					Children:
						Image@PROFILE:
							ImageCollection: lobby-bits
							X: 8
							Y: 4
							Visible: false
						ClientTooltipRegion@PROFILE_TOOLTIP:
							X: 8
							Y: 4
							Width: 16
							Height: 16
							Visible: false
							TooltipContainer: TOOLTIP_CONTAINER
							Template: ANONYMOUS_PLAYER_TOOLTIP
						Label@NAME:
							X: 29
							Width: 191
							Height: 25
							Shadow: True
						Image@FACTIONFLAG:
							X: 230
							Y: 5
							Width: 32
							Height: 16
						LabelWithTooltip@FACTION:
							X: 264
							Width: 114
							Height: 25
							Shadow: True
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
						Label@SCORE:
							X: 392
							Width: 54
							Height: 25
							Align: Right
							Shadow: True
						Checkbox@MUTE:
							X: 457
							Width: 25
							Height: 25
							Checkmark: mute
							Background: checkbox-toggle
							TooltipContainer: TOOLTIP_CONTAINER
						Button@KICK:
							X: 485
							Width: 25
							Height: 25
							Background: checkbox-toggle
							TooltipContainer: TOOLTIP_CONTAINER
							Children:
								Image:
									ImageCollection: lobby-bits
									ImageName: kick
									X: 7
									Y: 7
				Container@SPECTATOR_TEMPLATE:
					Width: PARENT_WIDTH - 26
					Height: 25
					X: 2
					Children:
						Image@PROFILE:
							ImageCollection: lobby-bits
							X: 8
							Y: 4
							Visible: false
						ClientTooltipRegion@PROFILE_TOOLTIP:
							X: 8
							Y: 4
							Width: 16
							Height: 16
							Visible: false
							TooltipContainer: TOOLTIP_CONTAINER
							Template: ANONYMOUS_PLAYER_TOOLTIP
						Label@NAME:
							X: 29
							Width: 191
							Height: 25
							Shadow: True
						Checkbox@MUTE:
							X: 457
							Width: 25
							Height: 25
							Checkmark: mute
							Background: checkbox-toggle
							TooltipContainer: TOOLTIP_CONTAINER
						Button@KICK:
							X: 485
							Width: 25
							Height: 25
							Background: checkbox-toggle
							TooltipContainer: TOOLTIP_CONTAINER
							Children:
								Image:
									ImageCollection: lobby-bits
									ImageName: kick
									X: 7
									Y: 7
