Container@HOWTOPLAY_PANEL:
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		Label@TITLE:
			X: 20
			Y: 0
			Width: PARENT_WIDTH - 40
			Height: 26
			Font: MediumBold
			Text: There is no Construction Yard.
		Label@SUB_L1:
			X: 20
			Y: 28
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: Nothing here is built. Anything your tech level allows can be ordered
		Label@SUB_L2:
			X: 20
			Y: 45
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: right now from one list. You spend budget allocation, not materials.
		Label@B1_HEAD:
			X: 20
			Y: 70
			Width: PARENT_WIDTH - 40
			Height: 18
			Font: Bold
			Text: Neutral buildings pay you — a Technician takes them.
		Label@B1_L1:
			X: 20
			Y: 88
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: Oil Derrick $50, Expansion Post $100, Nuclear Reactor $150, paid on
		Label@B1_L2:
			X: 20
			Y: 105
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: the same clock as your budget. Order a Technician from the Infantry
		Label@B1_L3:
			X: 20
			Y: 122
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: list and walk it in; it is spent doing it. Soldiers clear, never own.
		Label@B2_HEAD:
			X: 20
			Y: 147
			Width: PARENT_WIDTH - 40
			Height: 18
			Font: Bold
			Text: Units are called in from off-map reserves.
		Label@B2_L1:
			X: 20
			Y: 165
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: What you order enters at the map edge nearest your Supply Route and
		Label@B2_L2:
			X: 20
			Y: 182
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: moves to its rally point. That march is real time, and the enemy can
		Label@B2_L3:
			X: 20
			Y: 199
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: ambush it on the way.
		Label@B3_HEAD:
			X: 20
			Y: 224
			Width: PARENT_WIDTH - 40
			Height: 18
			Font: Bold
			Text: The Supply Route is your beachhead, not a factory.
		Label@B3_L1:
			X: 20
			Y: 242
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: You start with exactly one, fixed near your spawn. Supply Routes are
		Label@B3_L2:
			X: 20
			Y: 259
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: indestructible; its rally point is the only part you ever set.
		Label@B4_HEAD:
			X: 20
			Y: 284
			Width: PARENT_WIDTH - 40
			Height: 18
			Font: Bold
			Text: You win by cutting their link, not by levelling their base.
		Label@B4_L1:
			X: 20
			Y: 302
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: Park units inside the enemy Supply Route ring to contest it. Their
		Label@B4_L2:
			X: 20
			Y: 319
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: reinforcements slow, then stop, and a red bar fills. If it fills they
		Label@B4_L3:
			X: 20
			Y: 336
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: are frozen out — and unless a teammate still holds a Route, that is
		Label@B4_L4:
			X: 20
			Y: 353
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: the match. Units left in your own ring recover it three times faster.
		Label@FOOT_L1:
			X: 20
			Y: 378
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: Spent units can Evacuate, leaving by the nearest map edge to recover
		Label@FOOT_L2:
			X: 20
			Y: 395
			Width: PARENT_WIDTH - 40
			Height: 17
			Font: Regular
			Text: what is left of their cost. A unit that dies takes its budget with it.
