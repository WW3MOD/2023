Container@GAMESAVE_LOADING_SCREEN:
	Logic: GameSaveLoadingLogic
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Children:
		LogicKeyListener@CANCEL_HANDLER:
		ColorBlock@BACKDROP:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
			Color: 000000
		# Mirrors LogoStripeLoadScreen's CustomBar: a 160px dark grey band
		# centred vertically, hairline borders, "WW3MOD" centred inside it.
		ColorBlock@BAR:
			Y: WINDOW_HEIGHT / 2 - 80
			Width: WINDOW_WIDTH
			Height: 160
			Color: 232323
		ColorBlock@BAR_TOP:
			Y: WINDOW_HEIGHT / 2 - 80
			Width: WINDOW_WIDTH
			Height: 1
			Color: 3C3C3C
		ColorBlock@BAR_BOTTOM:
			Y: WINDOW_HEIGHT / 2 + 79
			Width: WINDOW_WIDTH
			Height: 1
			Color: 3C3C3C
		Label@BRAND:
			Width: WINDOW_WIDTH
			Y: WINDOW_HEIGHT / 2 - 80
			Height: 160
			Font: TitleLarge
			Align: Center
			VAlign: Middle
			Contrast: true
			Text: WW3MOD
		Label@TITLE:
			Width: WINDOW_WIDTH
			Y: 3 * WINDOW_HEIGHT / 4 - 29
			Height: 25
			Font: Bold
			Align: Center
			Text: Loading Saved Game
		ProgressBar@PROGRESS:
			X: (WINDOW_WIDTH - 500) / 2
			Y: 3 * WINDOW_HEIGHT / 4
			Width: 500
			Height: 20
			Background: observer-scrollpanel-button-pressed
			Bar: observer-scrollpanel-button
		Label@DESC:
			Width: WINDOW_WIDTH
			Y: 3 * WINDOW_HEIGHT / 4 + 19
			Height: 25
			Font: Regular
			Align: Center
			Text: Press Escape to cancel loading and return to the main menu
