Container@LOBBY_OPTIONS_BIN:
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		# === Phase 2 — Settings panel hero grid (4-wide).
		# Templates now expose 4 column slots (A, B, C, D) instead of 2.
		# LobbyOptionsLogic.cs auto-discovers any Checkbox/DropDownButton
		# children of the row template and fills them in order — so the
		# only thing needed for a 4-wide grid is matching child widgets
		# at the right X offsets. No C# change required.
		ScrollPanel@OPTIONS_PANEL:
			Logic: LobbyOptionsLogic
			Y: 0
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@CATEGORY_FILTER:
					Visible: False
					Text: Advanced
				Container@LOBBY_OPTIONS:
					Y: 5
					Width: PARENT_WIDTH - 24
					Children:
						# Section header — kept for now (used by Common-category
						# sections). Accent colour swapped to match the new palette
						# (HEADER_LABEL #B4B4B4, SEPARATOR bevel-dark #030303).
						Container@SECTION_HEADER_TEMPLATE:
							Width: PARENT_WIDTH
							Height: 36
							Visible: False
							Children:
								Button@TOGGLE:
									Width: PARENT_WIDTH
									Height: 36
									Background: ""
								Label@HEADER_LABEL:
									X: 10
									Y: 12
									Width: PARENT_WIDTH - 20
									Height: 20
									Font: TinyBold
									Align: Left
									TextColor: B4B4B4
								ColorBlock@SEPARATOR:
									X: 10
									Y: 33
									Width: PARENT_WIDTH - 20
									Height: 1
									Color: 030303FF
						# 4-wide checkbox row. Each Checkbox sits in its own
						# quarter-width column at PARENT_WIDTH * N / 4 + 6.
						Container@CHECKBOX_ROW_TEMPLATE:
							Width: PARENT_WIDTH
							Height: 32
							Children:
								Checkbox@A:
									X: 6
									Width: PARENT_WIDTH / 4 - 12
									Height: 22
									Visible: False
									TooltipContainer: TOOLTIP_CONTAINER
								Checkbox@B:
									X: PARENT_WIDTH / 4 + 6
									Width: PARENT_WIDTH / 4 - 12
									Height: 22
									Visible: False
									TooltipContainer: TOOLTIP_CONTAINER
								Checkbox@C:
									X: PARENT_WIDTH * 2 / 4 + 6
									Width: PARENT_WIDTH / 4 - 12
									Height: 22
									Visible: False
									TooltipContainer: TOOLTIP_CONTAINER
								Checkbox@D:
									X: PARENT_WIDTH * 3 / 4 + 6
									Width: PARENT_WIDTH / 4 - 12
									Height: 22
									Visible: False
									TooltipContainer: TOOLTIP_CONTAINER
						# 4-wide dropdown row. Each column has a LabelForInput
						# (resolved by LobbyOptionsLogic via "<id>_DESC" lookup)
						# above the DropDownButton.
						Container@DROPDOWN_ROW_TEMPLATE:
							Height: 58
							Width: PARENT_WIDTH
							Children:
								LabelForInput@A_DESC:
									X: 6
									Width: PARENT_WIDTH / 4 - 12
									Height: 18
									Visible: False
									For: A
								DropDownButton@A:
									X: 6
									Y: 22
									Width: PARENT_WIDTH / 4 - 12
									Height: 28
									Visible: False
									TooltipContainer: TOOLTIP_CONTAINER
								LabelForInput@B_DESC:
									X: PARENT_WIDTH / 4 + 6
									Width: PARENT_WIDTH / 4 - 12
									Height: 18
									Visible: False
									For: B
								DropDownButton@B:
									X: PARENT_WIDTH / 4 + 6
									Y: 22
									Width: PARENT_WIDTH / 4 - 12
									Height: 28
									Visible: False
									TooltipContainer: TOOLTIP_CONTAINER
								LabelForInput@C_DESC:
									X: PARENT_WIDTH * 2 / 4 + 6
									Width: PARENT_WIDTH / 4 - 12
									Height: 18
									Visible: False
									For: C
								DropDownButton@C:
									X: PARENT_WIDTH * 2 / 4 + 6
									Y: 22
									Width: PARENT_WIDTH / 4 - 12
									Height: 28
									Visible: False
									TooltipContainer: TOOLTIP_CONTAINER
								LabelForInput@D_DESC:
									X: PARENT_WIDTH * 3 / 4 + 6
									Width: PARENT_WIDTH / 4 - 12
									Height: 18
									Visible: False
									For: D
								DropDownButton@D:
									X: PARENT_WIDTH * 3 / 4 + 6
									Y: 22
									Width: PARENT_WIDTH / 4 - 12
									Height: 28
									Visible: False
									TooltipContainer: TOOLTIP_CONTAINER
