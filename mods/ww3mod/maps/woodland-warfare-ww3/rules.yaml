World:
	# ---- THE DEFCON 3 BORDER ON WOODLAND WARFARE -- THE CLIFF LINE ACROSS THE MIDDLE OF THE WOODS ----
	#
	# Positioning-phase only. DefconWall writes Map.CustomTerrain when the level reaches 3 and
	# restores it cell by cell when the level leaves ActiveLevels, so nothing here survives DEFCON 2
	# and no terrain is edited. Authoring either region field switches this map off the derived
	# bisector entirely -- neither Start/End nor DeriveFromSpawns is consulted
	# (DefconWallInfo.RegionTerrainTypes).
	#
	# RegionTerrainTypes IS DELIBERATELY EMPTY HERE, UNLIKE RIVER ZETA, and that is a judgement
	# about this map rather than a default. On River Zeta the Water type IS the divide: 588 cells,
	# one channel, nothing else on the map carries it. This map has 12 water cells in total; its barrier
	# is 908 cells of Cliffs in 34 massifs, and the ridges that matter are two diagonals nowhere near the
	# ends of any border. Naming a type would drag blobs nowhere
	# near the border into the band and wash a large part of the map in the trait's amber fill,
	# which is drawn over every border cell (DefconWall.RenderAnnotations). So the border is
	# authored cell by cell below.
	#
	# HOW THESE CELLS WERE CHOSEN, and they are data rather than a derivation -- redraw any of them.
	# A cell set separates the map in the 8-connected graph DefconWallRegion.Label floods if and
	# only if it contains a 4-CONNECTED chain of blocked cells running from one Bounds edge to
	# another. So the border is a shortest path: tools/nav-guard/defcon_border_designer.py runs
	# Dijkstra over Bounds with terrain a player already reads as a barrier priced near zero and
	# open ground priced ten times higher, which makes the route follow whatever the map actually
	# has and cross open ground only where the map leaves no choice. The chain is then dilated by
	# one cell, so the band is three cells thick everywhere except where Bounds clips it -- exactly
	# the thickness the shipped HalfWidth of 1024 produces, and above the sqrt(2)/2 floor below
	# which a diagonal band leaks through its own corners.
	#
	# THE BORDER FOLLOWS THE CLIFFS: 65 of 121 route cells are Cliffs and 12 more are Road, so more than
	# half of it is escarpment and most of the rest is the forest road net between them. It runs west to
	# east across the middle of the woods.
	#
	# THIS ALSO FIXES A KNOWN DEFECT IN THE DERIVED LINE. The bisector of the two spawns is a diagonal
	# that runs over neutral Oil Derricks, putting them inside the band and out of reach for the whole of
	# DEFCON 3. The router is handed every capturable's footprint plus a two-cell margin at a prohibitive
	# cost, so this border cannot do that, and the audit confirms none is inside the band.
	#
	# Verified statically, no launch: 363 band cells, all inside Bounds, engine load gate 2 components of
	# 4430 and 4423 -- the most even split of any map here. Spawn (1,4) north, (96,93) south, both exactly
	# 41 cells from the band. All 15 locomotors separate and none seals a cell. Capturables 6 north
	# against 5 south, none inside the band; the `bio` at (48,47) falls on the northern side.
	DefconWall:
		# THE 363 HAND-AUTHORED CELLS NOW LIVE IN map.yaml, as `Zones: DMZ` -- painted in
		# the editor's Zones tool rather than pasted in here, because the editor cannot write
		# rules.yaml. DefconWall reads that zone and UNIONS it with any RegionTerrainTypes above
		# (DefconWall.BuildRegion); everything this file says about which cells they are and why
		# still describes them exactly.
