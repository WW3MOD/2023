LOGISTICSCENTER:
	Inherits: ^Building
	OwnerLostAction:
		Action: ChangeOwner
		Owner: Neutral
	# REMOVED 2026-09-05 — GrantConditionOnPrerequisite@GLOBALFACTUNDEPLOY (Condition: mcv-undeploys,
	# Prerequisites: global-mcv-undeploys). Dead at both ends: nothing in mods/ or engine/ ever provided
	# global-mcv-undeploys, and nothing ever read mcv-undeploys. It was RA's construction-yard undeploy
	# switch, carried over and never wired. Undeploy is now REAL (Transforms + TransformsIntoMobile
	# below) and is not gated on a prerequisite, so leaving a dead knob with that name beside it would
	# read as the switch that turns the new thing off.
	Selectable:
		Bounds: 2048,2048
	# 2x2 SINCE 2026-09-05. Every number here is the 3x3 one times 2/3, which is also what
	# RenderSprites.Scale below does to the art, so the shape still covers the same pixels.
	# Rectangle ±1536 -> ±1024 and VerticalTopOffset 3072 -> 2048 (identical to ^2x2Shape; written out
	# rather than inherited only because this block already spelled the shape inline).
	# UseTargetableCellsOffsets is false by default (HitShape.cs:32) and stays false: the footprint is
	# ALL-PASSABLE (see Building below), so ITargetableCells is EMPTY for this actor and switching the
	# flag on would leave it with no targetable position at all.
	HitShape:
		TargetableOffsets: 849,626,0, -653,-427,0, -653,427,0
		Type: Rectangle
			VerticalTopOffset: 2048
			TopLeft: -1024, -1024
			BottomRight: 1024, 1024
	# PITFALL: A 2x2 BUILDING'S CENTRE IS A CELL CORNER, not a cell. BuildingInfo.CenterOffset
	# (Building.cs:207) averages the middle cells, so CenterPosition lands on the point where all four
	# footprint cells meet and NO ground unit can ever stand on it. Everything measured from the centre
	# is unaffected (the ranges below are all >= 2c0); what breaks is anything that sends a unit TO the
	# centre and then waits for it to get there. That is Activities/Resupply, and ResupplyDock below is
	# the answer — do not "fix" such a symptom by loosening an arrival tolerance.
	#
	# ONLY THE CRANE CELL IS STOPPABLE. The 3x3 was `=+= +++ =+=` — passable everywhere, with five
	# transit-only cells and four stoppable corners — so this is NOT the Centre becoming solid; it has
	# never blocked and still does not. `+` is OccupiedPassableTransitOnly, which units cross but may
	# not stop on (Locomotor.cs:373), and `=` is OccupiedPassable, which they may. Exactly one cell is
	# `=`: (0,1), the bottom-left, under the crane. So the depot cannot be used as a parking lot, the
	# dock stays clear for the vehicle actually being served, and "stop under the crane" is enforced
	# by the footprint rather than merely encouraged by the dock offset.
	# THE DOCK CELL CANNOT BE `+`: a client sent there could never stop and would be bounced off the
	# moment it arrived. Making the other three `x` would turn the Centre into a wall it has never been.
	Building:
		Footprint: ++ =+
		Dimensions: 2,2
	# THE CRANE IS THE DOCK. The art's crane sits at the bottom-left of the sprite, which after the 2x2
	# resize is footprint cell (0,1). Offset is measured from CenterPosition: the corner is at
	# TopLeft + (512,512), that cell's centre is at TopLeft + (0,1024), so the dock offset is
	# (-512, +512). Resupply drives clients onto CellContaining(centre + Offset) and tests arrival by
	# cell equality against the same point, so this single number places the vehicle under the crane
	# AND makes arrival satisfiable at an even-dimensioned host. RECOMPUTE IT if Dimensions change.
	ResupplyDock:
		Offset: -512,512,0
	Buildable:
		Queue: Building
		BuildPaletteOrder: 1000
		Prerequisites: ~disabled
		Description: Service depot that repairs damaged vehicles and restocks their ammunition.
	Tooltip:
		Name: Logistics Center
	# USER RULING 2026-08-22: "the LC should cost 3000". Held EQUAL to LCCV's cost, because the same
	# ruling says the driving and deployed forms are one thing — 3000 credits for 2250 supply is
	# exactly 3x the truck's 1000 for 750 on both axes.
	Valued:
		Cost: 3000
	# SALVAGE IS CAPPED AT THE LCCV'S COST, because this is the only building a player
	# can obtain. `Buildable.Prerequisites: ~disabled` above gates the BUILD SIDEBAR only —
	# Transforms.CanDeploy (Transforms.cs:93-99) never consults prerequisites, so LCCV
	# (vehicles.yaml, Cost 1200) deploys one regardless. Selling it at the full 3500 was a
	# money pump: 1200 in, 3500 out, repeatable.
	#
	# Now vastly inside the cap: 34% of 3000 = 1020 returned against the 3000 it costs to field one,
	# where the constraint is RefundPercent <= 100 * 3000/3000 = 100. It was originally set from
	# 34% of 3500 = 1190 against an LCCV costing 1200. Deliberately
	# RefundPercent and NOT CustomSellValue: CustomSellValue would also lower GetSellValue,
	# which bots rank capture targets by (CaptureManagerBotModule.cs:147) — and this building
	# IS capturable via ^BasicBuilding -> ^NeutralOrOccupiedCapturable (:10, :149-157). Its
	# strategic worth is still 3500; only its scrap value changed.
	# RECOMPUTE THIS if either Cost changes: RefundPercent <= 100 * LCCV.Cost / this Cost.
	Sellable:
		RefundPercent: 34
	# The other half of the same payout. SpawnActorsOnSell hands out actors worth
	# ValuePercent of the sell value (SpawnActorsOnSell.cs:64-69) — at 40% of 3500 that is
	# five 250-credit technicians, 1250 credits of free infantry that can themselves be
	# evacuated for cash. It reads Valued.Cost directly, so RefundPercent above does not
	# reach it and it has to be zeroed separately.
	SpawnActorsOnSell:
		ValuePercent: 0
	Health:
		HP: 60000
	Armor:
		Type: Concrete
	RepairsUnits:
		StartRepairingNotification: Repairing
		FinishRepairingNotification: UnitRepaired
		PauseOnCondition: disabled || build-incomplete
		RequiresCondition: !build-incomplete && !disabled
	# REMOVED 2026-08-27 — ProximityExternalCondition@ReplenishSoldiers (Condition: replenish-soldiers,
	# Range: 4c0, ValidRelationships: Ally). It carried NO supply term, and the condition it granted
	# enables each soldier's own ReloadAmmoPool, a timed trickle with no range check and no accounting.
	# So any infantry standing within four cells refilled for nothing, at a Centre holding nothing.
	# MEASURED in test-who-pays-for-a-rearm: a rifleman three cells from a Centre held at ZERO gained
	# 14 rounds in 700 ticks — one every 50, exactly ReloadAmmoPool's default Delay — with the depot
	# reading 0 at all 28 samples. Deleting this line held him at 0 for the whole run.
	#
	# Nothing is lost at a STOCKED Centre: SupplyProvider grants the same condition itself to the
	# client it is serving (SupplyProvider.cs SyncTargetCondition), and its AuraRearmCondition arm
	# below is that grant, metered. The difference is that the metered arm serves ONE client at a time
	# on a cadence and charges for it, where this granted the condition to everyone in range for free.
	# This is the user's ruling — "all supply always costs, nothing is free ever" — at its one site:
	# grep confirms replenish-soldiers was granted bare NOWHERE else in the mod.
	SupplyProvider:
		# 2250 = 3x the supply truck's 750, and IDENTICAL to LCCV's while undeployed. USER RULING
		# 2026-08-22: "There is no difference between when it is driving or when it is deployed, it
		# carries the supplies it carries." This is a REDUCTION from the previous 3000 and is
		# deliberate, not a typo. ITransformActorInitModifier carries the MCV's remainder across the
		# deploy, so a half-spent MCV deploys into a half-spent Centre.
		TotalSupply: 2250
		# Tracks TotalSupply, not Cost: this is "credit value of a full load" and the mod prices supply
		# 1:1 (TRUK is 750/750, vehicles.yaml). Its old equality with Cost 3500 was never intentional —
		# it equalled the old TotalSupply of 3000 and the cost was 3500.
		SupplyCreditValue: 2250
		# 2c0 matches ProximityExternalCondition@UNITDOCKED below: clients must be
		# physically docked at the LC to receive resupply (see Phase 1 of supply spec).
		Range: 2c0
		RearmDelay: 25
		# DORMANT SINCE 2026-08-30, AND KEPT ON PURPOSE. himars and iskander were the only two actors
		# in the mod declaring `replenish-vehicles`, and the strategic-launcher ruling removed it from
		# both — so this push arm now has NO possible client in the shipped game. It is retained rather
		# than deleted because it is the only metered vehicle-delivery model in the engine, it is the
		# half of SupplyProvider that carries UpdateSupplyConditions (and through it SupplyLevelCondition
		# and this building's eight Explodes@Band traits), and Rearmable.RearmTick still defers to it via
		# CanSelect for any client it CAN select. Deleting it would make that deferral dead code and
		# force a reimplementation the moment any future actor wants metered push delivery.
		# TO RE-ARM IT, one line: add `ExternalCondition@VehicleReplenish: Condition: replenish-vehicles`
		# to the recipient. test-who-pays-for-a-rearm does exactly that in its scenario-local rules.yaml
		# so the docked double-serve regression stays measurable now that no shipped actor reaches it.
		RearmCondition: replenish-vehicles
		DockedCondition: unit.docked
		# THE SECOND CLIENTELE: infantry, drawn from the SAME 3000 as the docked vehicles above, so
		# there is one pool and one supplies bar. This is why the aura arm exists at all rather than
		# `RearmCondition: replenish-vehicles, replenish-soldiers` — PITFALL: DockedCondition is
		# checked BEFORE RearmCondition (SupplyProvider.IsValidTarget), and only ^Vehicle declares
		# unit.docked (vehicles.yaml:29), so a widened condition list would have been rejected by the
		# dock gate before it was ever read. 4c0 and the 6-tick cadence deliberately match
		# the removed ProximityExternalCondition above and the supply truck respectively.
		#
		# COST, so the drain rate is legible: a batch is ReloadCount rounds for SupplyValue supply.
		# COUNT EVERY POOL IN Rearmable.AmmoPools, not just the one whose name you recognise. This
		# comment once read "an E3 rifleman is Ammo 100 / ReloadCount 20 / SupplyValue 1, i.e. 5
		# supply for a full refill — so 2250 buys ~450 rifleman refills against the truck's ~150",
		# and it was wrong by 11x: it counted the DMR and ignored the RPG (AmmoPool@2), which IS
		# listed in his Rearmable.AmmoPools and so IS refilled by this aura. Corrected 2026-08-27,
		# then INDEPENDENTLY CORRECTED AGAIN by the 2026-08-30 economy audit — two agents found the
		# same error a day apart, which is why this note is longer than the arithmetic deserves.
		#
		# CURRENT FIGURES, after the 2026-08-30 REPRICING (user ruling: "bullets are cheaper than AT
		# weapons"): primary-ammo is Ammo 100 / ReloadCount 20 / SupplyValue 2 = 5 batches = 10
		# supply; secondary-ammo is his RPG at Ammo 1 / SupplyValue 30 = one 30-supply batch. A full
		# E3 refill is 40 supply. 2250 buys ~56 of them; the truck's 750 buys ~18. Still six delivery
		# cycles at AuraRearmDelay 6 — ~2.2s per soldier — so a full Centre is ~2 minutes of
		# continuous infantry service, not the quarter-hour the original figure implied.
		# (It was 55 supply, ~41 per Centre and ~90 seconds between 2026-08-27 and the repricing.)
		#
		# SIZING ARGUMENTS THAT CITE 450 ARE REASONING FROM THE ORIGINAL ERROR — and 2250 is one of
		# them. The capacity was chosen against the wrong number and has NOT been re-decided since,
		# through either correction or the repricing.
		# The error was harmless while infantry rearmed for free. It is not harmless now.
		AuraRearmCondition: replenish-soldiers
		AuraRange: 4c0
		AuraRearmDelay: 6
		SupplyLevelCondition: supply-level
		SupplyLevelSteps: 8
	# Stacks with the BuildingExplode inherited from ^BasicBuilding rather than replacing it, and
	# that is intended: BuildingExplode carries no damage warhead at all (weapons-explosions.yaml
	# :210-215 is CreateEffect + LeaveSmudge only), so the rubble visual and the cargo detonation
	# together are still ONE damage event. Contrast grad/m270 below, where the cookoff does damage
	# and therefore had to be gated off.
	Explodes@Band1:
		RequiresCondition: supply-level == 1
		Weapon: VolatileLoad1
	Explodes@Band2:
		RequiresCondition: supply-level == 2
		Weapon: VolatileLoad2
	Explodes@Band3:
		RequiresCondition: supply-level == 3
		Weapon: VolatileLoad3
	Explodes@Band4:
		RequiresCondition: supply-level == 4
		Weapon: VolatileLoad4
	Explodes@Band5:
		RequiresCondition: supply-level == 5
		Weapon: VolatileLoad5
	Explodes@Band6:
		RequiresCondition: supply-level == 6
		Weapon: VolatileLoad6
	Explodes@Band7:
		RequiresCondition: supply-level == 7
		Weapon: VolatileLoad7
	Explodes@Band8:
		RequiresCondition: supply-level == 8
		Weapon: VolatileLoad8
	AbsorbsSupplyCache:
		Range: 2c512
		TransferRate: 50
	# THE CRANE ANIMATION. `crane` aliases the fact.shp frames 1-25 that RA used for the construction
	# yard's crane arm (sequences-structures.yaml), so the arm swings for as long as a vehicle is being
	# repaired or rearmed and the body returns to `idle` when it stops. Driven by INotifyResupply, which
	# Activities/Resupply raises on the HOST — so it fires for every path a vehicle takes to be served
	# here (the player's Repair order, AmmoPool.AutoRearm's dock branch, LayMines) and does NOT fire for
	# the infantry aura, which is not a Resupply and parks nobody at the crane.
	# RequiresCondition matches HPAD's: without it the resupply animation and WithMakeAnimation would
	# both be driving the same WithSpriteBody during a deploy or undeploy.
	WithResupplyAnimation:
		Sequence: crane
		RequiresCondition: !build-incomplete
	# UNDEPLOY, added 2026-09-05. Offset 1,1 is the exact inverse of LCCV's Transforms.Offset (-1,-1),
	# so deploy-then-undeploy puts the truck back on the cell it started from: the LC's Location is its
	# TOP-LEFT, the truck deployed from TopLeft + (1,1), and Transform spawns at self.Location + Offset
	# (Transform.cs:121). That cell is the bottom-RIGHT of the footprint and deliberately NOT the dock
	# cell (0,1) — a vehicle parked under the crane would otherwise be sitting where the truck respawns.
	# Health carries as a percentage (Transform.cs:135-142) and remaining supply carries through
	# SupplyProvider's ITransformActorInitModifier (SupplyProvider.cs:376), the same hop that carries it
	# on the way in.
	# AcceptsDeployOrder: false IS A SAFETY GATE, not tidiness, and it was missed in the first cut.
	# Transforms publishes DeployOrderTargeter("DeployTransform", 5), whose CanTarget is
	# `self == target.Actor` with NO force modifier (Orders/DeployOrderTargeter.cs:41). Priority 5
	# outranks TransformsIntoMobile's 4 and RallyPoint's 0, so UnitOrderGenerator.OrderForUnit takes
	# it FIRST: an ordinary right-click on the Centre itself — which used to set the rally point —
	# would dismantle a 3000-credit building. The same string is also built by hand by
	# McvManagerBotModule (:175) and LogisticsCenterBotModule (:803, :811), which would have gone
	# straight past the UndeployMove gate below.
	# Off, this removes the targeter, the command-bar Deploy button and hand-built order acceptance
	# together, leaving Ctrl+click on GROUND as the one and only way to undeploy a Centre.
	Transforms:
		IntoActor: lccv
		Offset: 1,1
		Facing: 384
		AcceptsDeployOrder: false
		TransformSounds: placbldg.aud, build5.aud
		PauseOnCondition: disabled || build-incomplete || being-captured || being-demolished
	# Force-move (Ctrl+click) on GROUND is the undeploy gesture. A plain click on ground still sets
	# the rally point: RallyPoint's targeter is OrderPriority 0 and this one is 4, so this one is
	# asked first and RequiresForceMove makes it decline without Ctrl (UnitOrderGenerator.OrderForUnit).
	# CORRECTED 2026-09-05: these two are NOT the only targeters in the contest. Transforms publishes
	# a THIRD at priority 5 which outranks both and needs no modifier — see AcceptsDeployOrder above,
	# which is what stops a plain right-click on the building itself from winning it.
	# OrderName IS THE SAFETY GATE and is not cosmetic. RequiresForceMove gates the targeter only;
	# ResolveOrder would act on ANY "Move" order reaching this actor, and bot modules build
	# new Order("Move", actor, ...) by hand at 21 sites. None of them can name a building today —
	# LogisticsCenterBotModule.McvActorTypes is {"lccv"} (:64) and McvManagerBotModule.McvTypes is
	# empty and unset in mods/ — but that is a fact about today's callers. "UndeployMove" is a fact
	# about the string, so no bot can undeploy a Centre by accident however the modules change.
	TransformsIntoMobile:
		RequiresForceMove: true
		Locomotor: heavywheeled
		OrderName: UndeployMove
	RallyPoint:
	ProximityExternalCondition@UNITDOCKED:
		Condition: unit.docked
		Range: 2c0
		RequiresCondition: !build-incomplete && !disabled
		ValidRelationships: Ally
	# WithBuildingBib:
	WithDeathAnimation:
		DeathSequence: dead
		UseDeathTypeSuffix: false
	SpawnActorOnDeath:
		Actor: fact.husk
	GpsDot:
		String: Repair
	# 0.6667 = 2/3. fact.shp is 72x72 px = three 24 px cells wide (mod.yaml TileSize 24,24), so at 1.0
	# a 2x2 building would overhang its footprint by a full cell and the crane's tile would not land on
	# the dock cell. Scaled sprites are established practice here — LCCV ships Scale: 0.8. The
	# alternative is Scale 1.0 with deliberate overhang; it keeps the art crisper but divorces the
	# drawn crane from the cell vehicles actually park on.
	RenderSprites:
		Image: FACT
		Scale: 0.6667

