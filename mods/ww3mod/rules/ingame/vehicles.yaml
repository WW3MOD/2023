TRUK:
	Inherits@Type: ^WheeledVehicle
	Inherits@Selection: ^SelectableSupportUnit
	Inherits@AutoTarget: ^AutoTarget
	AutoTarget:
		InitialResupplyBehavior: Evacuate
		InitialResupplyBehaviorAI: Evacuate
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 103
		Prerequisites: ~techlevel.low
		Description: Dedicated supply truck.\n\n - Passively resupplies nearby units\n - Can drop supplies as a ground cache\n - Unarmed\n - Armor: None
	Valued:
		Cost: 1000
	Tooltip:
		Name: Supply Truck
	AnnounceOnSeen:
		Type: SupportVehicle
		TextNotification: Spotted: Supply truck
	ActorLostNotification:
		TextNotification: Lost: Supply Truck
	Armor:
		Type: Unarmored
	Targetable:
		TargetTypes: Ground, Vehicle, Unarmored
		RequiresCondition: !parachute
	Mobile:
		Locomotor: wheeled
		Speed: 75
		Acceleration: 7, 6, 5, 4, 3, 2, 1
		# HALT-TO-SERVE. supply-serving is granted by SupplyProvider whenever somebody in the aura
		# could be handed a batch right now, so the truck stops for its customers instead of driving
		# past them, and resumes the order it already had the moment the last of them is topped up.
		# Pausing Mobile is what makes "and then continue moving" free: Move.Tick returns false while
		# paused (Move.cs:168) and leaves the activity standing, so nothing has to be re-issued.
		#
		# The empdisable/being-captured terms are NOT decoration -- they are ^Vehicle's own value
		# (vehicles.yaml:38) restated. PauseOnCondition is a single field, so naming it here REPLACES
		# the inherited expression rather than adding to it, and dropping the two terms would let an
		# EMP'd or mid-capture truck drive away.
		PauseOnCondition: !(!empdisable && !being-captured) || supply-serving
	Carryable:
		LocalOffset: 0,0,100
	SupplyProvider:
		TotalSupply: 750
		Range: 5c0
		RearmDelay: 6
		RearmCondition: replenish-soldiers
		SupplyCreditValue: 750
		# Switched off per-truck with the HoldPosition engagement stance, the one value on a live
		# stance axis that no truck-side code reads. See SupplyProvider.ShouldHaltToServe for why
		# neither ResupplyBehavior (all three values already live on TRUK) nor UnitStance (present
		# but meaningless on an unarmed actor) could carry this.
		ServingCondition: supply-serving
		RestockActors: logisticscenter
		RestockThreshold: 50
		EvacuateOnUnusableResidue: true
		# Stated explicitly (matches the engine default) because it is the only thing standing
		# between a 7-tick residue re-decision and a per-tick RotateToEdge: DropsSupplyCache
		# re-checks CountsAsEmpty EVERY tick and sells the truck the moment it reads true, so an
		# undamped latch turned one bad scan into a drive off the map. 5 scans x SupplyProvider's
		# 7-tick ScanInterval = 35 ticks; mod.yaml DefaultSpeed 'default' is Timestep 60ms
		# (16.667 ticks/s), so 35 x 0.06 = 2.1s of agreement before a truck is written off. A
		# soldier crossing the aura edge, or a single volley, no longer costs a truck. Clearing
		# stays instant, so a truck that CAN serve never waits. 0/1 restores the undamped
		# behaviour. NOTE the whole point is the ALTERNATING case: a verdict flipping every scan
		# runs the counter 1,0,1,0 and never latches at all.
		ResidueConfirmScans: 5
		# Volatile cargo: one stacked condition per eighth of the load, so the Explodes@Band traits
		# below can select a blast strength with a plain count comparison.
		SupplyLevelCondition: supply-level
		SupplyLevelSteps: 8
	# A truck detonates in proportion to what it was carrying. An EMPTY truck still has no Explodes
	# at all, which is the pre-existing behaviour — band 0 is deliberately silent.
	Explodes@Band1:
		RequiresCondition: supply-level == 1
		Weapon: VolatileLoad1
	Explodes@Band2:
		RequiresCondition: supply-level == 2
		Weapon: VolatileLoad2
	Explodes@Band3:
		RequiresCondition: supply-level == 3
		Weapon: VolatileLoad3
	Explodes@Band4:
		RequiresCondition: supply-level == 4
		Weapon: VolatileLoad4
	Explodes@Band5:
		RequiresCondition: supply-level == 5
		Weapon: VolatileLoad5
	Explodes@Band6:
		RequiresCondition: supply-level == 6
		Weapon: VolatileLoad6
	Explodes@Band7:
		RequiresCondition: supply-level == 7
		Weapon: VolatileLoad7
	Explodes@Band8:
		RequiresCondition: supply-level == 8
		Weapon: VolatileLoad8
	DropsSupplyCache:
		SupplyCacheActor: supplycache
	Repairable:
		RepairActors: logisticscenter
	RenderRangeCircle@Supply:
		FallbackRange: 5c0
		RangeCircleType: supply
		Color: C0C0C0
		Width: 1.5
		RequireShift: false
	SpawnActorOnDeath:
		Actor: TRUK.husk

LCCV:
	Inherits@Type: ^WheeledVehicle
	Inherits@Selection: ^SelectableSupportUnit
	-WithDecoration@AmmoNone:
	-WithDecoration@AmmoPrimaryNone:
	-WithDecoration@AmmoSecondaryNone:
	-AttackMove:
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 150
		Prerequisites: ~techlevel.low
		Description: Deploys into a Logistics Center for field resupply of vehicles and infantry.\n\n - Unarmed\n - Armor: None
	# USER RULING 2026-08-22: "the LC should cost 3000". Raised from 1200 and held equal to
	# LOGISTICSCENTER's Cost, since the same ruling treats the driving and deployed forms as one thing.
	# 3000 credits for 2250 supply is exactly 3x the supply truck's 1000 for 750 on both axes.
	Valued:
		Cost: 3000
	Tooltip:
		Name: Logistics Center MCV
	Selectable:
		DecorationBounds: 1792,1792
	Armor:
		Type: Light
	Targetable:
		TargetTypes: Ground, Vehicle, Light
	Mobile:
		Speed: 71
		Locomotor: heavywheeled
	# Field resupply while still mobile, on the supply truck's terms: same 5c0 aura, same 6-tick
	# cadence, same replenish-soldiers clientele. No DockedCondition — a dock gate here would reject
	# every soldier, since only ^Vehicle declares unit.docked (:29). SupplyProvider implements
	# ISelectionBar, so this is also what gives the undeployed MCV its supplies bar.
	#
	# TotalSupply is 2250 — 3x the truck's 750 — and IDENTICAL to LOGISTICSCENTER's. USER RULING
	# 2026-08-22: "There is no difference between when it is driving or when it is deployed, it carries
	# the supplies it carries." One capacity across both forms is what makes that true, and it is why
	# there is no top-up-on-deploy anywhere: ITransformActorInitModifier already carries the remainder
	# across, so a half-spent MCV deploys into a half-spent Centre and the bar does not jump.
	#
	# THREE TRUCK FEATURES DELIBERATELY NOT COPIED, each of which would be a second, unmeasured
	# behavioural change: ServingCondition (halt-to-serve would stop an MCV mid-drive to the spot the
	# player picked to deploy it), RestockActors (its restock host is the building it turns into), and
	# SupplyCreditValue (the LCCV/LOGISTICSCENTER sell economics are load-bearing and commented at
	# structures.yaml:377-390 — leaving it 0 keeps remaining supply out of the refund maths).
	SupplyProvider:
		TotalSupply: 2250
		Range: 5c0
		RearmDelay: 6
		RearmCondition: replenish-soldiers
	Transforms:
		IntoActor: logisticscenter
		Offset: -1,-1
		Facing: 384
		TransformSounds: placbldg.aud, build5.aud
		NoTransformNotification: BuildingCannotPlaceAudio
		PauseOnCondition: empdisable
	MustBeDestroyed:
		RequiredForShortGame: true
	SpawnActorOnDeath:
		Actor: MCV.Husk
	Passenger:
		Weight: 30
		CustomPipType: pip-blue
	GpsDot:
		String: MCV
	RenderSprites:
		Image: mcv
		Scale: 0.8

