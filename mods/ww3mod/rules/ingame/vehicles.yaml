^EffectsWhenDamagedVehicles:
	SpeedMultiplier@HeavyDamage:
		Modifier: 50
		RequiresCondition: heavy-damage-attained
	ChangesHealth@CriticalDamage:
		PercentageStep: -1
		Delay: 5
		StartIfBelow: 50
		# DamageTypes: BurnoutOutDeath
	Targetable@CriticalDamage:
		RequiresCondition: !parachute
		TargetTypes: CriticalDamage
	WithSequentialAnimation@CriticalDamage:
		RequiresCondition: critical-damage
		Image: smoke_mtd
		Palette: temptd
	# Staged burning — the V1 ramp picked from test-burn-compare on 260509.
	# StartFraction=50, EndFraction=0 means smoke ignites the moment HP drops
	# below 50% and stack 10 (full inferno) only locks in at HP=0. Slowest
	# possible visible ramp; the bleed-out itself is what advances stages.
	#
	# Stage map (stack count → visible overlay):
	#   1-2  → smoke_mtd (proper start→loop animation, smaller-feel smoke)
	#   3-4  → infantry-burn-1 (smouldering)
	#   5-6  → infantry-burn-3 (skip burn-2 — burn-3 reads as a clearer
	#          step up; burn-2 is too similar to burn-1)
	#   7-8  → infantry-burn-4 (big fire)
	#   ≥7   → infantry-burn-5 LAYERED on top for stages 7+, so the burn-5
	#          sprite ramps in over multiple stages instead of popping at 9
	#   9-10 → infantry-burn-5 (its own tier so the layered + tier overlap
	#          adds visual density at max stacks)
	#   ≥9   → husk-style big fire (Image: fire, Sequence: 1) for the
	#          inferno stage. Reserved for the final stages so the
	#          burn-5 ↔ big-fire transition isn't an abrupt pop.
	ExternalCondition@OnFire:
		Condition: onfire
		TotalCap: 10
	GrantStackingConditionOnHealthFraction@OnFire:
		Condition: onfire
		StartFraction: 50
		EndFraction: 0
		MaxStacks: 10
		Interval: 15
	WithIdleOverlay@Burn_1:
		RequiresCondition: onfire == 1 || onfire == 2
		Image: smoke_mtd
		StartSequence: start
		Sequence: loop
		Palette: temptd
		IsDecoration: true
	WithIdleOverlay@Burn_2:
		RequiresCondition: onfire == 3 || onfire == 4
		Image: infantry-burn-1
		StartSequence: start
		Sequence: loop
		Palette: effect
		IsDecoration: true
	WithIdleOverlay@Burn_3:
		RequiresCondition: onfire == 5 || onfire == 6
		Image: infantry-burn-3
		StartSequence: start
		Sequence: loop
		Palette: effect
		IsDecoration: true
	WithIdleOverlay@Burn_4:
		RequiresCondition: onfire == 7 || onfire == 8
		Image: infantry-burn-4
		StartSequence: start
		Sequence: loop
		Palette: effect
		IsDecoration: true
	WithIdleOverlay@Burn_4Layer:
		RequiresCondition: onfire >= 7
		Image: infantry-burn-5
		StartSequence: start
		Sequence: loop
		Palette: effect
		IsDecoration: true
	WithIdleOverlay@Burn_5:
		RequiresCondition: onfire == 9 || onfire == 10
		Image: infantry-burn-5
		StartSequence: start
		Sequence: loop
		Palette: effect
		IsDecoration: true
	WithIdleOverlay@Inferno:
		RequiresCondition: onfire >= 9
		Image: fire
		Sequence: 1
		IsDecoration: true
	SpeedMultiplier@CriticalDamage:
		Modifier: 0
		RequiresCondition: critical-damage
	# Turret freeze fires a whole damage state EARLIER than the speed cut above,
	# and that asymmetry is deliberate. A vehicle is doomed the moment it drops
	# below 50% HP: ChangesHealth@CriticalDamage (StartIfBelow: 50) bleeds it out
	# from there with no way back, the fire ramp ignites at StartFraction: 50, and
	# VehicleCrew bails the crew at EjectionDamageState: Heavy. A burning hulk
	# whose crew is climbing out must not still be traversing and shooting, so the
	# weapon systems die at the same 50% line the doom does. Rolling to a stop is
	# the one thing that stays on `critical-damage` (25%) — a hit vehicle coasting
	# to a halt reads correctly, a turret tracking you from a fireball does not.
	#
	# Modifier: 0 is a hard lock, not a slow: Turreted.MoveTurret feeds the
	# modified speed to Util.TickFacing, which returns the current facing
	# unchanged when the step is zero, and Turreted.FaceTarget short-circuits on
	# `turretTurnSpeedModifiers.Any(v => v == 0)` so the turret also refuses to
	# acquire. That covers firing for turreted vehicles; turretless ones (giatsint,
	# iskander) are covered by `heavy-damage-attained` in their Armament
	# PauseOnCondition. No BurstWaitMultiplier is needed at either tier.
	TurretTurnSpeedMultiplier@CriticalDamage:
		Modifier: 0
		RequiresCondition: heavy-damage-attained

# Crew-condition-driven vehicle disability — used by vehicles with VehicleCrew trait
# Replaces blanket SpeedMultiplier@CriticalDamage / TurretTurnSpeedMultiplier@CriticalDamage
# Use ^CrewedVehicle2 for Driver+Gunner, ^CrewedVehicle3 for Driver+Gunner+Commander
^CrewedVehicle2:
	# No driver = can't move
	SpeedMultiplier@NoDriver:
		Modifier: 0
		RequiresCondition: !has-driver
	# No gunner = turret frozen
	TurretTurnSpeedMultiplier@NoGunner:
		Modifier: 0
		RequiresCondition: !has-gunner
	# Death cookoff — punishes crew that didn't clear the husk cell in time.
	# Single-tile damage radius (0c512) so adjacent units take nothing.
	Explodes@CrewCookoff:
		Weapon: VehicleCookoff
		EmptyWeapon: VehicleCookoff
		Chance: 100

^CrewedVehicle3:
	# No driver AND no commander = can't move at all
	SpeedMultiplier@NoDriver:
		Modifier: 0
		RequiresCondition: !has-driver && !has-commander
	# Driver gone but commander present = crawl at 40% speed
	SpeedMultiplier@CommanderDrives:
		Modifier: 40
		RequiresCondition: !has-driver && has-commander
	# No gunner AND no commander = turret frozen
	TurretTurnSpeedMultiplier@NoGunner:
		Modifier: 0
		RequiresCondition: !has-gunner && !has-commander
	# Gunner gone but commander present = 50% turret speed
	TurretTurnSpeedMultiplier@CommanderGuns:
		Modifier: 50
		RequiresCondition: !has-gunner && has-commander
	# Commander gunning = worse accuracy
	InaccuracyMultiplier@CommanderGuns:
		Modifier: 200
		RequiresCondition: !has-gunner && has-commander
	# No commander = reduced accuracy (commander normally provides oversight)
	InaccuracyMultiplier@NoCommander:
		Modifier: 150
		RequiresCondition: !has-commander
	# Death cookoff — same rationale as ^CrewedVehicle2 above.
	Explodes@CrewCookoff:
		Weapon: VehicleCookoff
		EmptyWeapon: VehicleCookoff
		Chance: 100

^EffectsWhenMovingVehicles:
	InaccuracyMultiplier@Moving:
		RequiresCondition: moving
		Modifier: 150

# Vehicle suppression — crew is buttoned up, turret slows, accuracy degrades
# No speed reduction (armored vehicles keep moving), milder effects than infantry
^VehicleSuppressionEffects:
	ExternalCondition@VehicleSuppression:
		Condition: suppressed
		TotalCap: 50
		ReduceTicks: 3
		ReduceAmount: 1
	Inherits@VehSuppressionPips: ^SuppressionPips
	# Turret slows as crew buttons up (5 tiers, 50 cap)
	TurretTurnSpeedMultiplier@Suppression_1:
		RequiresCondition: suppressed > 0 && suppressed <= 10
		Modifier: 85
	TurretTurnSpeedMultiplier@Suppression_2:
		RequiresCondition: suppressed > 10 && suppressed <= 20
		Modifier: 70
	TurretTurnSpeedMultiplier@Suppression_3:
		RequiresCondition: suppressed > 20 && suppressed <= 30
		Modifier: 55
	TurretTurnSpeedMultiplier@Suppression_4:
		RequiresCondition: suppressed > 30 && suppressed <= 40
		Modifier: 40
	TurretTurnSpeedMultiplier@Suppression_5:
		RequiresCondition: suppressed > 40 && suppressed <= 50
		Modifier: 25
	# Accuracy degrades as crew is rattled
	InaccuracyMultiplier@Suppression_1:
		RequiresCondition: suppressed > 0 && suppressed <= 10
		Modifier: 115
	InaccuracyMultiplier@Suppression_2:
		RequiresCondition: suppressed > 10 && suppressed <= 20
		Modifier: 130
	InaccuracyMultiplier@Suppression_3:
		RequiresCondition: suppressed > 20 && suppressed <= 30
		Modifier: 150
	InaccuracyMultiplier@Suppression_4:
		RequiresCondition: suppressed > 30 && suppressed <= 40
		Modifier: 175
	InaccuracyMultiplier@Suppression_5:
		RequiresCondition: suppressed > 40 && suppressed <= 50
		Modifier: 200
	# Burst rate slows slightly
	BurstWaitMultiplier@Suppression_1:
		RequiresCondition: suppressed > 0 && suppressed <= 10
		Modifier: 105
	BurstWaitMultiplier@Suppression_2:
		RequiresCondition: suppressed > 10 && suppressed <= 20
		Modifier: 110
	BurstWaitMultiplier@Suppression_3:
		RequiresCondition: suppressed > 20 && suppressed <= 30
		Modifier: 120
	BurstWaitMultiplier@Suppression_4:
		RequiresCondition: suppressed > 30 && suppressed <= 40
		Modifier: 130
	BurstWaitMultiplier@Suppression_5:
		RequiresCondition: suppressed > 40 && suppressed <= 50
		Modifier: 150

