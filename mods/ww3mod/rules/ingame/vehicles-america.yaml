abrams:
	Inherits@Combatant: ^Combatant
	Inherits@Type: ^TrackedVehicle
	Inherits@Crew: ^CrewedVehicle3
	Inherits@GainsExperience: ^GainsExperience
	Inherits@AutoTarget: ^AutoTargetMBT
	VehicleCrew:
		CrewSlots: Driver, Gunner, Commander
		CrewActors:
			Driver: crew.driver.america
			Gunner: crew.gunner.america
			Commander: crew.commander.america
		SlotConditions:
			Driver: has-driver
			Gunner: has-gunner
			Commander: has-commander
		EjectionOrder: Commander, Gunner, Driver
		EjectionDelay: 30
		EjectionDelayVariance: 15
		# Modern Western MBT — blow-out panels, ammo separation, best crew survivability.
		CrewDamageThresholdPercent: 38
	Tooltip:
		Name: Abrams M1A2
		GenericName: Abrams
	AnnounceOnSeen:
		Type: Vehicle
		TextNotification: Spotted: Abrams
	ActorLostNotification:
		TextNotification: Lost: Abrams
	RenderSprites:
		Image: abrams
		Scale: 1.25
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 4
		Prerequisites: ~player.america, ~vehicles.america, ~techlevel.medium
		Description: Main battle tank for armored ground warfare.
	Valued:
		Cost: 2500
	Health:
		HP: 28000
	Armor:
		Type: Heavy
		Thickness: 700
		Distribution: 100,40,15,10,10
	HitShape:
		Type: Rectangle
			VerticalTopOffset: 480
			TopLeft: -365, -790
			BottomRight: 365, 790
	Targetable:
		TargetTypes: Ground, Vehicle, Heavy
	# JamsMissiles:
	# 	ActiveProtection: true
	# 	Range: 2c0
	Mobile:
		Locomotor: heavytracked
		Speed: 90
		Acceleration: 3, 2, 1
		TurnSpeed: 13
		PauseOnCondition: empdisable
	Turreted:
		TurnSpeed: 20
		Offset: 0,0,80
	Armament@1:
		Name: primary
		Weapon: TankRound.Abrams
		# MovementInaccuracy: 50
		# FireDelay: 15
		Recoil: 30
		RecoilRecovery: 30
		LocalOffset: 1200,0,80
		MuzzleSequence: muzzle
		PauseOnCondition: !ammo-primary || empdisable || heavy-damage-attained
	AmmoPool@1:
		Name: primary-ammo
		Essential: true
		Armaments: primary
		Ammo: 40
		ReloadCount: 5
		AmmoCondition: ammo-primary
		RearmSound: minelay1.aud
		# 120mm M829-series APFSDS. 80 supply buys one 5-shell batch, so a full 40-round
		# load is 8 batches at 80 = 640 (25.6% of cost 2500, 28% of a Logistics Centre).
		#
		# DEARER PER SHELL THAN THE T-90's 70, and the reason is the penetrator: the M829
		# family uses a DEPLETED-URANIUM long rod, the expensive way to build this round.
		# The T-90's 3BM series uses a tungsten-alloy rod in a two-piece separate-loading
		# charge, cheaper to manufacture. That is the whole of the 80/70 split — a
		# materials-and-manufacture difference, not a performance claim. No damage,
		# penetration or Ammo count is touched by it. Autoloader-vs-human-loader and
		# carousel-vs-bustle are the other real T-90/Abrams differences, but they govern
		# rate of fire and survivability rather than what a shell costs, so neither is
		# priced here.
		SupplyValue: 80
	WithAmmoPipsDecoration@1:
		Position: Bottom
		Margin: 9, 3
		PipCount: 6
		RequiresSelection: true
		FullSequence: pip-red
		AmmoPools: primary-ammo
	RenderRangeCircle@1:
		Armament: primary
		RangeCircleType: explosive
		Color: FF0000
		Width: 3
	Rearmable:
