		PauseOnCondition: empdisable || unit.docked
	WithSpriteTurret:
	WithMuzzleOverlay:
	Selectable:
		Class: MBT
	SpawnActorOnDeath:
		Actor: abrams.husk

m109:
	Inherits@Combatant: ^Combatant
	Inherits@Type: ^TrackedVehicle
	Inherits@Crew: ^CrewedVehicle2
	Inherits@GainsExperience: ^GainsExperience
	Inherits@AutoTarget: ^AutoTargetArtillery
	VehicleCrew:
		CrewSlots: Driver, Gunner
		CrewActors:
			Driver: crew.driver.america
			Gunner: crew.gunner.america
		SlotConditions:
			Driver: has-driver
			Gunner: has-gunner
		EjectionOrder: Gunner, Driver
		EjectionDelay: 25
		EjectionDelayVariance: 10
		# Closed-top SPG — armored crew compartment but ammo on board.
		CrewDamageThresholdPercent: 24
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 6
		Prerequisites: ~player.america, ~vehicles.america, ~techlevel.medium
		Description: Self-propelled howitzer for long-range bombardment. Must deploy to fire.
	Tooltip:
		Name: Paladin
	AnnounceOnSeen:
		Type: Artillery
		TextNotification: Spotted: Paladin
	ActorLostNotification:
		TextNotification: Lost: Paladin
	Valued:
		Cost: 1800
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 14000
	Armor:
		Type: Light
		Thickness: 10
		Distribution: 100,80,80,80,60
	Targetable:
		TargetTypes: Ground, Vehicle, Medium
	HitShape:
		Type: Rectangle
			VerticalTopOffset: 620
			TopLeft: -315, -900
			BottomRight: 315, 900
	Detectable:
		CounterBatteryRadar: 1
		CounterBatteryRadarDetectableCondition: firing
		Position: Ground
	Mobile:
		Speed: 80
		Acceleration: 2, 1
		TurnSpeed: 10
		Locomotor: lighttracked
		PauseOnCondition: firing || empdisable
	GrantConditionOnPreparingAttack:
		Condition: firing
		ArmamentNames: primary
		RevokeDelay: 100
	IndirectFire:
	Turreted:
		Offset: -200,0,0
		# Real M109 Paladin turret traverses 360° in roughly 30-60 seconds.
		# At 60ms ticks: TurnSpeed=5 ≈ 12s for 360° — slower than tanks
		# (TurnSpeed 20-25 ≈ 2-3s) without being painfully slow in skirmish.
		TurnSpeed: 5
		# Stowed-gun travel: turret locks forward while driving, only aims when stopped.
		RealignWhileMoving: True
	Armament@1:
		Weapon: ArtilleryRound.Paladin
		# FireDelay: 100
		Recoil: 85
		RecoilRecovery: 70
		MuzzleSequence: muzzle
		LocalOffset: 950,0,380
		PauseOnCondition: !ammo-primary || empdisable || heavy-damage-attained
		AimingDelay: 35
	AmmoPool@1:
		Name: primary-ammo
		Essential: true
		Armaments: primary
		# KEEP Ammo AN EXACT MULTIPLE OF ReloadCount. The evac deduction floors
		# (CustomSellValue.cs:43) while the tooltip's batch count ceilings
		# (AmmoPool.cs:68), so any remainder is advertised to the player and then
		# refunded for free: at Ammo 39 a fully-spent Paladin was charged 7 batches
		# rather than 7.8, handing back 4 shells' worth (48 credits) on every evac.
		Ammo: 40
		ReloadCount: 5
		AmmoCondition: ammo-primary
		RearmSound: minelay1.aud
		# 155mm: 8 batches × 5 shells × 60 supply = 480 (~27% of cost 1800).
		# Artillery target band; empty Paladin evacs ~73% of build cost.
		SupplyValue: 60
	WithAmmoPipsDecoration@1:
		Position: Bottom
		Margin: 8, 3
		PipCount: 6
		RequiresSelection: true
		FullSequence: pip-red
		AmmoPools: primary-ammo
	RenderRangeCircle@1:
		Armament: primary
		RangeCircleType: explosive
		Color: FF0000
		Width: 3
	WithMuzzleOverlay:
	AttackTurreted:
		TargetFrozenActors: True
		ForceFireIgnoresActors: True
		PersistentTargeting: False
		PauseOnCondition: empdisable || unit.docked
		HoldFireWhileMoving: True
		SetupTicks: 25
	Rearmable:
		RearmActors: logisticscenter
		AmmoPools: primary-ammo
	RenderSprites:
		Image: m109
		Scale: 1.1
	WithSpriteTurret:
	Selectable:
		Class: ARTILLERY
	SpawnActorOnDeath:
		Actor: m109.husk

