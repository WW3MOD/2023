	Inherits@GainsExperience: ^GainsExperience
	Inherits@AutoTarget: ^AutoTargetArtillery
	VehicleCrew:
		CrewSlots: Driver, Gunner
		CrewActors:
			Driver: crew.driver.america
			Gunner: crew.gunner.america
		SlotConditions:
			Driver: has-driver
			Gunner: has-gunner
		EjectionOrder: Gunner, Driver
		EjectionDelay: 25
		EjectionDelayVariance: 10
		# MLRS rocket pod — catastrophic when hit, low crew survival.
		CrewDamageThresholdPercent: 14
	# MLRS rocket pod cookoff — catastrophic ammo detonation, biggest cookoff tier. Gated to the
	# EMPTY pod for the same reason as grad: every enabled Explodes fires on the same death
	# (Explodes.cs:103) and VehicleCookoffLarge deals real damage, so an ungated cookoff alongside
	# the bands below would detonate the launcher twice.
	Explodes@CrewCookoff:
		RequiresCondition: !ammo-primary
		Weapon: VehicleCookoffLarge
		EmptyWeapon: VehicleCookoffLarge
	# 12 rockets across 8 bands, so bands are 1 or 2 rockets wide: ceil(n * 8 / 12).
	Explodes@Band1:
		RequiresCondition: ammo-primary == 1
		Weapon: VolatileLoad1
	Explodes@Band2:
		RequiresCondition: ammo-primary >= 2 && ammo-primary <= 3
		Weapon: VolatileLoad2
	Explodes@Band3:
		RequiresCondition: ammo-primary == 4
		Weapon: VolatileLoad3
	Explodes@Band4:
		RequiresCondition: ammo-primary >= 5 && ammo-primary <= 6
		Weapon: VolatileLoad4
	Explodes@Band5:
		RequiresCondition: ammo-primary == 7
		Weapon: VolatileLoad5
	Explodes@Band6:
		RequiresCondition: ammo-primary >= 8 && ammo-primary <= 9
		Weapon: VolatileLoad6
	Explodes@Band7:
		RequiresCondition: ammo-primary == 10
		Weapon: VolatileLoad7
	Explodes@Band8:
		RequiresCondition: ammo-primary >= 11 && ammo-primary <= 12
		Weapon: VolatileLoad8
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: FireAtWill
		# Lifetime ammo cap — empty magazine triggers evacuation (credit refund) instead of seeking rearm.
		InitialResupplyBehavior: Evacuate
		InitialResupplyBehaviorAI: Evacuate
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 7
		Prerequisites: ~player.america, ~vehicles.america, ~techlevel.medium
		Description: Multiple launch rocket system for area saturation. Devastating area damage. Rearms at a Logistics Centre, and evacuates when dry if no Centre is closer than home.
	Valued:
		Cost: 1800
	Tooltip:
		Name: M270 MLRS
	AnnounceOnSeen:
		Type: Vehicle
		TextNotification: Spotted: M270
	ActorLostNotification:
		TextNotification: Lost: M270
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 10000
	Armor:
		Type: Light
		Thickness: 8
		Distribution: 100,80,80,80,60
	Targetable:
		TargetTypes: Ground, Vehicle, Light
	HitShape:
		Type: Rectangle
			VerticalTopOffset: 520
			TopLeft: -360, -530
			BottomRight: 360, 530
	Detectable:
		CounterBatteryRadar: 1
		CounterBatteryRadarDetectableCondition: firing
		Position: Ground
	Mobile:
		Locomotor: lighttracked
		Speed: 80
		Acceleration: 2, 1
		TurnSpeed: 10
		PauseOnCondition: firing || empdisable
	GrantConditionOnPreparingAttack:
		Condition: firing
		ArmamentNames: primary
		RevokeDelay: 50
	IndirectFire:
	Armament@1:
		Weapon: M270Rockets
		# FireDelay: 150
		LocalOffset: 192,-64,176, 192,64,176
		PauseOnCondition: !ammo-primary || empdisable || unit.docked || heavy-damage-attained
		AimingDelay: 30
		# The WithMuzzleOverlay below was a DEAD trait until this line existed — the trait
		# only collects armaments whose MuzzleSequence is non-null (WithMuzzleOverlay.cs:45-47).
		MuzzleSequence: muzzle-missile
	AmmoPool@1:
		Name: primary-ammo
		Essential: true
		Armaments: primary
		Ammo: 12
		AmmoCondition: ammo-primary
		RearmSound: minelay1.aud
		# 227mm rocket: 12 batches × 1 rocket × 70 supply = 840 (47% of cost 1800).
		# MLRS one-shot magazine doctrine — the pod is the platform's value.
		SupplyValue: 70
	WithAmmoPipsDecoration@1:
		Position: Bottom
		Margin: 8, 3
		PipCount: 6
		RequiresSelection: true
		FullSequence: pip-red
		AmmoPools: primary-ammo
	RenderRangeCircle@1:
		Armament: primary
		RangeCircleType: explosive
		Color: FF0000
		Width: 4
	# TACTICAL rocket artillery rearms at the Centre (user ruling 2026-08-30). See the fuller note on
	# `grad` (vehicles-russia.yaml) for why this is a pull-path-only enrolment and why no
	# VehicleReplenish condition accompanies it.
	# Full refill: 840 supply, against a 2250 Centre = 2.7 refills.
	Rearmable:
		RearmActors: logisticscenter
		AmmoPools: primary-ammo
	Turreted:
		Offset: -300,0,50
		# Offset: -180,0,150
		TurnSpeed: 10
		# Stowed pod: locks forward while driving.
		RealignWhileMoving: True
	AttackTurreted:
		TargetFrozenActors: True
		ForceFireIgnoresActors: True
