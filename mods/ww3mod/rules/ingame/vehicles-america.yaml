
humvee:
	Inherits@Combatant: ^Combatant
	Inherits@Type: ^WheeledVehicle
	Inherits@Crew: ^CrewedVehicle2
	Inherits@CargoPips: ^CargoPips
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AutoTarget: ^AutoTargetLMG
	VehicleCrew:
		CrewSlots: Driver, Gunner
		CrewActors:
			Driver: crew.driver.america
			Gunner: crew.gunner.america
		SlotConditions:
			Driver: has-driver
			Gunner: has-gunner
		EjectionOrder: Gunner, Driver
		EjectionDelay: 15
		EjectionDelayVariance: 5
		# Light unarmored — penetrating hits kill crew often.
		CrewDamageThresholdPercent: 20
	# Humvee = unarmored fuel fire on death, not a catastrophic ammo cookoff.
	Explodes@CrewCookoff:
		Weapon: VehicleCookoffTiny
		EmptyWeapon: VehicleCookoffTiny
	AutoTargetPriority@Default:
		RequiresCondition: !stance-fireatwill && !assault-move
	# Scale and Image were two separate RenderSprites blocks 130 lines apart until
	# 260817. Harmless while humvee was declared by one source (the fields are
	# disjoint, so the merge produced this), but MergePartial runs
	# IntoDictionaryWithConflictLog over an actor's child list the moment a SECOND
	# source names that actor, and that helper THROWS on a duplicate key
	# (Exts.cs:484-491) — so any map rules.yaml overriding humvee failed to load.
	# Folded into the first block's slot carrying the later block's value, which is
	# the one merge order that preserves behaviour exactly.
	RenderSprites:
		Scale: 0.9
		Image: humvee
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 1
		Prerequisites: ~player.america, ~vehicles.america, ~techlevel.medium
		Description: Fast wheeled transport with mounted gun.
	Valued:
		Cost: 500
	Tooltip:
		Name: Humvee
	AnnounceOnSeen:
		Type: Vehicle
		TextNotification: Spotted: Humvee
	ActorLostNotification:
		TextNotification: Lost: Humvee
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 4000
	Armor:
		Type: Light
		Thickness: 10
		Distribution: 100,80,80,80,60
	Targetable:
		TargetTypes: Ground, Vehicle, Light
	# Cross-axis half-width 220 -> 235. The long axis stays at 1000 (which is the
	# ^Vehicle default, unlike the width, which was always hand-authored): misses
	# concentrate on the narrow axis, so widening buys ~2.3x the hit-rate per wdist
	# that lengthening would, and is invisible on screen. Ceiling is measured, not
	# guessed — at 500 wide the humvee is overtaken by HIMARS/grad and stops being
	# the hardest target in the game. See tools/combat-sim/scripts/humvee-hitshape-ladder.py.
	HitShape:
		Type: Rectangle
			VerticalTopOffset: 350
			TopLeft: -235, -500
			BottomRight: 235, 500
	Mobile:
		Locomotor: lightwheeled
		Speed: 150
		Acceleration: 3, 4, 5, 6, 5, 4, 3, 2, 1
		TurnSpeed: 19
		PauseOnCondition: empdisable
	Turreted:
		TurnSpeed: 20
		Offset: 32,0,80
	WithSpriteTurret@1:
	Armament@1:
		Name: primary
		Weapon: 7.62mm.MG
		MuzzleSequence: muzzle
		PauseOnCondition: !ammo-primary || empdisable || heavy-damage-attained
	AmmoPool@1:
		Name: primary-ammo
		Essential: true
		Armaments: primary
		Ammo: 300
		ReloadCount: 50
		AmmoCondition: ammo-primary
		RearmSound: minelay1.aud
		# 7.62mm MG: 6 batches × 50 rounds × 4 supply = 24 (~4.8% of cost 500).
		# 0.08/round — 1.6x the 5.56mm rifle anchor, matching the real cartridge-cost ratio
		# between 7.62x51mm and 5.56x45mm. Was 1 per 50 (0.02/round), below the rifle.
		# (The old comment also said cost 450; Valued.Cost is 500.)
		SupplyValue: 4
	WithAmmoPipsDecoration@1:
		Position: Bottom
		Margin: 7, 3
		PipCount: 5
		RequiresSelection: true
		FullSequence: pip-yellow
		AmmoPools: primary-ammo
	RenderRangeCircle@1:
		Armament: primary
		RangeCircleType: bullet
		Color: FFFF00
		Width: 1
	# Turreted@WGM:
	# 	Turret: secondary
	# 	TurnSpeed: 8
	# 	Offset: -160,0,85
	# WithSpriteTurret@WGM:
	# 	Turret: secondary
	# 	Sequence: turret2
	# Armament@WGM:
	# 	Name: secondary
	# 	Weapon: WGM
	# 	Turret: secondary
	# 	FireDelay: 50
	# 	PauseOnCondition: !ammo-secondary || empdisable
	# AmmoPool@WGM:
	# 	Name: secondary-ammo
	# 	Armaments: secondary
	# 	Ammo: 3
	# 	AmmoCondition: ammo-secondary
	# 	RearmSound: minelay1.aud
	# WithAmmoPipsDecoration@WGM:
	# 	Position: Bottom
	# 	Margin: 3, 6
	# 	PipCount: 3
	# 	RequiresSelection: true
	# 	FullSequence: pip-green
	# 	AmmoPools: secondary-ammo
	# RenderRangeCircle@2:
	# 	Armament: secondary
	# 	Color: 00FF00
	# 	Width: 1
	# 	Alpha: 100
	# NextBurstBar@2:
	# 	Armaments: secondary
	# 	Color: 00FF00

	Rearmable:
		RearmActors: logisticscenter
		AmmoPools: primary-ammo #, secondary-ammo
	AttackTurreted:
		TargetFrozenActors: True
		Turrets: primary #, secondary
		PauseOnCondition: empdisable || unit.docked
	WithMuzzleOverlay:
	Cargo:
		Types: Infantry
		MaxWeight: 8
		AfterLoadDelay: 0
		BeforeUnloadDelay: 0
		AfterUnloadDelay: 0
		LoadingCondition: notmobile
		EjectOnDeath: True
	WithCargoPipsDecoration:
	# ThrowsShrapnel@Turret1:
	# 	Weapons: debris.humvee.turret
	# 	Pieces: 1, 1
	# 	Range: 1c0, 1c0
	# ThrowsShrapnel@Turret2:
	# 	Weapons: debris.rocket_buggy.turret
	# 	Pieces: 1, 1
	# 	Range: 1c0, 1c0
	# 	RequiresCondition: wgm_missile
	SpawnActorOnDeath:
		Actor: humvee.husk

