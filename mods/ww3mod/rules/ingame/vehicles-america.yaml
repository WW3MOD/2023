HIMARS:
	Inherits@Combatant: ^Combatant
	Inherits@Type: ^WheeledVehicle
	Inherits@GainsExperience: ^GainsExperience
	Inherits@AutoTarget: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 8
		Prerequisites: ~player.america, ~vehicles.america, ~techlevel.high
		Description: High Mobility Artillery Rocket System for long-range precision strikes. Cannot be rearmed: one load per launcher, and it evacuates for a refund once both missiles are spent.
	Valued:
		Cost: 6000
	Tooltip:
		Name: HIMARS
	AnnounceOnSeen:
		Type: Vehicle
		TextNotification: Spotted: HIMARS
	ActorLostNotification:
		TextNotification: Lost: HIMARS
	RenderSprites:
		Scale: 1.25
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	DamageMultiplier@Loaded:
		RequiresCondition: loaded
		Modifier: 1000
	Health:
		HP: 6000
	Armor:
		Type: Light
	Targetable:
		TargetTypes: Ground, Vehicle, Light
	HitShape:
		Type: Rectangle
			VerticalTopOffset: 620
			TopLeft: -240, -700
			BottomRight: 240, 700
	Detectable:
		RadarDetectableCondition: firing
		Position: Ground
	Mobile:
		Locomotor: lighttracked
		Speed: 70
		TurnSpeed: 10
		PauseOnCondition: firing || being-captured || empdisable
	GrantConditionOnPreparingAttack:
		Condition: firing
		ArmamentNames: primary
		RevokeDelay: 160
	IndirectFire:
	AutoTarget:
		InitialStance: HoldFire
		# Bots hold fire too — see the matching note on `iskander` (vehicles-russia.yaml). Dropping the
		# armament's RequiresForceFire below would otherwise hand bots auto-launch they never had.
		InitialStanceAI: HoldFire
		# LOAD-BEARING, and not merely tidy. Removing Rearmable is NOT sufficient to make this unit
		# leave: the shipped default is Auto, and SupplyHuntMath.DecideAutoDisposition returns
		# HoldAndFlag for any actor that names no rearm actors (AmmoPool.cs:611 feeds it
		# NamesRearmActors; the guard is at SupplyHuntMath.cs:269). That guard is right for ^CrewMember
		# — a unit that never had a depot does not have a missing one — but under the strategic-launcher
		# ruling it would leave a spent HIMARS standing on the field forever, combat-inert, flagging for
		# a rescue that no provider in this ruleset can perform. Evacuate takes the other arm, whose
		# ChooseResupplier returns null with no Rearmable and falls straight through to
		# EvacuateForRefund. This is exactly the pairing grad/m270/tos shipped with while they had no
		# rearm host, so the two artillery classes have now swapped configurations wholesale.
		InitialResupplyBehavior: Evacuate
		InitialResupplyBehaviorAI: Evacuate
	Armament@1:
		Weapon: HIMARSTargeter
		LocalOffset: 192,-64,176, 192,64,176 #BM - Where each rocket spawns when fired (per barrel, in turret-local coords). X=forward(+), Y=right(+)/left(-), Z=up. Two barrels alternate. Combined with the Turreted Offset (-300,0,150), the actual world spawn point is back+up of the vehicle center.
		PauseOnCondition: !ammo-primary || empdisable || unit.docked || heavy-damage-attained
		AimingDelay: 40
		# As M270 — the existing WithMuzzleOverlay had no armament to draw for.
		MuzzleSequence: muzzle-missile
	AmmoPool@1:
		Name: primary-ammo
		Essential: true
		Armaments: primary
		Ammo: 2
		AmmoCondition: ammo-primary
		RearmSound: minelay1.aud
		SupplyValue: 1500
		# Same shape as the Iskander: HIMARSTargeter is a dummy trigger and the rocket is the
		# HIMARSMissile actor. The heading read "HIMARS TARGETER" — the launcher, not the round.
		TooltipName: Guided rocket
	WithAmmoPipsDecoration@1:
		Position: Bottom
		Margin: 8, 3
		PipCount: 2
		RequiresSelection: true
		FullSequence: pip-red
		AmmoPools: primary-ammo
	RenderRangeCircle@1:
		Armament: primary
		RangeCircleType: explosive
		Color: FF0000
		Width: 4
	Turreted:
		TurnSpeed: 10
		Offset: -300,0,150
	AttackTurreted:
		TargetFrozenActors: True
		ForceFireIgnoresActors: True
		PersistentTargeting: False
		PauseOnCondition: empdisable || unit.docked
		HoldFireWhileMoving: True
		SetupTicks: 100
		PersistsAtLastTargetPosition: true #BM - Don't cancel mid-salvo if the target dies between launches; commit to firing all loaded missiles at the original target position.
	# NO Rearmable, and NO ExternalCondition@VehicleReplenish. Both halves are required: RearmActors
	# gates the recipient-initiated PULL, the condition is what let the Centre's PUSH arm select this
	# actor while docked, and removing only the first would have left the push arm live.
	# STRATEGIC launchers are a single load and must LEAVE (user ruling 2026-08-30: "Iskander and
	# HIMARS should not be rearmable, they must be evacuated"). The arithmetic already said so: a full
	# load is 2 x 1500 = 3000 against a Centre holding 2250, so one was never fully reloadable anyway.
	# Full refill: 3000 supply -- unreachable by design; there is no rearm host.
	WithMuzzleOverlay:
	WithSpriteTurret:
		Recoils: false
	MissileSpawnerMaster:
		Actors: HIMARSMissile
		LoadedCondition: loaded
		LaunchingCondition: firing
	# Every Explodes on this actor keys off ammo-primary alone. It previously used `loaded`, which
	# MissileSpawnerMaster grants per replenished slave (MissileSpawnerMaster.cs:147-148) — separate
	# accounting from the AmmoPool. Two independent variables gating traits that all fire on the same
	# death is exactly how a carrier ends up detonating twice, so the bands and the empty case are
	# now driven by one count.
	Explodes:
		RequiresCondition: !ammo-primary
		Weapon: ArtilleryExplode
	# A 2-round magazine can only land on the half-full and full bands; the other six are
	# unreachable, so no trait is emitted for them.
	Explodes@Band4:
		RequiresCondition: ammo-primary == 1
		Weapon: VolatileLoad4
	Explodes@Band8:
		RequiresCondition: ammo-primary == 2
		Weapon: VolatileLoad8
	Selectable:
		DecorationBounds: 2048,2048
	SpawnActorOnDeath:
		Actor: HIMARS.husk

HIMARSMissile:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 30
	Tooltip:
		Name: GMLRS Rocket
	RenderSprites:
		Scale: 0.88 #BM - Sprite size in flight. HIMARS rockets are smaller than Iskander missiles (6 per launcher vs 2), so 1.0 vs Iskander's 1.25.
	Health:
		HP: 50
	BallisticMissile:
		LaunchAngle: 80 #BM - Pitch angle of the launch in WAngle units (1024 = 360°, so 80 ≈ 28.1°). Lower than Iskander — HIMARS uses a flatter trajectory. Controls the parabolic arc steepness.
		Speed: 500 #BM - Maximum horizontal cruise speed in WDist/tick. Caps how fast the rocket can fly during the climb/cruise portion of the arc.
		Acceleration: 4 #BM - Speed gained per tick (WDist/tick²) while accelerating up to Speed. Higher than Iskander — HIMARS rockets accelerate quickly off the rails. 0 disables acceleration.
		InitialSpeedPercent: 3 #BM - Starting speed as a percentage of Speed when Acceleration > 0. 40% means rockets start moving fast (no slow lift-off animation — they fire straight from the tube).
		VisualPitchMultiplier: 42 #BM - How much the rocket sprite tilts during flight to fake a 3D pitch (percentage). 0 = no tilt, higher = more tilt. Above ~30 the sprite can look weird at certain facings since it's a 2D fake.
		TerminalSpeed: 550 #BM - Maximum speed in WDist/tick during the dive phase (past the arc apex). Set higher than Speed for a "speeds up on the way down" effect. 0 = no terminal phase.
		TerminalAcceleration: 7 #BM - Acceleration per tick during the terminal dive (WDist/tick²). Only used when TerminalSpeed > 0. If 0, falls back to the regular Acceleration value.
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
		MovingInterval: 1
		Type: CenterPosition
		Offsets: -200, 0, 100 #BM - Where exhaust puffs spawn relative to the rocket center, rotated by rocket facing. -200 X = 200 WDist behind the rocket (toward the tail). Increase magnitude to push the trail further behind.
	MissileSpawnerSlave:
	SpawnedExplodes:
		Weapon: HIMARSExplosion
		EmptyWeapon: VisualExplodeHusk
		RequiresCondition: !airborne
	Explodes:
		Weapon: HIMARSExplosion
		RequiresCondition: airborne

GBU57Bomb:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 0
	Tooltip:
		Name: GBU-57 MOP
	RenderSprites:
		Scale: 1.1
	Health:
		HP: 100
	# UNACQUIRABLE, by the same mechanism the Kinzhal uses (vehicles-russia.yaml) and for the same
	# reason: the first cut of the missile powers is the uninterceptable tier (proposal §1). The
	# THEMATIC reason differs and is worth stating so nobody "fixes" it into a speed value -- the
	# Kinzhal cannot be caught because it is too fast, the MOP cannot be caught because nothing in
	# the mod can reach the B-2 that drops it. `Penetrator` is a target type no weapon in the mod
	# lists, so no armament acquires this actor.
	# PITFALL: do NOT express that as `-Targetable@Ground:` / `-Targetable@Airborne:`.
	# WeaponInfo.IsValidAgainst gates on victim.GetEnabledTargetTypes() (WeaponInfo.cs:256-264), so
	# an actor with NO target types is invalid for EVERY weapon -- including splash it stands in.
	# Overriding the types keeps it damageable and merely unacquirable.
	Targetable@Ground:
		TargetTypes: Penetrator
		RequiresCondition: !airborne
	Targetable@Airborne:
		TargetTypes: Penetrator
		RequiresCondition: airborne
	BallisticMissile:
		# 30 for the same distance-independence reason as the Kinzhal: BallisticMissileFly derives
		# the arc apex as hDist * Tan(LaunchAngle) / (4*1024) (BallisticMissileFly.cs:88-90), so a
		# steep angle makes the missile CLIMB after entering the map by an amount that scales with
		# the length of the shot. The near-vertical terminal look comes from SpawnAltitude in
		# player.yaml, which does not scale.
		LaunchAngle: 30
		# 500 wdist/tick = 8.1 cells/s, against the Kinzhal's 2000 (32.6). FOUR TIMES SLOWER, and
		# that is the point of the power rather than an oversight: the proposal's asymmetry is
		# "Russia buys speed, America buys penetration", so the US strike must be visibly the slow
		# one. A 47-cell shot takes 48128/500 = 96 ticks = 5.8 s at Timestep 60, against the
		# Kinzhal's 24 ticks -- long enough that the beacon is a real warning.
		Speed: 500
		# Acceleration 0 + InitialSpeedPercent 100 keeps BallisticMissileFly.EstimateArcTicks on its
		# exact hDist/Speed branch, so the flight time above is arithmetic rather than a simulation.
		Acceleration: 0
		InitialSpeedPercent: 100
		# The terminal dive is the weapon. A MOP penetrates on kinetic energy, so it accelerates
		# hard past the apex: the past-apex branch uses TerminalAcceleration when it is > 0
		# (BallisticMissileFly.cs:212-219), taking 500 -> 900 (14.6 cells/s) over 10 ticks.
		TerminalSpeed: 900
		TerminalAcceleration: 40
		# Dropped in already falling, so there is no erector to wait for. Non-zero here would hang
		# the bomb motionless in the air at the map edge.
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 55
	# NO LeavesTrailsCA, unlike the Kinzhal, and this is a deliberate visual difference rather than
	# an omission: the MOP is an unpowered gravity penetrator with no motor to smoke. ^ShootableMissile
	# ships no trail either, so this is simply not added.
	#
	# Plain Explodes, ungated, for the two reasons the Kinzhal documents: SpawnedExplodes calls
	# self.Trait<BaseSpawnerSlave>() unconditionally (SpawnedExplodes.cs:63) and this bomb has no
	# master, and a `RequiresCondition: airborne` gate would never fire -- BallisticMissileFly's last
	# act is SetPosition(self, targetPos) then Kill (BallisticMissileFly.cs:207-209), which drops the
	# actor below MinAirborneAltitude and revokes `airborne` before the queued kill lands.
	Explodes:
		Weapon: MOPPenetration

