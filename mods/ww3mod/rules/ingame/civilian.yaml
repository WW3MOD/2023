^CivField:
	Inherits@1: ^SpriteActor
	Inherits@Shape: ^1x1Shape
	# Inherits@FireMechanic: ^BuildingAffectedByFire
	CombatDebugOverlay:
	Passable:
		PassClasses: field
		PassedByRelationships: Ally, Neutral, Enemy
		# Fields are tiled as actors, one per cell, over whole map regions (3187 of river-zeta's 4544 actors).
		# PassClasses above only buys MOVEMENT — it is read by Locomotor alone. GroundCover is what makes every
		# other "is this cell free" test (crate drop, heli touchdown, husk, placement) see through them as well.
		GroundCover: true
	Interactable:
	Tooltip:
		Name: Field
		ShowOwnerRow: false
	RenderSprites:
		Palette: terrain
	WithSpriteBody:
		# PITFALL (2026-05): -8192 (8 cells) — not "a small push-down". Y is part of the primary sort, so a
		# field with ZOffset -N only renders below a unit while it's within N WDist south of that unit.
		# Earlier values like -256 (1/4 cell) silently let any field more than a quarter cell south of a unit
		# clip on top of the unit's southern sprite edge. We want fields to *always* read as background under
		# regular units; 8 cells of headroom covers any realistic sprite overlap (tank/heli sprites are ~1–2
		# cells) without going absurd. Don't lower this without checking unit-vs-field overlap on full maps.
		ZOffset: -8192
	Building:
		Footprint: x
		Dimensions: 1,1
	AppearsOnMiniMap:
	MiniMapColorFromTerrain:
		Terrain: Field
	AppearsOnMapPreview:
		Terrain: Field
	# PITFALL (2026-08-15): leave these commented out. Giving a field TargetTypes so that weapons
	# "notice" it is the wrong cure — it makes the field a VALID target that soaks the shot and can be
	# auto-acquired, when the design wants a field to be indistinguishable from the tile beneath it.
	# The shell-swallowing bug this looks like the fix for lives in the engine: warhead impact
	# classification skips GroundCover actors (CreateEffectWarhead.ActorTypeAtImpact).
	# Health:
	# 	HP: 2500
	# Targetable:
	# 	TargetTypes:
	AlwaysVisible:
	ScriptTriggers:
	MapEditorData:
		ExcludeTilesets: INTERIOR
		Categories: Decoration
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral
	RenderSprites:
		# PITFALL: Scale > 1 overlaps adjacent fields; anti-aliased edges double-render dark vertical seams. Scale < 1 leaves visible gaps between cells. 1.15 is the sweet spot — 1.05 left gaps, 1.20 had dark seams.
		Scale: 1.15
		# PITFALL (2026-05): EastOnTop is essential — the field sprite has a baked-in shadow on its right edge.
		# Without this flip, the world sort's default west-on-top tiebreaker can leave the shadow visible
		# *inside* a group of fields (random dark vertical lines after copy-paste in the map editor). EastOnTop
		# flags every yielded renderable with XSortBias=1; WorldRenderer's ThenBy then flips the secondary key
		# to +Pos.X so the east neighbour draws over the previous tile's shadow. See WorldRenderer.cs ThenBy.
		XRenderOrder: EastOnTop

