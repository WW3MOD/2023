
^CivBuilding:
	Inherits@TechBuilding: ^TechBuilding
	Inherits@DamageStates: ^DamageStates
	Inherits@DetectionWhenLoaded: ^StandardVisionWhenLoaded
	# See ^Building (structures.yaml) for the ruling and the reasoning. Repeated here because
	# ^CivBuilding does NOT descend from ^Building — it reaches ^BasicBuilding through ^TechBuilding
	# and pulls ^DamageStates in on its own — so the removal on ^Building does not reach these actors.
	# A civilian building is auto-targetable (the Targetable below carries Defense), so it was exposed
	# to exactly the same refusal-to-finish.
	-GrantConditionOnDamageState@CriticalDamage:
	-CaptureManager:
	-Capturable@neutral:
	-Capturable@occupied:
	-CapturableProgressBar:
	-CapturableProgressBlink:
	Targetable:
		RequiresCondition: !loaded
		TargetTypes: Ground, C4, DetonateAttack, Structure, Defense
	Targetable@WhenGarrisoned:
		RequiresCondition: loaded
		# `Defense` IS DELIBERATE HERE, and it is kept knowingly rather than by default. It does
		# invert one preference: ^AutoTargetGroundAntiTank scores `Defense` at 3 on its @Default band
		# and `Infantry` at 2 on @Lower (defaults.yaml:699-709), so on its non-stance-fireatwill band
		# such a unit prefers shelling the house to shooting the men leaning out of its ports. That
		# inversion is ACCEPTED. Its real scope is two aircraft -- A10 and FROG are the only actors on
		# that template -- and only off FireAtWill, where the two classes tie.
		#
		# WHY DROPPING IT COSTS MORE THAN THE INVERSION. Not one AutoTargetPriority band in the mod
		# names `Ground` or `Structure` in an explicit ValidTargets, with a single exception (HIND
		# hand-rolls its own @FireAtWill, aircraft-russia.yaml:119-122). The ^AutoTarget base chain
		# reaches this building only because its @FireAtWill band declares no ValidTargets at all and
		# so takes the engine default `Ground, Water, Air` (AutoTargetPriority.cs:21) -- but every
		# band on the ^AutoTargetGround* and ^AutoTargetAll* chains is explicit, drawn from
		# {Infantry, Vehicle, Water, Underwater, Air, Defense, Mine}. So `Defense` is their ONLY
		# handle on a civilian house, and removing it would take a garrisoned house out of the
		# AutoTargetPriority candidate set of FIFTEEN actors outright rather than demoting it: GTWR,
		# FTUR, PBOX, HBOX, GUN, iskander, HIMARS, tunguska, strykershorad, A10, FROG, MI28, MIG,
		# littlebird, HELI. That includes the mod's two rocket-artillery pieces -- the units that
		# reduce garrisons -- which would defeat the whole point of making the building targetable in
		# the first place. Tried on 2026-09-15 and reverted the same day; the arithmetic is pinned by
		# GarrisonTargetBandTest so nobody has to re-derive it, and that fixture also fails if a
		# future band starts naming `Ground` or `Structure` and changes the cost.
		TargetTypes: Ground, C4, DetonateAttack, Structure, Defense
		# NO RequiresForceFire, and the deletion is the fix -- 63018cfa (2026-04-05) put it here to
		# "prevent enemies from auto-targeting the building structure and force them to engage port
		# soldiers instead", and the consequence nobody costed is that it made a garrison UNKILLABLE
		# BY THE AI. Target.RequiresForceFire is all-or-nothing over the ENABLED targetables
		# (Target.cs:131-151) and exactly one is enabled while loaded, so it returned true;
		# AttackBase.ChooseArmamentsForTarget then hands back an empty armament set for every
		# non-force attack (AttackBase.cs:442). No bot module in the mod issues an actor-directed
		# ForceAttack -- the only ForceAttack anywhere is DroneOperatorBotModule.cs:686 and it targets
		# a CELL -- so both bot paths die on that line: AutoTarget.ChooseTarget drops the candidate at
		# its own ChooseArmamentsForTarget call (AutoTarget.cs:1502-1509, "never selected"), and the
		# squad/DEFCON-2 named "Attack" orders (GroundStates.cs:94,:250, PoiOffensiveBotModule.cs:4720)
		# ARE issued at a garrisoned building and then discarded by the activity ("selected then
		# dropped"). Shelter occupants are reachable ONLY through GarrisonProtection.Damaged, an
		# INotifyDamage on the building, so a bot could not scratch them and the protection curve
		# never degraded.
		#
		# THE DESIGN INTENT SURVIVES THE DELETION, because it was never this flag that carried it.
		# Port soldiers are Infantry and match a priority-2-to-5 AutoTargetPriority band on every
		# specialised template, while the building matches only the base @FireAtWill band at priority 1
		# (defaults.yaml:419) -- so an attacker still prefers the men at the ports, and reaches the
		# building when no port man is targetable. What changes is that "walk past a building that is
		# shooting at you" stops being the only option an attack-move has.
		#
		# AN EMPTY BUILDING IS UNAFFECTED, and never depended on this line: it is NEUTRAL (ownership
		# transfers on garrison, DynamicOwnership defaults true), and both the armament relationship
		# filter (Armament.TargetRelationships defaults to Enemy) and ChooseTarget's own
		# AppearsHostileTo gate reject a neutral actor. The base Targetable below has carried no
		# RequiresForceFire since before 63018cfa.
	RenderSprites:
		Palette: player
		Scale: 1.2
	MapEditorData:
		ExcludeTilesets: INTERIOR
		Categories: Civilian building
	# SpawnActorOnDeath@1:
	# 	Actor: c1
	# 	SpawnOnceOnOwnerChange: true # Works, but all spawns to the same subcell + become owned by you
	# 	Probability: 30 # Does not work with SpawnOnceOnOwnerChange
	# SpawnActorOnDeath@2:
	# 	Actor: c2
	# 	SpawnOnceOnOwnerChange: true
	# 	Probability: 30
	# SpawnActorOnDeath@3:
	# 	Actor: c3
	# 	SpawnOnceOnOwnerChange: true
	# 	Probability: 30
	# SpawnActorOnDeath@4:
	# 	Actor: c4
	# 	SpawnOnceOnOwnerChange: true
	# 	Probability: 30
	# SpawnActorOnDeath@5:
	# 	Actor: c5
	# 	SpawnOnceOnOwnerChange: true
	# 	Probability: 30
	Explodes:
		Weapon: SmallBuildingExplode
	Explodes@CIVPANIC:
		Weapon: CivPanicExplosion
	Selectable:
		Bounds: 2048,2048
	OwnerLostAction:
		Action: ChangeOwner
	Cargo:
		Neutral: true
		Types: Infantry
		MaxWeight: 10
		AfterLoadDelay: 0
		BeforeUnloadDelay: 0
		AfterUnloadDelay: 0
		LoadingCondition: notmobile
		LoadedCondition: loaded
		# Re-stated here because Inherits@CargoPips used to supply it and no longer does. The inherit
		# was deleted as a provable no-op -- WithCargoPipsDecoration early-outs on any actor that also
		# has WithGarrisonDecoration (WithCargoPipsDecoration.cs:70, :97), which all four garrison
		# families do -- but it also carried this key, which is NOT a no-op. LoadedCondition needed no
		# rescue: every one of the four already declared its own.
		NoUnloadNotification: BuildingCannotPlaceAudio
		EjectOnDeath: True
		# Dead means OFF (Cargo.cs ShouldEmergencyBail returns false at this threshold for every
		# damage state). Men CAN keep sheltering in a wreck; it just gets progressively lethal, and
		# the GarrisonProtection curve below already delivers that on its own. The engine must not
		# march them outside on top of it — user ruling 2026-09-02, "don't force them out, let the
		# damage curve do the work". The C# default is Heavy, i.e. 50% HP, and its own [Desc] says
		# it "applies to ground transports only": it was chosen for burning APCs, never for
		# buildings. Vehicles deliberately keep it. Repeated verbatim on GTWR/PBOX/HBOX
		# (structures-defenses.yaml) because those inherit ^Defense, NOT this template.
		EmergencyBailDamageState: Dead
	GarrisonManager:
		# NO Ports HERE, AND THE ABSENCE IS THE DESIGN. This template used to carry one shared
		# eight-port ring at +/-80,+/-280 -- 0.28 cells from the centre -- for every actor that
		# inherits it, from a 5x2 warehouse down to a haystack. Two things were wrong with that.
		#
		# IT IS GEOMETRICALLY INVISIBLE ON ANYTHING BIGGER THAN A 1x1. The ring spans 560 world
		# units in X, which is 55% of a 1x1 footprint but 27% of a 2x2 and 11% of V37's 5x2 -- so
		# the wider the building, the more tightly its whole garrison knots at the centre, inside
		# the sprite's own art. GTWR is the counter-example that shows the right radius: its four
		# ports sit at +/-600 on a 1x1, just outside the footprint, and capture 014 of run
		# 260915_210535 shows all four of its men standing clear of the tower. (Captures 017-019 do
		# NOT demonstrate the civilian half: those squads never boarded, so the invisibility here is
		# argued from the offsets and from GTWR, not from a photograph of a loaded church.)
		#
		# AND IT IS UNIFORM. Port count is a statement about how many openings a building has, and
		# a haystack, a shed and a church do not have the same number.
		#
		# Every concrete actor now declares its own Ports block, sized to its own footprint and
		# counted from what its sprite actually shows. MiniYaml MERGES same-named children, so a
		# ring left here would be ADDED to each actor's rather than replaced -- which is why this
		# is a deletion and not an override. Ports defaults to an empty array
		# (GarrisonManagerInfo.cs:48) and nothing requires it to be non-empty, so an actor that
		# forgot its block would silently become shelter-only rather than fail a lint.
		# CivBuildingPortCoverageTest exists to make that impossible to ship.
		SwapCooldown: 20
		TargetScanInterval: 8
		AmmoConservation: true
		ReloadSwapping: true
	# CriticalProtection is the curve's INTERCEPT AT ZERO HP, not the value at DamageState.Critical:
	# GetCurrentProtection interpolates Critical + (Base - Critical) * hpPct. At 70 the whole bar
	# only moved 95 -> 70 and the remaining 70 -> 30 landed in the single hit point at the rubble
	# clamp, so the building read as "fine, fine, fine, death trap". 35 spreads that drop across the
	# bar instead. Both ENDPOINTS are deliberately unchanged — full health still 95, rubble still 30 —
	# so an intact building and a ruin behave exactly as before and only the middle gets worse.
	GarrisonProtection:
		BaseProtection: 95
		CriticalProtection: 35
		RubbleProtection: 30
		MinPassThrough: 15
	Inherits@GarrisonHealthPips: ^GarrisonHealthPips
	WithGarrisonDecoration:
		RequiresSelection: false
		Position: Bottom
		# THE ENEMY MUST SEE THIS. WithDecorationBaseInfo.ValidRelationships defaults to Ally
		# (WithDecorationBase.cs:107-108), and garrisoning TRANSFERS ownership to the entering
		# player (GarrisonManager.cs:263-267) -- so the opponent always evaluated to Enemy and
		# ShouldRender suppressed every pip (:165-170). The occupancy readout was built, correct,
		# and shown only to the player who already knew how many men were in his own building.
		#
		# Fog is untouched and still decides this: ShouldRender tests World.FogObscures(self)
		# BEFORE the relationship gate (:138-140), and WithGarrisonDecoration overrides only
		# Created and RenderDecoration -- never ShouldRender -- so an enemy sees occupancy exactly
		# when he can see the building, and a remembered building under fog shows nothing.
		#
		# Neutral is included for the third-party observer case; a spectator with no RenderPlayer
		# skips the relationship gate entirely and already saw these.
		ValidRelationships: Ally, Enemy, Neutral
	AttackGarrisoned:
		# PortOffsets / PortYaws / PortCones deleted: they are a FALLBACK for actors with no
		# GarrisonManager (AttackGarrisoned.cs:33-40, and RulesetLoaded only validates them when
		# !hasGarrisonManager, :53-60). All four garrison families have one, so this was a second,
		# silently ignored statement of the same port geometry -- in sync with GarrisonManager.Ports
		# by luck, and the copy a reader would edit expecting it to do something.
		MuzzlePalette: effect
