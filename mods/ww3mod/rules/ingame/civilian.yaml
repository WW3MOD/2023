V19.Husk:
	Inherits: ^CivBuilding
	# A WRECK IS NOT A GARRISON. This husk inherits ^CivBuilding for its sprite and footprint and
	# then strips Health (below), which used to make it UNCONSTRUCTIBLE: GarrisonProtection.Created
	# called self.Trait<IHealth>() and threw. Commit 5a9791bc made that lookup null-safe, so the
	# actor loads; this removes the stack that had no business being on it in the first place.
	#
	# THE `loaded` CONDITION IS WHY THIS BLOCK IS LONG. Cargo.LoadedCondition is what GRANTS it
	# (civilian.yaml, ^CivBuilding), and removing Cargo therefore orphans every consumer on this
	# actor. CheckConditions.cs:73-75 emits an ERROR -- not a warning -- for a condition consumed
	# and not granted, so each one has to go with it: Targetable@WhenGarrisoned, and all ten Vision
	# bands, which ^StandardVisionWhenLoaded gates on `loaded` (defaults.yaml:158-177). The base
	# Targetable, which consumes `!loaded`, is already removed further down.
	-Cargo:
	-GarrisonManager:
	-GarrisonProtection:
	-WithGarrisonDecoration:
	-AttackGarrisoned:
	-Targetable@WhenGarrisoned:
	-Vision@1:
	-Vision@2:
	-Vision@3:
	-Vision@4:
	-Vision@5:
	-Vision@6:
	-Vision@7:
	-Vision@8:
	-Vision@9:
	-Vision@10:
	-Selectable:
	-Targetable:
	-Demolishable:
	-HitShape:
	-Health:
	-Explodes:
	-Explodes@CIVPANIC:
	-GrantConditionOnDamageState@Damaged:
	-GrantConditionOnDamageState@LightDamage:
	-GrantConditionOnDamageState@LightDamageAttained:
	-GrantConditionOnDamageState@MediumDamage:
	-GrantConditionOnDamageState@MediumDamageAttained:
	-GrantConditionOnDamageState@HeavyDamage:
	-GrantConditionOnDamageState@HeavyDamageAttained:
	# No @CriticalDamage removal here: ^CivBuilding already drops that rung, and MiniYaml throws
	# ("no elements with key ... to remove") on a removal that finds nothing.
	-WithDecoration@GarrisonHealth_Light:
	-WithDecoration@GarrisonHealth_Medium:
	-WithDecoration@GarrisonHealth_Heavy:
	-ChangesHealth@BurnDamage:
	-ExternalCondition@BurnDamage:
	-WithDamageOverlay@SmallBurn:
	-WithDamageOverlay@MediumBurn:
	-WithDamageOverlay@LargeBurn:
	RenderSprites:
		Palette: player
	Tooltip:
		Name: Husk (Oil Pump)
	WithSpriteBody:
	WithIdleOverlay:
		StartSequence: fire-start
		Sequence: fire-loop
	Interactable:
