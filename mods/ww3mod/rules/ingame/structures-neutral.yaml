# THE NEUTRAL TECH BUILDINGS -- the mod's capturable income (OILB $50, FCOM $100, BIO $150 via
# CashTrickler) plus two that pay nothing (MISS = radar, HOSP = hospital).
#
# TWO SEPARATE RULES GOVERN WHETHER ONE CAN BE TAKEN OFF THE MAP, and they were BOTH broken in
# different ways before 2026-09-06. Read both before changing either.
#
# 1. WHAT CAN DAMAGE ONE -- the `Targetable` block on ^TechBuilding (structures.yaml). These are
#    untargetable by ordinary weapons, not merely tough; the full mechanism is documented there.
#    Only weapons declaring `TechStructure` (rules/weapons/weapons-heavy-ordnance.yaml) and the
#    engineer's C4 can touch one.
#
# 2. WHETHER DEATH IS PERMANENT -- and as of 2026-09-11 the answer is NEVER, unconditionally.
#    Death spawns a Neutral <ACTOR>.Husk (husks-neutral.yaml), which inherits ^TechBuildingHusk
#    (husks.yaml:118) and so carries `InfiltrateForTransform: Types: TechHusk,
#    ForceHealthPercentage: 10` against ^E6's `Infiltrates@RestoreTechHusk` (infantry.yaml:2062).
#    One engineer walks into the rubble and the income structure is BACK at 10% HP, which
#    `EngineerRepairable` on the live actor then tops up and a Technician can then capture. The
#    husk cannot be denied either: ^CivBuildingHusk carries NO Health trait, so the wreck is
#    permanent scenery that cannot be shot away while it waits for a rescuer.
#
#    THE `ExcludedDeathTypes: HeavyOrdnanceDeath` LINES THAT USED TO BE ON EVERY BLOCK BELOW ARE
#    GONE. They were added 2026-09-06 to make heavy kills permanent, and the user reversed that:
#    "I think it is a bad game mechanic that money structures can be destroyed. Maybe nothing can
#    fully obliterate them, so nuke also only destroys them." No warhead carries that damage type
#    any more either (weapons-heavy-ordnance.yaml), so the lines were already inert -- they are
#    removed rather than left, because an armed-but-unfired deny-list is exactly the shape a future
#    reader reconnects by accident. With no exclusions at all, SpawnActorOnDeath fires on EVERY
#    death, whatever killed it, and "nothing obliterates one" is true by construction.
#
#    THE FIREBALL IS A SEPARATE PATH AND IS CLOSED SEPARATELY. VaporizeWarhead ignores target types
#    and suppresses remains through ISuppressDeathRemains, so it bypasses everything on this page;
#    ^TechBuilding carries `-Vaporizable:` (structures.yaml) to stop it. Removing that line
#    re-opens obliteration without touching a single character in this file.

OILB:
	Inherits: ^TechBuilding
	Inherits@Shape: ^2x2Shape
	HitShape:
		UseTargetableCellsOffsets: false
		TargetableOffsets: 0,0,0, 630,-300,0, 420,512,0, -420,-512,0, -630,300,0
	Selectable:
		Priority: 0
		Bounds: 2048,2048
	OwnerLostAction:
		Action: ChangeOwner
	Building:
		# LocalCenterOffset: 512,512,0
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 50000
	EngineerRepairable:
	CashTrickler:
		Amount: 50
	Tooltip:
		Name: Oil Derrick
	TooltipDescription:
		Description: Provides $50 income
	Explodes:
		Weapon: BarrelExplode
	GpsDot:
		String: Oil
	UpdatesDerrickCount:
	SpawnActorOnDeath:
		Actor: OILB.Husk
		OwnerType: InternalName
