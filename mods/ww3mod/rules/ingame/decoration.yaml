
# Living trees grant the "in cover" concealment bonus (+1/+2/+3, capped at 3 by
# ExternalCondition@ObjectProximity TotalCap in ^DetectableInfantryStandard, infantry.yaml).
# Before this, ^TreeHusk was the ONLY emitter of object-proximity in the mod, so a *burnt* tree
# concealed you and a living one did not.
#
# Range 1024 = exactly 1 cell (WDist.FromCells, WDist.cs:35). It cannot be smaller, because the
# trigger is placed at the Building's CENTRE (ProximityExternalCondition.AddedToWorld ->
# self.CenterPosition; Building.cs:350 + CenterOffset :207-211) while most trees occupy only the
# bottom-left cell of a 2x2 footprint. For Dimensions 2,2 that centre lands 512 east / 512 north
# of the trunk cell's centre = 724 units (0.71c) diagonally off-trunk. The husk's Range: 384 is
# therefore SHORTER than the offset to its own trunk: measured against woodland-warfare-ww3's
# authored trees, 384 grants a bonus on 0.0% of cells. 1024 clears the 724 offset with ~300 units
# of margin, so standing on or beside a tree reliably pays out.
#
# Radius is a balance dial, and it is a STEP function, not a smooth one: trees are placed on whole
# cells, so only a few discrete separations exist and behaviour is constant between them. Measured
# share of in-bounds cells receiving each bonus tier on woodland-warfare-ww3:
#   R  512- 724: 14.1% any bonus /  0.0% at +3
#   R  725-1144: 22.7% any bonus /  1.0% at +3   <-- 1024 sits here, mid-plateau
#   R 1145-1618: 32.7% any bonus /  8.0% at +3
#   R 1619+    : 36.4% any bonus / 12.4% at +3
# 1024 is the conservative pick: the full +3 stays confined to genuine forest interior rather than
# being reachable from a treeline. It is also ~120 units clear of the next step, so the choice is
# not perched on an edge. If woods read as too thin in play, the next meaningful value is 1145
# (anything between 1025 and 1144 changes nothing at all).
#
# PERFORMANCE FALLBACK: this is ~1200 new proximity triggers on the densest maps, unmeasured.
# If frame time suffers, do NOT rewrite -- delete the one Inherits@Cover line from ^Tree below and
# add it to the six clump actors (TC01-TC05, T15) instead. That drops the trigger count to 647 on
# woodland / 237 on river-zeta, at the cost of thinner cover (11.8% / 5.5% of cells).
#
# CLUMP TRIGGER OFFSETS (TC01-TC05). Range alone is not enough, because the anchor can sit off the
# trees entirely. The trigger is placed at self.CenterPosition, i.e. the centre of the DIMENSIONS
# BOX (Building.cs:350 + CenterOffset :207-211 = 512*(dim-1) per axis) -- but every clump's box
# carries an empty padding column, and Building.Density is authored 0 there. So the box centre is
# displaced INTO the padding, away from the authored mass: on TC04 the box centre is 1536-1846 from
# most of its own density cells. Range is a STRICT test (ActorMap.cs:143, `< range.LengthSquared`),
# so those cells were simply outside the circle.
#
# That mattered because Building.Density is exactly what the forest SHADOW reads -- Map.SetDensityLayer
# stamps it per footprint cell at location + offset (Map.cs:1027-1053), and ForestGroundShadow sums it
# along the sightline. Shadow and cover are the two halves of forest concealment, and before this they
# disagreed about where the forest was for ~half the trees on the densest map (clumps are 48.5% of
# woodland-warfare's 1202 trees, 30.1% mod-wide).
#
# Each Offset below recentres the trigger on the density mass. Share of authored forest density
# falling inside its own cover circle, per map: woodland 52.9 -> 86.4%, seventh-woods 51.3 -> 82.6%,
# twin-rivers 56.5 -> 84.3%, siberian 57.7 -> 88.9%, river-zeta 87.2 -> 96.9%. Every clump ends at
# farthest-covered-cell 724 with 300 units of margin -- deliberately the SAME geometry the plain 2x2
# trees already had, so no actor is perched on the strict-comparison edge. Range 1024 is unchanged:
# this moves where the circle sits, not how big it is.
# TC04/TC05 top out at 63.6% of their own density because they are 4x3 and one 1-cell-radius circle
# cannot span a 3-cell-wide mass. Fixing that needs a second emitter, not a bigger radius, and is not
# worth it until the base mechanic has been seen in play.
^TreeCover:
	ProximityExternalCondition@ObjectProximity:
		Condition: object-proximity
		Range: 1024
		ValidRelationships: Neutral, Ally, Enemy

# TREES ARE INDESTRUCTIBLE (2026-09-02, owner ruling: "stop all burnt trees from appearing" /
# "same for living or burnt trees, for now"). Modifier 0 is the engine's own documented idiom for
# invulnerability (DamageMultiplier.cs:16 "Use 0 to make actor invulnerable"). A tree can still be
# shot at and can still be set on fire; it simply never loses HP, so it never dies and its .Husk
# never spawns.
#
# TO REVERT: set `Modifier: 100` below (or comment the Modifier line out -- DamageMultiplier's own
# default is 100). ONE edit in ONE place, whatever the opt-in list grows to. Nothing else was
# removed -- every SpawnActorOnDeath entry and every T##.Husk / TC0#.Husk definition in
# rules/husks/husks.yaml is left intact and merely DORMANT, so trees become destructible again
# exactly as before. Do NOT revert by deleting the `Inherits@Indestructible:` lines one by one;
# that is 22 edits to achieve what one number does.
#
# THIS IS OPT-IN, ON THE TREE ACTORS -- NOT ON ^Tree. It was on ^Tree for one commit and that was a
# bug: ^Tree is not trees-only. It is this mod's general base for "neutral decoration with forest
# cover and Trees-only targeting", and 16 of its 38 concrete inheritors are not trees -- BOXES01-09
# (via ^Box), ICE01-05, UTILPOL1-2. Those were silently made invulnerable too, which the owner did
# not ask for and could not have seen: unlike trees, none of them has a .Husk, so none of them can
# produce the burnt-sprite artifact that motivated this at all. They are left destructible.
#
# WHY OPT-IN RATHER THAN "inherit on ^Tree and -DamageMultiplier@Indestructible on the 16 others":
#   a) FAILS SAFE IN THE DIRECTION YOU CAN SEE. A new tree added below that forgets its
#      Inherits@Indestructible line is a destructible tree -- which shows up in play as the exact
#      burnt-tree sprite the owner reported, gets noticed, and costs one line to fix. Opt-out fails
#      the other way: a new decoration that forgets to remove the trait is silently bulletproof
#      forever, and nobody ever observes a crate failing to burn.
#   b) THE OPT-OUT REVERT CANNOT BE DONE BY HALVES. `-Trait:` is not a no-op when the trait is
#      absent. ResolveInherits accumulates a node's children in DOCUMENT ORDER: `Inherits:` merges
#      its parent in at the point it appears, and `-Foo:` calls RemoveAll at the point IT appears,
#      throwing a load-preventing YamlException if the count is zero (MiniYaml.cs:449-490, throw at
#      :482-483). Removing a genuinely inherited trait is therefore fine -- the `Inherits:` line
#      supplying it just has to come first in the same block -- so the opt-out shape would work
#      today. Its REVERT would not: deleting the inherit from ^Tree while 16
#      `-DamageMultiplier@Indestructible:` lines still expected it makes all 16 throw at once, and
#      the mod stops loading entirely, every map. Loud rather than silent, but it is a 17-edit
#      revert with a mod-wide trap in the middle, against one number here.
#   c) ^Tree stays semantically neutral. A gameplay ruling about trees does not belong on a template
#      that ice floes and utility poles share.
#
# GUARDED BY: engine/OpenRA.Test/TreeIndestructibleScopeTest.cs -- a static NUnit fixture, no game
# launch. It pins both directions (every husk-spawner is invulnerable; nothing without a husk is)
# because this defect class is INVISIBLE at runtime: a crate that wrongly survives napalm looks
# exactly like a crate.
#
# WHY INDESTRUCTIBLE RATHER THAN "spawn an invisible husk that copies the living tree's cover":
# destroying a tree today diverges from the living tree in three directions at once, and only one
# of them is the cover bonus.
#   1. CONCEALMENT SUBSTRATE DOES NOT CHANGE AT ALL. Map.DensityLayer is stamped once at map load
#      from the map's *authored actor definitions* (Map.cs:1027-1053, called at :520) and nothing
#      recomputes it -- UpdateShadowForCells / the density mutator are both marked CURRENTLY UNUSED
#      (Map.cs:1071-1079, :1260) and have no callers. So a burnt tree already conceals exactly as
#      much as a living one for the forest-shadow half of the mechanic. Killing the sprite while the
#      shadow stays is the incoherence, not the parity.
#   2. COVER BONUS COLLAPSES. ^TreeHusk carries Range: 384 (down to 182 per husk) against the living
#      tree's 1024. Per the measurement in the comment above, 384 pays out on 0.0% of cells -- so
#      the bonus does not shrink, it disappears.
#   3. PASSABILITY FLIPS THE WRONG WAY. ^Tree has `Passable: PassClasses: tree` and the four foot
#      locomotors declare `Passes: ... tree` (world.yaml:30,45,62,78), so INFANTRY WALK THROUGH a
#      living tree. ^TreeHusk has no Passable trait at all, so the burnt stump blocks them. Shooting
#      a wood therefore seals infantry lanes that were open. (Vehicles are blocked either way, and
#      building placement is blocked either way -- the husk occupies its cell just as the tree does,
#      so destroying a tree never freed a build spot and nothing is lost there.)
# An invisible husk fixes (2) only, leaves (3), and makes (1) visually absurd by removing the sprite
# while the concealment it casts stays. Indestructibility fixes all three with one line.
#
# NOT REACHED BY THIS: Health.Kill() passes ignoreModifiers:true (Health.cs:245), so a direct Kill
# still removes a tree. That path is unreachable from gameplay -- Passable.OnBeingCrushed is gated on
# CrushedByRelationships, which ^Tree leaves at the default None (Passable.cs:45, :100) -- and it is
# deliberately left open so a Lua scenario can still delete a tree if one ever needs to.
#
# DEFERRED, DO NOT BUILD: recomputing forest shadow when trees die (owner: "it gets complicated and
# it is not the right time now to invest time into"). Treating living and burnt identically is what
# makes that unnecessary for now.
^TreeIndestructible:
	DamageMultiplier@Indestructible:
		Modifier: 0

^Tree:
	Inherits@1: ^SpriteActor
	Inherits@Cover: ^TreeCover
	Inherits@Shape: ^1x1Shape
	# NO Inherits@Indestructible HERE -- see the ^TreeIndestructible block above. This template is
	# shared with BOXES01-09, ICE01-05 and UTILPOL1-2, which stay destructible; the T##/TC0# actors
	# opt in individually.
	#
	# ^BuildingAffectedByFire stays on for everything. On an opted-in tree it is inert (the burn tick
	# ChangesHealth@BurnDamage subtracts 0, so the tree never leaves DamageState.Undamaged and the
	# burn overlays never reach their MinimumDamageState); on a box or an ice floe it still works as
	# it always did. Restoring Modifier: 100 restores fire behaviour on trees too, with no edit here.
	Inherits@FireMechanic: ^BuildingAffectedByFire
	CombatDebugOverlay:
	BlocksProjectiles:
		MaxBypass: 4
		BypassChance: 80
		ExplodesOn: Ally, Neutral, Enemy
		Height: 256
	Passable:
		PassClasses: tree
		PassedByRelationships: Ally, Neutral, Enemy
	Interactable:
	Tooltip:
		Name: Tree
		ShowOwnerRow: false
	RenderSprites:
		Palette: terrain
	WithSpriteBody:
		# PITFALL (2026-05): no ZOffset bias here. With it set to -512, the unit-vs-tree sort flip
		# happened at the *north* edge of the tree's cell (tree.Y - 512), so units popped in front
		# the instant they entered the cell — well before reaching the trunk visually. ZOffset 0 lets
		# the natural Y sort handle it: flip occurs at the tree's visual middle (cell centre), which
		# matches where a viewer expects "behind → in front" to swap for a centre-trunk sprite.
	Building:
		Footprint: x
		Dimensions: 1,1
	AppearsOnMiniMap:
	MiniMapColorFromTerrain:
		Terrain: Tree
	AppearsOnMapPreview:
		Terrain: Tree
	Health:
		HP: 2500
	Armor:
		Type: Wood
	Targetable:
		TargetTypes: Trees
	AlwaysVisible:
	ScriptTriggers:
	MapEditorData:
		ExcludeTilesets: INTERIOR
		Categories: Tree
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral

