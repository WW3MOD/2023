
# Living trees grant the "in cover" concealment bonus (+1/+2/+3, capped at 3 by
# ExternalCondition@ObjectProximity TotalCap in ^DetectableInfantryStandard, infantry.yaml).
# Before this, ^TreeHusk was the ONLY emitter of object-proximity in the mod, so a *burnt* tree
# concealed you and a living one did not.
#
# Range 1024 = exactly 1 cell (WDist.FromCells, WDist.cs:35). It cannot be smaller, because the
# trigger is placed at the Building's CENTRE (ProximityExternalCondition.AddedToWorld ->
# self.CenterPosition; Building.cs:350 + CenterOffset :207-211) while most trees occupy only the
# bottom-left cell of a 2x2 footprint. For Dimensions 2,2 that centre lands 512 east / 512 north
# of the trunk cell's centre = 724 units (0.71c) diagonally off-trunk. The husk's Range: 384 is
# therefore SHORTER than the offset to its own trunk: measured against woodland-warfare-ww3's
# authored trees, 384 grants a bonus on 0.0% of cells. 1024 clears the 724 offset with ~300 units
# of margin, so standing on or beside a tree reliably pays out.
#
# Radius is a balance dial, and it is a STEP function, not a smooth one: trees are placed on whole
# cells, so only a few discrete separations exist and behaviour is constant between them. Measured
# share of in-bounds cells receiving each bonus tier on woodland-warfare-ww3:
#   R  512- 724: 14.1% any bonus /  0.0% at +3
#   R  725-1144: 22.7% any bonus /  1.0% at +3   <-- 1024 sits here, mid-plateau
#   R 1145-1618: 32.7% any bonus /  8.0% at +3
#   R 1619+    : 36.4% any bonus / 12.4% at +3
# 1024 is the conservative pick: the full +3 stays confined to genuine forest interior rather than
# being reachable from a treeline. It is also ~120 units clear of the next step, so the choice is
# not perched on an edge. If woods read as too thin in play, the next meaningful value is 1145
# (anything between 1025 and 1144 changes nothing at all).
#
# PERFORMANCE FALLBACK: this is ~1200 new proximity triggers on the densest maps, unmeasured.
# If frame time suffers, do NOT rewrite -- delete the one Inherits@Cover line from ^Tree below and
# add it to the six clump actors (TC01-TC05, T15) instead. That drops the trigger count to 647 on
# woodland / 237 on river-zeta, at the cost of thinner cover (11.8% / 5.5% of cells).
#
# CLUMP TRIGGER OFFSETS (TC01-TC05). Range alone is not enough, because the anchor can sit off the
# trees entirely. The trigger is placed at self.CenterPosition, i.e. the centre of the DIMENSIONS
# BOX (Building.cs:350 + CenterOffset :207-211 = 512*(dim-1) per axis) -- but every clump's box
# carries an empty padding column, and Building.Density is authored 0 there. So the box centre is
# displaced INTO the padding, away from the authored mass: on TC04 the box centre is 1536-1846 from
# most of its own density cells. Range is a STRICT test (ActorMap.cs:143, `< range.LengthSquared`),
# so those cells were simply outside the circle.
#
# That mattered because Building.Density is exactly what the forest SHADOW reads -- Map.SetDensityLayer
# stamps it per footprint cell at location + offset (Map.cs:1027-1053), and ForestGroundShadow sums it
# along the sightline. Shadow and cover are the two halves of forest concealment, and before this they
# disagreed about where the forest was for ~half the trees on the densest map (clumps are 48.5% of
# woodland-warfare's 1202 trees, 30.1% mod-wide).
#
# Each Offset below recentres the trigger on the density mass. Share of authored forest density
# falling inside its own cover circle, per map: woodland 52.9 -> 86.4%, seventh-woods 51.3 -> 82.6%,
# twin-rivers 56.5 -> 84.3%, siberian 57.7 -> 88.9%, river-zeta 87.2 -> 96.9%. Every clump ends at
# farthest-covered-cell 724 with 300 units of margin -- deliberately the SAME geometry the plain 2x2
# trees already had, so no actor is perched on the strict-comparison edge. Range 1024 is unchanged:
# this moves where the circle sits, not how big it is.
# TC04/TC05 top out at 63.6% of their own density because they are 4x3 and one 1-cell-radius circle
# cannot span a 3-cell-wide mass. Fixing that needs a second emitter, not a bigger radius, and is not
# worth it until the base mechanic has been seen in play.
^TreeCover:
	ProximityExternalCondition@ObjectProximity:
		Condition: object-proximity
		Range: 1024
		ValidRelationships: Neutral, Ally, Enemy

^Tree:
	Inherits@1: ^SpriteActor
	Inherits@Cover: ^TreeCover
	Inherits@Shape: ^1x1Shape
	Inherits@FireMechanic: ^BuildingAffectedByFire
	CombatDebugOverlay:
	BlocksProjectiles:
		MaxBypass: 4
		BypassChance: 80
		ExplodesOn: Ally, Neutral, Enemy
		Height: 256
	Passable:
		PassClasses: tree
		PassedByRelationships: Ally, Neutral, Enemy
	Interactable:
	Tooltip:
		Name: Tree
		ShowOwnerRow: false
	RenderSprites:
		Palette: terrain
	WithSpriteBody:
		# PITFALL (2026-05): no ZOffset bias here. With it set to -512, the unit-vs-tree sort flip
		# happened at the *north* edge of the tree's cell (tree.Y - 512), so units popped in front
		# the instant they entered the cell — well before reaching the trunk visually. ZOffset 0 lets
		# the natural Y sort handle it: flip occurs at the tree's visual middle (cell centre), which
		# matches where a viewer expects "behind → in front" to swap for a centre-trunk sprite.
	Building:
		Footprint: x
		Dimensions: 1,1
	AppearsOnMiniMap:
	MiniMapColorFromTerrain:
		Terrain: Tree
	AppearsOnMapPreview:
		Terrain: Tree
	Health:
		HP: 2500
	Armor:
		Type: Wood
	Targetable:
		TargetTypes: Trees
	AlwaysVisible:
	ScriptTriggers:
	MapEditorData:
		ExcludeTilesets: INTERIOR
		Categories: Tree
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral

^AmmoBox:
	Inherits: ^TechBuilding
	-Selectable:
	Health:
		HP: 10
	Explodes:
		Weapon: UnitExplode
	Tooltip:
		Name: Ammo Box
	Targetable:
		TargetTypes: NoAutoTarget, Ground, C4, DetonateAttack, Structure
	Armor:
		Type: Light
	MapEditorData:
		Categories: Decoration
	Interactable:
		Bounds: 1024,1024
^Box:
	Inherits: ^Tree
	RenderSprites:
		Palette: player
	Tooltip:
		Name: Boxes
	MapEditorData:
		-ExcludeTilesets:
		Categories: Decoration
