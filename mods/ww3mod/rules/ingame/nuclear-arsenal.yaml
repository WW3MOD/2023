	# ---- RS-28 Sarmat: 6 x 750 kt MIRV --------------------------------------------------------
	# PLAYER-AIMED SINCE 2026-09-07, and this is the entry that changed shape. It used to be one
	# click: one missile carrying NukeSarmatMIRV, whose FireCluster warheads scattered six RVs at
	# random inside a 21-cell footprint. The user fired it and reported "the MIRV lands all nukes
	# really close together" -- correctly, because a 10-cell scatter is nothing against an RV whose
	# blast wave runs to 60 cells, so all six craters sat inside one another.
	#
	# NOW: activating it enters placement mode and takes SIX clicks, one per re-entry vehicle, and
	# the order is issued on the sixth. One missile is spawned per aim point and each carries ONE
	# RV -- see the Explodes change on SarmatMissile below, which is the other half of this and is
	# not optional. Six missiles each firing the six-way bus would be thirty-six detonations.
	#
	# The camera is now sized for ONE RV rather than for the whole footprint, because there are six
	# of them and they can be anywhere. 51c0 was right when a single reveal had to cover the entire
	# salvo; six 51-cell reveals is six times the shroud work of the old one for no gain, since each
	# aim point only needs to show its own impact.
	MissileStrikePower@Sarmat:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: SarmatStrike
		Icon: v2bdgricon
		CameoCaption: 6x750 KT
		CameoBadge: nuclear
		Name: RS-28 Sarmat MIRV (6 x 750 kt)
		Description: Heavy ICBM carrying independently-targeted re-entry vehicles.\nClick SIX aim points; one 750 kt warhead goes to each.\nRight-click or Escape while placing cancels without firing.
		# BOUGHT, NOT CHARGED (2026-09-06). The user asked for every power to be purchased from a
		# build tab rather than charged on a timer, and this arrived the same day as the arsenal.
		# ChargeInterval IS GONE rather than set high: SupportPowerInstance forces TotalTicks to 0
		# when RequiresPurchase is set, so any value left here would be inert -- and an inert
		# number that reads like a live one is worse than no number. The scarcity this file's
		# interval ladder expressed is now carried by the price on power.sarmat in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: sarmatmissile
		SpawnAltitude: 27c0
		# 13c0 = 2090 m. Every NukeSarmatRV and NukeSarmatMIRV warhead carries AirThreshold: 24c0.
		DetonationAltitude: 13c0
		MissileDelay: 500
		# SIX independently-aimed warheads, the number the bus was always described as carrying here.
		AimPoints: 6
		# 12 ticks between RVs, so 60 ticks across the salvo. The six tracks are PARALLEL as of
		# 2026-09-07 -- one azimuth for the whole salvo, taken from its centroid -- so this stagger is
		# now what separates them along the approach rather than what stops them overlapping: they
		# cross the map boundary in echelon and land as a ripple. Deterministic (index * 12), which is
		# what lets it sit on the synced activation path.
		AimPointInterval: 12
		# OVERLAY ONLY -- read by the placement order generator, by nothing in the simulation.
		# 30 cells is the "a second RV here is wasted" radius, NOT the weapon's reach: NukeSarmatRV's
		# blast wave runs to 60c768 and its fire warheads to 55 cells, so the ring is deliberately
		# HALF the outer extent. It is the number that answers the placement question -- put two aim
		# points closer than this and the second one is buying nothing.
		AimPointRadius: 30c0
		# Only read for a SINGLE-target order, i.e. one from a bot or a Lua binding, which knows
		# nothing about placement mode. First RV on the bot's chosen point, five more on a 24-cell
		# ring around it. Deliberately WIDER than the 6.5-8.5 cell ring the old FireCluster footprint
		# used, which is the spacing that produced the user's complaint in the first place.
		AimPointFallbackSpread: 24c0
		CameraRange: 30c0
		CameraSpawnAdvance: 60
		CameraRemoveDelay: 1100
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 8

