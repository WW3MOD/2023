	# ---- Tsar Bomba: 50 Mt --------------------------------------------------------------------
	MissileStrikePower@TsarBomba:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: TsarBombaStrike
		Icon: abomb
		CameoCaption: 50 MT
		CameoBadge: nuclear
		Name: Tsar Bomba (50 Mt)
		Description: RDS-220. The largest device ever detonated.\nA 2.5 km fireball burning for twenty-five seconds; it sets fire to more of the map than it flattens.\nComes in from off-map over your own back line.
		# BOUGHT, NOT CHARGED (2026-09-06). The user asked for every power to be purchased from a
		# build tab rather than charged on a timer, and this arrived the same day as the arsenal.
		# ChargeInterval IS GONE rather than set high: SupportPowerInstance forces TotalTicks to 0
		# when RequiresPurchase is set, so any value left here would be inert -- and an inert
		# number that reads like a live one is worse than no number. The scarcity this file's
		# interval ladder expressed is now carried by the price on power.tsarbomba in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: tsarbombamissile
		# 49c0 - 25c0 = 24c0 of descent, three times the eight cells the tactical nuke holds. At
		# Speed 400 -- the slowest delivery in the mod, and a nod to the real weapon's retarding
		# parachute -- a shallower approach would look like it was hovering.
		SpawnAltitude: 49c0
		# 25c0 = 4000 m, which is the REAL burst height of the 30 October 1961 test rather than the
		# formula's answer (the derived optimum is 8.5 km and is capped here). Every NukeTsarBomba
		# warhead carries AirThreshold: 40c0, so there are 15 cells of headroom.
		DetonationAltitude: 25c0
		# 600 ticks = 36 s, the longest wait of any power in the mod. The whole point of this weapon
		# is that everyone watches the clock; DisplayTimerRelationships below is Ally/Neutral/Enemy
		# and AbombLaunchDetected reaches the victim at ORDER time (SupportPower.cs:238-251).
		MissileDelay: 600
		# 55c0 AND THIS IS THE ENGINE CEILING, NOT A CHOICE -- and for this weapon it is a REAL loss
		# rather than a formality. CameraRange reaches MapGrid.MaximumTileSearchRange (MapGrid.cs:113,
		# 56) through RevealShroudEffect.ProjectedCells -> MapLayers.ProjectedCellsInRange ->
		# Map.FindTilesInAnnulus, which THROWS rather than clamping (Map.cs:1993-1995). The projection
		# rounds up, r = (len + 1535) / 1024, so 55c0 gives r = 56 and passes while 56c0 gives 57 and
		# is a HARD CRASH at the tick the camera spawns -- which is CameraSpawnAdvance ticks BEFORE
		# the detonation, so the game dies before the player sees anything. 55c0 is the exact maximum.
		#
		# This weapon's blast reaches 246 cells. The camera therefore shows 22% of its radius, and
		# NO VALUE OF CameraRange CAN FIX THAT. The two real answers are (a) pre-explore the map and
		# turn fog off, which is what the demo scenario does and what any showpiece should do, or
		# (b) raise MaximumTileSearchRange in mod.yaml's MapGrid block -- see the note in the demo's
		# rules.yaml for the exact edit and its cost. Neither is a decision to make inside a weapon.
		CameraRange: 55c0
		CameraSpawnAdvance: 100
		# 2400 ticks = 144 s. The blast wave alone runs 1722 ticks (103 s) and the fires burn past it.
		CameraRemoveDelay: 2400
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 10


	# =============================================================================================
	# THE RUSSIAN FOUR (2026-09-07). Same lobby gate as the six above, plus `Prerequisites:
	# player.russia` -- the same faction lock MissileStrikePower@Kinzhal carries in player.yaml, and
	# the opposite side of the one on @GBU57. The six American entries above are NOT retro-fitted
	# with `player.america` here; that is faction gating for the existing ladder and it belongs to
	# rules/player.yaml, which is being rebuilt in parallel and is not this file.
	#
	# WHAT ACTUALLY DIFFERS FROM THE AMERICAN WEAPON AT THE SAME YIELD. The warheads are identical
	# by design (see the long note in weapons-nuclear-arsenal.yaml); everything that makes these
	# feel Russian is in this file and in the four bodies at the bottom of it:
	#
	#   weapon        Speed   MissileDelay   character
	#   9M729           500            220   ground-launched cruise; slow, low, ordinary
	#   Iskander       1200            180   TEL-launched SRBM; the quickest reaction in the file
	#   Kinzhal-N      2000            120   air-launched off an aircraft already flying; least warning
	#   Kalibr          450            400   sea-launched cruise; the most warning of the four
	#
	# THE SHAPE OF THAT LADDER IS THE OPPOSITE OF THE AMERICAN ONE, and that is the point rather
	# than a coincidence. The US ladder is slow at the bottom and fast at the top: the B61 dial
	# settings are gravity bombs at Speed 900 and the W76 is an SLBM re-entry vehicle at 1400. The
	# Russian ladder is fast in the middle and slow at both ends, because a missile on a ready TEL
	# and a missile already under an airborne MiG-31 both beat a bomber sortie, while a subsonic
	# cruise missile crossing the sea does not. Two factions with the same four yields still make
	# different decisions about when to fire.
	# =============================================================================================

	# ---- 9M729 (SSC-8 Screwdriver): 1 kt -------------------------------------------------------
	# The bottom of the Russian ladder and the counterpart to @B61Low. A kiloton is four times the
	# lowest B61 dial setting, so this is a bigger hole than that weapon makes, but it is still the
	# small end: 6.7 cells of blast is a position, not a battlefield.
	MissileStrikePower@Ru9M729:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: Ru9M729Strike
		# OWN CAMEO SINCE 2026-09-09. Was paranuke, which is now a photograph of an American B61-12 --
		# a US Air Force bomb on a Russian rung. The art is a ground-launched cruise missile leaving an
		# Iskander TEL: the closest freely-licensed image of this weapon's class, because no usable
		# picture of the 9M729 itself exists. Keep in step with power.ru9m729.
		Icon: ru9m729
		CameoCaption: 1 KT
		CameoBadge: nuclear
		Name: 9M729 (1 kt)
		Description: Ground-launched nuclear cruise missile.\nThe smallest warhead Russia can call in: destroys a position, not a battlefield.\nComes in low and slow from off-map over your own back line.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: ru9m729missile
		# 9c512 - 1c512 = 8c0 of descent, the same eight cells @B61Low and the Kinzhal hold.
		SpawnAltitude: 9c512
		# 1c512 = 240 m. The derived optimum burst height for 1 kt is 230 * 1^(1/3) = 230 m = 1.44
		# cells, rounded to the quarter cell as every entry in this file is. Every NukeRu9M729
		# warhead carries AirThreshold: 24c0, so there are 22 cells of headroom above this.
		DetonationAltitude: 1c512
		# 220 ticks = 13.2 s. Slower off the rail than the Iskander below despite being the smaller
		# weapon: a cruise missile flies a long low route rather than an arc.
		MissileDelay: 220
		# 4c0 = 0.60 x the 6.7-cell blast, the same camera-to-blast ratio the rest of the file uses.
		CameraRange: 4c0
		CameraSpawnAdvance: 25
		# 280 ticks = 16.8 s. The blast wave finishes at tick 46; the fires burn for 369.
		CameraRemoveDelay: 280
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: paranuke
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 11

	# ---- 9M723 Iskander-M: 10 kt ---------------------------------------------------------------
	# Nuclear variant of the SRBM the mod already ships as a conventional launcher. Same 10 kt as
	# NukeB61Mod12Y10, which is defined in the arsenal file and fired by nothing -- so this power is
	# the first thing in the mod that ever puts a 10 kt weapon on the map.
	MissileStrikePower@RuIskander:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: RuIskanderStrike
		# OWN CAMEO SINCE 2026-09-09: an erected Iskander-M against sky. It shared v2bdgricon with the
		# Sarmat and the strategic strike, one of which is Russian and two of which are not, until then.
		# Keep in step with power.ruiskander.
		Icon: ruiskander
		CameoCaption: 10 KT
		CameoBadge: nuclear
		Name: 9M723 Iskander-M (10 kt)
		Description: Nuclear-armed quasi-ballistic missile off a mobile launcher.\nThe fastest reaction in the Russian arsenal: least time between order and impact for its size.\nComes in from off-map over your own back line.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: ruiskandermissile
		# 11c0 - 3c0 = 8c0 of descent.
		SpawnAltitude: 11c0
		# 3c0 = 480 m. Derived optimum is 230 * 10^(1/3) = 495 m = 3.10 cells, to the quarter cell.
		# Every NukeRuIskander warhead carries AirThreshold: 24c0, so 21 cells of headroom.
		DetonationAltitude: 3c0
		# 180 ticks = 10.8 s, the SHORTEST of any weapon in this file except the Kinzhal-N, and
		# shorter than @B61Low's 200 despite four times the yield. A missile sitting fuelled on a
		# TEL launches faster than a bomb gets loaded onto an aircraft; that is the whole trade.
		MissileDelay: 180
		# 10c0 = 0.69 x the 14.4-cell blast.
		CameraRange: 10c0
		CameraSpawnAdvance: 28
		# 380 ticks = 22.8 s. Blast wave finishes at tick 96, fires burn 472.
		CameraRemoveDelay: 380
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: paranuke
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
