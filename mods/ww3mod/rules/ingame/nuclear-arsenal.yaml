		RequiresCondition: airborne
	BallisticMissile:
		LaunchAngle: 30
		Speed: 900
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 47
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
