	# ---- Kh-47M2 Kinzhal-N: 50 kt --------------------------------------------------------------
	# Nuclear warhead on the airframe the mod already flies as a conventional strike. Identical
	# blast to @B61Max, and the least warning of anything in the arsenal.
	MissileStrikePower@RuKinzhalN:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: RuKinzhalNStrike
		# OWN CAMEO SINCE 2026-09-09: a MiG-31 carrying the Kinzhal, deliberately a DIFFERENT photograph
		# from the conventional @Kinzhal's kinzhalicon -- same airframe, different sky, and this one
		# wears the badge and a yield. Same missile, different warhead, so a shared SUBJECT is honest;
		# a shared FILE was not. Keep in step with power.rukinzhaln.
		Icon: rukinzhaln
		CameoCaption: 50 KT
		CameoBadge: nuclear
		Name: Kh-47M2 Kinzhal-N (50 kt)
		Description: Nuclear warhead on the air-launched Kinzhal.\nReleased from an aircraft already in the air: the shortest warning of any nuclear weapon.\nComes in from off-map over your own back line.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: rukinzhalnmissile
		# 13c256 - 5c256 = 8c0 of descent, the same as @B61Max at the same yield.
		SpawnAltitude: 13c256
		# 5c256 = 840 m, the same burst height @B61Max uses because it is the same 50 kt: derived
		# optimum 230 * 50^(1/3) = 847 m = 5.30 cells, to the quarter cell. AirThreshold is 24c0.
		DetonationAltitude: 5c256
		# 120 ticks = 7.2 s, the shortest MissileDelay in the mod. The launch aircraft is already
		# airborne and inside its release basket when the order is given -- there is no sortie to
		# fly and no rail to erect. This is the one number that most defines the weapon, and it is
		# HALF @B61Max's 250 at the same yield.
		MissileDelay: 120
		# 16c0 = 0.65 x the 24.6-cell blast, the same value @B61Max carries at the same yield.
		CameraRange: 16c0
		CameraSpawnAdvance: 30
		CameraRemoveDelay: 450
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 13

	# ---- 3M14 Kalibr: 100 kt -------------------------------------------------------------------
	# Top of the Russian purchasable tier and the deliberate opposite of @W76 at the same yield.
	# That one is a re-entry vehicle falling out of a ballistic arc; this one is a subsonic cruise
	# missile crossing the sea. Same hole, far more warning.
	MissileStrikePower@RuKalibr:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: RuKalibrStrike
		# OWN CAMEO SINCE 2026-09-09: the 3M-14 itself, the exact designation in this power's name.
		# It went `abomb` -> `paranuke` -> here; `abomb` was reserved for the Tsar Bomba on 2026-09-08,
		# and `paranuke` then became a photograph of an American B61-12. Keep in step with
		# power.rukalibr.
		#
		# THE NAMING TRAP THIS LINE HAS DOCUMENTED SINCE 2026-09-08 IS UNCHANGED and applies to the new
		# value too. `rukalibr`, NOT `kalibricon`: `Icon:` resolves on the `icon` image
		# (sequences-misc.yaml), where the sequence is called `rukalibr` and maps to kalibricon.shp. A
		# bare art name is a sequence on the BEACON image instead, so `BeaconPoster: atomicon` below is
		# correct while `Icon: atomicon` would not be -- it resolves against a different image and finds
		# nothing. Build stays clean and the unit tests stay green; only --check-yaml catches it, which
		# it once did.
		#
		# AND THE BEACON IS A DIFFERENT FILE FROM THE CAMEO, which is why replacing the cameo art did
		# not disturb it: the beacon sequence is `atomicon: lores|atomicon`, and `lores` is the base
		# Red Alert lores.mix mounted in mod.yaml -- not mods/ww3mod/bits/misc/icons/atomicon.shp.
		Icon: rukalibr
		CameoCaption: 100 KT
		CameoBadge: nuclear
		Name: 3M14 Kalibr (100 kt)
		Description: Sea-launched nuclear cruise missile.\nThe largest warhead Russia can buy short of the showpieces, and the slowest thing carrying one.\nComes in low from off-map over your own back line.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: rukalibrmissile
		# 16c768 - 6c768 = 10c0 of descent, the same ten cells @W76 holds at the same yield: a
		# 100 kt burst sits high enough that eight would look like a flat run-in.
		SpawnAltitude: 16c768
		# 6c768 = 1080 m, the same burst height @W76 uses because it is the same 100 kt: derived
		# optimum 230 * 100^(1/3) = 1068 m = 6.67 cells, to the quarter cell. AirThreshold is 24c0.
		DetonationAltitude: 6c768
		# 400 ticks = 24 s, LONGER than @W76's 350 at the same yield and the longest of the Russian
		# four. A Kalibr is launched from a ship or a submarine that has to be in position first,
		# and it then flies subsonically. Speed 450 on the body below is the other half of this.
		MissileDelay: 400
		# 21c0 = 0.68 x the 31.0-cell blast, the same value @W76 carries at the same yield.
		CameraRange: 21c0
		CameraSpawnAdvance: 35
		CameraRemoveDelay: 560
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 14

# =====================================================================================================
# THE DELIVERY BODIES
#
# All six follow tacnukemissile and highyieldnukemissile (vehicles.yaml) exactly, and differ from each
# other in three things only: Speed, RenderSprites.Scale, and the weapon on Explodes.
#
# UNACQUIRABLE, same mechanism and same PITFALL as their two siblings: the inherited `ICBM` target
# types are OVERRIDDEN rather than the Targetable traits removed, because WeaponInfo.IsValidAgainst
# gates on GetEnabledTargetTypes (WeaponInfo.cs:256-264) and an actor with NO target types is invalid
# for every weapon including splash. `Hypersonic` is reused rather than inventing new unlisted types --
# no weapon in the mod lists it, which is the whole property being bought.
#
# LaunchAngle 30 on every one, for the distance-independence reason documented on kinzhalmissile: the
# arc apex scales with shot length (BallisticMissileFly.cs:88-90), so a steeper angle would make a
# missile climb more on a big map than a small one.
#
# NONE OF THEM SETS TerminalSpeed OR TerminalAcceleration, which is deliberate and matches
# highyieldnukemissile rather than tacnukemissile. Those two give a post-apex boost that
# BallisticMissileFly.EstimateArcTicks does not model at Acceleration 0 (cs:71-73 against :213-221),
# so a missile carrying them arrives AHEAD of the estimate its own camera and beacon timings were
# derived from. With them absent, flight time is exactly hDist / Speed.
# =====================================================================================================

B61LowMissile:
