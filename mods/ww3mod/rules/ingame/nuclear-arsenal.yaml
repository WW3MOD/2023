SarmatMissile:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 0
	Tooltip:
		Name: RS-28 Sarmat
	RenderSprites:
		Scale: 1.5
	Health:
		HP: 200
	Targetable@Ground:
		TargetTypes: Hypersonic
		RequiresCondition: !airborne
	Targetable@Airborne:
		TargetTypes: Hypersonic
		RequiresCondition: airborne
	BallisticMissile:
		LaunchAngle: 30
		# The fastest of the six. A 208-tonne heavy ICBM's bus arrives at the top of its arc doing
		# rather more than a Trident RV.
		Speed: 1600
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 47
	# THE GLOWING-STREAK CONFIGURATION -- the same WithHypersonicPlasma trait the Kinzhal carries
	# (vehicles-russia.yaml), configured the other way round. The Kinzhal is the leading-edge case:
	# a short bloom at the nose and almost no wake. This is the beyond-hypersonic case the user
	# described a future Oreshnik as arriving in, "just as a glowing streak", and the Sarmat gets it
	# because it is already the right object: the comment below this block says these actors are ONE
	# RE-ENTRY VEHICLE EACH, not the bus, and an RV comes down through the atmosphere fast enough
	# that the wake is the only part of it a ground observer resolves.
	#
	# Three things together make it read as a streak rather than as a missile with a bright trail:
	#   10 x 320 = 3200 wdist of wake, a little over three cells, ~75 px at 100% zoom;
	#   a tight 3 x 128 incandescent nose ahead of it;
	#   BodyColor at alpha BE, which is the one that matters -- it replaces the airframe's own pixels
	#   with flat near-white, so the sprite stops reading as an airframe at all. Without it you get a
	#   recognisable missile wearing a long tail; with it you get the streak.
	# Six of these fly per strike (MissileStrikePower@Sarmat in this file, :195, AimPoints: 6 at :215),
	# so this is also the densest test of the effect anything in the mod can produce.
	WithHypersonicPlasma:
		LeadingSamples: 3
		LeadingSpacing: 128
		# RRGGBBAA, alpha LAST (Color.cs:158-177).
		LeadingColor: E6F5FFC8
		TrailingSamples: 10
		TrailingSpacing: 320
		TrailingColor: FFC88C8C
		BodyColor: FFF0E1BE
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
		MovingInterval: 1
		Type: CenterPosition
		Offsets: -1000, 0, 300
	# ONE re-entry vehicle, not the bus. CHANGED 2026-09-07 with MissileStrikePower@Sarmat's
	# AimPoints: 6 -- six of these actors now fly, one per aim point the player clicked, so the
	# multiplicity that used to live in the weapon's FireCluster footprint lives in the number of
	# missiles instead. Leaving NukeSarmatMIRV here would give six buses = thirty-six detonations.
	#
	# This is LIGHTER than what it replaces, which is worth stating because "six missiles" sounds
	# heavier: the old strike detonated the carrier's own flash and shake ON TOP of six RVs' worth,
	# and this drops the carrier layer entirely. Three flashes and five shakes per RV either way,
	# now spread across a 60-tick launch stagger plus differing flight distances instead of landing
	# inside one 9-tick window.
	#
	# NukeSarmatMIRV is left defined in weapons-nuclear-arsenal.yaml but is NO LONGER FIRED by
	# anything. It is the single-missile form of this weapon and is kept as the reference for what
	# the salvo used to be; do not assume editing it changes the Sarmat.
	Explodes:
		Weapon: NukeSarmatRV

B83Missile:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 0
	Tooltip:
		Name: B83-1
	RenderSprites:
		Scale: 1.6
