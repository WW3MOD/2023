	Valued:
		Cost: 0
	Tooltip:
		Name: B61-12 (50 kt)
	# Same 1.0 scale as the low-yield body above is NOT an oversight: it is the same physical bomb at
	# a different dial setting, and a dial does not change a casing.
	RenderSprites:
		Scale: 0.85
	Health:
		HP: 60
	Targetable@Ground:
		TargetTypes: Hypersonic
		RequiresCondition: !airborne
	Targetable@Airborne:
		TargetTypes: Hypersonic
		RequiresCondition: airborne
	BallisticMissile:
		LaunchAngle: 30
		Speed: 900
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 47
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
		MovingInterval: 1
		Type: CenterPosition
		Offsets: -520, 0, 160
