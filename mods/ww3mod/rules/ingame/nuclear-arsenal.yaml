		# 700, SLOWER than the tactical nuke's 900 and half the W76's 1400. The B83 is a free-fall
		# gravity bomb, not a re-entry vehicle, and the arsenal reads better for having the second
		# largest weapon in it be one of the slowest.
		Speed: 700
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
