# =====================================================================================================
# NUCLEAR ARSENAL -- delivery bodies and support powers for weapons-nuclear-arsenal.yaml.
#
# WHY THIS FILE EXISTS AT ALL, rather than the missiles going in vehicles.yaml and the powers in
# player.yaml where their four shipped siblings live: MiniYaml merges a top-level key across every
# file in mod.yaml's Rules: list, and `Player:` is ALREADY defined in five files (player.yaml,
# ai.yaml, ai-america.yaml, ai-russia.yaml, campaign-rules.yaml). So a self-contained file adds six
# powers and six actors while touching neither of the two files the rest of the team is working in.
# Nothing here overrides anything; every key is new.
#
# ==== THE ARSENAL, AND WHAT MAKES EACH ONE DIFFERENT ====
# Radii and durations all come from the scaling laws documented at the top of
# weapons-nuclear-arsenal.yaml. What is listed here is the CHARACTER -- the reason each entry is
# worth a palette slot rather than being a radius number away from its neighbour.
#
#   B61-12 (0.3 kt)   4.5c blast    A nuke that does not end the game. Its fireball lasts 4 TICKS.
#                                   Sub-kiloton, the smallest yield in the US stockpile, and smaller
#                                   than anything previously in this mod by a factor of 60.
#   B61-12 (50 kt)   24.6c blast    THE SAME BOMB, dialled up. Same missile body, same cameo, same
#                                   name -- 167x the energy and 5.5x the radius. The pair is the
#                                   clearest statement of cube-root scaling the arsenal can make.
#   W76-1           31.0c blast     The Trident workhorse, ~1500 deployed. Fast: an SLBM RV at
#                                   Speed 1400, so it is the hardest of the six to see coming.
#   RS-28 Sarmat    60.7c x SIX     NOT A BIGGER NUMBER -- a different SHAPE. Six 750 kt re-entry
#                                   vehicles across a 21-cell footprint instead of one detonation.
#   B83-1           71.0c blast     Largest in the current US stockpile. A gravity bomb, so it is
#                                   SLOW (Speed 700) where the two RVs above are fast.
#   Tsar Bomba     246.1c blast     50 Mt. Fireball burns 417 ticks -- twenty-five seconds. Its
#                                   thermal radius (309c) EXCEEDS its blast radius, the only entry
#                                   where that is true. Parachute-retarded in reality, so Speed 400:
#                                   the slowest thing in the mod, and you watch it come the whole way.
#
# ==== ONE GATE FOR ALL SIX ====
# A single `nuclear-arsenal` lobby checkbox rather than six. Six checkboxes would mean six C# field
# sets, six lobby rows and six conditions to describe an arsenal that is one feature. See the
# polarity note on the gate below -- it is the same fail-safe shape the two shipped nukes use.
# =====================================================================================================

Player:
	# THE SHARED GATE. Same GrantWhenOptionDisabled polarity as @tacnuke and @highyieldnuke in
	# player.yaml, and for the same reason, which is worth restating because it is the one thing here
	# that is not obvious by eye. GrantConditionOnLobbyOption computes
	#     optionEnabled = OptionOrDefault(Option, !GrantWhenOptionDisabled)
	#     shouldGrant   = GrantWhenOptionDisabled ? !optionEnabled : optionEnabled
	# (GrantConditionOnLobbyOption.cs:45-49). THE FALLBACK TERM IS `!GrantWhenOptionDisabled`, not the
	# checkbox default in PowersLobbyOptions.cs -- that field is only consulted when the trait is
	# present to register the option at all. So the registered default and the unregistered fallback
	# are separate values, and written THIS way round:
	#     option registered and on (the shipped default) -> the whole arsenal is available
	#     option registered and off (host unticked it)   -> `nuke-arsenal-disabled` -> all six hidden
	#     option NOT REGISTERED AT ALL                   -> falls back to false -> all six hidden
	# The third row is what the polarity buys: PowersLobbyOptions stripped from world.yaml, an old
	# saved session, a map that removes the trait. Inverted (Condition: nuke-arsenal-allowed,
	# GrantWhenOptionDisabled: false) that same absence would hand a build that never registered the
	# option a 50 Mt weapon. DO NOT INVERT.
	#
	# The checkbox DEFAULTS ON, following @highyieldnuke rather than @tacnuke, because the user's
	# ruling on exactly this question was "gated behind the lobby option like the old nuke was, but
	# reachable from in game". Turning the arsenal off before release is one word in
	# PowersLobbyOptions.cs and needs no edit here.
	GrantConditionOnLobbyOption@nukearsenal:
		Option: nuclear-arsenal
		Condition: nuke-arsenal-disabled
		GrantWhenOptionDisabled: true

	# ---- B61-12, lowest dial setting: 0.3 kt --------------------------------------------------
	# The one entry in the mod that is a nuclear weapon and NOT a map-ender. 4.5 cells of blast is
	# about what a heavy artillery concentration covers, which is the point of a 300-ton dial setting.
	MissileStrikePower@B61Low:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: B61LowStrike
		Icon: paranuke
		Name: B61-12 (0.3 kt)
		Description: Variable-yield tactical bomb at its LOWEST dial setting.\nSub-kiloton: destroys a position, not a battlefield.\nEnters from the map edge nearest your Supply Route.
		# BOUGHT, NOT CHARGED (2026-09-06). The user asked for every power to be purchased from a
		# build tab rather than charged on a timer, and this arrived the same day as the arsenal.
		# ChargeInterval IS GONE rather than set high: SupportPowerInstance forces TotalTicks to 0
		# when RequiresPurchase is set, so any value left here would be inert -- and an inert
		# number that reads like a live one is worse than no number. The scarcity this file's
		# interval ladder expressed is now carried by the price on power.b61low in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: b61lowmissile
		# 9c0 - 1c0 = 8c0 of descent, the same eight cells the Kinzhal and the tactical nuke hold.
		SpawnAltitude: 9c0
		# 1c0 = 154 m, the derived optimum burst height for 0.3 kt. Every NukeB61Mod12Y003 warhead
		# carries AirThreshold: 24c0, so there are 23 cells of headroom above this.
		DetonationAltitude: 1c0
		MissileDelay: 200
		# 3c0 = 0.67 x the 4.5-cell blast, the same camera-to-blast ratio the tactical nuke uses.
		CameraRange: 3c0
		CameraSpawnAdvance: 25
		CameraRemoveDelay: 250
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: paranuke
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 5

	# ---- B61-12, top dial setting: 50 kt ------------------------------------------------------
	# Deliberately the SAME cameo, the same name stem and the same missile speed as the entry above.
	# The only differences a player can see are the yield in the name and the size of the hole, which
	# is exactly what dial-a-yield is.
	MissileStrikePower@B61Max:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: B61MaxStrike
		Icon: paranuke
		Name: B61-12 (50 kt)
		Description: Variable-yield tactical bomb at its HIGHEST dial setting.\nSame weapon as the 0.3 kt option: 167x the energy, 5.5x the radius.\nEnters from the map edge nearest your Supply Route.
		# BOUGHT, NOT CHARGED (2026-09-06). The user asked for every power to be purchased from a
		# build tab rather than charged on a timer, and this arrived the same day as the arsenal.
		# ChargeInterval IS GONE rather than set high: SupportPowerInstance forces TotalTicks to 0
		# when RequiresPurchase is set, so any value left here would be inert -- and an inert
		# number that reads like a live one is worse than no number. The scarcity this file's
		# interval ladder expressed is now carried by the price on power.b61max in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: b61maxmissile
		SpawnAltitude: 13c256
		# 5c256 = 847 m. AirThreshold on every NukeB61Mod12Y50 warhead is 24c0.
		DetonationAltitude: 5c256
		MissileDelay: 250
		CameraRange: 16c0
		CameraSpawnAdvance: 30
		CameraRemoveDelay: 450
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: paranuke
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 6

	# ---- W76-1: 100 kt ------------------------------------------------------------------------
	MissileStrikePower@W76:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: W76Strike
		Icon: cmissicon
		Name: W76-1 Trident Warhead (100 kt)
		Description: Submarine-launched 100 kt warhead, the most numerous in the US inventory.\nRe-entry velocity gives almost no warning after it appears.\nEnters from the map edge nearest your Supply Route.
		# BOUGHT, NOT CHARGED (2026-09-06). The user asked for every power to be purchased from a
		# build tab rather than charged on a timer, and this arrived the same day as the arsenal.
		# ChargeInterval IS GONE rather than set high: SupportPowerInstance forces TotalTicks to 0
		# when RequiresPurchase is set, so any value left here would be inert -- and an inert
		# number that reads like a live one is worse than no number. The scarcity this file's
		# interval ladder expressed is now carried by the price on power.w76 in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: w76missile
		SpawnAltitude: 16c768
		# 6c768 = 1068 m. AirThreshold 24c0.
		DetonationAltitude: 6c768
		MissileDelay: 350
		CameraRange: 21c0
		CameraSpawnAdvance: 35
		CameraRemoveDelay: 560
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 7

	# ---- RS-28 Sarmat: 6 x 750 kt MIRV --------------------------------------------------------
	# PLAYER-AIMED SINCE 2026-09-07, and this is the entry that changed shape. It used to be one
	# click: one missile carrying NukeSarmatMIRV, whose FireCluster warheads scattered six RVs at
	# random inside a 21-cell footprint. The user fired it and reported "the MIRV lands all nukes
	# really close together" -- correctly, because a 10-cell scatter is nothing against an RV whose
	# blast wave runs to 60 cells, so all six craters sat inside one another.
	#
	# NOW: activating it enters placement mode and takes SIX clicks, one per re-entry vehicle, and
	# the order is issued on the sixth. One missile is spawned per aim point and each carries ONE
	# RV -- see the Explodes change on SarmatMissile below, which is the other half of this and is
	# not optional. Six missiles each firing the six-way bus would be thirty-six detonations.
	#
	# The camera is now sized for ONE RV rather than for the whole footprint, because there are six
	# of them and they can be anywhere. 51c0 was right when a single reveal had to cover the entire
	# salvo; six 51-cell reveals is six times the shroud work of the old one for no gain, since each
	# aim point only needs to show its own impact.
	MissileStrikePower@Sarmat:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: SarmatStrike
		Icon: v2bdgricon
		Name: RS-28 Sarmat MIRV (6 x 750 kt)
		Description: Heavy ICBM carrying independently-targeted re-entry vehicles.\nClick SIX aim points; one 750 kt warhead goes to each.\nRight-click or Escape while placing cancels without firing.
		# BOUGHT, NOT CHARGED (2026-09-06). The user asked for every power to be purchased from a
		# build tab rather than charged on a timer, and this arrived the same day as the arsenal.
		# ChargeInterval IS GONE rather than set high: SupportPowerInstance forces TotalTicks to 0
		# when RequiresPurchase is set, so any value left here would be inert -- and an inert
		# number that reads like a live one is worse than no number. The scarcity this file's
		# interval ladder expressed is now carried by the price on power.sarmat in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: sarmatmissile
		SpawnAltitude: 27c0
		# 13c0 = 2090 m. Every NukeSarmatRV and NukeSarmatMIRV warhead carries AirThreshold: 24c0.
		DetonationAltitude: 13c0
		MissileDelay: 500
		# SIX independently-aimed warheads, the number the bus was always described as carrying here.
		AimPoints: 6
		# 12 ticks between RVs, so 60 ticks across the salvo. The six tracks leave the map edge as a
		# stream rather than as one stack of overlapping sprites, and land as a ripple. Deterministic
		# (index * 12), which is what lets it sit on the synced activation path.
		AimPointInterval: 12
		# OVERLAY ONLY -- read by the placement order generator, by nothing in the simulation.
		# 30 cells is the "a second RV here is wasted" radius, NOT the weapon's reach: NukeSarmatRV's
		# blast wave runs to 60c768 and its fire warheads to 55 cells, so the ring is deliberately
		# HALF the outer extent. It is the number that answers the placement question -- put two aim
		# points closer than this and the second one is buying nothing.
		AimPointRadius: 30c0
		# Only read for a SINGLE-target order, i.e. one from a bot or a Lua binding, which knows
		# nothing about placement mode. First RV on the bot's chosen point, five more on a 24-cell
		# ring around it. Deliberately WIDER than the 6.5-8.5 cell ring the old FireCluster footprint
		# used, which is the spacing that produced the user's complaint in the first place.
		AimPointFallbackSpread: 24c0
		CameraRange: 30c0
		CameraSpawnAdvance: 60
		CameraRemoveDelay: 1100
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 8

	# ---- B83-1: 1.2 Mt ------------------------------------------------------------------------
	MissileStrikePower@B83:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: B83Strike
		Icon: abombfake
		Name: B83-1 (1.2 Mt)
		Description: The largest weapon in the current US stockpile.\nA free-fall bomb: slow, and visible for its whole approach.\nEnters from the map edge nearest your Supply Route.
		# BOUGHT, NOT CHARGED (2026-09-06). The user asked for every power to be purchased from a
		# build tab rather than charged on a timer, and this arrived the same day as the arsenal.
		# ChargeInterval IS GONE rather than set high: SupportPowerInstance forces TotalTicks to 0
		# when RequiresPurchase is set, so any value left here would be inert -- and an inert
		# number that reads like a live one is worse than no number. The scarcity this file's
		# interval ladder expressed is now carried by the price on power.b83 in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: b83missile
		SpawnAltitude: 31c256
		# 15c256 = 2445 m, against AirThreshold 25c0 on every NukeB83 warhead. TEN CELLS OF HEADROOM,
		# the tightest margin in the arsenal -- if this burst height is ever raised, raise the
		# AirThreshold column in weapons-nuclear-arsenal.yaml first and in the same edit.
		DetonationAltitude: 15c256
		MissileDelay: 500
		CameraRange: 47c0
		CameraSpawnAdvance: 70
		CameraRemoveDelay: 1250
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 9

	# ---- Tsar Bomba: 50 Mt --------------------------------------------------------------------
	MissileStrikePower@TsarBomba:
		RequiresCondition: !nuke-arsenal-disabled
		OrderName: TsarBombaStrike
		Icon: abomb
		Name: Tsar Bomba (50 Mt)
		Description: RDS-220. The largest device ever detonated.\nA 2.5 km fireball burning for twenty-five seconds; it sets fire to more of the map than it flattens.\nEnters from the map edge nearest your Supply Route.
		# BOUGHT, NOT CHARGED (2026-09-06). The user asked for every power to be purchased from a
		# build tab rather than charged on a timer, and this arrived the same day as the arsenal.
		# ChargeInterval IS GONE rather than set high: SupportPowerInstance forces TotalTicks to 0
		# when RequiresPurchase is set, so any value left here would be inert -- and an inert
		# number that reads like a live one is worse than no number. The scarcity this file's
		# interval ladder expressed is now carried by the price on power.tsarbomba in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: tsarbombamissile
		# 49c0 - 25c0 = 24c0 of descent, three times the eight cells the tactical nuke holds. At
		# Speed 400 -- the slowest delivery in the mod, and a nod to the real weapon's retarding
		# parachute -- a shallower approach would look like it was hovering.
		SpawnAltitude: 49c0
		# 25c0 = 4000 m, which is the REAL burst height of the 30 October 1961 test rather than the
		# formula's answer (the derived optimum is 8.5 km and is capped here). Every NukeTsarBomba
		# warhead carries AirThreshold: 40c0, so there are 15 cells of headroom.
		DetonationAltitude: 25c0
		# 600 ticks = 36 s, the longest wait of any power in the mod. The whole point of this weapon
		# is that everyone watches the clock; DisplayTimerRelationships below is Ally/Neutral/Enemy
		# and AbombLaunchDetected reaches the victim at ORDER time (SupportPower.cs:238-251).
		MissileDelay: 600
		# 55c0 AND THIS IS THE ENGINE CEILING, NOT A CHOICE -- and for this weapon it is a REAL loss
		# rather than a formality. CameraRange reaches MapGrid.MaximumTileSearchRange (MapGrid.cs:113,
		# 56) through RevealShroudEffect.ProjectedCells -> MapLayers.ProjectedCellsInRange ->
		# Map.FindTilesInAnnulus, which THROWS rather than clamping (Map.cs:1993-1995). The projection
		# rounds up, r = (len + 1535) / 1024, so 55c0 gives r = 56 and passes while 56c0 gives 57 and
		# is a HARD CRASH at the tick the camera spawns -- which is CameraSpawnAdvance ticks BEFORE
		# the detonation, so the game dies before the player sees anything. 55c0 is the exact maximum.
		#
		# This weapon's blast reaches 246 cells. The camera therefore shows 22% of its radius, and
		# NO VALUE OF CameraRange CAN FIX THAT. The two real answers are (a) pre-explore the map and
		# turn fog off, which is what the demo scenario does and what any showpiece should do, or
		# (b) raise MaximumTileSearchRange in mod.yaml's MapGrid block -- see the note in the demo's
		# rules.yaml for the exact edit and its cost. Neither is a decision to make inside a weapon.
		CameraRange: 55c0
		CameraSpawnAdvance: 100
		# 2400 ticks = 144 s. The blast wave alone runs 1722 ticks (103 s) and the fires burn past it.
		CameraRemoveDelay: 2400
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 10

# =====================================================================================================
# THE DELIVERY BODIES
#
# All six follow tacnukemissile and highyieldnukemissile (vehicles.yaml) exactly, and differ from each
# other in three things only: Speed, RenderSprites.Scale, and the weapon on Explodes.
#
# UNACQUIRABLE, same mechanism and same PITFALL as their two siblings: the inherited `ICBM` target
# types are OVERRIDDEN rather than the Targetable traits removed, because WeaponInfo.IsValidAgainst
# gates on GetEnabledTargetTypes (WeaponInfo.cs:256-264) and an actor with NO target types is invalid
# for every weapon including splash. `Hypersonic` is reused rather than inventing new unlisted types --
# no weapon in the mod lists it, which is the whole property being bought.
#
# LaunchAngle 30 on every one, for the distance-independence reason documented on kinzhalmissile: the
# arc apex scales with shot length (BallisticMissileFly.cs:88-90), so a steeper angle would make a
# missile climb more on a big map than a small one.
#
# NONE OF THEM SETS TerminalSpeed OR TerminalAcceleration, which is deliberate and matches
# highyieldnukemissile rather than tacnukemissile. Those two give a post-apex boost that
# BallisticMissileFly.EstimateArcTicks does not model at Acceleration 0 (cs:71-73 against :213-221),
# so a missile carrying them arrives AHEAD of the estimate its own camera and beacon timings were
# derived from. With them absent, flight time is exactly hDist / Speed.
# =====================================================================================================

B61LowMissile:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 0
	Tooltip:
		Name: B61-12 (0.3 kt)
	RenderSprites:
		Scale: 0.85
	Health:
		HP: 60
	Targetable@Ground:
		TargetTypes: Hypersonic
		RequiresCondition: !airborne
	Targetable@Airborne:
		TargetTypes: Hypersonic
		RequiresCondition: airborne
	BallisticMissile:
		LaunchAngle: 30
		Speed: 900
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 47
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
		MovingInterval: 1
		Type: CenterPosition
		Offsets: -520, 0, 160
	Explodes:
		Weapon: NukeB61Mod12Y003

B61MaxMissile:
