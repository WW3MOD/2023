TsarBombaMissile:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 0
	Tooltip:
		Name: RDS-220 Tsar Bomba
	# 2.4, by a distance the largest body in the mod. The real device was 8 m long, 2.1 m across and
	# 27 tonnes -- it did not fit inside its bomber and hung below the fuselage.
	RenderSprites:
		Scale: 2.4
	Health:
		HP: 400
	Targetable@Ground:
		TargetTypes: Hypersonic
		RequiresCondition: !airborne
	Targetable@Airborne:
		TargetTypes: Hypersonic
		RequiresCondition: airborne
	BallisticMissile:
		LaunchAngle: 30
		# 400 wdist/tick = 6.5 cells/s, THE SLOWEST DELIVERY IN THE MOD, at a quarter of the Kinzhal's
		# speed. This is characterisation rather than balance: the real RDS-220 fell on an 800 kg
		# parachute, deliberately retarded so the Tu-95 that dropped it could get 45 km away before it
		# went off. You watch this one come the whole way, which is the correct feeling for it.
		Speed: 400
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 47
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
		MovingInterval: 1
		Type: CenterPosition
		Offsets: -1400, 0, 420
	Explodes:
		Weapon: NukeTsarBomba
