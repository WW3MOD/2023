		MovingInterval: 1
		Type: CenterPosition
		Offsets: -1400, 0, 420
	Explodes:
		Weapon: NukeTsarBomba

# =====================================================================================================
# THE FOUR RUSSIAN DELIVERY BODIES (2026-09-07)
#
# Same three-differences rule as the six above -- Speed, RenderSprites.Scale, and the weapon on
# Explodes -- and the same unacquirable `Hypersonic` retype, the same LaunchAngle 30, and the same
# absence of TerminalSpeed/TerminalAcceleration so that flight time stays exactly hDist / Speed.
#
# ALL FOUR REUSE `iskander-missile`, which is what every other missile-power body in the mod already
# does (kinzhalmissile, tacnukemissile, highyieldnukemissile, gbu57bomb, and all six above). The mod
# has no bespoke sprite for any of them and CheckSequences requires the image to resolve. For two of
# these four that reuse is not even a compromise: the Kh-47M2 Kinzhal is an Iskander derivative and
# the conventional KinzhalMissile already draws itself with this exact art at this exact scale, so
# RuKinzhalNMissile below is visually the same missile as the weapon it is the nuclear variant of.
#
# The sequences are in sequences/sequences.yaml alongside the other ten. Every one of them was
# checked to resolve to art that exists (bits/units/vehicle/iskander-missile.shp) before being
# written -- adding an actor with no sequence, or a sequence naming art that is not there, is the
# defect class that broke the merge gate twice in the week to 2026-09-07 and it passes both a clean
# build and a green NUnit run.
# =====================================================================================================

