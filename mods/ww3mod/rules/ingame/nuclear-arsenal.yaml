W76Missile:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 0
	Tooltip:
		Name: W76-1 Re-entry Vehicle
	RenderSprites:
		Scale: 1.05
	Health:
		HP: 100
	Targetable@Ground:
		TargetTypes: Hypersonic
		RequiresCondition: !airborne
	Targetable@Airborne:
		TargetTypes: Hypersonic
		RequiresCondition: airborne
	BallisticMissile:
		LaunchAngle: 30
		# 1400 wdist/tick = 22.8 cells/s, faster than the tactical nuke's 900 and second only to the
		# Kinzhal's 2000. An SLBM re-entry vehicle is the fastest thing in this arsenal for the same
		# reason the real one is: it is falling from the top of a ballistic arc.
		Speed: 1400
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 47
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
		MovingInterval: 1
		Type: CenterPosition
		Offsets: -650, 0, 200
	Explodes:
		Weapon: NukeW76

SarmatMissile:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 0
	Tooltip:
		Name: RS-28 Sarmat
	RenderSprites:
		Scale: 1.5
	Health:
		HP: 200
	Targetable@Ground:
		TargetTypes: Hypersonic
		RequiresCondition: !airborne
	Targetable@Airborne:
		TargetTypes: Hypersonic
		RequiresCondition: airborne
	BallisticMissile:
		LaunchAngle: 30
		# The fastest of the six. A 208-tonne heavy ICBM's bus arrives at the top of its arc doing
		# rather more than a Trident RV.
		Speed: 1600
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 47
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
		MovingInterval: 1
		Type: CenterPosition
		Offsets: -1000, 0, 300
	# ONE re-entry vehicle, not the bus. CHANGED 2026-09-07 with MissileStrikePower@Sarmat's
	# AimPoints: 6 -- six of these actors now fly, one per aim point the player clicked, so the
	# multiplicity that used to live in the weapon's FireCluster footprint lives in the number of
	# missiles instead. Leaving NukeSarmatMIRV here would give six buses = thirty-six detonations.
	#
	# This is LIGHTER than what it replaces, which is worth stating because "six missiles" sounds
	# heavier: the old strike detonated the carrier's own flash and shake ON TOP of six RVs' worth,
	# and this drops the carrier layer entirely. Three flashes and five shakes per RV either way,
	# now spread across a 60-tick launch stagger plus differing flight distances instead of landing
	# inside one 9-tick window.
	#
	# NukeSarmatMIRV is left defined in weapons-nuclear-arsenal.yaml but is NO LONGER FIRED by
	# anything. It is the single-missile form of this weapon and is kept as the reference for what
	# the salvo used to be; do not assume editing it changes the Sarmat.
	Explodes:
