^AutoTargetArtillery:
	Inherits: ^AutoTarget
	# AoE-aware cluster targeting (PIPELINE item 14). Gated to BOT-owned pieces: the
	# enable-ai-experimental token is granted per-unit to both shipping bots (defaults.yaml ^Combatant
	# grant, :106), so human-owned artillery never satisfies it — cluster scoring is inert and
	# byte-identical for humans. Humans can opt in later by pointing this at a human-granted token.
	# 2026-09-02: @stable reaches this as of the full-parity promotion (it was inert there before).
	# NOTE-3 — the two fires-economics scopes differ, so a new rocket unit needs BOTH hooks: the EV
	# fire gate (item 19) keys off the DYNAMIC role model (UnitRoleResolver IndirectFireKind, derived from
	# salvo Burst) and so covers any IndirectFire actor automatically; this cluster term keys off EXPLICIT
	# inheritance of ^AutoTargetArtillery/^AutoTargetArtilleryInfantry (5 actors today). A future rocket
	# actor that is classified IndirectFire but does NOT inherit these templates would get the EV gate but
	# silently miss cluster targeting — inherit the template (or move this field onto the shared base) too.
	AutoTarget:
		ClusterTargetingCondition: enable-ai-experimental
	AutoTargetPriority@Heavy:
		ValidTargets: Heavy
		Priority: 5
	AutoTargetPriority@Medium:
		ValidTargets: Medium
		Priority: 4
	AutoTargetPriority@Light:
		ValidTargets: Light
		Priority: 3
	AutoTargetPriority@Infantry:
		ValidTargets: Infantry
		Priority: 2

