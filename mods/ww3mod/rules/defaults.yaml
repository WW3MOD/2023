# INHERITED BY ZERO ACTORS as of 2026-08-27 (grep "AutoTargetDrone" across mods/ — this
# definition is the only hit). Kept, not deleted, because it is a staged part for the
# drone-counter work and deleting it would only get it rewritten.
#
# It is redundant TODAY, which is why nothing needs it: AutoTargetPriorityInfo.ValidTargets
# defaults to "Ground, Water, Air" (AutoTargetPriority.cs:21), the drone advertises Air via
# ^NeutralAirborne's Targetable@Airborne, and ^DR already inherits ^AutoTarget. So the drone
# operator can auto-acquire an enemy drone and fire DroneJammer at it through the generic Air
# band without this template. Attaching it would NARROW the operator to drones only, which is
# a behaviour change, not a wiring fix — decide that deliberately rather than by inheriting.
^AutoTargetDrone:
	Inherits@HoldFireMarker: ^HoldingFireMarker
	AutoTarget:
		# Separate base — inherits neither ^AutoTarget nor ^AutoTargetGround. See ^AutoTarget above.
		PreemptScanInterval: 25
	AutoTargetPriority@Default:
		ValidTargets: Drone

# A unit that deliberately declines a target it could shoot — anti-overkill (someone
# else's claim already covers the kill) or break-off (the target is critically damaged
# and bleeding out) — used to look identical to a broken unit. An evening was lost to
# exactly that reading, with foliage blamed for it. This tag says "that was a decision".
# Render-only: WithHoldingFireDecoration reads AutoTarget.LastHeldFireTick and writes
# nothing, so attaching it cannot change what any unit does.
#
# PITFALL: pick a sequence whose FILE this mod actually ships. `tag-hold` looks like the
# obvious choice and renders nothing — sequences in the `pips` set that name no file fall
# back to pips.shp, which lives only in engine/mods/cnc. pips2 (the colour ramp) is loaded.
^HoldingFireMarker:
	WithHoldingFireDecoration:
		RequiresSelection: false
		Image: pips
		# Amber, not white: TopRight lands on the selection box's own white corner bracket,
		# where a white pip is camouflaged. Distinct from the yellow rank chevron, which
		# anchors at Top with a 16px margin rather than TopRight.
		Sequence: pip-orange
		Position: TopRight
		Margin: 0,0

# Two render-only marks: "an enemy I know about can see this unit", and "this unit is in a
# stance I deliberately set". Neither changes behaviour and neither grants a condition —
# both read their source from the render path, which is what keeps them off the desync path
# that condition-driven visibility marks have fallen into twice (PITFALL at Detectable.cs:152).
#
# Text, not a pip, on purpose. The existing pip vocabulary is 4x4 colour dots (cargo, class)
# and 6x3 solid chevrons (suppression, damage, defense), and every colour in both idioms is
# already spoken for — a new pip would read as one of those. WithTextDecoration is used
# nowhere else in the mod, so a glyph is distinguishable from every existing pip by medium
# alone, before colour or position do any work.
#
# Slots. All three sit in the Top RIGHT lane, which deleting the abandoned ^VisibilityPips
# gradient row freed up. Everything else around the box is spoken for, and two of those were
# not obvious from grepping Position: in rules/ —
#   Top centre  y=0 damage, -3 suppression, -5 critical, and -10 AND UPWARD cargo, which is
#               always-on and spreads sideways at PipStride 6,6 as passengers load
#   TopLeft     WithSpriteControlGroupDecoration, which declares no Position: anywhere in
#               YAML because TopLeft is its C# default
#   TopRight    the holding-fire pip
#   Top left lane (margin.X +16)  rank chevrons
#   Bottom      ISelectionBar stack and the ammo row
# Note Top negates margin.X, so NEGATIVE X here means RIGHT of centre. Spotted takes y=0, the
# slot nearest the unit and the one clear of cargo even on a full transport; the two stance
# glyphs sit side by side on the row above it.
#
# The lateral offsets were 13 and 21 on the first screenshot pass and read as ORPHANED: an
# infantry selection box is only a few px wide, so a glyph 13px off centre floats roughly a
# cell clear of its soldier and you cannot tell which unit it belongs to in a crowd. Halved to
# 8 and 16, which tucks the mark against the damage pip (6px wide at x=0, so ±3) without
# overlapping it. Vehicles have a wider box and were never the problem.
#
# The visibility mark is now a GRADED DIAMOND, not the binary red "!". It answers "how visible
# is this unit" rather than "has it been seen", and it is on every unit all the time rather than
# only while spotted. Fill is the coarse channel (hollow while concealed, solid once exposed);
# colour is the fine one. Only the top band is enemy-derived — the rest reads the unit's own
# posture, which is what keeps the anti-wallhack asymmetry rule intact. Rationale and every
# reversal point: WORKSPACE/diamond-pip-design-260903.md.
#
# Text and Color below are NOT the diamond. They are the old mark, kept verbatim so that
# `Graded: false` restores it exactly in one line, with no other edit anywhere. Text is
# [FieldLoader.Require] on the base trait, so it has to stay present regardless.
#
# The knobs are repeated here at their C# defaults on purpose: this pip has never been seen on
# screen and a tuning round is expected, and tuning in YAML costs no rebuild. If they drift from
# the C# defaults, YAML wins — these lines are the live values.
^UnitIndicators:
	WithSpottedDecoration:
		RequiresSelection: false
		Position: Top
		# Centred above the damage pip. Both numbers are DERIVED -- see DecorationRowGeometry.cs, which
		# carries the arithmetic and the unit tests. Retune the clearance there, not this literal.
		#   X = DecorationRowGeometry.CentredMarginX = 0.
		#     PITFALL: 0 is the ONLY value that centres, and a non-zero one does not mean what it looks
		#     like. Position: Top NEGATES Margin.X (SelectionDecorations.cs:58), so the -8 this used to
		#     carry -- inherited from the binary "!" this replaced -- drew 8px to the RIGHT of centre,
		#     not the left. That was the reported bug.
		#   Y = DecorationRowGeometry.VehicleDiamondMarginY = -10.
		#     Clears the top of the 17x5 vehicle damage bar by 3px. Infantry author their pip 5px
		#     higher and a pixel taller, so one margin cannot serve both: ^SpottedPipAdjustmentInfantry
		#     in infantry.yaml carries the infantry value. -10 puts the diamond level with the two
		#     stance glyphs, which sit out at x +8 and +16 and so clear a centred ~6px glyph -- but
		#     only by about 2px, so widening the glyph is not free.
		Margin: 0,-10
		Text: !
		Color: FF4A3C
		# Off switch for the whole feature.
		Graded: true
		# Band boundaries, on EXPOSURE. Exposure is the inverse of Detectable.CurrentVisibility and
		# runs the other way: 1 = as hidden as the clamp allows, 9 = nothing hiding the unit at all.
		# Raising a ceiling moves MORE units into the lower, calmer band.
		ConcealedExposureCeiling: 3
		LowExposureCeiling: 5
		ModerateExposureCeiling: 7
		# Density knob. Concealed = draw on everything; Moderate = only units becoming visible;
		# Spotted = the old mark's density with the new glyph.
		MinimumDrawnGrade: Concealed
		SolidFromGrade: Moderate
		ConcealedColor: 6E9E76
		LowColor: ECC73C
		ModerateColor: F0B232
		HighColor: F09425
		# Deliberately the same red the "!" used, so the state players already know keeps its colour.
		SpottedColor: FF4A3C
	WithStanceDecoration@Fire:
		RequiresSelection: false
		Axis: Fire
		Position: Top
		Margin: -8,-10
	WithStanceDecoration@Engagement:
		RequiresSelection: false
		Axis: Engagement
		Position: Top
		Margin: -16,-10

