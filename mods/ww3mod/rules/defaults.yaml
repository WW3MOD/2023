# Each trait key names the BAND it fires on; the Sequence it draws is deliberately one rung
# further down the ladder — same shift as ^DamageInfantryPips, which carries the full rationale.
# Flashing means critical and critical is 50%, so the pulse starts at the Heavy band and the
# solid red pip slides up to Medium.
#
# Decoded from pip-damage-vehicle.shp (17x5 — a BAR, where the infantry pip is a 6x6 dot; five
# frames): 0 yellow (255,255,85), 1 orange (255,138,0), 2 red (255,0,0), 3 dark red (101,0,0).
# No green frame. The rung squeezed out is the ORANGE one, `pip-damage-vehicle-medium`, now
# unreferenced. `-critical` is frames 2+3, a red <-> dark red pulse, not an on/off flash.
#
# The RequiresCondition lines are untouched ON PURPOSE: retuning ^DamageStates or Health.cs
# instead would move AutoTargetInfo.BreakOffCondition off 25% along with it.
^DamageVehiclePips:
	WithDecoration@DamageVehiclePips_Light:
		Image: pips
		Sequence: pip-damage-vehicle-light
		Position: Top
		Margin: 0,0
		RequiresCondition: light-damage
	WithDecoration@DamageVehiclePips_Medium:
		Image: pips
		Sequence: pip-damage-vehicle-heavy
		Position: Top
		Margin: 0,0
		RequiresCondition: medium-damage
	WithDecoration@DamageVehiclePips_Heavy:
		Image: pips
		Sequence: pip-damage-vehicle-critical
		Position: Top
		Margin: 0,0
		RequiresCondition: heavy-damage
	WithDecoration@DamageVehiclePips_Critical:
		Image: pips
		Sequence: pip-damage-vehicle-critical
		Position: Top
		Margin: 0,0
		RequiresCondition: critical-damage

# Garrison-specific health pips: same vehicle pip sequences but no critical
# blinking, since buildings can't be destroyed (no rubble transition yet).
# Heavy pip covers the whole band below 50% so the red indicator stays visible
# all the way to the building's lowest protection state.
#
# READS `heavy-damage-attained`, NOT `heavy-damage || critical-damage`. Buildings no longer take the
# Critical rung at all (^Building / ^CivBuilding drop it — see the ruling there), so the old
# expression would have gone dark below 25%: `heavy-damage` is ValidDamageStates: Heavy ALONE, and
# with the critical token never granted nothing else covered that band. `heavy-damage-attained` is
# ValidDamageStates: Heavy, Critical, so it spans exactly the same range the pair used to.
# The token a consumer reads is what changed here; no token changed meaning.
^GarrisonHealthPips:
	WithDecoration@GarrisonHealth_Light:
		Image: pips
		Sequence: pip-damage-vehicle-light
		Position: Top
		Margin: 0,0
		RequiresCondition: light-damage
	WithDecoration@GarrisonHealth_Medium:
		Image: pips
		Sequence: pip-damage-vehicle-medium
		Position: Top
		Margin: 0,0
		RequiresCondition: medium-damage
	WithDecoration@GarrisonHealth_Heavy:
		Image: pips
		Sequence: pip-damage-vehicle-heavy
		Position: Top
		Margin: 0,0
		RequiresCondition: heavy-damage-attained

