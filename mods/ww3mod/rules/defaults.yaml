^Combatant:
	# ReturnToSlotForHumanOwners added 2026-08-30, together with the removal of human tactical
	# positioning below. A unit that had been given a grouped move order kept a formation slot for
	# ForgetAfterTicks (750 ticks = 45s) and walked BACK to it whenever it went idle off-slot or was
	# shoved by a passing unit — so a unit the player had since parked somewhere deliberately would
	# set off again on its own, up to 45s after the order that assigned the slot. Off for human
	# owners now; a parked unit stays parked.
	# BOTS ARE UNAFFECTED. The guard (CohesionSlotMemory.cs, TryReturnToSlot) is predicated on
	# `Owner.Playable && !Owner.IsBot`, so @stable / @normal / @experimental cannot reach it whatever
	# this is set to, and neither can a scenario garrison (Playable: False).
	# NOT gated by removing the trait: DrawLineToTarget.cs:181 and GroupScatterHotkeyLogic.cs:240
	# both read the slot record to draw the player's order line and to make Group Scatter
	# redistribute the points actually clicked. Only the return MOVE is suppressed.
	CohesionSlotMemory:
		ReturnToSlotForHumanOwners: false
	# Phase 2 tactical positioning executor. MUST be declared AFTER CohesionSlotMemory:
	# both act in INotifyIdle.TickIdle and run in declaration order — the executor rechecks
	# CurrentActivity == null so a return-to-slot queued first this tick makes it a no-op (S6).
	# BOT-OWNED UNITS ONLY. enable-ai-experimental is granted per-unit below. Humans additionally
	# satisfied this gate from Phase 3 until 2026-08-30 via a GrantConditionOnHumanOwner@tacpos block
	# that stood here — removed because the executor walks an idle unit up to LeashRadius cells every
	# EvaluateCooldown ticks with no player-legible cause, and in play-testing that read as units
	# wandering off on their own. Human-owned units now hold the cell you put them on.
	# `enable-tactical-positioning` is granted NOWHERE in the mod and is gone from this expression:
	# leaving it here while deleting its only granter is a CheckConditions ERROR ("consumes conditions
	# that are not granted"), not a warning, on all 20 ^Combatant inheritors. Scenarios that exercise
	# the executor on human units re-add BOTH halves locally — see
	# tools/autotest/scenarios/test-stance-*/rules.yaml.
	#
	# 2026-09-02 PROMOTION — @stable now satisfies this too, via the widened Bots: list below. Until
	# today @stable could not reach the executor at all, and the YAML gate was the whole mechanism.
	StancePositioningExecutor:
		RequiresCondition: enable-ai-experimental
		LeashRadius: 4
		EvaluateCooldown: 30
		MinThreatIntensity: 40
		MaxSuppressionToMove: 30
		FacingToleranceAngle: 256
	# Per-unit membership condition: units owned by EITHER shipping bot enable the executor.
	# (The like-named ai.yaml grant is on the PLAYER actor; a unit trait's RequiresCondition only
	# sees conditions granted on the unit, so the executor needs its own per-unit grant. The two are
	# independent despite sharing a name — widening this one does NOT widen any player-actor gate.)
	#
	# 2026-09-02: `stable` added for the full-parity promotion. This ONE line is the entire mechanism
	# for three consumers of the per-unit token — StancePositioningExecutor above, and the two
	# AutoTarget.ClusterTargetingCondition sites on ^AutoTargetArtillery / ^AutoTargetArtilleryInfantry.
	# Those two CANNOT take a boolean expression: ClusterTargetingCondition is a plain condition NAME
	# read via self.GetConditionCount() (AutoTarget.cs:252, :1352), so `a || b` there would look up a
	# condition literally called "a || b" and silently never match. Widening the grant is the only
	# lever that reaches them. The token's name is now historical — read it as "bot-owned unit".
	# NOT renamed on purpose: tools/autotest/scenarios/test-stance-*/rules.yaml re-add this token by
	# name, and scenarios are invisible to the map-shaped lint gates, so a rename would break them
	# with every gate still green.
	GrantConditionOnBotOwner@tacpos:
		Condition: enable-ai-experimental
		Bots: experimental, stable

