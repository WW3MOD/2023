	# ---- blast-scar bands, outermost first ----------------------------------
	# SMUDGE LAYER ORDER IS Z ORDER -- "Order of the layers defines the Z sorting"
	# (SmudgeLayer.cs:30). These five are listed LIGHTEST FIRST so the darkest
	# draws last and wins. Within one blast the bands are annuli and never
	# overlap, but two blasts overlapping is routine, and in the other order a
	# later weapon's faint outer rim would paint over an earlier weapon's blasted
	# centre -- damage would appear to heal.
	#
	# SmokeChance is rolled PER CELL (SmudgeLayer.cs:158), not per warhead, so it
	# is only set on the two innermost bands. AtomicHighYield's rim band alone is
	# ~2600 cells; Scorch's 50 there would be over a thousand SpriteEffects from
	# one shot.
	# SHORE FADE, 2026-09-09. Only these five layers set it. The two stock layers above
	# (SCORCH, CRATER) leave ShoreFadeCells at its default 0 and are byte-identical to before.
	# 2 gives a two-cell ramp, so the disc eases off at a river instead of ending on a hard cell edge.
	# SHORE FADE MIN ALPHA, 2026-09-10, and it is a FIX to the line above rather than a new knob.
	# The ramp used to fall to 1/3 on the cell touching water. A smudge is one flat alpha over a whole
	# cell, so that is a 67% drop across one cell edge -- and because the ramp is 2 cells wide while
	# the rivers on these maps are 2-3 cells wide, EVERY cell of a ford is within reach of some water
	# and the entire crossing was held at 1/3-2/3. Measured on demo-highyield-nuke's ford (cells
	# 71-74 x 50-52): a 6-cell-wide band held below full strength, with the 4 ford cells at 1/3. That
	# reads as exactly the bright unscarred sand block the fade was written to remove. 0.7 keeps the
	# shoreline cell unmistakably scarred and still thins it into the water.
	# (The ramp is also Euclidean now, not Chebyshev -- Chebyshev's contours are literal squares, which
	# is what put hard rectangular corners several cells clear of the water. SmudgeLayer.cs:376-415.)
	# GROUND-COVER OVERLAY, 2026-09-10. Only these five layers set it, for the same reason only these
	# five set ShoreFadeCells: SCORCH and CRATER are the RA smudge types every ordinary weapon in the
	# mod shares, and widening a nuclear-scarring decision onto conventional craters is not what was
	# asked for. Crop fields are ACTORS (^CivField, 3187 of them on river-zeta), and actors draw in a
	# later pass than terrain decals, so the scar on a field cell was always placed and always hidden --
	# farmland read as immune to a nuclear blast. This redraws the band over those cells only, after
	# actors. Ground cover is the exact restriction (Passable.GroundCover): a cell qualifies only if
	# EVERY actor in it is ground cover, so a scar can never land on top of a tank, soldier or building.
	# UNDER-ACTORS HALF, 2026-09-19, and it is a FIX to the line above rather than a new feature. The rule above is
	# exact and it has a cost the user's eye found: a cell holding a vehicle AND a field is excluded, so the field
	# sprite keeps hiding the terrain-pass decal and the cell reads as bright unburnt wheat inside a black disc.
	# Measured on test-field-swallows-nuke, cell 36,14 was 51% bright wheat against 31.6% on its same-band
	# neighbours. GroundCoverOverlayUnderActors emits ONE SORTED RENDERABLE for those cells instead of adding them
	# to the batched pass -- at ZOffset -7680, which is ^CivField's -8192 plus half a cell, so the scar lands above
	# the field and below the unit. The absolute rule is unchanged: no scar pixel is ever drawn over a unit.
	# EDGE CUTS, 2026-09-19. The shore fade above thins a boundary cell's ALPHA, and alpha cannot reach below the
	# cell: a smudge is one flat value over the whole 24x24, so a dimmed cell is still a cell-shaped tone step with
	# square, axis-aligned edges. That is what reads as blocky at River Zeta's shoreline -- bright sand hard against
	# dark. (And with ShoreFadeMinAlpha at 0.7 the entire ramp spans alpha 0.8-1.0, so there was barely any dimming
	# to see.) EdgeSequences swaps in SPARSER ART instead: cuts of the same band at 50% and 25% of its coverage,
	# generated by gen_scars.py as nested subsets of the same noise field, so a cell thins rather than reshuffling.
	# The fade is kept, not replaced -- a boundary cell gets the sparser sprite AND the ramped alpha.
	# The thresholds are read off the ramp rather than guessed. With ShoreFadeCells 2 and MinAlpha 0.7 the reachable
	# alphas are 0.800 (edge-on to water), 0.841 (diagonal), 0.900 (two cells), 0.924, 0.983 and 1.0, so 0.81/0.91
	# puts -e25 on the waterline cell, -e50 on the diagonal and two-cell ring, and full strength from three cells in.
	SmudgeLayer@SCARRIM:
		Type: ScarRim
		ShoreFadeCells: 2
		ShoreFadeMinAlpha: 0.7
		GroundCoverOverlay: true
		GroundCoverOverlayUnderActors: true
		Sequence: scarband-rim
		EdgeSequences: scarband-rim-e25, scarband-rim-e50
		EdgeAlphaThresholds: 0.81, 0.91
		SmokeChance: 0
	SmudgeLayer@SCARBURN:
		Type: ScarBurn
		ShoreFadeCells: 2
		ShoreFadeMinAlpha: 0.7
		GroundCoverOverlay: true
		GroundCoverOverlayUnderActors: true
		Sequence: scarband-burn
		EdgeSequences: scarband-burn-e25, scarband-burn-e50
		EdgeAlphaThresholds: 0.81, 0.91
		SmokeChance: 0
	SmudgeLayer@SCARCHAR:
		Type: ScarChar
		ShoreFadeCells: 2
		ShoreFadeMinAlpha: 0.7
		GroundCoverOverlay: true
		GroundCoverOverlayUnderActors: true
		Sequence: scarband-char
		EdgeSequences: scarband-char-e25, scarband-char-e50
		EdgeAlphaThresholds: 0.81, 0.91
		SmokeChance: 0
	SmudgeLayer@SCARCRATER:
		Type: ScarCrater
		ShoreFadeCells: 2
		ShoreFadeMinAlpha: 0.7
		GroundCoverOverlay: true
		GroundCoverOverlayUnderActors: true
		Sequence: scarband-crater
		EdgeSequences: scarband-crater-e25, scarband-crater-e50
		EdgeAlphaThresholds: 0.81, 0.91
		SmokeChance: 20
		SmokeImage: smoke_m
		SmokeSequences: idle
	SmudgeLayer@SCARCORE:
		Type: ScarCore
		ShoreFadeCells: 2
		ShoreFadeMinAlpha: 0.7
		GroundCoverOverlay: true
		GroundCoverOverlayUnderActors: true
