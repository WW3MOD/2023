	DebugVisualizations:
	# LOCAL LIGHTING. Every value here is the trait's own default and is written out on purpose: with
	# Intensity 1 and neutral tints, TintAt returns exactly (1,1,1) and enabling this trait is a visual
	# no-op. SpriteRenderable multiplies its tint by that identity; TerrainSpriteLayer writes
	# `alpha * (1,1,1)` into the vertex colour, which is the same value Util.FastCreateQuad writes when
	# the trait is absent. A map that wants night sets Intensity below 1 here; light events add on top.
	# What enabling it DOES cost is a TintAt call per sprite per frame (SpriteRenderable.cs:116) plus a
	# four-sample terrain refresh per dirtied cell — see WORKSPACE/DISCOVERIES.md 2026-09-06.
	TerrainLighting:
		Intensity: 1
		HeightStep: 0
		RedTint: 1
		GreenTint: 1
		BlueTint: 1
