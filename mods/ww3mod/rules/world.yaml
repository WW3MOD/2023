	TerrainRenderer:
	ShroudRenderer:
		# Explored ground with no current observer sits at visibility 1 and so draws all nine fog
		# layers. At the engine baseline of 1 that leaves it at ~26% of its lit brightness; 1.4
		# leaves ~15% (measured on-screen 2026-09-01) — dark enough that terrain reads as shape
		# rather than detail, while separating clearly from the flat black of unexplored shroud.
		# The previous 1.85 measured ~6.4% and was visually indistinguishable from shroud, which
		# defeated the separation goal — verified via Test.KeepRenderPlayer captures at 1 / 1.4 / 1.85.
		# Fully visible ground is visibility 10, draws no fog layer at all, and is unaffected.
		FogDarkness: 1.4
	Faction@randomside:
		Name: Any Side
		InternalName: Random
		RandomFactionMembers: america, russia
		Side: Random
		Description: Random Side\nOne of the playable factions is chosen at random when the game starts.
	Faction@0:
		Name: America
		InternalName: america
		Description: America\nNATO's lead power. Precision airpower, networked armour and air cavalry: fewer units, costlier, striking first and at range.
	# Faction@1:
	# 	Name: Ukraine
	# 	InternalName: ukraine
	# 	Side: NATO
