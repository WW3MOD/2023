World:
	Inherits: ^BaseWorld
	# AI tournament harness — silently no-op unless launched with both
	# Test.Mode=true AND Test.TournamentConfig=<path>. See
	# WORKSPACE/plans/260511_ai_tournament_harness.md
	BotVsBotMatchWatcher:
	# Behavior-lint per-unit lifecycle logger. Silently no-op unless launched with
	# both Test.Mode=true AND Test.UnitLifecycleLog=<true|path>. Emits a JSONL event
	# stream (meta/spawn/order/idle/death/end) for tools/behavior-lint. Observation-
	# only — never affects the simulation. See WORKSPACE/behavior-lint-spec.md.
	UnitLifecycleLogger:
	# Universal Test.SpeedMultiplier apply for non-tournament test runs.
	# No-op unless Test.Mode=true + Test.SpeedMultiplier>1 + no tournament config.
	TestModeSpeedMultiplier:
	ScenarioLobbyDropdown:
	# Runs time-varying local light events (LightEventWarhead from any weapon, TimedLightSource from any
	# actor). World-only rather than in ^BaseWorld because it is ITick and the editor world does not tick.
	# Idle cost is one early-out per tick; nothing in the mod emits an event yet.
	LightEventManager:
	# Runs local heat-haze events -- a screen-space refraction shimmer over hot air (HeatEventWarhead
	# from any weapon, TimedHeatSource from any actor). Same keyframe-envelope vocabulary as
	# LightEventManager above, with distortion strength in place of intensity.
	#
	# THIS IS THE MOD'S FIRST IRenderPostProcessPass, so it is worth being exact about what it costs
	# when nothing is burning: WorldRenderer.ApplyPostProcessing (WorldRenderer.cs:393-402) tests
	# `pass.Type != type || !pass.Enabled` and CONTINUES -- before Game.Renderer.Flush(), before
	# WorldBufferSnapshot() and before any draw call. Enabled is `Tracker.ActiveDraws.Count > 0`, a
	# list length. So an idle map pays one enum compare and one list-length read, three times a frame,
	# and no fullscreen work whatsoever. HeatEnvelopeTest pins that the list really is empty when
	# nothing is hot -- including mid-event, while an envelope passes through zero strength.
	#
	# World-only rather than in ^BaseWorld because it is ITick and the editor world does not tick.
	HeatHazeRenderer:
	HealerClaimLayer:
	UnitDefaultsManager:
	# Right-click a capturable structure with NOTHING selected and the nearest free technician is
	# sent at it; select several structures and press Deploy (F) to spread the free technicians
	# across them. Only units whose Captures trait does NOT set CaptureToNeutral are dispatched,
	# which is what keeps riflemen — who merely neutralise a building — out of it.
	CaptureDispatchManager:
	# PIPELINE 5 cohesion stance identities (human-facing; bot moves stay byte-identical).
	# DP-2 SpreadHuman* = hand-tuned 'dispersed' interval (NOT weapon-AoE-derived); DP-3
	# LooseHumanCoverSearchRadius = widened cover-first search for Loose. Defaults live in
	# CohesionMoveModifierInfo; surfaced here so they are tunable in one place.
	CohesionMoveModifier:
		SpreadHumanColSpacing: 4096
		SpreadHumanRowSpacing: 3072
		LooseHumanCoverSearchRadius: 4
	ThreatMapManager:
		CellSize: 8
		UpdateInterval: 90
		SpreadFactor: 0.3
	# WW3MOD doctrine layer (Stage A.1): denser per-cell influence grid
	# with frontline derivation. See WORKSPACE/ai/doctrine.md +
	# WORKSPACE/ai/stage_a_frontline_perception.md.
	InfluenceMap:
		CellSize: 2
		UpdateInterval: 25
		# Each unit's influence reaches 5 grid cells (10 map cells) in every direction
		# with linear falloff. Tuned so a defensive line and an attacker that are still
		# 15-20 cells apart already register a contested band — that's when the
		# doctrine considers them "in contact", not when they're shooting at each
		# other. Larger = more sensitive overlay; smaller = sharper band only when
		# units are right on top of each other.
		ContributionRadius: 5
	# Stage A.3: in-game debug overlay for the InfluenceMap frontline.
	# Toggled via chat command "/frontline" — hotkey wiring is Stage A.4.
	FrontlineOverlay:
	# POI-strategy Phase 2: strategic point-of-interest layer. Discovers money
	# capturables + neutral/enemy Supply Routes (deny targets) and scores them
	# per-player by value x distance x threat (threat sampled from InfluenceMap
	# above). Queried only by the Experimental/Stable AI modules (CaptureCoordinator
	# target ordering; offense) — Normal/Rush/Turtle never read it, so this trait's presence
	# doesn't change their behaviour. Income weights mirror the CashTrickler
	# amounts (OILB 50 / FCOM 100 / BIO 150) used by CaptureCoordinatorBotModule.
	# See WORKSPACE/plans/260719_experimental_ai_poi_strategy.md.
	PoiMap:
		# PITFALL: only list structures that actually have CashTrickler — a $0
		# building here outbids real income POIs and wastes the capturer.
		IncomeWeights:
			oilb: 50
			fcom: 100
			bio: 150
			miss: 10
			hosp: 20
		SupplyRouteDenyValue: 120
		DistanceHalfLifeCells: 20
		ThreatMildThreshold: 20
		ThreatSafeMultiplier: 100
		ThreatMildMultiplier: 40
		ThreatHostileMultiplier: 10
		OwnershipNeutralIncomeMultiplier: 100
		OwnershipEnemyIncomeMultiplier: 70
		OwnershipEnemySupplyRouteMultiplier: 100
		OwnershipNeutralSupplyRouteMultiplier: 70
		DiscoveryInterval: 50
	# --- Strategic/tactical split, Phase 1 ---
	# Spec: WORKSPACE/plans/260722_strategic_tactical_split_SPEC.md (§3a/§3b/§3d).
	# Pure data + render: NOTHING consumes these for behavior yet. The overlay is
	# the verification tool — eyeball layer correctness before Phase 2 consumes them.
	# §3a: per-player, FOG-RESPECTING sighting/threat field, built from each player's
	# own vision + FrozenActorLayer (unlike the omniscient InfluenceMap/ThreatMapManager).
	SightingThreatLayer:
	# §3b: static per-cell cover quality + cover-edge orientation, computed once at map
	# load from Map.DensityLayer (same cover substrate CohesionMoveModifier reads).
	TerrainAffordanceLayer:
	# §3d: hold-Space intel overlay — balance-of-power wash (green=friendly, red=enemy,
	# gray=computed grayzone) + last-seen enemy GPS dots. Reads ONLY the viewing player's
	# own §3a layer + frozen actors, so it leaks nothing through fog. Ships as hold-Space;
	# "/intel" chat command toggles a dev always-on switch.
	SightingIntelOverlay:
	# Phase 3 role-resolver (data-only): classifies every actor into a coarse UnitRole
	# once at map load; O(1) queries thereafter. Pure ruleset inspection — no RNG, no
	# orders, no sim state — so registering it is behaviour-inert for every profile.
	# NOTHING consumes it yet (Phase-4 consumers gate behind their own UseUnitRoles flag).
	# Design: WORKSPACE/plans/260722_unit_role_resolver_DESIGN.md.
	UnitRoleResolver:
	# --- Influence stack, Stage A ---
	# Design: WORKSPACE/plans/260722_influence_stack_design.md (§2A).
	# Per-player believed-enemy-contact memory: sight → persist-with-decay → verified-clear.
	# Built from own vision + FrozenActorLayer (same fog-legal substrate as SightingThreatLayer),
	# generalising frozen structures to mobile units. Pure data: NOTHING consumes it for
	# behaviour. Registering it is behaviour-inert for every profile (@stable + control bots
	# never read it) — only Stage-B danger fields and the later human overlay ever will.
	BeliefStore:
	# --- Influence stack, Stage B ---
	# Design: WORKSPACE/plans/260722_influence_stack_design.md (§2B).
	# Per-player anti-ground + anti-air danger fields, stamped from the belief store above.
	# Kernels read from actual armament data (range → radius, damage×durability×confidence →
	# intensity). Air channel keys off "can hit an airborne target" (Helicopter or Air).
	# Baseline territory projection is now wired to the Stage-C control field below. Pure data:
	# NOTHING consumes it for behaviour,
	# so registering it is inert for @stable + control bots — only Stage-C consumers will read.
	DangerFieldLayer:
	# --- Influence stack, Stage C ---
	# Design: WORKSPACE/plans/260722_influence_stack_design.md (§2C/§2D).
	# Per-player believed-territory (control) field: Voronoi-seeded full-map ownership with
	# capture/persistence/grayzone semantics + Supply-Route/derrick anchors. Feeds the danger
	# field's territory baseline and the overlay below. Pure data — @experimental + human-overlay
	# only (narrowed via InfluenceStack); @stable + control bots never read it (byte-identical).
	ControlField:
	# frontline-influence Phase 0: terrain/reachability model (per-locomotor connected components +
	# repairable-bridge crossings + amphibious-crossable component pairs). Computed LAZILY on first
	# request from a participating @experimental/@stable bot; @stable-off/normal/human games never
	# build it, so it is byte-identical (inert data, zero RNG, no per-tick work until first query).
	CrossingMap:
	# Stage-C dev commander's overlay: tri-state danger safety (green/red/gray) + air-channel
	# toggle + control-field secondary wash. Render-only (reads the viewer's own layers, leaks
	# nothing through fog). OFF by default — cycled by the "/danger" dev chat command; never
	# ships on hold-Space. No simulation state depends on this render path.
	DangerOverlay:
	# Stage-C PLAYER-FACING territory overlay: first-class red/green/gray control wash + diagonal
	# staleness stripes (intensity ∝ ticks since a cell was last observed). Render-only (reads the
	# viewer's own ControlField, leaks nothing through fog). Ships as a dedicated HOLD-KEY (T) —
	# separate from hold-Space so it does not z-fight the SightingIntel wash; "/territory" forces it
	# on for dev/screenshots. No simulation state depends on this render path (byte-identical sim).
	TerritoryOverlay:
