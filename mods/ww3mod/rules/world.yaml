	TimeLimitManager:
		# "Time Limit" (user ruling, 2026-09-10). This is the THIRD name in a day -- Doomsday, then
		# Dead Hand, now this. At zero every surviving side is handed its game-enders and thirty
		# seconds to pick targets (DoomsdayStrike.FinalExchangeWindowTicks, raised from fifteen on
		# 2026-09-16), and only what nobody aimed in that window is aimed by the machine.
		#
		# CORRECTED 2026-09-13. This paragraph used to justify the rename with "THE AUTO-LAUNCH WAS
		# REMOVED. Nothing here fires by itself any more", and that was PROSE ONLY -- there was no
		# window in the code, and the time limit ran a fully automatic salvo. The window exists now,
		# so those seconds are real for the first time. The conclusion drawn from them was
		# always too strong either way: Dead Hand still places every warhead nobody claimed, which
		# is exactly the machine "dead hand" names.
		#
		# This rename REMOVES a divergence rather than adding one: the trait is TimeLimitManager
		# and the field is TimeLimitLabel, so label and symbol now agree. The CHECKBOX is the half
		# that still disagrees deliberately -- see DoomsdayStrike.cs's label field for why the
		# `doomsday` option id must not follow the copy.
		TimeLimitLabel: Time Limit
		TimeLimitDescription: How long the match runs before it is decided
		# Match block: Game Speed (10), this (11), then the Nuclear ending checkbox (12) which decides
		# what happens when this clock reaches zero. The two were previously in different
		# sections at opposite ends of the panel despite being one feature.
		TimeLimitDisplayOrder: 11
		# The expiry notification is DoomsdayStrike's to give: "Time limit has expired." undersells
		# what is about to happen and lands one line above "DEAD HAND ACTIVATED. Incoming."
		SkipTimerExpiredNotification: true
		TimeLimitWarnings:
			40: FourtyMinutesRemaining
			30: ThirtyMinutesRemaining
			20: TwentyMinutesRemaining
			10: TenMinutesRemaining
			5: WarningFiveMinutesRemaining
			4: WarningFourMinutesRemaining
			3: WarningThreeMinutesRemaining
			2: WarningTwoMinutesRemaining
			1: WarningOneMinuteRemaining
	ColorPickerManager:
		PreviewActor: e3.colorpicker
	# DOOMSDAY. The lobby has said "Doomsday Clock / Nuclear apocalypse when the clock runs out" since
	# long before anything implemented it; this is what makes that true. It REPLACES the plain
	# time-limited game rather than sitting beside it — there is no separate "time limit" concept left
	# in the UI to coexist with, and a mode selected by two dropdowns that must agree is a worse lobby
	# than one. The checkbox exists so a host can get the old score-comparison ending back, and defaults
	# ON so that the shipped label is not lying by default.
	#
	# TIMED AUTOTESTS AND TOURNAMENTS ARE UNAFFECTED: RunInTestMode defaults false, so a TestMode
	# session with a time limit still ends the way it always did. The demo scenario opts in explicitly.
	DoomsdayStrike:
		OutlierMissile: deadhandtacticalmissile
		CityMissile: deadhandstrategicmissile
		# 14c0, just inside `Atomic`'s ShockwaveDamage MaxRadius of 15c0 — the ~2.7 psi contour, the
		# outer edge of serious structural damage (weapons-superweapons.yaml). It used to be 20c0, read
		# off the delivery body's claim of igniting structures to ~28 cells, and it was set high
		# because the whole total-coverage guarantee rested on it. IT NO LONGER DOES: the fill pass
		# that consumed this number is gone (2026-09-07 retune), so all this now governs is the jitter
		# bound and how far a city's warheads may spread from its centroid. Stating it against the
		# blast contour rather than the ignition one is the honest reading now that nothing downstream
		# is generating warheads from it.
		LethalRadius: 14c0
		JitterRadius: 4c0
		# 10c0, DOWN FROM 12c0, and it is not a taste change: it must be <= LethalRadius - JitterRadius
		# (14 - 4 = 10) or the separation filter can drop a derrick and leave it outside every blast.
		# The old 12 was safe only because the lethal radius was 20 and the fill pass covered the rest.
		MinSeparation: 10c0
		CityLinkDistance: 8c0
		CityMinBuildings: 4
		# ONE per city, not two. river-zeta clusters into exactly two cities once crop fields and trees
		# stop being counted as buildings, so one warhead each IS the user's "two city destroyers".
		WarheadsPerCity: 1
		SpawnAltitude: 38c0
		ApproachDistance: 5c0
		WithinWaveTicks: 2
		OutlierToCityPauseTicks: 40
		AnnihilationDelayTicks: 90
		ResolutionDelayTicks: 30
		LeadInTicks: 30
		# THE FINAL EXCHANGE WINDOW. 500 ticks = 30.0 s at the mod's 60 ms timestep -- NOT 25 tps,
		# which would read this as 20 s. Written out here rather than left to the C# default because
		# it is the one number in this block a player experiences directly: it is how long they have
		# to place their own warheads before Dead Hand places the rest. Set it to 0 to get the old
		# fully automatic salvo back.
		#
		# RAISED FROM 250 ON 2026-09-16 after the user played Escalation as Russia and fired nothing.
		# Russia's game-ender is the RS-28 Sarmat with AimPoints: 6, so the order is not issued until
		# the SIXTH aim point is placed; America's B83 is one click. Fifteen seconds did not cover
		# notice-the-banner + find-the-cameo + six-clicks, and the whole match turns on that one
		# moment. See DoomsdayStrikeInfo.FinalExchangeWindowTicks for the three alternatives and why
		# none of them is this one.
		FinalExchangeWindowTicks: 500

	# THE TWO PER-POWER NUCLEAR GATES WERE RETIRED ON 2026-09-15 and this block used to describe
	# them. `tactical-nuke` and `high-yield-nuke` each gated exactly one EVENT-TIER power -- a tier
	# (`powers.event`) no faction provides -- so outside `powers-sandbox` neither checkbox decided
	# anything, and inside it the host had to tick two boxes to reach one weapon. Their two
	# DisplayOrder lines (30 and 31) are gone with them. The gates that remain on those powers are
	# the nuclear release ladder's band condition and the event tier itself; see the notes on
	# MissileStrikePower@TacNuke and @HighYieldNuke in player.yaml for what holds each one shut in
	# Skirmish and in Escalation, which are different mechanisms.
	#
	# WHAT THIS MEANS FOR THE ARSENAL SECTION OF THE LOBBY: it now draws the NuclearUnlockClock
	# rows and nothing else. `nuclear-arsenal` and `powers-enabled` are mapped to that section in
	# LobbyOptionsLogic but both are hidden, and the two retired gates were the only Arsenal rows a
	# host actually saw. That is the intended end state of decision 02 -- one set of controls, the
	# four per-tier checkboxes -- not an accident of this change.
	#
	# The trait's airstrike options stay disabled for v1 -- so they are HIDDEN rather than deleted.
	# Hiding is the right lever: the fields keep documenting what the airstrike re-enable will
	# need, `airstrikes` keeps registering with its default so GrantConditionOnLobbyOption@airstrikes
	# resolves the moment that block is uncommented, and nothing in the lobby advertises a feature
	# that is not there.
	# Re-enabling airstrikes post-v1 = flip these two Visible flags back to True and uncomment the
	# AirstrikePower@America/@Russia + GrantConditionOnLobbyOption@airstrikes blocks in player.yaml.
	# See CLAUDE/RELEASE_V1.md (Deferred to v1.1).
	#
	# ==== HIDING IS NOT DELETING, AND HERE THE DIFFERENCE IS THE WHOLE GAME ====
	# `nuclear-arsenal` and `powers-sandbox` are hidden below by the SAME lever, and it is the only
	# safe one. Deleting either option -- or stripping this trait -- does NOT leave the setting at
	# its shipped default; it INVERTS it. GrantConditionOnLobbyOption computes
	#     optionEnabled = OptionOrDefault(Option, !GrantWhenOptionDisabled)
	# (GrantConditionOnLobbyOption.cs:47-48), so THE REGISTERED DEFAULT AND THE UNREGISTERED
	# FALLBACK ARE DIFFERENT VALUES. Both gates use GrantWhenOptionDisabled: true, so an option
	# nobody registered falls back to FALSE, which GRANTS the *-disabled condition:
	#   * `nuclear-arsenal` gone -> `nuke-arsenal-disabled` granted -> ALL 13 GATED POWERS VANISH
	#     (10 in rules/ingame/nuclear-arsenal.yaml, plus @B61Mid, @Kinzhal and @GBU57 in
	#     player.yaml -- the last two CONVENTIONAL weapons riding a checkbox labelled "Nuclear
	#     Arsenal").
	#   * `powers-sandbox` gone -> `powers-sandbox-disabled` granted -> the three unfiltered
	#     ProvidesPrerequisite traits switch off -> `powers.event` is provided by no faction, and
	#     the 8 autotest scenarios that set PowersSandboxCheckboxEnabled: true break at their FIRST
	#     assertion, because what they override is the REGISTERED default.
	# Visible: False touches none of that. LobbyCommands.LoadMapSettings (:1382-1410) registers
	# every option ILobbyOptions yields with no visibility test at all; IsVisible is read in exactly
	# one place, LobbyOptionsLogic.cs:400, which decides whether to draw a ROW. Option registered,
	# default intact, behaviour unchanged, row gone. Same pattern as airstrikes/shortgame/techlevel.
	PowersLobbyOptions:
		AirstrikeCheckboxVisible: False
		AirstrikeCheckboxDisplayOrder: 81
		AirstrikeCooldownVisible: False
		AirstrikeCooldownDisplayOrder: 82
		# 30-33 is the Arsenal section in LobbyOptionsLogic. 30 and 31 belonged to the tactical and
		# high-yield gates and were freed when those were retired (2026-09-15); 33 is the
		# (unimplemented) powers master switch. The C# default for the line below is 104, which
		# predates the sections and would scatter it down the panel.
		NuclearArsenalCheckboxDisplayOrder: 32
		# HIDDEN, NOT REMOVED -- read the block comment above before touching this. The arsenal
		# stays ON (NuclearArsenalCheckboxEnabled defaults true) and all 13 powers stay reachable;
		# the host simply no longer gets a row to switch them off with. The DisplayOrder above is
		# retained so un-hiding is a one-line change back to True.
		NuclearArsenalCheckboxVisible: False
		# Sandbox is deliberately NOT an Arsenal option: it does not decide which weapons exist,
		# it suspends the faction rules governing who may buy them. It sorts into Developer (62)
		# with the other testing switches.
		PowersSandboxCheckboxDisplayOrder: 62
		# HIDDEN, NOT REMOVED -- and this one is load-bearing for the test suite. Sandbox stays
		# registered and OFF by default, so a normal match is faction-locked exactly as before,
		# and the scenarios that turn it on in their own rules.yaml keep working. Deleting the
		# option would take `powers.event` away from them; hiding it does nothing to them at all.
		PowersSandboxCheckboxVisible: False

	# SKIRMISH'S NUCLEAR UNLOCK CLOCK -- the two dropdowns that decide WHEN each yield band comes up
	# for sale, and the only thing that makes the lobby timeline's amber band true.
	#
	# WHAT IT FIXES. The timeline draws `NUCLEAR WEAPONS PURCHASABLE` from ten minutes in. Before this
	# trait was registered that band was FALSE in Skirmish -- the default mode -- because every
	# buy-tier nuclear power is gated on `Prerequisites: powers.america` / `powers.russia`, a faction
	# gate with no time component anywhere, so nukes were on sale from the first second. Decision 22:
	# the user chose to build the clock rather than trim the bar.
	#
	# IT GRANTS NOTHING AND GATES NOTHING BY ITSELF. GrantConditionOnNuclearRelease on the Player
	# actor (rules/player.yaml) reads the released rung and grants the SAME band conditions Escalation
	# grants, which every nuclear power already names in its own RequiresCondition. That is why no new
	# prerequisite was needed: per-rung gating was already in YAML, and only the source of the rung
	# is new.
	#
	# REGISTERING IT IS THE WHOLE BEHAVIOUR CHANGE, AND REMOVING IT IS THE WHOLE REVERT. A missing
	# trait reads as "every band released", so a map or scenario that strips it gets the pre-clock
	# Skirmish match back with no other edit.
	#
	# DEFAULTS ARE C# AND ARE DELIBERATELY NOT OVERRIDDEN HERE: 10 minutes, and all four tiers
	# purchasable. The interval default matches what the bar draws; whether 5-7 minutes plays better
	# is decision 16's OPEN QUESTION and is the user's to answer from the lobby, not a value to tune
	# here.
	#
	# THE SINGLE `nuclear-highest-yield` CAP DROPDOWN IS GONE (decision 02, 2026-09-13) and is four
	# per-tier checkboxes instead -- a host can switch off 20 kt and leave 1 kt and 50 kt on, which no
	# cap could express. Game-enders still have no checkbox and are never purchasable by user ruling
	# (decision 17.3); NuclearUnlockSchedule.HighestPurchasableRung enforces that in code, so adding
	# one here could not open that band either.
	#
	# NONE OF IT APPLIES IN ESCALATION, where nothing nuclear is purchasable at all: a band there is a
	# free power on a regeneration timer and the host controls only the timing (decision 02).
	NuclearUnlockClock:

	# ESCALATION -- the match-wide alert level, and the four dropdowns that configure it.
	# The player-actor half (DefconCasualtyObserver, GrantConditionOnDefconLevel) is in player.yaml.
	#
	# MarkAsPlaceholder IS NOW FALSE IN C# AND THIS COMMENT USED TO SAY TO FLIP IT "on the change
	# that lands the first consumer". That instruction was already stale when it was read: the
	# consumers landed months ago -- the readout draws the level, the phase and the clock on screen,
	# and DefconWall divides all ten shipped maps. What actually kept the flag set was decision 12's
	# narrower argument, that the three pace durations were self-declared untuned guesses so the
	# pace dropdown offered three choices nobody had felt the difference between. THAT dropdown no
	# longer exists: a host sets the no-rush period in minutes. Nothing here overrides the flag.
	#
	# THE DEFAULT GAME MODE IS Skirmish AND MUST STAY THAT WAY UNTIL THE FEATURE IS COMPLETE.
	# Skirmish is a strict no-op: no level, no conditions, no clock. It is what lets this land in
	# pieces without anything changing for someone testing from main. The default lives in
	# DefconEscalationInfo.ModeDefault and DefconEscalationTest.SkirmishIsAStrictNoOp guards it.
	#
	# THE DROPDOWN OFFERS TWO MODES, NOT THREE, SINCE 2026-09-19. Sandbox was the third and is now a
	# developer opt-in only, set with `ModeDefault: Sandbox` in a map or scenario's rules -- nothing
	# in this mod sets it. It is not a mode a host picks between: its whole content is "pin the
	# level and never escalate", and until the same day the fire rules keyed on the level alone, so
	# a Sandbox match taken at the shipped Start At (3, Positioning) was a match in which no weapon
	# could fire at all, for its whole length. DefconFireDiscipline is gated on the mode now as well
	# as the level, so the mode is harmless as well as hidden. Do not re-add it to the list here
	# without reading the comment on the mode dictionary in DefconEscalation.cs -- the entry is
	# admitted when ModeDefault names it, and a hand-added one would make the default and the list
	# two separate statements of the same thing.
	#
	# Only the 3 -> 2 transition is on a clock and the No-rush period sets it; 2 -> 1 fires the
	# moment enemy action destroys anything, whatever that clock says. The second clock, First
	# warheads, runs from DEFCON 1 to the nuclear release gate. Both are lobby dropdowns in MINUTES
	# and their defaults live in C# (5 and 10), so the first person to tune them changes one place.
	# Both convert through NuclearUnlockSchedule.TicksForMinutes and NOT through TimeLimitManager's
	# `1000 / Timestep`, which is integer division and runs 4% short.
	#
	# 21-25 is the Escalation section in LobbyOptionsLogic, in the order a match reaches them, and
	# it spans TWO TRAITS: the three phase dropdowns here and the exchange's two below. The block
	# used to start at 20 and open with Game mode; that dropdown moved into Match (9) on
	# 2026-09-15, leaving this section phase controls only -- which is what lets its header be
	# hidden wholesale outside Escalation instead of drawing over a lone mode selector.
	DefconEscalation:
		# 9, AHEAD OF Game Speed (10): Game mode moved into the MATCH block on 2026-09-15 and leads
		# it. It was 20, the head of the Escalation block, which left the ESCALATION header drawing
		# over a lone Game mode dropdown in Skirmish -- a section captioned for phases, containing
		# only the control that says there are none. Match is where it belongs: it is the first
		# question a host answers about the match, and Escalation now holds phase controls only,
		# so that header draws only when there ARE phases.
		ModeDisplayOrder: 9
		StartAtDisplayOrder: 21
		NoRushDisplayOrder: 22
		FirstWarheadsDisplayOrder: 23

	# THE NUCLEAR EXCHANGE -- what each SIDE may fire in Escalation, and the retaliation window a
	# side gets for being shot at. Strict no-op in Skirmish and Sandbox, where the bands come from
	# NuclearUnlockClock's schedule above instead.
	#
	# DEFAULTS ARE C# AND ARE DELIBERATELY NOT OVERRIDDEN HERE: Flexible posture (the shipped
	# cooldowns, unscaled) and a three-minute retaliation window. Both are UNTUNED PLACEHOLDERS in
	# C# and are the user's to answer from the lobby, not values to tune here.
	NuclearExchange:
		PostureDisplayOrder: 24

	# THE DEFCON 3 DIVIDING WALL, AND IT IS NOW LIVE ON EVERY SHIPPED MAP. This block used to be
	# registered with no configuration at all, which made the wall inert everywhere -- and that
	# became a correctness problem the moment the readout shipped, because at DEFCON 3 it tells the
	# player "The border is closed. Neither side may cross it." while nothing enforced it.
	#
	# DERIVED, NOT AUTHORED. No map draws a line. DeriveFromSpawns splits the match's combatants
	# into their two alliance groups, takes each group's centroid home, and uses the perpendicular
	# bisector -- so the line is equidistant from both sides by construction on any map, including
	# the 4- and 6-spawn ones where which spawns are occupied is not known until the match starts.
	# An explicitly authored Start/End still WINS over the derivation, which is what makes this an
	# override list rather than per-map authoring: the one worked example is
	# tools/autotest/scenarios/test-defcon-wall/rules.yaml, and no shipped map needs an entry.
	#
	# Still inert in Skirmish, which is still the default game mode: the wall stands only at
	# DEFCON 3 and Skirmish holds NoLevel. Nothing here changes a Skirmish match.
	DefconWall:
		DeriveFromSpawns: True
		# THE BORDER HAS TO BE SEEN, and until this landed it could not be. DefconWall writes
		# Map.CustomTerrain, and CustomTerrain is read by Map.GetTerrainIndex (pathfinding,
		# GrantConditionOnTerrain) and by NOTHING in the terrain draw: TerrainRenderer subscribes
		# only to Map.Tiles and Map.Height (TerrainRenderer.cs:92-93) and renders from Map.Tiles.
		# So the wall sealed the map while the map's own grass stayed on screen, and the readout's
		# "The border is closed" pointed at nothing. The trait now draws it itself.
		CrossingRefusedTextNotification: notification-defcon-border-closed
	OrderEffects:
		TerrainFlashImage: moveflsh
		TerrainFlashSequence: idle
		TerrainFlashPalette: moveflash

