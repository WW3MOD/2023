		# ArtilleryRound 1000, Ataka 900, Hellfire 800, RPG 500); only the two ballistic-missile
		# explosions omitted it. 2500 clears the thickest armour in the game -- MSLO at 2000, which
		# carries no Distribution and so is never discounted by hit direction -- and matches the
		# value already used by Warhead@Spread_impact below.
		Penetration: 2500
		# Spread (260827): was UNSET. TargetDamageWarhead.Spread defaults to WDist(1), ONE world
		# unit, where a cell is 1024 -- so the direct-hit bonus only ever reached a victim whose
		# hitshape the missile landed inside. Half a cell makes it the lethal core of the blast.
		Spread: 512
