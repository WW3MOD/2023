# ---------------------------------------------------------------------------
# Volatile cargo — banded death explosions for supply and ammo carriers.
#
# Fired by the Explodes@Band* traits on TRUK, SUPPLYCACHE, LOGISTICSCENTER, grad,
# m270 and HIMARS. The band is picked by a RequiresCondition comparison against a
# stacked condition count (supply-level / ammo-primary), so which of these fires is
# decided entirely in the actor YAML — see VolatileLoadBandTest for the partition.
#
# THE VISUAL AND THE DAMAGE ARE DELIBERATELY DECOUPLED, and the split is the whole
# point of this weapon family. Per the ruling of 2026-08-21 these are a SPECTACLE,
# not an area-denial weapon:
#
#   * MaxRadius drives how far the WAVE travels, and it stays wide — band 8 still
#     sweeps four cells. ShockwaveEffect.Tick uses it purely to bound the wave's
#     expansion (ShockwaveEffect.cs:60-66).
#   * ShockwaveVisualRadius drives how far the RING IS SEEN to travel, and since
#     2026-08-30 it is 60% of MaxRadius in every band — the user found the loaded
#     truck's ring too large. The ring stops and completes its fade there; the wave
#     keeps going invisibly.
#   * Spread x Falloff.Length drives how far the ring HURTS, and it is short.
#     ShockwaveDamageWarhead builds effectiveRange as i * Spread, independent of
#     MaxRadius (ShockwaveDamageWarhead.cs:80), and returns NO damage at all past
#     the last step rather than clamping to it (:130). So a tight Spread with a
#     steep Falloff gives a hard cutoff, not a long tail.
#
# Net damage radius is min(MaxRadius, (Falloff.Length - 1) * Spread), because the
# wavefront also has to physically reach an actor to damage it. The shockwave dies
# at 1364 (1.33 cells) and the blast at 1024 (1 cell); bands 1-2 are tighter still
# because their MaxRadius binds first.
#
# THAT IDENTITY IS WHY THE 60% CUT IS NOT A MaxRadius EDIT. MaxRadius is the smaller
# term in bands 1-4, so scaling it would have taken those four bands' lethal radius
# down with the picture — 512->307, 1024->614, 1364->922, 1364->1229 — while bands
# 5-8 kept theirs. A visual request would have become a silent, uneven nerf. Every
# MaxRadius below is therefore UNCHANGED and only the new visual field moved;
# ShockwaveTuningTest pins both halves of that. If you are ever tempted to
# shrink a ring by editing MaxRadius, re-read this paragraph first.
#
# Calibrated against 200 HP infantry: standing on the carrier is fatal in every
# band, a cell away is a survivable scratch, and beyond ~1.33 cells it is exactly
# zero. VEHICLES CONSEQUENTLY TAKE VERY LITTLE — a full carrier removes about 5%
# of an Abrams. That is the intended outcome of the ruling, not a miscalibration;
# do not "fix" it by raising these numbers.
#
# AffectsParent and the absence of any relationship filter match IskanderExplosion
# exactly: these blasts hurt nearby FRIENDLY units, confirmed as intended.
# ---------------------------------------------------------------------------

^VolatileLoadEffects:
	ValidTargets: Ground, Trees, Water
	Warhead@Smudge: LeaveSmudge
		SmudgeType: Crater
		InvalidTargets: Structure, Wall, Trees
	Warhead@Scorch: LeaveSmudge
