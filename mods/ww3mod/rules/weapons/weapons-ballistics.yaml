12.7mm.Hind.AA:
	Inherits@Caliber: ^12.7mm
	# Hind's last-resort air-to-air mount (260815). The user's constraint was
	# explicit: usable, but "not nearly as good as an attack helicopter".
	#
	# Deliberately seated ABOVE the littlebird's minigun (heavier round, and the
	# Hind is a 4000-credit gunship rather than a 3000-credit scout) and far
	# BELOW anything built for the job. Versus an 800hp Apache:
	#   Stryker SHORAD Stinger  ~1 hit          (5000 dmg, Pen 20)
	#   AA Specialist MANPAD    ~1 hit          (3000 dmg, Pen 15)
	#   Apache's own Hellfire   sub-second      (~2000 via the spread fallback)
	#   Hind 12.7mm.Hind.AA     ~4s at 2 cells, ~14s at 8, ~73s at 12
	# The Hind carries 150 rounds — 18s of continuous fire, helipad-only reload —
	# so downing one attack heli costs it its entire magazine at knife range,
	# having done nothing else that sortie. That is the "last resort" shape.
	ValidTargets: Helicopter
	Burst: 8
	BurstDelays: 2
	BurstWait: 10
	Projectile: Bullet
		Speed: 1c0
		Inaccuracy: 0c640
		LaunchAngle: 0,15
	-Warhead@Target:
	Warhead@Air: SpreadDamage
		Spread: 32
		Damage: 300
		Penetration: 5
		DamageAtMaxRange: 50
		ValidTargets: Helicopter
		DamageTypes: BulletDeath
	Warhead@AirEffect: CreateEffect
		ValidTargets: Helicopter
		ImpactActors: false

