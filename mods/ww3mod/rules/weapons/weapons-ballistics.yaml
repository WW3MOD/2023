7.62mm.Minigun:
	Inherits@Caliber: ^7.62mm
	Inherits@HitEffects: ^PiffsEffects
	# GROUND ONLY as of 260815. Helicopter moved to 7.62mm.Minigun.AA so the
	# anti-air ceiling can be tuned without touching strafing performance. See
	# that weapon for why the split was necessary rather than tidy.
	ValidTargets: Infantry, Unarmored
	Range: 8c0
	Burst: 20
	BurstDelays: 1
	BurstWait: 5
	Projectile: Bullet
		Speed: 1c0
		# 0c64 is already sub-1/16-cell scatter at max range; tightened once more
		# for visible tracer convergence. NOTE: raw scatter was never the reason
		# this gun felt inaccurate — see DamageAtMaxRange below, which is.
		Inaccuracy: 0c48
		# InaccuracyPerProjectile removed 260815: Bullet.cs gates it behind
		# `lastPosIsSet`, a readonly field initialised false and never assigned
		# (Bullet.cs:170,213), so the whole branch is unreachable. It was inert.
		Image: tracer_large
	Warhead@Target: TargetDamage
		# AttackType: Hover parks the littlebird at exactly max range, which is
		# precisely where DamageAtMaxRange 50 halved every round — the gun was
		# weakest at the only range it ever fought from. 75 softens that cliff.
		DamageAtMaxRange: 75
		ValidTargets: Infantry, Unarmored
	Warhead@Spread: SpreadDamage
		Spread: 32
		Damage: 200
		ValidTargets: Infantry, Unarmored
		DamageTypes: BulletDeath

7.62mm.Minigun.AA:
	Inherits@Caliber: ^7.62mm
	Inherits@HitEffects: ^PiffsEffects
	# Littlebird's last-resort air-to-air mount (260815). Follows the Tunguska
	# 30mm.Tunguska.AG / .AA split (see :449-460) — and finally gives the
	# littlebird's AmmoPool@1 the `primary-air` armament it has referenced, and
	# silently failed to match, since the actor's first commit.
	#
	# THIS WEAPON IS A NERF, NOT A BUFF. The base minigun could already target
	# Helicopter, and modelling the real pipeline showed it killing an Apache in
	# 2.7s at max range — faster than the DEDICATED Tunguska AA gun (13.6s),
	# because a heli hitshape is Circle Radius 32 and accuracy dominates
	# everything at that scale. A 3000-credit scout outshooting purpose-built AA
	# is the opposite of the intent, so the AA mount trades that away:
	#   Inaccuracy 0c512 (8x looser) — a light minigun hosing at a jinking heli.
	#   Damage 150 / Penetration 4  — vs Heavy heli Thickness 20 that is 20%.
	# Net vs an 800hp Apache: ~9.6s at 4 cells, ~48s at 8. The littlebird carries
	# 160 rounds = 7.7s of continuous fire and cannot reload outside a helipad,
	# so it physically CANNOT finish an attack heli on one load. The ceiling is
	# structural, not a number someone has to remember to keep low.
	ValidTargets: Helicopter
	Range: 8c0
	Burst: 20
	BurstDelays: 1
	BurstWait: 5
	Projectile: Bullet
		Speed: 1c0
		Inaccuracy: 0c512
		Image: tracer_large
	-Warhead@Target:
	Warhead@Air: SpreadDamage
		Spread: 32
		Damage: 150
		Penetration: 4
		DamageAtMaxRange: 50
		ValidTargets: Helicopter
		DamageTypes: BulletDeath
	Warhead@AirEffect: CreateEffect
		ValidTargets: Helicopter
		ImpactActors: false

