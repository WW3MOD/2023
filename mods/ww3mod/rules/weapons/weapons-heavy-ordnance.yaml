# ============================================================================================
# HEAVY ORDNANCE -- the complete roster of weapons that can destroy a neutral tech building,
# and the only file that grants either of the two properties that make that possible.
#
# READ THIS FIRST IF YOU ARE ADDING A WEAPON. The heavy/light split is a DECLARED CLASS, not a
# damage table you have to reverse-engineer. A weapon is heavy if and only if it appears below.
# There is no threshold to clear and no number to beat: a 10-damage popgun listed here would
# chip a derrick, and a 165000-damage bunker buster not listed here would do literally nothing
# to one. If your new weapon should end economy structures, add a Warhead@TechStructure block
# here. If it should not, do nothing -- default-deny is the whole design.
#
# ---------------------------------------------------------------------------------------------
# THE TWO PROPERTIES, AND THEY NO LONGER TRAVEL TOGETHER
#
# 1. `ValidTargets: TechStructure` -- permission to do damage at all. ^TechBuilding
#    (rules/ingame/structures.yaml:193-194) drops `Ground` and `Structure` from its Targetable and
#    carries `TechStructure` instead, and Warhead.IsValidAgainst requires an overlap
#    (Warhead.cs:57). A warhead without this line cannot touch one, splash included. EVERY block
#    below carries it -- that is what makes this file the roster.
#
# 2. `DamageTypes: ..., HeavyOrdnanceDeath` -- permission to make the loss PERMANENT. Every tech
#    structure's SpawnActorOnDeath carries `ExcludedDeathTypes: HeavyOrdnanceDeath`
#    (structures-neutral.yaml:65, :100, :134, :179, :208), so a death carrying that type leaves no
#    husk and therefore nothing for an engineer to infiltrate and restore. ONLY THE NUCLEAR BLOCKS
#    BELOW CARRY IT.
#
# NOTHING OBLITERATES AN ECONOMY STRUCTURE -- user ruling 2026-09-11, which superseded a narrower
# ruling made the same day and rejected its premise rather than answering it:
#
#   "Actually, I think it is a bad game mechanic that money structures can be destroyed. Maybe
#    nothing can fully obliterate them, so nuke also only destroys them, and can do so further out
#    than the inner fireball but not beyond 2-3x the fireball or so."
#
# Two words, held apart throughout this file: OBLITERATE means gone, no wreck, nothing to restore.
# DESTROY means killed, leaving the repairable husk. Nothing in the mod obliterates one any more;
# the nuclear tier destroys them further out than the conventional tier, and that is the whole of
# the difference between the two.
#
# So property 2 above is now satisfied by NOBODY, and this file grants ONE property rather than
# two. `HeavyOrdnanceDeath` no longer appears on any warhead here, and the tech buildings no
# longer carry `ExcludedDeathTypes` at all (structures-neutral.yaml) -- the deny-list was removed
# from BOTH ends rather than merely emptied at one, so a weapon that re-declared the damage type
# tomorrow would still leave a wreck. That is deliberate: it makes "nothing obliterates" true by
# construction instead of by convention, and it leaves no armed-but-unfired mechanism for a future
# reader to rediscover and "reconnect".
#
# THE SPLIT THIS FILE ENCODES IS NOW TWO-WAY, and it is about REACH, not permanence:
#
#   cannot touch one   -- everything not in this file. Unchanged, and still the default.
#   destroys it        -- everything in it. All five weapons leave the restorable husk, exactly as
#                         engineer C4 always has. The tiers differ only in how far the lethality
#                         carries: the conventional blocks are point weapons (1-2 cells), the two
#                         nuclear ones reach ~2.5x their own fireball radius. Each nuclear block
#                         shows its own derivation.
#
# THE SECOND OBLITERATION PATH IS ALSO CLOSED, and it is the one that is invisible from this file.
# VaporizeWarhead (engine/OpenRA.Mods.Common/Warheads/VaporizeWarhead.cs) removes actors outright
# inside a fireball radius and deliberately IGNORES ValidTargets entirely (IsValidAgainst, :83-98),
# so it reached the tech buildings with no line here at all -- including from the eleven arsenal
# warheads in weapons-nuclear-arsenal.yaml, which carry no Warhead@TechStructure and could
# therefore obliterate a derrick they could not otherwise scratch (mod.yaml:264-269). ^TechBuilding
# now carries `-Vaporizable:` (structures.yaml), which is the documented per-actor opt-out and the
# same idiom SUPPLYROUTE uses. CLOSING ONLY THIS FILE WOULD NOT HAVE IMPLEMENTED THE RULING: the
# fireball would still have erased them.
#
# NOTE WHAT DID NOT CHANGE: no Damage and no Penetration anywhere in this file. The conventional
# blocks keep their Spread and Falloff untouched as well; only the two nuclear blocks were
# retuned, and that retune is a REACH cap, not a strength change.
#
# ---------------------------------------------------------------------------------------------
# WHY THIS IS A SEPARATE FILE RATHER THAN LINES IN THE FIVE WEAPON FILES
#
# Two reasons, and the second outlives the first.
#   a) `Atomic`, `AtomicHighYield` and `MOPPenetration` live in weapons-superweapons.yaml, which
#      was being rewritten concurrently when this landed. Every block below ADDS a warhead node to
#      an existing weapon and OVERRIDES NO EXISTING FIELD, so the merge (Ruleset.cs:129, over the
#      Weapons list in mod.yaml -- this file is listed LAST) cannot silently revert anyone's edit.
#      Do not "tidy" these into the weapon's own file by rewriting its existing warheads.
#   b) The roster is the point. "Which weapons flatten the economy" is a balance question someone
#      will ask again, and the answer is one `grep -c Warhead@TechStructure` away instead of a
#      sweep of six files' Versus tables.
#
# ---------------------------------------------------------------------------------------------
# WHAT IS DELIBERATELY *NOT* HERE, because ruling things out is half of a class definition:
#
#   HIMARSExplosion  -- the closest call, and the answer is no. It is the tactical MLRS twin of
#                       IskanderExplosion (weapons-explosions.yaml) and shares its shape, but a
#                       HIMARS is a rearmable battlefield rocket system that fires repeatedly.
#                       Listing it would make the economy raidable by ordinary manoeuvre, which is
#                       the failure mode the whole class exists to prevent. The strategic launchers
#                       are different in kind: `himars` and `iskander` both carry ONE load and no
#                       Rearmable at all (economy.md), so an Iskander strike is a spent 6000-credit
#                       unit, not a sortie.
#   EmpBomb          -- disables, does not destroy. Its damage warheads exist to knock out power,
#                       not to demolish, and a structure that comes back when the EMP expires is
#                       not "destroyed" in the sense the user asked for.
#   Everything else  -- tank rounds, ATGMs, artillery, small arms, satchel charges, the volatile
#                       cargo explosions. All unchanged, all still unable to scratch a derrick.
#
#   ENGINEER C4 IS NOT LISTED AND STILL WORKS. `PlaceC4` (weapons-other.yaml:589) reaches these
#   buildings through the `C4` target type, which ^TechBuilding has always carried -- it was the
#   ONLY way to kill one before this feature. It was also the only RECOVERABLE way; as of the
#   2026-09-11 ruling above, every weapon in this file leaves the same wreck C4 does, so C4 is no
#   longer special in either respect. It is simply the cheapest way to destroy one.
# ============================================================================================


# --- THE BALLISTIC MISSILE TIER -------------------------------------------------------------
# One IskanderExplosion ends any one tech building outright: 60000 clears the toughest of them
# (BIO and HOSP at 55000) with margin, so there is no structure in this class that survives a
# ballistic missile and no arithmetic for a player to do. That is the user's request stated
# directly -- "destroyable by powerful weapons, like iskanders".
#
# THIS WARHEAD IS FIRED BY THREE THINGS, all of which are meant to have it:
#   - the `iskander` launcher's missile (IskanderMissile, vehicles-russia.yaml) -- the aimed shot;
#   - the Kh-47M2 Kinzhal strike power (KinzhalMissile reuses this weapon unchanged);
#   - `Explodes@Loaded` on the iskander launcher itself, so a LOADED launcher destroyed next to a
#     derrick takes it with it. That is a real consequence and it is left in deliberately: a
#     6000-credit vehicle full of ballistic missiles cooking off should level what it is parked
#     beside. It cannot be farmed -- the launcher has to die, and the owner paid for it.
#
# Spread/Falloff are deliberately TIGHT, for the reason MOPPenetration's Warhead@Penetrate gives
# about not chaining through a base: full damage to a structure within a cell of the impact,
# nothing at all past two. Aiming at one derrick must not clear a cluster of them.
#
# A FOURTH WEAPON INHERITS THIS BLOCK: `IskanderExplosionAirborne: Inherits: IskanderExplosion`
# (weapons-explosions.yaml:620) picks it up for free, which is correct -- an airburst Iskander
# should do what a ground one does. It is inert today regardless: nothing in the mod fires that
# weapon. Noted because KillableEconomyTest enumerates the reachable set and will name it.
IskanderExplosion:
	Warhead@TechStructure: SpreadDamage
		ValidTargets: TechStructure
		Damage: 60000
		# The tech buildings set no Armor.Thickness, so ApplyPenetration is skipped entirely today
		# (DamageWarhead.cs:238 gates on `thickness != 0`). This matches the 2500 the weapon's other
		# warheads already carry, so the number stays right if anyone ever gives them a thickness --
		# which is exactly the omission that silently divided this weapon's damage by 280 before
		# 260827. Do not leave it unset.
		Penetration: 2500
		Spread: 1c0
		Falloff: 100, 100, 0
		# NO HeavyOrdnanceDeath -- conventional, so the kill leaves the restorable OILB.Husk. See
		# "THE TWO PROPERTIES" at the top of this file; the omission is deliberate and is pinned.
		DamageTypes: ExplosionDeath

# Lets an Iskander be aimed AT a tech building by clicking it, rather than only by force-firing
# the ground underneath. Purely a targeting-cursor affordance; the damage is done by the warhead
# above when the missile detonates, whichever way the shot was ordered.
IskanderTargeter:
	ValidTargets: Ground, Water, TechStructure

# HIMARSTargeter inherits IskanderTargeter, so WITHOUT THIS LINE the affordance above would leak
# to the HIMARS -- which has no Warhead@TechStructure and would therefore let a player order a
# strike that visibly lands and does nothing. Restating the base ValidTargets blocks the leak.
# If HIMARSExplosion is ever promoted into this file, delete this block in the same change.
HIMARSTargeter:
	ValidTargets: Ground, Water


# --- THE BUNKER BUSTER ----------------------------------------------------------------------
# Geometry copied EXACTLY from this weapon's own Warhead@Penetrate -- same Damage, same
# Penetration, same Spread 512 with Falloff [100, 0] -- so a GBU-57 treats an oil derrick
# identically to a Logistics Center or an mslo. That is the honest read of the power's own
# description ("Devastating against hardened structures"), and it means there is one number to
# maintain rather than two that can drift apart.
#
# The reason Warhead@Penetrate cannot simply be given `TechStructure` itself: it is
# `ValidTargets: Structure`, and these buildings deliberately do not carry `Structure` (see the
# fire-tick argument on ^TechBuilding). A separate node is the smaller, safer change.
MOPPenetration:
	Warhead@TechStructure: SpreadDamage
		ValidTargets: TechStructure
		Damage: 165000
		Penetration: 5000
		Spread: 512
		Falloff: 100, 0
		# NO HeavyOrdnanceDeath -- conventional, so the kill leaves the restorable husk. See
		# "THE TWO PROPERTIES" at the top of this file; the omission is deliberate and is pinned.
		DamageTypes: ExplosionDeath


# --- THE NUCLEAR TIER -----------------------------------------------------------------------
# Fired by MissileStrikePower@TacNuke (TacNukeMissile) and by mslo's NukePower, both via
# `Weapon: Atomic`. It DESTROYS an economy structure and leaves the wreck, exactly as the
# conventional tier above does -- the difference between the tiers is now REACH alone.
#
# REACH IS CAPPED AT ~2.5x THE FIREBALL RADIUS (user ruling 2026-09-11: "can do so further out
# than the inner fireball but not beyond 2-3x the fireball or so"), and the number is DERIVED:
#
#   fireball radius      0c711 = 0.694c   -- Warhead@VaporizeRemoval Radius
#                                            (weapons-superweapons.yaml:298), which is the same
#                                            number as Warhead@BlastWave StartRadius (:615).
#   lethal threshold     55000 / 200000 = 27.5%   -- BIO and HOSP are the toughest at 55000 HP.
#   Spread 1c0, Falloff 100, 100, 0  -> bands at 0c / 1c / 2c; 100% out to 1c, lerped to 0 at 2c.
#   27.5% therefore lands at 1024 + (1 - 0.275) * 1024 = 1766 = 1.72c = 2.5x the fireball.
#
# Was Spread 2c0 / Falloff 100,100,100,100,100,25,0 -- lethal to 8 cells, which is 11x the
# fireball and is what the ruling removed.
#
# DISTANCE IS HORIZONTAL AND MEASURED FROM THE HITSHAPE EDGE, not from the centre and not in 3D.
# SpreadDamageWarhead uses HitShape.DistanceFromEdge (SpreadDamageWarhead.cs:74, :91), and every
# tech building is a Rectangle (^2x2Shape / ^3x2Shape, defaults.yaml:1261-1274), whose
# DistanceFromEdge hardcodes Z to 0 and returns the horizontal length. So this weapon's 6c256
# airburst costs it NOTHING against a structure -- pinned by
# MissileStrikeArrivalTest.RectangleHitShapesIgnoreDetonationAltitudeEntirely. Do not "correct"
# these numbers for burst altitude; that is the error the AtomicHighYield note below used to make.
#
# NO AirThreshold, unlike every other warhead on this weapon. That field is only read by the
# WPos overload of IsValidAgainst -- smudges, resources, effects (LeaveSmudgeWarhead.cs:47 and
# friends). SpreadDamageWarhead.DoImpact uses the ACTOR overload, which never consults it.
Atomic:
	Warhead@TechStructure: SpreadDamage
		ValidTargets: TechStructure
		Damage: 200000
		Penetration: 5000
		Spread: 1c0
		Falloff: 100, 100, 0
		# NO HeavyOrdnanceDeath. Nothing in the mod obliterates an economy structure any more --
		# see "NOTHING OBLITERATES" at the top of this file.
		DamageTypes: ExplosionDeath

# The strategic device, fired by MissileStrikePower@HighYieldNuke. Capped on the SAME rule as
# `Atomic` above -- ~2.5x its own fireball -- which is why the two look so different in absolute
# cells: this weapon's fireball is ten times the tactical one's, so its cap is ten times as wide.
#
#   fireball radius      6c820 = 6.80c   -- Warhead@VaporizeRemoval Radius
#                                           (weapons-superweapons.yaml:1019), matching
#                                           Warhead@BlastWave StartRadius (:1327).
#   lethal threshold     55000 / 800000 = 6.875%
#   Spread 6c0, Falloff 100, 100, 100, 0  -> bands at 0c / 6c / 12c / 18c; 100% out to 12c,
#                                            lerped to 0 at 18c.
#   6.875% therefore lands at 12288 + (1 - 0.06875) * 6144 = 18009 = 17.6c = 2.6x the fireball.
#
# Was Spread 8c0 / Falloff 100,100,100,100,25,0 -- lethal to 32 cells, 4.7x the fireball.
#
# THE 15-CELL AIRBURST COSTS THIS WARHEAD NOTHING AGAINST A STRUCTURE, AND THE NOTE THAT USED TO
# BE HERE SAYING OTHERWISE WAS WRONG. It claimed SpreadDamageWarhead measures DistanceFromEdge in
# three dimensions, so a structure under ground zero "is already 15 cells away" -- and then
# subtracted that from the budget. It is false for every building in the mod: Rectangle
# hitshapes (^2x2Shape / ^3x2Shape, defaults.yaml:1261-1274) build their result vector with a
# hardcoded Z of 0 and return the HORIZONTAL length, which
# MissileStrikeArrivalTest.RectangleHitShapesIgnoreDetonationAltitudeEntirely pins explicitly.
# Only Circle and Polygon shapes pay the vertical leg, which is infantry, not structures --
# CircleHitShapesPayTheFullVerticalLeg in the same fixture. The numbers above are therefore plain
# ground distances with no slant-range correction, and adding one would halve this weapon's reach
# against the exact targets this block exists to govern.
AtomicHighYield:
	Warhead@TechStructure: SpreadDamage
		ValidTargets: TechStructure
		Damage: 800000
		Penetration: 20000
		Spread: 6c0
		Falloff: 100, 100, 100, 0
		# NO HeavyOrdnanceDeath -- see "NOTHING OBLITERATES" at the top of this file.
		DamageTypes: ExplosionDeath

# The Oreshnik's re-entry vehicle (weapons-explosions.yaml, fired by Explodes on OreshnikRV).
# LISTED, and the ruling is worth writing down because the default in this file is deny.
#
# It is listed because its whole class already is: every purchased, one-shot, off-map strike in
# the mod appears above -- IskanderExplosion for the Kinzhal, Atomic, AtomicHighYield,
# MOPPenetration for the GBU-57. The exclusion this file argues for is HIMARSExplosion, and the
# argument there is that a HIMARS is a rearmable battlefield system that fires repeatedly, so
# listing it would make the economy raidable by ordinary manoeuvre. An Oreshnik is 18000 credits
# spent once for six clicks. It is not manoeuvre.
#
# WHAT IT BUYS, STATED PLAINLY SO THE BALANCE CALL IS VISIBLE RATHER THAN IMPLIED: six aim points
# means one strike can permanently remove up to SIX neutral tech buildings, which is more economy
# than anything else in this file can take in one activation. That is the reason to look here
# first if the power turns out to be too strong -- deleting this block is a one-block change and
# costs the weapon nothing else.
OreshnikRVExplosion:
	Warhead@TechStructure: SpreadDamage
		ValidTargets: TechStructure
		Damage: 55000
		# The tech buildings set no Armor.Thickness so this is skipped today (DamageWarhead.cs:238
		# gates on `thickness != 0`), but it matches the weapon's other warheads so the number stays
		# right if they ever get one. Same reasoning as IskanderExplosion above; do not leave unset.
		Penetration: 3000
		Spread: 512
		Falloff: 100, 100, 0
		# NO HeavyOrdnanceDeath -- conventional, so each of the six impacts leaves a restorable
		# husk. This is the block where the change is most visible: an Oreshnik salvo used to be
		# able to erase six economy structures permanently, and now wrecks six recoverable ones.
		DamageTypes: ExplosionDeath
