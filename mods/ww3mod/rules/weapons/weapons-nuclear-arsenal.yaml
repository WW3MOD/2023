		ValidTargets: Ground, Water, Air
		AirThreshold: 24c0
		ForceGroundLevel: true
		Light:
			Times: 0, 1, 2, 3, 4, 5, 17, 35, 57, 81, 92, 108, 137, 167, 199
			Intensities: 7, 6.24, 5.66, 5.24, 4.98, 4.9, 4.31, 3.5, 2.63, 1.81, 1.49, 1.08, 0.5, 0.13, 0
			Radii: 8c113, 13c927, 15c775, 17c106, 18c205, 18c205, 18c205, 18c205, 18c205, 18c205, 18c205, 17c602, 16c489, 15c337, 14c107
			Tints: E6F0FF, EAF3FF, EEF5FF, F3F8FF, F7FAFF, FBFDFF, FFF9ED, FFF1D0, FFE6B1, FFD78D, FFCF7B, FFC062, FB9D3D, E66E1D, B4280A
			Interpolations: Linear
			Falloff: InverseSquare
			TerrainRefreshInterval: 3
			# TerrainLighting tints the world BEFORE ShroudRenderer paints its fog quads, so under fog the
			# flash is ATTENUATED rather than hidden. GlowAboveFog draws the missing fraction back in the
			# slot between the fog layers and the opaque unexplored layer. This goes through exactly the
			# same seam as Atomic's: LightEventManager.RenderAboveFog walks its own `live` list and checks
			# Definition.GlowAboveFog per event, so it is the flag below and nothing weapon-specific.
			GlowAboveFog: true

