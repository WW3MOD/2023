# fireball, same blast wave, same thermal reach, same everything below. Compared field by field
# against that weapon at the time of writing; if the two ever diverge, one of them has been edited
# without the other and the divergence is the bug. What separates the two in play is delivery:
# Speed 1200 against the B61's 900, and a shorter launch delay, both in nuclear-arsenal.yaml.
