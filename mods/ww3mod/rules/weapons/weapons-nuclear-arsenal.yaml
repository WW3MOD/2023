# ---- RS-28 Sarmat -- 10 x 750 kt MIRV -----------------------------------------------
# THE ONE ENTRY IN THE ARSENAL THAT IS NOT A BIGGER NUMBER. Every other weapon here differs from its
# neighbours by radius and duration; this one differs by SHAPE. A Sarmat does not deliver one large
# detonation, it delivers a bus of independently-targeted re-entry vehicles across a footprint, and
# open-source figures put each at 750 kt to 1.2 Mt. So the single RV (NukeSarmatRV above) is
# deliberately sized right next to the shipped AtomicHighYield -- that IS the comparison the weapon
# is making. This is ten of the strategic nuke you already have, arriving at once.
#
# HOW IT IS BUILT, and the failure mode it is built around. FireClusterWarhead fires a weapon at each
# cell of a footprint (FireClusterWarhead.cs:48-58); `X` cells always fire, `x` cells are drawn at
# random until RandomClusterCount is reached. The centre is an `X`, so THE AIM POINT ALWAYS TAKES A
# WARHEAD even if the random draw does something unexpected, and the flash and shake below are on
# this carrier rather than delegated -- so a total cluster failure still produces a visible, audible
# detonation at the aim point instead of a silent dud.
#
# FOOTPRINT: 21x21 cells (3.4 km at 160 m/cell), centre plus a ring at 6.5-8.5 cells. Five random
# ring cells plus the guaranteed centre is SIX re-entry vehicles, not the ten the missile can carry,
# and that is a performance decision rather than a fidelity one: each RV starts its own
# ShockwaveEffect sweeping 60 cells for 425 ticks, and six of those overlapping is already by a wide
# margin the heaviest single event in the mod. RandomClusterCount is the one number to raise to 9 if
# it turns out to run fine -- everything else about the weapon is already sized for ten.
NukeSarmatMIRV:
	ValidTargets: Ground, Trees, Water, Underwater, Air
	# Flash and shake live on the CARRIER, so the strike is never silent. Sized for the whole salvo
	# rather than for one RV: six 750 kt bursts inside 3.4 km is a longer, harder event than one.
	Warhead@Flash1: FlashPaletteEffect
		Duration: 30
		FlashType: Nuke
	Warhead@Shake1: ShakeScreen
		Duration: 70
		Intensity: 130
	Warhead@Shake2: ShakeScreen
		Duration: 150
		Intensity: 70
		Delay: 60
	Warhead@Shake3: ShakeScreen
		Duration: 220
		Intensity: 32
		Delay: 200
	Warhead@Shake4: ShakeScreen
		Duration: 200
		Intensity: 12
		Delay: 420
	# THE BUS. One guaranteed RV on the aim point, five more scattered around the ring. Staged in two
	# warheads a few ticks apart so the salvo lands as a ripple rather than a single frame -- real
	# RVs from one bus do not arrive simultaneously.
	Warhead@Bus1: FireCluster
		Weapon: NukeSarmatRV
		RandomClusterCount: 3
		Dimensions: 21,21
		Footprint: _____________________ _____________________ ________xxxxx________ ______xxxxxxxxx______ ____xxxx_____xxxx____ ____xx_________xx____ ___xx___________xx___ ___xx___________xx___ __xx_____________xx__ __xx_____________xx__ __xx______X______xx__ __xx_____________xx__ __xx_____________xx__ ___xx___________xx___ ___xx___________xx___ ____xx_________xx____ ____xxxx_____xxxx____ ______xxxxxxxxx______ ________xxxxx________ _____________________ _____________________
	Warhead@Bus2: FireCluster
		Weapon: NukeSarmatRV
		RandomClusterCount: 2
		Dimensions: 21,21
		Footprint: _____________________ _____________________ ________xxxxx________ ______xxxxxxxxx______ ____xxxx_____xxxx____ ____xx_________xx____ ___xx___________xx___ ___xx___________xx___ __xx_____________xx__ __xx_____________xx__ __xx______X______xx__ __xx_____________xx__ __xx_____________xx__ ___xx___________xx___ ___xx___________xx___ ____xx_________xx____ ____xxxx_____xxxx____ ______xxxxxxxxx______ ________xxxxx________ _____________________ _____________________
		Delay: 9

# =====================================================================================================
# THE RUSSIAN HALF OF THE ARSENAL -- four purchasable warheads, added 2026-09-07.
#
# WHY THESE EXIST. Every small nuclear weapon above this line is American: the four B61-12 dial
# settings, the W76-1 and the B83-1. Russia owned only the two showpieces (RS-28 Sarmat and Tsar
# Bomba), which are the top and the very top of the ladder, so there was no Russian weapon a player
# could actually afford in the ordinary course of a match. A matched buy tier was impossible.
# These four give the two factions the same rungs.
#
# THREE OF THE FOUR ARE PHYSICALLY IDENTICAL TO AN EXISTING US WEAPON, ON PURPOSE.
#   NukeRuIskander   10 kt   every warhead copied verbatim from NukeB61Mod12Y10
#   NukeRuKinzhalN   50 kt   every warhead copied verbatim from NukeB61Mod12Y50
#   NukeRuKalibr    100 kt   every warhead copied verbatim from NukeW76
# This is not laziness and it is not a shortcut past the derivation. Every number in this file is a
# function of YIELD alone -- that is what the four laws in the header mean -- so two weapons of the
# same yield that disagreed about their blast radius would be stating that one of them is wrong.
# The yields were matched deliberately so that the two ladders are comparable; the difference
# between an American and a Russian weapon of the same yield is DELIVERY, and delivery lives in
# rules/ingame/nuclear-arsenal.yaml (missile speed, launch delay, burst altitude, warning time) --
# not here. Nothing about a fireball knows who built the casing.
#
# THE ONE THAT IS DERIVED IS THE 1 KT. It has no US twin at its yield, so NukeRu9M729 below is
# computed from the laws rather than copied. The derivation was written as code and validated by
# regenerating NukeB61Mod12Y015 and NukeB61Mod12Y10 from it and diffing against what those ship:
# StartRadius, TransitionRadius, InitialSpeedPercent, MaxRadius, Spread, ShockwaveThickness,
# Vaporize spread, thermal spread, EMP range and duration, CreateEffect ScalePercent, all ten fire
# ring ranges, all four shake intensities and all five suppression arrival delays reproduced
# EXACTLY on both. Only the far-field falloff table differs, by at most one point out of 600, and
# only because it is resampled from a different weapon's table onto a different number of steps.
#
# ALL FOUR ARE REGISTERED IN NuclearYieldTest.AllNukes. That list is the file's own instruction --
# "Anything added to either file has to be added here" -- and it is what subjects these weapons to
# the single-peaked-flash invariant, the Mach-falls-with-yield ordering, the twice-the-fireball
# transition and the suppression-arrival check. An arsenal weapon that is not in that list is
# checked by nothing, which is exactly how the first eight shipped broken.
# =====================================================================================================

# ---- 9M729 (SSC-8 Screwdriver) -- 1 kt ------------------------------------------------
# RUSSIAN. The bottom of the Russian purchasable ladder, and the only weapon in this file whose
# yield has no US twin -- every number below is derived from the four laws in the header rather
# than copied from a neighbour. It sits between NukeB61Mod12Y003 (0.3 kt) and NukeB61Mod12Y015
# (1.5 kt), and the derivation was validated by regenerating both of those from the same code and
# diffing against what they ship: every field reproduced exactly.
#
#   blast (1 psi)         6.7 cells   = 1.069 * 1^(1/3) km at 160 m/cell
#   thermal (3rd deg)     3.7 cells   = 2.0 * (1/20)^0.41 km
#   fireball             0.21 cells   = 111 * (1/20)^0.40 m, and it burns 4 ticks (0.21 s)
#   burst height          1.4 cells   = 230 * 1^(1/3) m, rounded to the quarter cell (1c512)
#   blast wave           supersonic 0.21 -> 0.42 cells in 1 tick, then sonic at 7 ticks/cell;
#                        reaches its full 6.75c at tick 46 (2.8 s)
#
# WARHEAD@VAPORIZE SPREAD DOES NOT EQUAL STARTRADIUS HERE, AND THAT IS CORRECT. The fireball is
# 0c214 and the vaporize spread is 0c256, because 0c256 is a FLOOR that both smaller weapons in
# this file also sit on: Y003 writes 0c256 against a 0c132 fireball, Y015 writes 0c256 against
# 0c252. Below a quarter cell a SpreadDamage warhead does not reliably cover the cell it is
# centred on. The two numbers agree on the six weapons at and above 10 kt and cannot below about
# 1.5 kt; this is the third weapon in the file to sit on the floor.
NukeRu9M729:
	ValidTargets: Ground, Trees, Water, Underwater, Air
	Warhead@Flash1: FlashPaletteEffect
		Duration: 8
		FlashType: Nuke
	Warhead@Shake1: ShakeScreen
		Duration: 15
		Intensity: 42
	Warhead@Shake2: ShakeScreen
		Duration: 15
		Intensity: 23
		Delay: 3
	Warhead@Shake3: ShakeScreen
		Duration: 15
		Intensity: 11
		Delay: 12
	Warhead@Shake4: ShakeScreen
		Duration: 15
		Intensity: 4
		Delay: 25
	# ===== THE FIREBALL, AS LIGHT =====
	# The house pattern established on `Atomic` in weapons-superweapons.yaml, evaluated at this
	# weapon's own yield. Read the long note there for the model; only the numbers differ here.
	#
	#   yield                 1 kt
	#   illumination reach    3.7 cells  = the THERMAL radius, 2.0 * (kt/20)^0.41 km at 160 m/cell.
	#                         NOT the fireball's own 33 m -- that is 0.21 cells and invisible. Illumination
	#                         reach scales as the fireball radius (Y^0.40) for a fixed surface
	#                         temperature and thermal reach as Y^0.41, so one array carries both.
	#   duration              199 ticks (11.9 s) = the fireball ANIMATION length; the 0.8*(kt/20)^0.44 s
	#                         physical fireball is only 3.6 ticks here and no longer sets this.
	#   fireball growth       Taylor-Sedov R ~ t^0.4, reaching full reach at t_max = 0.53 ticks
	#                         (0.032*sqrt(Y) s, Glasstone), then holding, then shrinking as it rises.
	#                         t_max is SUB-TICK at this yield, so keyframe 0 samples the growth curve
	#                         at its own midpoint -- (0.5/0.53)^0.4 = 0.97 of full reach -- and keyframe 1
	#                         is already at full. Same convention as Y003, Y015 and Y10, whose keyframe
	#                         0 fractions (0.90, 0.90, 0.61) this formula reproduces exactly.
	#
	# THE INTENSITY ENVELOPE IS MONOTONE AND THAT IS A DELIBERATE DEPARTURE FROM THE PHYSICS.
	# A real fireball double-flashes -- bright pulse, opaque-shock dip, larger second maximum -- and
	# the first version of this system rendered that. At a 60 ms timestep it reads as a STROBE, which
	# is what the user reported, so every envelope in the mod is peak-at-tick-0 and monotone.
	#
	# REWORKED 2026-09-07 into TWO STAGES, after the user played it. The single curve this replaces
	# was 7.0*(1-t/D)^2 over a duration taken from the yield, which put this weapon's whole flash
	# inside 4 tick(s) -- 0.24 s, against a fireball animation that runs 199 ticks. The
	# light was dark for 98% of the cloud it was supposed to be lighting. The law is now
	#     stage 1, white spike   0 <= t <= 3:   I = 4.9 + 2.1 * (1 - t/3)^2
	#     stage 2, red fade      3 <= t <= 199: I = 4.9 * (1 - (t-3)/196)^2
	# Peak 7.0 at t=0, 4.9 at the shoulder, 0 at the end; continuous at the shoulder and monotone
	# non-increasing throughout, so the anti-strobe invariant is untouched. The two stages differ by
	# their RATE, not their direction: the drop out of blinding is 28x faster than the fade
	# that follows it, which is the "very short super-intense light, then a long fade" that was asked
	# for.
	#
	# THE DURATION IS NO LONGER TAKEN FROM THE YIELD. It is
	#     D = max(fireball animation length, physical fireball lifetime)
	# and here that is 199 ticks, from the fireball ANIMATION. The animation length is not a constant --
	# it is the SHP frame count walked along the `Tick`/`ChangeTick` ladder of the sequence named by
	# this weapon's own Warhead@Fireball `Explosions:` field. IF THAT LADDER CHANGES, THIS ENVELOPE
	# MUST BE REGENERATED: `python3 tools/nuke-light/gen_fireball_light.py --write`, and
	# NuclearYieldTest re-derives the same number and fails if it was not.
	#
	# PEAK INTENSITY IS 7.0 ON EVERY NUCLEAR WEAPON IN THE MOD, and stays flat on purpose. Fireball
	# surface brightness is set by temperature (~7000 K) and is very nearly yield-independent -- and
	# the renderer agrees: TerrainLighting sums `falloff * intensity * tint` with no clamp, so an
	# intensity of 7 is already saturated at the centre and raising it widens the blown-out core
	# rather than brightening anything. What yield buys is AREA and the length of the white phase.
	#
	# COLOUR now carries the cooling on its own axis, keyed on t/D rather than on intensity: white
	# through the spike, then yellow, orange, and a dull ember red at the end. Intensity and hue are
	# deliberately decoupled -- the light is still bright while it is already going orange, which is
	# what "goes towards red at the later stages" asks for.
	Warhead@FireballLight: LightEvent
		ValidTargets: Ground, Water, Air
		AirThreshold: 24c0
		ForceGroundLevel: true
		Light:
			Times: 0, 1, 2, 3, 15, 33, 55, 80, 92, 107, 136, 167, 199
			Intensities: 7, 5.83, 5.13, 4.9, 4.32, 3.51, 2.64, 1.81, 1.46, 1.08, 0.51, 0.13, 0
			Radii: 3c580, 3c676, 3c676, 3c676, 3c676, 3c676, 3c676, 3c676, 3c676, 3c558, 3c329, 3c85, 2c857
			Tints: E6F0FF, EAF3FF, EEF5FF, F3F8FF, FFFAF0, FFF2D3, FFE7B4, FFD88F, FFCF7B, FFC164, FC9E3E, E66E1D, B4280A
			Interpolations: Linear
			Falloff: InverseSquare
			TerrainRefreshInterval: 2
			# TerrainLighting tints the world BEFORE ShroudRenderer paints its fog quads, so under fog the
			# flash is ATTENUATED rather than hidden. GlowAboveFog draws the missing fraction back in the
			# slot between the fog layers and the opaque unexplored layer. This goes through exactly the
			# same seam as Atomic's: LightEventManager.RenderAboveFog walks its own `live` list and checks
			# Definition.GlowAboveFog per event, so it is the flag below and nothing weapon-specific.
			GlowAboveFog: true

	Warhead@Fireball: CreateEffect
		Explosions: nuke_large
		ScalePercent: 90
		Offset: 0,-1900,0
		Palette: effect_ts
		ZOffset: 4096
