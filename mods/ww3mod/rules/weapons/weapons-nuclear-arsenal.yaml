# ---- RS-28 Sarmat -- 10 x 750 kt MIRV -----------------------------------------------
# THE ONE ENTRY IN THE ARSENAL THAT IS NOT A BIGGER NUMBER. Every other weapon here differs from its
# neighbours by radius and duration; this one differs by SHAPE. A Sarmat does not deliver one large
# detonation, it delivers a bus of independently-targeted re-entry vehicles across a footprint, and
# open-source figures put each at 750 kt to 1.2 Mt. So the single RV (NukeSarmatRV above) is
# deliberately sized right next to the shipped AtomicHighYield -- that IS the comparison the weapon
# is making. This is ten of the strategic nuke you already have, arriving at once.
#
# HOW IT IS BUILT, and the failure mode it is built around. FireClusterWarhead fires a weapon at each
# cell of a footprint (FireClusterWarhead.cs:48-58); `X` cells always fire, `x` cells are drawn at
# random until RandomClusterCount is reached. The centre is an `X`, so THE AIM POINT ALWAYS TAKES A
# WARHEAD even if the random draw does something unexpected, and the flash and shake below are on
# this carrier rather than delegated -- so a total cluster failure still produces a visible, audible
# detonation at the aim point instead of a silent dud.
#
# FOOTPRINT: 21x21 cells (3.4 km at 160 m/cell), centre plus a ring at 6.5-8.5 cells. Five random
# ring cells plus the guaranteed centre is SIX re-entry vehicles, not the ten the missile can carry,
# and that is a performance decision rather than a fidelity one: each RV starts its own
# ShockwaveEffect sweeping 60 cells for 425 ticks, and six of those overlapping is already by a wide
# margin the heaviest single event in the mod. RandomClusterCount is the one number to raise to 9 if
# it turns out to run fine -- everything else about the weapon is already sized for ten.
NukeSarmatMIRV:
	ValidTargets: Ground, Trees, Water, Underwater, Air
	# Flash and shake live on the CARRIER, so the strike is never silent. Sized for the whole salvo
	# rather than for one RV: six 750 kt bursts inside 3.4 km is a longer, harder event than one.
	Warhead@Flash1: FlashPaletteEffect
		Duration: 30
		FlashType: Nuke
	Warhead@Flash2: FlashPaletteEffect
		Duration: 30
		FlashType: Nuke
		Delay: 22
	Warhead@Flash3: FlashPaletteEffect
		Duration: 30
		FlashType: Nuke
		Delay: 44
	Warhead@Shake1: ShakeScreen
		Duration: 70
		Intensity: 130
	Warhead@Shake2: ShakeScreen
		Duration: 150
		Intensity: 70
		Delay: 60
	Warhead@Shake3: ShakeScreen
		Duration: 220
		Intensity: 32
		Delay: 200
	Warhead@Shake4: ShakeScreen
		Duration: 200
		Intensity: 12
		Delay: 420
