# =====================================================================================================
# WW3MOD NUCLEAR ARSENAL -- eight warheads named after weapons that exist, spanning five orders of
# magnitude of yield, every number in this file derived from four scaling laws rather than tuned.
#
# WHY THIS IS A SEPARATE FILE AND NOT MORE OF weapons-superweapons.yaml: that file holds `Atomic` and
# `AtomicHighYield`, the two shipped nukes, and it is under active rework. Splitting the arsenal off
# means the two can be retuned without touching this and this can grow without touching them.
# Registered in mod.yaml's Weapons: list immediately after weapons-superweapons.yaml.
#
# ==== THE LAWS ====
# Everything below is one of these four evaluated at a yield. Nothing is hand-picked, so a number
# that looks odd is a consequence of a law rather than a decision, and the way to change it is to
# change the law.
#
#   BLAST RADIUS scales as the CUBE ROOT of yield. This is the whole reason an arsenal spanning
#   0.3 kt to 50 Mt fits on one map at all: 167,000x the energy is only 55x the radius.
#       blast_cells = 1.069 * kt^(1/3) km / 0.160 km per cell        (1 psi, outer edge of anything)
#
#   BLAST EXTENTS USE ~160 m PER CELL. This is deliberately NOT the mod's weapon-range scale, which
#   is a fourth-root compression (cells ~= 18 * km^0.23). Two scales on purpose: a weapon range is a
#   balance abstraction and a blast radius is a spectacle. NOTHING HERE MAY BE USED TO SET A RANGE.
#
#   FIREBALL radius scales as Y^0.40 and its DURATION as Y^0.44 -- both checked against real
#   calculator output at 20, 175 and 800 kt and self-consistent to within a percent.
#       fireball_m     = 111 * (kt/20)^0.40          fireball_s = 0.8 * (kt/20)^0.44
#   The duration is the single most under-appreciated number in this file. It is what makes these
#   weapons feel different from each other in a way a radius cannot: the B61-12 at its lowest dial
#   setting flashes for 2 TICKS, and Tsar Bomba burns for 417 -- twenty-five seconds of standing
#   fireball. Everything downstream is timed off it: the flash stack, the thermal pulse, and the
#   staggered ignition delays of the fire ring.
#
#   THERMAL RADIUS GROWS FASTER THAN BLAST -- Y^0.41 against Y^0.33 -- so the two cross over. Below
#   the crossover a weapon breaks more than it burns; above it, it burns more than it breaks.
#       thermal_cells = 2.0 * (kt/20)^0.41 km / 0.160 km per cell    (third-degree burns)
#   Setting the two equal gives the crossover at 2.4 Mt, which lands between B83-1 (1.2 Mt, blast
#   still ahead) and Tsar Bomba (50 Mt, fire 309 cells against blast 246). That inversion is a real
#   change of character across the arsenal and it falls out of the exponents rather than being
#   written in by hand.
#
# ==== WHAT IS DELIBERATELY CONSTANT ====
# `Damage: 400000` and the 35-point falloff SHAPE are identical on every weapon here, and that is
# not laziness. Cube-root scaling is exactly the statement that peak overpressure at a given
# FRACTION of the blast radius does not depend on yield -- so the yield belongs entirely in the
# radii and the timings, and putting any of it into the damage number as well would be counting it
# twice. The falloff curve is R^-1.28 in the far field, sampled by fraction of max radius.
#
# ==== WHAT THIS FILE DOES NOT DO ====
# It draws its fireballs as SPRITES (CreateEffect + nuke_large), not as light events. The engine has
# LightEventWarhead and world.yaml carries LightEventManager, but nothing in the mod emits a light
# event yet and the keyframe vocabulary is unproven here -- so establishing it is one job, done once,
# and not something to guess at across eight weapons in parallel. When the house pattern for a
# nuclear light lands, every Warhead@Fireball* block below should be revisited against it. Past
# ScalePercent 1600 the sprite cannot represent the fireball anyway and the extra magnification is
# spent on a ring of sprites instead; above about a megaton that is a stopgap and is marked as one.
#
# ==== TRAPS, ALL OF WHICH ARE LIVE IN THIS FILE ====
#   * AirThreshold. Above a warhead's AirThreshold the engine substitutes `Air` for the terrain
#     target types (Warhead.cs:41-45, CreateEffectWarhead.cs:165-166) and the warhead does NOTHING to
#     the ground -- no error, no lint failure, no visible symptom except that nothing dies. Every
#     damage, fire, EMP, suppression and smudge warhead below carries one, set to 1.6x its own
#     weapon's burst height and never below 24c0. The power that fires each weapon must keep its
#     DetonationAltitude under that number.
#   * ShockwaveDamage reach is min(MaxRadius, (Falloff.Length-1) * Spread) and the two are NOT
#     validated against each other at load, so whichever is smaller silently wins. Every blast wave
#     below has them made equal to the wdist.
#   * FlashPaletteEffect Duration above 30 is not a longer flash, it is a corrupted palette:
#     palettes.yaml pins the Nuke effect's Length at 30 and the lerp is unclamped past it. Long
#     flashes are stacks of overlapping 30-tick calls.
#   * The `onfire` ExternalCondition on infantry carries TotalCap: 10, so ten fire warheads is the
#     ceiling and an eleventh would be granted and discarded.
#   * Trees are damage-immune mod-wide (^TreeIndestructible, DamageMultiplier: Modifier: 0), so no
#     weapon here touches them and none of them pretends to.
#   * VisibleThroughFog IS NOT ENOUGH ON ITS OWN, and every fireball below carries RenderAboveFog
#     with it. VisibleThroughFog only stops the effect being CULLED. Without RenderAboveFog the
#     sprite goes in the ordinary world bucket, which WorldRenderer sorts by Pos.Y + Pos.Z + ZOffset
#     -- so ZOffset 4096 buys four cells of lead and nothing more, and every tree, field and building
#     more than about five cells SOUTH of the aim point sorts after a cloud that is up to 208 cells
#     wide and is drawn straight over it. That is what the user photographed. RenderAboveFog moves
#     the draw into the bucket between the fog layers and the opaque unexplored layer, which is past
#     every actor as well as past the fog. These blocks were written from the pre-RenderAboveFog copy
#     of Atomic's fireball: wt/nuke-fog and wt/nuke-arsenal were merged 45 seconds apart, and the
#     flag landed on Atomic and AtomicHighYield only.
# =====================================================================================================

# ---- B61-12 (0.3 kt) -- 0.3 kt --------------------------------------------------------
