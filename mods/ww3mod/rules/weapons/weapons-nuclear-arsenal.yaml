# ---- Kh-47M2 Kinzhal-N -- 50 kt -------------------------------------------------------
# RUSSIAN. Nuclear warhead on the air-launched Kinzhal, which the mod already ships as a
# conventional strike (KinzhalMissile, vehicles-russia.yaml). The Kh-47M2 is Iskander-derived, so
# it shares that missile's body art, and it is the FASTEST delivery in this file -- Speed 2000,
# matching the conventional Kinzhal exactly, because the airframe is the same airframe.
#
# PHYSICALLY IDENTICAL TO NukeB61Mod12Y50 AND DELIBERATELY SO. Same yield, same blast. The
# difference is that this one arrives roughly twice as fast and with the shortest warning of any
# weapon in the arsenal, which is the whole identity of the platform.
#
#   blast (1 psi)        24.6 cells   = 1.069 * 50^(1/3) km at 160 m/cell
#   thermal (3rd deg)    18.2 cells   = 2.0 * (50/20)^0.41 km
#   fireball             1.00 cells   = 111 * (50/20)^0.40 m, and it burns 20 ticks (1.2 s)
#   burst height          5.3 cells   = 230 * 50^(1/3) m, rounded to the quarter cell (5c256)
#   blast wave           supersonic 1.00 -> 2.00 cells in 2 ticks, then sonic at 7 ticks/cell;
#                        reaches its full 24.5c at tick 166 (10 s)
NukeRuKinzhalN:
	ValidTargets: Ground, Trees, Water, Underwater, Air
	Warhead@Flash1: FlashPaletteEffect
		Duration: 20
		FlashType: Nuke
	Warhead@Shake1: ShakeScreen
		Duration: 15
		Intensity: 76
	Warhead@Shake2: ShakeScreen
		Duration: 34
		Intensity: 41
		Delay: 15
	Warhead@Shake3: ShakeScreen
		Duration: 51
		Intensity: 19
		Delay: 48
	Warhead@Shake4: ShakeScreen
		Duration: 48
		Intensity: 7
		Delay: 94
	# ===== THE FIREBALL, AS LIGHT =====
	# The house pattern established on `Atomic` in weapons-superweapons.yaml, evaluated at this
	# weapon's own yield. Read the long note there for the model; only the numbers differ here.
	#
	#   yield                 50 kt
	#   illumination reach    18.2 cells  = the THERMAL radius, 2.0 * (kt/20)^0.41 km at 160 m/cell.
	#                         NOT the fireball's own 160 m -- that is 1.00 cells and invisible. Illumination
	#                         reach scales as the fireball radius (Y^0.40) for a fixed surface
	#                         temperature and thermal reach as Y^0.41, so one array carries both.
	#   duration              199 ticks (11.9 s) = the fireball ANIMATION length; the 0.8*(kt/20)^0.44 s
	#                         physical fireball is only 20.0 ticks here and no longer sets this.
	#   fireball growth       Taylor-Sedov R ~ t^0.4, reaching full reach at t_max = 3.77 ticks
	#                         (0.032*sqrt(Y) s, Glasstone), then holding, then shrinking as it rises.
	#
	# THE INTENSITY ENVELOPE IS MONOTONE AND THAT IS A DELIBERATE DEPARTURE FROM THE PHYSICS.
	# A real fireball double-flashes -- bright pulse, opaque-shock dip, larger second maximum -- and
	# the first version of this system rendered that. At a 60 ms timestep it reads as a STROBE, which
	# is what the user reported, so every envelope in the mod is peak-at-tick-0 and monotone.
	#
	# REWORKED 2026-09-07 into TWO STAGES, after the user played it. The single curve this replaces
	# was 7.0*(1-t/D)^2 over a duration taken from the yield, which put this weapon's whole flash
	# inside 20 tick(s) -- 1.20 s, against a fireball animation that runs 199 ticks. The
	# light was dark for 90% of the cloud it was supposed to be lighting. The law is now
	#     stage 1, white spike   0 <= t <= 5:   I = 4.9 + 2.1 * (1 - t/5)^2
	#     stage 2, red fade      5 <= t <= 199: I = 4.9 * (1 - (t-5)/194)^2
	# Peak 7.0 at t=0, 4.9 at the shoulder, 0 at the end; continuous at the shoulder and monotone
	# non-increasing throughout, so the anti-strobe invariant is untouched. The two stages differ by
	# their RATE, not their direction: the drop out of blinding is 17x faster than the fade
	# that follows it, which is the "very short super-intense light, then a long fade" that was asked
	# for.
	#
	# THE DURATION IS NO LONGER TAKEN FROM THE YIELD. It is
	#     D = max(fireball animation length, physical fireball lifetime)
	# and here that is 199 ticks, from the fireball ANIMATION. The animation length is not a constant --
	# it is the SHP frame count walked along the `Tick`/`ChangeTick` ladder of the sequence named by
	# this weapon's own Warhead@Fireball `Explosions:` field. IF THAT LADDER CHANGES, THIS ENVELOPE
	# MUST BE REGENERATED: `python3 tools/nuke-light/gen_fireball_light.py --write`, and
	# NuclearYieldTest re-derives the same number and fails if it was not.
	#
	# PEAK INTENSITY IS 7.0 ON EVERY NUCLEAR WEAPON IN THE MOD, and stays flat on purpose. Fireball
	# surface brightness is set by temperature (~7000 K) and is very nearly yield-independent -- and
	# the renderer agrees: TerrainLighting sums `falloff * intensity * tint` with no clamp, so an
	# intensity of 7 is already saturated at the centre and raising it widens the blown-out core
	# rather than brightening anything. What yield buys is AREA and the length of the white phase.
	#
	# COLOUR now carries the cooling on its own axis, keyed on t/D rather than on intensity: white
	# through the spike, then yellow, orange, and a dull ember red at the end. Intensity and hue are
	# deliberately decoupled -- the light is still bright while it is already going orange, which is
	# what "goes towards red at the later stages" asks for.
