# ---- B61-12 (1.5 kt) -- 1.5 kt --------------------------------------------------------
# second B61-12 dial setting; defined for the dial, no power fires it.
#
#   blast (1 psi)         7.6 cells   = 1.069 * 1.5^(1/3) km at 160 m/cell
#   thermal (3rd deg)     4.3 cells   = 2.0 * (1.5/20)^0.41 km
