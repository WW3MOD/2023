#   burst height          1.6 cells   = 230 * 1.5^(1/3) m
#   blast wave           supersonic 0.25 -> 0.49 cells in 1 tick, then sonic at 7 ticks/cell;
#                        reaches its full 7.8c at tick 51 (3 s)
NukeB61Mod12Y015:
	ValidTargets: Ground, Trees, Water, Underwater, Air
	Warhead@Flash1: FlashPaletteEffect
		Duration: 8
		FlashType: Nuke
	Warhead@Shake1: ShakeScreen
		Duration: 15
		Intensity: 44
	Warhead@Shake2: ShakeScreen
		Duration: 15
