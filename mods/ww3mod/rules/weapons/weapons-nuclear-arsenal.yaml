# ---- Tsar Bomba -- 50000 kt -----------------------------------------------------------
# RDS-220, 30 October 1961: the largest device ever detonated, at 50 Mt.
#
#   blast (1 psi)       246.1 cells   = 1.069 * 50000^(1/3) km at 160 m/cell
#   thermal (3rd deg)   309.1 cells   = 2.0 * (50000/20)^0.41 km
#   fireball            15.86 cells   = 111 * (50000/20)^0.40 m, and it burns 417 ticks (25.0 s)
#   burst height         25.0 cells   = 230 * 50000^(1/3) m
#   blast wave           supersonic 15.86 -> 31.72 cells in 55 ticks, then sonic at 7 ticks/cell;
#                        reaches its full 246.0c at tick 1682 (101 s)
#   THERMAL OUTRUNS BLAST HERE (309 > 246 cells): above ~2.4 Mt this weapon sets fire to more
#   of the map than it flattens, which is the character change the arsenal is built to show.
NukeTsarBomba:
	ValidTargets: Ground, Trees, Water, Underwater, Air
	Warhead@Flash1: FlashPaletteEffect
		Duration: 30
		FlashType: Nuke
	Warhead@Shake1: ShakeScreen
