# =====================================================================================================
# WW3MOD NUCLEAR ARSENAL -- eight warheads named after weapons that exist, spanning five orders of
# magnitude of yield, every number in this file derived from four scaling laws rather than tuned.
#
# WHY THIS IS A SEPARATE FILE AND NOT MORE OF weapons-superweapons.yaml: that file holds `Atomic` and
# `AtomicHighYield`, the two shipped nukes, and it is under active rework. Splitting the arsenal off
# means the two can be retuned without touching this and this can grow without touching them.
# Registered in mod.yaml's Weapons: list immediately after weapons-superweapons.yaml.
#
# ==== THE LAWS ====
# Everything below is one of these four evaluated at a yield. Nothing is hand-picked, so a number
# that looks odd is a consequence of a law rather than a decision, and the way to change it is to
# change the law.
#
#   BLAST RADIUS scales as the CUBE ROOT of yield. This is the whole reason an arsenal spanning
#   0.3 kt to 50 Mt fits on one map at all: 167,000x the energy is only 55x the radius.
#       blast_cells = 1.069 * kt^(1/3) km / 0.160 km per cell        (1 psi, outer edge of anything)
#
#   BLAST EXTENTS USE ~160 m PER CELL. This is deliberately NOT the mod's weapon-range scale, which
#   is a fourth-root compression (cells ~= 18 * km^0.23). Two scales on purpose: a weapon range is a
#   balance abstraction and a blast radius is a spectacle. NOTHING HERE MAY BE USED TO SET A RANGE.
#
#   THE SHOCKWAVE HAS TWO PHASES AND THE TRANSITION IS AT TWICE THE FIREBALL RADIUS. A nuclear
#   shock is attached to the fireball surface while that surface is still expanding supersonically;
#   there is no travelling wave inside it, because everything in there is already gone. It detaches
#   at breakaway and only then decays toward sound speed. So every blast wave below is born at its
#   own fireball radius (StartRadius, the same number as its Warhead@Vaporize Spread), at the Mach
#   number its own breakaway overpressure implies through Rankine-Hugoniot
#       M = sqrt(1 + (6/7) * dP / 14.7)      dP from the blast law at StartRadius
#   and its excess above Mach 1 falls linearly in RADIUS to zero at TransitionRadius = 2 *
#   StartRadius. Past that it is sonic for the long remainder. Breakaway Mach FALLS with yield --
#   6.97 for the 0.3 kt dial, 3.63 for Tsar Bomba -- because a bigger fireball breaks away at a
#   lower overpressure. That looks backwards and is not.
#   THE FAST PHASE IS SUB-TICK BELOW ABOUT 50 KT. At 0.3 kt it is 0.13 cells long and completes in
#   one 60 ms step; the four B61 dial settings therefore look unchanged and are not wrong. Tsar
#   Bomba's is 15.9 cells and 55 ticks, and is the one to watch.
#
#   FIREBALL radius scales as Y^0.40 and its DURATION as Y^0.44 -- both checked against real
#   calculator output at 20, 175 and 800 kt and self-consistent to within a percent.
#       fireball_m     = 111 * (kt/20)^0.40          fireball_s = 0.8 * (kt/20)^0.44
#   The duration is the single most under-appreciated number in this file. It is what makes these
#   weapons feel different from each other in a way a radius cannot: the B61-12 at its lowest dial
#   setting flashes for 2 TICKS, and Tsar Bomba burns for 417 -- twenty-five seconds of standing
#   fireball. Everything downstream is timed off it: the flash stack, the thermal pulse, and the
#   staggered ignition delays of the fire ring.
#
#   THERMAL RADIUS GROWS FASTER THAN BLAST -- Y^0.41 against Y^0.33 -- so the two cross over. Below
#   the crossover a weapon breaks more than it burns; above it, it burns more than it breaks.
#       thermal_cells = 2.0 * (kt/20)^0.41 km / 0.160 km per cell    (third-degree burns)
#   Setting the two equal gives the crossover at 2.4 Mt, which lands between B83-1 (1.2 Mt, blast
#   still ahead) and Tsar Bomba (50 Mt, fire 309 cells against blast 246). That inversion is a real
#   change of character across the arsenal and it falls out of the exponents rather than being
#   written in by hand.
#
# ==== WHAT IS DELIBERATELY CONSTANT ====
# `Damage: 400000` and the 35-point falloff SHAPE are identical on every weapon here, and that is
# not laziness. Cube-root scaling is exactly the statement that peak overpressure at a given
# FRACTION of the blast radius does not depend on yield -- so the yield belongs entirely in the
# radii and the timings, and putting any of it into the damage number as well would be counting it
# twice. The falloff curve is R^-1.28 in the far field, sampled by fraction of max radius.
#
# ==== THE FIREBALL IS NOW DRAWN TWICE, AND THE TWO HALVES ARE DIFFERENT THINGS ====
# RESOLVED 2026-09-07. This section used to say the file draws its fireballs only as SPRITES and that
# every Warhead@Fireball* block should be revisited when the house pattern for a nuclear light landed.
# It has landed (`Atomic` and `AtomicHighYield` in weapons-superweapons.yaml) and every weapon here
# now carries a Warhead@FireballLight built from it. The two draws are not redundant:
#   * Warhead@Fireball* (CreateEffect + nuke_large) is the MUSHROOM CLOUD. Tens of cells across,
#     seconds to minutes long. Past ScalePercent 1600 the sprite cannot be magnified further and the
#     extra size is spent on a ring of sprites instead; above about a megaton that is a stopgap and is
#     marked as one where it is used.
#   * Warhead@FireballLight (LightEvent) is the FIREBALL and the flash it throws on the world. It is
#     light rather than a sprite because the thing being drawn is illumination, not an object.
#
# ==== THE FIFTH LAW: THE FLASH ENVELOPE ====
# Added with the lights, and it governs every nuclear weapon in the mod including the two in
# weapons-superweapons.yaml. REWRITTEN 2026-09-07 after the user played it; what follows is the new
# rule, and the paragraph it replaced is worth stating because the failure it caused is instructive.
#
# WHAT IT USED TO BE: peak at tick 0, one curve, decaying to nothing at the duration the YIELD gave,
#       I(t) = 7.0 * (1 - t/D)^2        D = 0.8 * (kt/20)^0.44 s, the incandescent fireball lifetime
# That D is physically right and is the wrong number to light a video game with. It is 2 ticks at the
# lowest B61 dial -- 0.12 s, one or two rendered frames -- while the mushroom-cloud sprite that same
# warhead throws runs 199 ticks. The flash was over before the player could register that it had
# happened, and the cloud then burned for twelve seconds in the dark. The user reported it as the
# small nukes not feeling like nukes, which is exactly what it was.
#
# WHAT IT IS NOW. Duration is taken from the FIREBALL ANIMATION rather than from the yield:
#       D = max(fireball animation length, physical fireball lifetime)
# The second term only ever binds on Tsar Bomba, whose 417-tick physical fireball outlives today's
# animation; every other weapon takes the animation. And the intensity is TWO STAGES rather than one
# curve, so "blinding" and "long" stop fighting each other:
#       stage 1, white spike   0 <= t <= W:  I = 4.9 + 2.1 * (1 - t/W)^2      W = 3..14 ticks
#       stage 2, red fade      W <= t <= D:  I = 4.9 * (1 - (t-W)/(D-W))^2
# Peak 7.0 at tick 0, 4.9 at the shoulder, 0 at D. Still single-peaked, still monotone, still peaked
# at keyframe 0 -- the anti-strobe invariants are untouched, and the two stages differ only in RATE.
#
# W, THE WHITE PHASE, IS THE ONE THING YIELD STILL BUYS IN TIME: round(4*(kt/20)^0.15) clamped to
# [3, 14], so 3 ticks at the lowest dial and 13 at Tsar Bomba. It is short everywhere on purpose.
#
# PEAK 7.0 IS YIELD-INDEPENDENT AND THAT IS THE POINT. Fireball surface brightness is set by
# temperature (~7000 K), so what yield buys is AREA -- 2.2 cells at the lowest B61 dial against 309
# for Tsar Bomba -- and making the big ones BRIGHTER would have been the one wrong way to scale them.
# The renderer agrees: TerrainLighting sums `falloff * intensity * tint` with no clamp anywhere in
# the path, so 7.0 is already saturated at the centre of the light. Raising it does not brighten the
# middle, it only widens the blown-out core.
#
# THE ANIMATION LENGTH IS NOT A CONSTANT AND MUST NOT BE TREATED AS ONE. It is the SHP frame count
# walked along the `Tick`/`ChangeTick` ladder of the sequence each weapon names in its own
# Warhead@Fireball `Explosions:` field -- today every nuclear weapon names `nuke_large`, so every
# animation is 199 ticks, but that is a fact about today's sequences file and it is expected to
# change. IF A LADDER, A SPRITE OR AN `Explosions:` NAME MOVES, EVERY ENVELOPE BELOW MUST BE
# REGENERATED:  python3 tools/nuke-light/gen_fireball_light.py --write
# NuclearYieldTest re-derives the animation length from the same two sources and fails if the shipped
# YAML has drifted away from it, so this is enforced rather than merely requested.
#
# THE ENVELOPE IS MONOTONE ON PURPOSE AND IT COSTS REAL PHYSICS. A fireball genuinely double-flashes:
# a bright first pulse, a dip while the shock front in front of it is opaque, then a second and much
# larger maximum (t_min = 0.0025*sqrt(Y) s, t_max = 0.032*sqrt(Y) s, Glasstone). The first version of
# the light system rendered exactly that, and at a 60 ms timestep a bright-dim-bright sequence is a
# STROBE rather than a bhangmeter trace -- the user reported it as one. Every envelope here is
# therefore single-peaked. DO NOT REINTRODUCE A DIP. The same rule killed the staged
# FlashPaletteEffect stacks that used to sit on the five largest weapons in this file; see the note
# on `AtomicHighYield`'s Warhead@Flash for why stacking that effect is a square wave and not a
# plateau.
#
# ==== TRAPS, ALL OF WHICH ARE LIVE IN THIS FILE ====
#   * AirThreshold. Above a warhead's AirThreshold the engine substitutes `Air` for the terrain
#     target types (Warhead.cs:41-45, CreateEffectWarhead.cs:165-166) and the warhead does NOTHING to
#     the ground -- no error, no lint failure, no visible symptom except that nothing dies. Every
#     damage, fire, EMP, suppression and smudge warhead below carries one, set to 1.6x its own
#     weapon's burst height and never below 24c0. The power that fires each weapon must keep its
#     DetonationAltitude under that number.
#   * ShockwaveDamage reach is min(MaxRadius, (Falloff.Length-1) * Spread) and the two are NOT
#     validated against each other at load, so whichever is smaller silently wins. Every blast wave
#     below has them made equal to the wdist.
#   * FlashPaletteEffect Duration above 30 is not a longer flash, it is a corrupted palette:
#     palettes.yaml pins the Nuke effect's Length at 30 and the lerp is unclamped past it. Long
#     flashes are stacks of overlapping 30-tick calls.
#   * The `onfire` ExternalCondition on infantry carries TotalCap: 10, so ten fire warheads is the
#     ceiling and an eleventh would be granted and discarded.
#   * Trees are damage-immune mod-wide (^TreeIndestructible, DamageMultiplier: Modifier: 0), so no
#     weapon here touches them and none of them pretends to.
#   * VisibleThroughFog IS NOT ENOUGH ON ITS OWN, and every fireball below carries RenderAboveFog
#     with it. VisibleThroughFog only stops the effect being CULLED. Without RenderAboveFog the
#     sprite goes in the ordinary world bucket, which WorldRenderer sorts by Pos.Y + Pos.Z + ZOffset
#     -- so ZOffset 4096 buys four cells of lead and nothing more, and every tree, field and building
#     more than about five cells SOUTH of the aim point sorts after a cloud that is up to 208 cells
#     wide and is drawn straight over it. That is what the user photographed. RenderAboveFog moves
#     the draw into the bucket between the fog layers and the opaque unexplored layer, which is past
#     every actor as well as past the fog. These blocks were written from the pre-RenderAboveFog copy
#     of Atomic's fireball: wt/nuke-fog and wt/nuke-arsenal were merged 45 seconds apart, and the
#     flag landed on Atomic and AtomicHighYield only.
# =====================================================================================================

# ---- B61-12 (0.3 kt) -- 0.3 kt --------------------------------------------------------
# the lowest dial setting on the B61-12, and the smallest yield in the current US stockpile.
#
#   blast (1 psi)         4.5 cells   = 1.069 * 0.3^(1/3) km at 160 m/cell
#   thermal (3rd deg)     2.2 cells   = 2.0 * (0.3/20)^0.41 km
#   fireball             0.13 cells   = 111 * (0.3/20)^0.40 m, and it burns 2 ticks (0.13 s)
#   burst height          1.0 cells   = 230 * 0.3^(1/3) m
#   blast wave           supersonic 0.13 -> 0.26 cells in 1 tick, then sonic at 7 ticks/cell;
#                        reaches its full 4.5c at tick 28 (2 s)
NukeB61Mod12Y003:
	ValidTargets: Ground, Trees, Water, Underwater, Air
	Warhead@Flash1: FlashPaletteEffect
		Duration: 8
		FlashType: Nuke
	Warhead@Shake1: ShakeScreen
		Duration: 15
		Intensity: 35
	Warhead@Shake2: ShakeScreen
		Duration: 15
		Intensity: 19
		Delay: 2
	Warhead@Shake3: ShakeScreen
		Duration: 15
		Intensity: 9
		Delay: 8
	# ===== THE FIREBALL, AS LIGHT =====
	# The house pattern established on `Atomic` in weapons-superweapons.yaml, evaluated at this
	# weapon's own yield. Read the long note there for the model; only the numbers differ here.
	#
	#   yield                 0.3 kt
	#   illumination reach    2.2 cells  = the THERMAL radius, 2.0 * (kt/20)^0.41 km at 160 m/cell.
	#                         NOT the fireball's own 21 m -- that is 0.13 cells and invisible. Illumination
	#                         reach scales as the fireball radius (Y^0.40) for a fixed surface
	#                         temperature and thermal reach as Y^0.41, so one array carries both.
	#   duration              199 ticks (11.9 s) = the fireball ANIMATION length; the 0.8*(kt/20)^0.44 s
	#                         physical fireball is only 2.1 ticks here and no longer sets this.
	#   fireball growth       Taylor-Sedov R ~ t^0.4, reaching full reach at t_max = 0.29 ticks
	#                         (0.032*sqrt(Y) s, Glasstone), then holding, then shrinking as it rises.
	#
	# THE INTENSITY ENVELOPE IS MONOTONE AND THAT IS A DELIBERATE DEPARTURE FROM THE PHYSICS.
	# A real fireball double-flashes -- bright pulse, opaque-shock dip, larger second maximum -- and
	# the first version of this system rendered that. At a 60 ms timestep it reads as a STROBE, which
	# is what the user reported, so every envelope in the mod is peak-at-tick-0 and monotone.
	#
	# REWORKED 2026-09-07 into TWO STAGES, after the user played it. The single curve this replaces
	# was 7.0*(1-t/D)^2 over a duration taken from the yield, which put this weapon's whole flash
	# inside 2 tick(s) -- 0.12 s, against a fireball animation that runs 199 ticks. The
	# light was dark for 99% of the cloud it was supposed to be lighting. The law is now
	#     stage 1, white spike   0 <= t <= 3:   I = 4.9 + 2.1 * (1 - t/3)^2
	#     stage 2, red fade      3 <= t <= 199: I = 4.9 * (1 - (t-3)/196)^2
	# Peak 7.0 at t=0, 4.9 at the shoulder, 0 at the end; continuous at the shoulder and monotone
	# non-increasing throughout, so the anti-strobe invariant is untouched. The two stages differ by
	# their RATE, not their direction: the drop out of blinding is 28x faster than the fade
	# that follows it, which is the "very short super-intense light, then a long fade" that was asked
	# for.
	#
	# THE DURATION IS NO LONGER TAKEN FROM THE YIELD. It is
	#     D = max(fireball animation length, physical fireball lifetime)
	# and here that is 199 ticks, from the fireball ANIMATION. The animation length is not a constant --
	# it is the SHP frame count walked along the `Tick`/`ChangeTick` ladder of the sequence named by
	# this weapon's own Warhead@Fireball `Explosions:` field. IF THAT LADDER CHANGES, THIS ENVELOPE
	# MUST BE REGENERATED: `python3 tools/nuke-light/gen_fireball_light.py --write`, and
	# NuclearYieldTest re-derives the same number and fails if it was not.
	#
	# PEAK INTENSITY IS 7.0 ON EVERY NUCLEAR WEAPON IN THE MOD, and stays flat on purpose. Fireball
	# surface brightness is set by temperature (~7000 K) and is very nearly yield-independent -- and
	# the renderer agrees: TerrainLighting sums `falloff * intensity * tint` with no clamp, so an
	# intensity of 7 is already saturated at the centre and raising it widens the blown-out core
	# rather than brightening anything. What yield buys is AREA and the length of the white phase.
	#
	# COLOUR now carries the cooling on its own axis, keyed on t/D rather than on intensity: white
	# through the spike, then yellow, orange, and a dull ember red at the end. Intensity and hue are
	# deliberately decoupled -- the light is still bright while it is already going orange, which is
	# what "goes towards red at the later stages" asks for.
	Warhead@FireballLight: LightEvent
		ValidTargets: Ground, Water, Air
		AirThreshold: 24c0
		ForceGroundLevel: true
		Light:
			Times: 0, 1, 2, 3, 15, 33, 55, 80, 92, 107, 136, 167, 199
			Intensities: 7, 5.83, 5.13, 4.9, 4.32, 3.51, 2.64, 1.81, 1.46, 1.08, 0.51, 0.13, 0
			Radii: 2c240, 2c240, 2c240, 2c240, 2c240, 2c240, 2c240, 2c240, 2c240, 2c168, 2c28, 1c903, 1c749
			Tints: E6F0FF, EAF3FF, EEF5FF, F3F8FF, FFFAF0, FFF2D3, FFE7B4, FFD88F, FFCF7B, FFC164, FC9E3E, E66E1D, B4280A
			Interpolations: Linear
			Falloff: InverseSquare
			TerrainRefreshInterval: 2
			# TerrainLighting tints the world BEFORE ShroudRenderer paints its fog quads, so under fog the
			# flash is ATTENUATED rather than hidden. GlowAboveFog draws the missing fraction back in the
			# slot between the fog layers and the opaque unexplored layer. This goes through exactly the
			# same seam as Atomic's: LightEventManager.RenderAboveFog walks its own `live` list and checks
			# Definition.GlowAboveFog per event, so it is the flag below and nothing weapon-specific.
			GlowAboveFog: true

	Warhead@Fireball: CreateEffect
		Explosions: nuke_large
		ScalePercent: 56
		Offset: 0,-1900,0
		Palette: effect_ts
		ZOffset: 4096
		ImpactSounds: kaboom1.aud
