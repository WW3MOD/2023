# 	Range: 3c0
# 	Report: chute1.aud
# 	Projectile: GravityBomb
# 		Image: PARABOMB
# 		OpenSequence: open
# 		Velocity: 0, 0, -40
# 		Acceleration: 0, 0, 0
# 		Shadow: False
# 	Warhead@Spread: SpreadDamage
# 		Spread: 768
