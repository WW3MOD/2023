MANPAD:
	Inherits@ExplosionEffects: ^MediumExplosionEffectsAir
	ValidTargets: Air
	Range: 23c0
	BurstWait: 200
	Report: missile1.aud
	Projectile: Missile
		MaximumLaunchSpeed: 20
		# 260813: was 1000, which is BELOW the horizon -- not "steeply up". WAngle loads raw
		# from YAML (1024 = 360 deg), and the launch clamp reads (sbyte)(Angle >> 2)
		# (Missile.cs:433-434): 1000 >> 2 = 250, and (sbyte)250 = -6. Against the default
		# MinimumLaunchAngle of WAngle(-64) -> -16 that clamped launch pitch to
		# [-16, -6] facing = [-22.5 deg, -8.44 deg], on a weapon that only shoots upward.
		# 252 >> 2 = 63 = +88.6 deg, i.e. as near vertical as this field can express.
		# 252 and not 256: the launch pitch is derived as vDist.Yaw.Facing (Missile.cs:425)
		# and tops out at +64 for a target directly overhead, so +64 would be an exact
		# no-op ceiling -- but CheckAngle.cs:56-58 rejects any raw angle in (255, 769), so
		# 256 fails `make test` and 255 is the highest legal raw value. 252 is the clean
		# encoding of facing 63 (63*4). The residual clamp is 1 facing unit (1.4 deg) on a
		# target directly overhead, which is noise.
		# Do NOT "tidy" this into degrees, and note that the lint PASSES the old 1000: it
		# reads (255, 769) as invalid, so 1000 is a legal *downward* angle as far as the
		# linter is concerned. It can catch a malformed angle, not a wrong-signed one.
		MaximumLaunchAngle: 252
		Acceleration: 25
		Speed: 450
		Inaccuracy: 256
		CloseEnough: 192
		RangeLimit: 24c0
		HorizontalRateOfTurn: 20
		Arm: 5
		Blockable: false
		ExplodeWhenEmpty: true
		Image: dragon
		TrailImage: smokey
		TrailScalePercent: 50
		ContrailLength: 40
		ContrailStartWidth: 8
	Warhead@Spread: SpreadDamage
		Damage: 3000
		Penetration: 15
		Spread: 192
		ValidTargets: Air
	Warhead@EffectGround: CreateEffect
		Explosions: explosion_small
		ImpactSounds: kaboom12.aud
		ValidTargets: Ground, Water, Trees

