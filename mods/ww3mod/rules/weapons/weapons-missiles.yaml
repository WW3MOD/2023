
ATGM:
	Inherits@ExplosionEffects: ^MediumExplosionEffects
	ClearSightThreshold: 3
	ValidTargets: Vehicle, Defense, Water
	TopAttack: true
	Range: 20c0
	MinRange: 3c0
	BurstWait: 200
	Report: missile6.aud
	Projectile: Missile
		Inaccuracy: 512
		Speed: 300
		Acceleration: 30
		RangeLimit: 21c0
		HorizontalRateOfTurn: 20
		AirburstAltitude: 32
		Blockable: false
		MaximumLaunchSpeed: 100
		CruiseAltitude: 10c0
		ContrailLength: 5
		Image: dragon
		TrailImage: smokey
		TrailScalePercent: 75
	Warhead@Target: TargetDamage
		Damage: 10000
		Penetration: 100
		DamageTypes: ExplosionDeath
	Warhead@Spread: SpreadDamage
		Spread: 64
		Damage: 2000
		DamageTypes: ExplosionDeath
	# 260813: ATGM had no air-valid effect warhead at all. CreateEffectWarhead promotes
	# any impact with DistanceAboveTerrain > AirThreshold (128) to the Air target type
	# (CreateEffectWarhead.cs:155-156), and the inherited ^MediumExplosionEffects
	# Warhead@Effect is ValidTargets: Ground, Ship, Trees, Mine (weapons-effects.yaml:554)
	# -- so with CruiseAltitude 10c0 = 10240 every airborne detonation drew NO sprite and
	# played NO sound. That is the visual half of "the Javelin misses and never explodes".
	# Same pattern as Hellfire/Ataka/TimerWolf below. Air ONLY, not Air + Ground: an impact
	# inside a ground actor's hitshape makes this warhead return ImpactActorType.Invalid
	# and suppress itself (CreateEffectWarhead.cs:81-87, :116-117), so exactly one of the
	# two effects ever fires.
	Warhead@EffectAir: CreateEffect
		ValidTargets: Air
		ImpactActors: true
		Explosions: explosion_air_medium
		ImpactSounds: kaboom25.aud

WGM:
	Inherits@ExplosionEffects: ^MediumExplosionEffects
	# Tree gating (260510): wire-guided ATGM is sensitive to foliage. ClearSightThreshold caps
	# total shadow density on the firing line; FreeLineDensity makes the first ~1 unit (one
	# small tree) a clean shot; MissChancePerDensity rolls a per-shot miss for each excess
	# unit, redirecting the missile to clip a tree on the line. Projectile.Blockable=false
	# disables the in-flight RNG roulette so the fire-time roll is the sole arbiter.
	ClearSightThreshold: 3
	FreeLineDensity: 1
	MissChancePerDensity: 15
	ValidTargets: Vehicle, Defense
	Range: 25c0
	MinRange: 3c0
	BurstWait: 500
	Report: vhumwe2a.wav, vhumwe2b.wav, vhumwe2c.wav, vhumwe2d.wav
	Projectile: Missile
		Blockable: false
		# Accuracy (260511): range-scaled — wire-guided by a human operator, so close
		# shots are near-perfect and long shots scatter realistically. PerCellIncrement 20
		# × 25c max range = 500 wd ≈ half a cell at maximum range. ManualGuidance kept
		# true (loses guidance if launcher dies) — matches the wire-guided fiction.
		Inaccuracy: 20
		InaccuracyType: PerCellIncrement
		RangeLimit: 25c0
		Speed: 300
		Acceleration: 30
		MaximumLaunchSpeed: 50
		# Turn rate (260511): dropped 60 → 8 so the operator-retarget swing
		# curves visibly over ~9 cells instead of snapping to the new target
		# at a near-straight angle. Tradeoff: corrections on fast-moving
		# targets are weaker — acceptable for wire-guided fiction.
		HorizontalRateOfTurn: 8
		RetargetTicks: 2
		Arm: 2
		ManualGuidance: true
		# Operator retargeting: if the target dies in flight the operator
		# tries to swing onto a new enemy. Veterancy reduces the reaction
		# delay (rookie = full 50 ticks ≈ 2 s, max veteran = instant).
		OperatorRetargetTicks: 50
		# Terrain-aware homing keeps the missile above ground during the descent
		# from CruiseAltitude — without it the dive into target overshoots ground
		# 1.7 cells short of target, and the missile detonates as a "ground hit".
		TerrainHeightAware: true
		CruiseAltitude: 100
		ContrailLength: 100
		ContrailStartWidth: 8
		Image: dragon
		TrailImage: smokey
		TrailScalePercent: 75
	Warhead@Target: TargetDamage
		Damage: 10000
		Penetration: 800
		DamageTypes: ExplosionDeath
	Warhead@Spread: SpreadDamage
		# EXPERIMENT 260510: 3x splash radius — near-misses still hurt.
		Spread: 192
		Damage: 2000
		DamageTypes: ExplosionDeath

WGM.bradley:
	Inherits: WGM
	Burst: 2
	BurstDelays: 100
	BurstWait: 1000

# Ataka (9M120, AT-9 Spiral-2) — Mi-28's primary ATGM in real life. SACLOS guided:
# the gunner keeps the crosshairs on target until impact, so it shares WGM's
# range-scaled scatter (operator-guided fiction). Subsonic, tandem HEAT warhead
# (Pen 900 vs Hellfire's 800) — Russia's anti-armor specialty. Effective range
# ~6 km in real life (22c here). Faster fire cycle than WGM (BurstWait 60) since
# helis can volley Atakas — but Burst 1 to stay true to operator-guidance.
Ataka:
	Inherits@ExplosionEffects: ^MediumExplosionEffects
	# Tree gating: same numbers as WGM. See WGM for explanation.
	ClearSightThreshold: 3
	FreeLineDensity: 1
	MissChancePerDensity: 15
	ValidTargets: Vehicle, Defense
	Range: 22c0
	MinRange: 3c0
	BurstWait: 60
	Report: missile6.aud
	Projectile: Missile
		Blockable: false
		# SACLOS — range-scaled scatter like WGM (PerCellIncrement 22 × 22c max
		# = ~0c484 max). Tighter than WGM per-cell because heli optics are
		# steadier than a Bradley turret operator.
		Inaccuracy: 22
		InaccuracyType: PerCellIncrement
		Speed: 400
		Acceleration: 30
		MaximumLaunchSpeed: 80
		HorizontalRateOfTurn: 20
		RetargetTicks: 2
		ManualGuidance: true
		OperatorRetargetTicks: 50
		TerrainHeightAware: true
		Arm: 2
		CruiseAltitude: 100
		RangeLimit: 22c0
		ContrailLength: 100
		ContrailStartWidth: 8
		Image: dragon
		TrailImage: smokey
		TrailScalePercent: 75
	Warhead@Target: TargetDamage
		Damage: 10000
		# Tandem HEAT: 900 pen vs Hellfire's 800. Russia's anti-reactive-armor edge.
		Penetration: 900
		DamageTypes: ExplosionDeath
	Warhead@Spread: SpreadDamage
		Spread: 192
		Damage: 2000
		# Pen 20 matches the Heli Heavy Thickness, mirroring Hellfire's fix. Mind the
		# scope: Ataka's weapon-level ValidTargets is Vehicle, Defense, so it cannot
		# engage an AIRBORNE heli at all — that is Air + Helicopter. What this helps is
		# a LANDED heli, which is Ground, Vehicle, Helicopter and so is valid for both
		# the weapon and this warhead (whose own ValidTargets defaults to Ground, Water).
		Penetration: 20
		DamageTypes: ExplosionDeath
	# Parity with Hellfire, but DORMANT on Ataka today — do not read it as a bug fix.
	# Ataka cannot target anything airborne (ValidTargets above), and its CruiseAltitude
	# of 100 sits below the 128 AirThreshold at which CreateEffectWarhead promotes a
	# position to the Air target type, so even a range-limit self-destruct (Missile
	# ExplodeWhenEmpty defaults true) reads as terrain rather than air. It goes live the
	# day Ataka is given Air or a higher cruise. ValidTargets: Air and NOT Air,
	# Helicopter — an airborne heli carries Air as well as Helicopter, while a LANDED
	# one is Ground/Vehicle and is already covered by Warhead@Effect; listing Helicopter
	# would draw two explosions on one impact.
	Warhead@EffectAir: CreateEffect
		ValidTargets: Air
		ImpactActors: true
		Explosions: explosion_air_medium
		ImpactSounds: kaboom25.aud

Ataka.AA:
	Inherits: Ataka
	# Mi-28 air-to-air mount (260817). Closes the gap where MI28's AttackAircraft
	# named a `secondary-air` armament that was never defined, leaving the only
	# 6000-credit Russian attack helicopter unable to engage ANY airborne target
	# (30mm.Heli is ValidTargets: Ground, Ataka is Vehicle, Defense; an airborne
	# target is Air/AirDetonateAttack/Helicopter). Its own build tooltip promised
	# "Can engage aircraft".
	#
	# WHY A SEPARATE WEAPON RATHER THAN ADDING `Air` TO Ataka. Not the reference
	# count — the flight profile. Ataka cruises at 100 and turns at 20, both tuned
	# for a SACLOS ground shot; helicopters cruise at 1560-2560 (aircraft.yaml:398,
	# aircraft-russia.yaml:471). Reusing that profile against a target fifteen
	# times its cruise altitude would have produced a weapon that fires, never
	# connects, and reads as correct in the YAML. Splitting lets the air numbers
	# move without touching Ataka's measured anti-tank behaviour, which is the same
	# reason 12.7mm.Hind.AA and 7.62mm.Minigun.AA exist.
	#
	# WHERE IT SITS ON THE LADDER. 12.7mm.Hind.AA documents the mod's own tiering
	# versus an 800hp attack helicopter: SHORAD Stinger and MANPAD ~1 hit, "a real
	# attack helicopter's own Hellfire" sub-second, the Hind's last-resort chin gun
	# 4-73s. MI28 is Russia's attack helicopter at HELI's exact price, so it belongs
	# in HELI's tier — which is what the INHERITED warheads already deliver
	# (Warhead@Target 10000/Pen 900 and Warhead@Spread 2000/Pen 20 against
	# helicopter Thickness 3-20 is full damage either way). No damage number is
	# invented here; only the two flight fields below are overridden, and both are
	# taken from Hellfire, the one missile in this mod already proven against air.
	#
	# The inherited Warhead@EffectAir stops being dormant on this variant — that is
	# the "goes live the day Ataka is given Air" case its comment above predicts.
	ValidTargets: Air
	Projectile: Missile
		# 512 is Hellfire's (the engine default, Missile.cs:126). Ataka's 100 also
		# sits below the 128 AirThreshold that promotes an impact position to Air.
		CruiseAltitude: 512
		# 60 is Hellfire's. 20 is a ground-attack turn rate and will not hold a lead
		# on a moving helicopter.
		HorizontalRateOfTurn: 60
	# Both damage warheads default to ValidTargets: Ground, Water (Warhead.cs:30),
	# so weapon-level Air alone would have let the missile fly and detonate for
	# nothing. Mirrors Hellfire's two warheads exactly.
	Warhead@Target: TargetDamage
		ValidTargets: Ground, Water, Air
		Damage: 10000
		Penetration: 900
		DamageTypes: ExplosionDeath
	Warhead@Spread: SpreadDamage
		ValidTargets: Ground, Water, Air
		Spread: 192
		Damage: 2000
		Penetration: 20
		DamageTypes: ExplosionDeath

Hellfire:
	Inherits@ExplosionEffects: ^MediumExplosionEffects
	# Tree gating (260510): same numbers as WGM. See WGM for explanation.
	ClearSightThreshold: 3
	FreeLineDensity: 1
	MissChancePerDensity: 15
	ValidTargets: Vehicle, Air, Defense
	Range: 25c0
	MinRange: 5c0
	BurstWait: 60
	Report: missile6.aud
	Projectile: Missile
		Blockable: false
		# Accuracy (260511): flat scatter — Hellfire is laser-guided (heli paints,
		# missile rides the laser), so accuracy doesn't degrade with distance the way
		# wire-guided WGM does. Tighter than infantry ATGM (0c512) — helis stay the
		# premium ATGM tier thanks to optics and time-on-target.
		Speed: 500
		MaximumLaunchSpeed: 100
		Acceleration: 30
		Inaccuracy: 0c256
		HorizontalRateOfTurn: 60
		RetargetTicks: 2
		# See WGM — prevents the descent-into-ground "fall short" bug.
		TerrainHeightAware: true
		# Operator retargeting (heli pilot) — see WGM.
		OperatorRetargetTicks: 50
		RangeLimit: 27c0
		ContrailLength: 10
		Image: dragon
		# Matches Ataka, its direct BRICS counterpart — same solid-rocket propulsion class,
		# so the same smoke trail. The asymmetry had no design reason behind it.
		TrailImage: smokey
		TrailScalePercent: 75
	Warhead@Target: TargetDamage
		ValidTargets: Ground, Water, Air
		Damage: 10000
		Penetration: 800
		DamageTypes: ExplosionDeath
	Warhead@Spread: SpreadDamage
		# EXPERIMENT 260510: 3x splash radius (matches WGM tweak).
		ValidTargets: Ground, Water, Air
		Spread: 192
		Damage: 2000
		# Penetration 20: heli→heli silent-vanish fix (260510, updated 260511).
		# Heli HitShapes are tiny (Circle Radius 32) — at flat Inaccuracy 0c256 the
		# missile lands ~150-200 wdist from a heli target on average (PDF-weighted),
		# well outside TargetDamage's tight default 1-wdist Spread. The fall-back is
		# this SpreadDamage warhead (Spread 192). With default Penetration 1 vs
		# Heavy heli Thickness 20 the falloff damage gets /20, leaving 5-50 damage
		# per missile — perceived as "missile silently vanished". Setting Pen 20
		# matches Heavy heli thickness so near-misses do meaningful damage
		# (~500-1000) without significantly buffing splash vs Heavy tanks
		# (Thickness 280-700, still ~7% effective).
		Penetration: 20
		DamageTypes: ExplosionDeath
	# THIS is the live one of the three (cf. Ataka, which is parity-only). Hellfire
	# genuinely lists Air in its weapon-level ValidTargets, yet inherited only the
	# ground-gated ^MediumExplosionEffects — so a kill on an airborne target drew no
	# impact at all, the visual half of the silent-vanish bug documented above. It also
	# takes the engine default CruiseAltitude of 512 (Missile.cs:126), well clear of the
	# 128 AirThreshold, so a range-limit self-destruct registers as air and bursts too.
	# See Ataka for why this is ValidTargets: Air rather than Air, Helicopter.
	Warhead@EffectAir: CreateEffect
		ValidTargets: Air
		ImpactActors: true
		Explosions: explosion_air_medium
		ImpactSounds: kaboom25.aud

Hellfire.Littlebird:
	Inherits: Hellfire
	# Littlebird's rack. Two deliberate departures from the Apache's mounting.
	#
	# 1. No Air (260815). The scout must not kill helicopters with missiles.
	#    Dropping Air also repairs two silent failures that made this rack read
	#    as "never does damage":
	#      - AttackBase.GetMinimumRangeVersusTarget (AttackBase.cs:597-620) takes
	#        the MIN across armaments VALID against the target. While the minigun
	#        was Helicopter-valid with MinRange 0, the pair's minimum versus a
	#        heli was 0, so Fly.cs never pushed the littlebird back out of this
	#        weapon's own 5c0 MinRange — and Armament.CanFire (Armament.cs:333-335)
	#        then refused the shot silently, indefinitely. Ground-only targeting
	#        restores the 5c0 standoff, because the minigun is not valid against
	#        Vehicle and so no longer drags the pair's minimum to zero.
	#      - Against a heli the 10000-damage TargetDamage warhead needs its impact
	#        within Spread (default WDist(1), TargetDamageWarhead.cs:23,64-65) of a
	#        Circle Radius 32 hitshape (aircraft.yaml:65-67), against 0c256 of
	#        scatter — so it nearly always fell through to the 2000/Pen-20 spread
	#        warhead and looked like a missile that hit for nothing.
	# 2. Range 20c0, five cells inside the Apache's 25c0 — the scout spots and
	#    plinks, the Apache is the standoff platform. RangeLimit tracks it down so
	#    a missile cannot outlive its own envelope by seven cells.
	ValidTargets: Vehicle, Defense
	Range: 20c0
	Projectile: Missile
		RangeLimit: 22c0

