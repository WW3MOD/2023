powerproxy.tacnuke:
	Valued:
		Cost: 15000
	Tooltip:
		Name: Tactical Nuclear Strike
	RenderSprites:
		Image: icon
	AlwaysVisible:
	Interactable:
	# 75 cash / interval -- 3.75x the conventional strikes, exactly as the price is. Against the 100 /
	# interval baseline passive income that is three quarters of a bare economy, and it is meant to
	# be: holding a doomsday option is a standing sacrifice, not a free hedge. The rate is the single
	# most tunable number in this feature and it is one field.
	InfersUpkeep:
		PermilleCost: 5
	# Grants `upkeep-unpaid` on this actor for the whole interval following a payday the owner could
	# not settle. The power below pauses on it. Per-actor by construction: every banked reservation
	# gets its own token, so they all go dormant together and all wake together.
	GrantConditionOnUpkeepShortfall:
		Condition: upkeep-unpaid
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 3
		Icon: abomb
		# The `~` HIDES the cameo when the host disabled the nuke, rather than greying one that
		# advertises a power nobody can have. See the note in the power block below.
		Prerequisites: ~tacnuke.enabled
		# The purchase IS the wait: this is the ChargeInterval this power used to carry, to the tick.
		BuildDuration: 11250
		Description: Low-yield nuclear warhead held in off-map reserve.
	MissileStrikePower@TacNuke:
		# THE LOBBY GATE MOVED, AND IT HAD TO. This block used to open with
		# `RequiresCondition: !tacnuke-disabled`, which was correct while the power lived on the Player
		# actor -- that is where GrantConditionOnLobbyOption@tacnuke grants the condition. CONDITIONS
		# ARE PER-ACTOR. Carried onto a proxy the same line reads a variable nothing on THIS actor ever
		# grants, evaluates `!0` = true, and hands every player a nuke while still LOOKING like a gate.
		# The replacement is a tech-tree prerequisite, which is per-PLAYER: ProvidesPrerequisite@tacnuke
		# on the Player publishes `tacnuke.enabled` under the same condition, and this proxy's
		# `Buildable: Prerequisites: ~tacnuke.enabled` above consumes it. The `~` is load-bearing -- it
		# hides the cameo outright rather than greying one that advertises a power the host switched off.
		OrderName: TacNukeStrike
		# NO Prerequisites, and that is deliberate: §1's table lists this entry's faction as "both".
		# It is the only one of the three approved powers that is not faction-locked.
		# `abomb` resolves to atomicon.shp (sequences-misc.yaml:16), the ONE power cameo in the mod
		# whose baked caption -- NUCLEAR BOMB -- is correct for its picture (§4a).
		Icon: abomb
		Name: Tactical Nuclear Strike
		Description: Low-yield nuclear warhead delivered from off-map reserves.\nDevastates a wide area and sets everything in it alight.\nEnters from the map edge nearest your Supply Route.
		Cursor: nuke
		MissileActor: tacnukemissile
		# 14c256 = 14592, NOT the 8c0 the two conventional strikes use, and the number is derived rather
		# than picked: 14592 - 6400 (DetonationAltitude below) = 8192, the same 8 cells of descent the
		# Kinzhal has. BallisticMissileFly interpolates its baseZ linearly from spawn Z to TARGET Z
		# (BallisticMissileFly.cs:252), so raising the detonation point without raising the spawn would
		# have eaten the descent -- 8192 down to 1792 over the same ground, a near-level approach ending
		# in mid-air. Keep the difference at 8192 if either number is ever retuned.
		SpawnAltitude: 14c256
		# THE AIRBURST. 6c256 = 6400, the same number mslo's NukePower has carried all along
		# (structures-defenses.yaml, `DetonationAltitude: 6c256`) -- so the two deliveries of the SAME
		# `Atomic` warhead finally agree. This is a correction toward the approved design, not a change
		# away from it: proposal SS5a's balance anchor states Atomic's ~266,000 peak on an Abrams
		# explicitly as "a 6.25-cell airburst", 6.25 cells being exactly this 6400. The ground burst
		# this power shipped with on 2026-09-04 was the number that departed from the anchor.
		#
		# NOTHING ELSE HAS TO MOVE FOR THE ANIMATION. CreateEffectWarhead spawns its sprite at the
		# impact position and only forces it to the deck when ForceDisplayAtGroundLevel is set
		# (CreateEffectWarhead.cs:140-150), which Atomic's Warhead@Fireball does not, so the mushroom
		# cloud rises with the burst on its own. (Fireball's `Offset: 0,-1900,0` is a separate,
		# pre-existing thing and is NOT airburst compensation: screen y is TileSize.Height * (Y - Z)
		# (WorldRenderer.cs:749), so -Y and +Z are the same displacement, and that offset -- 5700 after
		# the 300% ScalePercent -- lifts the 300%-scaled sprite off its own anchor. It applied equally
		# to the ground burst, which is why the ground burst looked low rather than looking wrong.)
		#
		# DO NOT RAISE THIS ABOVE 10c0. Every one of Atomic's ~30 damage, fire, EMP, suppression and
		# smudge warheads carries `AirThreshold: 10c0`, and above a warhead's AirThreshold the engine
		# stops evaluating terrain target types and substitutes `Air` (Warhead.cs:41-45,
		# CreateEffectWarhead.cs:165-166). At 10241 this nuke would still fly, still be aimed, still be
		# announced -- and do nothing to the ground, with no error and no lint. That whole AirThreshold
		# column is not decoration; it is what makes an airburst legal for this warhead and it is why
		# the other two powers must NOT copy this field (their effect warheads default to
		# `ValidTargets: Ground, Water` and AirThreshold 128).
		DetonationAltitude: 6c256
		# 500 ticks x 0.06 s = 30.0 s, the ceiling the user named, and the longest of the three. A
		# nuclear release is the one power in the mod where the wait IS the mechanic: this is the only
		# power with `DisplayTimerRelationships: Ally, Neutral, Enemy` below, so every player is already
		# watching its clock, and AbombLaunchDetected reaches the victim at ORDER time
		# (SupportPower.cs:238-251), 30 s before the missile so much as enters the map. That window is
		# what makes dispersing a possible answer to a nuke instead of a fantasy, which is the whole
		# argument for a deterrent being survivable.
		MissileDelay: 500
		# 20c0, matching mslo's NukePower rather than the 8c0 the two conventional strikes use: the
		# Atomic blast wave has MaxRadius 30c0, so a camera sized for a conventional strike would
		# show the player a fraction of what they just did.
		CameraRange: 20c0
		CameraSpawnAdvance: 25
		# 1000 ticks = 60 s, matching mslo. The Atomic warhead's own effects run to tick ~213 (the
		# outermost suppression band), so a 100-tick camera would close mid-detonation.
		CameraRemoveDelay: 1000
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		# Ally, Neutral, Enemy -- matching mslo's NukePower. EVERYONE watches a nuke timer; that is
		# what a deterrent is for, and it is the one power in the mod where hiding the clock from the
		# victim would be worse design rather than better.
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		# The one power in this feature whose shipped notification line is CORRECT rather than a
		# placeholder, so unlike the two conventional strikes this does not want replacing later.
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 3
		# ---- BOUGHT, NOT CHARGED ---------------------------------------------------------------
		# ChargeInterval is GONE rather than lowered, and StartFullyCharged is what replaces it. A
		# power you pay for and then still have to wait to charge is gated twice for the same thing,
		# which is the exact failure this economy exists to avoid. The wait is now the PURCHASE
		# (Buildable.BuildDuration above) and it is the OLD ChargeInterval to the tick, so the relative
		# scarcity the three powers were tuned against is unchanged -- only the currency is new.
		StartFullyCharged: True
		# One purchase, one firing. Without this a single buy is a permanent ability and every price in
		# the menu is decoration.
		OneShot: True
		# Each purchase is its own proxy actor and therefore its own icon, keyed `<OrderName>_<ActorID>`
		# (SupportPowerManager.cs:48-51). This is what makes three banked strikes three reservations,
		# three upkeep lines and three cameos rather than one.
		AllowMultiple: True
		# MANDATORY, not tidiness. InfersUpkeep unregisters only on INotifyRemovedFromWorld, so a spent
		# proxy left in the world bills the player for a reservation that no longer exists, forever.
		# OneShot hides the ICON; it does not remove the ACTOR.
		DisposeSelfOnActivate: True
		# Right-click the cameo in the bin to hand the reservation back for a FULL refund. Full is
		# forced rather than generous: ProductionQueue's own cancel path already returns everything paid
		# one tick before the bar fills, so any lower figure would destroy money at the instant the
		# purchase completed and make holding at 99% the optimal play forever.
		Releasable: True
		# DORMANT, NOT LAPSED. When the owner cannot pay the interval's upkeep bill,
		# GrantConditionOnUpkeepShortfall (above) grants `upkeep-unpaid` and this pauses the power: the
		# cameo stays in the bin wearing the shipped "ON HOLD" overlay, cannot fire, and comes back by
		# itself the moment the player is solvent. Nothing is destroyed -- a pooled upkeep float gives
		# no honest basis for choosing WHICH reservation to kill.
		PauseOnCondition: upkeep-unpaid
