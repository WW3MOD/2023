	#
	# THE POLARITY BELOW IS NEVERTHELESS IDENTICAL TO @tacnuke'S, and that is not a contradiction --
	# it is the whole reason the default above can be ON without anything failing open. The registered
	# default and the unregistered fallback are SEPARATE VALUES and only one of them lives here.
	# GrantConditionOnLobbyOption computes
	#     optionEnabled = OptionOrDefault(Option, !GrantWhenOptionDisabled)
