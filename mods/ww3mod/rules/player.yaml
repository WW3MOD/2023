	SupportPowerManager:
	# PHASE 1 of the missile strike powers (WORKSPACE/proposals/260904-missile-powers.md).
	# ChargeInterval is a placeholder so the power is reachable on its own; the buy/bank model that
	# is meant to gate it is Phase 2 and is not wired yet.
	MissileStrikePower@Kinzhal:
		OrderName: KinzhalStrike
		Prerequisites: player.russia
		Icon: precicon
		Name: Kh-47M2 Kinzhal
		Description: Hypersonic missile strike called in from off-map reserves.\nEnters from the map edge nearest your Supply Route.\nSAM sites can engage it, but rarely stop it.
		# 3000 ticks x 0.06 s (world.yaml Timestep: 60) = 180 s = 3 min. NOT 120 s: the 25 tps
		# figure asserted by several in-tree comments understates every duration by 1.5x.
		ChargeInterval: 3000
		Cursor: nuke
		MissileActor: kinzhalmissile
		# 150 ticks x 0.06 s = 9.0 s between the click and the missile appearing at the map edge, on top
		# of ~20 ticks of flight. The SHORTEST of the three, and the reason is the speed class rather
		# than the old caption: this power stopped claiming "Cannot be intercepted" on 2026-09-05, when
		# KinzhalMissile was retyped Hypersonic -> ICBM so a SAM can shoot at it and almost always miss
		# (vehicles-russia.yaml, KinzhalMissile -- the arithmetic is in the comment there). Tempo is
		# still the whole identity, and the short lead is still what protects it: a longer one hands the
		# defender exactly the reaction ticks the interception arithmetic says he does not have.
		# SS5a's framing is
		# "one Iskander missile, except you did not have to drive a 6000-credit launcher into range" --
		# so this gets the smallest lead that still stops the strike landing on the click.
		#
		# WHAT THE VICTIM GETS FOR THOSE 9 SECONDS: the IncomingSpeechNotification below, and nothing
		# else. SupportPower.PlayLaunchSounds fires it to every non-allied client AT ORDER TIME
		# (SupportPower.cs:238-251), before the missile exists, while the beacon and the minimap ping
		# are both gated on IsAlliedWith(RenderPlayer) (Beacon.cs:124, SupportPower.cs:228). So the
		# delay is an audible warning with no location attached -- deliberate, and the reason a longer
		# lead is not free: it is reaction time handed to the target.
		MissileDelay: 150
		# 8c0 = 8192 wdist = 8 cells above the terrain at the entry cell. This -- not LaunchAngle --
		# is what makes the approach look steep, and unlike LaunchAngle it does not scale with the
		# length of the shot. BallisticMissileFly interpolates baseZ from spawn Z to target Z
		# (BallisticMissileFly.cs:238-240), so the missile descends those 8 cells across the run.
		SpawnAltitude: 8c0
		CameraRange: 8c0
		# 25 ticks x 0.06 = 1.5 s of vision before impact, held for 100 x 0.06 = 6.0 s after it.
		CameraSpawnAdvance: 25
		CameraRemoveDelay: 100
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		# None, DOWN FROM Ally, and the user asked for exactly this: "We dont need to see a countdown of
		# ally players powers, it is just distracting. Maybe we can keep it for nukes, but not for other
		# powers." SupportPowerTimerWidget drops a power from the top-of-screen list entirely when this
		# is None (SupportPowerTimerWidget.cs:42), before the per-viewer relationship test.
		#
		# IT ALSO HIDES THE OWNER'S OWN LINE, and that is fine rather than a compromise: PlayerRelationship
		# has no `Self` (TraitsInterfaces.cs:63-69) and Player.RelationshipWith(self) returns Ally
		# (Player.cs:250-251), so `Ally` is precisely "me and my allies" and there is no narrower value to
		# reach for. Nothing is lost by it -- SupportPowersWidget draws FormatTime(RemainingTicks) onto
		# the cameo itself (SupportPowersWidget.cs:246) plus a sweeping clock overlay (:216-221), so the
		# owner's own countdown is still on screen in mm:ss, in the place they look for it.
		DisplayTimerRelationships: None
		BeaconPoster: precbcon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		# Placeholder: there is no conventional-strike warning line in notifications.yaml, and
		# AbombLaunchDetected would announce a nuke. Phase 2 audio should replace this.
		IncomingSpeechNotification: EnemyUnitsApproaching
		SupportPowerPaletteOrder: 1
	# PHASE 2 of the missile strike powers: the remaining two of the three approved entries
	# (WORKSPACE/proposals/260904-missile-powers.md §1). Both ride the SAME MissileStrikePower trait
	# the Kinzhal above proved in game at 894e8dc4 -- there is exactly one delivery mechanism in this
	# feature, and adding a second would be the mistake §1a warns about.
	#
	# THE PRICES ARE NOT WIRED, AND THAT IS INHERITED FROM THE KINZHAL, NOT NEW HERE. §9.3 approves
	# 4000 for the fast-strike tier and 15000 for the nuke, but the buy/bank model that would charge
	# them is the bodiless-proxy production loop in §2.4, which needs a sidebar tab -- and the tab
	# button draws a 16x16 glyph from the `production-icons` collection (chrome.yaml:157-177), which
	# has regions for building/defense/infantry/vehicle/aircraft/ship and NONE for powers. That is
	# art. So these carry ChargeInterval placeholders exactly as the Kinzhal does, but the
	# placeholders ENCODE THE APPROVED PRICE RATIO rather than being arbitrary, so the relative
	# scarcity is already right and only the currency is missing:
	#     Kinzhal   4000 -> 3000 ticks (180 s)   [above, shipped]
	#     GBU-57    4000 -> 3000 ticks (180 s)   same tier, same price, same interval
	#     tac nuke 15000 -> 11250 ticks (675 s)  15000/4000 = 3.75x, so 3000 x 3.75
	# All at Timestep 60 = 16.667 tps. NOT 25 tps: that figure, asserted by several in-tree
	# comments, understates every duration by 1.5x.
	MissileStrikePower@GBU57:
		OrderName: GBU57Strike
		Prerequisites: player.america
		# INTERIM ART, ruled by the manager rather than left blocked on a drawing. §4a wanted one new
		# cameo for the US strike and flagged reusing `precicon` as an asymmetry -- Russia generic,
		# America bespoke. That worry does not apply now the two powers are FACTION-LOCKED to
		# opposite sides: `Prerequisites: player.america` here against `player.russia` on the Kinzhal
		# means no player ever holds both, so no player can see the repeat. And PRECISION STRIKE is
		# not a wrong caption for a GBU-57.
		# DO NOT "improve" this to cmissicon or missicon however their names read: captions are baked
		# into the cameo PIXELS at rows 42-46, and those two are a biohazard trefoil captioned
		# CHEMICAL STRIKE and a building captioned TECH CENTER (§4a).
		Icon: precicon
		Name: GBU-57 Bunker Buster
		Description: Massive Ordnance Penetrator dropped on the target area.\nDevastating against hardened structures, weak against armour.\nEnters from the map edge nearest your Supply Route.
		ChargeInterval: 3000
		Cursor: nuke
		MissileActor: gbu57bomb
		# 300 ticks x 0.06 s = 18.0 s, DOUBLE the Kinzhal's, on top of ~80 ticks of flight at Speed 500.
		# The longest lead of the two conventional strikes, and it compounds with the slowest flight
		# rather than compensating for it -- which is the point. A Massive Ordnance Penetrator is not a
		# weapon of surprise: it is a scheduled demolition of a fixed hardened target, delivered by a
		# bomber that has to fly there. Making it the slowest thing in the menu end-to-end is what keeps
		# it from competing with the Kinzhal on tempo when the two cost the same (ChargeInterval 3000 on
		# both) and separates them on role instead.
		MissileDelay: 300
		# 12 cells, HALF AGAIN the Kinzhal's 8, and the two numbers do different jobs. Both powers
		# shape their approach with altitude rather than LaunchAngle, because LaunchAngle's apex
		# scales with shot length (BallisticMissileFly.cs:88-90) and altitude does not. But the MOP
		# flies at Speed 500 against the Kinzhal's 2000, so at the SAME altitude its descent would be
		# four times shallower over the same ground. 12 cells buys back the near-vertical terminal
		# plunge a bunker buster is supposed to have.
		SpawnAltitude: 12c0
		CameraRange: 8c0
		CameraSpawnAdvance: 25
		CameraRemoveDelay: 100
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		# None, for the reason spelled out on the Kinzhal above: the user asked for non-nuke countdowns
		# to stop appearing, and the owner's own clock survives on the cameo regardless.
		DisplayTimerRelationships: None
		BeaconPoster: precbcon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		# Same placeholder as the Kinzhal, and the same reason: notifications.yaml has no
		# conventional-strike warning line, and AbombLaunchDetected would announce a nuke this is
		# not. Replace both together when the audio lands.
		IncomingSpeechNotification: EnemyUnitsApproaching
		SupportPowerPaletteOrder: 2
	# The lobby gate for the tactical nuclear strike. §9.4: it ships, defaulting OFF, because the
	# doomsday design it belongs to (WORKSPACE/archive/plans/260324-nukes.md) is unresolved in the
	# user's own words, while the user asked for the power itself by name.
	#
	# THE POLARITY IS THE SAFETY PROPERTY. GrantConditionOnLobbyOption falls back to
	# OptionOrDefault(Option, !GrantWhenOptionDisabled) when the option is not registered at all
	# (GrantConditionOnLobbyOption.cs:47) -- so written THIS way round, an absent option reads false,
	# `tacnuke-disabled` is granted anyway, and the power stays hidden. Written the other way round
	# (Condition: tacnuke-allowed, GrantWhenOptionDisabled: false) the identical absence would
	# default to TRUE and hand every player a nuke. Do not invert this.
	GrantConditionOnLobbyOption@tacnuke:
		Option: tactical-nuke
		Condition: tacnuke-disabled
		GrantWhenOptionDisabled: true
	MissileStrikePower@TacNuke:
		# RequiresCondition, NOT PauseOnCondition, and the difference is visible to the player.
		# SupportPowersWidget filters the bin on `!p.Disabled` (SupportPowersWidget.cs:136), and
		# IsTraitDisabled reaches Disabled through SupportPowerInstance.Tick
		# (SupportPowerManager.cs:196-200), so this makes the icon ABSENT. PauseOnCondition would
		# instead leave a clickable-but-inert cameo reading "ON HOLD" (SupportPowersWidget.cs:241-244),
		# which is the wrong answer for a power the host chose not to enable. §2.5.
		RequiresCondition: !tacnuke-disabled
		OrderName: TacNukeStrike
		# NO Prerequisites, and that is deliberate: §1's table lists this entry's faction as "both".
		# It is the only one of the three approved powers that is not faction-locked.
		# `abomb` resolves to atomicon.shp (sequences-misc.yaml:16), the ONE power cameo in the mod
		# whose baked caption -- NUCLEAR BOMB -- is correct for its picture (§4a).
		Icon: abomb
		Name: Tactical Nuclear Strike
		Description: Low-yield nuclear warhead delivered from off-map reserves.\nDevastates a wide area and sets everything in it alight.\nEnters from the map edge nearest your Supply Route.
		ChargeInterval: 11250
		Cursor: nuke
		MissileActor: tacnukemissile
		# 14c256 = 14592, NOT the 8c0 the two conventional strikes use, and the number is derived rather
		# than picked: 14592 - 6400 (DetonationAltitude below) = 8192, the same 8 cells of descent the
		# Kinzhal has. BallisticMissileFly interpolates its baseZ linearly from spawn Z to TARGET Z
		# (BallisticMissileFly.cs:252), so raising the detonation point without raising the spawn would
		# have eaten the descent -- 8192 down to 1792 over the same ground, a near-level approach ending
		# in mid-air. Keep the difference at 8192 if either number is ever retuned.
		SpawnAltitude: 14c256
		# THE AIRBURST. 6c256 = 6400, the same number mslo's NukePower has carried all along
		# (structures-defenses.yaml, `DetonationAltitude: 6c256`) -- so the two deliveries of the SAME
		# `Atomic` warhead finally agree. This is a correction toward the approved design, not a change
		# away from it: proposal SS5a's balance anchor states Atomic's ~266,000 peak on an Abrams
		# explicitly as "a 6.25-cell airburst", 6.25 cells being exactly this 6400. The ground burst
		# this power shipped with on 2026-09-04 was the number that departed from the anchor.
		#
		# NOTHING ELSE HAS TO MOVE FOR THE ANIMATION. CreateEffectWarhead spawns its sprite at the
		# impact position and only forces it to the deck when ForceDisplayAtGroundLevel is set
		# (CreateEffectWarhead.cs:140-150), which Atomic's Warhead@Fireball does not, so the mushroom
		# cloud rises with the burst on its own. (Fireball's `Offset: 0,-1900,0` is a separate,
		# pre-existing thing and is NOT airburst compensation: screen y is TileSize.Height * (Y - Z)
		# (WorldRenderer.cs:749), so -Y and +Z are the same displacement, and that offset -- 5700 after
		# the 300% ScalePercent -- lifts the 300%-scaled sprite off its own anchor. It applied equally
		# to the ground burst, which is why the ground burst looked low rather than looking wrong.)
		#
		# DO NOT RAISE THIS ABOVE 10c0. Every one of Atomic's ~30 damage, fire, EMP, suppression and
		# smudge warheads carries `AirThreshold: 10c0`, and above a warhead's AirThreshold the engine
		# stops evaluating terrain target types and substitutes `Air` (Warhead.cs:41-45,
		# CreateEffectWarhead.cs:165-166). At 10241 this nuke would still fly, still be aimed, still be
		# announced -- and do nothing to the ground, with no error and no lint. That whole AirThreshold
		# column is not decoration; it is what makes an airburst legal for this warhead and it is why
		# the other two powers must NOT copy this field (their effect warheads default to
		# `ValidTargets: Ground, Water` and AirThreshold 128).
		DetonationAltitude: 6c256
		# 500 ticks x 0.06 s = 30.0 s, the ceiling the user named, and the longest of the three. A
		# nuclear release is the one power in the mod where the wait IS the mechanic: this is the only
		# power with `DisplayTimerRelationships: Ally, Neutral, Enemy` below, so every player is already
		# watching its clock, and AbombLaunchDetected reaches the victim at ORDER time
		# (SupportPower.cs:238-251), 30 s before the missile so much as enters the map. That window is
		# what makes dispersing a possible answer to a nuke instead of a fantasy, which is the whole
		# argument for a deterrent being survivable.
		MissileDelay: 500
		# 20c0, matching mslo's NukePower rather than the 8c0 the two conventional strikes use: the
		# Atomic blast wave has MaxRadius 30c0, so a camera sized for a conventional strike would
		# show the player a fraction of what they just did.
		CameraRange: 20c0
		CameraSpawnAdvance: 25
		# 1000 ticks = 60 s, matching mslo. The Atomic warhead's own effects run to tick ~213 (the
		# outermost suppression band), so a 100-tick camera would close mid-detonation.
		CameraRemoveDelay: 1000
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		# Ally, Neutral, Enemy -- matching mslo's NukePower. EVERYONE watches a nuke timer; that is
		# what a deterrent is for, and it is the one power in the mod where hiding the clock from the
		# victim would be worse design rather than better.
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeaconPoster: atomicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		# The one power in this feature whose shipped notification line is CORRECT rather than a
		# placeholder, so unlike the two conventional strikes this does not want replacing later.
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 3
