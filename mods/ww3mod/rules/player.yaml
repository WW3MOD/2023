		# MANDATORY, not tidiness. InfersUpkeep unregisters only on INotifyRemovedFromWorld, so a spent
		# proxy left in the world bills the player for a reservation that no longer exists, forever.
		# OneShot hides the ICON; it does not remove the ACTOR.
		DisposeSelfOnActivate: True
		# Right-click the cameo in the bin to hand the reservation back for a FULL refund. Full is
		# forced rather than generous: ProductionQueue's own cancel path already returns everything paid
