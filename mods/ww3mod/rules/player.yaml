		Prerequisites: powers.event
		# OWN CAMEO SINCE 2026-09-09: Castle Romeo, an 11 Mt shot for a 6 Mt strike. Went `abomb` ->
		# `v2bdgricon` -> here; see @TacNuke above for the first move and power.sarmat for who kept
		# v2bdgricon. 6 Mt losing the base game's cameo to a weapon 8x its size is the point of that
		# reservation, not a casualty of it. Keep in step with power.highyieldnuke.
		Icon: highyieldnuke
		CameoCaption: 6 MT
		CameoBadge: nuclear
		Name: Strategic Nuclear Strike (6 Mt)
		Description: High-yield strategic warhead delivered from off-map reserves.\nA single detonation devastates the entire battlefield.\nArrives over your own back line on a fixed heading.
		# BOUGHT, NOT CHARGED, and this is the wholesale replacement the placeholder that stood here
		# predicted: "the doomsday mechanic this weapon is being built for will almost certainly not
		# charge it on a timer at all". Price 40000 on power.highyieldnuke (powers.yaml:621) -- this
		# comment said 25000 until 2026-09-09, which was the price when it was written and has since
		# moved twice; the header table at powers.yaml:61 is the one that stayed right. Same lobby
		# note as @TacNuke: unticking the host option removes the shop entry, not just the cameo.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: highyieldnukemissile
		# 31c0 = 31744. DERIVED, not picked: 31744 - 15360 (DetonationAltitude below) = 16384, sixteen
		# cells of descent -- twice the eight the Kinzhal and the tac nuke hold. BallisticMissileFly
		# interpolates baseZ linearly from spawn Z to TARGET Z (BallisticMissileFly.cs:252), so the
		# visible dive IS this difference; raising the burst without raising the spawn eats it and
		# leaves a near-level approach ending in mid-air. Sixteen rather than eight because this
		# missile flies at Speed 550 against the tac nuke's 900 and would otherwise look like it was
		# gliding. KEEP THE DIFFERENCE AT 16384 IF EITHER NUMBER IS RETUNED.
		SpawnAltitude: 31c0
		# THE AIRBURST, and it is set by the SPRITE rather than by ballistics. Screen y is
		# TileSize.Height * (Y - Z) (WorldRenderer.cs:749), so the fireball's total lift above the aim
		# point is DetonationAltitude + (-Offset.Y * ScalePercent/100). AtomicHighYield's Warhead@Fireball
		# keeps `Offset: 0,-1900,0`.
		#
		# SCALEPERCENT MOVED 700 -> 1017 ON 2026-09-08 AND THIS DID NOT MOVE WITH IT, which is the
		# opposite of what this comment used to instruct. The old rule held the tac nuke's lift-to-
		# sprite proportion (6400 + 1900*3 = 12100 at scale 3; 15360 + 13300 = 28660 against a
		# proportional 28233 at scale 7, within 1.5%). What that proportion actually protects is the
		# cloud not DETACHING from the ground, and the test for that is `lift - spriteHalfHeight > 0`.
		# At scale 10.17 the lift is 15360 + 19323 = 34683 against a half-height of 67254, so the base
		# sits 31.8 cells below the aim point -- further under the ground than the 17.2 it sat at scale
		# 700, not closer to floating. Across all fourteen nuclear weapons the ratio spans 1.49x after
		# the change against 1.41x before; it was only ever constant for this one pair.
		#
		# AND THIS NUMBER IS LOAD-BEARING ELSEWHERE, which is the real reason not to chase the sprite
		# with it: SpawnAltitude above is pinned to it by exactly 16384, and every AtomicHighYield
		# warhead carries AirThreshold: 24c0, above which the engine substitutes `Air` for the terrain
		# target types and the warhead silently does nothing (Warhead.cs:41-45). 15c0 leaves 9 cells of
		# headroom; the proportional 21c2 would leave under 3.
		#
		# 15c0 is also honest physics for the yield, though not for the yield this comment used to
		# name. The weapon was relabelled from ~800 kt to ~6 Mt on 2026-09-06 (102c0 of blast at the
		# mod's 160 m/cell scale is 16.3 km, which is the ~2.7 psi contour of a 6 Mt weapon, not an
		# 800 kt one). 15c0 is 2.4 km, a SCALED burst height of 2400 / 6000^(1/3) = 132 m per
		# kt^(1/3), which is in the band that optimises the ~7 psi contour -- a legitimate airburst
		# height for a weapon this size.
		#
		# DO NOT RAISE THIS ABOVE 24c0. Every one of AtomicHighYield's 27 damage, fire, EMP, suppression
		# and smudge warheads carries `AirThreshold: 24c0`, and above a warhead's AirThreshold the engine
		# stops evaluating terrain target types and substitutes `Air` (Warhead.cs:41-45,
		# CreateEffectWarhead.cs:165-166). At 24577 this missile would still fly, still be aimed, still
		# be announced -- and do NOTHING to the ground, with no error and no lint. The 9 cells of
		# headroom between 15c0 and 24c0 exist so that retuning the look cannot silently cross it; if
		# you need more than 24c0, raise the AirThreshold column FIRST and in one edit.
		DetonationAltitude: 15c0
		# 500 ticks = 30.0 s, the same wait as the tactical nuke and the same ceiling the user named
		# for the strike powers. Not lengthened for the bigger weapon: `DisplayTimerRelationships`
		# below is already Ally/Neutral/Enemy and AbombLaunchDetected reaches the victim at ORDER time
		# (SupportPower.cs:238-251), so the warning is public either way, and thirty seconds is already
		# long enough that dispersing is a real answer.
		MissileDelay: 500
		# 55c0, AND THIS IS A HARD ENGINE CEILING, NOT A TUNING CHOICE. CameraRange reaches
		# MapGrid.MaximumTileSearchRange (MapGrid.cs:113, default 56) through
		# RevealShroudEffect.ProjectedCells -> MapLayers.ProjectedCellsInRange ->
		# Map.FindTilesInAnnulus, which THROWS ArgumentOutOfRangeException for any maxRange above it
		# (Map.cs:1994). It is not clamped and there is no lint for it, so an oversized CameraRange is
		# a HARD CRASH at the tick the strike camera spawns -- CameraSpawnAdvance ticks BEFORE the
		# detonation, so the game dies before the player ever sees the weapon fire.
		#
		# Observed 2026-09-06: this shipped at 68c0 (scaled from @TacNuke's then-20c0, which was 0.67x
		# its then-30c0 blast wave, so 0.67 x 102 = 68) and killed the game 15 s into the demo with
		# `The requested range (69) cannot exceed the value of MaximumTileSearchRange (56)`.
		#
		# 55 cells of radius is 110 cells across, which still covers essentially the whole of the
		# largest shipped map (130x130), so the practical cost of the ceiling is close to zero here.
		# Raising MaximumTileSearchRange in mod.yaml's MapGrid section is possible -- it is a
		# FieldLoader field, and the grid precomputes TilesByDistance up to it -- but that is a global
		# shared by every tile search in the mod and is not a decision to make inside a weapon.
		CameraRange: 55c0
		# 85, which is @TacNuke's 25 x 3.4. The camera has further to reveal and the wave takes longer
		# to get going, so it opens proportionally earlier.
		CameraSpawnAdvance: 85
		# 1800 ticks = 108 s. AtomicHighYield's own effects run to tick ~890 (the outermost suppression
		# band, 53 s) and its innermost fire condition lasts 1500 ticks (90 s), so a camera sized like
		# @TacNuke's 1000 would close while the map was still burning. The 890 figure moved from ~724
		# on 2026-09-06: the blast wave now leaves the fireball supersonic and reaches its full 102
		# cells sooner (597 ticks against 714), but the suppression bands were re-derived from the
		# integrated wavefront and the outermost one sits past MaxRadius, so the tail is longer.
		CameraRemoveDelay: 1800
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		# Ally, Neutral, Enemy, matching @TacNuke and mslo. If any launch in the mod should be public
		# it is this one.
		DisplayTimerRelationships: Ally, Neutral, Enemy
