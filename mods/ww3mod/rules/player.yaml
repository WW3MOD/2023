		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 3
	# The lobby gate for the HIGH-YIELD STRATEGIC nuclear strike. It ships defaulting ON -- the ONLY
	# power in the mod that does -- and that is the user's explicit, temporary choice rather than a
	# slip. Their words, 2026-09-06: "You can add the high yield nuke as a new power, even though we
	# might disable it later, but for testing we keep it (even after this session, I will deal with it
	# later before release ... so there will be two nuke powers)." Two nuclear powers side by side,
