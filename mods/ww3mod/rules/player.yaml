	# THE POWERS QUEUE. Buying a strike is a production order like any other, and that is not a
	# metaphor: the item is a real bodiless actor produced at the Supply Route, which is what lets it
	# carry a price, a build time, a cameo, an upkeep line and a support power all at once.
	#
	# WHY A NEW TYPE RATHER THAN REUSING `Defense`. rules/ai/ai.yaml names queues by type, and the bot
	# modules' defaults are BuildingQueues {Building}, DefenseQueues {Defense} and UnitQueues
	# {Vehicle, Infantry, Plane, Ship, Aircraft}. `Powers` appears in none of them and in no explicit
	# list in ai.yaml either, so NO BOT CAN QUEUE A POWER -- which is the wanted answer, because a bot
	# that bought strikes it never fires would pay upkeep on them forever and go quietly bankrupt in a
	# way that reads as a balance bug. PowersQueueIsInvisibleToEveryBotModule in PowersEconomyTest.cs
	# pins it, so adding "Powers" to a bot list becomes a red test rather than a slow drain.
	ClassicProductionQueue@Powers:
		Type: Powers
		DisplayOrder: 5
		BlockedTextNotification: Unable to reserve more.
	PlaceBuilding:
		NewOptionsNotification: NewOptions
		CannotPlaceNotification: BuildingCannotPlaceAudio
