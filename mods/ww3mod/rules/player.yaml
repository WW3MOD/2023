		Description: Variable-yield tactical bomb at its MIDDLE dial setting.\nThirty-three times the 0.3 kt energy, three times the radius.\nComes in from off-map over your own back line.
		# BOUGHT, NOT CHARGED, like every other power in the mod. No ChargeInterval: SupportPowerInstance
