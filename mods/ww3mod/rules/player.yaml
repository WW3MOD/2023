		MissileDelay: 120
		# Sized for ONE RV, not for the salvo: there are six of them and they can be anywhere, so six
		# small reveals is the right shape. Same reasoning as MissileStrikePower@Sarmat's move from
		# 51c0 to 30c0 -- but smaller again, because a conventional impact is a two-cell event.
		CameraRange: 8c0
		CameraSpawnAdvance: 25
		CameraRemoveDelay: 100
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
