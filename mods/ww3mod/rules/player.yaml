		# -> `paranuke` -> here. `abomb` was reserved for the Tsar Bomba on 2026-09-08 at the user's
		# request; `paranuke` then became a photograph of an American B61-12, which is not something
		# an unattributed event-tier strike should wear. Keep in step with power.tacnuke.
		Icon: tacnuke
		CameoCaption: 20 KT
		CameoBadge: nuclear
		Name: Tactical Nuclear Strike (20 kt)
		Description: Low-yield nuclear warhead delivered from off-map reserves.\nDevastates a wide area and sets everything in it alight.\nArrives over your own back line on a fixed heading.
		# BOUGHT, NOT CHARGED. Price 15000 on power.tacnuke in rules/powers.yaml -- the same figure
		# the Phase-2 note below quotes from the proposal, now actually charged. The lobby gate
