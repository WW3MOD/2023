	# NOT PowersLobbyOptions' HighYieldNukeCheckboxEnabled, which is consulted only when the trait is
	# present to register the option at all. So written THIS way round:
	#     option registered and on (the shipped default) -> no condition -> the power is available
	#     option registered and off (host unticked it)   -> `highyieldnuke-disabled` -> hidden
	#     option NOT REGISTERED AT ALL                   -> falls back to false -> hidden
	# The third row is the one that matters: PowersLobbyOptions stripped from world.yaml, an old saved
	# session, a map that removes the trait. Written the other way round (Condition:
	# highyieldnuke-allowed, GrantWhenOptionDisabled: false) that same absence would fall back to TRUE
	# and hand a map-ending weapon to a build that never registered the option. Turning the checkbox
	# default off before release is a one-word change in PowersLobbyOptions.cs and needs NO edit here.
