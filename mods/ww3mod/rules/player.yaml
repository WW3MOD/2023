	# DEFCON ESCALATION -- the player-actor half of the spine. The World actor half is
	# DefconEscalation in world.yaml, which owns the level; these two are how it is seen and moved.
	#
	# INERT BY DEFAULT AND THAT IS THE POINT: the game mode dropdown defaults to Skirmish, in which
	# DefconEscalation holds no level at all, so GrantConditionOnDefconLevel grants nothing and
	# DefconCasualtyObserver has nothing to report to. Nothing here changes a match until the host
	# picks DEFCON Escalation.
	#
	# DefconCasualtyObserver sits HERE, on the Player actor, and not on the World, because
	# INotifyKilled is the only hook that names the killer and Health delivers it to the victim's own
	# traits and to `self.Owner.PlayerActor` only (Health.cs:126,233-236). A World trait would never
	# be called. One instance per player, one delivery per death.
	DefconCasualtyObserver:
	# Grants exactly one of these at a time and REVOKES it when the level moves -- unlike
	# GrantConditionOnLobbyOption, which grants once in Created and can never take it back.
	# Nothing consumes these three yet; that is the next piece of the feature, and until it lands
	# `--check-yaml` will report them as a granted-but-unconsumed WARNING on the Player actor
	# (CheckConditions.cs:70-71 -- emitWarning, not emitError, so it cannot fail the gate).
	# Key a consumer on any one of them, or on `defcon-1 || defcon-2` for "2 or below".
	GrantConditionOnDefconLevel:
		Conditions:
			3: defcon-3
			2: defcon-2
			1: defcon-1
	# THE NUCLEAR RELEASE LADDER'S YAML FACE, and the first real consumer the DEFCON spine has had.
	#
	# Grants one condition per RELEASED YIELD BAND, cumulatively, and revokes as the ladder climbs.
	# Every nuclear power in the mod is gated on the band its own warhead falls in -- ten in
	# rules/ingame/nuclear-arsenal.yaml, three in this file (@B61Mid, @TacNuke, @HighYieldNuke).
	#
	# OUTSIDE DEFCON ESCALATION THIS GRANTS EVERYTHING, on the first tick, forever. That is what
	# keeps Skirmish a strict no-op: it is the shipped default game mode and every nuclear demo and
	# test scenario runs in it, so those matches permit exactly what they permitted before the
	# ladder existed. Do not "tighten" this to Escalation-only without also rewriting every scenario
	# under tools/autotest/scenarios that fires a nuke -- the symptom is a demo that silently stops
	# firing rather than an error.
	#
	# `nuclear-release-unrestricted` is the Tsar Bomba's gate and is granted in exactly the modes
	# above, never inside Escalation. Decision 04: the weapon stays in code, out of normal play.
	GrantConditionOnNuclearRelease:
