# ================================================================================================
# THE BOUGHT POWERS -- three bodiless proxy actors, one per approved strike.
#
# WHY THEY EXIST AT ALL, since the powers worked perfectly well on the Player actor: a reservation
# has to be a THING you can own several of, pay upkeep on, and hand back. SupportPowerManager keys
# an AllowMultiple power `<OrderName>_<ActorID>` (SupportPowerManager.cs:48-51), so N banked strikes
# require N ACTORS. On the Player actor there is exactly one actor and therefore exactly one
# instance, forever. Everything else here follows from that one constraint.
#
# BODILESS IS THE POINT, NOT A SHORTCUT. None of these carries an IOccupySpace trait of any kind, so
# Production.Produce takes its bodiless branch (Production.cs:126-131) -- a branch that exists
# precisely so a purchase can deliver something that is not a unit. The whole loop was proven in a
# real game by tools/autotest/scenarios/test-power-buy-loop: bought, banked, fired, consumed.
#
# THE FOUR TRAITS THAT LOOK LIKE DECORATION AND ARE NOT:
#
#   RenderSprites  ProductionPaletteWidget.cs:683 calls item.TraitInfo<RenderSpritesInfo>()
#                  UNGUARDED, so a buy-menu item without it throws when the tab draws. `Image: icon`
#                  points at the sequence collection the power cameos already live in, so the buy
#                  cameo and the bin cameo are the same picture resolved the same way.
#   Interactable   Tooltip is `TooltipInfoBase : Requires<IMouseBoundsInfo>` (Tooltip.cs:16) and a
#                  positionless actor has no Selectable and no IsometricSelectable to supply it.
#                  Dropping Tooltip instead is NOT an alternative -- CheckTooltips errors on any
#                  actor carrying Buildable without one. Interactable is inert with no position.
#   AlwaysVisible  the proxy is never rendered; this keeps visibility resolution off the map.
#   InfersUpkeep   the standing cost of holding the reservation. See the per-actor note below.
#
# BuyLoopProxyTest pins that trait chain against the exact check the merge gate runs.
# ================================================================================================

powerproxy.kinzhal:
	Valued:
		Cost: 4000
	Tooltip:
		Name: Kh-47M2 Kinzhal
	RenderSprites:
		Image: icon
	AlwaysVisible:
	Interactable:
	# 20 cash / interval at PermilleCost 5 -- the same 0.5% rate every infantryman and vehicle in the
	# mod already pays, so a reserved strike costs what a parked tank costs. Comfortably above the
	# 1.0 floor below which IngameCashCounterLogic casts a group to 0 and drops its row entirely.
	InfersUpkeep:
		PermilleCost: 5
	# Grants `upkeep-unpaid` on this actor for the whole interval following a payday the owner could
	# not settle. The power below pauses on it. Per-actor by construction: every banked reservation
	# gets its own token, so they all go dormant together and all wake together.
	GrantConditionOnUpkeepShortfall:
		Condition: upkeep-unpaid
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 1
		Icon: precicon
		Prerequisites: player.russia
		# The purchase IS the wait: this is the ChargeInterval this power used to carry, to the tick.
		BuildDuration: 3000
		Description: Hypersonic missile strike held in off-map reserve.
	MissileStrikePower@Kinzhal:
		OrderName: KinzhalStrike
		Prerequisites: player.russia
		Icon: precicon
		Name: Kh-47M2 Kinzhal
		Description: Hypersonic missile strike called in from off-map reserves.\nEnters from the map edge nearest your Supply Route.\nCannot be intercepted.
		Cursor: nuke
		MissileActor: kinzhalmissile
		# 150 ticks x 0.06 s = 9.0 s between the click and the missile appearing at the map edge, on top
		# of ~20 ticks of flight. The SHORTEST of the three, and the reason is the power's own caption:
		# "Hypersonic ... Cannot be intercepted". Tempo is the whole identity here -- SS5a's framing is
		# "one Iskander missile, except you did not have to drive a 6000-credit launcher into range" --
		# so this gets the smallest lead that still stops the strike landing on the click.
		#
		# WHAT THE VICTIM GETS FOR THOSE 9 SECONDS: the IncomingSpeechNotification below, and nothing
		# else. SupportPower.PlayLaunchSounds fires it to every non-allied client AT ORDER TIME
		# (SupportPower.cs:238-251), before the missile exists, while the beacon and the minimap ping
		# are both gated on IsAlliedWith(RenderPlayer) (Beacon.cs:124, SupportPower.cs:228). So the
		# delay is an audible warning with no location attached -- deliberate, and the reason a longer
		# lead is not free: it is reaction time handed to the target.
		MissileDelay: 150
		# 8c0 = 8192 wdist = 8 cells above the terrain at the entry cell. This -- not LaunchAngle --
		# is what makes the approach look steep, and unlike LaunchAngle it does not scale with the
		# length of the shot. BallisticMissileFly interpolates baseZ from spawn Z to target Z
		# (BallisticMissileFly.cs:238-240), so the missile descends those 8 cells across the run.
		SpawnAltitude: 8c0
		CameraRange: 8c0
		# 25 ticks x 0.06 = 1.5 s of vision before impact, held for 100 x 0.06 = 6.0 s after it.
		CameraSpawnAdvance: 25
		CameraRemoveDelay: 100
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		# None, DOWN FROM Ally, and the user asked for exactly this: "We dont need to see a countdown of
		# ally players powers, it is just distracting. Maybe we can keep it for nukes, but not for other
		# powers." SupportPowerTimerWidget drops a power from the top-of-screen list entirely when this
		# is None (SupportPowerTimerWidget.cs:42), before the per-viewer relationship test.
		#
		# IT ALSO HIDES THE OWNER'S OWN LINE, and that is fine rather than a compromise: PlayerRelationship
		# has no `Self` (TraitsInterfaces.cs:63-69) and Player.RelationshipWith(self) returns Ally
		# (Player.cs:250-251), so `Ally` is precisely "me and my allies" and there is no narrower value to
		# reach for. Nothing is lost by it -- SupportPowersWidget draws FormatTime(RemainingTicks) onto
		# the cameo itself (SupportPowersWidget.cs:246) plus a sweeping clock overlay (:216-221), so the
		# owner's own countdown is still on screen in mm:ss, in the place they look for it.
		DisplayTimerRelationships: None
		BeaconPoster: precbcon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		# Placeholder: there is no conventional-strike warning line in notifications.yaml, and
		# AbombLaunchDetected would announce a nuke. Phase 2 audio should replace this.
		IncomingSpeechNotification: EnemyUnitsApproaching
		SupportPowerPaletteOrder: 1
		# ---- BOUGHT, NOT CHARGED ---------------------------------------------------------------
		# ChargeInterval is GONE rather than lowered, and StartFullyCharged is what replaces it. A
		# power you pay for and then still have to wait to charge is gated twice for the same thing,
		# which is the exact failure this economy exists to avoid. The wait is now the PURCHASE
		# (Buildable.BuildDuration above) and it is the OLD ChargeInterval to the tick, so the relative
		# scarcity the three powers were tuned against is unchanged -- only the currency is new.
		StartFullyCharged: True
		# One purchase, one firing. Without this a single buy is a permanent ability and every price in
		# the menu is decoration.
		OneShot: True
		# Each purchase is its own proxy actor and therefore its own icon, keyed `<OrderName>_<ActorID>`
		# (SupportPowerManager.cs:48-51). This is what makes three banked strikes three reservations,
		# three upkeep lines and three cameos rather than one.
		AllowMultiple: True
		# MANDATORY, not tidiness. InfersUpkeep unregisters only on INotifyRemovedFromWorld, so a spent
		# proxy left in the world bills the player for a reservation that no longer exists, forever.
		# OneShot hides the ICON; it does not remove the ACTOR.
		DisposeSelfOnActivate: True
		# Right-click the cameo in the bin to hand the reservation back for a FULL refund. Full is
		# forced rather than generous: ProductionQueue's own cancel path already returns everything paid
		# one tick before the bar fills, so any lower figure would destroy money at the instant the
		# purchase completed and make holding at 99% the optimal play forever.
		Releasable: True
		# DORMANT, NOT LAPSED. When the owner cannot pay the interval's upkeep bill,
		# GrantConditionOnUpkeepShortfall (above) grants `upkeep-unpaid` and this pauses the power: the
		# cameo stays in the bin wearing the shipped "ON HOLD" overlay, cannot fire, and comes back by
		# itself the moment the player is solvent. Nothing is destroyed -- a pooled upkeep float gives
		# no honest basis for choosing WHICH reservation to kill.
		PauseOnCondition: upkeep-unpaid

powerproxy.gbu57:
	Valued:
		Cost: 4000
	Tooltip:
		Name: GBU-57 Bunker Buster
	RenderSprites:
		Image: icon
