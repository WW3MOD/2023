	# THESE `Factions:` LISTS NAME EXACTLY THE FACTIONS THAT EXIST. They used to carry five more --
	# `nato`, `europe`, `ukraine` on the NATO side and `brics`, `china`, `belarus` on the other --
	# and every one of those was unreachable. Removed 2026-09-07 after checking, not after guessing,
	# because the strings were actively misleading: a reader (and, on the day this was removed, an
	# agent) took `china` for evidence that WW3MOD is a multi-faction game and recommended content
	# for a faction that does not exist.
	#
	# WHAT WAS CHECKED, since "it looks inert" is not the same claim as "it is inert":
	#   1. rules/world.yaml:257-275 is the ONLY place any Faction@ block is defined -- no map, no
	#      scenario and no other rules file declares one, so no map can introduce a faction name.
	#   2. It ships exactly three: `Random`, `america`, `russia`. The Ukraine block is commented out.
	#      Random is not a playable identity; its RandomFactionMembers is `america, russia`.
	#   3. Across all 10 shipped maps and all 294 autotest scenarios, every `Faction:` assignment is
	#      one of america (749), russia (266) or Random (34). There are no others.
	#   4. ProvidesPrerequisite.Update() is the only reader of this field, and it evaluates
	#      Info.Factions.Contains(faction) against Player.Faction.InternalName
	#      (ProvidesPrerequisite.cs:82-84) -- which by 1-3 can only ever be `america` or `russia`.
	# Removing a set member that can never equal the tested value cannot change Contains(), so this
	# is a provable no-op rather than a judged-safe one.
	#
	# THE PREREQUISITE AND CONDITION NAMES ARE UNTOUCHED AND MUST STAY. `player.nato` and
	# `player.brics` are consumed heavily by the AI layer (rules/ai/ai.yaml, ai-america.yaml,
	# ai-russia.yaml) and elsewhere they are bound to asset filenames; they are live identifiers
	# that happen to read like faction names. Only the dead FACTION strings went.
	ProvidesPrerequisite@NATO:
		Factions: america
		Prerequisite: player.nato
	GrantConditionOnPrerequisite@NATO:
		Condition: player.nato
		Prerequisites: player.nato
	ProvidesPrerequisite@America:
		Factions: america
		Prerequisite: player.america
	GrantConditionOnPrerequisite@America:
		Condition: player.nato
		Prerequisites: player.america
	ProvidesPrerequisite@BRICS:
		Factions: russia
		Prerequisite: player.brics
	GrantConditionOnPrerequisite@BRICS:
		Condition: player.brics
		Prerequisites: player.brics
	ProvidesPrerequisite@Russia:
		Factions: russia
		Prerequisite: player.russia
	GrantConditionOnPrerequisite@Russia:
		Condition: player.brics
		Prerequisites: player.russia
	ProvidesPrerequisite@natooramerica:
		Factions: america
		Prerequisite: nato.or.america
	ProvidesPrerequisite@bricsorrussia:
		Factions: russia
		Prerequisite: brics.or.russia
