	SupportPowerManager:
	# =========================================================================================
	# THE THREE TIERS -- the faction gate on the support-power buy tab, and the sandbox override.
	# =========================================================================================
	#
	# WHAT WAS ALREADY HERE, because building a second mechanism beside it would have been the real
	# mistake: the gate is `SupportPowerInfo.Prerequisites`, and it ALREADY reaches the buy tab.
	# SupportPowerProductionQueue filters BOTH AllItems() and BuildableItems() on
	# `instance.Purchasable` (SupportPowerProductionQueue.cs:99-113), and Purchasable is
	# bank.CanPurchase(Permitted) where Permitted folds in the faction prerequisite
	# (SupportPowerManager.cs:160-175). Filtering AllItems too is what makes a gated power ABSENT
	# from the shop rather than greyed out -- ProductionPaletteWidget draws one cameo per AllItems
	# entry and only DIMS the ones missing from BuildableItems.
	#
	# So the Kinzhal and the GBU-57 were genuinely faction-locked before this branch. What was NOT
	# gated was every nuclear power: eight of the ten carried no Prerequisites at all and any player
	# could buy any of them. This block closes that, and adds the tier that was missing.
	#
	#   powers.america   provided by faction `america`         -- America's five-rung buy ladder
	#   powers.russia    provided by faction `russia`          -- Russia's SIX-rung buy ladder
	#   powers.event     provided by NO faction, ever          -- Dead Hand / scripted / demo only
	#
	# EVERY THREE ARE ALSO PROVIDED BY THE SANDBOX LOBBY OPTION, which is the whole point of the
	# indirection. A prerequisite can be provided by more than one ProvidesPrerequisite trait and
	# TechTree takes the union, so "faction OR sandbox" is expressible where a bare `player.russia`
	# -- provided by faction alone -- is not. That is why the two conventional strikes moved off
	# `player.russia` / `player.america`: those two names are consumed by the AI layer
	# (rules/ai/ai-russia.yaml, ai-america.yaml) and must keep meaning "is this player Russia", so
	# the powers needed names of their own rather than a widened meaning for a shared one.
	#
	# WHY `Factions:` LISTS EXACTLY ONE NAME EACH. world.yaml ships exactly two Faction@ blocks,
	# `america` and `russia` (plus Random, whose RandomFactionMembers is those same two). Anything
	# else is unreachable -- see the note on ProvidesPrerequisite@NATO further down this file.
	ProvidesPrerequisite@PowersAmerica:
		Factions: america
		Prerequisite: powers.america
	ProvidesPrerequisite@PowersRussia:
		Factions: russia
		Prerequisite: powers.russia

	# ---- THE SANDBOX OVERRIDE ----
	# Three traits with NO `Factions:` filter, each enabled only while the sandbox option is on.
	# Together they hand every player all three tiers, so all sixteen powers are purchasable
	# regardless of faction. This is the user's test mode and it is meant to stay.
	#
	# THE POLARITY IS THE SAFETY PROPERTY AND IT IS INVERTED FROM WHAT READS NATURALLY. Do not
	# rewrite these as `RequiresCondition: powers-sandbox`. GrantConditionOnLobbyOption computes
	#     optionEnabled = OptionOrDefault(Option, !GrantWhenOptionDisabled)
	#     shouldGrant   = GrantWhenOptionDisabled ? !optionEnabled : optionEnabled
	# (GrantConditionOnLobbyOption.cs:45-49), so the fallback when the option is NOT REGISTERED AT
	# ALL is `!GrantWhenOptionDisabled`. Written this way round:
	#     option registered and off (the shipped default) -> `powers-sandbox-disabled` -> normal match
	#     option registered and on  (host ticked it)      -> no condition -> everything purchasable
	#     option NOT REGISTERED AT ALL                    -> falls back to false -> normal match
	# The third row is the one that matters. Written the other way round -- grant a `powers-sandbox`
	# condition when the option is ENABLED -- the identical absence would default to TRUE and every
	# match on a build with PowersLobbyOptions stripped, or an old saved session, would silently
	# hand both factions the Tsar Bomba. Same trap as @tacnuke and @highyieldnuke above.
	GrantConditionOnLobbyOption@powerssandbox:
		Option: powers-sandbox
		Condition: powers-sandbox-disabled
		GrantWhenOptionDisabled: true
	ProvidesPrerequisite@SandboxAmerica:
		Prerequisite: powers.america
		RequiresCondition: !powers-sandbox-disabled
	ProvidesPrerequisite@SandboxRussia:
		Prerequisite: powers.russia
		RequiresCondition: !powers-sandbox-disabled
	ProvidesPrerequisite@SandboxEvent:
		Prerequisite: powers.event
		RequiresCondition: !powers-sandbox-disabled

	# ---- TIERS FOR THE SIX POWERS DEFINED IN rules/ingame/nuclear-arsenal.yaml ----
	# DELIBERATELY HERE AND NOT THERE, and it is worth knowing why before "tidying" it back.
	# MiniYaml merges the `Player:` node across every file in mod.yaml's Rules list, so adding a
	# field to a trait defined in another file is ordinary and order-independent (the key does not
	# exist there, so there is nothing to win a last-write against). Keeping all sixteen tier
	# assignments in ONE list is worth the split: a tier table scattered over two files is a table
	# nobody can read, and the failure mode this whole branch exists to fix was exactly a gate
	# everyone believed was somewhere else.
	#
	# EveryPurchasablePowerDeclaresATier in OpenRA.Test/PowerPurchaseWiringTest.cs reads BOTH files
	# and fails if any power reaches the shop without one of the three names above, so this list
	# cannot silently fall behind the arsenal.
	MissileStrikePower@B61Low:
		Prerequisites: powers.america
	MissileStrikePower@B61Max:
		Prerequisites: powers.america
	MissileStrikePower@W76:
		Prerequisites: powers.america
	MissileStrikePower@Sarmat:
		Prerequisites: powers.event
	MissileStrikePower@B83:
		Prerequisites: powers.event
	MissileStrikePower@TsarBomba:
		Prerequisites: powers.event
	# Russia's four buy rungs, added by the manager at merge. Neither worker could write these:
	# the powers live in nuclear-arsenal.yaml (the weapons worker's file) while the tier names live
	# here (the roster worker's file), and only the OrderNames were contracted between them -- so
	# the roster worker deliberately left EveryPurchasablePowerDeclaresATier red rather than guess
	# a trait key and risk an incomplete MissileStrikePower, which is a mod-load failure and not a
	# lint warning. These four keys were read off nuclear-arsenal.yaml:373/413/452/492 after the
	# merge, not predicted.
	MissileStrikePower@Ru9M729:
		Prerequisites: powers.russia
	MissileStrikePower@RuIskander:
		Prerequisites: powers.russia
	MissileStrikePower@RuKinzhalN:
		Prerequisites: powers.russia
	MissileStrikePower@RuKalibr:
		Prerequisites: powers.russia

	# PHASE 1 of the missile strike powers (WORKSPACE/proposals/260904-missile-powers.md).
	# ChargeInterval is a placeholder so the power is reachable on its own; the buy/bank model that
	# is meant to gate it is Phase 2 and is not wired yet.
	MissileStrikePower@Kinzhal:
		OrderName: KinzhalStrike
		# RUSSIA'S CONVENTIONAL RUNG. `powers.russia`, not `player.russia`, and the swap is what
		# makes the sandbox toggle possible at all -- see THE THREE TIERS below. `player.russia` is
		# provided by faction ALONE, so nothing could ever unlock this for an America player; the
		# powers.* prerequisites are provided by faction OR by the sandbox lobby option.
		Prerequisites: powers.russia
		# Its own art since 2026-09-08. It shared `precicon` with the GBU-57 Bunker Buster until
		# then -- two different weapons drawing one picture, in the one palette where the player is
		# choosing between them. The GBU-57 keeps `precicon`; PRECISION STR. was never wrong for it.
		Icon: kinzhalicon
		Name: Kh-47M2 Kinzhal
		Description: Hypersonic missile strike called in from off-map reserves.\nArrives over your own back line on a fixed heading.\nSAM sites can engage it, but rarely stop it.
		# BOUGHT, NOT CHARGED (2026-09-06, at the user's request: "I want the powers to have their
		# own tab in the build menu ... where we actually have to buy them, before they pop up in
		# the side (and at that point they are already fully loaded)"). This is the buy/bank model
		# the Phase-2 note below was waiting on, and it is now wired.
		#
		# ChargeInterval IS GONE, not set to a large number: SupportPowerInstance forces TotalTicks
		# to 0 when RequiresPurchase is set, so any value left here would be inert. The price that
		# replaced it lives on power.kinzhal in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: kinzhalmissile
		# 150 ticks x 0.06 s = 9.0 s between the click and the missile appearing at the map edge, on top
		# of ~20 ticks of flight. The SHORTEST of the three, and the reason is the speed class rather
		# than the old caption: this power stopped claiming "Cannot be intercepted" on 2026-09-05, when
		# KinzhalMissile was retyped Hypersonic -> ICBM so a SAM can shoot at it and almost always miss
		# (vehicles-russia.yaml, KinzhalMissile -- the arithmetic is in the comment there). Tempo is
		# still the whole identity, and the short lead is still what protects it: a longer one hands the
		# defender exactly the reaction ticks the interception arithmetic says he does not have.
		# SS5a's framing is
		# "one Iskander missile, except you did not have to drive a 6000-credit launcher into range" --
		# so this gets the smallest lead that still stops the strike landing on the click.
		#
		# WHAT THE VICTIM GETS FOR THOSE 9 SECONDS: the IncomingSpeechNotification below, and nothing
		# else. SupportPower.PlayLaunchSounds fires it to every non-allied client AT ORDER TIME
		# (SupportPower.cs:238-251), before the missile exists, while the beacon and the minimap ping
		# are both gated on IsAlliedWith(RenderPlayer) (Beacon.cs:124, SupportPower.cs:228). So the
		# delay is an audible warning with no location attached -- deliberate, and the reason a longer
		# lead is not free: it is reaction time handed to the target.
		MissileDelay: 150
		# 8c0 = 8192 wdist = 8 cells above the terrain at the entry cell. This -- not LaunchAngle --
		# is what makes the approach look steep, and unlike LaunchAngle it does not scale with the
		# length of the shot. BallisticMissileFly interpolates baseZ from spawn Z to target Z
		# (BallisticMissileFly.cs:238-240), so the missile descends those 8 cells across the run.
		SpawnAltitude: 8c0
		CameraRange: 8c0
		# 25 ticks x 0.06 = 1.5 s of vision before impact, held for 100 x 0.06 = 6.0 s after it.
		CameraSpawnAdvance: 25
		CameraRemoveDelay: 100
		BeaconRemoveAdvance: 5
		DisplayBeacon: True
		DisplayMiniMapPing: True
		# None, DOWN FROM Ally, and the user asked for exactly this: "We dont need to see a countdown of
		# ally players powers, it is just distracting. Maybe we can keep it for nukes, but not for other
		# powers." SupportPowerTimerWidget drops a power from the top-of-screen list entirely when this
		# is None (SupportPowerTimerWidget.cs:42), before the per-viewer relationship test.
		#
		# IT ALSO HIDES THE OWNER'S OWN LINE, and that is fine rather than a compromise: PlayerRelationship
		# has no `Self` (TraitsInterfaces.cs:63-69) and Player.RelationshipWith(self) returns Ally
		# (Player.cs:250-251), so `Ally` is precisely "me and my allies" and there is no narrower value to
		# reach for. Nothing is lost by it -- SupportPowersWidget draws FormatTime(RemainingTicks) onto
		# the cameo itself (SupportPowersWidget.cs:246) plus a sweeping clock overlay (:216-221), so the
		# owner's own countdown is still on screen in mm:ss, in the place they look for it.
		DisplayTimerRelationships: None
		BeaconPoster: precbcon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SelectTargetSpeechNotification: SelectTarget
		# Placeholder: there is no conventional-strike warning line in notifications.yaml, and
		# AbombLaunchDetected would announce a nuke. Phase 2 audio should replace this.
		IncomingSpeechNotification: EnemyUnitsApproaching
		SupportPowerPaletteOrder: 1
	# ---- RS-26 Oreshnik: 6 conventional re-entry vehicles ------------------------------------
	# THE USER'S ASK, in their words: "an Oreshnik strike that the russian army has ... the oreshnik
	# uses multiple warheads that come in steep from a high trajectory, and will be the fastest
	# moving thing in the entire game. The warheads are independantly targetable (like the mirv
	# strike) but it should be a conventional weapon with high point damage and fairly low spread
	# per projectile."
	#
	# CONVENTIONAL, AND EVERY MARKER OF THAT IS DELIBERATE. There is no `CameoBadge: nuclear`, no
	# `RequiresCondition: !nuke-arsenal-disabled`, no vaporize warhead on the payload and no fireball
	# light event -- this power is not in the nuclear arsenal and is not gated by the nuclear lobby
	# checkbox. Its payload (OreshnikRVExplosion, weapons-explosions.yaml) is the OPPOSITE profile to
	# the arsenal's: 48000 of point damage into a 512-wdist core and about two cells of blast, where
	# the nukes are tens of cells wide and comparatively soft.
	#
	# RUSSIAN ONLY, via `powers.russia` -- the faction-provided prerequisite, exactly as the other
	# fifteen powers do it. NOT `player.russia`: that name is provided by faction ALONE and is
	# consumed by the AI layer, and using it here would make the power unreachable under the sandbox
	# lobby option. See "THE THREE TIERS" further down this file.
	#
	# IT IS RUSSIA'S SIXTH BUY-TIER ENTRY, and that is a change to a documented shape. rules/powers.yaml
	# describes the buy tier as "ten entries, five per faction"; it is now eleven and six. The header
	# there has been updated rather than left to drift, and the two consequences are handled:
	# HotkeyCount in chrome/ingame-player.yaml goes 15 -> 16 and hotkeys.yaml gains SupportPower16, so
	# TheSupportBinBindsAHotkeyForEveryPowerAPlayerCanHold still passes with the sandbox option on.
	#
	# THE PRICE IS THE ONE NUMBER HERE THAT IS A JUDGEMENT RATHER THAN A DERIVATION, and it does not
	# come off the ladder rule. powers.yaml states the buy tier is monotone in BLAST RADIUS, because
	# radius is a good proxy for what a strike destroys. That proxy does not describe this weapon: two
	# cells of blast is SMALLER than the 5000-credit Kinzhal's four, while six independent 48000-damage
	# impacts destroy considerably more. The measure that does describe it is delivered point damage,
	# 288000 against the Kinzhal's 54000, and 18000 is priced off that -- above the whole conventional
	# rung, below the 32000 Kalibr. IT HAS NOT BEEN COMBAT-SIMMED (DOCS/recipes/BALANCE.md); treat it
	# as the starting number, not a measured one.
	MissileStrikePower@Oreshnik:
		OrderName: OreshnikStrike
		Prerequisites: powers.russia
		# INTERIM ART. `artyicon` (artystrikicon) is the one cameo defined in sequences-misc.yaml that
		# no power currently claims, so this costs no new drawing and creates no duplicate: the
		# Kinzhal has kinzhalicon, the GBU-57 precicon, the arsenal v2bdgricon/abomb/abombfake/paranuke.
		# Replace it when there is Oreshnik art; nothing else depends on the name.
		Icon: artyicon
		Name: RS-26 Oreshnik (6 x conventional)
		Description: Six independently-aimed conventional re-entry vehicles.\nClick SIX aim points; one warhead goes to each.\nThe fastest weapon in the game, arriving near-vertically.\nRight-click or Escape while placing cancels without firing.
		# BOUGHT, NOT CHARGED, like every other power since 2026-09-06. ChargeInterval is ABSENT
		# rather than set to a large number: SupportPowerInstance forces TotalTicks to 0 when
		# RequiresPurchase is set, so any value here would be inert, and an inert number that reads
		# like a live one is worse than none. The price lives on power.oreshnik in rules/powers.yaml.
		RequiresPurchase: True
		Cursor: nuke
		MissileActor: oreshnikrv
		# SIX independently-aimed warheads -- "like the mirv strike", which is MissileStrikePower@Sarmat
		# in nuclear-arsenal.yaml and is the mechanism reused here rather than reimplemented. Above one
		# aim point the power enters SelectMultiPowerTarget placement mode, takes six clicks, issues the
		# order on the LAST one, and spawns one missile per point. Right-click or Escape abandons
		# without firing or consuming the shot.
		#
		# THE PAYLOAD IS PER-MISSILE AND THIS IS NOT OPTIONAL: OreshnikRV carries ONE warhead
		# (Explodes: OreshnikRVExplosion). Pointing this at a cluster-firing actor instead would be
		# thirty-six detonations, which is the trap AimPoints' own [Desc] documents.
		AimPoints: 6
		# 2 ticks between RVs = 10 ticks (0.6 s) across the salvo, against the Sarmat's 12/60. TIGHTER
		# ON PURPOSE: six 750 kt RVs are meant to land as a ripple, six conventional penetrators as a
		# single event. The tracks are parallel (one azimuth per salvo, taken from the centroid), so
		# this stagger separates them ALONG the approach and cannot make them fan out. Deterministic
		# (index * 2), which is what lets it sit on the synced activation path.
		#
		# WAS 4, AND IT HAD TO COME DOWN WITH ApproachDistance. THE STAGGER MUST NOT EXCEED THE VISIBLE
		# FLIGHT. Each RV is now drawn for the 5 ticks of its descent instead of the 67 ticks of a
		# full-standoff crossing, so a 4-tick stagger left at most two warheads in the air at once and
		# turned the salvo into a sequence of separate impacts -- the opposite of the "single event"
		# this weapon is meant to read as. At 2 ticks against a 5-tick descent, three are falling at
		# any moment. The impact FOOTPRINT is unchanged; only how tightly the six arrivals bunch is.
		AimPointInterval: 2
		# OVERLAY ONLY -- drawn by the placement order generator, read by nothing in the simulation.
		# 2c512 is the "a second RV here is wasted" radius: the shockwave reaches 2c0 and the lethal
		# core is 512, so two aim points closer than this overlap for no gain. Deliberately NOT the
		# weapon's outer extent -- it is the number that answers the placement question.
		AimPointRadius: 2c512
		# ---- MAXIMUM SPREAD: the salvo is a cluster, not six separate weapons ----------------
		# THE USER'S RULING, verbatim: "I think the salvo should have a max spread, so they must all be
		# placed within a certain radius, maybe 10 cells."
		#
		# WHY IT WAS ASKED FOR. Six independently-aimed warheads with no geometric bound are six
		# unrelated strikes sharing one cooldown. This weapon's warhead is on the roster permitted to
		# permanently destroy neutral tech buildings, so one 18000-credit activation could have removed
		# six economy structures anywhere on the map -- six times the reach of anything else on that
		# roster, and the only multi-aim-point entry on it. Bounding the GEOMETRY rather than the target
		# list keeps the weapon on the roster and is also the physically right answer: one missile bus
		# dispensing re-entry vehicles cannot scatter them across a continent.
		#
		# 10c0 IS A RADIUS FROM THE FIRST AIM POINT, so the worst-case footprint is 20 cells across --
		# the literal reading of "all placed within a certain radius, maybe 10 cells". Checked against
		# the weapon rather than taken on faith:
		#   USABLE. AimPointRadius above is 2c512, the radius inside which a second RV buys nothing.
		#   Six points on a hexagon inscribed in this circle sit 10 cells apart -- four times that
		#   figure -- so the bound never forces a player to waste a warhead. Even 5c0 would fit; 10c0
		#   leaves real tactical choice.
		#   READS AS ONE EVENT. CameraRange is 8c0 per RV, so six reveals inside a 20-cell disc overlap
		#   heavily, and AimPointInterval 4 lands the whole salvo inside 1.4 s. Twenty cells arriving in
		#   under two seconds is a cluster; it is not six things happening.
		#   SCALED TO THE MAPS. Shipped maps run 66x34 to 130x130 (mods/ww3mod/maps). A 20-cell
		#   footprint is a fifth of the widest and cannot span any of them.
		#   DISTINCT FROM THE SARMAT, which is deliberately left UNBOUNDED (no MaxAimPointSpread in
		#   nuclear-arsenal.yaml, so the field defaults to zero and nothing about it changes). Its
		#   AimPointRadius alone is 30c0: a strategic MIRV is meant to span a map, a conventional
		#   penetrator salvo is not. The two weapons now differ in reach as well as in yield.
		#
		# ANCHORED ON THE FIRST CLICK -- see MaxAimPointSpread's own [Desc] for why that beats a running
		# centroid or a bounding circle. Briefly: it is the only anchor that can be drawn before the next
		# click, and the only one that never revokes a cell the player was already allowed to use.
		MaxAimPointSpread: 10c0
		# THE REFUSAL, and it is deliberately not silent. A click outside the footprint would otherwise
		# do nothing and say nothing, which players read as a broken game rather than as a rule. Same
		# pair PlaceBuilding uses at :121-123 of this file, and the same sound: nodeply1 already means
		# "you cannot put it there" in this mod, so this costs no new asset and teaches nothing new.
		# The blocked cursor and the drawn footprint circle come first; this is the layer for a player
		# who clicked anyway.
		AimPointRejectedSpeechNotification: BuildingCannotPlaceAudio
		AimPointRejectedTextNotification: Aim point too far from the first: the salvo must land within 10 cells.
		# Only read for a SINGLE-target order -- a bot, a Lua binding, or an old replay, none of which
		# knows about placement mode. First RV on the chosen point, five more on a ring of this radius.
		# 5c0 rather than the Sarmat's 24c0 because this is a precision weapon: a bot firing it should
		# concentrate on one formation, not blanket a quarter of the map. THE DEMO SCENARIO DEPENDS ON
		# THIS VALUE -- Test.ActivateSupportPower issues a single-target order, so 5c0 is the pattern a
		# viewer sees there.
		AimPointFallbackSpread: 5c0
		# GROUND BURST. Zero, so there is no interaction with any warhead's AirThreshold at all -- the
		# silent-failure mode MissileStrikePowerInfo.DetonationAltitude documents (a burst above a
		# warhead's AirThreshold stops seeing terrain target types and does nothing to the ground) is
		# simply not reachable here. A conventional penetrator is meant to hit the thing it is aimed at.
		DetonationAltitude: 0
		# 24c0 = 24 cells above the terrain at the spawn. UNCHANGED IN VALUE, but no longer measured at
		# an off-map birth point: with ApproachDistance below it is 24 cells of altitude over 16 cells
		# of ground, and that ratio IS the descent now. See ApproachDistance for why the pair is chosen
		# to reproduce the old terminal slope exactly rather than to be steeper.
		SpawnAltitude: 24c0
		# ---- THE VISIBLE FLIGHT IS THE REENTRY AND NOTHING ELSE --------------------------------
		# THE USER, having watched it: "just like the other weapons we dont need to see the launch, we
		# only see the incoming warheads as they are already in their decent phase."
		#
		# WHAT THEY SAW AND WHY. Without this the warhead is born at the full standoff -- the map
		# diagonal plus ApproachMargin, 197 cells on a 128x128 map -- and flies all of it. Screen
		# position is (X, Y - Z), so altitude drags the sprite DOWN the frame as it descends while the
		# ground track carries it across: the result is a long shallow diagonal over open ground, with
		# early warheads landing while later ones are still crossing. It reads as missiles flying in,
		# not as warheads falling out of the sky. LaunchAngle 160 made it worse rather than better --
		# the arc apex is hDist * tan / 4, so over 197 cells it peaked about 75 cells up.
		#
		# 16c0 puts the birth point 16 cells from the aim point at 24c0 of altitude: a slope of 1.5,
		# which is 56.3 degrees. THAT NUMBER IS NOT A NEW CHOICE -- it is the slope the RV already had
		# at impact (LaunchAngle 160 is 56.25 degrees), so the terminal profile the user said "reads
		# well" is reproduced rather than replaced. The 3D step per tick stays 3600 x 1.803 = 6490
		# against the 6491 that OreshnikRV's own SubTickMotionSmoothing and WithHypersonicPlasma
		# ceilings were sized for, so the plasma budget is untouched and OreshnikPlasmaBudgetTest still
		# describes the shipped case. What changes is that the slope is now constant for the WHOLE
		# drawn flight instead of only at the end.
		#
		# BALANCE IS UNTOUCHED. MissileStrikePower adds the ticks the shorter flight no longer spends
		# in the air back onto MissileDelay, so order-to-impact is identical on every map. This buys
		# the viewer nothing and costs the target nothing; it only moves where the warhead is drawn.
		#
		# THE APPROACH BEARING IS UNCHANGED. Only the distance shrinks -- the direction still comes
		# from MissileStrikeApproach, so a strike still arrives over the firing player's own back line
		# wherever it is aimed, which is the invariant the 2026-09-08 sweep pins.
		ApproachDistance: 16c0
		# 120 ticks x 0.06 s = 7.2 s between the click and the RVs appearing off-map. SHORTER than the
		# Kinzhal's 150, and the reason is the same one that sets the Kinzhal's: the delay is reaction
		# time handed to the target. SupportPower.PlayLaunchSounds fires IncomingSpeechNotification to
