SUPPLYCACHE:
	Inherits: ^SpriteActor
	Selectable:
		Bounds: 1024, 1024
		# A dropped crate must not be handed back by a drag-select over a battle. Without this it
		# takes SelectableInfo's default of 10 (Selectable.cs:19) — the SAME tier as
		# ^SelectableCombatUnit — so a box drawn over infantry standing near a crate groups the crate
		# with them.
		#
		# What this buys, precisely: box-select keeps only the single HIGHEST-priority group
		# (SelectableExts.SubsetWithHighestSelectionPriority), so the crate is excluded outright from
		# any box that also contains anything above tier 2, and is returned only when the box holds
		# nothing else. The "Select all units" hotkey runs the same filter, so it skips crates too.
		# Deliberate single-clicking is UNAFFECTED — that path ranks actors under the cursor by
		# (priority - pixelDistance), and a crate is normally the only actor on its own pixel.
		# Double-click select-same-type is also unaffected: it filters by Selectable.Class, not
		# priority, so it never swept crates in alongside soldiers to begin with.
		#
		# 2 is ^SelectableBuilding's tier (defaults.yaml:831-834), which is what a dropped, stationary
		# container is. Written as the value rather than inherited because ^SelectableBuilding pulls in
		# ^Selectable's WithSpriteControlGroupDecoration and DrawLineToTarget, and a crate has neither
		# a control group nor a target line; this block is already hand-rolled for the same reason.
		Priority: 2
	SelectionDecorations:
	Tooltip:
		Name: Supply Cache
	Building:
		Dimensions: 1,1
		Footprint: x
		TerrainTypes: Clear,Road,Beach,Rough
	FrozenUnderFog:
	Health:
		HP: 5000
	Armor:
		Type: Light
	Targetable:
		# A dropped crate is LOOT, not a threat: it must never be auto-acquired, but the player must
		# still be able to force-fire one to deny it. `NoAutoTarget` is exactly that primitive — it is
		# read in ONE place engine-wide, AutoTargetPriorityInfo.InvalidTargets (AutoTargetPriority.cs:27),
		# so it suppresses band resolution while leaving weapon validity untouched.
		#
		# PITFALL: `Ground` is what force-fire binds through (WeaponInfo.IsValidTarget). It MUST stay —
		# dropping it, or the whole Targetable, makes the crate untargetable and breaks the player's
		# manual attack order along with the auto one. Pinned both ways by CrateAutoTargetExclusionTest.
		#
		# This reverses 092db848, which removed NoAutoTarget to give the crate "truck parity" (enemies
		# auto-engage a dropped crate like the truck it came from). Reported from live play 2026-08-20 as
		# the bug: shooting a crate destroys resources both sides would rather capture.
		TargetTypes: Ground, Structure, NoAutoTarget
	ProximityCapturable:
		# "Getting close to one should capture it for ourselves instantly." No order, no activity —
		# any ground unit that walks within this radius takes the crate, contents intact.
		#
		# 2c512 is not a feel-good number: it is what the Logistics Center already absorbs a cache at
		# (AbsorbsSupplyCache, structures.yaml:418). Both answer "how close must you be for a crate to
		# come to you", so they should not disagree. The previous 1c512 required a unit to stop
		# essentially ON the box, which is the "I walked up to it and nothing happened" report.
		#
		# CEILING, pinned by CrateProximityCaptureTest: this must never exceed SupplyProvider.Range
		# below (4c0). Capturing from beyond the aura in which the crate would already be serving you
		# would let a unit take a box it has no other relationship with.
		#
		# Own-side crates are unaffected: ActorEntered classifies by relationship to the ORIGINAL owner
		# (ProximityCapturable.cs:111), so a friendly unit — including the truck that just dropped it —
		# is never a captor. That is why widening this cannot re-swallow a deliberate forward dump the
		# way a proximity ABSORBER on the truck would (economy.md, SUPPLYCACHE).
		Range: 2c512
		Sticky: true
		# Ground contact only. `Plane` is deliberately absent: the proximity trigger is registered with
		# vRange 0 and ProximityTrigger treats that as NO altitude filter (ActorMap.cs:144), so adding it
		# would let any aircraft capture crates by flying over them at cruise height. `Tank` is vestigial
		# — no unit in this mod declares it — but is left in place as it costs nothing.
		CaptorTypes: Player, Vehicle, Tank, Infantry
	HitShape:
		Type: Circle
			Radius: 512
	RenderSprites:
	WithSpriteBody@Full:
		Name: full
		Sequence: idle-full
		RequiresCondition: supply-high
	WithSpriteBody@Mid:
		Name: mid
		Sequence: idle-mid
		RequiresCondition: supply-medium
	WithSpriteBody@Low:
		Name: low
		Sequence: idle-low
		RequiresCondition: !supply-high && !supply-medium
	SupplyProvider:
		# PARITY WITH THE TRUCK, and deliberately not a softer version of it. "It should rearm just the
		# same as the supply truck does, same radius/speed etc." (live play, 2026-08-21). A crate is the
		# truck's own load set on the ground — the same 750 supply serving the same infantry through the
		# same replenish-soldiers push — so a player who drops one has not chosen a weaker resupply, only
		# a stationary one. These two numbers made it a quarter the rate and a cell shorter in reach for
		# no stated reason. Both are pinned against TRUK by SupplyCacheTruckParityTest.
		Range: 5c0
		RearmDelay: 6
		TotalSupply: 750
		RearmCondition: replenish-soldiers
		SupplyCreditValue: 750
		# Remove only once genuinely drained (supply 0). A crate has no trip home to
		# reserve supply for (unlike TRUK's RestockThreshold), so it serves down to the
		# last usable batch. A higher threshold would silently vanish a freshly-dropped
		# crate carrying less than that value — the "inert crate" report.
		RemoveBelowSupply: 1
		# THE OTHER HALF OF THAT SENTENCE, missing until 2026-08-21 — which made the claim above FALSE.
		# RemoveBelowSupply governs when a crate DESPAWNS; RestockThreshold governs when it stops
		# SERVING, and it defaults to 50 (SupplyProvider.cs), which was never overridden here. So a crate
		# holding 1..49 supply served nobody, and — sitting above the removal floor of 1 — never
		# despawned either. It parked permanently with a visible supply bar and an intact sprite, doing
		# nothing: the "doesn't rearm even though it has supplies left" report. A truck reserves that
		# remainder to afford the drive to a Logistics Center; a crate has nowhere to drive, so it
		# reserves nothing. The two fields are a matched pair — a non-zero reservation above a lower
		# removal floor strands the crate in the gap between them. See
		# SupplyProvider.ReservesRemainderForRestock.
		RestockThreshold: 0
		SupplyHighCondition: supply-high
		SupplyMediumCondition: supply-medium
		SupplyLowCondition: supply-low
		# Independent of the three sprite-state conditions above, which keep their coarse
		# thirds. This is the finer count the Explodes@Band traits compare against.
		SupplyLevelCondition: supply-level
		SupplyLevelSteps: 8
	Explodes@Band1:
		RequiresCondition: supply-level == 1
		Weapon: VolatileLoad1
	Explodes@Band2:
		RequiresCondition: supply-level == 2
		Weapon: VolatileLoad2
	Explodes@Band3:
		RequiresCondition: supply-level == 3
		Weapon: VolatileLoad3
	Explodes@Band4:
		RequiresCondition: supply-level == 4
		Weapon: VolatileLoad4
	Explodes@Band5:
		RequiresCondition: supply-level == 5
		Weapon: VolatileLoad5
	Explodes@Band6:
		RequiresCondition: supply-level == 6
		Weapon: VolatileLoad6
	Explodes@Band7:
		RequiresCondition: supply-level == 7
		Weapon: VolatileLoad7
	Explodes@Band8:
		RequiresCondition: supply-level == 8
		Weapon: VolatileLoad8
	RenderRangeCircle@Supply:
		# Must track SupplyProvider.Range above — this circle is the ONLY thing telling the player how far
		# a crate reaches, so a stale value here is a lie drawn on the map. Pinned by SupplyCacheTruckParityTest.
		FallbackRange: 5c0
		RangeCircleType: supply
		Color: C0C0C0
		Width: 1.5
		RequireShift: false
