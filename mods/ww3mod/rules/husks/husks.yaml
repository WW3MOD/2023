
^BasicHusk:
	Interactable:
	Health:
		HP: 28000
	Armor:
		Type: Heavy
	Detectable:
		Vision: 1
		Position: Center
		# A dying unit is usually its own vision source, so its husk spawns into fog on the same
		# tick and never renders for even one frame -- the unit just vanishes. Ally covers self
		# (Player.RelationshipWith returns Ally for this == other), so owners keep watching their
		# own wrecks; enemies still have to detect them. This grants no sight: Detectable.Vision is
		# the concealment level an observer must beat, not a reveal radius, and no husk template
		# carries RevealsShroud.
		AlwaysVisibleRelationships: Ally
	ScriptTriggers:
	WithFacingSpriteBody:
	HitShape:
	MapEditorData:
		Categories: Husk

^CivBuildingHusk:
	Inherits@1: ^SpriteActor
	Interactable:
	AppearsOnMiniMap:
	Building:
		Dimensions: 1,1
		Footprint: x
	WithSpriteBody:
	Tooltip:
		GenericName: Civilian Building (Destroyed)
		GenericStancePrefix: false
		ShowOwnerRow: false
	Targetable:
		TargetTypes: NoAutoTarget, Ground
		RequiresForceFire: true
	# Deliberately left with the stock AlwaysVisibleRelationships (Ally), which for a
	# Neutral-owned husk matches nobody and so contributes nothing. That is correct here,
	# and the reason is NOT the one 99d75ee8 recorded ("carries FrozenUnderFog and is
	# already visible to everyone"): that held only because IsVisible was short-circuited
	# to an unconditional `return true`, which has since been removed.
	#
	# The Ally override 99d75ee8 added to ^BuildingHusk does not transfer. That husk uses
	# Detectable and is owned by the player whose building died, so Ally is what lets an
	# owner watch their own rubble burn. A civilian husk has no such owner to serve: these
	# are map-placed scenery, typically Neutral (neither template hard-codes an owner, so
	# treat that as the usual case rather than a guarantee). The argument does not rest on
	# it -- for ANY non-ally owner, an Ally relationship reveals the rubble to nobody, least
	# of all to whoever destroyed the building.
	#
	# Plain FrozenUnderFog is the right answer instead, because it gives the rubble
	# exactly the visibility rules the civilian building it replaced already had: seen
	# where you have scouted, remembered under fog. Civilian husks are permanent (no
	# Health, no burn-out, unlike ^BuildingHusk's 200 HP), so a discontinuity here would
	# be permanent too. Forcing it unconditionally visible would instead leak a standing
	# signal that someone is fighting over ground you have never scouted.
	FrozenUnderFog:
	ScriptTriggers:
	MapEditorData:
		Categories: Husk
	OwnerLostAction:
		Action: ChangeOwner
^BuildingHusk:
	Inherits@1: ^SpriteActor
	Interactable:
	AppearsOnMiniMap:
	Building:
		Dimensions: 1,1
		Footprint: x
	WithSpriteBody:
	Health:
		HP: 200
	Armor:
		Type: Wood
	WithIdleOverlay@Burns:
		Image: fire
		Sequence: 1
		IsDecoration: true
	ChangesHealth@Burns:
		Step: -10
		Delay: 8
	HitShape:
	OwnerLostAction:
		Action: ChangeOwner
	Targetable:
		TargetTypes: NoAutoTarget, Ground
		RequiresForceFire: true
	Tooltip:
		GenericName: Destroyed Building
	Detectable:
		Vision: 1
		Position: Center
		# Same reasoning as ^BasicHusk above. This was written while a LIVING building was visible to
		# every player unconditionally — ^BasicBuilding carries FrozenUnderFog
		# (ingame/structures.yaml:60) and its IsVisible short-circuited to `return true`. THAT IS NO
		# LONGER TRUE: the short-circuit was a six-month regression and has been removed, so a living
		# building is now visible only where its owner's enemy has scouted. The conclusion below
		# survives anyway and on better grounds — the owner's OWN building was always visible to the
		# owner (AlwaysVisibleRelationships: Ally on FrozenUnderFog), so the discontinuity this fixes
		# is real regardless of what enemies could see. The husk is not
		# permanent rubble either -- ChangesHealth@Burns takes it from 200 HP at -10/8 ticks, so it
		# burns out in ~160 ticks (~10 s). Owners were being denied the death animation of their own
		# base. Enemies still have to detect it.
		AlwaysVisibleRelationships: Ally
	ScriptTriggers:
	Explodes:
		Weapon: BuildingExplode
	MapEditorData:
		Categories: Husk
^DefenseHusk:
	Inherits@1: ^BuildingHusk
	Health:
		HP: 200
	Explodes:
		Weapon: SmallBuildingExplode
^TechBuildingHusk:
	Inherits: ^CivBuildingHusk
	Tooltip:
		GenericName: Tech Building (Destroyed)
	Targetable:
		TargetTypes: NoAutoTarget, Ground, TechHusk
	InfiltrateForTransform:
		Types: TechHusk
		ForceHealthPercentage: 10

^TreeHusk:
	Inherits@1: ^SpriteActor
	BlocksProjectiles:
		MaxBypass: 5
		BypassChance: 85
		Height: 256
	Interactable:
	RenderSprites:
		Palette: terrain
	# AppearsOnMiniMap:
	# MiniMapColorFromTerrain:
	# 	Terrain: Tree
	# AppearsOnMapPreview:
	# 	Terrain: Tree
	Building:
		Footprint: x
		Dimensions: 1,1
	WithSpriteBody:
	Tooltip:
		Name: Tree (Burnt)
		ShowOwnerRow: false
	AlwaysVisible:
	ScriptTriggers:
	MapEditorData:
		Categories: Tree
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral
	ProximityExternalCondition@ObjectProximity:
		Condition: object-proximity
		Range: 384
		ValidRelationships: Neutral, Ally, Enemy
