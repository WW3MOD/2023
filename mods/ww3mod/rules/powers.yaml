# PURCHASE ORDERS for the support powers.
#
# Each actor below is a BODILESS PROXY: it is never created, never enters the world and has no
# body, health or exit. SupportPowerProductionQueue intercepts completion before
# Production.Produce is ever reached (SupportPowerProductionQueue.cs, BuildUnit) and banks a shot
# on the SupportPower named by ProvidesSupportPowerCharge.Power instead. The actor exists purely so
# the ordinary production machinery -- sidebar cameo, cost drain, build clock, hold, cancel with
# partial refund, hotkey -- can be reused without a second implementation of any of it.
#
# ADDING A POWER: set `RequiresPurchase: True` on the SupportPower, then add a proxy here naming
# its OrderName and inheriting the template below. NOTHING IN THE ENGINE LINTS THAT LINK, so
# engine/OpenRA.Test/PowerPurchaseWiringTest.cs does: it fails if a proxy names a power that does
# not exist, if a purchasable power has no proxy (which makes it unreachable forever, since setting
# RequiresPurchase removes the timer), or if a proxy is missing a trait the palette dereferences.
#
# ---- THE THREE TIERS ----
# Income is PassiveIncome 100 per 50 ticks at Timestep 60 = 2000/min before building income
# (DOCS/reference/economy.md), against DefaultCash 20000. So a 5000 power is two and a half minutes
# of a whole allocation, which is the "hard to get to pay off" the user asked for: it has to kill
# two top-end vehicles (T-90 2400, Abrams 2500) just to break even, and catch a group of four or
# more to be a good trade.
#
# BUY -- ten entries, five per faction, and NO PLAYER EVER SEES MORE THAN FIVE. The gate is
# `Prerequisites: powers.america` / `powers.russia` on each power in rules/player.yaml;
# SupportPowerProductionQueue filters AllItems() as well as BuildableItems() on it, so the other
# faction's five are ABSENT from the tab rather than greyed out.
#
#   cost     AMERICA  (powers.america)               RUSSIA  (powers.russia)
#   ------   -----------------------------------    ------------------------------------
#    5000    GBU-57 Bunker Buster   conventional    Kh-47M2 Kinzhal       conventional
#    6000    B61-12 (0.3 kt)         4.5c blast    9M729 (1 kt)
#   10000    B61-12 (10 kt)         14.4c blast    9M723 Iskander-M (10 kt)
#   15000    B61-12 (50 kt)         24.5c blast    Kh-47M2 Kinzhal-N (50 kt)
#   32000    W76-1 Trident (100 kt) 31.0c blast    3M14 Kalibr (100 kt)
#
# EVENT -- five entries, NOT purchasable in a normal match at any price. `powers.event` is provided
# by no faction, only by the sandbox option below. These are the Doomsday weapons and the two
# unnamed generics; they are still fired by Dead Hand, by scripted triggers and by demos, none of
# which goes through this tab. Their prices below are what SANDBOX charges, and are kept rather
# than deleted so the tier stays orderable and so a future decision to sell one has a number to
# start from.
#
#   15000    Tactical Nuclear Strike (20 kt) 15.0c   fired by doomsday.yaml as the weapon `Atomic`
#   30000    RS-28 Sarmat MIRV           6 x 60.8c
#   32000    B83-1 (1.2 Mt)                 70.9c
#   40000    Strategic Nuclear Strike (6 Mt) 102.0c   reaches every cell of every shipped map
#   60000    Tsar Bomba (50 Mt)            246.1c   kept "just for fun"; may never be fired
#
# SANDBOX -- one lobby checkbox ("Sandbox: All Support Powers", default OFF) that provides all
# three prerequisites to every player regardless of faction, so all fifteen entries are purchasable
# at once. This is the user's test mode. It is permanent, it is not a debug leftover, and it is the
# reason the EVENT entries keep their proxies below instead of being deleted: a power with no proxy
# cannot be bought even in sandbox. Wiring and the polarity trap: rules/player.yaml, "THE THREE
# TIERS".
#
# ---- THE LADDER IS MONOTONE IN BLAST RADIUS ----
# Not in the ChargeIntervals these powers used to carry, and where the two disagree this file
# follows the blast. The reason is the user's own bar: "hard to get to pay off unless enemy is
# grouped but still very possible to make a good trade" is a statement about what a strike
# DESTROYS, so the price has to track that and not how rare the weapon used to be.
#
# AMERICA, verified against the weapons this branch can read (BlastWave MaxRadius in
# weapons-nuclear-arsenal.yaml, plus MOPPenetration's 512 Spread for the penetrator, which has no
# blast wave at all):
#
#     5000 -> 0.5c    6000 -> 4.5c    10000 -> 14.4c    15000 -> 24.5c    32000 -> 31.0c
#
# Strictly increasing in both columns. RUSSIA is monotone by construction -- conventional, then
# 1 / 10 / 50 / 100 kt -- but its four warheads are authored on a concurrent branch and their radii
# could NOT be measured here; the Kinzhal's own IskanderExplosion is MaxRadius 4c0, so the 5000
# rung is 4.0c and the 6000 rung must exceed it. VERIFY THAT WHEN THE TWO BRANCHES MEET.
#
# THE TWO NON-MONOTONICITIES THAT USED TO BE HERE ARE BOTH GONE, and neither was fixed by
# repricing on a hunch:
#   * The tactical nuke sat at 15000 for a 15.0c blast while B61-12 (50 kt) sat at 13000 for 24.5c
#     -- more money for a smaller weapon. Resolved by MOVING the tactical nuke out of the buy tier
#     entirely, which is what the user asked for on other grounds; the two are no longer on the
#     same ladder at all.
#   * W76-1 sat at 16000, only 1000 above the tactical nuke, on an argument ("almost the same
#     weapon by radius") that a 2026-09-07 audit had already shown to be false. It is now 32000 and
#     the argument is retired rather than patched.
# B61-12 (50 kt) moved 13000 -> 15000 to take the rung the tactical nuke vacated, which keeps the
# five prices evenly spread rather than leaving a hole at the top of the ladder.

# ---- HOW A NUCLEAR POWER IS NAMED ----
# Every nuclear entry's `Tooltip: Name:` is
#
#     <real-world designation> (<yield>)
#
# and the yield is ALWAYS the last thing in the Name, in parentheses, on every one of them. It is
# not optional and it does not live in the Description instead: the buy tab sorts ten warheads
# spanning five orders of magnitude, and the yield is the only field that tells a player which of
# them they are looking at. `kt` below 1000, `Mt` at and above. A MIRV states the product it
# actually delivers -- `(6 x 750 kt)`, count first -- because one number cannot describe six
# separate detonations. Anything that is not a yield (a payload descriptor like MIRV) goes in the
# DESIGNATION, outside the parentheses; the bracket is the yield slot and holds nothing else.
#
# The Description may elaborate on the yield but is never the only place it appears. The same
# strings are duplicated on the SupportPower itself (rules/ingame/nuclear-arsenal.yaml for the six
# arsenal entries, rules/player.yaml for the two generic ones) -- the buy tab reads the ones here
# and the support bin reads those, so a change to either must be made to both or the same weapon
# is called two different things in two panels of the same game.
#
# TWO ENTRIES CARRY NO REAL-WORLD DESIGNATION, AND NOW FOLLOW THE RULE ANYWAY. power.tacnuke and
# power.highyieldnuke are named for what they do rather than for a bomb that exists, so there is no
# designation to put outside the bracket -- but the bracket itself still applies. RESOLVED
# 2026-09-08: the user asked for the yields directly, which settles the open question this paragraph
# used to record (identities / retirement / a bare yield appended -- the third of the three).
#
#     Tactical Nuclear Strike (20 kt)     fires `Atomic`
#     Strategic Nuclear Strike (6 Mt)     fires `AtomicHighYield`
#
# BOTH YIELDS ARE VERIFIED AT FOUR INDEPENDENT SITES rather than taken from this comment:
# weapons-superweapons.yaml:32 and its AtomicHighYield banner, NuclearYieldTest.AllNukes,
# gen_fireball_light.YIELDS, and the radii the three of them agree on.
#
# THE STRING NOW LIVES IN SIX PLACES, not the two the rest of this header describes. The buy tab
# reads the Tooltip here, the support bin reads SupportPower Name in rules/player.yaml:479 and :597,
# and the LOBBY reads a third pair -- PowersLobbyOptions.TacticalNukeCheckboxLabel and
# HighYieldNukeCheckboxLabel, C# defaults with no YAML override anywhere in the mod. A rename that
# misses the lobby pair calls the same weapon two things in two panels exactly as described above,
# and nothing lints the link.
#
# ---- BUILD DURATIONS ----
# Ticks at Timestep 60 (0.06 s), NOT the 25 tps several in-tree comments still assert. The duration
# is the loading, and money drains across it: the strike is ready the instant the bar completes.
# Explicit rather than left at BuildDuration -1, which would derive cost/10 and couple the wait to
# the price -- a 60000 warhead would take six minutes purely as an arithmetic side effect.
#
# ---- ORDERED BY PRICE, not by SupportPowerPaletteOrder ----
# BuildPaletteOrder below runs cheapest-first, which is the useful order for a shop and is NOT the
# order the support bin uses (that is SupportPowerPaletteOrder, roughly chronological by when each
# power was added). The two lists therefore read differently on purpose.
#
# AMERICA TAKES 10/20/30/40/50 AND RUSSIA 11/21/31/41/51, so each price rung is a PAIR of
# adjacent numbers. In a normal match only one of each pair is ever drawn and the tab reads
# 10,20,30,40,50 either way; in sandbox all fifteen are drawn and the two ladders interleave
# rung by rung, which is the only order in which they can be compared. The GBU-57 used to share
# the Kinzhal's slot exactly, on the grounds that "no player ever sees both" -- true before
# sandbox existed, false now, which is why the pairs are adjacent rather than identical.
# EVENT takes 60-100, after both.

# The three traits every proxy needs and none of which is about the power itself. THIS TEMPLATE
# EXISTS BECAUSE FORGETTING ONE OF THEM COST 2,555 LINT ERRORS ON 2026-09-06, and the failure is
# invisible to a build, to NUnit and to a read of the file:
#
#   AlwaysVisible   supplies IDefaultVisibilityInfo. Without any trait implementing it,
#                   CheckDefaultVisibility emits "Actor type `X` does not define a default
#                   visibility type" -- once per actor PER MAP, which is where the four-digit count
#                   comes from. Nothing about a proxy is ever drawn in the world; the lint does not
#                   care, it wants the declaration.
#
#   Interactable    supplies IMouseBoundsInfo, which `Tooltip` REQUIRES
#                   (TooltipInfoBase : ConditionalTraitInfo, Requires<IMouseBoundsInfo>,
#                   Tooltip.cs:16). A bodiless actor has no Selectable and no IsometricSelectable,
#                   so this is the only trait that can supply it, and without it
#                   ActorInfo.TraitsInConstructOrder() THROWS -- reported as "Actor `X` is not
#                   constructible". Its default Bounds are null, which CheckInteractable treats as
#                   valid, so it costs nothing.
#
#                   DELETING Tooltip IS NOT THE ALTERNATIVE FIX. CheckTooltips errors on any actor
#                   carrying BuildableInfo with no enabled Tooltip (CheckTooltips.cs:28-35), and a
#                   buy-menu item must be Buildable. The three traits are a closed chain:
#                       Buildable =(CheckTooltips)=> Tooltip =(Requires)=> IMouseBoundsInfo
#                                                                          <= Interactable
#
#   RenderSprites   ProductionPaletteWidget.RefreshIcons calls item.TraitInfo<RenderSpritesInfo>()
#                   unguarded (ProductionPaletteWidget.cs:713), so a buy-menu item without it
#                   crashes the moment the tab is opened. `Image: icon` points Buildable.Icon at the
#                   SAME `icon:` sequence collection SupportPowerInfo.Icon uses (its IconImage
#                   defaults to "icon"), so the buy-tab cameo and the support-bin cameo are the same
#                   sprite reference and adding a power needs no new sequence entry.
#
# All of this is pinned by PowerPurchaseWiringTest, which builds the real trait set by reflection
# and calls the very method whose exception the merge gate reports.
^PurchasableSupportPower:
	AlwaysVisible:
	Interactable:
	RenderSprites:
		Image: icon

# =============================================================================================
# BUY TIER -- AMERICA. `Prerequisites: powers.america` on each power (rules/player.yaml).
# BuildPaletteOrder 10/20/30/40/50.
# =============================================================================================

# ---- 5000: the conventional rung -------------------------------------------------------------
# The same price as Russia's Kinzhal on purpose. The two are faction-locked to opposite sides, so
# in a normal match no player holds both and the price is not a comparison anyone can make -- it is
# the symmetry between the two factions' one conventional strike, and breaking it would advantage a
# faction rather than differentiate a weapon. The two are separated on ROLE instead (tempo vs
# hardened targets), which is why their load times differ and their prices do not.
#
# THE SYMMETRY ARGUMENT IS WEAKER THAN IT WAS AND IS KEPT ANYWAY. Sandbox now shows both at once,
# so the comparison IS makeable by anyone who ticks the box. Kept because sandbox is a test mode
# and balance is a statement about matches; if the two ever need different numbers that is a
# combat-sim decision (DOCS/recipes/BALANCE.md), not a consequence of the checkbox.
power.gbu57:
	Inherits: ^PurchasableSupportPower
	Valued:
		Cost: 5000
	Tooltip:
		Name: GBU-57 Bunker Buster
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 10
		# precicon is a PHOTOGRAPH of the GBU-57 since 2026-09-09 (it was a cartoon with PRECISION
		# STR. baked into its pixels). The new art is untexted, which is why the caption below has to
		# be stated: nothing draws it otherwise. Wording kept identical to the lettering it replaces.
		# DO NOT swap to missicon however its name reads -- that is a building captioned TECH CENTER.
		Icon: precicon
		CameoCaption: PRECISION STR.
		# 900 ticks = 54 s, nearly double the Kinzhal's at the same price, and that gap IS the
		# differentiation the two powers get in exchange for costing the same. A Massive Ordnance
		# Penetrator is a scheduled demolition of a fixed hardened target, not a weapon of surprise;
		# it already carries the longest in-flight lead (MissileDelay 300 against 150) and the
		# slowest missile, so making it slow to load too keeps it from competing on tempo at all.
		BuildDuration: 900
		Description: Massive Ordnance Penetrator, held in off-map reserve until you call it.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: GBU57Strike

power.b61low:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 6000, barely above a conventional strike, and that closeness IS the entry. A 4.5-cell blast
		# covers about what a heavy artillery concentration does, so a 0.3 kt dial setting has to be
		# priced as a slightly better conventional strike rather than as a nuclear weapon -- otherwise
		# nobody ever discovers the mod has a nuke that does not end the game.
		Cost: 6000
	Tooltip:
		Name: B61-12 (0.3 kt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 20
		Icon: paranuke
		CameoCaption: 0.3 KT
		CameoBadge: nuclear
		# 500 ticks = 30 s, the same as the Kinzhal. It is a tactical weapon and it should feel like
		# one at the point of purchase as well as at the point of impact.
		BuildDuration: 500
		Description: Variable-yield tactical bomb at its LOWEST dial setting.\nSub-kiloton: destroys a position, not a battlefield.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: B61LowStrike

power.b61mid:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 10000. THE RUNG THAT DID NOT EXIST: `NukeB61Mod12Y10` shipped with the arsenal and was fired
		# by nothing, so the US ladder jumped 4.5c -> 24.5c with a single 7000-credit step across it.
		# At 14.4c this is almost exactly the geometric middle of that gap, and 10000 sits between its
		# neighbours the same way.
		Cost: 10000
	Tooltip:
		Name: B61-12 (10 kt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 30
		Icon: paranuke
		CameoCaption: 10 KT
		CameoBadge: nuclear
		# 750 ticks = 45 s, midway between the 0.3 kt setting's 500 and the 50 kt setting's 1000.
		BuildDuration: 750
		Description: Variable-yield tactical bomb at its MIDDLE dial setting.\nThirty-three times the 0.3 kt energy, three times the radius.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: B61MidStrike

power.b61max:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 15000, RAISED FROM 13000. It takes the rung the tactical nuclear strike vacated when that
		# moved to EVENT tier -- the tac nuke's 15000 bought a 15.0c blast where this buys 24.5c, so
		# the price was already the wrong way round between them and removing one of the two is what
		# fixed it. Against the 0.3 kt setting's 6000 this is 167 times the energy and 5.5 times the
		# radius for two and a half times the price: blast area grows far faster than price, which is
		# what makes the big entries worth saving for and the small ones worth buying often.
		Cost: 15000
	Tooltip:
		Name: B61-12 (50 kt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 40
		Icon: paranuke
		CameoCaption: 50 KT
		CameoBadge: nuclear
		# 1000 ticks = 60 s.
		BuildDuration: 1000
		Description: Variable-yield tactical bomb at its HIGHEST dial setting.\nSame weapon as the 0.3 kt option: 167x the energy, 5.5x the radius.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: B61MaxStrike

power.w76:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 32000, RAISED FROM 16000, and the old number was resting on a claim that had already been
		# disproved. It read "the tactical nuke's 15000 for 30 cells -- almost the same weapon by
		# radius", so 1000 credits bought ONLY the W76's tempo. `Atomic` is 15c0, not 30c (the
		# 2026-09-07 label audit), so the W76 has twice its radius and about eight times its area as
		# well: 1000 credits was buying the hole AND the tempo, which made this the cheapest thing on
		# the ladder rather than the most expensive.
		#
		# 32000 is the top of the US buy ladder and is deliberately just over twice the 50 kt setting
		# below it for 1.27x the radius -- the steepest step in the tier, because this is where a
		# player stops buying tools and starts buying an ending. It is also the fastest delivery in the
		# arsenal (Speed 1400) and so the hardest of the fifteen to disperse away from, which is the
		# part of the old argument that was true and survives.
		Cost: 32000
	Tooltip:
		Name: W76-1 Trident Warhead (100 kt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 50
		# FIXED 2026-09-09. cmissicon USED to be Red Alert's chemical-strike icon -- a biohazard trefoil
		# with CHEMICAL STRIKE baked into the pixels, telling the player that a submarine-launched
		# warhead was a chemical weapon. The art file now holds a night Trident II launch. The key name
		# is legacy and describes nothing; this power and @W76 are the only things that draw it.
		Icon: cmissicon
		CameoCaption: 100 KT
		CameoBadge: nuclear
		# 1300 ticks = 78 s. Only 18 s more than the 50 kt setting below it for more than double the
		# price, and that shortfall is deliberate: this entry sells SPEED, and a load time in
		# proportion to its cost would be charging a tempo weapon for the tempo it provides.
		BuildDuration: 1300
		Description: Submarine-launched re-entry vehicle, held in off-map reserve until you call it.\nThe fastest delivery in the arsenal and the hardest to see coming.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: W76Strike

# =============================================================================================
# BUY TIER -- RUSSIA. `Prerequisites: powers.russia` on each power.
# BuildPaletteOrder 11/21/31/41/51 -- one above America's, so each price rung is an adjacent pair.
# =============================================================================================
#
# FOUR OF THESE FIVE POWERS ARE AUTHORED ON A CONCURRENT BRANCH and do not exist in this tree. The
# OrderNames below (`Ru9M729Strike`, `RuIskanderStrike`, `RuKinzhalNStrike`, `RuKalibrStrike`) are
# the agreed seam between the two halves and are referenced here, not defined here.
#
# UNTIL THAT BRANCH MERGES THESE FOUR PROXIES ARE INERT, NOT BROKEN. SupportPowerProductionQueue
# resolves a proxy through Manager.Powers[charge.Power] and filters out anything that misses
# (SupportPowerProductionQueue.cs:80-103), so a proxy naming a power that does not exist yet simply
# never appears in the tab. There is no crash, no lint error and no wasted money -- which is also
# exactly why this needs a test rather than a reviewer: PowerPurchaseWiringTest names these four as
# pending and will start REQUIRING them once they land.
#
# THE FOUR RUSSIAN POWERS ALSO NEED `Prerequisites: powers.russia` ADDING when they arrive. That
# could not be written here: prerequisites go on the power trait, whose YAML key this branch does
# not know (only the OrderName was agreed), and inventing a key would create a second, incomplete
# MissileStrikePower and fail the mod load on a missing MissileActor. EveryPurchasablePowerDeclares-
# ATier fails loudly if they arrive ungated.

power.kinzhal:
	Inherits: ^PurchasableSupportPower
	Valued:
