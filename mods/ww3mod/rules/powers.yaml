# =============================================================================================
# EVENT TIER. `Prerequisites: powers.event`, which NO faction provides -- only the sandbox lobby
# option. None of these five can be bought in a normal match at any price.
# BuildPaletteOrder 60-100, after both buy ladders.
# =============================================================================================
#
# THE PROXIES ARE KEPT DELIBERATELY. Deleting them would be the obvious way to take these off the
# shop floor and it is the wrong one twice over: a power with no proxy cannot be bought EVEN IN
# SANDBOX, which is the mode that exists so the user can test all of them; and
# EveryPurchasablePowerHasSomewhereToBeBought treats a RequiresPurchase power with no proxy as
# unreachable-forever, which is the exact failure it was written to catch. The prerequisite is the
# gate; the proxy is how sandbox reaches past it.
#
# WHAT STILL FIRES THESE, none of which touches this tab or these prerequisites:
#   * Dead Hand fires the WEAPONS by name -- `Atomic` at twelve derricks and `NukeW76` at cities
#     (doomsday.yaml:108, :166). A weapon has no prerequisites.
#   * test-heavy-strike-erases-economy likewise names the weapon `Atomic`.
#   * The demo scenarios drive the POWERS by OrderName through Test.ActivateSupportPower. See the
#     branch report: those calls do not work TODAY either, for a reason that predates this branch.

power.tacnuke:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 15000, the proposal's approved nuke price, kept verbatim even though nothing in a normal
		# match can now spend it. Kept rather than deleted so the tier stays orderable and so a future
		# decision to sell this has a number to start from.
		Cost: 15000
	Tooltip:
		Name: Tactical Nuclear Strike (20 kt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 60
		# OWN CAMEO SINCE 2026-09-09: the Trinity shot, ~21 kt against this power's 20, so it is the
		# right SIZE of detonation as well as the right kind. It went `abomb` -> `paranuke` -> here.
		# `abomb` was reserved for the Tsar Bomba on 2026-09-08; `paranuke` then became a photograph
		# of an American bomb, which no unattributed event-tier strike should wear.
		Icon: tacnuke
		CameoCaption: 20 KT
		CameoBadge: nuclear
		# 1500 ticks = 90 s.
		BuildDuration: 1500
		Description: Low-yield nuclear warhead, held in off-map reserve until you call it.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: TacNukeStrike

power.sarmat:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 30000, priced on AREA rather than radius: six detonations the player places anywhere on the
		# map cover far more ground than one circle does, even though each RV (60.8c) is smaller than
		# the B83's single warhead (70.9c).
		#
		# UNDER-SET AND KNOWINGLY LEFT ALONE (2026-09-07). This used to rest on "they overlap heavily
		# inside a 21-cell footprint"; that premise went when the RVs became player-placed. Same money,
		# strictly more weapon. Not repriced here because a price is a balance change
		# (DOCS/recipes/BALANCE.md) -- and because it now only ever buys anything in sandbox.
		Cost: 30000
	Tooltip:
		Name: RS-28 Sarmat MIRV (6 x 750 kt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 70
		# A Sarmat silo launch since 2026-09-09 -- this power's own weapon, and the only power left
		# drawing v2bdgricon now that the Iskander and the strategic strike have their own. The key
		# name is Red Alert legacy (it was a V2 launcher) and describes nothing about the art.
		Icon: v2bdgricon
		CameoCaption: 6x750 KT
		CameoBadge: nuclear
		# 2500 ticks = 150 s.
		BuildDuration: 2500
		Description: Heavy ICBM carrying independently-targeted re-entry vehicles.\nSix 750 kt warheads, and you pick where each one lands.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: SarmatStrike

power.b83:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 32000 for a 70.9-cell blast. Above the Sarmat by a hair because a single circle is the more
		# reliable purchase -- no scatter, everything inside it dies -- and below the strategic strike
		# by a wide margin because 71 cells still leaves most of a large map alone.
		Cost: 32000
	Tooltip:
		Name: B83-1 (1.2 Mt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 80
		# A B83 under an airframe since 2026-09-09. abombfake USED to be a mushroom cloud with a yellow
		# FAKE banner painted across it -- correct for the decoy structure it was drawn for, absurd on
		# the largest weapon in the US stockpile. The key name is legacy; nothing else draws it.
		Icon: abombfake
		CameoCaption: 1.2 MT
		CameoBadge: nuclear
		# 2600 ticks = 156 s.
		BuildDuration: 2600
		Description: The largest weapon in the current US stockpile.\nA free-fall bomb: slow, and visible for its whole approach.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: B83Strike

power.highyieldnuke:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 40000. AtomicHighYield's blast wave has MaxRadius 102 cells against ~92 cells centre-to-corner
		# on the largest shipped map, so one detonation reaches every cell of every map in the mod: it
		# deletes the buyer's army along with the target's. There is no "grouped enemy" condition to
		# satisfy and no way to trade badly on impact, so the price WAS the entire balance -- which is
		# also the clearest argument for this being EVENT tier rather than something a player buys.
		Cost: 40000
	Tooltip:
		Name: Strategic Nuclear Strike (6 Mt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 90
		# OWN CAMEO SINCE 2026-09-09: Castle Romeo, an 11 Mt shot, for a 6 Mt strike -- the right class
		# of detonation. Went `abomb` -> `v2bdgricon` -> here; see power.tsarbomba for the reservation
		# the first move made room for, and power.sarmat for who kept v2bdgricon. 6 Mt giving up the
		# base game's icon to 50 Mt is that reservation working, not a casualty of it.
		Icon: highyieldnuke
		CameoCaption: 6 MT
		CameoBadge: nuclear
		# 3000 ticks = 180 s.
		BuildDuration: 3000
		Description: High-yield strategic warhead, held in off-map reserve until you call it.\nDevastates the entire battlefield, including your own forces.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: HighYieldNukeStrike

power.tsarbomba:
	Inherits: ^PurchasableSupportPower
	Valued:
		# 60000 -- three times DefaultCash, and very close to everything a player earns in a full match.
		# 246 cells of blast against the strategic strike's 102, and a fireball that burns for 417 ticks
		# (25 s): its thermal radius exceeds its blast radius, the only entry in the mod where that is
		# true. The user's word for why it is kept at all is "just for fun", even if it is never fired.
		Cost: 60000
	Tooltip:
		Name: Tsar Bomba (50 Mt)
	Buildable:
		Queue: Powers
		BuildPaletteOrder: 100
		# THE RESERVED CAMEO. `abomb` is atomicon.shp, Red Alert's own nuclear icon, and after
		# 2026-09-08 this is the only power in the mod that draws it -- the tactical strike, the
		# strategic strike and the Kalibr were all moved off. The reservation is the whole point:
		# fifteen powers wearing the same trefoil badge say "these are nuclear", and exactly one
		# wearing the icon a Red Alert player already knows says "this one ends the game".
		Icon: abomb
		CameoCaption: 50 MT
		CameoBadge: nuclear
		# 4500 ticks = 270 s = 4.5 minutes, the longest load in the menu by half again.
		BuildDuration: 4500
		Description: RDS-220. The largest device ever detonated.\nA 2.5 km fireball burning for twenty-five seconds.\nArrives fully loaded and fires once.
	ProvidesSupportPowerCharge:
		Power: TsarBombaStrike

# =============================================================================================
# THE ONE FLYING ACTOR IN THIS FILE, and it is here under protest.
# =============================================================================================
# MissileStrikePower.MissileActor is [FieldLoader.Require], so the new B61-12 (10 kt) rung above
# needs a body to fly even though its WARHEAD (`NukeB61Mod12Y10`) already existed. Its five
# siblings -- B61LowMissile, B61MaxMissile, W76Missile, SarmatRV, B83Missile, TsarBombaMissile --
# all live in rules/ingame/nuclear-arsenal.yaml and this belongs beside them. It is here ONLY
# because that file was owned by a concurrent branch adding Russia's four warheads, and a second
# writer in it would have been a merge conflict for no design reason. MOVE IT THERE once both
# branches have landed; nothing references its location.
#
# NO NEW SEQUENCE ENTRY. `Image: b61maxmissile` points RenderSprites at the collection the 50 kt
# body already uses (sequences.yaml:420) instead of defaulting to the actor name, which would want
# a `b61midmissile:` collection that does not exist -- a missing-sequence lint error, and one that
# only a mod load would surface. Sharing is also correct rather than merely convenient: this is the
# same physical bomb at a different dial setting, and a dial does not change a casing. That is the
# same reasoning already written on B61MaxMissile for why IT shares the 0.3 kt body's scale.
B61MidMissile:
	Inherits: ^ShootableMissile
	Valued:
		Cost: 0
	Tooltip:
		Name: B61-12 (10 kt)
	RenderSprites:
		Image: b61maxmissile
		Scale: 0.85
	Health:
		HP: 60
	# Hypersonic, NOT the template's ICBM, matching both other B61 bodies: what can shoot at this is
	# a property of how it flies, and all three dial settings fly identically.
	Targetable@Ground:
		TargetTypes: Hypersonic
		RequiresCondition: !airborne
	Targetable@Airborne:
		TargetTypes: Hypersonic
		RequiresCondition: airborne
	# Byte-identical to B61LowMissile and B61MaxMissile. Acceleration 0 with InitialSpeedPercent 100
	# is load-bearing and is explained at length in nuclear-arsenal.yaml above B61LowMissile:
	# BallisticMissileFly.EstimateArcTicks does not model acceleration, so a missile that accelerates
	# arrives AHEAD of the estimate its own camera and beacon timings were derived from.
	BallisticMissile:
		LaunchAngle: 30
		Speed: 900
		Acceleration: 0
		InitialSpeedPercent: 100
		LaunchRiseTicks: 0
		PostErectionWaitTicks: 0
		VisualPitchMultiplier: 47
	LeavesTrailsCA:
		Image: smokey2
		Palette: effect_ts
		MovingInterval: 1
		Type: CenterPosition
		Offsets: -520, 0, 160
	# The only line that distinguishes this actor from B61MaxMissile.
	Explodes:
		Weapon: NukeB61Mod12Y10
