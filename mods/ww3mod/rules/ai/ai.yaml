	# Experimental twin. SkipRearmReadyCheck used to sit on both twins to route around a readiness
	# gate that no heli could ever satisfy (attack helis refill only at an hpad, and none exists);
	# the gate now asks whether a rearm host is actually present, so the bypass is gone from both.
	HelicopterSquadBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		AttackSquadSize: 2
		AttackSquadSizeBonus: 1
		AttackCooldown: 900
		# Solo-heli doctrine (experimental-only, default-frozen in C#): a single attack heli is already a
		# large investment, so deploy it rather than benching it until a full pair forms. Still PREFERS a
		# pair — it holds out for a second only when income is high enough to afford massing one; below that
		# the lone heli commits. @stable omits these ⇒ its attack-package behaviour is byte-identical.
		AllowSoloAttackHeli: true
		MinAttackSquadSize: 1
		PairUpIncomeThreshold: 6000
		ScoutInterval: 400
		TransportInterval: 600
		TransportMinInfantry: 4
		MaxActiveSquads: 3
		StandoffEngagement: true
		# Influence stack Stage D: consume the per-player anti-air danger field so attack helis route
		# AROUND believed AA, leash their standoff to the AA-safe envelope, and withdraw/re-route the
		# moment a new AA lights up. Rides on StandoffEngagement above. Default OFF on the engine class.
		# NOTE (b8d2e601, 2026-08-02): the @stable twin sets it too (:1676), so it is not
		# experimental-only.
		DangerFieldAvoidance: true
		# SURFACED 2026-08-09 — see the @stable twin above for why this is written out rather than left on
		# the C# default. Kept identical to the twin: this is a bug-class correction, not a lever.
		AirDangerSpikeUnits: 25
		# 2026-08-30: apply that same spike test inside HelicopterAttackRunState, whose only other exits are
		# damage ALREADY TAKEN, the hit-and-run timer and the target dying.
		# THIS IS INERT TODAY AND THAT IS NOT AN OVERSIGHT. HelicopterAttackRunState is constructed at exactly
		# one place in the engine, inside `if (!standoff)` (HelicopterStates.cs:597), and StandoffEngagement is
		# true on this profile AND on @stable — so the state is unreachable for both and this flag cannot
		# change a match. It is set so the state is safe for whoever turns standoff off rather than being a
		# trap for them. HeliAttackRunReachabilityTest pins the unreachability and fails when it ends.
		WithdrawOnSpikeInAttackRun: true
		# Forward-staging (default-frozen in C#): push idle attack helis that are
		# still loitering near the SR forward to ~40% of the SR->top-POI vector, so they stage toward
		# the fight instead of hovering at the SR corner. Pct clamped short of contact per the recon's
		# AA-attrition caveat. NOTE (b8d2e601, 2026-08-02): the @stable twin sets these too
		# (:1685-1687), so they are not experimental-only; Normal / Rush / Turtle / legacy set nothing.
		ForwardStaging: true
		ForwardStagingPct: 40
		ForwardStagingMaxDistanceCells: 8
		# Frontier standoff: hold the attack-heli standoff at least this many COARSE control-field cells behind
		# the believed enemy frontier (ControlField distance-to-enemy-region), walking the leashed engage cell
		# rearward toward the squad when it lands closer. Rides on StandoffEngagement above. 4 coarse cells ≈
		# 8 map cells. NOTE (b8d2e601, 2026-08-02): the @stable twin sets it too (:1688), so it is not
		# experimental-only; Normal / Rush / Turtle / legacy still leave it 0.
		# 2026-08-30: 4 -> 8 coarse cells (≈16 map cells). The user's report is that attack helis fly as
		# frontline units when they should be supporting from behind, so this holds the standoff cell twice
		# as far back. CAVEAT, stated because the recon's stated reason for this change does NOT hold: it
		# argued 4 coarse cells put the squad exactly on the 8-map-cell radius that triggers the close-in
		# attack run, so the standoff cancelled itself. That trigger is inside `if (!standoff)`
		# (HelicopterStates.cs:597) and this profile sets StandoffEngagement: true, so the attack run is
		# never reached and cannot be what defeats the standoff. The change is made on its own merits --
		# hold further back -- and its effect is measurable only in a match.
		MinFrontierDistanceCells: 8
		# Mission-employment exit strategy (experimental-only, default-frozen in C#): evacuate an idle attack
		# heli to reserves when it is spent (out of ammo, no hpad to rearm at) or has loitered near home with no
		# believed worthwhile target — reclaiming salvage value and stopping upkeep drain instead of parking at
		# the SR/staging corner forever. The exit half of "helicopters are perfect for short hit-and-run
		# missions". Belief-store read (fog-legal), zero RNG. OFF for every non-experimental profile.
		EvacuateWhenIdle: true
		# 2026-08-30: 500 -> 300 (≈18 s at 16.67 tps, was ≈30 s). Retires a target-less airframe sooner.
		EvacuateIdleTicks: 300
		# 2026-08-30: evacuate on LOW ammo, not empty ammo — the user's ask verbatim, "before it runs
		# completely dry on ammo it can be evacuated". Every other ammo path in the tree fires at absolute
		# zero, so a gunship with one rocket left and no rearm host was flown as though it were armed. 34% is
		# roughly one salvo, which leaves it able to defend itself on the way out. Only applies with no rearm
		# host (refilling beats scrapping) and only to already-idle helis, so no mission is interrupted.
		EvacuateAmmoPercent: 34
		# 2026-08-30: evacuate a damaged airframe that cannot be repaired. The refund is HP-scaled
		# (RotateToEdge.DoSell pays fixedRefund * hp / maxHP), so recoverable value only ever DECREASES and
		# every further hit is money burnt — banking 35% of 6000 beats losing 100% of it later. 35 matches the
		# Apache's own FleeHealthPercent. Gated on the absence of a repair host, so capturing an HPAD makes the
		# bot mend rather than scrap.
		EvacuateBelowHealthPercent: 35
		EvacuateHomeRadiusCells: 12
		MissionTargetRangeCells: 60
		# Mission-complete evac (experimental-only, default-frozen in C#): a heli that finished a mission
		# FORWARD and has since idled past the window with no believed target evacuates too, instead of
		# loitering at the front with no follow-up. Routes toward its own SR edge, banking the refund.
		EvacuateForwardIdle: true
		# Phase 4 strategic-target pinning (experimental-only, default-frozen in C#): pin an attack-heli
		# squad's STRATEGIC objective separately from its tactical TargetActor, so 5-tick FSM predicate
		# flapping (too-hot soft-swaps, tactical-target death, withdraw/re-engage) can re-aim the tactical
		# target but no longer churn the strategic destination (root cause C, design §1.3/§3.3). The squad
		# resumes toward the pinned objective across those micro-transitions and re-picks only when an abort
		# trigger releases the pin: objective invalid / objective-too-hot-with-no-divert / stalled-unreachable
		# / the bounded commit window below. OFF for every non-experimental profile (@stable omits it, so its
		# heli path is byte-identical). Heli twin of the offense module's MissionCommitmentEnabled.
		StrategicTargetPinning: true
		# Bounded commit-window backstop (§3.3 TTL valve): a healthy pin is held on the event-driven triggers
		# above, but an objective that neither dies nor trips the stall/too-hot triggers cannot orbit forever —
		# after this many ticks the pin releases for a fresh re-plan. Generous so the pin genuinely persists
		# across the hit-and-run withdraw/re-engage cycles (cooldown 150 + withdraw 75); the real releases are
		# the event triggers, this is only the safety valve. 0 would disable it.
		PinCommitWindowTicks: 1200
		# Careful scout employment (experimental-only, default-frozen in C#): the littlebird is a fragile troop-
		# carrier/scout, not a strike aircraft, so its recon target + flight path respect the KNOWN (fog-legal)
		# anti-air danger field and a penetration bound — it will not dive a lone scout deep into unscouted
		# territory or through believed AA and get shot down. Reads DangerFieldLayer (Stage B), never omniscient.
		# Cap 40 cells ≈ own half + the contested middle; threshold 0 = strictly outside every believed AA envelope
		# (the air channel carries no territory baseline). OFF for every non-experimental profile (byte-identical).
		CarefulScoutEmployment: true
		ScoutAirDangerSafeThreshold: 0
		ScoutMaxDistanceCells: 40
		# 2026-08-30: the same penetration bound on the ATTACK path, which had none. Target selection is
		# omniscient (world.Actors, no visibility filter) while the air-danger risk read against it is
		# fog-legal, so unscouted ground reads as safe and the squad flies at things it cannot see. 40 matches
		# the scout bound: own half plus the contested middle. Default 0 = off, so @stable is unchanged.
		AttackMaxDistanceCells: 40
		# Empty-delivery commit-on-order (experimental-only, default-frozen in C#): commit each ordered transport
		# passenger to the shared PoiGoalGuard ledger (key transport:<heliId>) while it walks to the heli, so no
		# other module poaches it mid-board. The staged loading that fixes the empty delivery itself is an ungated
		# C# correctness change (applies to every profile); this lever only adds the anti-poach guard. OFF for every
		# non-experimental profile ⇒ no ledger interaction there (byte-identical). Uses the shared PoiGoalGuard@poi
		# defined above (gated enable-ai-experimental || enable-ai-stable).
		CommitTransportPassengers: true
		# Flight-path smoothing (experimental-only, default-frozen in C#): only re-issue an attack heli's
		# move / attack-move path when the recomputed destination has shifted at least the threshold from the
		# leg it is already committed to (or the leg completed), instead of re-pathing every 5-tick re-eval —
		# so employment-cycle movement reads DELIBERATE, not indecisive. Order-cadence only; the destination is
		# still chosen by the standoff/danger-nav/frontier logic, so the first-contact AA gate, strategic pin,
		# and evacuation are untouched. OFF for every non-experimental profile (byte-identical).
		FlightPathHysteresis: true
		FlightPathHysteresisCells: 3
		# Risk/reachability-weighted transport drop (experimental-only, default-frozen in C#): rank the drop
		# candidates (omniscient weak cell + top believed offensive POIs) by a FOG-LEGAL risk score and drop at
		# the best, instead of always taking the single weakest enemy cell — which can sit deep behind the enemy
		# SR (unreachable, lethal). Penalises believed-enemy control depth (ControlField), believed danger
		# (DangerFieldLayer) and distance from our own SR; a weight, not a filter. Belief-side reads only. OFF
		# for every non-experimental profile (byte-identical).
		RiskWeightedDropSite: true
		DropSiteCandidatePois: 6
		DropEnemyControlWeight: 100
		DropDangerWeight: 100
		DropReachWeight: 5
		# Transport EMPLOYMENT (experimental-only, default-frozen in C#). Two halves of the same bug — bought
		# transport helis idle at the SR all match (River Zeta issue 4):
		#   * TransportMissionSlots — lift had to share MaxActiveSquads with the attack loop, but a transport
		#     mission never increments activeSquads, so three live attack squads starved lift PERMANENTLY while
		#     the counter never showed a transport mission. The launcher's role filter was never the problem
		#     (it does select Role == Transport); this budget asymmetry was. Reserved slice fixes it.
		#   * EvacuateIdleTransports — nothing ever RETIRED a transport: the idle evaluator's role filter admits
		#     AttackHeavy/AttackLight only, so Transport fell through. Use-or-evac makes an unemployable
		#     transport bank its salvage refund instead of parking forever. Terminal; no hold-and-recheck.
		#     "Unemployable" applies EVERY gate the launcher applies — including IsReadyForMission. That matters
		#     most for HEALTH: tran/halo ship ReEngageHealthPercent 90 and no AI repair host exists, so a
		#     chip-damaged transport can never be picked; it must retire so the demand gate can buy a healthy
		#     replacement. An Employ verdict that omitted this pinned the airframe at the SR forever — the exact
		#     symptom this wave fixes (found by adversarial review of 41913bd8).
		# NOTE: these two flags are COUPLED — with TransportMissionSlots at 0, Employ is unreachable and every
		# transport would evacuate at its window. Ship them together. RiskWeightedDropSite (above) is a third
		# leg: the frozen drop-site picker filters on threat and can stay closed indefinitely, re-opening the
		# Employ-shadows-Evacuate pin via the unfolded dropZone residual (delta re-review of fd3bc036).
		# Both OFF for every non-experimental profile ⇒ byte-identical.
		TransportMissionSlots: 1
		EvacuateIdleTransports: true
		TransportIdleEvacuateTicks: 900

