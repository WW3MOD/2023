		# keeps only its air squads (MIG/FROG). ExcludeFromSquadsTypes is now
		# belt-and-suspenders; IgnoreGroundUnits is the real hand-off.
		IgnoreGroundUnits: true
		ExcludeFromSquadsTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk
		# Phase 4b: pick air-squad airframes by UnitRoleResolver (Buildable AttackAir, non-heli) instead
