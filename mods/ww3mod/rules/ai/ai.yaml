		# Retreat-when-done (orderless-at-hostile-location bug fix): send a done/target-gone TECN home to our SR
		# instead of leaving it idle at the front. Bug-class fix enabled on both live .tecn twins; engine default
		# stays false so any profile omitting the module is byte-identical. See @experimental.tecn for rationale.
		RetreatCapturerWhenDone: true
		# Same bug class as RetreatCapturerWhenDone above and enabled on both twins for the same reason: an
		# undispatchable capturer was dropped on the floor with no order and no claim, which is what left it in
		# the idle unclaimed pool GarrisonBotModule recruits from. @stable participates in the influence stack,
		# so the reserve muster's ControlField descent works here identically. See @experimental.tecn.
		StageIdleCapturers: true
		ReserveStandoffCells: 10
		# @stable BEHAVIOUR MOVES HERE, DELIBERATELY — the next benchmark baseline must be re-taken knowingly.
		# Enabled on both twins for the same reason ReclaimNeutralisedStructures below is: the beachhead clog is a
		# measured defect in shared code, not a tuning lever, and withholding a fix from the control only makes
		# the control less like the game. The C# default is 0 (OFF) precisely so this line is a visible act rather
		# than silent drift. NOT separately measured on @stable: the reserve path, its config and its arithmetic
		# are identical across the twins, so the @experimental measurement carries — but that is an argument, and
		# the baseline re-take is what will confirm it.
		ReserveFallbackCells: 6
		# Reclaim our own cleared base — enabled on BOTH twins for the same reason RetreatCapturerWhenDone is: it
		# is a regression fix, not a tuning lever. Without it a raided @stable bot sits next to its own neutralised
		# AA defences, airfields and production forever, because PoiMap never discovers a non-income structure as
		# a POI. @stable behaviour DOES move here; the next benchmark baseline must be re-taken knowingly. See
		# @experimental.tecn for the full rationale, including why the danger gate is a backstop rather than the
		# primary protection and why 8 (below SafeDangerUnits) rather than 30.
		ReclaimNeutralisedStructures: true
