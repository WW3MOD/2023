	# ===== Fixed-Wing Aircraft — Russia =====
	# Fixed-wing called in via Supply Route — no AFLD needed to produce them
	UnitBuilderBotModule@russia.fixedwing:
		RequiresCondition: enable-ai-any && player.brics
		IdleBaseUnitsMaximum: 0
		SkipRearmBuildingCheck: true
		UnitQueues: Aircraft
		UnitsToBuild:
			MIG: 30
			FROG: 20
		UnitLimits:
			MIG: 2
			FROG: 2

	SquadManagerBotModule@russia.fixedwing:
		RequiresCondition: enable-ai-legacy-only && player.brics
		SquadSize: 2
		SquadSizeRandomBonus: 1
		RushInterval: 600
		AttackScanRadius: 48
		AirUnitsTypes: MIG, FROG
		IgnoredEnemyTargetTypes: Submarine, IgnoreThis

	# v2 variant of the fixed-wing SquadManager. IMPORTANT: SquadManagerBotModule
	# is NOT air-only — FindNewUnits recruits EVERY IPositionable unit not in
	# ExcludeFromSquadsTypes, filing non-air/non-naval ones into GROUND attack
	# squads. With an empty exclude list (the legacy config above) it scoops up
	# the capture TECN and attack-moves it at the enemy, overriding its
	# CaptureActor order — so v2 captures never complete (POI-strategy Phase 2
	# finding). Excluding the capturer + non-combat support (already owned by
	# CaptureCoordinator / SupplyFollower) lets the goal-guarded capture actually
	# finish. Legacy AIs keep the un-excluded module above, untouched.
	SquadManagerBotModule@v2.russia.fixedwing:
		RequiresCondition: enable-ai-v2 && player.brics
		SquadSize: 2
		SquadSizeRandomBonus: 1
		RushInterval: 600
		AttackScanRadius: 48
		AirUnitsTypes: MIG, FROG
		IgnoredEnemyTargetTypes: Submarine, IgnoreThis
		# Phase 3: hand the ground pool to PoiOffensiveBotModule@v2 — this manager
		# keeps only its air squads (MIG/FROG). ExcludeFromSquadsTypes is now
		# belt-and-suspenders; IgnoreGroundUnits is the real hand-off.
		IgnoreGroundUnits: true
		ExcludeFromSquadsTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk

