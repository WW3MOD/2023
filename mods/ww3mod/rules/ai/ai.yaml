	# ===== Experimental helicopter production — Russia (transport demand gate) =====
	# STALE UNTIL 2026-09-02, now corrected: this used to be "a byte-for-byte copy of @russia.heli PLUS
	# the default-off transport demand gate". The 2026-09-02 parity promotion synced @russia.heli UP to
	# this block, so the two are now field-identical and the gate is live on BOTH profiles. The old frozen
	# weights bought the halo on a flat lottery weight with NO demand test, so it was called in during the
	# opening and then parked at the Supply Route for the match (River Zeta issue 4) — and that was still
	# @stable's behaviour up to this promotion. GateTransportOnDemand refuses the call-in
	# unless a full minimum load of infantry is actually waiting AND no idle halo we already own could carry
	# them (transports-first). Attack helis (hind/mi28) are untouched.
	# COMPOSITION: helicopters stay deliberately absent from the ground twins' UnitTargetShares (deferred to
	# this lane) — the gate is applied at BOTH post-pick sites in UnitBuilderBotModule, so it composes with
	# CompositionDirected instead of fighting it.
	UnitBuilderBotModule@experimental.russia.heli:
		RequiresCondition: enable-ai-experimental && player.brics
		IdleBaseUnitsMaximum: 8
		SkipRearmBuildingCheck: true
		UnitQueues: Aircraft
		UnitsToBuild:
			hind: 80
			mi28: 50
			halo: 15
		# 2026-08-30: attack helis capped at ONE each (was hind 4 / mi28 3). The lane is a uniform lottery
		# over a helicopter-only queue running in parallel with a ground lane that cannot see aircraft, so
		# UnitLimits is its ONLY ceiling — and at 4+3 that ceiling was 34,000, roughly double the intended
		# 15-22k mid-game army. Transports stay at 2: they are demand-gated by GateTransportOnDemand and are
		# not part of the over-buy. Expect transient 2-of-a-type — UnitLimits counts world actors only, so
		# call-ins still flying in from the map edge are invisible to it.
		UnitLimits:
			hind: 1
			mi28: 1
			halo: 2
		UnitDelays:
			hind: 2500
			mi28: 3500
			halo: 2500
		GateTransportOnDemand: true
		TransportUnitTypes: halo
		TransportMinPassengers: 4
		# 2026-08-30: no attack heli until the ground army is worth 14,000. UnitLimits caps HOW MANY; this
		# caps WHEN. The V_fit table splits the roster into a core-line band (abrams 13,158 / t90 12,632 /
		# bradley 10,714) and a specialist band (m109 30,000 / strykershorad 50,000 / grad 60,000), and a
		# 6000-cost gunship is a specialist, so the floor must clear the core-line band or a heli displaces
		# the army's spine. 14,000 is just above abrams' 13,158, the highest core-line V_fit.
		# WHY NOT HIGHER: an earlier revision used 20,000, reasoning from the "~15-22k realistic mid-game
		# army" at ai-america.yaml:343. That figure is NOT a measurement — it traces to an illustrative
		# composition in DISCOVERIES.md summing to 18,800, which would NOT have cleared a 20,000 floor. Two
		# further effects push the same way: truk is unarmed so GroundArmyValue() excludes it while the census
		# that band was expressed in counted it, and GroundArmyValue() deliberately excludes pending call-ins.
		# A floor above the army it is measuring silently disables the lane with every test still green.
		# SCOUTS ARE NOT GATED. littlebird is Role: Scout and is the ONLY scout in the tree, so gating it
		# would deny NATO all helicopter scouting until the floor cleared — while this same profile tunes
		# CarefulScoutEmployment and ScoutMaxDistanceCells for it. The derivation above is about gunships.
		MinGroundArmyValue: 14000
		MinGroundArmyValueTypes: hind, mi28

