Player:
	# ===== Bot Types =====
	#
	# Only two AI bots ship: Experimental (the live-tuned config) and Stable (its
	# frozen, benchmark-validated snapshot). The legacy Normal/Rush/Turtle bots and
	# their enable-ai-rush / enable-ai-turtle / enable-ai-legacy-only conditions were
	# removed 2026-07-30. The tournament harness A/Bs Experimental against Stable.
	#
	# Condition map — when adding a new bot type or wiring a new module,
	# pick the right condition:
	#
	#   enable-ai-any           granted to: experimental, stable
	#                           use for:    truly universal modules (intel, repair, scout)
	#
	#   enable-ai-player        granted to: experimental, stable
	#                           use for:    the shared baseline tier — modules both bots
	#                                       inherit as their starting point (base builder,
	#                                       ground production). Historically the Normal AI's
	#                                       baseline; now that Normal/Rush/Turtle are gone it
	#                                       overlaps enable-ai-any (both surviving bots hold
	#                                       both). 2026-09-02: the last `!enable-ai-experimental`
	#                                       blocks were re-gated to an explicit `enable-ai-stable`,
	#                                       so NOTHING resolves to Stable-only by negation any more.
	#                                       Prefer `enable-ai-stable` for new Stable-only blocks —
	#                                       it says what it means and survives a third bot type.
	#                                       (The @america.normal / @russia.normal / @america.heli /
	#                                       @russia.heli KEYS are legacy names kept to avoid churn in
	#                                       docs and NUnit fixtures; their gate is enable-ai-stable.)
	#
	#   enable-ai-experimental  granted to: experimental — use for NEW Experimental-only modules
	#   enable-ai-stable        granted to: stable — snapshot of the last validated Experimental
	#                                       config (promotion policy: SPEC.md §13). See the promotion
	#                                       history immediately below.
	#
	# ===== PROMOTION HISTORY =====
	#   2026-08-02  FULL parity (b8d2e601). Renamed 0730 -> "Stable AI 0802". InfluenceStack.Participates
	#               widened to admit `stable`, so the fog-legal consumer flags stopped being inert.
	#   2026-08-19  Display-only rename "Stable AI 0802" -> "Standard AI" (d02f41d0). No behaviour change.
	#   2026-09-02  FULL parity again, at main @ 26f9cec0. Renamed -> "Standard AI 0902".
	#               *** THE ai-bench BASELINE MUST BE RE-TAKEN. *** @stable behaviour moves a long way:
	#               every @experimental/@stable twin is now field-identical (11 pairs re-synced), SIX
	#               modules that had no @stable twin at all gained one (CounterBatteryRadar, DroneOperator,
	#               Minelayer, EngineerOperator, LogisticsCenter, EngineerRouteOpen), the four
	#               `!enable-ai-experimental` unit builders were re-gated to an explicit `enable-ai-stable`
	#               and synced to their experimental twins, and the per-unit tactical token in
	#               defaults.yaml was widened to `stable` (StancePositioningExecutor + both
	#               AutoTarget cluster-targeting sites). Any benchmark taken before this ref is void.
	#
	#               NOT AT PARITY — two behaviours remain @experimental-only and the YAML gate is NOT
	#               the mechanism, so this promotion could not reach them. Both are C# bot-type
	#               comparisons that exist because their module is a SHARED enable-ai-any singleton,
	#               where a YAML flag would hit both profiles at once:
	#                 * idle-truck hunt — SupplyFollowerBotModule.cs:704 feeds
	#                   SupplyTruckHuntMath.ShouldHunt (SupplyTruckHuntMath.cs:219). `IdleTruckHunt: true`
	#                   on a @stable-reachable block is INERT.
	#                 * garrison commit-on-order — GarrisonBotModule.cs:228 feeds
	#                   PoiGoalGuard.ShouldCommitShared (PoiGoalGuard.cs:305). `CommitGarrisonedUnits: true`
	#                   is likewise INERT for @stable.
	#               Closing these needs an engine change (split the module, or widen the comparison),
	#               not a YAML edit. Do not "fix" them by setting the flags — that changes nothing.
	#
	# ===== ModularBot instances =====
	#
	# Bot-brain Stage 1 — the order funnel gate, ON for BOTH profiles.
	#
	# Turned on for @stable deliberately, per settled CLAUDE.md policy: @stable inherits
	# improvements and no gate exists whose purpose is to withhold one from it. This DOES move the
	# benchmark control — suppressed orders change orders.Count, hence the ceil(N/5) drain schedule,
	# for every module including untouched ones — so the ai-bench baseline must be re-taken knowingly.
	#
	# ReorderDwellTicks: 120 (7.2 s at Timestep 60 => 16.667 ticks/s). Chosen to strictly exceed the
	# longest re-decision period the churn census measured (100 t: the POI ReevaluateInterval, and the
	# axis<->staging beat), so every identified beat is damped rather than half-damped, while staying
	# well under the shortest commitment TTL (250 t) so a dwell can never outlive the commitment it is
	# protecting. It only ever holds a unit that is STILL EXECUTING something — an idle unit is
	# re-orderable immediately — and Reflex orders (retreat / evacuation / damage response) bypass it.
	# NOTE — Name is player-facing only (slot dropdown, and the in-game player name via
	# Player.ResolvePlayerName). Type is the wire identifier: it is what `slot_bot` orders
	# carry and what replays/saves store, and it is what every benchmark and tournament
	# script selects on. Rename Name freely; NEVER rename Type.
	ModularBot@experimental:
		Name: Experimental AI
		Type: experimental
		RespectCommitmentsOnIssue: true
		ReorderDwellTicks: 120
	ModularBot@stable:
		# MMDD stamp = the promotion this snapshot was taken at (history above). The "Standard"
		# wording is deliberate and predates the stamp — see d02f41d0.
		Name: Standard AI 0902
		Type: stable
		RespectCommitmentsOnIssue: true
		ReorderDwellTicks: 120

	# Both surviving bots inherit the shared baseline (enable-ai-player / enable-ai-any).
	# New Experimental-only modules use `enable-ai-experimental`; Stable mirrors the
	# validated snapshot under `enable-ai-stable`.
	GrantConditionOnBotOwner@normal:
		Condition: enable-ai-player
		Bots: experimental, stable
	GrantConditionOnBotOwner@experimental:
		Condition: enable-ai-experimental
		Bots: experimental
	GrantConditionOnBotOwner@stable:
		Condition: enable-ai-stable
		Bots: stable

	# Unified condition for any AI type (used by shared modules)
	GrantConditionOnBotOwner@anyai:
		Condition: enable-ai-any
		Bots: experimental, stable

	# Shared blackboard for inter-module coordination
	BotBlackboard@ai:
		RequiresCondition: enable-ai-any
		TaskStaleTicks: 1500
		CleanupInterval: 300

	ProvidesPrerequisite@AIRESTRICTOR:
		Prerequisite: aitoodumb
		RequiresCondition: enable-ai-any
	GrantConditionOnPrerequisite@NAVYDISABLER:
		Condition: global-disablenavy
		Prerequisites: global-disablenavy

	# ===== Shared Modules (all AI types) =====

	# Experimental/Stable AI: per-unit commitment ledger (POI-strategy Phase 0/1). Stops
	# CaptureCoordinatorBotModule below (and the POI offense modules) from
	# re-issuing orders when a unit's IsIdle flickers mid-task. Without it the
	# escorted TECN's CaptureActor order gets overwritten every scan and it never
	# arrives — the "derricks ignored" bug. Reusable component.
	# See WORKSPACE/plans/260719_experimental_ai_poi_strategy.md.
	#
	# SHARED SINGLETON (not duplicated into a @stable twin): consumers fetch it via
	# player.TraitOrDefault<PoiGoalGuard>() (single-instance lookup), so two
	# instances on one player would throw. Gated on BOTH bot conditions instead —
	# Experimental and Stable share this ledger's one setting. (See the Stable
	# section note + SPEC §13.)
	PoiGoalGuard@poi:
		RequiresCondition: enable-ai-experimental || enable-ai-stable
		# 600 (was 300): at Speed 25 one cell is ~41 ticks, so 300 only covers a
		# ~7-cell walk — borderline for edge→SR→derrick routes, causing commitment
		# expiry mid-approach (F-2). 600 covers ~14.6 cells with margin. Shared with
		# @stable per SPEC §13 (single-instance module).
		DefaultCommitmentTicks: 600

	# experimental AI: smart capture + escort + defense of income structures.
	# Income weights match CashTrickler amounts in structures-neutral.yaml
	# (OILB=50, FCOM=100, BIO=150). MISS/HOSP have no income so score low.
	CaptureCoordinatorBotModule@experimental.tecn:
		RequiresCondition: enable-ai-experimental
		CapturingActorTypes: tecn,tecn.russia,tecn.america
		# Phase 4b: derive the capturer pool from UnitRoleResolver (role CaptureSpecialist) instead of
		# CapturingActorTypes above. Same TECN set today. NOTE (b8d2e601, 2026-08-02): @stable.tecn sets
		# UseUnitRoles too (:1860), so it draws by role as well — CapturingActorTypes (:1859) is a
		# now-inert fallback on BOTH twins, not a list kept for a frozen one.
		UseUnitRoles: true
		# logisticscenter included so experimental doesn't need the legacy
		# CaptureManagerBotModule@captureenemystructures (which competes
		# with this module for TECN — see playtest 260513 O1).
		CapturableActorTypes: oilb,bio,miss,fcom,hosp,logisticscenter
		CheckCaptureTargetsForVisibility: false
		# The ammo term in tasking — see PoiOffensiveBotModule@experimental for the full rationale. Escorts and
		# summoned defenders are both an AttackMove across open ground; a dry escort protects the capturer from
		# nothing. Default 0 (off) on the engine class => the frozen @stable.tecn twin is byte-identical.
		StarvingRecruitThresholdPerMille: 250
		ScanInterval: 75
		MaximumCaptureTargetOptions: 12
		# PITFALL: only list structures that actually have CashTrickler — a $0
		# building here outbids real income POIs and wastes the capturer.
		IncomeWeights:
			oilb: 50
			fcom: 100
			bio: 150
			miss: 10
			hosp: 20
		DefaultIncomeWeight: 10
		# Wave A, experimental-only: a Logistics Centre is the ONLY rearm host a ground vehicle has
		# (economy.md), so taking one keeps a dry armoured force fighting — but it trickles no cash, so it
		# scored at DefaultIncomeWeight, level with the worthless MISS/HOSP. 25 gives it an explicit tier
		# BELOW every cash building (lowest is oilb 50) and above the no-income default. Weight only:
		# membership already comes from CapturableActorTypes above. Default false on the @stable twin.
		CaptureSupplyDepots: true
		SupplyDepotActorTypes: logisticscenter
		SupplyDepotIncomeWeight: 25
		DistanceHalfLifeCells: 20
		SafetyEnemyScanRadiusCells: 6
		SafetyMultiplierSafe: 100
		SafetyMultiplierMild: 40
		SafetyMultiplierHostile: 10
		EscortSize: 2
		SupportRecruitRadiusCells: 40
		DefenseScanInterval: 150
		DefenseEnemyScanRadiusCells: 12
		DefenseFriendlyScanRadiusCells: 6
		DefenseSummonCount: 3
		DefenseEnemyValueThreshold: 200
		# cycle 2: keep >=1 capturer alive-or-pending by pulling production when a
		# derrick is uncaptured and no TECN is free. Default 0 (disabled) on the shared
		# engine class. NOTE (b8d2e601, 2026-08-02): no longer set ONLY here — @stable.tecn sets it
		# too (:1848), so the "@stable.tecn stays byte-identical" claim is dead.
		TecnFloor: 1
		# Capture-supply guarantee (S2-loss fix, WORKSPACE/recon/260731): the S2 rung seeds ~14 neutral oilb
		# income POIs (~33k each held to clock); the capture race decides the game, yet Experimental fielded ZERO
		# TECN in 6/10 games. Four coupled opt-ins below, ALL default-off on the shared engine class.
		# NOTE (b8d2e601, 2026-08-02): @stable.tecn no longer omits them — it sets all four at :1848-1851,
		# so it is NOT byte-identical and both profiles now run the opt-in path:
		#  (a) re-issue an UNDELIVERED floor request after ~200 ticks so a starved queue slot can't deadlock the
		#      floor (the alive+pending>=floor gate otherwise sits forever on one pending request).
		TecnRequestStaleTicks: 200
		#  (b) scale the floor to reachable neutral money POIs (~1 capturer per free oilb), clamped to [1, 5].
		ScaleTecnFloorToPois: true
		TecnFloorMax: 5
		#  (c) route the floor request through the priority production path so it out-prioritises combat buys for
		#      the queue slot (the floor cannot be starved by combat production).
		TecnRequestPriority: true
		#  (d) in the PoiMap capture pass, exclude oilbs already being captured by an in-flight capturer so N free
		#      TECN fan out to N DISTINCT derricks instead of clustering (the measured 2-TECN->1-oilb waste).
		CaptureFanoutEnabled: true
		# TECN-first ferrying: for a DISTANT derrick, request a ride from the enabled
		# MountedTransportBotModule twin instead of walking the TECN there on foot. Falls back to
		# on-foot when no carrier is free. Default false on the engine class. NOTE (b8d2e601,
		# 2026-08-02): @stable.tecn sets it too (:1893), so it is not experimental-only — both twins
		# ferry, @stable.tecn against the @poi transport instance.
		UseTransportForDistantCaptures: true
		TransportCaptureMinDistanceCells: 12
		# Influence stack (capture migration, PIPELINE item 24): order capture targets off the BELIEVED
		# anti-ground danger field instead of the omniscient InfluenceMap threat PoiMap bakes into the capture
		# score. When on, GetCaptureTargets is asked for a threat-NEUTRAL base score (no omniscient read) and
		# the believed-danger damp re-orders it fog-legally — a capturer is not sent first into a believed weapon
		# envelope. Mirrors PoiOffensiveBotModule's Stage-F believed-danger buckets on the danger-field scale:
		# safe x100 / mild x60 / hostile x20. Default OFF on the engine class. NOTE (b8d2e601,
		# 2026-08-02): @stable.tecn sets this too (:1895), so it is not experimental-only.
		StrategicCaptureRepointEnabled: true
		BelievedDangerMildUnits: 30
		BelievedDangerHostileUnits: 100
		BelievedDangerSafeMultiplier: 100
		BelievedDangerMildMultiplier: 60
		BelievedDangerHostileMultiplier: 20
		# Lever-4 diagnostics (PIPELINE lever 1, §4.D): two-sided derrick-ownership snapshot each capture scan so
		# the capture race is legible on BOTH bots (the commit markers only track this player's capturers). Logging
		# only, no behaviour. Default false on the engine class. NOTE (b8d2e601, 2026-08-02):
		# @stable.tecn sets this too (:1901), so both live twins emit the snapshot.
		CaptureTelemetryEnabled: true
		# Capture-contest lever (PIPELINE lever 1, Option A): make the HOLD contest-aware. A derrick whose
		# neighbourhood reads contested (believed anti-ground danger over ContestedDangerUnits, or the control-field
		# ring reads Enemy/Contested) gets a LARGER escort on dispatch (4 vs 2) and pre-summons defenders at a LOWER
		# enemy-value gate ($100 vs $200) so a light re-capture probe is met before it flips the structure. Targets the
		# measured ~1.9x contested-capture HOLD deficit (WORKSPACE/recon/260729-lever1-capture-contest-design.md §5).
		# Reads only fog-legal believed fields; zero RNG. Default OFF on the engine class. NOTE
		# (b8d2e601, 2026-08-02): @stable.tecn sets this too (:1902), so it is not experimental-only.
		ContestAwareSupportEnabled: true
		ContestedEscortSize: 4
		ContestedDefenseEnemyValueThreshold: 100
		ContestedDangerUnits: 30
		# Escort right-sizing (income lever): scale the capture party DOWN by believed threat at the target. A derrick
		# in our own verified-safe territory near our SR is captured with the TECN ALONE (no combat units reserved to
		# babysit it while it works), a mildly-exposed one with a small escort, and a contested one keeps the full
		# escort above. Reduction ONLY — it never raises an escort and never shrinks a target ContestAware already
		# flagged contested, so the two levers compose. Frees combat units from safe-POI babysitting for the offense /
		# other captures (the highest-impact income lever spotted from spectator games — the bot was sending a full
		# escort to zero-threat derricks next to its own SR). Reads only fog-legal believed fields (ControlField /
		# DangerFieldLayer); zero RNG. Default OFF on the engine class. NOTE (b8d2e601, 2026-08-02):
		# @stable.tecn sets this too (:1906), so it is not experimental-only.
		EscortTierSizingEnabled: true
		SafeControlScoreThreshold: 300
		SafeDangerUnits: 10
		SafeMaxDistanceFromSRCells: 24
		LightEscortSize: 2
		# Phase 2 commit-on-order audit (§4): commit recruited escorts (capture-escort:<id>) and structure
		# defenders (capture-defend:<id>) to the shared PoiGoalGuard ledger, not just the capturer. Closes the
		# ledger-blind steal channel where offense's BuildFreePool re-grabbed a just-dispatched escort/defender.
		# Default OFF on the @stable.tecn twin (which omits it) = byte-identical.
		CommitSupportUnits: true
		# ===== CAPTURE <-> COMBAT BUDGET SPLIT (combat-quality lever 3) =====
		# The @experimental bot fields a smaller, more expendable combat force because build/production budget is
		# diverted to the capture race. That split is governed by THREE tunables, surfaced here so a future tuning
		# pass (or a human) can shift budget toward combat WITHOUT a rebuild. Current values reproduce today's
		# behaviour; nothing changes until they are tuned.
		#  (1) TECN production floor — how many capturers to keep alive-or-pending (TecnFloor / ScaleTecnFloorToPois
		#      / TecnFloorMax above). More capturers = fewer combat buys from the shared production lottery.
		#  (2) Escort reservation — combat units locked to babysit each capture (EscortSize / ContestedEscortSize /
		#      LightEscortSize above). Higher = more combat force diverted off the offense onto capture duty.
		#  (3) TecnFloorArmyShareCapPct (below) — a NEW single dial: cap the capturer floor at this % of the current
		#      COMBAT army, so capture demand can't crowd out combat production when the army is thin. 100 = INERT
		#      (the clamp never binds and the combat-army count is not even computed — byte-identical to today).
		#      Lower it (e.g. 50 = capturers may not exceed half the combat army) to move budget toward combat.
		# The production SHARE weights themselves (tecn vs combat unit types) live in UnitsToBuild / UnitLimits in
		# ai-america.yaml / ai-russia.yaml — see the budget-split note there.
		# 50 since 2026-08-14 (was 100 = inert, on both twins). Reclaim is what forced the issue: a backlog of our
		# own cleared buildings does not shrink until technicians reach them, so the floor pins at TecnFloorMax
		# and TecnRequestPriority routes those 250-cost buys AHEAD of combat production — exactly while the base
		# is down and the army needs rebuilding. This was the only lever guarding that spiral and it was switched
		# off. At 50 the capturer pool may not exceed half the combat army, so reclaim demand yields while the
		# army is thin and relaxes as it recovers.
		# SCOPED, not global: the cap is raised back to the PRE-RECLAIM floor in code
		# (CaptureReclaimMath.ScopedFloorWithArmyShare), so it restrains the reclaim increment and nothing else.
		# With no reclaim candidates the two floors are equal and the ordinary capture race is byte-identical to
		# leaving this at 100 — which is the point: a global 50 would have mutated the benchmark control in the
		# exact opening race TecnFloor was built to win (the S2 loss, zero capturers fielded in 6/10 games) and
		# corrupted the next baseline. Scoping also removes the wiped-army zero-trap by construction: the result
		# can never land below the pre-reclaim floor, so cap-0 can never refuse capturers forever.
		TecnFloorArmyShareCapPct: 50
		# Retreat-when-done (orderless-at-hostile-location bug fix): when a capture completes or its target is
		# gone, send the surviving TECN back to our SR instead of leaving it idle at the front (a free kill no
		# combat free pool re-collects). Enabled on both live .tecn twins — it's a bug-class fix, not a tuning
		# lever; the engine default stays false so any profile that omits the module is byte-identical.
		RetreatCapturerWhenDone: true
		# Unit-purpose: a capturer this scan could not dispatch (no scoreable capture target, or none it can
		# target) used to be dropped on the floor — no order, no claim — which left it IsIdle and unclaimed in
		# both registries, i.e. exactly the pool GarrisonBotModule recruits from. This module has to own it:
		# PoiOffensiveBotModule's StageFreePool structurally cannot, because BuildFreePool narrows to role
		# MainBattle/IndirectFire and a capturer is CaptureSpecialist. Musters it behind the believed frontier
		# (flat field / opening => the descent finds no gradient, so NO anchor is published and the capturer is
		# left standing where it is; the garrison gate is what keeps that idle-and-unclaimed state harmless).
		StageIdleCapturers: true
		ReserveStandoffCells: 10
		# THE FLAT-FIELD CASE ABOVE NOW HAS A DESTINATION. Measured 2026-08-17 (test-clog-census, both arms):
		# with no anchor the reserve does not merely stand still, it ACCUMULATES on the beachhead — 2 of 4 idle
		# technicians within 2 cells of the SR and 3 within 4, unchanged for a whole run, while every arriving
		# reinforcement joined them. The phantom anchor removed by 85d5c868 had been dispersing that same reserve
		# to 0 and 1, issuing real moves 3-7 cells off the SR toward a cell derived by rounding. 6 map cells puts
		# the muster clear of BOTH census bands while staying deep inside friendly ground (the SR contestation
		# circle is 10), and the fan-out is bounded by this distance rather than the 20-cell standoff so no slot
		# is thrown back across the beachhead.
		ReserveFallbackCells: 6
		# Reclaim our own cleared base. Since c513f358 a soldier entering ANY enemy building evicts the owner to
		# Neutral and walks out alive, so a raided base is a row of NEUTRAL AA defences, airfields and production
		# — and the capture layer could not see one of them, because PoiMap.Discover only admits the actor names
		# in its own IncomeWeights (oilb/fcom/bio/miss/hosp) plus the SR. A human clearing a bot base left it
		# sitting next to its own corpse permanently. ON: structures we previously OWNED that are now Neutral are
		# dispatched BEFORE the PoiMap ranking and folded into the capturer floor, so recovery is funded even
		# after every free derrick on the map is gone. Enabled on both live .tecn twins — this is a regression
		# fix, not a tuning lever, so it goes wherever the module actually runs; the engine default stays false so
		# any profile omitting it is byte-identical. @stable behaviour DOES move here.
		# NOTE pbox/hbox/gtwr are NOT in scope: they strip -CaptureManager/-Capturable in structures-defenses.yaml
		# so they can be neither evicted nor reclaimed. AA defences (agun/sam/hsam) inherit ^Defense -> ^Building
		# and DO keep theirs.
		# A reclaim is not dispatched at all unless at least one escort is recruitable: the tier is floored at
		# Light AND the support pool is checked before the capture order is queued, since DispatchEscort runs
		# after that order and returns silently on an empty pool. Skipped candidates are retried every scan, so
		# a bot with no spare army defers instead of feeding technicians to the raiders still in its base.
		ReclaimNeutralisedStructures: true
		# 8, deliberately BELOW SafeDangerUnits (10) — not at ContestedDangerUnits (30), which is where this
		# started and was wrong. At 30 the gate sat three times looser than the escort lever's own low-danger
		# threshold, so any target quiet enough to reach escort tier None had already cleared it: the gate could
		# never be the thing that forced an escort. It is a BACKSTOP anyway — the real protection is the Light
		# escort floor, because a building is a vision source, so the eviction that creates a reclaim target is
		# also what blinds us to the raiders who made it. A skipped target is retried every scan, so recovery
		# starts by itself once they leave.
		ReclaimMaxDangerUnits: 8
		# Our BASE, not everything we ever touched. Without a cutoff the lever reads "ever ours, ANYWHERE", and
		# three formerly-ours derricks deep in enemy ground would preempt the ranked pass and consume every free
		# technician — including the one that should have walked to the free derrick beside our own beachhead.
		# Matches SafeMaxDistanceFromSRCells (24) since both mean "on our doorstep".
		ReclaimMaxDistanceFromSRCells: 24

	# experimental AI: POI-scored SPREAD OFFENSE (POI-strategy Phase 3). Splits the general
	# ground army across the top enemy objectives ranked by PoiMap
	# (enemy income = Attack, enemy Supply Route = Pressure; the enemy base
	# competes on the same score — decision #3, no privileged base-beeline).
	# Replaces the fixed-wing SquadManager's ground death-ball: those experimental managers
	# set IgnoreGroundUnits so this module owns the ground pool. Unit contention
	# with capture/defense is resolved through the shared PoiGoalGuard ledger.
	# Constants are tunable here without a rebuild; early passive games accepted.
	PoiOffensiveBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ReevaluateInterval: 100
		UnitsPerAxis: 8
		MinAxisSize: 3
		MaxAxes: 4
		# Early-econ behaviour 3 (PIPELINE 12): for the first ~3 min (4500 ticks) disperse in smaller
		# packets — axes form at 3 units (min 2) instead of 8 (min 3) — so the few early units spread
		# from the beachhead and grab ground/POIs quickly rather than massing one armada at the SR.
		# Default-off in C#. NOTE (b8d2e601, 2026-08-02): PoiOffensiveBotModule@stable sets these too
		# (:1931-1934), so it is not experimental-only — both profiles use the early-spread sizing.
		EarlyGameSpread: true
		EarlyGameDurationTicks: 4500
		EarlyUnitsPerAxis: 3
		EarlyMinAxisSize: 2
		AxisCommitmentTicks: 250
		ReassignScoreThresholdPct: 30
		RepathThresholdCells: 3
		# Mission commitment (Phase-1 anti-thrash): once an axis is ordered at an objective, HOLD it —
		# don't re-task on the next re-eval just because scores jittered. A committed axis is released
		# ONLY on an explicit trigger: objective invalid, a believed-danger spike at the objective
		# (> commit + max(40, +50%)), a rival objective beating it by > MissionBetterOppMarginPct (50%,
		# above the 30% target-set stickiness), or the squad ground below half its commit-time strength.
		# Kills the "go one way, stop, reverse, loop" churn from the 100-tick re-issue cadence overwriting
		# live orders. Default OFF on the engine class => PoiOffensiveBotModule@stable (which omits these
		# fields) keeps re-tasking every eval byte-identical; only this @experimental block turns it on.
		MissionCommitmentEnabled: true
		# Bounded safety re-plan valve (ticks from commit): the hold spans ~3 re-evals (ReevaluateInterval=100)
		# then force-releases at 400t even if no abort trigger fired — set ABOVE AxisCommitmentTicks (250) so it's
		# an outer backstop, not per-ledger churn. Engine default is 0 (inert); @stable omits it => byte-identical.
		MissionCommitmentWindowTicks: 400
		MissionDangerSpikePct: 50
		MissionDangerSpikeFloorUnits: 30
		MissionBetterOppMarginPct: 50
		MissionIneffectiveNumerator: 1
		MissionIneffectiveDenominator: 2
		# Phase 1c: quantize both scores before the trigger-3 rival compare so a believed-field bucket-edge
		# wobble (BalanceOfPowerFactor 150/100/60, BelievedDangerFactor 100/60/20 — a single crossing is up to a
		# 3x jump, larger than the 50% margin) can't ping-pong abort/re-propose. Band = 60% of the top score, so a
		# rival must be a full band (~1.67x) clear to count as materially better — a bucket-aware threshold. 0 on the
		# engine class => @stable twin (which omits this field) keeps the raw pre-1c compare byte-identical. Initial
		# value; sweep target once the ai-bench ladder is run. Only active with MissionCommitmentEnabled.
		MissionScoreQuantizeBandPct: 60
		# Phase 1c leg (a): the SIZING sibling of the band above. The same bucketed believed-field factors also drive
		# the score-PROPORTIONAL axis sizing, so one bucket crossing re-sizes an axis by a unit and the shed/top-up
		# pass hands that marginal unit to a rival axis pointing the other way (root cause B — a unit between two
		# axes is by construction the "farthest" from whichever it is on). Snapping each score to the NEAREST multiple
		# of a band (band = this % of the top score) makes two NEAR-TIED axes size identically, so 25-tick field
		# jitter can't reshuffle the marginal unit between them. Axis ORDER stays on raw scores. Round-to-nearest,
		# NOT the floor-to-band the rival compare above uses: flooring is right for a ratio test but zeroes every
		# axis below one band when fed to a proportional allocator. 25 is the recommended sweep starting point (see
		# the pins in PoiOffenseTest, which assert the damping AT that value).
		#
		# HELD AT 0 (OFF) pending that sweep, alongside the two fires levers below — same manager decision, same
		# rationale: this reshapes live allocation and is unpriced. 0 on the engine class too => @stable twin (which
		# omits this field) keeps the raw pre-1c sizing byte-identical.
		AllocationScoreQuantizeBandPct: 0
		# ===== ITEM 31: THE AGGRESSIVENESS SLIDER =====
		# One scalar (0 cautious … 50 neutral … 100 reckless) that shifts thresholds so the SAME code plays
		# cautious at 20 and reckless at 80 — deliberately a slider, NOT a set of discrete "Rush bot / Turtle bot"
		# personalities. It is an ordinary Info field, so a sweep harness sets it per match exactly like any other
		# AI YAML (a scenario/map rules.yaml override on this block, or a batch-injected value): to find the
		# baseline, run the S1/S2 ladder seed-matched over Aggressiveness in {20,35,50,65,80} and read the
		# win-rate/territory curve. No code edit per sweep point. The eventual lobby slider writes this same field.
		# Every consumer reads it ONLY through pure PoiOffenseMath.ShiftByKnob (effective = base + (knob-50)*slope/100,
		# integer-only, zero RNG), which also clamps it to 0..100 — so a sweep typo lands on an extreme instead of
		# somewhere undefined. Each consumer owns its OWN base/slope pair, so their ranges tune independently.
		# 50 here reproduces the tuned baseline for every consumer, whatever their slopes.
		Aggressiveness: 50
		# Consumer 1 (Phase 1d): the mission trigger-3 better-opportunity margin. Slope 0 = INERT — this one rides
		# MissionCommitmentEnabled (ON below), so slope 0 is its only guarantee of no behaviour change. Sweep target.
		MissionBetterOppMarginSlopePct: 0
		# Consumer 2 (item 31 / design §2.6): OPPORTUNISTIC ADVANCE — the behaviour the user asked for, "when a
		# sector is undefended and a free path exists, generally advance". The idle reserve stops holding at the
		# muster standoff when the ground in front reads GRANTED (not believed-enemy ground, no believed contact,
		# believed danger under the ceiling, and passable): a capped screen walks into it, chaining one granted
		# sector to the next up to the depth dial. That chaining is WITHIN a single walk — every re-eval re-seeds
		# from the staging anchor, so the screen holds a bounded offset AHEAD of the muster point and only deepens
		# over time as the muster point itself creeps forward. It is not a ratchet that accumulates ground, and
		# that bounds what the sweep can show: raising the depth dial widens the standing offset.
		# The abort is structural — the anchor is re-derived every re-eval, so a contact appearing in the corridor
		# shortens the walk and the screen is re-ordered rearward. Its adopt rule is ONE-WAY for that reason: an
		# anchor that stops passing the grant test, or a walk that no longer reaches as far, is dropped at once,
		# and only a DEEPENING or lateral move could ever be damped. Symmetric hysteresis would suppress exactly
		# the one-sector closure the abort exists for, since one sector is Chebyshev 2 at CellSize 2.
		# AdvanceHysteresisCells is then 0 (see below): once the direction was fixed, damping had no useful
		# non-zero setting left, because any non-zero value blocks one-sector RE-deepening forever and the
		# advance would ratchet to the shallowest depth it ever reached. At 0 the adopt rule reduces to "take
		# the fresh walk" — the one-way rule is not doing any blocking there, since nothing is ever held.
		# Needs ForwardStagingEnabled (below) — the staging anchor is the seed this walk extends from.
		# HELD OFF pending the priced sweep — same discipline as AllocationScoreQuantizeBandPct above: this
		# reshapes live behaviour and is unmeasured. Flip to true (the three slopes below are already live) to
		# sweep it. The @stable twin omits every field in this group, so it is byte-identical either way.
		OpportunisticAdvanceEnabled: false
		# The three §2.6 dials the slider drives, each with its own range. Unlike consumer 1 these ship with LIVE
		# slopes — they sit behind the default-off gate above, so inertness comes from the gate, and a sweep that
		# turns the gate on gets a slider that actually moves.
		# SIZE SLOPES AGAINST THE SWEEP GRID, NOT THE ENDPOINTS. The shift is integer division truncating toward
		# zero, so a knob 15 points off neutral (35 or 65 on the parked grid) needs slope >= 7 to move an integer
		# dial AT ALL. The first cut used depth 4 / force 6, which advertised 1->5 and 2->8 but produced depth
		# {2,3,3,3,4} and force {4,5,5,5,6} on the grid — three of five points identical to neutral, so the sweep
		# would have measured the ceiling alone. Widened to 7. Values on the parked grid {20,35,50,65,80}:
		#   depth   {1,2,3,4,5} sectors   endpoints knob 0 -> 0 (advance disabled) .. knob 100 -> 6
		#   ceiling {8,14,20,26,32}       endpoints knob 0 -> 0 (totally clear ground only) .. knob 100 -> 40
		#   force   {3,4,5,6,7} units     endpoints knob 0 -> 2 (minimal screen) .. knob 100 -> 8
		# Widening a slope keeps neutral EXACT by construction — (50-50)*slope/100 = 0 for any slope — so the
		# knob-50 baseline is unchanged and this is not a re-tuning of the neutral bot.
		AdvanceMaxSectors: 3
		AdvanceMaxSectorsSlopePct: 7
		AdvanceDangerCeilingUnits: 6
		AdvanceDangerCeilingSlopePct: 40
		AdvanceMinUnits: 2
		AdvanceForceCap: 5
		AdvanceForceCapSlopePct: 7
		# One spread ring is a full coarse sector at StagingSpreadStepCells 2 / CellSize 2, and the anchor often
		# sits one sector short of believed-enemy ground — so each advance spread slot is grant-tested and a
		# failing slot collapses onto the anchor cell. Rings stay small so the screen is mutually supporting.
		AdvanceSpreadRings: 1
		# 0 = no damping, and that is the considered answer rather than a disabled knob. The anchor is a control-
		# grid cell CENTRE, so it can only move in whole sectors; combined with the one-way adopt rule a scalar
		# threshold has no useful non-zero setting. Under one sector it damps nothing; at or above one sector it
		# permanently blocks a one-sector RE-deepening, because the identical gap recurs every re-eval and there
		# is no later pass where the move wins — so the advance would ratchet to the shallowest depth seen and
		# quietly bias the depth dial the sweep is meant to read. Grid-space units would not rescue it either
		# (1 sector admits everything, 2 sectors re-creates the block); if lateral jitter ever measures as a real
		# cost the fix is to split the test by direction. Order churn is prevented by the per-unit target-cell
		# dedup in StageFreePool, not by this knob.
		AdvanceHysteresisCells: 0
		# Capturer + non-combat support (owned by CaptureCoordinator / SupplyFollower)
		# and IFV carriers (owned by MountedTransport). Both factions' type names are
		# listed; a name the faction lacks is simply never matched.
		ExcludeUnitTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, bradley, bmp2, m113
		# Phase 4: classify free-pool eligibility by UnitRoleResolver (role MainBattle or IndirectFire,
		# minus cargo carriers) instead of ExcludeUnitTypes above. Drops SHORAD/MANPADS off offensive
		# axes by class; ExcludeUnitTypes becomes inert. NOTE (b8d2e601, 2026-08-02): @stable sets
		# UseUnitRoles too (:1939), so the list (:1938) is an inert fallback on BOTH twins.
		UseUnitRoles: true
		# COMBINED ARMS — the user complaint "the tank attacks alone while the infantry walk behind it".
		# Line infantry classify MainBattle (UnitRoleResolver.cs:42), so the role gate above ADMITS them and
		# StageFreePool walks them to the same attack anchor the armour drives to, on foot, from tick 3. The
		# mounted transport's first scan is 50 ticks later and its ledger only protects a passenger once the
		# EnterTransport is ADMITTED — by which time the soldier is busy under an AttackMove and BotOrderGate's
		# dwell rule (ReorderDwellTicks 120 above) suppresses the boarding order. This module's own 100-tick
		# re-eval then refreshes that standing order inside the 120-tick window, so the suppression re-arms
		# indefinitely and the seats are never sold. Holding back only what a carrier can take THIS TICK is the
		# offense's side of that race. Default false on the engine class; @stable omits it => byte-identical.
		TransportStandoffEnabled: true
		# Mirrors the transport's own LoadingTimeoutTicks (1500). Also has to clear the observed ~1015-tick
		# latency before the first pre-contact drop cell resolves, or the valve fires before the carrier ever
		# gets its chance and the hold buys nothing.
		TransportStandoffMaxHoldTicks: 1500
		# Don't recruit evacuating (out-of-ammo) units onto an axis — the AttackMove would cancel
		# their RotateToEdge evac and send an empty unit at the enemy. Default false on the engine
		# class; mirrors LayeredDefence. NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1940),
		# so it is not experimental-only.
		SkipOutOfAmmoUnits: true
		# THE AMMO TERM IN TASKING (experimental-only). SkipOutOfAmmoUnits above is an EMPTY test — 0 rounds —
		# and does nothing at 10%. Measured 2026-08-10: five riflemen at 10/100 were recruited onto a Pressure
		# axis and streamed at believed artillery while a supply truck was already driving to them. This is the
		# same 250 the supply layer itself calls starving (SupplyFollowerBotModule.HuntStarvingThresholdPerMille),
		# so the layer that RESCUES a starving platoon and the layer that TASKS it finally agree on the word.
		# EXCLUSION, not a weight: a weight loses exactly when the bot wants bodies, which is when the army is
		# under pressure and starving — the one case where being wrong is fatal. Rejoins the pool on resupply.
		# Default 0 (off) on the engine class => the frozen @stable twin is byte-identical.
		StarvingRecruitThresholdPerMille: 250
		# Wave A, experimental-only: SkipOutOfAmmoUnits above only stops us RECRUITING a dry unit — it leaves
		# it standing where it emptied, because the engine's own fallback is flag-only (AmmoPool.cs:313-320
		# sets NeedsResupply and returns, and vehicles default to ResupplyBehavior.Auto). This sweeps our dry
		# vehicles each re-eval: drive to a Logistics Centre if one is within the seek radius, else terminal
		# evac banking GetSellValue x HP/MaxHP. 0 = unlimited seek; 40 keeps a dry hull from crossing the
		# whole map past the enemy to reach the last surviving depot. Default false on the @stable twin.
		EvacuateOutOfAmmoUnits: true
		OutOfAmmoRearmSeekRadiusCells: 40
		# Item 36, experimental-only: crew that bail out of a wrecked vehicle walk off the map and are cashed
		# in. They sell for essentially their full cost of 100 (their pistol magazine deducts 3), and a pistol
		# infantryman adds nothing to an armoured push. NOTE this flag is only the cashing-in half — crew are
		# kept out of offensive recruitment on EVERY profile, flag or no flag, because putting them on an axis
		# is a bug rather than a doctrine choice. Default false on the @stable twin.
		#
		# LARGELY SUPERSEDED (2026-09-01) and kept as a backstop, not as the mechanism. Crew now queue their
		# OWN one-shot evacuation at the moment they are ejected (VehicleCrewInfo.AutoEvacuateOnEject, default
		# true), which applies to human players and to BOTH bot profiles regardless of this flag. So the
		# disposition this flag used to buy is now baseline, and what it gives up — walking crew back to re-man
		# a vehicle via EnterAsCrewMember — is given up on @stable too. The sweep below still catches crew whose
		# evac some other module cancelled by re-tasking them (see the re-homing gap at
		# PoiOffensiveBotModule.cs:2651), and it skips anyone already leaving via IsEvacuating, so the two
		# mechanisms do not fight.
		EvacuateEjectedCrew: true
		# Dispersion doctrine — spread to move, mass to assault. The switch defaults OFF on the engine
		# class, so Normal controls are untouched. NOTE (b8d2e601, 2026-08-02): @stable sets it too
		# (:1941), so it is not experimental-only. Axes fan out (Spread) while their
		# centroid is farther than AssaultRadiusCells from the target, then mass (Tight) for the
		# final push. Set CohesionSwitchEnabled: false (or ApproachCohesion: Tight) to A/B the baseline.
		CohesionSwitchEnabled: true
		AssaultRadiusCells: 15
		ApproachCohesion: Spread
		AssaultCohesion: Tight
		# SR contestation: multiply the enemy Supply Route Pressure-axis score
		# so it competes for an offensive axis (at the default 100 it scores last and never gets one). 260
		# reproduces the design plan's value=250/bias=100 uplift over the frozen value=120/bias=80
		# (260 = (250*100)/(120*80)): mild ~17.0M, safe ~42.5M, hostile ~4.25M — the hostile threat
		# gate still keeps the AI off a well-garrisoned SR. Engine default (100) = inert.
		# NOTE (b8d2e601, 2026-08-02): @stable sets 260 too (:1945), so it is not experimental-only.
		SrPressureScoreMultiplier: 260
		# Influence stack Stage E: route attack axes AROUND defended strongpoints / chokes (reads the
		# per-player anti-ground danger field) instead of grinding head-on through them. Emits a two-leg
		# AttackMove (lateral lane, then the objective). Default OFF on the engine class. NOTE
		# (b8d2e601, 2026-08-02): @stable sets this too (:1946), so it is not experimental-only.
		DangerFieldRouting: true
		# SURFACED 2026-08-09, previously running on the C# default. This is the Stage-E detour EARLY-OUT,
		# now in DANGER UNITS (100 = one reference contact at point-blank) rather than raw field units. It
		# is written here rather than left implicit because the value moved, and a behavioural default that
		# changes with nothing in the YAML to show it is exactly the silent drift CLAUDE.md forbids — the
		# @stable twin below carries the same line for the same reason.
		# Only the early-out: the detour search itself compares two routes against each other and is
		# scale-free, so this number costs wasted searches when wrong, not wrong detours.
		GroundDangerSafeUnits: 30
		# Influence stack Stage F (strategic repoint): select offensive/expansion axes off the BELIEVED
		# control + anti-ground danger fields instead of the omniscient InfluenceMap threat grid — the
		# threat term is dropped from the base score and re-derived fog-legally here. Completes the
		# @experimental fog migration for attack-axis selection. Terr-bias revival on the control field:
		# read the control balance of the ring AROUND a target (excluding its own cell — every enemy target
		# is a site-anchor structure whose own cell the control field floors deeply enemy), so an enemy
		# structure ENCIRCLED by ground we believe we hold is pressed (x150), one deep in believed-enemy
		# ground is damped (x60), a contested front is left neutral. Believed-danger damp mirrors the old omniscient
		# threat buckets on the danger-field scale: safe x100 / mild x60 / hostile x20. Default OFF on the
		# engine class. NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1951), so it is not
		# experimental-only. DECLARED benchmark re-baseline (WORKSPACE/ai-bench/), no run yet.
		StrategicRepointEnabled: true
		BopBoostMultiplier: 150
		BopDampMultiplier: 60
		BelievedDangerMildUnits: 30
		BelievedDangerHostileUnits: 100
		BelievedDangerSafeMultiplier: 100
		BelievedDangerMildMultiplier: 60
		BelievedDangerHostileMultiplier: 20
		# frontline-influence Phase 1 (reachability-gated + amphibious-typed targeting): re-shape each axis
		# score by whether a GROUND force can reach the POI from our Supply Route (read from the CrossingMap
		# terrain model, Phase 0). A far-bank objective behind an uncrossable river no longer scores as if
		# adjacent — it is damped for land units unless an intact crossing connects the banks, our amphibious
		# units can reach it (then the axis is typed amphibious so those units go, not stranded land units), or
		# only a repairable destroyed bridge connects them (reduced x60, kept on the radar for the Phase-6
		# engineer route-opening). A genuinely unreachable POI is heavily damped (x10); an amphibious route we
		# cannot crew ⇒ x30. Default OFF on the @stable twin (which omits these fields) ⇒ byte-identical.
		ReachabilityGatingEnabled: true
		ReachabilityRepairableMultiplier: 60
		ReachabilityAmphibiousMultiplier: 30
		ReachabilityUnreachableMultiplier: 10
		# Fires doctrine (PIPELINE item 11): hold IndirectFire artillery at its own weapon standoff during an
		# assault instead of marching it to the objective with the line group — it rains suppressive fire from
		# range and backs off if the target closes, while the line units press. Peels artillery off the grouped
		# AttackMove and issues a per-piece standoff AttackMove (max weapon range - FiresStandoffMargin from the
		# axis target). Gated on the UnitRoleResolver world trait (identifies the artillery role), not on
		# UseUnitRoles. Default OFF on the engine class. NOTE (b8d2e601, 2026-08-02): @stable sets this
		# too (:1959), so it is not experimental-only.
		FiresStandoff: true
		# Fires economics (PIPELINE item 19): ammo expected-value gate on the fires employment above. A ROCKET
		# artillery piece (UnitRoleResolver IndirectFireKind.Rocket — Grad/TOS/M270, derived from salvo Burst)
		# holds fire while the best clump of spotted enemies in weapon range would not repay the salvo's ammo
		# cost, and returns to FireAtWill once a worthy clump is in range; TUBE pieces (Giatsint/Paladin) are
		# exempt and may engage singles. Rides the FiresStandoff loop, so it needs FiresStandoff on (above).
		# Default OFF on the engine class. NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1960),
		# so it is not experimental-only.
		FiresEvGate: true
		# Defence-in-depth echelon (builds on FiresStandoff): position each IndirectFire piece BEHIND the axis's
		# MainBattle screen (tanks/infantry) rather than at a ring around the target, so artillery stops driving
		# alone to the front and dying. Depth behind the screen centroid = max(EchelonMinDepth, (own max weapon
		# range - the screen's longest weapon reach) + EchelonBuffer); the anchor is that far behind the screen,
		# offset away from the target. Override: a piece with NO screen on its axis (pure-artillery axis / solo
		# fire tasking) falls back to the target-relative FiresStandoff anchor. Needs FiresStandoff on (above).
		# Default OFF on the engine class. NOTE (b8d2e601, 2026-08-02): @stable sets these too
		# (:1961-1965), so they are not experimental-only.
		EchelonPositioning: true
		EchelonBuffer: 1c0
		EchelonMinDepth: 3c0
		EchelonTolerance: 2c0
		EchelonScreenRangeFallback: 5c0
		# Frontier standoff (builds on the echelon + the shipped frontline contour): hold each echeloned
		# artillery piece at least this many COARSE control-field cells behind the believed enemy frontier
		# (ControlField distance-to-enemy-region). If the echelon anchor lands closer, it is walked rearward
		# along the anchor axis (bounded) so the piece stands off BEHIND the front, not on it. 4 coarse cells
		# ≈ 8 map cells. Needs EchelonPositioning + a ControlField (present via the influence stack).
		# NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1966), so it is not experimental-only.
		MinFrontierDistanceCells: 4
		# Fires doctrine Phase 1 (gap G1): CONTINUOUS BOMBARDMENT of believed-static positions. Idle artillery with
		# ammo and a believed-static enemy position (BeliefStore IsStatic contact — defence/garrison/structure) in
		# weapon range takes a STANDING fire mission: it holds at the FiresStandoff anchor and shells that position
		# independent of any offensive axis. Targets come ONLY from the fog-legal belief store; worthiness reuses the
		# FiresEconMath EV gate (rocket needs a believed-static CLUMP to repay its salvo, tube may shell a single);
		# committed to the shared PoiGoalGuard ledger so no axis double-tasks it. Reuses FiresEvMarginPercent /
		# FiresEvClumpRadius. Default OFF on the engine class ⇒ the @stable twin (which omits these fields) is
		# byte-identical; only this @experimental block turns it on. Needs the UnitRoleResolver + BeliefStore (both
		# present via the influence stack).
		ContinuousBombardment: true
		# Fires doctrine Phase 2 (gap G2): PREPARATORY FIRES. On an axis carrying BOTH a screen and artillery, hold
		# the screen at a start line while the peeled-off guns (already at their standoff/echelon anchors) shell the
		# objective, then assault — so the barrage lands FIRST instead of screen and guns arriving together. Held
		# only inside the PRODUCTIVE band: beyond AssaultRadiusCells (still approaching) but no further out than the
		# guns can range the objective from their echelon anchor, so a fresh far-out axis presses on rather than
		# stalling with nothing landing. A prep-holding axis is NOT marked mission-Committed, so PartitionHeldAxes
		# cannot freeze it out of its own release gate and PrepFireMaxTicks really does govern the release.
		#
		# HELD OFF pending a priced sweep (manager decision, 2026-08-04). @experimental's top live regression is
		# axes that hold and never close (see DISCOVERIES 2026-08-03: ~85-92% of the army standing off on one
		# SR-Pressure axis), so no new HOLD discipline goes live until a user-gated sweep says it helps. The code is
		# correct and pinned; flipping these to true is the whole enablement. Default OFF on the engine class too ⇒
		# the @stable twin (which omits these fields) is byte-identical either way.
		PreparatoryFires: false
		PrepFireMaxTicks: 150
		# Fires doctrine Phase 3 (gap G3): SUPPRESSION-COORDINATED ADVANCE. Upgrades the Phase-2 timer with a
		# FOG-LEGAL suppression read — the screen steps off as soon as the objective is observably suppressed (the
		# barrage has done its job), else still at PrepFireMaxTicks, so fires and manoeuvre are talking to each other
		# instead of running on independent clocks. The read is taken on EVERY evaluation pass while the hold is
		# active, and AVERAGES the shipped suppression mechanic's condition stacks over the ARMED enemies the player
		# may LEGALLY SEE (CanBeViewedByPlayer) within PrepSuppressionRadius — the same fog discipline as the fires
		# EV gate's clump scan, never an omniscient read of enemy state. Averaged so the bar means "the defenders are
		# suppressed" regardless of how many there are; threshold is on the per-actor stack scale (GarrisonManager
		# ducks a soldier at 30, recalls it at 60). Needs PreparatoryFires on (it only swaps that gate's release
		# predicate). Held OFF with Phase 2 above, same rationale. Experimental-only; @stable twin off.
		SuppressionCoordinatedAdvance: false
		PrepSuppressionThreshold: 60
		PrepSuppressionRadius: 5c0
		# Combat-quality force preservation (levers 1+2, WORKSPACE/benchmarks/260802-exp-vs-stable0730-combatweighted.md):
		# the @experimental bot kills evenly with @stable yet DIES for ~2x the army value — it treats its combat force
		# as expendable while it wins the capture race. These two levers keep the capture strength but stop bleeding the
		# army. Both read only the fog-legal belief store (armed contacts near the axis, cost x confidence) vs the axis's
		# own health-weighted build value — the SAME cost scale, so the ratio is meaningful; zero RNG. Shaped as an ABORT
		# TRIGGER (a force-ratio spike), NOT a competing order stream, so it composes with the squad mission-commitment
		# work. Both default OFF on the shared engine class ⇒ the @stable twin (which omits them) is byte-identical.
		#  Lever 1 — retreat when losing: an axis whose believed local enemy force is >= RetreatForceRatioPct% of its
		#  own, sustained RetreatSustainEvals evals, falls back (grouped AttackMove) to the rally cell = our own SR
		#  instead of grinding to death. Hysteresis: it COMMITS to the retreat until it reaches safety
		#  (RetreatSafeDistanceCells of the rally) or the ratio recovers past ReengageForceRatioPct% (stricter, so no
		#  advance/retreat oscillation).
		RetreatWhenLosing: true
		#  Lever 2 — don't reinforce a lost fight: a losing axis is NOT topped up (no piecemeal trickle into a meat
		#  grinder, the classic 2x-deaths mechanism); the free units stay for other axes / a rally.
		NoReinforceLostFights: true
		RetreatForceRatioPct: 200
		ReengageForceRatioPct: 120
		RetreatSustainEvals: 2
		ForceRatioRadiusCells: 8
		RetreatSafeDistanceCells: 10
		# PHASE 2 (frontline-influence) — free-pool FORWARD STAGING. Uncommitted combat units are walked to a
		# muster point a safe standoff BEHIND the believed frontier (steepest descent on the control field's
		# distance-to-enemy-frontier BFS from the SR) instead of idling at the Supply Route clogging the road to
		# the front. The muster point ADVANCES as the front moves; units fan out (ring spread) so they don't pile
		# on one cell; committed/retreating units are never staged. Default OFF on the shared engine class ⇒ the
		# @stable twin (which omits these fields) idles the reserve at the SR byte-identical. Inert until the
		# ControlField frontier BFS is populated. Standoff 6 coarse cells ≈ 12 map cells behind the line; the
		# danger guard (10 DANGER UNITS — 100 = one reference contact at point-blank, see DangerFieldLayer)
		# keeps the muster BEHIND defended fronts.
		ForwardStagingEnabled: true
		StagingStandoffCells: 6
		StagingDangerSafeUnits: 10
		StagingSpreadStepCells: 2
		# NO-GRADIENT FALLBACK, @experimental only (this trait is not configured on @stable). Same measurement and
		# same 6-cell reasoning as ReserveFallbackCells above; on this path the pre-contact clog was heavier still,
		# 8 of a 12-unit pool within 2 cells of the SR and 11 within 4, with 100% of arrivals retained.
		StagingFallbackCells: 6
		StagingHysteresisCells: 3
		StagingMaxDescentSteps: 64
		# PHASE 3 (frontline-influence) — RETREAT-OSCILLATION DAMPER. Builds on RetreatWhenLosing to stop small
		# early-spread axes ping-ponging into the SR bubble (advance, read losing, fall back into the 10-cell
		# bubble, re-form, repeat — the "small movements near spawn" symptom). Adds two gates ON TOP of the
		# sustained-streak retreat ENTRY that RetreatWhenLosing already has: (a) a post-retreat DWELL of 3 evals an
		# axis must hold before it may re-advance on the same target (converts churn into hold-then-push), and (b)
		# an advance-STRENGTH floor (own health-weighted build value, SAME scale as the retreat force ratio) below
		# which an axis still massing near the rally waits/merges rather than trickling 2-3 units forward. NEITHER
		# delays a genuine retreat — a truly-losing axis still withdraws promptly. When Phase-2 staging is on the
		# held axis waits at the forward muster point (off the SR road). Default OFF on the shared engine class ⇒
		# the @stable twin (which omits these fields) is byte-identical. Conservative initial values — the ladder
		# sweep (WORKSPACE/ai-bench/) is the tuning path, user-gated.
		RetreatDamperEnabled: true
		RetreatReadvanceDwellEvals: 3
		MinAdvanceStrength: 1200
		# Wave B: cap the MinAdvanceStrength hold. That floor is an absolute value on the health-weighted build
		# scale, so an axis the allocator only funds to 2-3 hulls could never clear 1200 and parked in the rear
		# bubble for the whole match. The gate now also requires the axis to still be RECEIVING its allocated
		# force (engine-side fill-completion reshape), and this caps even that at 6 consecutive evals so a
		# starved axis always advances eventually. 0 = uncapped. Default 0 on the @stable twin.
		MaxAdvanceHoldEvals: 6
		# Wave B SHORAD line-fold — STAGED BUT OFF, deliberately, even here. ShortRangeAD units are bought by
		# AdaptiveProductionBotModule and then owned by no ground movement module (dropped by role from this
		# module / PoiGarrison / LayeredDefence; strykershorad is also caught by the troop-carrier exclusion and
		# is absent from MountedTransport's CarrierTypes), so they stand at the SR all match. Enabling this folds
		# them into the offense pool — but that moves the air cover off the rear and onto the push, which is a
		# doctrine A/B (WORKSPACE/ai-bench/), not a bug fix. Flip to true only under a measured run.
		FoldShortRangeAdIntoLine: false
		# PHASE 4 (frontline-influence) — FRONTLINE STRENGTH PROFILE (sensor only). Opts this @experimental
		# player in to the ControlField's per-frontier-sector believed OWN-vs-ENEMY strength profile + avenue
		# (CrossingMap crossing) mapping, so a later consumer can ask "which frontier sector is the enemy line
		# thinnest in, and which crossing opens into it." Phase 4 only BUILDS the sensor (rides the control
		# field's existing per-player recompute cadence, no new timer, zero RNG); nothing acts on it yet.
		# Default OFF on the shared engine class ⇒ the @stable twin (which omits this field) never opts in, so
		# the profile arrays are never built and it stays byte-identical. Inert until a ControlField exists.
		FrontlineProfileEnabled: true
		# PHASE 5 (frontline-influence) — WEAKEST-POINT ATTACK BIAS + SECTOR POSTURE HOLD. Consumes the Phase-4
		# frontline strength profile (built by FrontlineProfileEnabled above / opted-in by these flags too).
		# WeakestPointBias: multiply an axis score by 150 (x100) when its target sits in the believed-thinnest
		# enemy frontier sector, so the push flows toward the weak point — a BIAS, the value×distance×threat
		# scoring + deterministic comparator stay authoritative (a bare enable at 100 is inert). SectorPostureHold:
		# where the sector the axis STANDS IN reads too strong (believed enemy force >= 200% of our own believed
		# strength there), the axis holds/defends via the SAME retreat/damper fall-back (reuses OrderRetreat, never a
		# new writer) and only AFTER the genuine-retreat gate — so it can never block a truly-losing withdrawal.
		# Evaluated at the axis's own CONTACT sector (unit centroid), NOT the deep target sector: the target sits in
		# the enemy rear where our believed own strength is ~0, which made the ratio trivially "outnumbered" and
		# froze every push at home (live River Zeta regression). SectorPostureHoldOwnFloor is the backstop — below
		# ~3 own armed-unit presence in the evaluated sector we don't occupy it, so we press rather than "hold" it.
		# Default OFF on the shared engine class ⇒ the @stable twin (which omits these fields) is byte-identical.
		# Conservative initial values — the benchmark ladder (WORKSPACE/ai-bench/, user-gated) is the tuning path.
		WeakestPointBiasEnabled: true
		WeakestPointBiasMultiplier: 150
		SectorPostureHoldEnabled: true
		SectorPostureHoldRatioPct: 200
		SectorPostureHoldOwnFloor: 3
		# "Look, then commit" bound on the hold above (0 = unbounded = the legacy behaviour every other profile keeps).
		# The hold has no terminating condition of its own, and ON THIS PROFILE that does not produce an oscillation:
		# with ForwardMusterEnabled below, a held axis's destination resolves FORWARD or in place, never rearward
		# (only a NearRally axis falls back to the rear anchor), so a held flank axis FREEZES — first hold orders it
		# where it already stands, later holds emit nothing. The bound turns that freeze into "look for 3 evals, then
		# commit": it falls through to the mission-commitment snapshot and holds its mission for
		# MissionCommitmentWindowTicks (400 = ~4 evals) instead of re-deciding every eval.
		# WHAT THIS DOES NOT FIX: the live 2026-08-08 "ordered back, then forward again, and back" report is equally
		# consistent with SELECTION CHURN (axis freezes, its POI churns out of the top-k, the axis is destroyed, the
		# free-pool stager walks the units back, a new axis re-forms and walks them forward). A destroyed axis refunds
		# this budget, so the knob is INERT against that path. The [exp-posture] / [exp-offense] axis-new / retire log
		# lines exist to tell the two apart in a live run — do not treat this as diagnosed. Sweep target once the
		# ai-bench ladder is run; the caution/commitment duty cycle has never been measured.
		SectorPostureHoldMaxEvals: 3
		# PHASE 7 (@experimental) LATERAL SPREAD + FORWARD MUSTER. The counter to SR-Pressure single-axis funnelling
		# (WORKSPACE/DISCOVERIES.md 2026-08-03: ~90% of the army pooled on one standoff axis mid-map). LateralSpread
		# caps the enemy-SR Pressure axis at SrPoolSharePct% of the pool and spreads the freed units across the other
		# axes (coverage-first, mass toward the believed-weakest sectors) — does NOT touch SrPressureScoreMultiplier
		# (parked behind a measured A/B). ForwardMuster regroups a held axis at its OWN contact sector, not the rear
		# anchor. Both default OFF on the shared engine class ⇒ the @stable twin (which omits these fields) is
		# byte-identical. Conservative initial 40% cap — the benchmark ladder (WORKSPACE/ai-bench/) is the tuning path.
		LateralSpreadEnabled: true
		SrPoolSharePct: 40
		ForwardMusterEnabled: true
		# SR FLOW SHAPE (user decision 2026-08-05, fork record "SR flow shape" in WORKSPACE/AWAITING-USER.md):
		# fresh spawns ADVANCE IMMEDIATELY, SINGLY — zero assembly anywhere — rather than forward-assembling with
		# a capped wait at the forward muster. This suppresses damper arm (b), the fill-completion massing hold:
		# an axis still receiving its allocation now commits straight to its objective, so a reinforcement leaves
		# for the demand point the eval it is recruited and the axis arrives piecemeal into contact (the accepted
		# cost of the pick — maximum responsiveness). Nothing else is suppressed: the post-retreat dwell,
		# SectorPostureHold, the free-pool forward stager and transport-fill waits are separate disciplines and
		# stay live, so the muster machinery above is untouched. MinAdvanceStrength / MaxAdvanceHoldEvals are
		# consequently inert for this profile while this is true — they are kept as the revert path (drop this
		# one line and the forward-assemble shape returns). Default OFF on the engine class ⇒ the @stable twin
		# (which omits this field) is byte-identical.
		ImmediateReinforcementCommit: true
		# ===== COORDINATED ASSAULTS (new section — keep together for merge hygiene) =====
		# Two or more pushes land TOGETHER instead of arriving minutes apart and being defeated in detail. An axis
		# that reaches its START LINE holds there until (i) it out-masses what it BELIEVES is in front of it and
		# (ii) a quorum of the other axes at their start lines is also ready — then the set releases on one eval
		# pass. Placed LAST among the holds and AFTER the prep-fires gate, so the guns are already at their
		# standoff anchors while the wait runs: coordinating costs no tempo that was not already being spent.
		#
		# HELD OFF, and that is the whole point of this section. It is a new HOLD discipline, and the standing
		# manager decision (2026-08-04, recorded on PreparatoryFires above) is that none goes live until a
		# user-gated sweep prices it — because @experimental's top live regression is precisely axes that hold and
		# never close (DISCOVERIES 2026-08-03: ~85-92% of the army standing off on one SR-Pressure axis). This
		# change was built under a no-autotest budget, so NOTHING here has been measured in a game. The code is
		# correct and NUnit-pinned; flipping the one line below is the whole enablement, and the values below are
		# already the intended starting point for that sweep.
		#
		# WHAT IT DOES NOT DO: it does not restore the forward-assemble SR flow shape. The user's SR-flow-shape
		# decision (2026-08-05, AWAITING-USER.md:225) picked "advance immediately, singly" and is
		# ImmediateReinforcementCommit directly above — that governs whether a FRESH REINFORCEMENT waits at the
		# forward muster, and is untouched here. This gate lives at the far end of the approach and asks a
		# different question. Reverting that decision remains its own one-line change; this does not do it by the
		# side door.
		CoordinatedAssaultEnabled: false
		# 150 = bring half again the believed defence. RELATIVE, never absolute: the absolute floor
		# (MinAdvanceStrength) is the shape that parked small axes in the rear all match. An axis believing it
		# faces nothing is sufficient at any size, so an unopposed walk-in stays a walk-in.
		AssaultMassRatioPct: 150
		# Percentage, NOT unanimity — one pinned axis must not hold the army to the window expiry every window.
		AssaultSyncQuorumPct: 60
		# THE safety knob: elapsing releases the axis whichever reason was holding it, so the gate is structurally
		# incapable of deadlocking one. 300 ticks = 18 s at Timestep 60 (16.667 ticks/s) = three re-evals at
		# ReevaluateInterval 100, which is the resolution the release actually has.
		AssaultSyncMaxTicks: 300
		# The start-line band is (AssaultRadiusCells, 24]. Load-bearing, not cosmetic: a window that opened when
		# the axis FORMED would elapse during a 40-100 cell approach and the gate would be inert on arrival.
		# ALSO the ratchet threshold: inside this the axis is committed and the muster-ward holds may not march
		# it back out (loss-mining 2026-09-02 §1.1 — the army parked at 24+ while the ring it was contesting is
		# 10, because the damper/posture holds kept re-asserting a standoff computed from the believed front).
		AssaultSyncStartLineCells: 24
		# TELEMETRY ONLY, drives no decision: SupplyRouteContestation.Range is 10c0
		# (structures.yaml:303), and AssaultRadiusCells (15) is already OUTSIDE it — so "reached the assault
		# radius" never meant "is contesting". Emitted as ring=/insideRing=/syncDist= on the [exp-offense] order
		# line, and only when the assault geometry is live, so existing log consumers see a byte-identical line.
		# This is what makes §1.1 directly measurable instead of inferred from an order distance.
		AssaultRingCells: 10
		# ===== CLOSE-IN RATCHET — ON (2026-09-03) ====================================================
		# The ANTI-hold half of the section above, split off CoordinatedAssaultEnabled so it can go live on its
		# own. Once an axis is inside AssaultSyncStartLineCells it has committed, and the muster-ward holds may
		# not march it back out.
		#
		# WHY THE SPLIT WAS NECESSARY, and it is the whole finding: one flag gated three things — the sync HOLD
		# (SyncHoldScreen), this anti-hold RATCHET, and the ring telemetry that measures either. With it off,
		# CensusAssaultReadiness never runs, so axis.MassReady is never assigned (it is not that the mass test
		# fails — the code computing it does not execute), SyncDist is never stamped, PastPointOfNoReturn is
		# constant-false, and insideRing is never emitted. So the fix for the standoff, the instrument that
		# measures the standoff, and the readiness census were all switched off by one line — and that same line
		# arms a NEW hold discipline the 2026-08-04 manager decision says must not go live unpriced, against a
		# profile whose top regression is axes that hold and never close. Turning it on wholesale to reach the
		# ratchet would have enabled the exact shape the ratchet exists to prevent.
		#
		# CoordinatedAssaultEnabled stays FALSE above: the sync hold remains unpriced and is NOT enabled here.
		# Default OFF on the engine class ⇒ the @stable twin (which omits this field) is byte-identical.
		CloseInRatchetEnabled: true

		# ===== FLANKING MANEUVER — @experimental ONLY (2026-09-02) ===================================
		# Added as one contiguous block at the END of this trait so parallel work on the fields above
		# conflicts on a different hunk.
		#
		# WHAT CHANGES: an attack axis stops arriving as a single frontal blob. A MINORITY flank element
		# (35%, min 2 hulls) peels off, swings through a lateral waypoint offset perpendicular to the
		# approach, and comes in on a second bearing; the MAJORITY main element presses the direct axis
		# but holds at standoff until the flank is level, so both arrive together. Which side the flank
		# swings to is chosen by LOWER believed ground-danger exposure along the two-leg route — so it
		# goes around the weak shoulder, and that emerges from the Stage-B/C field rather than being
		# scripted.
		#
		# NOT the Stage-E flow-around (DangerFieldRouting above). Stage E returns null the moment the
		# beeline is already safe, because its job is to skirt a strongpoint. This is a doctrine and must
		# fire against an undefended approach too — hence separate math (FlankingMath), which reuses
		# Stage E's exposure measure and rounding rather than copying them.
		#
		# Every field here defaults OFF/inert on the shared engine class ⇒ the @stable twin (which omits
		# them entirely) keeps the undivided single-group assault byte-identical. Needs a DangerFieldLayer
		# for the side choice; with no field the split never happens. Zero RNG: the force is partitioned by
		# a stable ActorID order and the lane by integer geometry over a fixed two-candidate order.
		#
		# The converge hold is BOUNDED at 4 evals on purpose. The flank's remaining route is a
		# straight-line estimate, so broken ground can make "the flank is nearly level" permanently false;
		# an unbounded wait on an estimate is a veto wearing the costume of a delay — the exact shape the
		# Phase-5 SectorPostureHold stall already cost us. Budget is monotone within an axis lifetime and
		# is NOT refunded on release, so a hold/advance duty cycle is not reachable either. Set it to 0 to
		# keep the two-bearing split but drop the synchronisation.
		#
		# Values are conservative first guesses, NOT measured — no autotest or tournament has run against
		# them. The benchmark ladder (WORKSPACE/ai-bench/, user-gated) is the tuning path. Offset 4 + 1 per
		# unit, capped at 12 and additionally at half the approach, puts a 6-hull axis at 30 cells on a
		# ~34-degree convergence; the half-approach cap is what stops the flank leg ever being a longer
		# walk than the assault itself.
		FlankingEnabled: true
		FlankMinForceSize: 6
		FlankMinApproachCells: 12
		FlankSharePct: 35
		FlankMinElementSize: 2
		FlankOffsetBaseCells: 4
		FlankOffsetPerUnitCells: 1
		FlankOffsetMaxCells: 12
		FlankConvergeStandoffCells: 14
		FlankConvergeToleranceCells: 4
		FlankConvergeMaxHoldEvals: 4
		# IN DANGER UNITS (100 = one reference contact at point-blank), converted to raw field units at the
		# call site. Matches the mild-danger threshold used elsewhere in this trait.
		FlankEngagedDangerUnits: 30
		# ===== end FLANKING MANEUVER ================================================================

	# experimental AI: HOLD captured money POIs (POI-strategy Phase 4). Once the AI owns an
	# oilb/fcom/bio it parks a SMALL garrison (1-3 units, scaled by value + bumped
	# under assault) so the income isn't ninja-recaptured. Reads PoiMap's defensive
	# ranking (own money POIs scored value x distance x defence-urgency — threat
	# RAISES the score). Claims units through the SAME shared PoiGoalGuard ledger as
	# capture/offense (commits "defend:<id>"), so no module fights over a unit and
	# the offense pool isn't starved. Score-floating, no priority ladder: garrison
	# and offense both pull from the shared free pool. Constants tunable here.
	PoiGarrisonBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ReevaluateInterval: 100
		ValuePerGarrisonUnit: 50
		MinGarrison: 1
		MaxGarrison: 3
		ThreatGarrisonBonus: 1
		MaxGarrisons: 4
		GarrisonCommitmentTicks: 250
		RepathThresholdCells: 3
		# Same exclusions as PoiOffensiveBotModule@experimental: capturer + non-combat support
		# (owned by CaptureCoordinator / SupplyFollower) and IFV carriers (owned by
		# MountedTransport). A name the faction lacks is simply never matched.
		ExcludeUnitTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, bradley, bmp2, m113
		# Phase 4: same role-based free-pool filter as PoiOffensiveBotModule@experimental. ExcludeUnitTypes
		# above becomes inert. NOTE (b8d2e601, 2026-08-02): @stable sets UseUnitRoles too (:1982), so
		# the list (:1978) is an inert fallback on BOTH twins.
		UseUnitRoles: true
		# The ammo term in tasking — see PoiOffensiveBotModule@experimental for the full rationale. Garrisoning
		# is a WALK to the POI, so without this a starving platoon is marched off its ground to hold something
		# it has no ammunition to hold. Units already IN a garrison are left standing on the objective.
		# Default 0 (off) on the engine class => the frozen @stable twin is byte-identical.
		StarvingRecruitThresholdPerMille: 250
		# Influence stack (garrison migration, PIPELINE item 24): score held-POI defend urgency off the BELIEVED
		# anti-ground danger field instead of the omniscient InfluenceMap threat PoiMap bakes into the defend
		# score. When on, GetDefendTargets is asked for a threat-NEUTRAL (calm) base score (no omniscient read)
		# and the believed-danger RAISE re-orders + resizes garrisons fog-legally — the MIRROR of the capture
		# damp: believed danger at a POI we hold RAISES its defend score and garrison size. Buckets mirror the
		# omniscient defend multipliers on the danger-field scale: calm x100 / probed x150 / assaulted x250.
		# The assaulted threshold (120) is where the garrison-size threat bump fires. Default OFF on the
		# engine class. NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1983), so it is not
		# experimental-only.
		DefendRepointEnabled: true
		BelievedDangerMildUnits: 30
		BelievedDangerHostileUnits: 100
		BelievedDangerCalmMultiplier: 100
		BelievedDangerProbedMultiplier: 150
		BelievedDangerAssaultedMultiplier: 250

	# experimental AI: LANE AMBUSH (PIPELINE item 8 Stage 4). The strategic consumer of the shipped
	# widened-ambush machinery — posts a few suitable units into concealed Ambush positions on the corridor
	# between our beachhead and the enemy's and grants them the enable-ambush-tactics gate so the Stage-2/3
	# machine runs. Claims units through the SAME shared PoiGoalGuard ledger (commits "ambush:<id>") so
	# offense/garrison/capture never fight over them; releases sprung units back to normal tasking.
	# Deliberately small (MaxAmbushes x UnitsPerAmbush = 4 units max) so it never starves offense.
	#
	# 2026-08-02 promotion: @stable now runs a twin of this module (LaneAmbushBotModule@stable, in the
	# Stable block below) at full parity. Each module grants enable-ambush-tactics ONLY to the units it
	# posts (LaneAmbushBotModule.cs:418/439), so the twin activates the Stage-2/3 machinery for its own
	# ambushers without any shared/global grant; humans and any non-fog bot still never instantiate it.
	LaneAmbushBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ReevaluateInterval: 100
		MaxAmbushes: 2
		UnitsPerAmbush: 2
		PostFractionPct: 40
		MinLaneSeparationCells: 12
		PostCellClampCells: 6
		AmbushCommitmentTicks: 250
		RepathThresholdCells: 3
		# Same exclusions as PoiOffensiveBotModule@experimental: capturer + non-combat support and IFV
		# carriers (owned by CaptureCoordinator / SupplyFollower / MountedTransport). Role filter below makes
		# the list inert; kept for parity. The ^AutoTargetGround family (AA IFVs + assault-move vehicles) is
		# excluded structurally by CanHostAmbush regardless of these lists (OBS-1).
		ExcludeUnitTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, bradley, bmp2, m113
		UseUnitRoles: true
		# The ammo term in tasking — see PoiOffensiveBotModule@experimental for the full rationale. A post is a
		# WALK: measured 2026-08-10, two men of a starving five-man platoon were sent ~28 cells west to a lane
		# while the truck was driving to that platoon's centroid, which the walk then dragged with it. Units
		# already AT a post are left alone. Default 0 (off) on the engine class => @stable twin byte-identical.
		StarvingRecruitThresholdPerMille: 250

	# ===== COUNTER-BATTERY RADAR (experimental-only; there is no @stable twin, deliberately) =====
	# MSAR is the mod's ONLY counter-battery vision source, and before this it was human-only in both
	# halves: `msar` had zero hits anywhere under rules/ai (never bought), and no bot module anywhere
	# issued the "GrantConditionOnDeploy" order (never deployed). Production is the other half and
	# lives on the UnitBuilder twins (UnitFloors/UnitLimits/UnitDelays msar).
	# WHY A MODULE AND NOT A SETTING ON AN EXISTING ONE: nothing else in the tree drives a unit
	# somewhere and then deploys it in place, and the siting rule is specific — rear band, own-SR
	# bearing, and a DEPLOY terrain whitelist narrower than the locomotor, which every existing
	# "walk to a cell" caller would clamp against the locomotor alone and land it where deploy is
	# silently refused. It also has to OWN the unit permanently: UndeployOnMove revokes the coverage,
	# so a radar any other module can recruit is a radar that stops working the first time it is.
	# NO @stable TWIN ON PURPOSE: a wholly new experimental-gated module cannot move the benchmark
	# control, which sidesteps the shared-trait default-to-baseline rule entirely.
	CounterBatteryRadarBotModule@experimental:
		RequiresCondition: enable-ai-experimental && (player.nato || player.brics)

	# ===== RECON DRONES (experimental-only; there is no @stable twin, deliberately) =====
	# User report 2026-08-27: "I want the experimental bot to use drones ... but now they make none."
	# Production is the other half and lives on the UnitBuilder twins (UnitFloors/UnitFloorPer
	# dr.america / dr.russia). This module is what makes a bought operator actually fly anything.
	# WHY A MODULE AND NOT A SETTING ON AN EXISTING ONE: launching a drone is a force-fire at a
	# TERRAIN cell and nothing else. CarrierMaster.Attacking opens with a Terrain-only guard, so an
	# ordinary attack order at an actor fires the weapon and spawns nothing — no existing module
	# issues that order, and none of them know the operator must then stand still for 60s.
	# NO @stable TWIN ON PURPOSE: a wholly new experimental-gated module cannot move the benchmark
	# control, which sidesteps the shared-trait default-to-baseline rule entirely.
	# See DOCS/reference/architecture.md "Adding a behavioural field to a trait shared by both bot
	# profiles".
	DroneOperatorBotModule@experimental:
		RequiresCondition: enable-ai-experimental && (player.nato || player.brics)
		# Slow by design: a sortie is ~80s end to end (3s FireDelay + 60s loiter + 9s rearm + 12s
		# BurstWait) at the real 16.667 ticks/s, so a faster cadence cannot start more sorties and
		# only risks disturbing a parked operator.
		# ===== THIS INTERVAL IS RACING THE ENGINE'S OWN AUTO-RELAUNCH, AND CURRENTLY WINS =====
		# WRITE THIS DOWN BECAUSE NOTHING ASSERTS IT. The module does not clear the held Attack
		# activity; it replaces it by issuing a fresh unqueued ForceAttack. Left alone, the engine
		# re-fires that held activity at the OLD cell by itself, so the module must get an evaluation
		# in during the window where the operator is docked and has not yet successfully relaunched.
		# The arithmetic, from dock at T:
		#   T+0    PickupSlave sets IsLaunched=false, RearmTicks=150, re-grants `loaded`
		#          (CarrierMaster.cs:263-272) => the armament unpauses and the held activity fires.
		#   T+50   FireDelay elapses, Attacking() runs, GetLaunchable() finds RearmTicks ~100 > 0 and
		#          returns null (:238-247, :142-144). The shot is WASTED — and note `loaded` is NOT
		#          revoked, because the revoke at :161-162 sits after that early return.
		#   T+250  BurstWait: 200 expires, the next shot goes.
		#   T+300  Attacking() runs again with RearmTicks at 0 and the drone actually launches.
		# So the module has ~300 ticks of docked window against a 200-tick cadence, and an evaluation
		# always lands inside it. THE MARGIN IS 100 TICKS AND IT IS NOT ENFORCED ANYWHERE: lower
		# RearmTicks (^DR) or BurstWait (DroneTargeter), or raise this interval, and the guarantee
		# disappears silently — the symptom would be a drone that keeps re-flying its first cell.
		ReevaluateInterval: 200
		OperatorActorTypes: dr.america, dr.russia
		# Must exceed ReevaluateInterval with headroom: a commitment that lapses between two evals is
		# an operator PoiOffensiveBotModule is free to recruit mid-sortie.
		CommitmentTicks: 500
		# The ENFORCED leash, in cells: CarrierSlave.MaxDistance on quadcopterdrone
		# (aircraft.yaml:408), read at CarrierSlave.cs:131,138. NOT CarrierMasterInfo.MaxSlaveDistance,
		# which has zero readers engine-wide and whose 20c0 was removed from ^DR on 2026-08-27.
		LeashCells: 25
		# The leash is re-checked only every MaxDistanceCheckTicks (20), and past it the drone is not
		# recalled but dragged back and granted lost-connection, which ZEROES ITS VISION — a blind
		# drone the bot still believes is scouting. Margin keeps it off that boundary.
		LeashMarginCells: 3
		# Ticks-since-verified above which a grid square counts as UNOBSERVED for scoring. This no
		# longer gates the hover cell — that model could never fire, because a reachable hover cell is
		# always inside the operator's own verified bubble (measured: 674,584 of 674,584 candidates
		# refused, 100%, zero launches). It now decides which squares count toward revealed area.
		MinStalenessTicks: 500
		# The DRONE's own verifying vision radius, in cells. 28 and not 32: ^StandardVision's outermost
		# band (Vision@1, strength 1, 28c0-32c0) does NOT verify, because ControlField.GridCellVisible
		# tests MapLayers.IsVisible(cell, 1) and that comparison is STRICT (MapLayers.cs:579). The
		# strength-2 band (25c0-28c0) does. Sizes the revealed-area box; raising it costs nothing per
		# candidate, because the count is a four-read summed-area query independent of radius.
		DroneVisionCells: 28
		# Minimum unobserved COARSE grid squares a hover cell must reveal to justify a ~60s sortie.
		# The floor that stops a drone being spent to uncover a sliver at the edge of known ground.
		# NOT TUNED AGAINST PLAY: no drone has ever flown, so this is a first estimate and is the most
		# likely thing to need adjusting once one does.
		MinRevealedSquares: 12
		# The unreachable-corner guard. An unbounded staleness argmax sends the drone to the map
		# corner nothing can reach and leaves it there — the failure ScoutBotModule.cs:213-222 had to
		# patch.
		MaxPoiDistanceCells: 40
		# AIR danger at the cell the DRONE hovers over. It is unarmed and 50 HP: one Stinger kills it
		# anywhere inside a cell, and its 1-world-unit hitshape buys no protection because
		# HitShape.TargetablePositions never reads Radius. Losing it costs 25 supply and leaves the
		# operator holding a respawned drone it cannot launch (ammo-primary 0 while `loaded` is
		# re-granted).
		MaxAirDanger: 100
		# GROUND danger at the cell the OPERATOR stands on. Separate number, separate unit, separate
		# reason: the operator is unarmoured infantry that must stay parked for the whole loiter.
		MaxLaunchCellDanger: 60
		# ===== BELIEVED-CONTACT TASKING (every value here is in COARSE GRID SQUARES) =====
		# These share a unit with the revealed-area term so the two can be compared directly. The value
		# they replaced could not: ContactBonus was added AFTER the revealed count had been multiplied
		# by 1000, so its 2000 was worth exactly TWO revealed squares against a term that reaches ~841.
		# It was configured, it typechecked, and it never once changed a decision.
		#
		# THE TWO NUMBERS BELOW ARE PROVISIONAL AND ARE THE FIRST THING TO ADJUST. No drone had ever
		# flown when they were chosen, so they are reasoned estimates and not measurements. What a match
		# must SHOW to move either, read off the `[drone] ... launch` lines:
		#   TOO HIGH if operators fly past a large dark region to reach an old contact — launches
		#     carrying a high `intel` while `reveal` minus `border` is far below what the same disc
		#     offered elsewhere.
		#   TOO LOW if a unit vanishes into fog in front of a docked operator and the next launch still
		#     reads `intel=0` while `records` is non-zero.
		# Always read `reveal` MINUS `border`: the raw count includes non-playable border squares the
		# drone can never actually reveal, and operators launch from the SR near a map edge, which is
		# where that inflation is worst.
		#
		# ===== MEASURED ONCE, 2026-09-01 — AND THE SIZING QUESTION IS STILL OPEN =====
		# LostTrackIntelSquares is no longer purely a reasoned estimate, but it is NOT calibrated,
		# and the difference matters if you are here to change it.
		# test-drone-lost-track, run 8, treatment arm:
		#   reveal=307 border=0 intel=34 bestintel=178 bestintelcell=39,51 bestintelreveal=95
		# The value needed to make the best hunt cell win is (reveal - bestintelreveal) divided by the
		# term's displacement power (bestintel minus the intel at the reveal argmax).
		# THE MULTIPLIER THAT ONCE SAT HERE IS WITHDRAWN, AND DO NOT REINSTATE IT FROM THE NUMBERS
		# ABOVE. Its numerator is built from `reveal` and `bestintelreveal`, and 1e0226b9 replaced the
		# drone's rectangular revealed-area query with the vision DISC, removing up to 228 squares of
		# corner credit per candidate (~19x MinRevealedSquares). Both terms of that numerator were
		# computed by the box, both lose corners, and the direction of the change is not predictable
		# from the old numbers — so the pre-registered <=1.5x / >=1.8x band at CONTROL-ARM.md was never
		# actually entered and "change nothing" was never earned. A re-measurement is the only thing
		# that closes this; nothing else here has to change first.
		# WHAT SURVIVES 1e0226b9, because it is intel-space and the disc change touched revealed area
		# only: the falloff figures and the geometry. IntelSquares resolves to 247 (uniquely satisfying
		# floor(sq*4/29)=34 and floor(sq*21/29)=178), and the contact sits 30 cells from the operator
		# against a 22-cell leash, so the closest reachable hover cell is 8 cells out and falloff has
		# already taken it from 247 squares to 178. That map is therefore close to a WORST case for
		# this term by construction — a contact the drone can park directly on keeps the full 247 and
		# wins comfortably — so whatever the re-measured shortfall turns out to be, it is an upper
		# bound on the general case and must not be read as "the term is N% too small in general".
		# The scenario's negative is expected ON MERIT and is declared in its `expected-status` file
		# rather than softened in the verdict. See
		# tools/autotest/scenarios/test-drone-lost-track/CONTROL-ARM.md.
		LostTrackIntelSquares: 250
		AreaIntelSquares: 60
		StaticIntelSquares: 20
		# Must exceed one sortie cycle (~1333 ticks). An operator is airborne or rearming for most of
		# its life, so a shorter memory expires the record before any operator is free to act on it.
		IntelMemoryTicks: 2000
		FreshSightingTicks: 50
		# BeliefStore drops a mobile contact 175 ticks after the last sighting (7 decay passes of 25
		# ticks at 75% each, floor 15). Sampling must stay well inside that window or a vanishing unit
		# is forgotten before this module ever records where it was.
		IntelSampleInterval: 25
		# The enemy SR is fixed, indestructible and non-capturable, so a drone parked over it learns
		# nothing that is not already known.
		SupplyRouteExclusionCells: 8
		StarvingRecruitThresholdPerMille: 250
		# Must exceed the weapon's FireDelay (50). The spawn is a delayed action owned by the Armament
		# rather than by the attack activity, so re-ordering inside that window does not cancel the
		# pending launch — it aims the operator at a new cell while the drone still departs for the old
		# one. 75 leaves 25 ticks of slack.
		LaunchSettleTicks: 75

	# experimental doctrine — mine the approach lanes. Until now nothing in mods/ww3mod/rules/ai/
	# referenced MinelayerBotModule, so despite two unit types carrying the Minelayer trait the bot
	# had never laid a mine.
	# NO @stable TWIN ON PURPOSE, for the DroneOperatorBotModule reason above: a wholly new
	# experimental-gated module cannot move the benchmark control, so the shared-trait
	# default-to-baseline rule does not arise. Both C# fields this block sets are default-off on the
	# engine class, so no other profile changes either.
	# WHY THE MODULE FITS THE REBUILT GAME MODEL DESPITE BEING AN RA-ERA IMPORT: it is conflict-driven,
	# not perimeter-driven. Its primary input is IBotRespondToAttack — it records where OUR actors were
	# shot and mines there later, which is a lane/approach model already. It references no factory, no
	# resource field and no base perimeter, so none of the usual RA carry-over traps apply.
	MinelayerBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		# LOWERCASE IS MANDATORY AND SILENT IF GOT WRONG. This HashSet is compared against
		# Actor.Info.Name, which Ruleset.cs:126 lowercases at load. `MNLY` here matches nothing, the
		# pool comes back empty, and the module does nothing at all while looking correctly configured.
		# WHY THE WHITELIST EXISTS AT ALL — this is the load-bearing line in the block. The pool is
		# ActorsWithTrait<Minelayer>(), and in WW3MOD that trait is NOT only on the minelayer vehicle:
		# ^E6 engineers carry it (infantry.yaml:1929) over `secondary-ammo`, the SAME AmmoPool that
		# Demolition spends (:1933). Unset, this module spends every engineer's 3 C4 charges laying
		# mines and walks unarmoured non-combat support — the pool EngineerRouteOpenBotModule recruits
		# from — down a contested lane.
		MinelayingActorTypes: mnly
		# Take the cold-start target from PoiMap's scored anchors (enemy Supply Route first) rather than
		# from a random enemy actor read off world.Actors. Two reasons, and the second is the one that
		# would have made this module inert rather than merely cheating:
		#   FOG. The upstream scan is omniscient, which the fog-respecting profiles forbid
		#     (DOCS/reference/influence-stack.md:39).
		#   IT WOULD NOT HAVE WORKED. Minelayer.ResolveOrder filters the field to cells the owner has
		#     EXPLORED (Minelayer.cs:207), so a cell picked through fog yields an empty minefield and a
		#     silent no-op — configured, typechecked, never lays a mine.
		# A random enemy is also not a lane: it is re-drawn every ScanTick, pointing consecutive scans
		# down different corridors. The SR is fixed, so the corridor to it is stable across scans, and
		# reading its position is fog-legal by the same argument LaneAmbush uses (PoiMap.cs:549-551).
		StrategicAnchorColdStart: true
		# TWO SCANS TO FIRST MINE, NOT ONE: the cold-start branch enqueues a position and then returns
		# without ordering anyone ("we don't do other things in this tick"), so the first field is laid
		# on the SECOND scan. At 16.667 ticks/s this is ~19 s per scan, i.e. ~38 s to the first mine.
		ScanTick: 320
		# One minelayer exists at a time (UnitLimits mnly: 1 on both builder twins), so this is
		# descriptive rather than restrictive today. It stops a future second minelayer from being
		# committed to the same field.
		MaxPerAssign: 1
		# THE WHOLE PAYLOAD GOES INTO ONE FIELD, AND THAT IS THE FIRST THING TO TUNE. Radius 1 makes the
		# order a 3x3 box (target = pos+(1,1), ExtraLocation = pos-(1,1)); every cell of that box is
		# within MinefieldDepth (1536 = 1.5 cells) of the box diagonal, so all 9 are admitted against a
		# 10-mine AmmoPool. The unit then has to drive back to a logisticscenter to rearm
		# (vehicles.yaml Rearmable), so this trades concentration against a long round trip.
		MineFieldRadius: 1
		# Do not drive a 600-cost UNARMED vehicle into contact. Any enemy Ground actor within
		# AwayFromCellDistance of the intended field cancels that position outright. Mines get laid in
		# the lulls, which is when minelaying actually happens.
		AwayFromEnemyTargetTypes: Ground
		AwayFromCellDistance: 9
		# Air attackers do not make a GROUND lane. Recording the position of a helicopter that shot us
		# would aim the minelayer at a cell no vehicle ever drives through.
		IgnoredEnemyTargetTypes: Air, AirLight, AirMedium, AirHeavy, Helicopter
		# When the victim is a STRUCTURE, record where the ATTACKER stood instead of the building's own
		# cell — the building sits in our territory and is not itself a route anyone drives.
		UseEnemyLocationTargetTypes: Structure
		# AwayFromAlliedTargetTypes IS DELIBERATELY LEFT EMPTY, which is not the oversight it looks
		# like. In WW3MOD own mines cannot hurt own units: ^Mine sets CrushedByRelationships to
		# Enemy, Neutral and PassClasses: mine (misc.yaml), so friendlies pass over harmlessly. The
		# usual "keep the field away from our own troops" argument therefore does not apply here, and
		# populating it would only cancel positions for no safety gain.

	# ===== COMBAT ENGINEERS (experimental-only; there is no @stable twin, deliberately) =====
	# The bot BUYS engineers and then parks them. Both faction UnitBuilder twins carry e6 at
	# UnitsToBuild 20 / UnitTargetShares 8 / UnitLimits 2, but ^E6 also carries
	# `AIUnitRole: Role: Logistics` and every free-pool module sets UseUnitRoles: true — so the role
	# filter excludes him from assault, ambush, garrison and line duty alike. Before this module the
	# ONLY thing that ever moved an engineer was EngineerRouteOpenBotModule's bridge trigger, which
	# fires only when a repairable crossing happens to sit in the believed-weakest enemy sector.
	# THIS IS NOT THE CAPTURE MODULE THE NOTE BELOW RULES OUT, and the distinction is not a
	# formality: this module never issues a capture order and ^E6 carries no Captures trait to issue
	# one with. It employs the three abilities he already has and never uses — Demolition (3 C4),
	# Armament@Repair and Armament@ClearMines.
	# NEITHER OF THE TWO YAML-ONLY SHORTCUTS WORKS, so do not "simplify" this away. Removing e6 from
	# LayeredDefence's ExcludedActorTypes does nothing, because that instance sets UseUnitRoles: true
	# and the exclusion list is inert under it. Changing the AIUnitRole does something worse: it puts
	# a 250-cost unarmoured specialist on the assault line.
	# NO @stable TWIN ON PURPOSE: a wholly new experimental-gated module cannot move the benchmark
	# control, which sidesteps the shared-trait default-to-baseline rule entirely.
	# See DOCS/reference/architecture.md "Adding a behavioural field to a trait shared by both bot
	# profiles".
	EngineerOperatorBotModule@experimental:
		RequiresCondition: enable-ai-experimental && (player.nato || player.brics)
		# Faster than the drone module's cadence because an engineer has no sortie cycle to respect.
		# How often he is actually DISTURBED is OrderSettleTicks below, not this.
		ReevaluateInterval: 100
		# Must exceed ReevaluateInterval by enough that a claim cannot lapse between two evaluations.
		CommitmentTicks: 300
		# ===== THE ANTI-LIVELOCK NUMBER, AND IT IS THE ONE TO SUSPECT FIRST =====
		# Every order this module issues is unqueued, and an unqueued order CANCELS the current
		# activity. A Demolish walk that is cancelled does NOT spend the charge, so the module simply
		# re-picks the same target and starts the walk again — on screen that is an engineer
		# wandering between two buildings and never blowing either. Held for the full window even
		# when a better job has appeared. Must comfortably exceed the walk time across
		# BreachMaxDistanceCells at infantry speed.
		OrderSettleTicks: 200
		# ^E6 spends C4 through the Demolition trait's UseAmmo, NOT through an Armament — there is no
		# Armament named `secondary` on the actor at all — so no armament pause state can answer
		# "has he a charge left" and the pool is read by name.
		DemolitionAmmoPoolName: secondary-ammo
		BreachMaxDistanceCells: 30
		# The legally-measurable stand-in for "an axis is stalled against it": OUR OWN armed units
		# near the believed static. A defence with none of our troops near it is not blocking
		# anything, and walking an unarmoured 250-cost specialist to it alone donates the charges.
		BreachMinFriendlyNearby: 2
		BreachFriendlyRadiusCells: 8
		# ===== THIS IS THE FOG GUARD, NOT A TUNING KNOB =====
		# Read EngineerTaskingMath.IsBreachViable before touching it. The module must hand the engine
		# a real Actor to build the "C4" order (Demolish derives from Enter, and Enter only ever
		# enters a TargetType.Actor), and that lookup can succeed or FAIL — the failure being itself
		# information, namely that the believed structure is already dead. Requiring a fresh sighting
		# removes the leak at source. Nothing downstream enforces this: TargetExtensions.Recalculate
		# returns an Actor target unmodified with targetIsHiddenActor false whenever viewer.IsBot, so
		# the engine would happily let a bot demolish something it has never seen.
		# Must span more than one BeliefStore recompute (25 ticks) or a watched structure flickers
		# out of eligibility between passes.
		BreachContactFreshnessTicks: 50
		# Armament@Repair's weapon has Range: 1c0 — ONE CELL — so this is a walk-to-it distance, not
		# a standoff. He must end up adjacent or the armament never fires.
		RepairMaxDistanceCells: 25
		# Everything spawns at the Supply Route, so without this exclusion the screen centroid IS the
		# beachhead and the engineer never leaves it — the exact behaviour this module exists to end.
		ScreenHomeExclusionCells: 12
		# Damping on the parking employments. Re-ordering on every centroid twitch cancels the repair
		# armament's auto-acquired target each cycle, so the group under fire — the group that needs
		# repairs — is the one whose engineer never completes a burst.
		AnchorShiftCells: 4
		# A dry engineer is released and left IDLE rather than ordered, and that is the only way he
		# rearms: ^E6 sets AutoSeekSupplies ReturnWhenEmpty: false, so the periodic empty-check
		# dispatch is OFF for him (AutoSeekSupplies.cs:230) and only the INotifyBecomingIdle handoff
		# remains. Any order issued here would suppress it.
		StarvingRecruitThresholdPerMille: 250

	# NOTE: No engineer (^E6) capture module wired anywhere — engineers
	# don't capture in WW3MOD by design. The Captures trait sits on
	# Technician (^TECN) only. See DOCS/gameplay/capturing.md.

	BuildingRepairBotModule@aiplayer:
		RequiresCondition: enable-ai-any

	# LCCV -> forward LOGISTICSCENTER. LOGISTICSCENTER is Prerequisites: ~disabled and nothing grants
	# `disabled`, so transforming an LCCV is the ONLY way any player obtains one — which is why the bot
	# fielded supply trucks (750 supply) and never the Centre (2250, 3x on both axes).
	#
	# THE BUY IS NOT A UnitFloors ENTRY, AND THAT IS ARITHMETIC RATHER THAN TASTE. Both the floor lane
	# and UnitLimits count OwnedOrPending for one actor NAME, and the LCCV is consumed by its own
	# transform (Transform.DoTransform disposes it), so a successful deploy returns the `lccv` census to
	# zero while the thing it bought stands on the map as a `logisticscenter`. `UnitFloors: lccv: 1`
	# would therefore read "below floor" forever and re-buy at 3000 credits without bound. The module
	# owns its own demand gate instead, counting the DEPLOYED form — the same mechanism, and for the
	# same reason, as CaptureCoordinatorBotModule's TecnFloor (see ai-america.yaml, which spells out
	# why a consumable belongs in a demand gate and not in a standing-population floor). Consequently
	# this feature adds NO entry to UnitsToBuild / UnitFloors / UnitLimits on either twin.
	LogisticsCenterBotModule@experimental:
		RequiresCondition: enable-ai-experimental && (player.nato || player.brics)
		# One Centre. Counted as deployed centres + LCCVs in transit + pending requests, so the second
		# is never ordered while the first is still driving.
		DesiredCenters: 1
		# The whole point is cutting the resupply round-trip, so the site is a standoff BEHIND the
		# believed line rather than at the rear. 4 coarse control-grid cells matches the free-pool
		# forward staging standoff; a flat/unpopulated control field stalls the descent at the Supply
		# Route and the module then HOLDS rather than deploying a 3000-credit Centre next to the SR it
		# was meant to relieve.
		StandoffCells: 4
		DangerSafeUnits: 30
		# ===== WHEN TO BUY ONE AT ALL (user ruling 2026-09-03) =====
		# REPORTED: "The bots now buys Logistics centers... We definitely do not need them at the start of
		# the game, as in this game they bough one almost right away. It is expensive and has no purpose in
		# the beginning because all units are fully armed." And, on the same map: "there are already a
		# neutral LC on each side, so the bots should instead capture the exisiting one."
		#
		# WHAT WAS WRONG: the module's demand gate tested only `centers + mcvs + pending < DesiredCenters`
		# and `funds >= MinCashToRequest`. With DesiredCenters 1 and the default opening balance, the FIRST
		# evaluation (ScanInterval 100 ticks, ~6 s) bought one. There was no need term to mistune — there
		# was no need term at all.
		#
		# WHAT SHIPS NOW: LogisticsCenterDemandMath.ShouldRequestCenter. The Centre's value is TEMPO, not
		# capability — "Units can always evacuate to rearm", so a Centre only shortens a journey the bot
		# could make anyway. That value is priced in credits and must beat a tank:
		#     value = forwardArmyValue × ammoNeed × tripSaved   (all three, multiplied)
		#     buy iff value > tankCost AND funds >= centreCost + tankCost AND nothing capturable in reach
		# Any one factor at zero refuses, which is what makes the opening refuse for three reasons at once:
		# nobody forward, nobody short of ammo, and a small army.
		RequireDemand: true
		# The alternative purchase, priced from the RULESET at decision time so a balance pass moves the
		# comparison with it: abrams 2500 / t90 2400 against the Centre's 3000 — the user's "it costs more
		# than a tank". Dearest resolvable type wins.
		TankActorTypes: abrams, t90
		# A rearmable unit this far from the Supply Route counts as a FORWARD customer; nearer ones are
		# inside the beachhead's own catchment and a forward Centre saves them nothing.
		ForwardCustomerCells: 12
		# The walk that survives the Centre: fighting line back to the Centre's standoff. Subtracted from
		# the customers' distance to give the trip actually saved. An estimate, not a derivation —
		# StandoffCells above is in COARSE control-grid cells and converting it here would import the
		# grid/map-cell confusion this module's siting code warns about.
		ResidualTripCells: 6
		# How far a capturable Centre may be and still VETO the purchase. Bounded on purpose: woodland-
		# warfare, river-zeta and polar-disorder each place neutral Centres in PAIRS, one per side, so an
		# unbounded veto would let the ENEMY's Centre block the buy for the whole match — turning "prefer
		# the free one" into "never own one".
		CaptureConsiderCells: 40
		# WORKED EXAMPLE, so the bar is legible and tunable rather than folklore. 12000 credits of army,
		# 40 cells out, 60% depleted: tripSaved = 1000×(40−6)/40 = 850‰; value = 12000×600×850/1e6 = 6120,
		# which beats a 2500 tank, so it buys. The same army at full ammo, or parked on the SR, is worth 0.
		# ===== KEEPING IT STOCKED (user ruling 2026-09-03) =====
		# "Bots needs to learn how to resupply the LC (I think that should work now by sending a truck to
		# it, to transfer supplies to the LC from the truck. But make sure that works both for bots and
		# humans)."
		#
		# THE HUMAN HALF ALREADY WORKED and is not changed. LOGISTICSCENTER carries AbsorbsSupplyCache
		# (structures.yaml:560), which is what DropsSupplyCache.ResolveOrder:312 requires before it will
		# accept a DeliverSupply order; TRUK carries DropsSupplyCache (vehicles.yaml:695) so it can issue
		# one; and Activities/DeliverSupply.cs:148-154 does the DeductSupply/AddSupply transfer directly
		# into the Centre's stock. DeliverSupply is the DEFAULT left-click of a loaded truck on a Centre.
		# What was missing is that NO BOT MODULE EVER ISSUED IT — a bot's Centre ran to zero and stayed
		# there, which is the reported "units travel to an empty LC and then just sit there".
		#
		# So the bot now issues THE SAME ORDER a human does. Bot and human share one code path; the bot has
		# no private transfer rule that can drift from what the player sees.
		#
		# ARBITRATION, which is the part that would otherwise break. SupplyFollowerBotModule@supply also
		# tasks trucks, and two modules ordering one truck is order-spam that resets a drive every scan.
		# This takes a BotBlackboard claim ("logistics-delivery") BEFORE ordering; the follower drops any
		# truck claimed by another module from its roster entirely (IsClaimedByOtherModule), so a claimed
		# truck vanishes from its scan rather than being fought over. The claim is released the moment the
		# errand ends — truck gone, Centre gone or captured away, truck empty, Centre full, or truck idle —
		# which hands it straight back rather than stranding it claimed-forever.
		RestockCenters: true
		SupplyTruckActorTypes: truk
		# Send at half empty, NOT at zero: waiting for empty means waiting until the Centre has already
		# failed the units standing at it, which is the symptom being fixed.
		CenterRestockThresholdPerMille: 500
		# Smallest transfer worth a truck's whole errand, and the anti-oscillation term — a truck that
		# delivers a trickle drops below the follower's RestockThreshold, is released as spent, and is
		# immediately re-dispatched.
		MinDeliverySupply: 250
		MaxDeliveryDistanceCells: 40

	# Scouting — sends fast units to explore the map and report enemy positions
	ScoutBotModule@america:
		RequiresCondition: enable-ai-any && player.nato
		ScoutTypes: humvee
		MaxScouts: 2
		ScanInterval: 200
		MinScoutDistance: 15
		ScoutVisionRadius: 8

	ScoutBotModule@russia:
		RequiresCondition: enable-ai-any && player.brics
		ScoutTypes: btr
		MaxScouts: 2
		ScanInterval: 200
		MinScoutDistance: 15
		ScoutVisionRadius: 8

	# Garrison nearby friendly-or-neutral garrisonable buildings as a DEFENSIVE REACTION.
	# Note what this actually recruits, which the old comment here got wrong: GarrisonActorTypes is unset,
	# so the unit side is any Passenger holder (narrowed per building by the cargo-type match), and
	# ^CivBuilding carries GarrisonManager, so the building side is mostly neutral civilian houses.
	GarrisonBotModule@defenses:
		RequiresCondition: enable-ai-any
		ScanInterval: 200
		MaxGarrisonRadius: 25
		MaxOrdersPerTick: 2
		PrioritizeExposed: true
		# Unit-purpose: require a REASON to garrison. PrioritizeExposed above is a List.Sort comparator, never
		# a filter, so without this the module carries no enemy/danger term at all and puts idle units into an
		# arbitrary rear house on the bot's very first tick — permanently, since nothing ever unloaded them.
		# Reads the fog-legal believed danger field, not the omniscient ThreatMapManager. Release makes the
		# cover temporary, which is the whole difference between taking cover and leaving the match.
		# A bug-class fix on a SHARED enable-ai-any module, so it is deliberately NOT narrowed by bot type —
		# @stable inherits it. It reaches only profiles that actually build a danger field (@experimental and
		# @stable, which Participate); legacy/normal build none, read 0 danger everywhere, and keep the old
		# behaviour rather than having the module silently disabled. THIS CHANGES @stable — see the commit.
		RequireBelievedThreat: true
		MinBelievedDanger: 1
		ReleaseWhenThreatClears: true
		# Enter and release are exactly complementary predicates over an INTEGER field that is fully restamped
		# each recompute, so at a kernel's outermost ring one confidence step moves the whole contour across the
		# threshold. Raising MinBelievedDanger would NOT fix that — every threshold has its own +/-1 outermost
		# contour, so a higher bar moves the flap rather than damping it. A two-threshold dead band would fix it,
		# but at MinBelievedDanger: 1 there is no room below for a release threshold, so a band would mean raising
		# ENTRY (a doctrine change, not a debounce). Hence damping on TIME. 750 ticks = ~45 s at the mod default
		# Timestep of 60 ms (16.67 ticks/s). Delays only LEAVING cover — entry is still answered on the next scan.
		MinGarrisonDwellTicks: 750
		# Phase 2 commit-on-order audit (§4): recruit only from the ledger-checked free pool and commit
		# garrisoned infantry (garrison:<buildingId>) to the shared PoiGoalGuard ledger. SHARED enable-ai-any
		# module, so the engine confines this to the @experimental player at runtime (explicit BotType gate);
		# Normal / legacy / @stable that share the instance are byte-identical (no ledger read, no commit).
		CommitGarrisonedUnits: true

	# Supply trucks follow the army to resupply in the field
	SupplyFollowerBotModule@supply:
		RequiresCondition: enable-ai-any
		SupplyTruckTypes: truk
		ScanInterval: 150
		MaxFollowDistance: 35
		# STARVATION LIFTS THE LEASH. Measured 2026-08-10 (test-supply-under-danger): a five-man platoon
		# at 37 cells, every man below the starving bar, was abandoned by a full 750-supply truck parked
		# 30 cells behind it — because 37 > 35. The truck considered nothing all match; the hunt leash
		# (20) could not reach it either, so the scan ended in a bare continue. The doctrine's first
		# sentence is that supplies reach the front ONE WAY OR ANOTHER, and a hard radius measured from
		# the truck is its exact opposite.
		#
		# 2 starving men rather than 1: one man low on ammo in an otherwise healthy squad is not a front
		# in trouble, and MinNearbyFriendlies is 4, so 2 is "half the squad is dry".
		# 80 cells is a SANITY BOUND, not a tuned value — it is past the long axis of every current map,
		# so in practice a starving cluster is always reachable; it exists so a future 200-cell map does
		# not send a truck on a five-minute drive.
		StarvingFollowMinUnits: 2
		StarvingMaxFollowDistance: 80
		MinNearbyFriendlies: 4
		# Stated explicitly (matches the engine default) because as of 2026-08-08 it governs THREE
		# deadbands, not one: the Stage-E detour waypoint, the evac leg-arrival test, and — new — the
		# plain follow Move. That last was the single most undamped movement site in the order-churn
		# census: a non-queued Move re-issued every scan at a destination derived from a MOVING cluster
		# centroid, so it necessarily differed every scan, cancelled the drive and restarted the path,
		# forever, on a unit whose entire job is to arrive. It was left that way only to preserve
		# byte-identity for @stable, a commitment retired by 875c93c1. Deliberately reuses this field
		# rather than adding a fourth threshold knob — the census's finding was that ~28
		# independently-invented dampers are themselves part of the disease.
		# NOTE this module is a SHARED enable-ai-any instance with no @stable twin, so the follow
		# deadband reaches @stable too; that is intended and declared, not silent drift. 0 disables it.
		RepathThresholdCells: 3
		# Influence stack Stage E: a truck relocating along the front detours via safer depth instead
		# of driving through the kill zone — the rear-lateral-re-enter path emerges from the danger
		# cost. Shared enable-ai-any module, so the reroute is gated on InfluenceStack.Participates.
		DangerFieldRouting: true
		# SURFACED 2026-08-09, previously running on the C# default. Now in DANGER UNITS (100 = one
		# reference contact at point-blank). Written here because the value moved and this module is
		# enable-ai-any, so the change reaches BOTH fog-respecting profiles — a default-only change would
		# have moved @stable with nothing in the YAML to show it.
		# Deliberately a quarter of EvacDangerUnits: a resupply convoy should route around exposure long
		# before the spot is hot enough to abandon.
		GroundDangerSafeUnits: 12
		# Supply logistics. NOTE ON SCOPE (corrected 2026-08-07): these are gated on
		# InfluenceStack.Participates, and since the 2026-08-02 @stable parity promotion (b8d2e601) that
		# predicate admits @stable as well as @experimental (InfluenceStack.cs:47-48). This block previously
		# claimed "@stable/Normal/Rush/Turtle stay byte-identical", which was true when it was written on
		# 2026-07-30 and stopped being true three days later. These three run on BOTH fog-respecting
		# profiles; only Normal/Rush/Turtle and legacy are byte-identical.
		#  - SectorSpread: several free trucks fan out to DISTINCT needy clusters instead of piling onto
		#    the one biggest blob; they only double up once trucks outnumber clusters.
		#  - SmallSquadCoverage: drop the servable-cluster floor to 2 so small squads get a truck once the
		#    big clusters are covered (the neediest-first order still fills big clusters first).
		#  - DangerEvac: a truck whose position (or its cluster) reads high believed ground danger pulls
		#    back toward its Supply Route instead of dying in the fire. Fog-legal (DangerFieldLayer only).
		SectorSpread: true
		SmallSquadCoverage: true
		SmallSquadMinNearbyFriendlies: 2
		# ===================================================================================================
		# DELIVERY BEATS SURVIVAL. Supply trucks ignore danger entirely (2026-08-13).
		#
		# USER-AUTHORISED, verbatim: "Even if we need to completely disable their danger awareness then that
		# is better than once again having them not work." The preceding sentence is the reason it was
		# offered: "I have told you now a hundred times that we need to solve this but every time you tell me
		# it is fixed and the results are more or less the same." So this is not a tuning preference and it is
		# not to be quietly walked back — the instinct to protect danger awareness for trucks is the thing
		# that has now sunk three attempts, and the permission above exists specifically to remove it.
		#
		# WHY ONE FLAG INSTEAD OF FLIPPING THE FOUR BELOW. "Disable danger awareness" is SEVEN sites in this
		# module and only six of them are reachable from YAML. FindSafeFollowPosition reads ThreatMapManager,
		# a DIFFERENT field from DangerFieldLayer, and no key here touches it — so a config-only attempt sets
		# the four danger flags, believes itself complete, and leaves the truck still being walked up to ~4
		# cells off its target every scan by a field that changes continuously. That is the shape of the
		# previous "fixed" reports. The engine switch makes a partial application inexpressible.
		#
		# THE MECHANISM THIS REMOVES — and read the correction below before quoting any earlier version of it.
		# The cluster danger gate ran at the RELEASE level (50-20 = 30 danger units) against live median cells
		# measured in the THOUSANDS of units, so on a contested front every needy cluster failed the gate and
		# selection fell through to the relief valve, which keeps only the LEAST-DANGEROUS needy cluster. That
		# is a real narrowing: the truck's target stops being "the platoon that needs supply most" and becomes
		# "the quietest platoon that needs any", which on a hot front is routinely a rear one — and a rear
		# cluster is both further away and not starving, so FollowLeashCellsFor gives it the SHORT leash
		# (MaxFollowDistance 35, not the starving 80) and WithinFollowLeash nulls it per truck. A truck with a
		# null cluster classifies errand=None, and None is exactly the state the evac branch collects.
		# So the path runs through the LEASH, and the danger gate is what forces selection onto the distant
		# quiet cluster in the first place.
		#
		# CORRECTION, recorded because this item has now produced four confident wrong diagnoses and the wrong
		# ones keep getting quoted forward: an earlier draft of this comment blamed SectorSpread for leaving
		# every truck but one unassigned once the valve collapsed the list to one cluster. THAT IS FALSE, and
		# the code says so — SupplyLogisticsMath.AssignSectors seeds `better` with `pick == NoSector`, so a
		# sector already claimed by an earlier truck is still selectable and trucks simply DOUBLE UP. NoSector
		# means "no sector within maxFollowLength", a DISTANCE condition, not a distinctness one. Nor can
		# SelectServableClusters ever hand back an empty needy set — the relief valve guarantees it, exactly as
		# DOCS/reference/supply-route.md states: "danger never empties the cluster list". Do not re-derive the
		# distinct-assignment story; it has been checked and it is wrong.
		#
		# WHAT THE TRUCK DOES NOW: drives to the drop anchor 5 cells short of the platoon, unloads its whole
		# 750 as a SUPPLYCACHE, and — now empty — is taken off the field by TRUK's own shipped
		# InitialResupplyBehaviorAI: Evacuate. Drive near, DROP, evacuate. That is the wanted behaviour
		# verbatim, and the evacuation half needed no work.
		#
		# SCOPE — DECLARED, NOT SILENT. This is a SHARED enable-ai-any instance with no @stable twin, so it
		# reaches @stable as well as @experimental. That is intended per CLAUDE.md (@stable inherits
		# improvements), and it means the next benchmark baseline must be re-taken knowingly. The C# default
		# is false, so nothing moves for a profile that does not set this key.
		#
		# THE COST, stated so it is not discovered later: trucks will die on hot fronts. That is the trade the
		# permission above buys, and a delivered crate the enemy has to shoot is worth more than a full truck
		# that shuttles all match. If trucks are dying WITHOUT delivering, this flag is the first thing to
		# walk back — not DeliveryIntentOverridesEvac, which is a narrower version of the same idea.
		#
		# AND HERE IS THE SPECIFIC WAY THAT COST ARRIVES, named rather than left to be discovered. NoDemand is
		# easy to hit: cluster selection needs only NeedScore > 0, which is ammoNeed x 1000, so four men at 95%
		# ammo score 200 with ZERO starving men — while the drop needs DropMinStarvingUnits (1) actually
		# starving within DropDemandRadiusCells of the anchor. A truck vetoed NoDemand falls through to the
		# follow path, and with the detour off that path now drives it in a straight line at the platoon
		# centroid. So the flag creates a route to dying WITHOUT delivering, which is exactly the walk-back
		# signal above. Watch for `drop-declined reason=NoDemand` immediately followed by truck losses; if that
		# is what a real match shows, the demand gate and the follow leash are the levers, not this flag.
		# ===================================================================================================
		IgnoreDangerForDelivery: true
		# The four keys below are now overridden by the flag above and are kept, unchanged, as the record of
		# what the principled version was. Item 40 (danger-scale rework) is the work that would let them mean
		# something again; until the danger UNIT is right, they gate on a scale that fires unconditionally.
		DangerEvac: true
		EvacDangerUnits: 50
		EvacRetreatCells: 12
		# Evac damper (2026-08-07). Without these the evac branch was a memoryless comparator sampled every
		# scan and the truck oscillated forward/back to the SR without ever delivering: the danger reading at
		# the destination does not fall when the truck retreats, and need-descending selection prefers exactly
		# the hot cluster the evac rule then refuses. The engine now gates SELECTION on the believed danger at
		# the cell the truck would actually be sent to, at the RELEASE level (50 - 20 = 30 units) — the same
		# number the truck must fall below to resume following, so no gap is left between "will go here" and
		# "will leave here". Gating at 50 while releasing at 30 would leave [30,49] as a latch, which is the
		# original bug one threshold lower. ENTERING an evac is never delayed by any of this.
		#
		# THESE ARE DANGER UNITS, NOT RAW FIELD UNITS (2026-08-09). 100 units = one reference contact at
		# point-blank, derived by DangerFieldLayer from the mod's own armament data. The previous values were
		# 60 and 15 RAW, and that was the bug the user saw as a truck lurching backwards every ~48 s: the
		# user's own play log measured the median raw reading at the moment of evac entry at 66,834, so a
		# threshold of 60 fired on the faintest believed contact anywhere in its envelope — including on
		# trucks standing on their own beachhead (three entered evac at exactly danger=68 within 4 cells of
		# their SR; one entered at 66,834 and left at 0 without moving). The old note here claimed the field
		# "steps by tens-to-hundreds per cell near a contact"; it steps by tens of thousands to millions, and
		# that wrong sentence is why an RA-scale constant survived the total conversion unexamined.
		# The deadband is consequently no longer inert: one cell of approach moves a contact's contribution by
		# ~1/(r+1) of its core (~9 units at r=10), so a 20-unit band spans several cells of travel. The dwell
		# and the leg model are still the primary dampers.
		# THESE VALUES ARE PROVISIONAL — DERIVED, NOT MEASURED, and they should be treated as a first
		# estimate until one play session confirms them. The only distribution ever measured for this field
		# (the 2026-08-09 log, median 66,834) was recorded BEFORE the weapon-cadence fix in the same branch,
		# when every heavy contact was stamping a clamped floor of 1 — so that sample described a field that
		# no longer exists and calibrating against it would have been fitting to corrupted data. What the 50
		# is derived from instead is the kernel geometry: the taper is linear over range/1024+2 cells, so a
		# contact whose envelope merely REACHES a cell contributes ~1/(r+1) of its core, and a decayed mobile
		# at MinConfidence 15 contributes 15% of that — the ambient tail sits far below half a reference
		# contact, while a real contact at close range sits far above it.
		# VERIFY, don't trust: `[danger] reference` (once per world, with the contributing-type count and the
		# min/max spread) and `[danger] dist` (min/median/max in BOTH raw and danger units) are unconditional,
		# so an ordinary session says whether 50 sits above the ambient median and below the peak near a real
		# contact. If the reference's min/max straddle it by more than ~2 orders, the median is a weak
		# reference and the UNIT wants revisiting — not these individual numbers.
		# Dwell 1: a 12-cell leg is ~164 ticks + acceleration against a 150-tick scan, so one held scan puts
		# the re-decision at the first boundary after the leg lands. Retreat DISTANCE is bounded separately
		# (one leg issued at a time), so the dwell does not need to cover the drive. 0 disables the dwell.
		EvacDwellScans: 1
		EvacReleaseHysteresisUnits: 20
		# TIER 2 idle-truck hunt: a truck the follow pass left unassigned (no cluster in range, or no
		# cluster at all) drives to the neediest STARVING soldier within HuntLeashCells instead of parking
		# until someone wanders into its aura. Tier 1 gave the soldier the legs (AutoSeekSupplies); this is
		# the truck closing the other half of the distance. Infantry-only by construction — the candidate
		# must carry the truck's own replenish-soldiers condition; vehicles pull from the Logistics Centre.
		# Bounded: no in-leash demand => no order => the truck stays put (no cross-map wandering).
		# NOTE this is a SHARED enable-ai-any instance and InfluenceStack.Participates admits @stable since
		# the 0802 promotion (see the note in the Stable block below), so the flag ALONE would not keep this
		# off the @stable player — the engine adds an explicit @experimental BotType gate. @stable / Normal
		# / legacy take the identical old path.
		IdleTruckHunt: true
		HuntStarvingThresholdPerMille: 250
		HuntLeashCells: 20
		HuntNeedBandPerMille: 100
		# DROP-AND-LEAVE (2026-08-08). A loaded truck drives ONCE to a forward supply point behind the
		# believed frontier, unloads its whole 750 as a SUPPLYCACHE, and leaves; infantry walk to the crate.
		# This is an ADDED mode — a truck that does not meet the drop conditions follows exactly as before.
		#
		# WHY, rather than more damping. The 2026-08-07 four-commit fix closed every latch and the truck
		# still visibly dithered, because approach -> abort -> approach is a limit cycle BY CONSTRUCTION:
		# the relief valve re-selects the same needy cluster the moment the truck cools (period ~5 scans /
		# ~30 s, amplitude ~23 cells). The pull side has the MIRROR defect — AutoSeekSupplies applies its
		# 20-cell leash at SELECTION only and then rides an actor-tracking MoveWithinRange, so infantry at
		# speed 25 chase a truck at 75 and lose ~7.3 cells per scan while combat-inert. Both are the same
		# shape and both dissolve against a destination that DOES NOT MOVE. Damping bounds an excursion; a
		# static destination removes it. It is also why the two reported symptoms are one mechanism: the
		# truck leaving its own aura is precisely what flips a replenishing soldier back to approaching.
		#
		# SCOPE: the engine double-gates on InfluenceStack.Participates, because the anchor is walked down
		# ControlField's frontier-distance field and that field exists only for participating players. So
		# this reaches BOTH fog-respecting profiles (@experimental AND @stable) — deliberately, since the
		# limit cycle it removes ships to both. Normal/Rush/Turtle and legacy keep a flat field, the descent
		# returns the Supply Route unchanged, no anchor is established, and the mode is inert — byte-identical
		# without needing a second gate.
		DropAndLeave: true
		# Standoff is the risk lever, and the risk is intentional: SUPPLYCACHE is ProximityCapturable by
		# Player/Vehicle/Tank/Infantry and is shot at unaided, so a point too far forward gifts the enemy a
		# resupply node. 8 COARSE control-grid cells = 16 map cells at CellSize 2 — further back than
		# PoiOffensiveBotModule's StagingStandoffCells: 6 (a supply dump stands off further than a rifle
		# squad), and inside AutoSeekSupplies' 20-cell selection leash, or the soldiers it exists for could
		# never pick it. The danger threshold matches the offense module's on purpose: same primitive, same
		# job, and the STANDOFF is what makes this point safer, not a different danger number.
		DropStandoffCells: 8
		# ...and 8 is a REQUEST, not a guarantee. A standoff is a distance behind the front, so a front that is
		# already closer to the beachhead than 8 leaves nowhere to stand off into, and the descent's answer to
		# that was to return no anchor at all — the fallback failing totally in exactly the geometry where
		# resupply matters most, because the fighting is at the door.
		#
		# Measured 2026-08-10, in the same match where the cluster anchor above was verified working:
		#   anchor sr=6,16  → <none> (descent stalled at the SR ...) frontier-at-sr=5     [twice, one bot]
		#   anchor sr=58,16 → 23,17 standoff=8 frontier=8                                 [the other bot]
		# Same map, same scan, same standoff. The only difference is how much ground each player held.
		#
		# On, the descent asks for the tightest ring strictly forward of the SR instead, takes one step and
		# stops on the beachhead's doorstep. This is a DEGRADATION of the standoff, not of the delivery. It
		# cannot disturb a descent that already resolves — the clamp only bites on the exact input that returns
		# the start today — and a flat field still yields no anchor, so the mode still self-disables where it
		# should. @stable takes this too, deliberately: it is the same fallback with the same hole.
		DropClampStandoff: true
		DropDangerSafeUnits: 10
		DropMaxDescentSteps: 64
		# ANCHOR THE CRATE TO THE PLATOON, not to the beachhead. The settings above describe the SR descent,
		# which is now the FALLBACK — reached when this truck has no cluster selected.
		#
		# "NO CLUSTER" IS NOT "NO DEMAND", and the earlier note here said it was. Demand is counted around the
		# ANCHOR (DropDemandRadiusCells, individual starving men, no grouping requirement); a CLUSTER needs
		# SmallSquadMinNearbyFriendlies men inside 10 cells of each other, needs AmmoNeed > 0, and must sit
		# inside this truck's follow leash and win a SectorSpread assignment. So the fallback's live cases are
		# a surplus truck the spread left unassigned, a lone starving man below the cluster floor, and a needy
		# cluster outside the leash — all real, none of them "nobody needs anything". What it is NOT for is a
		# front too hot to approach: SelectServableClusters' relief valve always keeps the least-dangerous
		# needy cluster selectable, so danger never empties the cluster list.
		#
		# Measured 2026-08-10: the descent produced `anchor sr=4,16 → <none> (descent stalled at the SR)`
		# on every scan of every run, with frontier-at-sr reading 4 against DropStandoffCells: 8, so
		# ForwardStagingMath.StagingCell's `frontierAt(start) <= standoff` early-out returned the start
		# unchanged and ResolveDropAnchor read that as "no anchor". Drop-and-leave has been enabled since
		# 2026-08-08 and had never once been reachable. That is a TOTAL failure whenever the believed
		# frontier is inside the standoff of the SR — which is the normal case for a player who holds
		# little ground, not a corner case.
		#
		# 5 cells matches the doctrine's own number ("stop a bit early... like 5 cells behind the units in
		# need, and the soldiers can themselves go to the supply crate"), and sits far inside
		# AutoSeekSupplies' 20-cell selection leash so the men can actually select the crate.
		DropAnchorAtCluster: true
		DropShortCells: 5
		# FULL COMMITMENT — "they drive in fast, drop the supplies, and drive back out." A truck with a
		# drop in flight does not evacuate; evac becomes the egress leg instead of a rival branch.
		#
		# Measured 2026-08-10, with the cluster anchor above already working: anchor at x=33, evac
		# entering at x=29-30 on danger 308,180 then 462,272 against a bar of 1,706, retreating to
		# x=17-18, releasing at danger ~15, driving east and re-entering — the supply-truck oscillation,
		# caught with numbers. The crate was never placed and the platoon walked ten cells rearward to
		# fetch supply from the oscillating truck instead. A truck can never reach a drop point beyond
		# the cell where evac fires, so this is a correctness fix, not a tuning preference.
		#
		# This costs trucks and is meant to. A truck lost mid-run releases its claim and its dispatch
		# record in the ordinary scan cleanup, so the next truck re-derives the anchor and takes over.
		DropCommitmentOverridesEvac: true
		# DELIVERY INTENT OUTRANKS EVAC — the half commitment could not reach, and the gap was total.
		# DropCommitmentOverridesEvac protects a drop ALREADY IN FLIGHT. A truck that has not been
		# dispatched yet is still fair game for evac, so evac out-ranked STARTING a delivery while losing
		# only to one under way — and a delivery that can never start never happens.
		#
		# Measured in the user's own 30-minute match, 2026-08-10, on the build that shipped commitment:
		#   [supply] adopt      truck=4802@6,46 supply=750
		#   [supply] evac-enter truck=4802@20,43 danger=17773 dest-danger=3 gated=True threshold=1706
		#   [supply] evac-leg   truck=4802@15,46 danger=16 held=1→0 scans=2
		#   [supply] evac-exit  truck=4802@13,46 danger=9
		# A full truck drove out to x=20, hit 17,773 against a bar of 1,706, fell back to x=13, released,
		# and repeated all game. No crate was ever placed. Both supply scenarios were green throughout:
		# there the truck committed early enough that this window never opened, so the scenarios were
		# right and insufficient.
		#
		# A truck on an errand now holds its course; a truck with NOTHING to deliver — empty, or with no
		# reachable customer — still evacuates exactly as before. That was always evac's real job.
		#
		# This costs trucks, and more than commitment alone, because it commits them on the APPROACH
		# rather than on the run-in. That is the accepted price of "full commitment"; walk it back here
		# first if trucks are dying without delivering.
		DeliveryIntentOverridesEvac: true
		# DANGER PICKS THE MODE, it never picks whether to go. Dangerous front => stop at the standoff,
		# dump everything, egress. Quiet front => drive up, serve from the aura, KEEP the remainder for
		# the next customer — the doctrine's own wording, "resupply them directly and not unload, if
		# more resupplying is needed elsewhere".
		#
		# Required, not optional: danger never entered the drop decision, which was harmless only while
		# the anchor never resolved. With the anchor fixed the drop fired everywhere, and a crate was
		# measured landing at 39,16 on a front with no believed enemy at all — 750 supply stranded in an
		# empty field and a truck retired with customers still waiting.
		#
		# The bar is RELATIVE to this player's own median stamped cell because the absolute alternative
		# is measurably broken: the live median differs 3.4x between the two players of one match on one
		# map, and 17 of 18 ground thresholds sit 8x-459x below it. The floor is what stops a relative
		# rule reading a quiet opening as dangerous — with an empty field there is no scale to be
		# relative to, and 25 units is "nothing meaningful is believed to cover this cell".
		# TWO LIMBS, because a ratio fails at BOTH ends and the floor only covers one of them. Measured
		# 2026-08-10: a cluster cell at 462,272 raw (13,548 danger units, ~135 reference contacts) was
		# classified SAFE by the relative test alone, because two believed 40-cell artillery envelopes
		# bathed the map and dragged the player's own median above the cluster. When everything is
		# dangerous, nothing is relatively dangerous.
		#
		# 200 units = twice one median enemy unit's core intensity on the cell = 6,824 raw at the
		# measured reference, just under one believed ATGM infantryman at point-blank (222 units) — the
		# cheapest reliable truck-killer in the ruleset. Every anchor around it is measured: 170x the
		# ambient territory baseline (~1 unit), 8x the safe floor, and 4x BELOW the lower live median
		# (818 vs 2,755 units), so it fires on a real contested front rather than only on an extreme.
		DropRequiresDanger: true
		DropDangerFloorUnits: 25
		DropDangerMedianPercent: 100
		# 200 -> 100 (2026-08-10). 100 units is the definition of the unit itself: ONE reference contact at
		# point-blank. So the limb now reads "at least one believed enemy meaningfully covers this cell"
		# rather than "at least one credible truck-killer does". Deliberately over-eager per the standing
		# instruction to overcompensate: on a contested front the drop mode should be the normal answer,
		# not the extreme one. The safe branch is unaffected and that is checked, not assumed — the FLOOR
		# is what protects it, is evaluated first, and can only ever declare SAFE, so a front with no
		# believed enemy (danger 0 < 25 units) still serves in place and keeps its cargo. Ambient
		# territory baseline is ~1 unit, so this still clears deep-rear noise by 100x.
		DropDangerAbsoluteUnits: 100
		# The anchor is re-derived every scan from a field rebuilt every 25 ticks. Without hysteresis a
		# one-cell belief wobble would move the destination — and a destination that moves is the entire
		# defect this mode exists to remove.
		DropAnchorHysteresisCells: 3
		# Demand radius sized to HuntLeashCells / AutoSeekSupplies' SupplyHuntLeashCells: a soldier further
		# from the crate than his own selection leash cannot pick it, so counting him as demand would drop a
		# crate nobody walks to. The margin keeps that promise honest — the crate lands up to the errand's
		# 2-cell stop tolerance off the anchor, so demand is counted at 18 while crates that already cover
		# the demand are searched for at the full 20 (strict about demand, generous about coverage).
		DropDemandRadiusCells: 20
		DropDemandMarginCells: 2
		# THE TWO DEMAND GATES ARE DELIBERATELY LOOSE (2026-08-10). The user has never once seen a crate in
		# a real match, so the standing instruction is to overcompensate and tune back, not to inch. The
		# reading these now express is the minimum the doctrine actually needs: CARGO PRESENT, CUSTOMERS
		# NEARBY. Anti-stacking is NOT relaxed with them — DropRedundantCacheSupply below still does that
		# whole job, so loosening here cannot produce a pile of crates, only an earlier first one.
		#
		# 3 -> 1 starving men. Protected against spending 750 supply on a single soldier. Real clusters at
		# the front are routinely two or three men after contact, and the crate is not consumed by one
		# man — it sits with a 4-cell aura and serves whoever walks in, so "wasted on one" overstates it.
		DropMinStarvingUnits: 1
		# 250 -> 100 stock. Protected against littering dribble crates that self-remove at the cache's
		# RemoveBelowSupply. Largely redundant already: IsLowOnSupply drops a truck below its own
		# RestockThreshold from the roster before this is ever read, so this gate only ever bit trucks
		# that had already served several platoons from the aura. Note this number ALSO defines "holds
		# cargo" for DeliveryIntentOverridesEvac above — deliberately one number, since the load worth a
		# drop is the load worth defending an approach for.
		DropMinSupply: 100
		# This gate does the ENTIRE anti-stacking job, and counts supply already committed by other trucks as
		# well as supply on the ground. Both halves are load-bearing. SUPPLYCACHE is a Building with
		# Footprint: x — a BLOCKED cell — so a truck can never stand on a cache and DropSupplyCacheHere's
		# merge branch is unreachable: nothing coalesces crates. And trucks are evaluated against unchanged
		# world state in one loop, so without the in-flight term all four would pass on the same scan and
		# unload 3000 at one cell, then be retired empty.
		DropRedundantCacheSupply: 100
		# Instrumentation. The EDGE lines — module init, truck adopt/release, evac enter/exit, drop issued /
		# revoked, and an impassable anchor — are logged unconditionally and are the valuable half; they are
		# what a live session needs to answer how often the frontier descent lands on unreachable ground,
		# which is this mode's main open question. This flag adds the per-SCAN levels (scan summary, anchor
		# descent, per-cluster readings, the reason a drop was declined) and is OFF: RELEASE mode runs on a
		# player's machine and should not carry 1-2k lines per match per AI. Turn on for an observation run.
		#
		# WHAT IS NO LONGER BEHIND IT (2026-08-10): the reason a drop was DECLINED. The user played a full
		# match, saw no crate, and the log could not say whether none was dropped or whether the drop path
		# simply never logged — `[supply] drop` only fires on success, so both cases were the same silence.
		# The evac lines were unconditional and were the only reason the real defect was diagnosable at
		# all. `drop-declined` now logs on every reason CHANGE plus a roll-up, and DropsSupplyCache logs
		# `crate-placed` / `crate-refused` so a normal match always states whether a crate reached the
		# ground.
		DebugLogging: false
		DropDeclineRollupScans: 10
		# Roll-up interval for the one unconditional line that can repeat: a frontier descent that keeps
		# landing on unreachable ground. First rejection and recovery are always logged, so each episode is
		# bounded exactly; this caps the middle at ~1 line/min/player instead of ~10 while still carrying the
		# consecutive count. NOT a flat dedup — the frequency of bad descents is the measurement.
		AnchorRejectRollupScans: 10

	# Adaptive production — counter enemy composition.
	# Experimental halves EvaluationInterval to 300 (counter-build twice as fast against
	# scouted enemy comp). First Experimental-AI experiment (260512), measured via the
	# tournament harness mirror-paired batch. NOTE (b8d2e601, 2026-08-02): the twin in the Stable block
	# below is no longer frozen — it carries the same EvaluationInterval 300 (:2009, :2028).
	AdaptiveProductionBotModule@experimental.america:
		RequiresCondition: enable-ai-experimental && player.nato
		EvaluationInterval: 300
		MaxRequestsPerCycle: 2
		AntiVehicleUnits: at.america, abrams, bradley
		AntiInfantryUnits: e3.america, ar.america, humvee
		AntiAirUnits: aa.america, strykershorad
		MinEnemySightings: 3
		# Phase 4b: filter each counter pool by UnitRoleResolver class (anti-air->ShortRangeAD,
		# anti-vehicle->MainBattle/IndirectFire, anti-infantry->+Recon) before drawing. No new RNG draws;
		# every unit above already classifies into its pool today.
		# NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1979, :1998) — not experimental-only.
		UseUnitRoles: true
		# SR-DEFENSE: classify believed enemy contacts near our own Supply Route(s) by attacker class and
		# call in the MATCHED counter, BYPASSING MinEnemySightings. Armor -> AntiVehicleUnits (cheapest
		# first: at.america -> bradley -> abrams), air -> AntiAirUnits (aa.america/strykershorad), infantry
		# -> AntiInfantryUnits. Reads the fog-legal belief store (actor identity, not a scalar danger read),
		# so a helicopter draws AA not AT, and a lone scout never draws a counter. Per-class thresholds are
		# on the unit-cost scale. Deterministic; reserves <=1 request/cycle.
		# NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1980, :1999) — not experimental-only.
		SupplyRouteDefenseEnabled: true
		SupplyRouteScanRadius: 10
		SupplyRouteArmorValueThreshold: 1200
		SupplyRouteAirValueThreshold: 1000
		SupplyRouteInfantryValueThreshold: 1000
		# Routing fix: deliver counter-buys to the first ENABLED UnitBuilder twin. On @experimental NATO
		# unitProducers[0] is @russia.fixedwing (disabled: player.brics false) whose BotTick never runs, so
		# every counter-buy was silently lost and the alreadyRequested>=2 gate wedged re-issue. Default false
		# on the engine class. NOTE (b8d2e601, 2026-08-02): @stable.america no longer omits this — it sets
		# it at :1985, so no live profile keeps the unitProducers[0] routing and the byte-identity claim is
		# dead. Same seam McvManager/Harvester already use (Exts.FirstEnabledTraitOrDefault).
		RouteToEnabledProducer: true
		# COMPOSITION-NEED: buy what the BELIEVED battlefield needs most (fog-legal belief store). Heavy believed
		# armor/infantry/air raise the matching counter; a WEAK believed enemy AA posture opens an air-strike
		# window that raises AirStrikeUnits (Apache heli / A-10). Highest-scoring AFFORDABLE class wins, <=1
		# request/cycle, BYPASSES MinEnemySightings. Off on the frozen @stable twin (byte-identical).
		# Weights are on the unit-cost/believed-value scale; NeedBudgetReservePct is the rarity dial for the
		# $6000 airframes (need 2x = $12000 banked). All are tunables — starting values, benchmark-tunable.
		CompositionNeedEnabled: true
		AirStrikeUnits: heli, a10
		AntiArmorNeedWeight: 100
		AntiInfantryNeedWeight: 100
		AntiAirNeedWeight: 100
		AirStrikeNeedWeight: 100
		AaWeakThreshold: 2000
		NeedBudgetReservePct: 200

	AdaptiveProductionBotModule@experimental.russia:
		RequiresCondition: enable-ai-experimental && player.brics
		EvaluationInterval: 300
		MaxRequestsPerCycle: 2
		AntiVehicleUnits: at.russia, t90, bmp2
		AntiInfantryUnits: e3.russia, ar.russia, btr
		AntiAirUnits: aa.russia, tunguska
		MinEnemySightings: 3
		# Phase 4b: filter each counter pool by UnitRoleResolver class (anti-air->ShortRangeAD,
		# anti-vehicle->MainBattle/IndirectFire, anti-infantry->+Recon) before drawing. No new RNG draws;
		# every unit above already classifies into its pool today.
		# NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1979, :1998) — not experimental-only.
		UseUnitRoles: true
		# SR-DEFENSE: classify believed enemy contacts near our own Supply Route(s) by attacker class and
		# call in the MATCHED counter, BYPASSING MinEnemySightings. Armor -> AntiVehicleUnits (cheapest
		# first: at.russia -> bmp2 (ATGM) -> t90), air -> AntiAirUnits (aa.russia/tunguska), infantry ->
		# AntiInfantryUnits. Reads the fog-legal belief store (actor identity, not a scalar danger read),
		# so a helicopter draws AA (tunguska, correctly) not AT, and a lone scout never draws a counter.
		# Per-class thresholds are on the unit-cost scale. Deterministic; reserves <=1 request/cycle.
		# NOTE (b8d2e601, 2026-08-02): @stable sets this too (:1999) — not experimental-only.
		SupplyRouteDefenseEnabled: true
		SupplyRouteScanRadius: 10
		SupplyRouteArmorValueThreshold: 1200
		SupplyRouteAirValueThreshold: 1000
		SupplyRouteInfantryValueThreshold: 1000
		# Routing fix: deliver counter-buys to the first ENABLED UnitBuilder twin. On @experimental NATO
		# unitProducers[0] is @russia.fixedwing (disabled: player.brics false) whose BotTick never runs, so
		# every counter-buy was silently lost and the alreadyRequested>=2 gate wedged re-issue. Default false
		# on the engine class. NOTE (b8d2e601, 2026-08-02): @stable.russia no longer omits this — it sets
		# it at :2004, so no live profile keeps the unitProducers[0] routing and the byte-identity claim is
		# dead. Same seam McvManager/Harvester already use (Exts.FirstEnabledTraitOrDefault).
		RouteToEnabledProducer: true
		# COMPOSITION-NEED (mirror of the NATO block above): weak believed enemy AA opens an air-strike window
		# for the MI-28 attack heli / Su-25 (frog). Off on the frozen @stable twin (byte-identical). Tunable.
		CompositionNeedEnabled: true
		AirStrikeUnits: mi28, frog
		AntiArmorNeedWeight: 100
		AntiInfantryNeedWeight: 100
		AntiAirNeedWeight: 100
		AirStrikeNeedWeight: 100
		AaWeakThreshold: 2000
		NeedBudgetReservePct: 200

	# experimental doctrine — Stage B.1: layered defence placement, reserve-driven.
	#
	# Only RESERVES get re-tasked — units within OnLineRadiusCells of any
	# contested cell are "on the engagement line" and stay put. Reserves
	# fill the line by score: prefer slots where our line is thin AND the
	# enemy is weak. Emergent behaviour:
	#   - even distribution along the frontline
	#   - flanking toward enemy weak points (low-enemy-density slots)
	#
	#   SCREEN     — light infantry, sit AT the contested edge (sparse).
	#   MAIN LINE  — heavy infantry + vehicles + ATGM/artillery + AA,
	#                positioned MainLineStandoffCells behind, toward own SR.
	#
	# B.2 will add treeline/garrison preference for the screen;
	# B.3 will add overlapping-fields-of-fire check for the main line.
	# See WORKSPACE/ai/stage_b_layered_defence.md.
	LayeredDefenceBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ScanInterval: 75
		AssignCooldownTicks: 250
		MainLineStandoffCells: 8
		OnLineRadiusCells: 8
		FriendlyGapWeight: 2
		EnemyWeaknessWeight: 1
		MaxAssignsPerScan: 6
		# Mission-commitment interop: honour the shared PoiGoalGuard ledger before pulling a reserve onto
		# the line. Without this, LayeredDefence is a ledger-blind second writer — it yanks a briefly-idle
		# offense/capture/garrison unit back to a line slot and offense re-grabs it next eval (the live-play
		# forward/back loop). Default OFF on the engine class => @stable twin (which omits this field) stays
		# byte-identical; only this @experimental instance cooperates with the shared claim.
		RespectCommitmentLedger: true
		# Phase 2 commit-on-order audit (§4): also WRITE line assignments to the ledger (defend-line:<cell>),
		# not just read it. Closes the reverse steal channel (N6) — offense's BuildFreePool now defers to a
		# committed line unit for the assignment-cooldown window. Default OFF on the @stable twin = byte-identical.
		CommitLineAssignments: true
		# Phase 4: classify line eligibility by UnitRoleResolver instead of the lists below. Only
		# role==MainBattle (minus cargo carriers) holds the line — artillery/SHORAD/MANPADS drop out
		# by class, curing the :349 defect. ScreenUnitTypes still partitions screen vs main-line; the
		# MainLineUnitTypes/ExcludedActorTypes lists become inert. NOTE (b8d2e601, 2026-08-02): @stable
		# sets UseUnitRoles too (:2056), so those lists (:2058-2059) are inert on BOTH twins.
		UseUnitRoles: true
		# The ammo term in tasking — see PoiOffensiveBotModule@experimental for the full rationale. This is the
		# DISPERSAL half of the 2026-08-10 defect: SkipOutOfAmmoUnits above is an empty test, so a platoon at
		# 10% was still being spread across contested cells and avenue crossings, going from a 1-cell clump to
		# a 9-cell one while a truck was en route to its centroid. Default 0 (off) on the engine class => the
		# frozen @stable twin is byte-identical.
		StarvingRecruitThresholdPerMille: 250
		# PHASE 5 (frontline-influence) — MAN-THE-LINE avenue allocation. Instead of clustering reserves only on the
		# lowest-density contested InfluenceMap cells, spread them across the enumerated frontline AVENUES (the
		# ControlField Phase-4 crossing→sector map): every avenue whose sector carries a meaningful believed threat
		# (enemy strength >= 1) gets a picket where the budget allows, surplus on the outnumbered avenues. Falls
		# back to the contested-cell path when the profile isn't built / no avenue carries threat, so the module is
		# never idle. Opts this player into the frontline profile. Default OFF on the shared engine class ⇒ the
		# @stable twin (which omits these fields) stays byte-identical. Respects + writes the same ledger as above.
		ManTheLineEnabled: true
		ManTheLineMinThreat: 1
		ScreenUnitTypes: e3.america, e3.russia, ar.america, ar.russia, at.america, at.russia, sn.america, sn.russia, tl.america, tl.russia, medi.america, medi.russia
		# bradley / bmp2 / m113 deliberately ABSENT — they're owned by
		# MountedTransportBotModule@poi below (Stage B.4).
		MainLineUnitTypes: e2.america, e2.russia, mt.america, mt.russia, aa.america, aa.russia, e4.america, e4.russia, abrams, t90, m109, paladin, grad, tos, m270, strykershorad, tunguska
		ExcludedActorTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, humvee, btr, bradley, bmp2, m113

	# PHASE 6 (frontline-influence) — ENGINEER ROUTE-OPENING. When the Phase-4 frontline strength profile
	# says the enemy line is thinnest in a sector whose avenue is a REPAIRABLE destroyed bridge (CrossingMap
	# crossing Status == Repairable), send an engineer (e6, RepairsBridges) to the bridge hut with the
	# RepairBridge order and a small combat screen to open a NEW land axis. On repair the module releases its
	# commitments and lets the now-INTACT avenue be picked up by the Phase-5 man-the-line / weakest-point
	# machinery above (no separate attack path). Every dispatched unit is staked in the shared PoiGoalGuard
	# ledger (engineer bridge-repair:<hutId>, screen bridge-screen:<hutId>) so the offense pool can't poach
	# it mid-mission. Failure modes are all bounded: engineer dies en route ⇒ per-hut cooldown + bounded
	# retry; hut gone ⇒ abandon; bridge already repaired on arrival ⇒ success; timeout ⇒ cooldown + re-attempt.
	# Opts this player into the ControlField frontline profile (per-player recipe, never a world global).
	# Default OFF on the engine class (RouteOpenEnabled) + declared ONLY here ⇒ @stable / normal / human never
	# instantiate it and it is inert regardless ⇒ byte-identical. Pure RouteOpenMath (NUnit-pinned), zero RNG.
	EngineerRouteOpenBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		RouteOpenEnabled: true
		ScanInterval: 100
		MissionTimeoutTicks: 1500
		RetryCooldownTicks: 900
		MaxAttemptsPerHut: 3
		ScreenSize: 3
		# The ammo term in tasking — see PoiOffensiveBotModule@experimental. The screen walks to a crossing and
		# holds it under fire; a dry man does neither. Default 0 (off) on the engine class.
		StarvingRecruitThresholdPerMille: 250
		ScreenStandoffCells: 3
		CommitTtlTicks: 400
		ExcludedActorTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, humvee, btr, bradley, bmp2, m113

	# experimental doctrine — Stage B.4: mounted infantry transport.
	#
	# IFVs/APCs pick up infantry from the reserve zone (near own SR), drive
	# them to the thinnest spot on the frontline, drop off, return for the
	# next load. Per-carrier state machine: Loading → Delivering → Unloading
	# → Returning. Carriers excluded from LayeredDefence above so the two
	# modules don't fight over the same vehicles.
	#
	# Spec: WORKSPACE/ai/stage_b4_mounted_transport.md.
	#
	# NOW SPLIT into @poi (enable-ai-stable) + @experimental twins (was a shared singleton).
	# The split originally let TECN-first ferrying + pre-contact delivery land experimental-only.
	# NOTE (b8d2e601, 2026-08-02): the @poi twin is no longer frozen — it sets DeliverBeforeContact /
	# UnloadOnArrival / PickupCorridorCells / BelievedDangerStandoff below, so @stable is NOT
	# byte-identical here. Consumers (LayeredDefenceBotModule, CaptureCoordinatorBotModule)
	# resolve the ENABLED instance via TraitsImplementing<>().FirstOrDefault(m => !m.IsTraitDisabled)
	# — TraitOrDefault would throw now that two instances exist on the player actor. The
	# `enable-ai-stable` / `enable-ai-experimental` guards keep exactly one enabled per player
	# (a bot is never both). Mirrors the HelicopterSquadBotModule split (commit cf7f826b).
	MountedTransportBotModule@poi:
		RequiresCondition: enable-ai-stable
		# 2026-09-02 promotion — full @experimental parity. Fields below are a verbatim copy of the
		# @experimental twin's values at this ref; see that block for per-flag rationale.
		ScanInterval: 50
		CarrierTypes: bradley, bmp2, m113
		PassengerTypes: e3.america, e3.russia, ar.america, ar.russia, at.america, at.russia, sn.america, sn.russia, tl.america, tl.russia, medi.america, medi.russia, e2.america, e2.russia, mt.america, mt.russia, aa.america, aa.russia, e4.america, e4.russia
		MinPassengersPerLoad: 2
		MaxPassengersPerLoad: 5
		ReserveZoneRadiusCells: 14
		LoadingTimeoutTicks: 1500
		DropOffArrivalRadius: 3
		ReturnArrivalRadius: 5
		DeliverBeforeContact: true
		PreContactStagingPct: 50
		UnloadOnArrival: true
		PickupCorridorCells: 6
		BelievedDangerStandoff: true
		StandoffDangerUnits: 10
		StandoffMarginCells: 2
		StandoffMaxBackoffCells: 20
		CommitPassengers: true
		FillBeforeDeparture: true
		BoardingStallTicks: 250
		CaptureFerryEscortSeats: 3
		TopUpDuringLoading: true
		RendezvousWithOffensiveStaging: false

	# Experimental twin. NOTE (b8d2e601, 2026-08-02): neither behaviour below is experimental-only any
	# more — the @poi (stable) twin above was promoted to the same config. Both are default-frozen on
	# the C# class; both live twins now opt in:
	#   * DeliverBeforeContact: deliver toward a forward staging cell (top PoiMap offensive
	#     target) when no frontline exists yet, instead of piling carriers at the SR. @poi sets it
	#     too (:1383).
	#   * TECN-first capture ferrying is triggered by a CaptureCoordinatorBotModule .tecn twin
	#     calling TryReserveCaptureFerry on the ENABLED transport instance (no YAML field needed —
	#     it's a directed call path). @stable.tecn opts in via UseTransportForDistantCaptures
	#     (:1893), so the @poi twin receives ferry requests too.
	MountedTransportBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ScanInterval: 50
		CarrierTypes: bradley, bmp2, m113
		PassengerTypes: e3.america, e3.russia, ar.america, ar.russia, at.america, at.russia, sn.america, sn.russia, tl.america, tl.russia, medi.america, medi.russia, e2.america, e2.russia, mt.america, mt.russia, aa.america, aa.russia, e4.america, e4.russia
		MinPassengersPerLoad: 2
		MaxPassengersPerLoad: 5
		ReserveZoneRadiusCells: 14
		LoadingTimeoutTicks: 1500
		DropOffArrivalRadius: 3
		ReturnArrivalRadius: 5
		DeliverBeforeContact: true
		PreContactStagingPct: 50
		# Issue the engine-correct "Unload" order so carriers actually disembark passengers
		# (the shared C# default keeps the broken "UnloadCargo" no-op). NOTE (b8d2e601, 2026-08-02):
		# the @poi (stable) twin sets it too (:1385), so both live twins issue the correct order.
		UnloadOnArrival: true
		# Pickup corridor: also grab PassengerTypes infantry walking the SR→drop lane (within 6 cells of
		# it), not just the 14-cell reserve bubble — fresh infantry that transits the bubble between 50-tick
		# scans would otherwise walk the whole map. Default 0 (off) on the engine class. NOTE (b8d2e601,
		# 2026-08-02): the @poi (stable) twin sets 6 too (:1386), so it is not experimental-only.
		PickupCorridorCells: 6
		# Fog-legal vision-aware drop: back the drop cell off toward our SR until the BELIEVED anti-ground
		# danger (DangerFieldLayer, from the BeliefStore — no enemy world scan) clears, plus a 2-cell buffer.
		# Drops infantry just OUTSIDE believed enemy sight/danger instead of into a hot omniscient cell.
		BelievedDangerStandoff: true
		StandoffDangerUnits: 10
		StandoffMarginCells: 2
		StandoffMaxBackoffCells: 20
		# Phase 2 commit-on-order audit (§4): commit boarding passengers to the shared PoiGoalGuard ledger
		# (transport:<carrierId>), released on unload. Replaces the bespoke IsPassengerReserved seam as the
		# cross-module lock — offense's BuildFreePool already excludes ledger-committed units, so it no longer
		# yanks infantry mid-board. NOTE (2026-08-15): the @poi (stable) twin sets this too now — the
		# fill-before-departure lever below is unworkable without it, so the "default OFF on @poi =
		# byte-identical" claim is dead.
		CommitPassengers: true
		# 2026-08-15 transport loading — see the @poi twin for the rationale. Wait for the seats actually
		# ordered rather than the bare minimum, with two independent time bounds so a carrier can never hang
		# on a passenger that is not coming; and spend the capture ferry's otherwise-empty seats on escort.
		FillBeforeDeparture: true
		BoardingStallTicks: 250
		CaptureFerryEscortSeats: 3
		# 2026-08-15 half-empty departures — the user's original complaint. A load is fixed at whatever the
		# arbitration gate admitted on the ONE tick the task was born; measured baseline on this scenario
		# (run 260815_191433, seed 1017) departed with 1, 2 and 2 of 5 seats. Re-offer to the free pool each
		# scan while loading. Cannot postpone departure: the departure math counts the original cohort only.
		# Default false on the engine class and NOT set on the @poi twin ⇒ @stable is unchanged.
		TopUpDuringLoading: true
		# COMBINED ARMS, the other half of PoiOffensiveBotModule.TransportStandoffEnabled — and it STAYS OFF,
		# on a measurement rather than on caution. Enabled once (run 260815_202509, seed 1017,
		# wip-transport-delivers) it moved the drop cell from lerp=32,10 to anchor=7,17 — ONE CELL from the
		# Supply Route at 6,16 — and the carrier then looped: load 5, drive one cell, unload, reload, four
		# times. It replaced a 26-cell forward delivery with a shuttle in place.
		#
		# The cause was a MISSING LOWER BOUND, not a tuning value. RendezvousMath.AnchorAcceptable tested only
		# `anchorReach <= fallbackReach + margin`, so it rejected an anchor too far FORWARD and accepted
		# without limit one BEHIND the cell the transport would have chosen. Whenever the reserve is mustering
		# near the SR — which is every pre-contact opening, since the frontier descent has nothing to descend
		# toward — the anchor is behind the lerp and the rendezvous dragged the delivery backwards.
		#
		# 2026-08-19: THE LOWER BOUND NOW EXISTS. AnchorAcceptable is two-sided (RendezvousMaxWithdrawCells,
		# default 6), NUnit-pinned on the measured 6,16 / 7,17 / 32,10 geometry that produced the shuttle.
		# It STILL STAYS OFF here: the bound removes the known blocker, it does not demonstrate the feature
		# helps. Flipping it is a behavioural change to @experimental and needs its own measured run — the
		# scenario to beat is the one that produced the loop above. Until that run exists this line is what
		# keeps both profiles byte-identical on this path.
		RendezvousWithOffensiveStaging: false

	# ===== Base Builder — shared baseline (enable-ai-player) =====
	BaseBuilderBotModule@normal:
		RequiresCondition: enable-ai-player
		ConstructionYardTypes: supplyroute
		VehiclesFactoryTypes: supplyroute
		BarracksTypes: supplyroute
		HeliTypes: hpad
		AirfieldTypes: afld
