Player:
	# ===== Bot Types =====
	#
	# Only two AI bots ship: Experimental (the live-tuned config) and Stable (its
	# frozen, benchmark-validated snapshot). The legacy Normal/Rush/Turtle bots and
	# their enable-ai-rush / enable-ai-turtle / enable-ai-legacy-only conditions were
	# removed 2026-07-30. The tournament harness A/Bs Experimental against Stable.
	#
	# Condition map — when adding a new bot type or wiring a new module,
	# pick the right condition:
	#
	#   enable-ai-any           granted to: experimental, stable
	#                           use for:    truly universal modules (intel, repair, scout)
	#
	#   enable-ai-player        granted to: experimental, stable
	#                           use for:    the shared baseline tier — modules both bots
	#                                       inherit as their starting point (base builder,
	#                                       ground production). Historically the Normal AI's
	#                                       baseline; now that Normal/Rush/Turtle are gone it
	#                                       overlaps enable-ai-any (both surviving bots hold
	#                                       both). Kept as a distinct gate because some blocks
	#                                       still combine it with !enable-ai-experimental to
	#                                       resolve to Stable-only (see @america.normal /
	#                                       @russia.normal unit builders).
	#
	#   enable-ai-experimental  granted to: experimental — use for NEW Experimental-only modules
	#   enable-ai-stable        granted to: stable — snapshot of the last validated Experimental
	#                                       config (promotion policy: SPEC.md §Bot pair). Promoted
	#                                       2026-08-02 to FULL @experimental parity; @stable now also
	#                                       participates in the influence stack (InfluenceStack.cs).
	ModularBot@experimental:
		Name: Experimental AI
		Type: experimental
	ModularBot@stable:
		Name: Stable AI 0802
		Type: stable

	# Both surviving bots inherit the shared baseline (enable-ai-player / enable-ai-any).
	# New Experimental-only modules use `enable-ai-experimental`; Stable mirrors the
	# validated snapshot under `enable-ai-stable`.
	GrantConditionOnBotOwner@normal:
		Condition: enable-ai-player
		Bots: experimental, stable
	GrantConditionOnBotOwner@experimental:
		Condition: enable-ai-experimental
		Bots: experimental
	GrantConditionOnBotOwner@stable:
		Condition: enable-ai-stable
		Bots: stable

	# Unified condition for any AI type (used by shared modules)
	GrantConditionOnBotOwner@anyai:
		Condition: enable-ai-any
		Bots: experimental, stable

	# Shared blackboard for inter-module coordination
	BotBlackboard@ai:
		RequiresCondition: enable-ai-any
		TaskStaleTicks: 1500
		CleanupInterval: 300

	ProvidesPrerequisite@AIRESTRICTOR:
		Prerequisite: aitoodumb
		RequiresCondition: enable-ai-any
	GrantConditionOnPrerequisite@NAVYDISABLER:
		Condition: global-disablenavy
		Prerequisites: global-disablenavy

	# ===== Shared Modules (all AI types) =====

	# Experimental/Stable AI: per-unit commitment ledger (POI-strategy Phase 0/1). Stops
	# CaptureCoordinatorBotModule below (and the POI offense modules) from
	# re-issuing orders when a unit's IsIdle flickers mid-task. Without it the
	# escorted TECN's CaptureActor order gets overwritten every scan and it never
	# arrives — the "derricks ignored" bug. Reusable component.
	# See WORKSPACE/plans/260719_experimental_ai_poi_strategy.md.
	#
	# SHARED SINGLETON (not duplicated into a @stable twin): consumers fetch it via
	# player.TraitOrDefault<PoiGoalGuard>() (single-instance lookup), so two
	# instances on one player would throw. Gated on BOTH bot conditions instead —
	# Experimental and Stable share this ledger's one setting. (See the Stable
	# section note + SPEC §13.)
	PoiGoalGuard@poi:
		RequiresCondition: enable-ai-experimental || enable-ai-stable
		# 600 (was 300): at Speed 25 one cell is ~41 ticks, so 300 only covers a
		# ~7-cell walk — borderline for edge→SR→derrick routes, causing commitment
		# expiry mid-approach (F-2). 600 covers ~14.6 cells with margin. Shared with
		# @stable per SPEC §13 (single-instance module).
		DefaultCommitmentTicks: 600

	# experimental AI: smart capture + escort + defense of income structures.
	# Income weights match CashTrickler amounts in structures-neutral.yaml
	# (OILB=50, FCOM=100, BIO=150). MISS/HOSP have no income so score low.
	CaptureCoordinatorBotModule@experimental.tecn:
		RequiresCondition: enable-ai-experimental
		CapturingActorTypes: tecn,tecn.russia,tecn.america
		# Phase 4b: derive the capturer pool from UnitRoleResolver (role CaptureSpecialist) instead of
		# CapturingActorTypes above. Same TECN set today; CapturingActorTypes stays for the frozen @stable twin.
		UseUnitRoles: true
		# logisticscenter included so experimental doesn't need the legacy
		# CaptureManagerBotModule@captureenemystructures (which competes
		# with this module for TECN — see playtest 260513 O1).
		CapturableActorTypes: oilb,bio,miss,fcom,hosp,logisticscenter
		CheckCaptureTargetsForVisibility: false
		ScanInterval: 75
		MaximumCaptureTargetOptions: 12
		# PITFALL: only list structures that actually have CashTrickler — a $0
		# building here outbids real income POIs and wastes the capturer.
		IncomeWeights:
			oilb: 50
			fcom: 100
			bio: 150
			miss: 10
			hosp: 20
		DefaultIncomeWeight: 10
		DistanceHalfLifeCells: 20
		SafetyEnemyScanRadiusCells: 6
		SafetyMultiplierSafe: 100
		SafetyMultiplierMild: 40
		SafetyMultiplierHostile: 10
		EscortSize: 2
		SupportRecruitRadiusCells: 40
		DefenseScanInterval: 150
		DefenseEnemyScanRadiusCells: 12
		DefenseFriendlyScanRadiusCells: 6
		DefenseSummonCount: 3
		DefenseEnemyValueThreshold: 200
		# cycle 2: keep >=1 capturer alive-or-pending by pulling production when a
		# derrick is uncaptured and no TECN is free. Default 0 (disabled) on the shared
		# engine class; set ONLY here, so @stable.tecn stays byte-identical.
		TecnFloor: 1
		# Capture-supply guarantee (S2-loss fix, WORKSPACE/recon/260731): the S2 rung seeds ~14 neutral oilb
		# income POIs (~33k each held to clock); the capture race decides the game, yet Experimental fielded ZERO
		# TECN in 6/10 games. Four coupled opt-ins below, ALL default-off on the shared engine class so @stable.tecn
		# (which omits them) is byte-identical:
		#  (a) re-issue an UNDELIVERED floor request after ~200 ticks so a starved queue slot can't deadlock the
		#      floor (the alive+pending>=floor gate otherwise sits forever on one pending request).
		TecnRequestStaleTicks: 200
		#  (b) scale the floor to reachable neutral money POIs (~1 capturer per free oilb), clamped to [1, 5].
		ScaleTecnFloorToPois: true
		TecnFloorMax: 5
		#  (c) route the floor request through the priority production path so it out-prioritises combat buys for
		#      the queue slot (the floor cannot be starved by combat production).
		TecnRequestPriority: true
		#  (d) in the PoiMap capture pass, exclude oilbs already being captured by an in-flight capturer so N free
		#      TECN fan out to N DISTINCT derricks instead of clustering (the measured 2-TECN->1-oilb waste).
		CaptureFanoutEnabled: true
		# TECN-first ferrying: for a DISTANT derrick, request a ride from the experimental
		# MountedTransportBotModule twin instead of walking the TECN there on foot. Falls back to
		# on-foot when no carrier is free. Default false on the engine class → @stable.tecn frozen.
		UseTransportForDistantCaptures: true
		TransportCaptureMinDistanceCells: 12
		# Influence stack (capture migration, PIPELINE item 24): order capture targets off the BELIEVED
		# anti-ground danger field instead of the omniscient InfluenceMap threat PoiMap bakes into the capture
		# score. When on, GetCaptureTargets is asked for a threat-NEUTRAL base score (no omniscient read) and
		# the believed-danger damp re-orders it fog-legally — a capturer is not sent first into a believed weapon
		# envelope. Mirrors PoiOffensiveBotModule's Stage-F believed-danger buckets on the danger-field scale:
		# safe x100 / mild x60 / hostile x20. Default OFF on the @stable.tecn twin = byte-identical.
		StrategicCaptureRepointEnabled: true
		BelievedDangerMildThreshold: 40
		BelievedDangerHostileThreshold: 120
		BelievedDangerSafeMultiplier: 100
		BelievedDangerMildMultiplier: 60
		BelievedDangerHostileMultiplier: 20
		# Lever-4 diagnostics (PIPELINE lever 1, §4.D): two-sided derrick-ownership snapshot each capture scan so
		# the capture race is legible on BOTH bots (the commit markers only track this player's capturers). Logging
		# only, no behaviour. Default false on the @stable.tecn twin = its code path is unchanged.
		CaptureTelemetryEnabled: true
		# Capture-contest lever (PIPELINE lever 1, Option A): make the HOLD contest-aware. A derrick whose
		# neighbourhood reads contested (believed anti-ground danger over ContestedDangerThreshold, or the control-field
		# ring reads Enemy/Contested) gets a LARGER escort on dispatch (4 vs 2) and pre-summons defenders at a LOWER
		# enemy-value gate ($100 vs $200) so a light re-capture probe is met before it flips the structure. Targets the
		# measured ~1.9x contested-capture HOLD deficit (WORKSPACE/recon/260729-lever1-capture-contest-design.md §5).
		# Reads only fog-legal believed fields; zero RNG. Default OFF on the @stable.tecn twin = byte-identical.
		ContestAwareSupportEnabled: true
		ContestedEscortSize: 4
		ContestedDefenseEnemyValueThreshold: 100
		ContestedDangerThreshold: 40
		# Escort right-sizing (income lever): scale the capture party DOWN by believed threat at the target. A derrick
		# in our own verified-safe territory near our SR is captured with the TECN ALONE (no combat units reserved to
		# babysit it while it works), a mildly-exposed one with a small escort, and a contested one keeps the full
		# escort above. Reduction ONLY — it never raises an escort and never shrinks a target ContestAware already
		# flagged contested, so the two levers compose. Frees combat units from safe-POI babysitting for the offense /
		# other captures (the highest-impact income lever spotted from spectator games — the bot was sending a full
		# escort to zero-threat derricks next to its own SR). Reads only fog-legal believed fields (ControlField /
		# DangerFieldLayer); zero RNG. Default OFF on the @stable.tecn twin = byte-identical.
		EscortTierSizingEnabled: true
		SafeControlScoreThreshold: 300
		SafeDangerThreshold: 40
		SafeMaxDistanceFromSRCells: 24
		LightEscortSize: 2
		# Phase 2 commit-on-order audit (§4): commit recruited escorts (capture-escort:<id>) and structure
		# defenders (capture-defend:<id>) to the shared PoiGoalGuard ledger, not just the capturer. Closes the
		# ledger-blind steal channel where offense's BuildFreePool re-grabbed a just-dispatched escort/defender.
		# Default OFF on the @stable.tecn twin (which omits it) = byte-identical.
		CommitSupportUnits: true
		# ===== CAPTURE <-> COMBAT BUDGET SPLIT (combat-quality lever 3) =====
		# The @experimental bot fields a smaller, more expendable combat force because build/production budget is
		# diverted to the capture race. That split is governed by THREE tunables, surfaced here so a future tuning
		# pass (or a human) can shift budget toward combat WITHOUT a rebuild. Current values reproduce today's
		# behaviour; nothing changes until they are tuned.
		#  (1) TECN production floor — how many capturers to keep alive-or-pending (TecnFloor / ScaleTecnFloorToPois
		#      / TecnFloorMax above). More capturers = fewer combat buys from the shared production lottery.
		#  (2) Escort reservation — combat units locked to babysit each capture (EscortSize / ContestedEscortSize /
		#      LightEscortSize above). Higher = more combat force diverted off the offense onto capture duty.
		#  (3) TecnFloorArmyShareCapPct (below) — a NEW single dial: cap the capturer floor at this % of the current
		#      COMBAT army, so capture demand can't crowd out combat production when the army is thin. 100 = INERT
		#      (the clamp never binds and the combat-army count is not even computed — byte-identical to today).
		#      Lower it (e.g. 50 = capturers may not exceed half the combat army) to move budget toward combat.
		# The production SHARE weights themselves (tecn vs combat unit types) live in UnitsToBuild / UnitLimits in
		# ai-america.yaml / ai-russia.yaml — see the budget-split note there. Default 100 on @stable.tecn = inert.
		TecnFloorArmyShareCapPct: 100
		# Retreat-when-done (orderless-at-hostile-location bug fix): when a capture completes or its target is
		# gone, send the surviving TECN back to our SR instead of leaving it idle at the front (a free kill no
		# combat free pool re-collects). Enabled on both live .tecn twins — it's a bug-class fix, not a tuning
		# lever; the engine default stays false so any profile that omits the module is byte-identical.
		RetreatCapturerWhenDone: true

	# experimental AI: POI-scored SPREAD OFFENSE (POI-strategy Phase 3). Splits the general
	# ground army across the top enemy objectives ranked by PoiMap
	# (enemy income = Attack, enemy Supply Route = Pressure; the enemy base
	# competes on the same score — decision #3, no privileged base-beeline).
	# Replaces the fixed-wing SquadManager's ground death-ball: those experimental managers
	# set IgnoreGroundUnits so this module owns the ground pool. Unit contention
	# with capture/defense is resolved through the shared PoiGoalGuard ledger.
	# Constants are tunable here without a rebuild; early passive games accepted.
	PoiOffensiveBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ReevaluateInterval: 100
		UnitsPerAxis: 8
		MinAxisSize: 3
		MaxAxes: 4
		# Early-econ behaviour 3 (PIPELINE 12): for the first ~3 min (4500 ticks) disperse in smaller
		# packets — axes form at 3 units (min 2) instead of 8 (min 3) — so the few early units spread
		# from the beachhead and grab ground/POIs quickly rather than massing one armada at the SR.
		# Default-off in C#; only this @experimental block enables it, so PoiOffensiveBotModule@stable
		# (which lacks these fields) keeps its axis sizing byte-identical.
		EarlyGameSpread: true
		EarlyGameDurationTicks: 4500
		EarlyUnitsPerAxis: 3
		EarlyMinAxisSize: 2
		AxisCommitmentTicks: 250
		ReassignScoreThresholdPct: 30
		RepathThresholdCells: 3
		# Mission commitment (Phase-1 anti-thrash): once an axis is ordered at an objective, HOLD it —
		# don't re-task on the next re-eval just because scores jittered. A committed axis is released
		# ONLY on an explicit trigger: objective invalid, a believed-danger spike at the objective
		# (> commit + max(40, +50%)), a rival objective beating it by > MissionBetterOppMarginPct (50%,
		# above the 30% target-set stickiness), or the squad ground below half its commit-time strength.
		# Kills the "go one way, stop, reverse, loop" churn from the 100-tick re-issue cadence overwriting
		# live orders. Default OFF on the engine class => PoiOffensiveBotModule@stable (which omits these
		# fields) keeps re-tasking every eval byte-identical; only this @experimental block turns it on.
		MissionCommitmentEnabled: true
		# Bounded safety re-plan valve (ticks from commit): the hold spans ~3 re-evals (ReevaluateInterval=100)
		# then force-releases at 400t even if no abort trigger fired — set ABOVE AxisCommitmentTicks (250) so it's
		# an outer backstop, not per-ledger churn. Engine default is 0 (inert); @stable omits it => byte-identical.
		MissionCommitmentWindowTicks: 400
		MissionDangerSpikePct: 50
		MissionDangerSpikeFloor: 40
		MissionBetterOppMarginPct: 50
		MissionIneffectiveNumerator: 1
		MissionIneffectiveDenominator: 2
		# Phase 1c: quantize both scores before the trigger-3 rival compare so a believed-field bucket-edge
		# wobble (BalanceOfPowerFactor 150/100/60, BelievedDangerFactor 100/60/20 — a single crossing is up to a
		# 3x jump, larger than the 50% margin) can't ping-pong abort/re-propose. Band = 60% of the top score, so a
		# rival must be a full band (~1.67x) clear to count as materially better — a bucket-aware threshold. 0 on the
		# engine class => @stable twin (which omits this field) keeps the raw pre-1c compare byte-identical. Initial
		# value; sweep target once the ai-bench ladder is run. Only active with MissionCommitmentEnabled.
		MissionScoreQuantizeBandPct: 60
		# Phase 1d: Aggressiveness slider scaffolding (§2.7), first knob, landed on the offense module (its first
		# consumer) pending migration to the SquadBrain. 50 = neutral; threaded through pure PoiOffenseMath.ShiftByKnob
		# only. The slope below is 0 (INERT) so this ships with no behaviour change until a sweep sets a nonzero slope.
		Aggressiveness: 50
		MissionBetterOppMarginSlopePct: 0
		# Capturer + non-combat support (owned by CaptureCoordinator / SupplyFollower)
		# and IFV carriers (owned by MountedTransport). Both factions' type names are
		# listed; a name the faction lacks is simply never matched.
		ExcludeUnitTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, bradley, bmp2, m113
		# Phase 4: classify free-pool eligibility by UnitRoleResolver (role MainBattle or IndirectFire,
		# minus cargo carriers) instead of ExcludeUnitTypes above. Drops SHORAD/MANPADS off offensive
		# axes by class; ExcludeUnitTypes becomes inert (kept for the frozen @stable twin).
		UseUnitRoles: true
		# Experimental-only: don't recruit evacuating (out-of-ammo) units onto an axis — the
		# AttackMove would cancel their RotateToEdge evac and send an empty unit at the enemy.
		# Default false on the frozen @stable twin (byte-identical); mirrors LayeredDefence.
		SkipOutOfAmmoUnits: true
		# Dispersion doctrine — spread to move, mass to assault. Experimental-only: the switch
		# defaults OFF so Stable/Normal controls are untouched. Axes fan out (Spread) while their
		# centroid is farther than AssaultRadiusCells from the target, then mass (Tight) for the
		# final push. Set CohesionSwitchEnabled: false (or ApproachCohesion: Tight) to A/B the baseline.
		CohesionSwitchEnabled: true
		AssaultRadiusCells: 15
		ApproachCohesion: Spread
		AssaultCohesion: Tight
		# Experimental-only SR contestation: multiply the enemy Supply Route Pressure-axis score
		# so it competes for an offensive axis (frozen it scores last and never gets one). 260
		# reproduces the design plan's value=250/bias=100 uplift over the frozen value=120/bias=80
		# (260 = (250*100)/(120*80)): mild ~17.0M, safe ~42.5M, hostile ~4.25M — the hostile threat
		# gate still keeps the AI off a well-garrisoned SR. Default (100) on @stable = inert.
		SrPressureScoreMultiplier: 260
		# Influence stack Stage E: route attack axes AROUND defended strongpoints / chokes (reads the
		# per-player anti-ground danger field) instead of grinding head-on through them. Emits a two-leg
		# AttackMove (lateral lane, then the objective). Experimental-only; @stable twin leaves it off.
		DangerFieldRouting: true
		# Influence stack Stage F (strategic repoint): select offensive/expansion axes off the BELIEVED
		# control + anti-ground danger fields instead of the omniscient InfluenceMap threat grid — the
		# threat term is dropped from the base score and re-derived fog-legally here. Completes the
		# @experimental fog migration for attack-axis selection. Terr-bias revival on the control field:
		# read the control balance of the ring AROUND a target (excluding its own cell — every enemy target
		# is a site-anchor structure whose own cell the control field floors deeply enemy), so an enemy
		# structure ENCIRCLED by ground we believe we hold is pressed (x150), one deep in believed-enemy
		# ground is damped (x60), a contested front is left neutral. Believed-danger damp mirrors the old omniscient
		# threat buckets on the danger-field scale: safe x100 / mild x60 / hostile x20. Default OFF on the
		# @stable twin = byte-identical. DECLARED benchmark re-baseline (WORKSPACE/ai-bench/), no run yet.
		StrategicRepointEnabled: true
		BopBoostMultiplier: 150
		BopDampMultiplier: 60
		BelievedDangerMildThreshold: 40
		BelievedDangerHostileThreshold: 120
		BelievedDangerSafeMultiplier: 100
		BelievedDangerMildMultiplier: 60
		BelievedDangerHostileMultiplier: 20
		# frontline-influence Phase 1 (reachability-gated + amphibious-typed targeting): re-shape each axis
		# score by whether a GROUND force can reach the POI from our Supply Route (read from the CrossingMap
		# terrain model, Phase 0). A far-bank objective behind an uncrossable river no longer scores as if
		# adjacent — it is damped for land units unless an intact crossing connects the banks, our amphibious
		# units can reach it (then the axis is typed amphibious so those units go, not stranded land units), or
		# only a repairable destroyed bridge connects them (reduced x60, kept on the radar for the Phase-6
		# engineer route-opening). A genuinely unreachable POI is heavily damped (x10); an amphibious route we
		# cannot crew ⇒ x30. Default OFF on the @stable twin (which omits these fields) ⇒ byte-identical.
		ReachabilityGatingEnabled: true
		ReachabilityRepairableMultiplier: 60
		ReachabilityAmphibiousMultiplier: 30
		ReachabilityUnreachableMultiplier: 10
		# Fires doctrine (PIPELINE item 11): hold IndirectFire artillery at its own weapon standoff during an
		# assault instead of marching it to the objective with the line group — it rains suppressive fire from
		# range and backs off if the target closes, while the line units press. Peels artillery off the grouped
		# AttackMove and issues a per-piece standoff AttackMove (max weapon range - FiresStandoffMargin from the
		# axis target). Gated on the UnitRoleResolver world trait (identifies the artillery role), not on
		# UseUnitRoles. Experimental-only; @stable twin off.
		FiresStandoff: true
		# Fires economics (PIPELINE item 19): ammo expected-value gate on the fires employment above. A ROCKET
		# artillery piece (UnitRoleResolver IndirectFireKind.Rocket — Grad/TOS/M270, derived from salvo Burst)
		# holds fire while the best clump of spotted enemies in weapon range would not repay the salvo's ammo
		# cost, and returns to FireAtWill once a worthy clump is in range; TUBE pieces (Giatsint/Paladin) are
		# exempt and may engage singles. Rides the FiresStandoff loop, so it needs FiresStandoff on (above).
		# Experimental-only; @stable twin leaves it off (byte-identical).
		FiresEvGate: true
		# Defence-in-depth echelon (builds on FiresStandoff): position each IndirectFire piece BEHIND the axis's
		# MainBattle screen (tanks/infantry) rather than at a ring around the target, so artillery stops driving
		# alone to the front and dying. Depth behind the screen centroid = max(EchelonMinDepth, (own max weapon
		# range - the screen's longest weapon reach) + EchelonBuffer); the anchor is that far behind the screen,
		# offset away from the target. Override: a piece with NO screen on its axis (pure-artillery axis / solo
		# fire tasking) falls back to the target-relative FiresStandoff anchor. Needs FiresStandoff on (above).
		# Experimental-only; @stable twin (which lacks these fields) stays byte-identical.
		EchelonPositioning: true
		EchelonBuffer: 1c0
		EchelonMinDepth: 3c0
		EchelonTolerance: 2c0
		EchelonScreenRangeFallback: 5c0
		# Frontier standoff (builds on the echelon + the shipped frontline contour): hold each echeloned
		# artillery piece at least this many COARSE control-field cells behind the believed enemy frontier
		# (ControlField distance-to-enemy-region). If the echelon anchor lands closer, it is walked rearward
		# along the anchor axis (bounded) so the piece stands off BEHIND the front, not on it. 4 coarse cells
		# ≈ 8 map cells. Needs EchelonPositioning + a ControlField (present via the influence stack). @stable
		# twin (which lacks this field) stays byte-identical.
		MinFrontierDistanceCells: 4
		# Fires doctrine Phase 1 (gap G1): CONTINUOUS BOMBARDMENT of believed-static positions. Idle artillery with
		# ammo and a believed-static enemy position (BeliefStore IsStatic contact — defence/garrison/structure) in
		# weapon range takes a STANDING fire mission: it holds at the FiresStandoff anchor and shells that position
		# independent of any offensive axis. Targets come ONLY from the fog-legal belief store; worthiness reuses the
		# FiresEconMath EV gate (rocket needs a believed-static CLUMP to repay its salvo, tube may shell a single);
		# committed to the shared PoiGoalGuard ledger so no axis double-tasks it. Reuses FiresEvMarginPercent /
		# FiresEvClumpRadius. Default OFF on the engine class ⇒ the @stable twin (which omits these fields) is
		# byte-identical; only this @experimental block turns it on. Needs the UnitRoleResolver + BeliefStore (both
		# present via the influence stack).
		ContinuousBombardment: true
		# Combat-quality force preservation (levers 1+2, WORKSPACE/benchmarks/260802-exp-vs-stable0730-combatweighted.md):
		# the @experimental bot kills evenly with @stable yet DIES for ~2x the army value — it treats its combat force
		# as expendable while it wins the capture race. These two levers keep the capture strength but stop bleeding the
		# army. Both read only the fog-legal belief store (armed contacts near the axis, cost x confidence) vs the axis's
		# own health-weighted build value — the SAME cost scale, so the ratio is meaningful; zero RNG. Shaped as an ABORT
		# TRIGGER (a force-ratio spike), NOT a competing order stream, so it composes with the squad mission-commitment
		# work. Both default OFF on the shared engine class ⇒ the @stable twin (which omits them) is byte-identical.
		#  Lever 1 — retreat when losing: an axis whose believed local enemy force is >= RetreatForceRatioPct% of its
		#  own, sustained RetreatSustainEvals evals, falls back (grouped AttackMove) to the rally cell = our own SR
		#  instead of grinding to death. Hysteresis: it COMMITS to the retreat until it reaches safety
		#  (RetreatSafeDistanceCells of the rally) or the ratio recovers past ReengageForceRatioPct% (stricter, so no
		#  advance/retreat oscillation).
		RetreatWhenLosing: true
		#  Lever 2 — don't reinforce a lost fight: a losing axis is NOT topped up (no piecemeal trickle into a meat
		#  grinder, the classic 2x-deaths mechanism); the free units stay for other axes / a rally.
		NoReinforceLostFights: true
		RetreatForceRatioPct: 200
		ReengageForceRatioPct: 120
		RetreatSustainEvals: 2
		ForceRatioRadiusCells: 8
		RetreatSafeDistanceCells: 10
		# PHASE 2 (frontline-influence) — free-pool FORWARD STAGING. Uncommitted combat units are walked to a
		# muster point a safe standoff BEHIND the believed frontier (steepest descent on the control field's
		# distance-to-enemy-frontier BFS from the SR) instead of idling at the Supply Route clogging the road to
		# the front. The muster point ADVANCES as the front moves; units fan out (ring spread) so they don't pile
		# on one cell; committed/retreating units are never staged. Default OFF on the shared engine class ⇒ the
		# @stable twin (which omits these fields) idles the reserve at the SR byte-identical. Inert until the
		# ControlField frontier BFS is populated. Standoff 6 coarse cells ≈ 12 map cells behind the line; the
		# danger guard (40, the same scale as GroundDangerSafeThreshold) keeps the muster BEHIND defended fronts.
		ForwardStagingEnabled: true
		StagingStandoffCells: 6
		StagingDangerSafeThreshold: 40
		StagingSpreadStepCells: 2
		StagingHysteresisCells: 3
		StagingMaxDescentSteps: 64
		# PHASE 3 (frontline-influence) — RETREAT-OSCILLATION DAMPER. Builds on RetreatWhenLosing to stop small
		# early-spread axes ping-ponging into the SR bubble (advance, read losing, fall back into the 10-cell
		# bubble, re-form, repeat — the "small movements near spawn" symptom). Adds two gates ON TOP of the
		# sustained-streak retreat ENTRY that RetreatWhenLosing already has: (a) a post-retreat DWELL of 3 evals an
		# axis must hold before it may re-advance on the same target (converts churn into hold-then-push), and (b)
		# an advance-STRENGTH floor (own health-weighted build value, SAME scale as the retreat force ratio) below
		# which an axis still massing near the rally waits/merges rather than trickling 2-3 units forward. NEITHER
		# delays a genuine retreat — a truly-losing axis still withdraws promptly. When Phase-2 staging is on the
		# held axis waits at the forward muster point (off the SR road). Default OFF on the shared engine class ⇒
		# the @stable twin (which omits these fields) is byte-identical. Conservative initial values — the ladder
		# sweep (WORKSPACE/ai-bench/) is the tuning path, user-gated.
		RetreatDamperEnabled: true
		RetreatReadvanceDwellEvals: 3
		MinAdvanceStrength: 1200
		# PHASE 4 (frontline-influence) — FRONTLINE STRENGTH PROFILE (sensor only). Opts this @experimental
		# player in to the ControlField's per-frontier-sector believed OWN-vs-ENEMY strength profile + avenue
		# (CrossingMap crossing) mapping, so a later consumer can ask "which frontier sector is the enemy line
		# thinnest in, and which crossing opens into it." Phase 4 only BUILDS the sensor (rides the control
		# field's existing per-player recompute cadence, no new timer, zero RNG); nothing acts on it yet.
		# Default OFF on the shared engine class ⇒ the @stable twin (which omits this field) never opts in, so
		# the profile arrays are never built and it stays byte-identical. Inert until a ControlField exists.
		FrontlineProfileEnabled: true
		# PHASE 5 (frontline-influence) — WEAKEST-POINT ATTACK BIAS + SECTOR POSTURE HOLD. Consumes the Phase-4
		# frontline strength profile (built by FrontlineProfileEnabled above / opted-in by these flags too).
		# WeakestPointBias: multiply an axis score by 150 (x100) when its target sits in the believed-thinnest
		# enemy frontier sector, so the push flows toward the weak point — a BIAS, the value×distance×threat
		# scoring + deterministic comparator stay authoritative (a bare enable at 100 is inert). SectorPostureHold:
		# where the sector the axis STANDS IN reads too strong (believed enemy force >= 200% of our own believed
		# strength there), the axis holds/defends via the SAME retreat/damper fall-back (reuses OrderRetreat, never a
		# new writer) and only AFTER the genuine-retreat gate — so it can never block a truly-losing withdrawal.
		# Evaluated at the axis's own CONTACT sector (unit centroid), NOT the deep target sector: the target sits in
		# the enemy rear where our believed own strength is ~0, which made the ratio trivially "outnumbered" and
		# froze every push at home (live River Zeta regression). SectorPostureHoldOwnFloor is the backstop — below
		# ~3 own armed-unit presence in the evaluated sector we don't occupy it, so we press rather than "hold" it.
		# Default OFF on the shared engine class ⇒ the @stable twin (which omits these fields) is byte-identical.
		# Conservative initial values — the benchmark ladder (WORKSPACE/ai-bench/, user-gated) is the tuning path.
		WeakestPointBiasEnabled: true
		WeakestPointBiasMultiplier: 150
		SectorPostureHoldEnabled: true
		SectorPostureHoldRatioPct: 200
		SectorPostureHoldOwnFloor: 3

	# experimental AI: HOLD captured money POIs (POI-strategy Phase 4). Once the AI owns an
	# oilb/fcom/bio it parks a SMALL garrison (1-3 units, scaled by value + bumped
	# under assault) so the income isn't ninja-recaptured. Reads PoiMap's defensive
	# ranking (own money POIs scored value x distance x defence-urgency — threat
	# RAISES the score). Claims units through the SAME shared PoiGoalGuard ledger as
	# capture/offense (commits "defend:<id>"), so no module fights over a unit and
	# the offense pool isn't starved. Score-floating, no priority ladder: garrison
	# and offense both pull from the shared free pool. Constants tunable here.
	PoiGarrisonBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ReevaluateInterval: 100
		ValuePerGarrisonUnit: 50
		MinGarrison: 1
		MaxGarrison: 3
		ThreatGarrisonBonus: 1
		MaxGarrisons: 4
		GarrisonCommitmentTicks: 250
		RepathThresholdCells: 3
		# Same exclusions as PoiOffensiveBotModule@experimental: capturer + non-combat support
		# (owned by CaptureCoordinator / SupplyFollower) and IFV carriers (owned by
		# MountedTransport). A name the faction lacks is simply never matched.
		ExcludeUnitTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, bradley, bmp2, m113
		# Phase 4: same role-based free-pool filter as PoiOffensiveBotModule@experimental. ExcludeUnitTypes
		# above becomes inert (kept for the frozen @stable twin).
		UseUnitRoles: true
		# Influence stack (garrison migration, PIPELINE item 24): score held-POI defend urgency off the BELIEVED
		# anti-ground danger field instead of the omniscient InfluenceMap threat PoiMap bakes into the defend
		# score. When on, GetDefendTargets is asked for a threat-NEUTRAL (calm) base score (no omniscient read)
		# and the believed-danger RAISE re-orders + resizes garrisons fog-legally — the MIRROR of the capture
		# damp: believed danger at a POI we hold RAISES its defend score and garrison size. Buckets mirror the
		# omniscient defend multipliers on the danger-field scale: calm x100 / probed x150 / assaulted x250.
		# The assaulted threshold (120) is where the garrison-size threat bump fires. Default OFF on the @stable
		# twin = byte-identical.
		DefendRepointEnabled: true
		BelievedDangerMildThreshold: 40
		BelievedDangerHostileThreshold: 120
		BelievedDangerCalmMultiplier: 100
		BelievedDangerProbedMultiplier: 150
		BelievedDangerAssaultedMultiplier: 250

	# experimental AI: LANE AMBUSH (PIPELINE item 8 Stage 4). The strategic consumer of the shipped
	# widened-ambush machinery — posts a few suitable units into concealed Ambush positions on the corridor
	# between our beachhead and the enemy's and grants them the enable-ambush-tactics gate so the Stage-2/3
	# machine runs. Claims units through the SAME shared PoiGoalGuard ledger (commits "ambush:<id>") so
	# offense/garrison/capture never fight over them; releases sprung units back to normal tasking.
	# Deliberately small (MaxAmbushes x UnitsPerAmbush = 4 units max) so it never starves offense.
	#
	# 2026-08-02 promotion: @stable now runs a twin of this module (LaneAmbushBotModule@stable, in the
	# Stable block below) at full parity. Each module grants enable-ambush-tactics ONLY to the units it
	# posts (LaneAmbushBotModule.cs:418/439), so the twin activates the Stage-2/3 machinery for its own
	# ambushers without any shared/global grant; humans and any non-fog bot still never instantiate it.
	LaneAmbushBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ReevaluateInterval: 100
		MaxAmbushes: 2
		UnitsPerAmbush: 2
		PostFractionPct: 40
		MinLaneSeparationCells: 12
		PostCellClampCells: 6
		AmbushCommitmentTicks: 250
		RepathThresholdCells: 3
		# Same exclusions as PoiOffensiveBotModule@experimental: capturer + non-combat support and IFV
		# carriers (owned by CaptureCoordinator / SupplyFollower / MountedTransport). Role filter below makes
		# the list inert; kept for parity. The ^AutoTargetGround family (AA IFVs + assault-move vehicles) is
		# excluded structurally by CanHostAmbush regardless of these lists (OBS-1).
		ExcludeUnitTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, bradley, bmp2, m113
		UseUnitRoles: true

	# NOTE: No engineer (^E6) capture module wired anywhere — engineers
	# don't capture in WW3MOD by design. The Captures trait sits on
	# Technician (^TECN) only. See DOCS/gameplay/capturing.md.

	BuildingRepairBotModule@aiplayer:
		RequiresCondition: enable-ai-any

	# TODO: LCCV deployment needs custom strategic logic (evaluate need, find safe location, escort)
	# Disabled until we have proper decision-making infrastructure for it.

	# Scouting — sends fast units to explore the map and report enemy positions
	ScoutBotModule@america:
		RequiresCondition: enable-ai-any && player.nato
		ScoutTypes: humvee
		MaxScouts: 2
		ScanInterval: 200
		MinScoutDistance: 15
		ScoutVisionRadius: 8

	ScoutBotModule@russia:
		RequiresCondition: enable-ai-any && player.brics
		ScoutTypes: btr
		MaxScouts: 2
		ScanInterval: 200
		MinScoutDistance: 15
		ScoutVisionRadius: 8

	# Garrison defense structures with infantry for base defense
	GarrisonBotModule@defenses:
		RequiresCondition: enable-ai-any
		ScanInterval: 200
		MaxGarrisonRadius: 25
		MaxOrdersPerTick: 2
		PrioritizeExposed: true
		# Phase 2 commit-on-order audit (§4): recruit only from the ledger-checked free pool and commit
		# garrisoned infantry (garrison:<buildingId>) to the shared PoiGoalGuard ledger. SHARED enable-ai-any
		# module, so the engine confines this to the @experimental player at runtime (explicit BotType gate);
		# Normal / legacy / @stable that share the instance are byte-identical (no ledger read, no commit).
		CommitGarrisonedUnits: true

	# Supply trucks follow the army to resupply in the field
	SupplyFollowerBotModule@supply:
		RequiresCondition: enable-ai-any
		SupplyTruckTypes: truk
		ScanInterval: 150
		SafeFollowDistance: 5
		MaxFollowDistance: 35
		MinNearbyFriendlies: 4
		# Influence stack Stage E: a truck relocating along the front detours via safer depth instead
		# of driving through the kill zone — the rear-lateral-re-enter path emerges from the danger
		# cost. Shared enable-ai-any module, so the reroute is gated on InfluenceStack.Participates
		# too: only @experimental bots ever act on it; every other profile stays byte-identical.
		DangerFieldRouting: true
		# @experimental supply logistics (all three double-gated on InfluenceStack.Participates, so
		# @stable/Normal/Rush/Turtle stay byte-identical even though this is a shared enable-ai-any module):
		#  - SectorSpread: several free trucks fan out to DISTINCT needy clusters instead of piling onto
		#    the one biggest blob; they only double up once trucks outnumber clusters.
		#  - SmallSquadCoverage: drop the servable-cluster floor to 2 so small squads get a truck once the
		#    big clusters are covered (the neediest-first order still fills big clusters first).
		#  - DangerEvac: a truck whose position (or its cluster) reads high believed ground danger pulls
		#    back toward its Supply Route instead of dying in the fire. Fog-legal (DangerFieldLayer only).
		SectorSpread: true
		SmallSquadCoverage: true
		SmallSquadMinNearbyFriendlies: 2
		DangerEvac: true
		EvacDangerThreshold: 60
		EvacRetreatCells: 12

	# Adaptive production — counter enemy composition.
	# Experimental halves EvaluationInterval to 300 (counter-build twice as fast against
	# scouted enemy comp). First Experimental-AI experiment (260512), measured via the
	# tournament harness mirror-paired batch. Stable's frozen twin lives in the Stable block below.
	AdaptiveProductionBotModule@experimental.america:
		RequiresCondition: enable-ai-experimental && player.nato
		EvaluationInterval: 300
		MaxRequestsPerCycle: 2
		AntiVehicleUnits: at.america, abrams, bradley
		AntiInfantryUnits: e3.america, ar.america, humvee
		AntiAirUnits: aa.america, strykershorad
		MinEnemySightings: 3
		# Phase 4b: filter each counter pool by UnitRoleResolver class (anti-air->ShortRangeAD,
		# anti-vehicle->MainBattle/IndirectFire, anti-infantry->+Recon) before drawing. No new RNG draws;
		# every unit above already classifies into its pool today. Off on the frozen @stable twin.
		UseUnitRoles: true
		# SR-DEFENSE: classify believed enemy contacts near our own Supply Route(s) by attacker class and
		# call in the MATCHED counter, BYPASSING MinEnemySightings. Armor -> AntiVehicleUnits (cheapest
		# first: at.america -> bradley -> abrams), air -> AntiAirUnits (aa.america/strykershorad), infantry
		# -> AntiInfantryUnits. Reads the fog-legal belief store (actor identity, not a scalar danger read),
		# so a helicopter draws AA not AT, and a lone scout never draws a counter. Per-class thresholds are
		# on the unit-cost scale. Deterministic; reserves <=1 request/cycle. Off on the frozen @stable twin.
		SupplyRouteDefenseEnabled: true
		SupplyRouteScanRadius: 10
		SupplyRouteArmorValueThreshold: 1200
		SupplyRouteAirValueThreshold: 1000
		SupplyRouteInfantryValueThreshold: 1000
		# Routing fix: deliver counter-buys to the first ENABLED UnitBuilder twin. On @experimental NATO
		# unitProducers[0] is @russia.fixedwing (disabled: player.brics false) whose BotTick never runs, so
		# every counter-buy was silently lost and the alreadyRequested>=2 gate wedged re-issue. Default false
		# on the engine class => @stable.america (which omits this) keeps the frozen unitProducers[0]
		# routing = byte-identical. Same seam McvManager/Harvester already use (Exts.FirstEnabledTraitOrDefault).
		RouteToEnabledProducer: true
		# COMPOSITION-NEED: buy what the BELIEVED battlefield needs most (fog-legal belief store). Heavy believed
		# armor/infantry/air raise the matching counter; a WEAK believed enemy AA posture opens an air-strike
		# window that raises AirStrikeUnits (Apache heli / A-10). Highest-scoring AFFORDABLE class wins, <=1
		# request/cycle, BYPASSES MinEnemySightings. Off on the frozen @stable twin (byte-identical).
		# Weights are on the unit-cost/believed-value scale; NeedBudgetReservePct is the rarity dial for the
		# $6000 airframes (need 2x = $12000 banked). All are tunables — starting values, benchmark-tunable.
		CompositionNeedEnabled: true
		AirStrikeUnits: heli, a10
		AntiArmorNeedWeight: 100
		AntiInfantryNeedWeight: 100
		AntiAirNeedWeight: 100
		AirStrikeNeedWeight: 100
		AaWeakThreshold: 2000
		NeedBudgetReservePct: 200

	AdaptiveProductionBotModule@experimental.russia:
		RequiresCondition: enable-ai-experimental && player.brics
		EvaluationInterval: 300
		MaxRequestsPerCycle: 2
		AntiVehicleUnits: at.russia, t90, bmp2
		AntiInfantryUnits: e3.russia, ar.russia, btr
		AntiAirUnits: aa.russia, tunguska
		MinEnemySightings: 3
		# Phase 4b: filter each counter pool by UnitRoleResolver class (anti-air->ShortRangeAD,
		# anti-vehicle->MainBattle/IndirectFire, anti-infantry->+Recon) before drawing. No new RNG draws;
		# every unit above already classifies into its pool today. Off on the frozen @stable twin.
		UseUnitRoles: true
		# SR-DEFENSE: classify believed enemy contacts near our own Supply Route(s) by attacker class and
		# call in the MATCHED counter, BYPASSING MinEnemySightings. Armor -> AntiVehicleUnits (cheapest
		# first: at.russia -> bmp2 (ATGM) -> t90), air -> AntiAirUnits (aa.russia/tunguska), infantry ->
		# AntiInfantryUnits. Reads the fog-legal belief store (actor identity, not a scalar danger read),
		# so a helicopter draws AA (tunguska, correctly) not AT, and a lone scout never draws a counter.
		# Per-class thresholds are on the unit-cost scale. Deterministic; reserves <=1 request/cycle.
		# Off on the frozen @stable twin.
		SupplyRouteDefenseEnabled: true
		SupplyRouteScanRadius: 10
		SupplyRouteArmorValueThreshold: 1200
		SupplyRouteAirValueThreshold: 1000
		SupplyRouteInfantryValueThreshold: 1000
		# Routing fix: deliver counter-buys to the first ENABLED UnitBuilder twin. On @experimental NATO
		# unitProducers[0] is @russia.fixedwing (disabled: player.brics false) whose BotTick never runs, so
		# every counter-buy was silently lost and the alreadyRequested>=2 gate wedged re-issue. Default false
		# on the engine class => @stable.russia (which omits this) keeps the frozen unitProducers[0]
		# routing = byte-identical. Same seam McvManager/Harvester already use (Exts.FirstEnabledTraitOrDefault).
		RouteToEnabledProducer: true
		# COMPOSITION-NEED (mirror of the NATO block above): weak believed enemy AA opens an air-strike window
		# for the MI-28 attack heli / Su-25 (frog). Off on the frozen @stable twin (byte-identical). Tunable.
		CompositionNeedEnabled: true
		AirStrikeUnits: mi28, frog
		AntiArmorNeedWeight: 100
		AntiInfantryNeedWeight: 100
		AntiAirNeedWeight: 100
		AirStrikeNeedWeight: 100
		AaWeakThreshold: 2000
		NeedBudgetReservePct: 200

	# experimental doctrine — Stage B.1: layered defence placement, reserve-driven.
	#
	# Only RESERVES get re-tasked — units within OnLineRadiusCells of any
	# contested cell are "on the engagement line" and stay put. Reserves
	# fill the line by score: prefer slots where our line is thin AND the
	# enemy is weak. Emergent behaviour:
	#   - even distribution along the frontline
	#   - flanking toward enemy weak points (low-enemy-density slots)
	#
	#   SCREEN     — light infantry, sit AT the contested edge (sparse).
	#   MAIN LINE  — heavy infantry + vehicles + ATGM/artillery + AA,
	#                positioned MainLineStandoffCells behind, toward own SR.
	#
	# B.2 will add treeline/garrison preference for the screen;
	# B.3 will add overlapping-fields-of-fire check for the main line.
	# See WORKSPACE/ai/stage_b_layered_defence.md.
	LayeredDefenceBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		ScanInterval: 75
		AssignCooldownTicks: 250
		MainLineStandoffCells: 8
		OnLineRadiusCells: 8
		FriendlyGapWeight: 2
		EnemyWeaknessWeight: 1
		MaxAssignsPerScan: 6
		# Mission-commitment interop: honour the shared PoiGoalGuard ledger before pulling a reserve onto
		# the line. Without this, LayeredDefence is a ledger-blind second writer — it yanks a briefly-idle
		# offense/capture/garrison unit back to a line slot and offense re-grabs it next eval (the live-play
		# forward/back loop). Default OFF on the engine class => @stable twin (which omits this field) stays
		# byte-identical; only this @experimental instance cooperates with the shared claim.
		RespectCommitmentLedger: true
		# Phase 2 commit-on-order audit (§4): also WRITE line assignments to the ledger (defend-line:<cell>),
		# not just read it. Closes the reverse steal channel (N6) — offense's BuildFreePool now defers to a
		# committed line unit for the assignment-cooldown window. Default OFF on the @stable twin = byte-identical.
		CommitLineAssignments: true
		# Phase 4: classify line eligibility by UnitRoleResolver instead of the lists below. Only
		# role==MainBattle (minus cargo carriers) holds the line — artillery/SHORAD/MANPADS drop out
		# by class, curing the :349 defect. ScreenUnitTypes still partitions screen vs main-line; the
		# MainLineUnitTypes/ExcludedActorTypes lists become inert (kept for the frozen @stable twin).
		UseUnitRoles: true
		# PHASE 5 (frontline-influence) — MAN-THE-LINE avenue allocation. Instead of clustering reserves only on the
		# lowest-density contested InfluenceMap cells, spread them across the enumerated frontline AVENUES (the
		# ControlField Phase-4 crossing→sector map): every avenue whose sector carries a meaningful believed threat
		# (enemy strength >= 1) gets a picket where the budget allows, surplus on the outnumbered avenues. Falls
		# back to the contested-cell path when the profile isn't built / no avenue carries threat, so the module is
		# never idle. Opts this player into the frontline profile. Default OFF on the shared engine class ⇒ the
		# @stable twin (which omits these fields) stays byte-identical. Respects + writes the same ledger as above.
		ManTheLineEnabled: true
		ManTheLineMinThreat: 1
		ScreenUnitTypes: e3.america, e3.russia, ar.america, ar.russia, at.america, at.russia, sn.america, sn.russia, tl.america, tl.russia, medi.america, medi.russia
		# bradley / bmp2 / m113 deliberately ABSENT — they're owned by
		# MountedTransportBotModule@poi below (Stage B.4).
		MainLineUnitTypes: e2.america, e2.russia, mt.america, mt.russia, aa.america, aa.russia, e4.america, e4.russia, abrams, t90, m109, paladin, grad, tos, m270, strykershorad, tunguska
		ExcludedActorTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, humvee, btr, bradley, bmp2, m113

	# PHASE 6 (frontline-influence) — ENGINEER ROUTE-OPENING. When the Phase-4 frontline strength profile
	# says the enemy line is thinnest in a sector whose avenue is a REPAIRABLE destroyed bridge (CrossingMap
	# crossing Status == Repairable), send an engineer (e6, RepairsBridges) to the bridge hut with the
	# RepairBridge order and a small combat screen to open a NEW land axis. On repair the module releases its
	# commitments and lets the now-INTACT avenue be picked up by the Phase-5 man-the-line / weakest-point
	# machinery above (no separate attack path). Every dispatched unit is staked in the shared PoiGoalGuard
	# ledger (engineer bridge-repair:<hutId>, screen bridge-screen:<hutId>) so the offense pool can't poach
	# it mid-mission. Failure modes are all bounded: engineer dies en route ⇒ per-hut cooldown + bounded
	# retry; hut gone ⇒ abandon; bridge already repaired on arrival ⇒ success; timeout ⇒ cooldown + re-attempt.
	# Opts this player into the ControlField frontline profile (per-player recipe, never a world global).
	# Default OFF on the engine class (RouteOpenEnabled) + declared ONLY here ⇒ @stable / normal / human never
	# instantiate it and it is inert regardless ⇒ byte-identical. Pure RouteOpenMath (NUnit-pinned), zero RNG.
	EngineerRouteOpenBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		RouteOpenEnabled: true
		ScanInterval: 100
		MissionTimeoutTicks: 1500
		RetryCooldownTicks: 900
		MaxAttemptsPerHut: 3
		ScreenSize: 3
		ScreenStandoffCells: 3
		CommitTtlTicks: 400
		ExcludedActorTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, humvee, btr, bradley, bmp2, m113

	# experimental doctrine — Stage B.4: mounted infantry transport.
	#
	# IFVs/APCs pick up infantry from the reserve zone (near own SR), drive
	# them to the thinnest spot on the frontline, drop off, return for the
	# next load. Per-carrier state machine: Loading → Delivering → Unloading
	# → Returning. Carriers excluded from LayeredDefence above so the two
	# modules don't fight over the same vehicles.
	#
	# Spec: WORKSPACE/ai/stage_b4_mounted_transport.md.
	#
	# NOW SPLIT into @poi (stable-frozen) + @experimental twins (was a shared singleton).
	# The split lets TECN-first ferrying + pre-contact delivery land experimental-only while
	# @stable stays byte-identical. Consumers (LayeredDefenceBotModule, CaptureCoordinatorBotModule)
	# resolve the ENABLED instance via TraitsImplementing<>().FirstOrDefault(m => !m.IsTraitDisabled)
	# — TraitOrDefault would throw now that two instances exist on the player actor. The
	# `enable-ai-stable` / `enable-ai-experimental` guards keep exactly one enabled per player
	# (a bot is never both). Mirrors the HelicopterSquadBotModule split (commit cf7f826b).
	MountedTransportBotModule@poi:
		RequiresCondition: enable-ai-stable
		# Scan often — passengers spend only a short window idle near the SR
		# before LayeredDefence sends them forward. The relaxed filter (see
		# the trait) also grabs non-idle passengers in the reserve zone, but
		# we still want quick reaction to fresh production.
		ScanInterval: 50
		CarrierTypes: bradley, bmp2, m113
		PassengerTypes: e3.america, e3.russia, ar.america, ar.russia, at.america, at.russia, sn.america, sn.russia, tl.america, tl.russia, medi.america, medi.russia, e2.america, e2.russia, mt.america, mt.russia, aa.america, aa.russia, e4.america, e4.russia
		MinPassengersPerLoad: 2
		MaxPassengersPerLoad: 5
		ReserveZoneRadiusCells: 14
		LoadingTimeoutTicks: 1500
		DropOffArrivalRadius: 3
		ReturnArrivalRadius: 5
		# 2026-08-02 promotion — full @experimental transport parity. DeliverBeforeContact/PickupCorridor/
		# UnloadOnArrival are engine-independent; BelievedDangerStandoff reads the danger field, now LIVE
