		# Promoted from @experimental (post-S1 snapshot, SPEC §13): keep >=1 capturer
		# alive-or-pending. Validated by cycle-2 (capture 4/10->8/10, merged c6a71c14).
		TecnFloor: 1

	PoiOffensiveBotModule@stable:
