		DefenseQueues: Defense
		MinBaseRadius: 2
		MaxBaseRadius: 20
		PlaceDefenseTowardsEnemyChance: 80
		MinimumDefenseRadius: 5
		MaximumDefenseRadius: 15
		NewProductionCashThreshold: 5000
		RallyPointScanRadius: 10
		BuildingLimits:
			hpad: 3
			afld: 2
		BuildingFractions:
			hpad: 8
			afld: 5
			gtwr: 8
			pbox: 5
			hbox: 3
			agun: 4
			sam: 2
			hsam: 2

	# ===== Fixed-Wing Aircraft — Russia =====
	# Fixed-wing called in via Supply Route — no AFLD needed to produce them
	UnitBuilderBotModule@russia.fixedwing:
		RequiresCondition: enable-ai-any && player.brics
		IdleBaseUnitsMaximum: 0
		SkipRearmBuildingCheck: true
		UnitQueues: Aircraft
		UnitsToBuild:
			MIG: 30
			FROG: 20
		UnitLimits:
			MIG: 2
			FROG: 2

	# experimental variant of the fixed-wing SquadManager. IMPORTANT: SquadManagerBotModule
	# is NOT air-only — FindNewUnits recruits EVERY IPositionable unit not in
	# ExcludeFromSquadsTypes, filing non-air/non-naval ones into GROUND attack
	# squads. Without excluding the capturer + non-combat support (already owned by
	# CaptureCoordinator / SupplyFollower) it would scoop up the capture TECN and
	# attack-move it at the enemy, overriding its CaptureActor order — so captures
	# never complete (POI-strategy Phase 2 finding). The exclusions below let the
	# goal-guarded capture actually finish.
	SquadManagerBotModule@experimental.russia.fixedwing:
		RequiresCondition: enable-ai-experimental && player.brics
		SquadSize: 2
		SquadSizeRandomBonus: 1
		RushInterval: 600
		AttackScanRadius: 48
		AirUnitsTypes: MIG, FROG
		IgnoredEnemyTargetTypes: Submarine, IgnoreThis
		# Phase 3: hand the ground pool to PoiOffensiveBotModule@experimental — this manager
		# keeps only its air squads (MIG/FROG). ExcludeFromSquadsTypes is now
		# belt-and-suspenders; IgnoreGroundUnits is the real hand-off.
		IgnoreGroundUnits: true
		ExcludeFromSquadsTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk
		# Phase 4b: pick air-squad airframes by UnitRoleResolver (Buildable AttackAir, non-heli) instead
		# of AirUnitsTypes above. Reproduces {MIG,FROG} today; AirUnitsTypes stays for the @stable twin.
		UseUnitRoles: true

	# ===== Helicopters — Russia =====
	# Helicopters are called in via Supply Route — no HPAD needed to produce them
	UnitBuilderBotModule@russia.heli:
		RequiresCondition: enable-ai-any && player.brics
		IdleBaseUnitsMaximum: 8
		SkipRearmBuildingCheck: true
		UnitQueues: Aircraft
		UnitsToBuild:
			HIND: 80
			MI28: 50
			HALO: 15
		UnitLimits:
			HIND: 4
			MI28: 3
			HALO: 2
		UnitDelays:
			HIND: 2500
			MI28: 3500
			HALO: 2500

	# ===== Fixed-Wing Aircraft — America =====
	# Fixed-wing called in via Supply Route — no AFLD needed to produce them
	UnitBuilderBotModule@america.fixedwing:
		RequiresCondition: enable-ai-any && player.nato
		IdleBaseUnitsMaximum: 0
		SkipRearmBuildingCheck: true
		UnitQueues: Aircraft
		UnitsToBuild:
			A10: 40
			F16: 30
		UnitLimits:
			A10: 2
			F16: 2

	# experimental variant — see the russia.fixedwing experimental note above. Excludes the capture
	# TECN + non-combat support so the fixed-wing/ground SquadManager stops
	# stealing the capturer mid-walk.
	SquadManagerBotModule@experimental.america.fixedwing:
		RequiresCondition: enable-ai-experimental && player.nato
		SquadSize: 2
		SquadSizeRandomBonus: 1
		RushInterval: 600
		AttackScanRadius: 48
		AirUnitsTypes: A10, F16
		IgnoredEnemyTargetTypes: Submarine, IgnoreThis
		# Phase 3: hand the ground pool to PoiOffensiveBotModule@experimental — keeps only its
		# air squads (A10/F16). IgnoreGroundUnits is the real hand-off; the exclude
		# list is now belt-and-suspenders.
		IgnoreGroundUnits: true
		ExcludeFromSquadsTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk
		# Phase 4b: pick air-squad airframes by UnitRoleResolver (Buildable AttackAir, non-heli) instead
		# of AirUnitsTypes above. Reproduces {A10,F16} today; AirUnitsTypes stays for the @stable twin.
		UseUnitRoles: true

	# ===== Helicopters — America =====
	# Helicopters are called in via Supply Route — no HPAD needed to produce them
	UnitBuilderBotModule@america.heli:
		RequiresCondition: enable-ai-any && player.nato
		IdleBaseUnitsMaximum: 8
		SkipRearmBuildingCheck: true
		UnitQueues: Aircraft
		UnitsToBuild:
			HELI: 80
			littlebird: 40
			TRAN: 15
		UnitLimits:
			HELI: 4
			littlebird: 2
			TRAN: 2
		UnitDelays:
			HELI: 2500
			littlebird: 2500
			TRAN: 2500

	# ===== Helicopter Squad Manager (shared, all factions EXCEPT experimental) =====
	# Split from the experimental twin below so the rearm-ready bypass is experimental-only.
	# The !enable-ai-experimental guard keeps this one instance per player (an experimental bot
	# would otherwise match BOTH blocks). Stable keeps this frozen default.
	HelicopterSquadBotModule:
		RequiresCondition: enable-ai-any && !enable-ai-experimental
		AttackSquadSize: 2
		AttackSquadSizeBonus: 1
		AttackCooldown: 900
		ScoutInterval: 400
		TransportInterval: 600
		TransportMinInfantry: 4
		MaxActiveSquads: 3

	# Experimental twin: identical config plus SkipRearmReadyCheck. WW3MOD attack helis only
	# refill at an hpad (none built), so the full-ammo readiness gate permanently benches any
	# heli below full ammo — no squad ever forms. The bypass lets experimental squads launch.
	HelicopterSquadBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		AttackSquadSize: 2
		AttackSquadSizeBonus: 1
		AttackCooldown: 900
		ScoutInterval: 400
		TransportInterval: 600
		TransportMinInfantry: 4
		MaxActiveSquads: 3
		SkipRearmReadyCheck: true
		StandoffEngagement: true
		# Influence stack Stage D: consume the per-player anti-air danger field so attack helis route
		# AROUND believed AA, leash their standoff to the AA-safe envelope, and withdraw/re-route the
		# moment a new AA lights up. Rides on StandoffEngagement above. Experimental-only.
		DangerFieldAvoidance: true
		# Forward-staging (experimental-only, default-frozen in C#): push idle attack helis that are
		# still loitering near the SR forward to ~40% of the SR->top-POI vector, so they stage toward
		# the fight instead of hovering at the SR corner. Pct clamped short of contact per the recon's
		# AA-attrition caveat. OFF for every non-experimental profile (shared base block sets nothing).
		ForwardStaging: true
		ForwardStagingPct: 40
		ForwardStagingMaxDistanceCells: 8

	# ===== Stable AI — frozen snapshot of the validated Experimental config =====
	#
	# These modules are a byte-for-byte copy of the Experimental (@experimental)
	# POI-layer config above, gated on `enable-ai-stable` instead of
	# `enable-ai-experimental`. Stable inherits the same normal-tier baseline
	# (enable-ai-player / enable-ai-any) as Experimental, so only the
	# Experimental-only modules need a Stable twin here.
	#
	# ONE EXCEPTION — PoiGoalGuard is NOT twinned: consumers fetch it via a single-instance
	# player.TraitOrDefault<PoiGoalGuard>() lookup, so a second instance on one player throws
	# at runtime. It is defined ONCE above, gated `enable-ai-experimental || enable-ai-stable`,
	# and thus SHARED (not independently frozen). MountedTransportBotModule WAS in this list but
	# is now split (@poi stable-frozen + @experimental twin) — its consumers were migrated to the
	# multi-safe TraitsImplementing<T>().FirstOrDefault(!IsTraitDisabled) lookup. Every other
	# strategic module below is an independent @stable copy. (SquadManager is likewise fetched via
	# TraitsImplementing<T>() — multi-safe — so its @stable twins are fine.)
	#
	# PROMOTION POLICY (see WORKSPACE/ai-bench/SPEC.md §13): the optimization loop only
	# ever edits the @experimental modules. When a change is validated (benchmark +
	# user acceptance), its settings are copied down into these @stable modules —
	# that promotion is the ONLY time this block changes. Keep the two blocks'
	# config values identical at each promotion.

	CaptureCoordinatorBotModule@stable.tecn:
		RequiresCondition: enable-ai-stable
		CapturingActorTypes: tecn,tecn.russia,tecn.america
		CapturableActorTypes: oilb,bio,miss,fcom,hosp,logisticscenter
		CheckCaptureTargetsForVisibility: false
		ScanInterval: 75
		MaximumCaptureTargetOptions: 12
		IncomeWeights:
			oilb: 50
			fcom: 100
			bio: 150
			miss: 10
			hosp: 20
		DefaultIncomeWeight: 10
		DistanceHalfLifeCells: 20
		SafetyEnemyScanRadiusCells: 6
		SafetyMultiplierSafe: 100
		SafetyMultiplierMild: 40
		SafetyMultiplierHostile: 10
		EscortSize: 2
		SupportRecruitRadiusCells: 40
		DefenseScanInterval: 150
		DefenseEnemyScanRadiusCells: 12
		DefenseFriendlyScanRadiusCells: 6
		DefenseSummonCount: 3
		DefenseEnemyValueThreshold: 200
		# Promoted from @experimental (post-S1 snapshot, SPEC §13): keep >=1 capturer
		# alive-or-pending. Validated by cycle-2 (capture 4/10->8/10, merged c6a71c14).
		TecnFloor: 1

	PoiOffensiveBotModule@stable:
		RequiresCondition: enable-ai-stable
		ReevaluateInterval: 100
		UnitsPerAxis: 8
		MinAxisSize: 3
		MaxAxes: 4
		AxisCommitmentTicks: 250
		ReassignScoreThresholdPct: 30
		RepathThresholdCells: 3
		ExcludeUnitTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, bradley, bmp2, m113
		# Promoted from @experimental (post-S1 snapshot, SPEC §13): dispersion doctrine —
		# spread to move, mass to assault. Validated by the exp-dispersion S1 non-regression
		# run (win 9/10, capture 9/10). Now the frozen Stable behaviour too.
		CohesionSwitchEnabled: true
		AssaultRadiusCells: 15
		ApproachCohesion: Spread
		AssaultCohesion: Tight

	PoiGarrisonBotModule@stable:
