		# Promoted from @experimental (post-S1 snapshot, SPEC §13): dispersion doctrine —
		# spread to move, mass to assault. Validated by the exp-dispersion S1 non-regression
		# run (win 9/10, capture 9/10). Now the frozen Stable behaviour too.
		CohesionSwitchEnabled: true
