	# ===== Helicopter Squad Manager (shared, all factions EXCEPT experimental) =====
	# Split from the experimental twin below so the rearm-ready bypass is experimental-only.
	# The !enable-ai-experimental guard keeps this one instance per player (an experimental bot
	# would otherwise match BOTH blocks). Normal/rush/turtle/stable keep the frozen default.
	HelicopterSquadBotModule:
		RequiresCondition: enable-ai-any && !enable-ai-experimental
		AttackSquadSize: 2
		AttackSquadSizeBonus: 1
		AttackCooldown: 900
		ScoutInterval: 400
		TransportInterval: 600
		TransportMinInfantry: 4
		MaxActiveSquads: 3

	# Experimental twin: identical config plus SkipRearmReadyCheck. WW3MOD attack helis only
	# refill at an hpad (none built), so the full-ammo readiness gate permanently benches any
	# heli below full ammo — no squad ever forms. The bypass lets experimental squads launch.
	HelicopterSquadBotModule@experimental:
		RequiresCondition: enable-ai-experimental
		AttackSquadSize: 2
		AttackSquadSizeBonus: 1
		AttackCooldown: 900
		ScoutInterval: 400
		TransportInterval: 600
		TransportMinInfantry: 4
		MaxActiveSquads: 3
		SkipRearmReadyCheck: true

	# ===== Stable AI — frozen snapshot of the validated Experimental config =====
	#
	# These modules are a byte-for-byte copy of the Experimental (@experimental)
	# POI-layer config above, gated on `enable-ai-stable` instead of
	# `enable-ai-experimental`. Stable inherits the same normal-tier baseline
	# (enable-ai-player / enable-ai-any) as Experimental, so only the
	# Experimental-only modules need a Stable twin here.
	#
	# ONE EXCEPTION — PoiGoalGuard is NOT twinned: consumers fetch it via a single-instance
	# player.TraitOrDefault<PoiGoalGuard>() lookup, so a second instance on one player throws
	# at runtime. It is defined ONCE above, gated `enable-ai-experimental || enable-ai-stable`,
	# and thus SHARED (not independently frozen). MountedTransportBotModule WAS in this list but
	# is now split (@poi stable-frozen + @experimental twin) — its consumers were migrated to the
	# multi-safe TraitsImplementing<T>().FirstOrDefault(!IsTraitDisabled) lookup. Every other
	# strategic module below is an independent @stable copy. (SquadManager is likewise fetched via
	# TraitsImplementing<T>() — multi-safe — so its @stable twins are fine.)
	#
	# PROMOTION POLICY (see WORKSPACE/ai-bench/SPEC.md §13): the optimization loop only
	# ever edits the @experimental modules. When a change is validated (benchmark +
	# user acceptance), its settings are copied down into these @stable modules —
	# that promotion is the ONLY time this block changes. Keep the two blocks'
	# config values identical at each promotion. Normal/Rush/Turtle stay frozen and
	# are never touched by the loop.

	CaptureCoordinatorBotModule@stable.tecn:
		RequiresCondition: enable-ai-stable
		CapturingActorTypes: tecn,tecn.russia,tecn.america
		CapturableActorTypes: oilb,bio,miss,fcom,hosp,logisticscenter
		CheckCaptureTargetsForVisibility: false
		ScanInterval: 75
		MaximumCaptureTargetOptions: 12
