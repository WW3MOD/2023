			frog: 2

	# experimental variant of the fixed-wing SquadManager. IMPORTANT: SquadManagerBotModule
	# is NOT air-only — FindNewUnits recruits EVERY IPositionable unit not in
	# ExcludeFromSquadsTypes, filing non-air/non-naval ones into GROUND attack
	# squads. Without excluding the capturer + non-combat support (already owned by
	# CaptureCoordinator / SupplyFollower) it would scoop up the capture TECN and
	# attack-move it at the enemy, overriding its CaptureActor order — so captures
	# never complete (POI-strategy Phase 2 finding). The exclusions below let the
	# goal-guarded capture actually finish.
	SquadManagerBotModule@experimental.russia.fixedwing:
		RequiresCondition: enable-ai-experimental && player.brics
		SquadSize: 2
		SquadSizeRandomBonus: 1
		RushInterval: 600
		AttackScanRadius: 48
		AirUnitsTypes: mig, frog
		IgnoredEnemyTargetTypes: Submarine, IgnoreThis
		# Phase 3: hand the ground pool to PoiOffensiveBotModule@experimental — this manager
		# keeps only its air squads (MIG/FROG). ExcludeFromSquadsTypes is now
		# belt-and-suspenders; IgnoreGroundUnits is the real hand-off.
		IgnoreGroundUnits: true
		ExcludeFromSquadsTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk
		# Phase 4b: pick air-squad airframes by UnitRoleResolver (Buildable AttackAir, non-heli) instead
		# of AirUnitsTypes for IsAirSquadUnit. AirUnitsTypes is still read UNCONDITIONALLY by TryToRushAttack
