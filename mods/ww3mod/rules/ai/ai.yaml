	# ===== Fixed-Wing Aircraft — Russia =====
	# Fixed-wing called in via Supply Route — no AFLD needed to produce them
	# BUGFIX (case-mismatch): actor names are lowercased at ruleset load (Ruleset.cs:126), but
	# UnitBuilderBotModule matches UnitsToBuild/UnitLimits/UnitDelays keys case-SENSITIVELY against them
	# (ChooseUnitToBuild :327 `b.Name == unit.Key`; the random path's `!UnitsToBuild.ContainsKey(name)`
	# :191). Uppercase keys (MIG/FROG/…) never matched -> these aircraft were UNBUILDABLE. Keys lowercased
	# to the actor names so the pool actually builds. Same case-mismatch family as the AirUnitsTypes bug.
	UnitBuilderBotModule@russia.fixedwing:
		RequiresCondition: enable-ai-any && player.brics
		IdleBaseUnitsMaximum: 0
		SkipRearmBuildingCheck: true
		UnitQueues: Aircraft
		UnitsToBuild:
			mig: 30
			frog: 20
		UnitLimits:
			mig: 2
			frog: 2
		# EXTERNAL-REQUEST CAP. This twin is where AdaptiveProductionBotModule's call-ins actually land for
		# BRICS: routing picks the first ENABLED twin, and this is the first one whose condition holds
		# (enable-ai-any covers BOTH @stable and @experimental). The FIFO lane it drains applies no
		# UnitsToBuild/UnitDelays/UnitLimits, and the composition ceiling cannot cover it either — this twin
		# sets no CompositionDirected, so compositionTypes is null and the ceiling exits at its first guard
		# for every type. Setting this makes an authored UnitLimits entry bind wherever it was WRITTEN
		# (mi28's cap lives on the .heli twin, not here), which is what stops an unbounded gunship buy.
		# Types with no authored limit are unaffected. AFFECTS @stable TOO — deliberate, see the commit.
		EnforceExternalRequestUnitLimits: true

	# experimental variant of the fixed-wing SquadManager. IMPORTANT: SquadManagerBotModule
	# is NOT air-only — FindNewUnits recruits EVERY IPositionable unit not in
	# ExcludeFromSquadsTypes, filing non-air/non-naval ones into GROUND attack
	# squads. Without excluding the capturer + non-combat support (already owned by
	# CaptureCoordinator / SupplyFollower) it would scoop up the capture TECN and
	# attack-move it at the enemy, overriding its CaptureActor order — so captures
	# never complete (POI-strategy Phase 2 finding). The exclusions below let the
	# goal-guarded capture actually finish.
	SquadManagerBotModule@experimental.russia.fixedwing:
