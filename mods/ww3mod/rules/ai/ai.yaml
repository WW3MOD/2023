		MainLineUnitTypes: e2.america, e2.russia, mt.america, mt.russia, aa.america, aa.russia, e4.america, e4.russia, abrams, t90, m109, paladin, grad, tos, m270, strykershorad, tunguska
		ExcludedActorTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk, humvee, btr, bradley, bmp2, m113

	SquadManagerBotModule@stable.russia.fixedwing:
		RequiresCondition: enable-ai-stable && player.brics
		SquadSize: 2
		SquadSizeRandomBonus: 1
		RushInterval: 600
		AttackScanRadius: 48
		AirUnitsTypes: MIG, FROG
		IgnoredEnemyTargetTypes: Submarine, IgnoreThis
		IgnoreGroundUnits: true
		ExcludeFromSquadsTypes: tecn, tecn.america, tecn.russia, e6, e6.america, e6.russia, truk

	SquadManagerBotModule@stable.america.fixedwing:
		RequiresCondition: enable-ai-stable && player.nato
		SquadSize: 2
		SquadSizeRandomBonus: 1
		RushInterval: 600
		AttackScanRadius: 48
		AirUnitsTypes: A10, F16
		IgnoredEnemyTargetTypes: Submarine, IgnoreThis
