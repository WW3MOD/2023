	#     ARE the @stable twins despite their legacy key names — re-gated 2026-09-02 from
	#     `!enable-ai-experimental` to an explicit `enable-ai-stable`. Keys kept to avoid churn in
	#     DOCS/bots/ and in NUnit fixtures that name them.
	#   * MountedTransportBotModule is split (@poi = stable, @experimental twin); consumers use the
