		# influence stack (InfluenceStack.cs), so the fog-legal capture levers below are LIVE, not inert.
		TecnFloor: 1
		TecnRequestStaleTicks: 200
		ScaleTecnFloorToPois: true
		TecnFloorMax: 5
		TecnRequestPriority: true
		# 2026-08-14: newly SET here (this twin previously omitted it, taking the inert engine default of 100).
		# @stable gets the reclaim lever, so it can enter the same spiral — a backlog that does not shrink pins
		# the floor at TecnFloorMax while TecnRequestPriority routes those buys ahead of combat production, with
		# the base already down. Adding the brake alongside the feature that needs it. SCOPED to the reclaim
		# increment in code, so with no reclaim candidates @stable's ordinary capture race is byte-identical to
		# leaving this unset — the benchmark control is not disturbed. See @experimental.tecn.
		TecnFloorArmyShareCapPct: 50
		CaptureFanoutEnabled: true
		UseTransportForDistantCaptures: true
		TransportCaptureMinDistanceCells: 12
