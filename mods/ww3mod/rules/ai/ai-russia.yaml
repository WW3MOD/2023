	# ===== Experimental AI — Russia ground production (early-econ PIPELINE 12) =====
	# CORRECTED 2026-09-02: this comment used to read "byte-for-byte copy of @russia.normal PLUS the
	# default-off early-econ gate ... Experimental-only; Stable keeps the frozen twin above." That is no
	# longer true in either half. The 2026-09-02 parity promotion synced @russia.normal UP to this block,
	# so the two are now field-identical and the early-econ gates below (behaviours 1 & 2) are LIVE ON
	# BOTH profiles. The engine flags still default false, so the two twins remain the only places they
	# turn on; @experimental is still the only block the optimization loop edits.
	#   * GateResupplyOnAmmoNeed — no FIRST supply truck while every truck-rearmable unit has full ammo;
	#     once one exists the demand-sized reserve buys freely (2026-08-17 split).
	#   * ScaleAntiAirToThreat — cap vehicle AA (tunguska) to OBSERVED enemy air; aa.russia (cheap AA
	#     infantry) stays ungated as the baseline picket.
	UnitBuilderBotModule@russia.experimental:
		RequiresCondition: enable-ai-experimental && player.brics
		UnitQueues: Vehicle, Infantry
		# ===== CAPTURE <-> COMBAT BUDGET SPLIT (combat-quality lever 3, production side) =====
		# STRATEGIC half of the capture/combat budget split (tactical half — capturer floor + escort reservation —
		# is on CaptureCoordinatorBotModule@experimental in ai.yaml). tecn.russia is the capturer share; every other
		# type is combat force. NOTE (engine): a UnitsToBuild weight is a share CEILING, not a priority — any weight
		# >= 100 never binds (only marks "always eligible", picked uniformly); the REAL cap on simultaneous capturers
		# is UnitLimits.tecn.russia below. To move budget toward combat: lower UnitLimits.tecn.russia and/or raise
		# throttled combat-type weights. Values below unchanged (no behaviour change until tuned).
		UnitsToBuild:
			# Conscripts -- low priority, mainly for capturing (the capture side of the budget split)
			tecn.russia: 500

			# Core infantry -- high priority mix
			e3.russia: 120
			ar.russia: 100
			tl.russia: 80
			e2.russia: 60

			# Support infantry
			at.russia: 50
			mt.russia: 40
			medi.russia: 40
			aa.russia: 30
			sn.russia: 25
			e6.russia: 20
			# Drone operator — mirror of the America block. THE WEIGHT IS NOT WHY THIS GETS BOUGHT,
			# MEMBERSHIP IS: this type is absent from UnitTargetShares and so is ineligible for the
			# directed pick (UnitBuilderBotModule.cs:328); it is reached through the FLOOR lane, and
			# ChooseBelowFloor gates on UnitsToBuild membership (:1299). See ai-america.yaml.
			dr.russia: 20
			# Special forces — mirror of ai-america.yaml, where the argument lives. Short version:
			# sf.russia is absent from UnitTargetShares (and UnitRoles), so under CompositionDirected
			# it is reachable only through the FLOOR lane, and ChooseBelowFloor gates on UnitsToBuild
			# membership (UnitBuilderBotModule.cs:1390). Without this line the floor entry is inert.
			# 10 mirrors mnly, the other 600-cost flat-floored specialist. SF.russia carries a faction
			# prerequisite (~player.russia, infantry-russia.yaml:102), so the twins field their own.
			sf.russia: 10

			# Vehicles -- balanced force composition
			btr: 30
			bmp2: 25
			t90: 20
			giatsint: 15
			tunguska: 10
			grad: 10
			# Minelayer — mirror of ai-america.yaml, where the argument lives. Short version: mnly is
			# absent from UnitTargetShares, so under CompositionDirected it is reachable only through
			# the FLOOR lane, and ChooseBelowFloor gates on UnitsToBuild membership. Without this line
			# the floor entry below is inert. MNLY carries no faction prerequisite (vehicles.yaml:494 —
			# `~techlevel.medium` only), so both twins field the same unit.
			mnly: 10
			# Counter-battery radar — mirror of the America block. MEMBERSHIP, NOT WEIGHT: absent from
			# UnitTargetShares, reached through the FLOOR lane, which gates on UnitsToBuild membership
			# (UnitBuilderBotModule.cs:1390). MSAR is faction-neutral — it carries no `Buildable: Factions:`
			# and neither vehicles-america.yaml nor vehicles-russia.yaml overrides it — so both twins get it.
			msar: 10

			# Supply trucks for field resupply (need-gated below)
			truk: 20

		UnitLimits:
			# 12, not 4: only the absolute backstop above SupplyTruckCeiling (6) — see SupplyDemandSizing
			# below. The headroom is for spent hulls, which this limit counts and the fleet target does not.
			truk: 12
			tecn.russia: 3
			e6.russia: 2
			giatsint: 3
			grad: 2
			tunguska: 2
			sn.russia: 3
			# User ruling 2026-08-27: "just a couple or so is enough usually". Hard ceiling behind the
			# floor cap; both are 2 so the floor is the only thing that moves.
			dr.russia: 2
			# ONE minelayer, ever — mirror of ai-america.yaml. Erring low: 600 is not a cheap
			# specialist, the module commits at most one unit per field, and no live match has shown
			# what a second would add.
			mnly: 1
			# ONE — mirror of the America block. Coverage does not stack: a second MSAR inside the first
			# one's 42-cell disc reveals nothing new, so number two is ~zero value against 1600 of budget.
			msar: 1
			# Special forces: 2 — mirror of ai-america.yaml. Cap sits one above the floor of 1, so
			# the second SF can only arrive if some other lane asks, and today none does (sf is
			# absent from UnitTargetShares). Effectively a cap of 1 in the shipped configuration.
			sf.russia: 2
		# ===== STANDING-POPULATION FLOORS (experimental-only; C# default is unset) =====
		# Mirror of the America block — see ai-america.yaml for the full measurement. Short version: a
		# per-mille-of-VALUE target cannot hold a small type on the map (one medic is already 34 per-mille of
		# the 2,900-value starting platoon against a 9 per-mille target), and under losses the argmax never
		# descends to a specialist slot at all — measured ZERO medics bought in 200 cycles at a 1-in-40 loss
		# rate. aa.russia is the AA SOLDIER, ungated, and fails the same way; tunguska is the AA VEHICLE and is
		# capped (not floored) by ScaleAntiAirToThreat. Counts owned + in-cargo + pending.
		# NOT LISTED, DELIBERATELY: tecn.russia — a technician floor already exists in
		# CaptureCoordinatorBotModule.MaintainTecnFloor, demand-gated on CaptureTargetExists(). See
		# ai-america.yaml for why a second floor on the same population would be a drift hazard.
		UnitFloors:
			medi.russia: 2
			aa.russia: 2
			# Minelayer — FLAT, no UnitFloorPer, held off by UnitDelays instead. The aa.russia pattern,
			# not the medi/dr one. Full argument in ai-america.yaml: one minelayer is enough at any
			# army size, so a per-N-soldiers denominator would be a number invented purely to act as an
			# opening-buy guard, and a mis-set denominator is precisely how this file has twice shipped
			# a floor that silently never fires. ORDINAL: aa < dr < medi < mnly < msar < sf, so the
			# minelayer is bought after every cheap specialist and before only the radar and the SF
			# when several are short at once.
			mnly: 1
			# Drone operator — "they make none" is a FLOOR problem, not a weight problem. Cap, not
			# target; the ratio below decides when it actually engages.
			dr.russia: 2
			# Counter-battery radar — mirror of ai-america.yaml, where the full argument lives. Short
			# version: a per-mille share provably cannot buy a 1600-cost single-copy specialist (the
			# argmax never descends to a small slot — measured ZERO medics/snipers/engineers in 200
			# cycles at a 1-in-40 loss rate), so it takes the floor lane. Ordinal sort puts msar fifth
			# of the six floored types here too (aa.russia < dr.russia < medi.russia < mnly < msar <
			# sf.russia), so it pre-empts only the SF — but at t=0 every type ahead of it is held off
			# by a delay or a zero denominator, so the walk reaches msar and it becomes the opening
			# buy. UnitDelays.msar below is what prevents that and is MANDATORY, not defensive.
			msar: 1
			# Special forces — FLAT, no UnitFloorPer, held off by UnitDelays instead: the mnly
			# pattern, not the medi/dr one. Full argument in ai-america.yaml. Short version: one SF
			# is a raid capability rather than a per-N-soldiers support ratio, so there is no honest
			# denominator to pick, and inventing one risks the silently-inert floor this file has
			# twice shipped. ORDINAL: aa < dr < medi < mnly < msar < sf, so the SF is the last of the
			# six bought when several are short at once.
			sf.russia: 1
		# ===== THE FLOOR NEEDS A DENOMINATOR (user report 2026-08-15) — mirror of the America block =====
		# See ai-america.yaml for the full argument and the measurement. Short version: a flat floor is
		# maximally unmet at t=0 and the pre-empt outranks the ceiling and every demand gate, so a cheap
		# floored support type is GUARANTEED to be the opening call-in, not merely allowed to be. Measured on
		# the shipped default start class: cycles 0 and 1 both buy medi.russia. This is the second instance of
		# the defect that first showed up as two supply trucks (PIPELINE 57(a)).
		# The floor is min(2, supported/N), so there are no medics below N soldiers and the opening call-ins go
		# to line infantry instead.
		# 10, NOT 20 — re-derived 2026-08-17, mirror of the America block; the full sweep, the cliff argument
		# and the caveats live there. Short version: 20 was checked on the end-of-run snapshot, and on the
		# run-integrated metric it is INERT rather than conservative. EffectiveFloor is min(cap, supported/N),
		# so the floor is zero on every cycle where supported < N, and russia's standing infantry force peaks
		# at 18 under attrition 15 and 19 under attrition 20 — `engaged 0/200 cycles`, the floor never fired.
		# Measured at 20 -> 10, mean standing medics and cycles with NO medic: attrition 15 0.07 -> 0.94 and
		# 93% -> 6%; attrition 20 0.10 -> 0.95 and 90% -> 5%; attrition 25 0.83 -> 0.98 and 17% -> 4%;
		# attrition 35 0.98 -> 1.89 and 2% -> 0%. At 20 the bot bought ZERO medics in 200 cycles at attrition
		# 15 (`first-buy NEVER`) — the starting medic died and was never replaced.
		# 10 is the smallest ratio that still keeps the medic out of the opening buys under both start classes;
		# 6 and 8 put it back at cycle 1 with --start platoon. The cap of 2 is unchanged.
		UnitFloorPer:
			medi.russia: 10
			# Drone operator: 8 — mirror of the America block, where the full sweep and the cliff
			# argument live. The denominator is CountSupportedForce() over UnitFloorSupportedTypes and
			# is SHARED with the medic, and Russia measures within 0.6 of America at every attrition
			# level (--composition-plan --start none, 200 cycles, 2026-08-27: mean/max supported
			# 8.88/11 at attrition 15, 12.90/16 at 20, 16.23/20 at 25, 21.32/27 at 35), so one ratio
			# serves both twins. 12 would be INERT at attrition 15 — the denominator never reaches it
			# — which is the medic's per-20 defect and would hand back "they make none" in exactly the
			# regime where recon matters most. 6 reaches the cap of 2 in every ordinary regime and
			# overshoots "just a couple or so". Same unmeasured gap as America: --composition-plan
			# models only UnitTargetShares members, so dr's own buy sequence is NOT modelled here.
			# Ordering is readable, not unknown: floorTypes is ordinal-sorted
			# (UnitBuilderBotModule.cs:529) and ChooseBelowFloor takes the first type under its floor
			# (:1293), so aa.russia < dr.russia < medi.russia — the operator is bought BEFORE the
			# medic when both are short. Under a lobby-selected platoon start that would make it the
			# opening support call-in — GUARDED by UnitDelays.dr.russia below rather than tolerated;
			# see ai-america.yaml, where the full argument lives.
			dr.russia: 8
		# Denominator: every non-medic infantry type, matching the medi share derivation in ai-america.yaml so
		# the floor and the 17-per-mille share express ONE ratio rather than two. aa.russia deliberately has
		# no ratio — its denominator is enemy AIR, not own army size, and UnitDelays 2000 below is the
		# instrument for that.
		UnitFloorSupportedTypes: e3.russia, ar.russia, tl.russia, e2.russia, at.russia, mt.russia, aa.russia, sn.russia, e6.russia, tecn.russia
		# Unconditional [composition] census into debug.log every 40 bot ticks. C# default is 0; this is
		# the opt-in. Observability only — reads state, changes no decision.
		CensusLogInterval: 40
		# Mirror of the America block. `^AA` is air-only (single MANPAD armament, `ValidTargets: Air`), so an
		# AA soldier at t=0 cannot shoot anything — the delay holds the floor until 2000, and 2000 is derived
		# from the attack-heli gate both factions already carry (`UnitDelays: hind/mi28/heli: 2500`), i.e. the
		# earliest tick an enemy airframe can even be ordered. The medic floor is undelayed (useful from first
		# contact).
		UnitDelays:
			aa.russia: 2000
			# Minelayer — mirror of ai-america.yaml, where the reasoning lives. Flagged here too because
			# it matters: unlike the aa.russia figure above, 3000 is a REASONED ESTIMATE and not a
			# derivation. No bot has ever fielded a minelayer. It exists because the floor above is
			# flat, and a flat floor pre-empt outranks every gate — so without it a 600-cost minelayer
			# would be a guaranteed opening call-in ahead of line infantry.
			mnly: 3000
			# Platoon-start guard for the drone operator — mirror of ai-america.yaml, where the full
			# argument lives. Short version: UnitDelays is an absolute world-tick opening consulted by
			# the floor lane too (UnitBuilderBotModule.cs:1302), and it is the only instrument that can
			# outrank a floor pre-empt. It costs exactly zero under the shipped
			# StartingUnitsClass = "none", because the denominator starts at 0 and eight supported line
			# infantry cannot be standing on the map within 300 ticks (18 s at 16.667 ticks/s). It
			# binds only under a lobby-selected platoon start, where the denominator opens at 11 and
			# the operator would otherwise be the opening support call-in ahead of the first medic.
			dr.russia: 300
			# Counter-battery radar gate — mirror of ai-america.yaml, where the derivation lives. Short
			# version: without this the MSAR is the opening buy of every match, because the floor
			# pre-empt outranks the ceiling and every demand gate and nothing else is eligible at t=0. A
			# UnitFloorPer ratio cannot do the job — cap 1 makes it a step function at supported == N,
			# and the shared denominator's max is 9/11 at attrition 12/15, so N above ~9 is inert while
			# N at or below 9 phases a 1600-cost specialist in alongside the 150-cost drone. 3000 sits
			# above the 2500 attack-heli gate (180 s at 16.667 ticks/s) and is a floor-clearing constant,
			# NOT a measured optimum: neither grad nor m109 carries a tick gate, so there is no
			# earliest-artillery tick to derive from the way aa.russia: 2000 derives from the heli gate.
			msar: 3000
			# Special forces: 3000 — mirror of ai-america.yaml, where the reasoning lives. Flagged
			# here too because it matters: unlike aa.russia above, this is a REASONED ESTIMATE and
			# not a derivation. It exists because the floor above is flat and a floor pre-empt
			# outranks every gate, so without it a 600-cost SF — six line riflemen of early tempo —
			# would be a guaranteed opening call-in ahead of the infantry the user asked for at the
			# start. 3000 is mnly's constant because mnly is the true comparable (the other 600-cost
			# flat-floored specialist gated by delay alone); dr's 300 is not, as that guard leans on
			# a per-8 denominator sf does not have. May be slightly late by ~640 ticks, the minelayer
			# module's scan lag, which sf has no equivalent of; if so this moves DOWN first.
			sf.russia: 3000
		# Early-econ behaviour 1: don't call in the FIRST truck while no fielded unit needs ammo. After that
		# truck exists the standing reserve below governs alone and this no longer binds (user ruling
		# 2026-08-17 — full reasoning in ai-america.yaml's SupplyTruckFloorPer block).
		GateResupplyOnAmmoNeed: true
		ResupplyUnitTypes: truk
		# ===== DEMAND-SIZED SUPPLY FLEET =====
		# Mirror of the America block — see ai-america.yaml for the full rationale and the measurement. Short
		# version: UnitTargetShares: truk: 40 is a share of army VALUE, which caps a 1000-cost truck at one per
		# 25,000 value of army, so the bot ran a single truck all match while infantry starved. Logistics is
		# sized by customers, not by budget share. Tune DOWN via SupplyDemandOvercompensationPercent.
		SupplyDemandSizing: true
		SupplyStarvingThresholdPerMille: 250
		SupplyCustomersPerTruck: 6
		SupplyDemandOvercompensationPercent: 200
		# HISTORY, kept because the reasoning was right about t=0 and wrong about the rest of the match: this
		# was 2, then 0. USER RULING 2026-08-14 "no supply truck until at least one unit is below full ammo",
		# and the live census read `truk=0+0/909v40` at tick 40 because the floor's two trucks were the first
		# two call-ins of the match. Setting it to 0 fixed that opening and created the opposite defect.
		# ===== THE FLOOR NEEDS A DENOMINATOR (2026-08-17) — mirror of the America block =====
		# See ai-america.yaml for the full derivation. Short version: setting the floor to 0 deleted the
		# truck's only ceiling-EXEMPT route. V_fit for a 1000-cost truck at a 40 per-mille target is 25,000
		# army VALUE; below that, one truck already puts the slot over target and ApplyCeilingEligibility
		# strikes it, so the deficit route holds at most one. Measured offline (--composition-plan --start
		# none, russia): standing trucks 3 with no losses, 1 at --attrition 40, 0 at --attrition 15.
		# A constant can only pick one of the two failures (2 = trucks at t=0, 0 = no fleet all match). The
		# floor is now min(3, customers/10) via SupportFloorMath.EffectiveFloor — the same function the medic
		# floor uses — so it is ZERO with no infantry and non-zero once there is an army to feed.
		# Denominator is infantry as a fact about the ruleset: `RearmActors: truk, logisticscenter` appears
		# only on infantry; vehicles rearm from logisticscenter, aircraft from hpad/afld. `^PILOT` (ejected
		# aircrew) also qualifies and is invisible to the offline model, so the live floor phases in a little
		# earlier than the measured numbers say.
		# 10 rather than SupplyCustomersPerTruck's 6 because that one sizes the SURGE from men already dry and
		# this sizes the STANDING RESERVE. The value is MEASURED on dry-cycle fraction, not picked — russia at
		# attrition 15 reads dry 12% / 13% / 16% of cycles at per 8 / 10 / 12, and the mean fleet at attrition
		# 35 reads 2.33 / 1.72 / 1.57. 10 takes almost all of 12's restraint for a fraction of its outages.
		# Do NOT tune this against the end-of-run `standing` column; see ai-america.yaml for why that number
		# is close to a coin flip for a continuously-replaced type.
		# No cash term, per the 2026-08-17 user ruling that the bot must adapt to any settings — V_fit is a
		# share of army value, so the fix has to be cash-free to work at both ends of the starting-cash range.
		# `dry` HAS A RAMP FLOOR: the opening cycles before the first buy count as dry, so russia's floor is 13
		# and the metric is SATURATED (cannot discriminate) at every attrition level except 15/20/25. Raw dry
		# figures therefore overstate outage by ~6 points; mid-match outage at attrition 15 is 28% -> 7%, and
		# at attrition 35/40 it reaches zero. See ai-america.yaml for the full table.
		# THIS FLOOR NO LONGER SWITCHES GateResupplyOnAmmoNeed OFF — resolved 2026-08-17 by splitting the two
		# rulings by SCOPE: the FIRST truck obeys "no supply truck until at least one unit is below full ammo"
		# literally (this floor is ignored until one exists), and every truck after it is governed by this
		# floor alone. The switch is a latch, so a mid-match fleet wipe cannot re-arm the gate and stall the
		# rebuild. Full reasoning and the cost in ai-america.yaml; predicate pinned in SupplyPrecedenceMathTest.
		# The dry-cycle figures above cannot see this: --composition-plan has no ammo model, so it reports the
		# floor from cycle one and real opening outage is longer than any raw `dry` number.
		# When SupplyTruckFloorPer is 0 the path is the pre-feature one by construction: EffectiveFloor returns
		# its flatFloor argument literally, so the module passes exactly what it passed before.
		SupplyTruckFloor: 3
		SupplyTruckFloorPer: 10
		SupplyTruckCeiling: 6
		# ===== RESUPPLY PRECEDENCE (user ruling 2026-08-15) — mirror of the America block =====
		# See ai-america.yaml for the full measurement and the derivation of the stall tolerance.
		# Short version: zero trucks were ordered for a whole match while men were demonstrably dry. On the
		# measured seed the binding constraint was AFFORDABILITY alone — the demand gate was already open and
		# correctly sized (trucks-desired=2 from the first ammo-need snapshot), and the pre-empt was reached
		# and skipped purely on price for 110 consecutive snapshots. SupplyPrecedenceStallCycles lets the path
		# buy NOTHING and bank, which is the only move that expresses "this comes first".
		# SupplySizeFromNeed is a robustness fix rather than the unblocker: the two bars genuinely diverge
		# (measured needy=13 against starving=1 in one snapshot), but on this seed the starving bar had
		# already opened the gate. Do not cite it as the root cause.
		# THE BOUND IS ON PROGRESS, NOT ON TIME: a cycle count cannot terminate (its reset on fall-through
		# makes "N silent cycles, one buy, forever" the steady state for a poor player) and its fall-through
		# purchase is priced BY the savings, so it destroys them. Banking now continues only while cash sets
		# new highs and abandons after 4 consecutive cycles without one — which also means it gives up
		# quickly when another spender is draining the shared treasury, rather than holding production silent
		# against money it does not control.
		# NOT a restored SupplyTruckFloor — gated on live demand, inert against a full-ammo army at t=0.
		# @stable unaffected: both read only under SupplyDemandSizing, and both default to baseline in C#.
		SupplySizeFromNeed: true
		SupplyPrecedenceStallCycles: 4
		# Early-econ behaviour 2: vehicle AA proportionate to observed air (aa.russia ungated picket).
		ScaleAntiAirToThreat: true
		AntiAirUnitTypes: tunguska
		AntiAirBaseline: 0
		AntiAirPerObservedAir: 1
		# ===== COMPOSITION-DIRECTED PURCHASING (experimental-only; C# default is false) =====
		# Mirror of the America block — see ai-america.yaml for the full rationale. Short version: with
		# IgnoreGroundUnits on both @experimental SquadManagers, buildRandom is always true, so every
		# ground call-in was a uniform lottery and the standing army settled proportional to each type's
		# LIFETIME (long-lived rear-line mortars accumulate). This buys the type furthest below target.
		CompositionDirected: true
		# Stops the two lanes that bought PAST the targets (declined cycle instead of a lottery fallback, and
		# the counter-buy FIFO folded under the targets). It does NOT change the deficit pick — restricting
		# that argmax to under-target slots is a provable no-op. Mirror of the America block; see
		# ai-america.yaml for the full rationale, and CompositionCeilingExemptTypes for the capturer carve-out.
		CompositionEnforceTargetCeiling: true
		CompositionCeilingExemptTypes: tecn.russia
		# TARGETS (not ceilings): per-mille of army VALUE. Sums to 1000. Helicopters are deliberately
		# absent (deferred to their own lane) and so are never chosen by this pick.
		#
		# PROVISIONAL RETUNE (2026-08-05, baseline-bulk direction) — REVIEW AT MERGE. Identical infantry block
		# to America (same costs, same roles); the infantry total is unchanged at 450 and only its internal
		# split moved — line infantry 65% -> 80% of infantry HEAD count.
		UnitTargetShares:
			# Armour core.
			t90: 190
			bmp2: 140
			# Screen / lift (BTR covers the humvee + m113 roles NATO splits).
			btr: 70
			# Indirect fire.
			giatsint: 35
			grad: 25
			# Air defence (tunguska additionally stays capped by ScaleAntiAirToThreat above).
			tunguska: 50
			truk: 40
			# ===== Line infantry — the BULK of the foot force (80% of infantry head count) =====
			e3.russia: 95
			ar.russia: 78
			tl.russia: 62
			e2.russia: 47
			# ===== Support infantry — small fractions of the line, not a second army =====
			at.russia: 66
			# mt.russia is the type that was drifting; this is the deliberate cap-by-target.
			mt.russia: 37
			aa.russia: 28
			# Specialists and logistics (each additionally bounded by UnitLimits above).
			sn.russia: 12
			# 17, was 9 — mirror of America. USER RULING 2026-08-14: one medic per ~20-soldier platoon. That is
			# a ratio, so it belongs in the share; 9 per-mille worked out at one medic per ~85 soldiers. See
			# ai-america.yaml for the derivation. The vector sums to 1008 and SharesPerMille renormalises it.
			medi.russia: 17
			e6.russia: 8
			tecn.russia: 8
		# Role tokens — the row/column keys for CounterMatrixPct below. Armour line and foot line are
		# SEPARATE tokens on purpose: sharing one "frontline" token would make believed enemy infantry
		# raise the T-90 target by exactly as much as the rifleman target. Likewise mt (infantry mortar)
		# is split from the giatsint/grad tube+rocket artillery — both are indirect fire, but only mt is
		# the type that was drifting.
		UnitRoles:
			t90: armorline
			bmp2: armorline
			e3.russia: infantryline
			ar.russia: infantryline
			tl.russia: infantryline
			e2.russia: infantryline
			at.russia: antitank
			tunguska: antiair
			aa.russia: antiair
			mt.russia: mortar
			giatsint: artillery
			grad: artillery
			btr: recon
			sn.russia: recon
			truk: support
			medi.russia: support
			e6.russia: support
			tecn.russia: support
		# Counter bias (v1, minimal) — believed enemy class -> own role, fog-legal (belief store only).
		# Believed enemy infantry answers the FOOT line, not the armour line.
		CounterMatrixPct:
			air>antiair: 60
			armor>antitank: 40
			infantry>infantryline: 20
