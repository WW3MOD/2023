			msar: 3000
			# ===== SPECIAL FORCES: 3000, AND THIS IS A REASONED ESTIMATE, NOT A MEASUREMENT =====
			# Said plainly because aa.america above IS derived (from the 2500 attack-heli gate) and it
			# would be easy to read this line as carrying the same authority. It does not.
			# WHY A DELAY AT ALL: the floor above is flat and a floor pre-empt OUTRANKS the target
