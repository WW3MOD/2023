		# @stable is UNAFFECTED: it sets neither SupplyDemandSizing nor SupplyTruckFloor, and
		# SupplyFleetUnderDesired returns false outright when the flag is off — @stable never had a truck floor.
		# ===== THE FLOOR NEEDS A DENOMINATOR — same defect as the medic, opposite symptom (2026-08-17) =====
		# Everything above this line is why the floor went to 0. It is kept because the reasoning was right
		# about t=0 and wrong about the rest of the match, and the distinction is the whole fix.
