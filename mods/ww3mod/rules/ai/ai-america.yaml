			# nothing to do with an infantryman, and an unanchored delay constant is precisely why
			# the sniper floor was dropped from this block.
			# WHERE IT MAY BE WRONG, AND IN WHICH DIRECTION: mnly's 3000 includes ~640 ticks of
			# module scan time before the first field is laid. SF has no module (deliberately out of
			# scope here) and fights the moment it arrives, so it has a case for being EARLIER than
			# the minelayer by roughly that margin. 3000 is kept rather than shaving to ~2360
			# because that would be false precision on an unmeasured quantity; if SF proves to be
