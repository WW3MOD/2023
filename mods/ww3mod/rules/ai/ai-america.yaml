	# ===== Experimental AI — America ground production (early-econ PIPELINE 12) =====
	# CORRECTED 2026-09-02: this comment used to read "byte-for-byte copy of @america.normal PLUS three
	# default-off gates ... Experimental-only condition; Stable keeps the frozen twin above. The engine
	# flags default false, so this block is the ONLY place they turn on." None of that holds now. The
	# 2026-09-02 parity promotion synced @america.normal UP to this block AS OF THAT PROMOTION (main @
	# 26f9cec0), so the early-econ gates below (behaviours 1 & 2) are LIVE ON BOTH profiles. The engine
	# flags still default false, so the two twins remain the only places they turn on; @experimental is
	# still the only block the optimization loop edits.
	#   * GateResupplyOnAmmoNeed — no FIRST supply truck while every truck-rearmable unit has full ammo;
	#     once one exists the demand-sized reserve buys freely (2026-08-17 split).
	#   * ScaleAntiAirToThreat — cap vehicle AA (strykershorad) to OBSERVED enemy air; aa.america
	#     (cheap AA infantry) stays ungated as the baseline picket.
	#
	# THE TWINS ARE NO LONGER FIELD-IDENTICAL, BY DESIGN — do not "fix" the gap by copying values down.
	# The promotion snapshot is the TOURNAMENT CONTROL, and post-promotion @experimental work is what is
	# being priced against it, so improvements land here only and reach @stable at the NEXT promotion.
	# USER RULING 2026-09-02: CLAUDE.md's "@stable inherits improvements" rule applies AT promotions, not
	# continuously between them. Diverged so far: composition v2 — the three CounterMatrixPct cells
	# (armor>armorline, infantry>artillery, infantry>mortar), TradeFeedback*, and MinGroupSizes. The last
	# two also default off in C#, so @stable would sit at baseline for them either way; the counter matrix
	# is the one where @stable carries its own older live tuning rather than nothing.
	UnitBuilderBotModule@america.experimental:
		RequiresCondition: enable-ai-experimental && player.nato
		UnitQueues: Vehicle, Infantry
		# ===== CAPTURE <-> COMBAT BUDGET SPLIT (combat-quality lever 3, production side) =====
		# These weights + UnitLimits are the STRATEGIC half of the capture/combat budget split (the tactical half —
		# capturer floor + escort reservation — is on CaptureCoordinatorBotModule@experimental in ai.yaml). The
		# capturer share is tecn.america here; every other type is combat force. NOTE (engine): a UnitsToBuild weight
		# is a share CEILING, not a priority — any weight >= 100 never binds, so it only marks a type "always eligible"
		# (picked uniformly), and the REAL cap on simultaneous capturers is UnitLimits.tecn.america below. To move
		# budget toward combat: lower UnitLimits.tecn.america (fewer capturers on the map) and/or raise combat-type
		# weights that currently sit below the roster average (throttled). Values below are unchanged (no behaviour
		# change until tuned).
		UnitsToBuild:
			# Conscripts -- low priority, mainly for capturing (the capture side of the budget split)
			tecn.america: 500

			# Core infantry -- high priority mix
			e3.america: 120
			ar.america: 100
			tl.america: 80
			e2.america: 60

			# Support infantry
			at.america: 50
			mt.america: 40
			medi.america: 40
			aa.america: 30
			sn.america: 25
			e6.america: 20
			# Drone operator. THE WEIGHT IS NOT WHY THIS GETS BOUGHT — MEMBERSHIP IS. This type is
			# deliberately absent from UnitTargetShares below, so it is ineligible for the directed
			# pick (CompositionDirected and CompositionEnforceTargetCeiling are both on, and only
			# UnitTargetShares members are eligible — UnitBuilderBotModule.cs:328). It is reached
			# through the FLOOR lane instead, and ChooseBelowFloor gates on UnitsToBuild membership
			# (:1299), which is what this line buys. The weight itself only acts as a share ceiling
			# in the legacy uniform lottery (:1610).
			dr.america: 20
			# Special forces. MEMBERSHIP, NOT THE WEIGHT — the same arithmetic spelled out on
			# dr.america above. sf.america is deliberately absent from UnitTargetShares (and from
			# UnitRoles), so under CompositionDirected + CompositionEnforceTargetCeiling it is
			# ineligible for the deficit pick and is reached ONLY through the floor lane, which gates
			# on UnitsToBuild membership (UnitBuilderBotModule.cs:1390). Without this line the floor
			# entry below is inert. 10 mirrors mnly, the other 600-cost flat-floored specialist.
			sf.america: 10

			# Vehicles -- balanced force composition
			humvee: 30
			bradley: 25
			abrams: 20
			m113: 15
			m109: 15
			strykershorad: 10
			# Minelayer. MEMBERSHIP, NOT THE WEIGHT, IS WHY THIS GETS BOUGHT — the same arithmetic
			# spelled out on dr.america above. mnly is deliberately absent from UnitTargetShares below,
			# so with CompositionDirected + CompositionEnforceTargetCeiling both on it is ineligible for
			# the deficit pick; it is reached only through the FLOOR lane, and ChooseBelowFloor gates on
			# UnitsToBuild membership. Without this line the floor entry below is inert.
			mnly: 10
			# Counter-battery radar. MEMBERSHIP, NOT WEIGHT — same lane as dr.america above: absent from
			# UnitTargetShares, so ineligible for the directed pick, and reached through the FLOOR lane,
			# which gates on UnitsToBuild membership (UnitBuilderBotModule.cs:1390).
			msar: 10

			# Supply trucks for field resupply (need-gated below)
			truk: 20

		UnitLimits:
			# 12, not 4: this is now only the absolute backstop above SupplyTruckCeiling (6) — see
			# SupplyDemandSizing below. It must sit clear of the ceiling or it, not demand, sizes the fleet.
			# The headroom over 6 is for SPENT HULLS: this limit counts every truk actor, while the fleet
			# target counts only trucks that still hold supply, and a drained truck lingers until the
			# follower's evac/sell path removes it. Too little headroom and a few hulls freeze procurement.
			truk: 12
			tecn.america: 3
			e6.america: 2
			m109: 3
			strykershorad: 2
			sn.america: 3
			# User ruling 2026-08-27: "just a couple or so is enough usually". This is the hard
			# ceiling behind the floor cap; both are 2 so the floor is the only thing that moves.
			dr.america: 2
			# ONE minelayer, ever. Erring low deliberately: 600 is not a cheap specialist (4x the drone
			# operator), the module commits at most MaxPerAssign: 1 unit per field anyway, and no live
			# match has yet shown what a second one would add. Cap and floor are both 1, so as with
			# dr.america the floor is the only thing that moves.
			mnly: 1
			# ONE, and one is the whole design. The radar's output is COVERAGE, and coverage does not
			# stack: a second MSAR inside the first one's 42-cell disc reveals nothing the first did not,
			# so the marginal value of number two is nearly zero against 1600 of budget. Both the floor
			# and this limit are 1, so the floor is the only thing that moves.
			msar: 1
			# Special forces: 2, deliberately low for a 600-cost elite. Cap sits one above the floor
			# of 1, so unlike dr/mnly there IS one slot the floor does not pin — the second SF can
			# only ever arrive if some other lane asks for it, and today no lane does (sf is absent
			# from UnitTargetShares). In the shipped configuration this is effectively a cap of 1
			# with headroom reserved for the infiltration module that is NOT part of this change.
			sf.america: 2
		# ===== STANDING-POPULATION FLOORS (experimental-only; C# default is unset) =====
		# USER RULING 2026-08-14: "build medics", and "there is always an AA soldier or two on the field".
		# A UnitTargetShares entry CANNOT deliver either, and the reason is arithmetic, not tuning. Shares are
		# per-mille of army VALUE, so one unit of a type only fits under its target once the army is worth
		# 1000*cost/target: medi.america at 9 per-mille needs a 11,111-value army before a SINGLE medic is
		# under target, and the starting platoon is worth 2,900 — so the one medic you start with is already
		# 34 per-mille, the ceiling strikes the slot, and it stays struck. Worse under losses: MEASURED offline
		# (--composition-plan, 200 cycles) medics are bought 4x with no losses and ZERO times at a
		# 1-in-40-per-cycle loss rate, because the big slots (abrams 190, e3 95) stay permanently in deficit
		# and the argmax never descends to a 9-per-mille slot. Live @experimental match, 6 sim-minutes: the
		# surviving bot ended with medi.america=0+0 — dead and never replaced.
		# aa.america is the AA SOLDIER and is ungated; it rides the same argmax and fails the same way. It is
		# NOT what ScaleAntiAirToThreat covers — that gate names strykershorad, the AA VEHICLE, and it is a CAP
		# not a floor (see AntiAirBaseline below).
		# The floor pre-empts the deficit pick, so it outranks the target ceiling and the demand gates. It
		# counts owned + IN-CARGO + pending: aa/medi are both PassengerTypes on MountedTransportBotModule and
		# boarding REMOVES a passenger from world.Actors, so a world-only count would buy replacements forever
		# to feed transports.
		# NOT LISTED HERE, DELIBERATELY: tecn.america. A technician floor ALREADY EXISTS, in another module —
		# CaptureCoordinatorBotModule.MaintainTecnFloor (TecnFloor / TecnFloorMax / ScaleTecnFloorToPois),
		# which requests through IBotRequestUnitProduction and so is invisible from this trait's vantage. It is
		# a capture-DEMAND floor, not a standing-population one: it is reached only from the
		# `idleCapturers.Length == 0` branch and returns early on `!CaptureTargetExists()` — "we never spend
		# budget on a TECN with nothing to capture." That is the correct mechanism for a consumable capture
		# tool, and both live matches ended with tecn=1 alive, so it works. A UnitFloors entry here would be a
		# SECOND floor on the same population, and which one won would depend on module ordering nobody wrote
		# down. (The offline --composition-plan replay reports tecn NEVER BOUGHT under attrition; that is an
		# artefact of the replay modelling only this module's lane, not a defect.)
		# CROWDING-OUT, MEASURED — a floor pre-empts the deficit pick, so it necessarily spends budget the
		# target vector wanted elsewhere, and that cost belongs here next to the knob rather than in a report.
		# At 1-in-40 attrition (--composition-plan, 200 cycles) the two floored types settle at medi 14 + aa 42
		# = 56 per-mille against a combined target of 17 + 28 = 45, i.e. the specialist allocation runs ~1.24x
		# its share. An earlier cut of this branch also floored the sniper at 2 and measured ~1.9x (109 against
		# 57) — the sniper was dropped precisely because it was the expensive third of that, 800 of pinned
		# budget driving its slot to 4.5x target on the strength of an unanchored delay constant. At 1-in-15
		# the ratio rises to ~2.3x, but that is an army collapsing to 7,700 value where two floored men are
		# unavoidably a large share; the floor is doing its job there, not misbehaving.
		# The overshoot is ALL in aa (42 vs 28); medi actually lands UNDER its target at 14 vs 17, so the floor
		# and the share are complementary rather than additive there — the floor binds below ~11.8k army value
		# and the share takes over above it.
		UnitFloors:
			medi.america: 2
			aa.america: 2
			# Minelayer. FLAT, WITH NO UnitFloorPer DENOMINATOR — the aa.america pattern, not the
			# medi/dr pattern, and this is the case SupportFloorMath's own header carves out rather
			# than an exception argued for here: "a floor on a type whose value is INDEPENDENT of army
			# size (one scout, one capturer for a specific building) is legitimately flat. A floor on a
			# SUPPORT type — one whose value is PROPORTIONAL to the force it serves — must not be."
			# One minelayer denies the same lane whether it screens ten soldiers or fifty, so it is the
			# former. Inventing a per-N-soldiers denominator for it would be inventing a number whose
			# only real job is to act as an opening-buy guard — and a mis-set denominator is exactly how
			# this file has twice shipped a floor that silently never fires (N above the denominator's
			# ceiling ⇒ min(cap, supported/N) is 0 forever). UnitDelays does that job directly and
			# cannot go inert. See UnitDelays.mnly below.
			# ORDINAL POSITION, WHICH IS NOT A GUESS: floorTypes is UnitFloors.Keys sorted with
			# StringComparer.Ordinal and ChooseBelowFloor returns the FIRST type under its floor, so
			# with aa < dr < medi < mnly < msar < sf ('e' < 'n' decides medi.america vs mnly; 'n' < 's'
			# decides mnly vs msar) the minelayer is bought after every cheap specialist and before
			# only the radar and the SF when several are short at once. That is the right order for one
			# of the most expensive and least urgent of them.
			mnly: 1
			# Drone operator — the user's "they make none" is a FLOOR problem, not a weight problem.
			# See the dr.america UnitFloorPer note below for why 2 here is a cap and not a target.
			dr.america: 2
			# ===== COUNTER-BATTERY RADAR: A FLOOR, BECAUSE A SHARE PROVABLY CANNOT BUY ONE =====
			# The MSAR is the mod's only counter-battery vision source and the bot had never bought one.
			# A UnitTargetShares entry cannot fix that, and the reason is the finding this whole block
			# already rests on: the deficit argmax picks the type furthest below target, so it stays in
			# the big slots (abrams 190, e3 95) and never descends to a small one — medic, sniper and
			# engineer are each bought ZERO times in 200 cycles at a 1-in-40 loss rate. A 1600-cost
			# single-copy specialist is exactly that shape, so it gets the floor lane instead.
			# ORDERING IS READABLE, NOT A GUESS: floorTypes is Info.UnitFloors.Keys sorted with
			# StringComparer.Ordinal (UnitBuilderBotModule.cs:566) and ChooseBelowFloor returns the FIRST
			# type under its floor (:1385). Ordinal gives aa.america < dr.america < medi.america < mnly
			# < msar < sf.america ('n' 0x6E < 's' 0x73 at index 1 puts msar after mnly; 'm' 0x6D <
			# 's' 0x73 at index 0 puts it before sf), so the radar sorts fifth of the six floored types
			# and can never pre-empt a medic, an AA soldier, a drone operator or the minelayer — only
			# the SF, which shares its 3000 delay and is the less time-critical of the two.
			# SORTING LAST DOES NOT SAVE IT AT t=0, AND THAT IS WHY UnitDelays.msar BELOW IS MANDATORY.
			# At tick 0 every other floored type is held off — aa by its 2000 delay, dr by its 300 delay,
			# mnly and sf by their 3000 delays, medi and dr by a UnitFloorPer denominator that is still 0 —
			# so the walk falls straight
			# through to msar, whose flat floor of 1 is maximally unmet. Without the delay the FIRST
			# call-in of the match is 1600 spent on a radar with nothing to detect and no army to protect
			# it. That is not a risk, it is arithmetic: the pre-empt outranks the target ceiling and every
			# demand gate. This exact defect has shipped twice in this file already (two t=0 medics, two
			# t=0 supply trucks); it is not shipping a third time.
			msar: 1
			# Special forces — FLAT, no UnitFloorPer, held off by UnitDelays instead: the mnly
			# pattern, not the medi/dr one. This block's own rule is that a floored type needs a
			# ratio OR a threat gate OR a delay, or it is an opening buy by construction; sf takes
			# the delay (3000, see UnitDelays below), for the reason given there.
			# WHY FLAT RATHER THAN A RATIO: a denominator here would be a number invented purely to
			# act as an opening-buy guard, and a mis-set denominator is exactly how this file has
			# twice shipped a floor that silently never fires (N above the denominator's ceiling ⇒
			# min(cap, supported/N) is 0 forever). One SF is a raid capability, not a per-N-soldiers
			# support ratio, so there is no honest denominator to pick.
			# ORDINAL POSITION, WHICH IS NOT A GUESS: floorTypes is UnitFloors.Keys sorted with
			# StringComparer.Ordinal (UnitBuilderBotModule.cs:566) over keys already lowercased at
			# ruleset load (ActorNameCase), and ChooseBelowFloor returns the FIRST type under its
			# floor (:1385). aa < dr < medi < mnly < msar < sf, so the SF is the LAST of the six
			# bought when several are short at once — right for the least urgent of them (the
			# radar above outprices it 1600 to 600, but shares its 3000 delay and is the more
			# time-critical once artillery is on the field).
			sf.america: 1
		# ===== THE FLOOR NEEDS A DENOMINATOR (user report 2026-08-15) =====
		# A flat floor is maximally unmet at t=0, because at t=0 every census is zero. The pre-empt outranks
		# the ceiling and every demand gate, and floored support types are cheap, so a flat floor does not
		# merely allow an opening support buy — it GUARANTEES one. Measured on the shipped default
		# (--composition-plan --start none, which is what StartingUnitsClass actually defaults to,
		# SpawnStartingUnits.cs:25): cycles 0 and 1 both buy medi.america, on both factions. That is the
		# user's report verbatim ("all experimental bots start by building two medics"), and it is the SECOND
		# instance of one defect — two supply trucks at t=0 was the first (PIPELINE 57(a)).
		# The user's objection is about ORDER, not quantity: "at the start we need lots of soldiers to be able
		# to defend ourselves ... but the medics can come a bit later when they are actually needed". A medic
		# bought before there is a squad has nobody to treat; the same medic bought later is correct.
		# The floor is min(2, supported/N): no medic below N soldiers, 1 at N, 2 at 2N and never more — so the
		# opening call-ins go to line infantry and the medic phases in with the platoon it serves.
		# WHY THIS IS NOT REDUNDANT WITH THE 17-per-mille SHARE: they are the same ratio in different regimes,
		# and that is deliberate. The share cannot hold a specialist under losses (the argmax never descends
		# to a small slot — the whole finding of 47e4ede5), so the floor is the guarantee; scaling it only
		# stops the guarantee firing before the thing it guarantees is needed.
		# ===== 10, NOT 20 — THE RATIO HAS A CLIFF AND 20 WAS PAST IT (re-derived 2026-08-17) =====
		# 20 shipped as the user's own phrasing ("I usually have around 1 medic per 20 man squad") and was
		# checked on the end-of-run `standing` snapshot, the same instrument that mis-tuned the supply truck.
		# On the run-integrated metric it is not a conservative ratio, it is an INERT one.
		# THE CLIFF IS ARITHMETIC, NOT EMPIRICAL: EffectiveFloor is min(cap, supported/N), so the floor is
		# ZERO on every cycle where supported < N. A ratio against a denominator that COLLAPSES under attrition
		# therefore has a threshold above which it never fires at all — the identical failure a reviewer found
		# on the truck, where per 12 gave 30% dry and per 14 gave 86%, the pre-fix behaviour exactly.
		# WHERE THE MEDIC'S DENOMINATOR ACTUALLY SITS (standing non-medic infantry, --composition-plan 200
		# cycles; `UnitFloorPer denominator over the run`) — mean / max:
		#   attrition 15: 10.7 / 18     attrition 25: 18.2 / 20     attrition 40: 27.3 / 31
		#   attrition 20: 14.8 / 19     attrition 35: 24.8 / 28     attrition  0: 98.2 / 183
		# Lower --attrition N is HEAVIER loss (a unit dies at N hazard points), so the denominator is smallest
		# exactly where a medic matters most. At 20 the bot's whole infantry force never once reaches the
		# denominator in the two heaviest regimes: `engaged 0/200 cycles`, the floor never existed.
		# MEASURED CONSEQUENCE, per 20 -> per 10 (america / russia), mean standing medics and the fraction of
		# cycles with NO medic at all. Read these lines, never the `standing` column or the final census‰,
		# which for a type replaced this often is the coin flip that caused this bug:
		#                  mean medics            cycles with none        floor engaged
		#   attrition 15   0.07 -> 0.94           93% -> 6%   / 93% -> 6%     0% -> 52%
		#   attrition 20   0.10 -> 0.95           90% -> 5%   / 90% -> 5%     0% -> 100%
		#   attrition 25   0.48 -> 1.03           52% -> 3%   / 17% -> 4%     9% -> 100%
		#   attrition 35   0.98 -> 1.89            2% -> 0%   /  2% -> 0%    94% -> 100%
		#   attrition 40   0.98 -> 1.90            2% -> 0%   /  2% -> 0%    96% -> 100%
		#   attrition  0   4.51 -> 4.63            0% -> 0%   /  0% -> 0%    96% -> 100%
		# The attrition-15 row is the headline: the bot fielded a medic on 7% of cycles and bought ZERO in 200
		# (`first-buy NEVER`) — the starting medic died and was never replaced, on both factions.
		# WHY NOT 8 OR 6, which engage even harder: they give the t=0 defect back. With --start platoon the
		# first medic lands on cycle 1 at both 6 and 8 — the original complaint's shape — against cycle 8 at
		# 10 and cycle 12 at 12. With --start none (the live default, StartingUnitsClass = "none",
		# SpawnStartingUnits.cs:25, unoverridden in any mod YAML) it is cycle 9/11/14/27 for 6/8/10/20 and the
		# opening four buys are line units at every value. 10 is the SMALLEST ratio that keeps the medic out of
		# the opening under BOTH start classes.
		# WHY NOT 12: at attrition 15 it is already on the shoulder — 55% of cycles with no medic, mean 0.45.
		# THE CAP OF 2 IS UNCHANGED, so the worst-case medic allocation is exactly what it was; only the point
		# at which the floor phases in moves. The run-integrated medic value stays at or under the 17-per-mille
