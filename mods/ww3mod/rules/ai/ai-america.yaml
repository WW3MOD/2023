		#     full ammo. This floor is IGNORED until then, so the opening cannot buy a truck no matter how many
		#     customers appear.
		#   * EVERY TRUCK AFTER IT is governed by this floor alone, ammo need irrelevant. A reserve that waits
		#     for somebody to run dry is not a reserve — the truck arrives after the fight it was meant to
		#     supply, which is the defect the floor was reintroduced to fix.
		# The switch is a LATCH (UnitBuilderBotModule.heldFirstSupplyTruck, folded in
		# SupplyPrecedenceMath.LatchFirstTruck), set once and never cleared. It is deliberately NOT a live "do
		# I own one" reading: that would re-arm the gate whenever the fleet is wiped mid-match and stall the
		# rebuild at the worst possible moment. Predicate and latch are pinned in SupplyPrecedenceMathTest.
		# WHAT THIS COSTS, stated because it is a real cost and the table above cannot show it: every dry-cycle
		# figure below is measured with --composition-plan, which HAS NO AMMO MODEL, so it reports the floor
		# from cycle one and cannot see the opening delay. Live, the first truck now waits for first ammo
		# demand, so real opening outage is LONGER than any raw `dry` number here. The table remains valid for
		# comparing ratios, which is all it was ever used for.
		# WHEN SupplyTruckFloorPer IS 0 THE PATH IS THE PRE-FEATURE ONE, by construction rather than by
		# argument: EffectiveFloor returns its flatFloor argument literally, so the module passes exactly what
		# it passed before. That holds for any profile at any value, so no claim about which profiles set
		# which flags is needed to support it.
		SupplyTruckFloor: 3
		SupplyTruckFloorPer: 10
		SupplyTruckCeiling: 6
		# ===== RESUPPLY PRECEDENCE (user ruling 2026-08-15) =====
		# "There are a lot of soldiers now that are out of ammo but still I see almost no supply trucks being
		# built... soldiers out of ammo are useless. That should be the first priority to solve at all times."
		# MEASURED on tournament-arena-composition-2p before this change: ZERO trucks ordered by any lane for
		# a whole match, while ammo-need=True held continuously from tick 1240. Two routes were closed at
		# once, which is why six merges aimed at truck behaviour never touched it:
		#  (1) SIZING. DesiredTrucks was fed CountStarvingCustomers (below 25% ammo), which read 0 at EVERY
		#      snapshot, while the ammo-need boolean reads SupplyProvider's own service bar and read True.
		#      One fact, two predicates, and the blind one held the purse. SupplySizeFromNeed switches the
		#      sizing input to the serving bar.
		#      WHY NOT JUST LOWER SupplyStarvingThresholdPerMille — the earlier answer here was FALSE and is
		#      corrected: it claimed that value is also the truck's SEEK threshold. It is not.
		#      SupplyStarvingThresholdPerMille lives on UnitBuilderBotModule and is read at exactly ONE site;
		#      the seek threshold is SupplyFollowerBotModuleInfo.HuntStarvingThresholdPerMille, a different
		#      field on a different trait, set independently at ai.yaml. They only share the value 250 and a
		#      helper family, so lowering the procurement one would NOT have retargeted delivery. The real
		#      reason to size from the service bar is that it cannot drift out of agreement with the supply
		#      system, which is precisely how these two came to disagree.
		#      SCOPE HONESTY: on the paired seed below this route was NOT what blocked the truck (see the
		#      baseline note under (2)). It is a real divergence — measured needy=13 against starving=1 in the
		#      same snapshot — but it is a robustness fix, not the thing that unblocked the purchase.
		#  (2) AFFORDABILITY, and on the measured seed this was the ONLY binding constraint. The paired
		#      baseline arm (flags off, needy=-1 in the census confirming it) already showed trucks-desired=2
		#      from the very first ammo-need=True snapshot at tick 1200 — so the demand gate was open and
		#      correctly sized, owned=0 < desired=2, and the pre-empt was reached and skipped PURELY on price
		#      for 110 consecutive snapshots while cash sawtoothed 92/158/124/190/256/166/72 against a
		#      1000-cost truck. A pre-empt that merely SKIPS when broke is not a priority — the cycle falls
		#      through and spends the truck's money on a rifleman. SupplyPrecedenceStallCycles lets the path
		#      buy NOTHING and bank instead, which is the only move that expresses precedence.
		# THE BOUND IS ON PROGRESS, NOT ON TIME — a correction from adversarial review, and the reasoning is
		# worth keeping because a cycle count is the intuitive choice and it is wrong three ways.
		# A cycle-count bound was built and measured first, at 20 and then 30. It fails because:
		#   (a) IT DOES NOT TERMINATE. The counter resets on any non-banking cycle, INCLUDING when patience is
		#       spent — so hitting the cap inserts one purchase and restarts the bank. For any player whose
		#       income over the cap's span is under the truck price the steady state is: N silent cycles, one
		#       buy, N silent cycles, forever. The truck is never bought.
		#   (b) THE FALL-THROUGH BUY IS PRICED BY THE SAVINGS. Composition eligibility is affordability-
		#       filtered, so a fat balance PROMOTES expensive slots into the argmax. Measured at bound 20: the
		#       cap fired at cash=819 (181 short of the truck) and the very next cycle bought a 450 humvee,
		#       819 -> 203. A cap below the price does not delay the purchase, it DESTROYS the savings.
		#   (c) A CYCLE COUNT CANNOT ENCODE A PER-MAP, PER-PLAYER ECONOMY RATE. The same constant is a safety
		#       limit for a rich player and the engine of loop (a) for a poor one.
		# So the bank now continues only while the balance SETS NEW HIGHS, and abandons after this many
		# consecutive cycles without one. That terminates by construction — a balance that keeps setting new
		# highs reaches a fixed price in finite time — and it is self-calibrating across economies.
		# 4, not 1, because income arrives in lumps and upkeep nibbles between them: the measured healthy
		# spell ran 92/92/158/224/224/290/.../554/521/521/587, i.e. two flat cycles and a dip while climbing
		# overall, with a longest non-new-high run of 2. 4 clears that with margin.
		# IT ALSO ABSORBS A DEFECT IT DOES NOT FIX. This bank silences only the composition lane; the request
		# drains (CaptureCoordinator, AdaptiveProduction) go through the single-name BuildUnit overload before
		# the queue loop and never consult it, and the .heli UnitBuilder twins are separate trait instances
		# that never set SupplyDemandSizing — all spending the same treasury. Silencing those from here would
		# override other modules' own guarantees (the capture-supply floor is a correctness contract), so
		# instead this NOTICES the drain: no new high, stall climbs, spell ends. Measured shape of exactly
		# that — a player banked 30 consecutive cycles with cash pinned at 3-9, flat and never climbing, which
		# is a drain rather than poverty (a merely poor player's cash still creeps up during silence).
		# The cost, stated: while logistics is owed the army grows more slowly. That is the trade the ruling
		# asks for, and it is visible in the census best=/stalled= fields rather than silent.
		# NOT a restored SupplyTruckFloor: gated on live measured demand, so with a full-ammo army at t=0 —
		# the two-trucks-at-the-start bug the user reported FIRST — both knobs are inert.
		# @stable is UNAFFECTED: both are read only under SupplyDemandSizing, which @stable does not set, and
		# both default to baseline (false / 0) in C# regardless.
		SupplySizeFromNeed: true
		SupplyPrecedenceStallCycles: 4
		# Early-econ behaviour 2: vehicle AA proportionate to observed air (aa.america ungated picket).
		ScaleAntiAirToThreat: true
		AntiAirUnitTypes: strykershorad
		AntiAirBaseline: 0
		AntiAirPerObservedAir: 1
		# ===== COMPOSITION-DIRECTED PURCHASING (experimental-only; C# default is false) =====
		# Fixes "the army drifts to mortars". Both @experimental SquadManagers run IgnoreGroundUnits, so
		# idleUnitCount never rises above 0, so buildRandom is ALWAYS true and every ground call-in was a
		# UNIFORM lottery over the buildable list. A uniform BUY rate with unequal lifetimes settles the
		# STANDING army proportional to lifetime — long-lived rear-line mortars pile up while frontline
		# armour is eaten. With this on, the module censuses what it owns (per-mille of army VALUE, with
		# pending call-ins credited and evacuating units excluded) and buys the type furthest below target.
		CompositionDirected: true
		# Stops the two lanes that bought PAST the targets. It does NOT change the deficit pick — that argmax
		# already never picks an over-target class while any class is still short (restricting it to
		# under-target slots is a provable no-op; see ForceCompositionMath.SelectDeficit). The two real
		# effects: (1) a cycle where composed types are buildable but all priced out or at their UnitLimit
		# DECLINES instead of falling back to the uniform lottery — a bot spends to zero routinely, so the
		# affordability gate made that fallback frequent enough to dominate; (2) the counter-buy FIFO from
		# AdaptiveProductionBotModule is folded under the targets.
		CompositionEnforceTargetCeiling: true
		# The capture-supply floor is exempt on the FIFO lane: "a capturer must be obtainable when there is
		# something to capture" outranks the composition shape, and CaptureCoordinator's own alive-or-pending
		# floor already bounds it. Named explicitly rather than leaning on TecnRequestPriority being true in
		# ai.yaml — that flag is in another file, and its FIFO fall-back path would be silently ceiling-bounded
		# the moment someone turned it off.
		CompositionCeilingExemptTypes: tecn.america
		# TARGETS (not the ceilings UnitsToBuild weights are): per-mille of army VALUE. Sums to 1000.
		# Only types listed here are eligible for this pick — helicopters are deliberately absent (deferred
		# to their own lane) and so are never chosen by it.
		#
		# PROVISIONAL RETUNE (2026-08-05, baseline-bulk direction) — REVIEW AT MERGE. The infantry block is
		# unchanged in TOTAL (450, vehicles keep 550); only its internal split moved. Shares are per VALUE but
		# the design intent is per HEAD, and line infantry is the cheap end of the roster (rifle/LMG/grenadier
		# 100, mortar/AT/AA 300, sniper 400), so a value share converts to very different head counts. The old
		# split put line infantry at 65% of infantry HEADS; this one puts it at 80%, i.e. ~2.5 support per 10
		# line instead of ~5.2. Per 10 line infantry the support tail is now AT 0.9, mortar 0.5, AA 0.4,
		# medic 0.4, sniper 0.1, engineer 0.1, technician 0.1.
		UnitTargetShares:
			# Armour core — the force that actually takes and holds ground.
			abrams: 190
			bradley: 140
			# Screen / lift.
			humvee: 40
			m113: 30
			# Indirect fire.
			m109: 60
			# Air defence (strykershorad additionally stays capped by ScaleAntiAirToThreat above).
			strykershorad: 50
			truk: 40
			# ===== Line infantry — the BULK of the foot force (80% of infantry head count) =====
			e3.america: 95
			ar.america: 78
			tl.america: 62
			e2.america: 47
			# ===== Support infantry — small fractions of the line, not a second army =====
			# Anti-armour infantry — the cheap answer to a believed enemy tank push, and the largest support
			# share; the armor>antitank counter bias can lift it further when armour is actually believed.
			at.america: 66
			# mt.america is the type that was drifting; this is the deliberate cap-by-target.
			mt.america: 37
			aa.america: 28
			# Specialists and logistics (each additionally bounded by UnitLimits above).
			sn.america: 12
			# 17, was 9. USER RULING 2026-08-14: "in a platoon sized group of infantry (20 or so soldiers),
			# there should be one medic". That is a RATIO, which is exactly what a target share is — so it
			# belongs here rather than in a flat floor, and the old 9 was simply too low to express it.
			#
			# DERIVATION (corrected 2026-08-14 — the first version of this comment divided the WHOLE infantry
			# share by the LINE infantry cost, which is a category error: support infantry costs 2.5-4x line,
			# so that inflates the head count and the answer it produced was right only by luck).
			# Head count has to be summed per type, not averaged: soldiers = V/1000 * SUM(share_i / cost_i)
			# over the infantry block. With e3 95/100, ar 78/100, tl 62/200, e2 47/100, at 66/300, mt 37/300,
			# aa 28/300, sn 12/400, e6 8/250, tecn 8/250 that sum is 3.031 (medics excluded — they are what we
			# are sizing), i.e. 0.00303*V non-medic soldiers. One per 20 wants 0.0001515*V medics, and at cost
			# 100 that is 15.2 per-mille. So the honest figure is ~15; 17 is kept because it lands at one medic
			# per ~17.8 soldiers, comfortably inside "20 or so", and a slightly rich medic is cheap at 100.
			# For scale, the old 9 per-mille worked out at one medic per ~34 soldiers.
			# NOT redundant with the UnitFloors entry: the floor binds below ~11.8k army value, this binds above.
			# The vector now sums to 1008 rather than 1000. That is deliberate and harmless: InitializeComposition
			# runs SharesPerMille over these targets, which renormalises to exactly 1000, so the extra 8 is taken
			# proportionally from every other slot (<1% each) instead of being carved out of one arbitrary donor.
			medi.america: 17
			e6.america: 8
			tecn.america: 8
		# Role tokens — the row/column keys for CounterMatrixPct below. A type with no role simply
		# receives no counter bias. The armour line and the foot line are SEPARATE tokens on purpose:
		# sharing one "frontline" token would make believed enemy infantry raise the Abrams target by
		# exactly as much as the rifleman target, which is not what an infantry threat warrants. Same
		# reason mt (infantry mortar) is split from m109 (self-propelled artillery) — both are indirect
		# fire, but only one of them is the type that was drifting.
		UnitRoles:
			abrams: armorline
			bradley: armorline
			e3.america: infantryline
			ar.america: infantryline
			tl.america: infantryline
			e2.america: infantryline
			at.america: antitank
			strykershorad: antiair
			aa.america: antiair
			mt.america: mortar
			m109: artillery
			humvee: recon
			sn.america: recon
			m113: support
			truk: support
			medi.america: support
			e6.america: support
			tecn.america: support
		# Counter bias (v2): believed enemy class -> own role, as a percent contribution scaled
		# by that class's SHARE of the believed enemy force. Fog-legal — the believed composition comes
		# from the same belief store AdaptiveProduction reads, never ground truth. Clamped to
		# +/-CounterBiasMaxPct and renormalised, so it nudges the shape above without replacing it.
		# Believed enemy infantry answers the FOOT line (buy more of our own infantry), not the armour line.
		#
		# ===== v2 RETUNE (2026-09-02) — three cells added after auditing v1 against the damage model =====
		# v1 was labelled "minimal" and had exactly three cells. Two of its zeros were costing real value:
		#
		# (1) armor>armorline was 0, so believed enemy ARMOUR raised ONLY at.america. That points the entire
		#     anti-armour response at the WEAKEST anti-armour weapon we own. WW3MOD resolves anti-armour
		#     through Penetration vs Armor Thickness, not a Versus table (DamageWarhead.ApplyPenetration,
		#     engine/OpenRA.Mods.Common/Warheads/DamageWarhead.cs:127-134: full damage when penetration >=
		#     thickness, otherwise damage * penetration / thickness). The numbers:
		#       ATGM (at.america) Damage 10000 / Penetration 100   — weapons-missiles.yaml:26-27
		#       TankRound (abrams) Damage 15000 / Penetration 1000 — weapons-ballistics.yaml:890-891
		#       abrams Thickness 700 (vehicles-america.yaml:499), t90 Thickness 280 (vehicles-russia.yaml:321)
		#     TankRound out-penetrates every vehicle in the game, so it lands its full 15000. ATGM against an
		#     abrams lands 10000*100/700 = 1428, i.e. 10.5x less per shot; against a t90, 3571, i.e. 4.2x less.
		#     The MBT is the anti-armour unit; AT infantry is the CHEAP one. Both now respond.
		#     armorline gets the smaller PERCENTAGE (30 vs 40) and still moves far more budget, because its
		#     base is 330 per-mille against antitank's 66 — +30% of 330 is ~99, +40% of 66 is ~26. The split
		#     is deliberate: antitank keeps the higher rate because it is what the bot can still afford when
		#     it is broke, which is exactly when an armour push arrives.
		#
		# (2) Neither indirect-fire role answered believed enemy INFANTRY, though both exist to kill it:
		#       60mm_Mortar  ValidTargets: Infantry, Unarmored, Light / InvalidTargets: Concrete, Heavy
		#                    (weapons-ballistics.yaml:786-787) — it CANNOT shoot heavy armour at all.
		#       ArtilleryRound Damage 15000 + Spread 3000 (weapons-ballistics.yaml:890-896).
		#     artillery carries the larger lift (30) because it was never the type that drifted.
		#     JUDGEMENT CALL, flagged for review: mt.america gets a lift at all, and it is deliberately kept
		#     BELOW infantryline's. The mortar cap above is a standing decision and this partially reopens it
		#     — but conditionally, and only while foot infantry is actually the believed threat. The drift the
		#     cap fixed came from the uniform lottery, not from mortars being the wrong buy against infantry.
		#     At 15, a 100%-infantry read moves mt from 37 per-mille to ~43.
		#
		# NOT CHANGED, deliberately: air>antiair stays 60, and there is still no NEGATIVE cell anywhere.
		# Renormalisation already does the de-prioritising — every cell above is positive, so raising the
		# roles that answer the believed threat squeezes the ones that do not. That is what now trims AA
		# when the enemy fields no aircraft: aa.america is ungated by design (the baseline picket, see the
		# header comment), and this squeeze is the gentle instrument for it rather than a second hard cap.
		CounterMatrixPct:
			air>antiair: 60
			armor>armorline: 30
			armor>antitank: 40
			infantry>infantryline: 20
			infantry>artillery: 30
			infantry>mortar: 15
		# ===== TRADE-EFFICIENCY FEEDBACK (experimental-only; C# default 0 = off) =====
		# The counter matrix above biases by what the enemy is BELIEVED to field. It has no way to notice
		# that the shape it is holding is LOSING. This closes that loop from our own ledger: per composed
		# type, kill value dealt vs our value lost (UnitTypeTelemetry, fed by the UpdatesPlayerStatistics
		# callbacks that already ran), compared against the same ratio for our whole army, applied after the
		# counter bias. Reads no enemy actor and no belief store, so it adds no fog surface.
		# Conservative first setting: half the measured deviation, clamped to +/-25% of the base share, and
		# nothing at all until a type has 2000 value of evidence on the board.
		TradeFeedbackMaxPct: 25
		TradeFeedbackScalePct: 50
		TradeEvidenceFloor: 2000
		# ===== GROUP COMPLETION (experimental-only; unset default = off) =====
		# WORKSPACE/analysis/0902-loss-mining.md 1.3 measured abrams at 2 produced / 2 lost and t90 at 2/2,
		# with zero survivors — "never bought in pairs, never survives". The purchasing half of that is the
		# deficit argmax: buying one abrams lifts its census, so the next cycle picks a different class and
		# the tank goes out alone. Once one is owned, this makes the second finish the pair before the
		# budget scatters.
		#
		# SCOPE, stated plainly. This fixes ONLY the buy pattern. The analysis is explicit that *why* they
		# die is NOT established (no killer/killed pairing survives in the artifacts, and it warns that
		# anyone fixing survivability from this data is guessing), so nothing here claims to fix deployment
		# — sending the pair out together is PoiOffensive's decision, not this module's. The evidence is
		# also T-A at n=2 matches, which is why the size is the smallest one that means anything (2, a
		# pair) rather than a trio.
		#
		# NOT COVERED: littlebird and halo, the other 1/1 and 2/2 losses in the same finding. They are
		# helicopters, deliberately absent from UnitTargetShares (deferred to their own lane), and this
		# selection only ranges over composed types — so their singleton problem is untouched by this knob.
		MinGroupSizes:
			abrams: 2
