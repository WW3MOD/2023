Player:
	# ===== Baseline ground production — America (enable-ai-player, non-Experimental) =====
	# Split (early-econ PIPELINE 12): Experimental uses the @america.experimental twin below
	# (need-gated trucks + threat-scaled AA). The `!enable-ai-experimental` guard keeps exactly
	# one UnitBuilder enabled per player — Stable holds this frozen block (it has
	# enable-ai-player but not enable-ai-experimental). Mirrors the HelicopterSquad split.
	UnitBuilderBotModule@america.normal:
		RequiresCondition: enable-ai-player && !enable-ai-experimental && player.nato
		UnitQueues: Vehicle, Infantry
		UnitsToBuild:
			# Conscripts -- low priority, mainly for capturing
			tecn.america: 500

			# Core infantry -- high priority mix
			e3.america: 120
			ar.america: 100
			tl.america: 80
			e2.america: 60

			# Support infantry
			at.america: 50
			mt.america: 40
			medi.america: 40
			aa.america: 30
			sn.america: 25
			e6.america: 20

			# Vehicles -- balanced force composition
			humvee: 30
			bradley: 25
			abrams: 20
			m113: 15
			m109: 15
			strykershorad: 10

			# Supply trucks for field resupply
			truk: 20

		UnitLimits:
			truk: 4
			tecn.america: 3
			e6.america: 2
			m109: 3
			strykershorad: 2
			sn.america: 3

	# ===== Experimental AI — America ground production (early-econ PIPELINE 12) =====
	# Byte-for-byte copy of @america.normal's UnitsToBuild/UnitLimits PLUS three default-off
	# early-econ gates (behaviours 1 & 2). Experimental-only condition; Stable keeps the
	# frozen twin above. The engine flags default false, so this block is the ONLY place they turn on.
	#   * GateResupplyOnAmmoNeed — no supply trucks while every truck-rearmable unit has full ammo.
	#   * ScaleAntiAirToThreat — cap vehicle AA (strykershorad) to OBSERVED enemy air; aa.america
	#     (cheap AA infantry) stays ungated as the baseline picket.
	UnitBuilderBotModule@america.experimental:
		RequiresCondition: enable-ai-experimental && player.nato
		UnitQueues: Vehicle, Infantry
		# ===== CAPTURE <-> COMBAT BUDGET SPLIT (combat-quality lever 3, production side) =====
		# These weights + UnitLimits are the STRATEGIC half of the capture/combat budget split (the tactical half —
		# capturer floor + escort reservation — is on CaptureCoordinatorBotModule@experimental in ai.yaml). The
		# capturer share is tecn.america here; every other type is combat force. NOTE (engine): a UnitsToBuild weight
		# is a share CEILING, not a priority — any weight >= 100 never binds, so it only marks a type "always eligible"
		# (picked uniformly), and the REAL cap on simultaneous capturers is UnitLimits.tecn.america below. To move
		# budget toward combat: lower UnitLimits.tecn.america (fewer capturers on the map) and/or raise combat-type
		# weights that currently sit below the roster average (throttled). Values below are unchanged (no behaviour
		# change until tuned).
		UnitsToBuild:
			# Conscripts -- low priority, mainly for capturing (the capture side of the budget split)
			tecn.america: 500

			# Core infantry -- high priority mix
			e3.america: 120
			ar.america: 100
			tl.america: 80
			e2.america: 60

			# Support infantry
			at.america: 50
			mt.america: 40
			medi.america: 40
			aa.america: 30
			sn.america: 25
			e6.america: 20

			# Vehicles -- balanced force composition
			humvee: 30
			bradley: 25
			abrams: 20
			m113: 15
			m109: 15
			strykershorad: 10

			# Supply trucks for field resupply (need-gated below)
			truk: 20

		UnitLimits:
			# 12, not 4: this is now only the absolute backstop above SupplyTruckCeiling (6) — see
			# SupplyDemandSizing below. It must sit clear of the ceiling or it, not demand, sizes the fleet.
			# The headroom over 6 is for SPENT HULLS: this limit counts every truk actor, while the fleet
			# target counts only trucks that still hold supply, and a drained truck lingers until the
			# follower's evac/sell path removes it. Too little headroom and a few hulls freeze procurement.
			truk: 12
			tecn.america: 3
			e6.america: 2
			m109: 3
			strykershorad: 2
			sn.america: 3
		# ===== STANDING-POPULATION FLOORS (experimental-only; C# default is unset) =====
		# USER RULING 2026-08-14: "build medics", and "there is always an AA soldier or two on the field".
		# A UnitTargetShares entry CANNOT deliver either, and the reason is arithmetic, not tuning. Shares are
		# per-mille of army VALUE, so one unit of a type only fits under its target once the army is worth
		# 1000*cost/target: medi.america at 9 per-mille needs a 11,111-value army before a SINGLE medic is
		# under target, and the starting platoon is worth 2,900 — so the one medic you start with is already
		# 34 per-mille, the ceiling strikes the slot, and it stays struck. Worse under losses: MEASURED offline
		# (--composition-plan, 200 cycles) medics are bought 4x with no losses and ZERO times at a
		# 1-in-40-per-cycle loss rate, because the big slots (abrams 190, e3 95) stay permanently in deficit
		# and the argmax never descends to a 9-per-mille slot. Live @experimental match, 6 sim-minutes: the
		# surviving bot ended with medi.america=0+0 — dead and never replaced.
		# aa.america is the AA SOLDIER and is ungated; it rides the same argmax and fails the same way. It is
		# NOT what ScaleAntiAirToThreat covers — that gate names strykershorad, the AA VEHICLE, and it is a CAP
		# not a floor (see AntiAirBaseline below).
		# The floor pre-empts the deficit pick, so it outranks the target ceiling and the demand gates. It
		# counts owned + IN-CARGO + pending: aa/medi are both PassengerTypes on MountedTransportBotModule and
		# boarding REMOVES a passenger from world.Actors, so a world-only count would buy replacements forever
		# to feed transports.
		# NOT LISTED HERE, DELIBERATELY: tecn.america. A technician floor ALREADY EXISTS, in another module —
		# CaptureCoordinatorBotModule.MaintainTecnFloor (TecnFloor / TecnFloorMax / ScaleTecnFloorToPois),
		# which requests through IBotRequestUnitProduction and so is invisible from this trait's vantage. It is
		# a capture-DEMAND floor, not a standing-population one: it is reached only from the
		# `idleCapturers.Length == 0` branch and returns early on `!CaptureTargetExists()` — "we never spend
		# budget on a TECN with nothing to capture." That is the correct mechanism for a consumable capture
		# tool, and both live matches ended with tecn=1 alive, so it works. A UnitFloors entry here would be a
		# SECOND floor on the same population, and which one won would depend on module ordering nobody wrote
		# down. (The offline --composition-plan replay reports tecn NEVER BOUGHT under attrition; that is an
		# artefact of the replay modelling only this module's lane, not a defect.)
		# CROWDING-OUT, MEASURED — a floor pre-empts the deficit pick, so it necessarily spends budget the
		# target vector wanted elsewhere, and that cost belongs here next to the knob rather than in a report.
		# At 1-in-40 attrition (--composition-plan, 200 cycles) the two floored types settle at medi 14 + aa 42
		# = 56 per-mille against a combined target of 17 + 28 = 45, i.e. the specialist allocation runs ~1.24x
		# its share. An earlier cut of this branch also floored the sniper at 2 and measured ~1.9x (109 against
		# 57) — the sniper was dropped precisely because it was the expensive third of that, 800 of pinned
		# budget driving its slot to 4.5x target on the strength of an unanchored delay constant. At 1-in-15
		# the ratio rises to ~2.3x, but that is an army collapsing to 7,700 value where two floored men are
		# unavoidably a large share; the floor is doing its job there, not misbehaving.
		# The overshoot is ALL in aa (42 vs 28); medi actually lands UNDER its target at 14 vs 17, so the floor
		# and the share are complementary rather than additive there — the floor binds below ~11.8k army value
		# and the share takes over above it.
		UnitFloors:
			medi.america: 2
			aa.america: 2
		# ===== THE FLOOR NEEDS A DENOMINATOR (user report 2026-08-15) =====
		# A flat floor is maximally unmet at t=0, because at t=0 every census is zero. The pre-empt outranks
		# the ceiling and every demand gate, and floored support types are cheap, so a flat floor does not
		# merely allow an opening support buy — it GUARANTEES one. Measured on the shipped default
		# (--composition-plan --start none, which is what StartingUnitsClass actually defaults to,
		# SpawnStartingUnits.cs:25): cycles 0 and 1 both buy medi.america, on both factions. That is the
		# user's report verbatim ("all experimental bots start by building two medics"), and it is the SECOND
		# instance of one defect — two supply trucks at t=0 was the first (PIPELINE 57(a)).
		# The user's objection is about ORDER, not quantity: "at the start we need lots of soldiers to be able
		# to defend ourselves ... but the medics can come a bit later when they are actually needed". A medic
		# bought before there is a squad has nobody to treat; the same medic bought later is correct.
		# The floor is min(2, supported/N): no medic below N soldiers, 1 at N, 2 at 2N and never more — so the
		# opening call-ins go to line infantry and the medic phases in with the platoon it serves.
		# WHY THIS IS NOT REDUNDANT WITH THE 17-per-mille SHARE: they are the same ratio in different regimes,
		# and that is deliberate. The share cannot hold a specialist under losses (the argmax never descends
		# to a small slot — the whole finding of 47e4ede5), so the floor is the guarantee; scaling it only
		# stops the guarantee firing before the thing it guarantees is needed.
		# ===== 10, NOT 20 — THE RATIO HAS A CLIFF AND 20 WAS PAST IT (re-derived 2026-08-17) =====
		# 20 shipped as the user's own phrasing ("I usually have around 1 medic per 20 man squad") and was
		# checked on the end-of-run `standing` snapshot, the same instrument that mis-tuned the supply truck.
		# On the run-integrated metric it is not a conservative ratio, it is an INERT one.
		# THE CLIFF IS ARITHMETIC, NOT EMPIRICAL: EffectiveFloor is min(cap, supported/N), so the floor is
		# ZERO on every cycle where supported < N. A ratio against a denominator that COLLAPSES under attrition
		# therefore has a threshold above which it never fires at all — the identical failure a reviewer found
		# on the truck, where per 12 gave 30% dry and per 14 gave 86%, the pre-fix behaviour exactly.
		# WHERE THE MEDIC'S DENOMINATOR ACTUALLY SITS (standing non-medic infantry, --composition-plan 200
		# cycles; `UnitFloorPer denominator over the run`) — mean / max:
		#   attrition 15: 10.7 / 18     attrition 25: 18.2 / 20     attrition 40: 27.3 / 31
		#   attrition 20: 14.8 / 19     attrition 35: 24.8 / 28     attrition  0: 98.2 / 183
		# Lower --attrition N is HEAVIER loss (a unit dies at N hazard points), so the denominator is smallest
		# exactly where a medic matters most. At 20 the bot's whole infantry force never once reaches the
		# denominator in the two heaviest regimes: `engaged 0/200 cycles`, the floor never existed.
		# MEASURED CONSEQUENCE, per 20 -> per 10 (america / russia), mean standing medics and the fraction of
		# cycles with NO medic at all. Read these lines, never the `standing` column or the final census‰,
		# which for a type replaced this often is the coin flip that caused this bug:
		#                  mean medics            cycles with none        floor engaged
		#   attrition 15   0.07 -> 0.94           93% -> 6%   / 93% -> 6%     0% -> 52%
		#   attrition 20   0.10 -> 0.95           90% -> 5%   / 90% -> 5%     0% -> 100%
		#   attrition 25   0.48 -> 1.03           52% -> 3%   / 17% -> 4%     9% -> 100%
		#   attrition 35   0.98 -> 1.89            2% -> 0%   /  2% -> 0%    94% -> 100%
		#   attrition 40   0.98 -> 1.90            2% -> 0%   /  2% -> 0%    96% -> 100%
		#   attrition  0   4.51 -> 4.63            0% -> 0%   /  0% -> 0%    96% -> 100%
		# The attrition-15 row is the headline: the bot fielded a medic on 7% of cycles and bought ZERO in 200
		# (`first-buy NEVER`) — the starting medic died and was never replaced, on both factions.
		# WHY NOT 8 OR 6, which engage even harder: they give the t=0 defect back. With --start platoon the
		# first medic lands on cycle 1 at both 6 and 8 — the original complaint's shape — against cycle 8 at
		# 10 and cycle 12 at 12. With --start none (the live default, StartingUnitsClass = "none",
		# SpawnStartingUnits.cs:25, unoverridden in any mod YAML) it is cycle 9/11/14/27 for 6/8/10/20 and the
		# opening four buys are line units at every value. 10 is the SMALLEST ratio that keeps the medic out of
		# the opening under BOTH start classes.
		# WHY NOT 12: at attrition 15 it is already on the shoulder — 55% of cycles with no medic, mean 0.45.
		# THE CAP OF 2 IS UNCHANGED, so the worst-case medic allocation is exactly what it was; only the point
		# at which the floor phases in moves. The run-integrated medic value stays at or under the 17-per-mille
		# target at every attrition level measured, i.e. this closes a shortfall rather than opening an excess.
		# NOT INDEPENDENTLY CONFIRMED: the denominator above is the offline replay's, which buys one unit per
		# cycle on an unlimited budget and never buys 4 of the 10 supported types (e6/mt/sn/tecn — the small-slot
		# argmax finding again), so a live infantry count could run higher. CensusLogInterval below exists to
		# measure it and no live match has been read for it yet.
		UnitFloorPer:
			medi.america: 10
		# The denominator: every non-medic infantry type. Chosen to match the medi share derivation below
		# EXACTLY (the same per-type sum, medics excluded) so the floor and the share express ONE ratio rather
		# than two that have to be reconciled. Vehicles are deliberately absent — the user said "20 man
		# squad", and a medic does not treat an Abrams.
		# aa.america is NOT given a ratio: its denominator is enemy AIR, not own army size, and it already has
		# the right instrument for that (UnitDelays 2000 below, plus ScaleAntiAirToThreat for the vehicle).
		# A floored type needs a ratio here OR a threat gate OR a delay; with none of the three it is an
		# opening buy by construction, not by accident.
		UnitFloorSupportedTypes: e3.america, ar.america, tl.america, e2.america, at.america, mt.america, aa.america, sn.america, e6.america, tecn.america
		# Unconditional [composition] census into debug.log every 40 bot ticks. C# default is 0; this is
		# the opt-in. Observability only — reads state, changes no decision.
		CensusLogInterval: 40
		# READ THIS AS A HARD BAN, NOT AS FLOOR SCHEDULING. UnitDelays is consulted at all THREE call-in sites —
		# BuildUnit, IsCompositionCandidateEligible and ChooseBelowFloor — so before tick 2000 no AA soldier can
		# be called in by ANY lane: not the floor, not the deficit pick, not an external request. It is a
		# capability ban on the type for the first ~80 seconds, not merely a delayed floor.
		# WHY THAT IS THE RIGHT CALL: `^AA` carries exactly ONE armament (MANPAD, `ValidTargets: Air`) and
		# inherits ^AutoTargetAir, so an AA soldier CANNOT engage ground at all, and BOTH factions gate every
		# attack helicopter behind `UnitDelays: 2500` (`ai.yaml` heli/littlebird/hind/mi28). Tick 2500 is
		# therefore the earliest an enemy airframe can even be ORDERED, before call-in and the flight over —
		# so an AA soldier bought before 2000 is strictly wasted budget with nothing it could legally shoot.
		# 2000 is derived from that gate, not guessed. A medic is useful from first contact, so it has no delay.
		# THE COST, STATED: the starting platoon ships ZERO AA soldiers, so the shipped behaviour against the
		# user's "there is always an AA soldier or two on the field" is honestly "NONE for the first ~80
		# seconds, then two". That is a deliberate trade of early coverage for early tempo, not an oversight.
		# SCOPE: this bounds a BOT opponent. A human can rush a helicopter earlier and this does not protect
		# against that. The follow-up the user asked for is a COMPUTED time-to-threat (enemy income vs airframe
		# cost, plus flight time from their SR to ours) rather than a static tick; filed with the build-order
		# design.
		UnitDelays:
			aa.america: 2000
		# Early-econ behaviour 1: don't call in trucks while no fielded unit needs ammo.
		GateResupplyOnAmmoNeed: true
		ResupplyUnitTypes: truk
		# ===== DEMAND-SIZED SUPPLY FLEET =====
		# Measured 2026-08-10 (user's 30-minute match, debug.log): ONE standing truck per player for the whole
		# game, with a large fraction of the infantry out of ammo. 14 truck actor-ids appear across the match,
		# but their lifespans only overlap ACROSS the two AI players — every new id is a replacement for a dead
		# one, never fleet growth.
		#
		# The cap was never UnitLimits (4, never reached). It was UnitTargetShares: truk: 40 below. Shares are
		# per-mille of army VALUE, so a 1000-cost truck at 40 per-mille is one truck per 25,000 value of army —
		# and a realistic mid-game army is ~15-22k. CompositionEnforceTargetCeiling then strikes the truk slot
		# the instant the first truck puts the census over 40 per-mille, so the second is never bought. A
		# budget SHARE is the wrong question for logistics: a truck's workload scales with the number of
		# CUSTOMERS, not with how expensive the army defending them happens to be.
		#
		# Deliberately over-provisioned (200%) on the user's explicit instruction — trucks drive toward the
		# fighting and get shot, so a fleet sized to the exact requirement is short the moment one dies.
		# TO TUNE DOWN once several trucks are visibly moving at once: lower
		# SupplyDemandOvercompensationPercent, NOT SupplyCustomersPerTruck (that one is a physical fact about
		# the truck: TotalSupply 750 over a ~125-supply typical full reload).
		SupplyDemandSizing: true
		SupplyStarvingThresholdPerMille: 250
		SupplyCustomersPerTruck: 6
		SupplyDemandOvercompensationPercent: 200
		# 0, was 2. USER RULING 2026-08-14: "no supply truck until at least one unit is below full ammo."
		# MEASURED live, @experimental vs @experimental, tick 40 of the match: the census read
		# `truk=0+0/909v40` — 90.9% of everything the bot had committed was supply trucks, against a 40
		# per-mille target, because the floor's two trucks are the FIRST two call-ins of the match, ahead of
		# every combat unit. Offline (--composition-plan): 2000 budget against a 2900-value starting platoon.
		# This DELETES a deliberate design decision and the cost is real, so state it rather than bury it: the
		# floor existed so the first unit to run dry does not wait a full procurement cycle for a truck to be
		# ordered, called in and driven out. That latency is now paid on first ammo demand instead of pre-paid
		# at t=0. The bet is that this is the better trade, because at t=0 nobody has fired a shot — every unit
		# spawns full — so the pre-payment buys idle trucks during the one window where tempo (POI capture, map
		# control) compounds. GateResupplyOnAmmoNeed + AnyFieldedUnitNeedsResupply now do the work they were
		# written for, and demand sizing still grows the fleet once anyone is actually dry.
		# @stable is UNAFFECTED: it sets neither SupplyDemandSizing nor SupplyTruckFloor, and
		# SupplyFleetUnderDesired returns false outright when the flag is off — @stable never had a truck floor.
		# ===== THE FLOOR NEEDS A DENOMINATOR — same defect as the medic, opposite symptom (2026-08-17) =====
		# Everything above this line is why the floor went to 0. It is kept because the reasoning was right
		# about t=0 and wrong about the rest of the match, and the distinction is the whole fix.
		# WHAT SETTING IT TO 0 ACTUALLY DID, measured offline (--composition-plan --start none): it deleted the
		# truck's only ceiling-EXEMPT route. V_fit for a 1000-cost truck at a 40 per-mille target is
		# 1000*1000/40 = 25,000 army VALUE — below that, owning ONE truck already puts the slot over target and
		# ApplyCeilingEligibility strikes it, so the deficit route can hold at most one. Standing trucks:
		# 3 with no losses (army 57,750), 1 at --attrition 40 (army 14,350), 0 at --attrition 15 (army 7,800).
		# The middle figure reproduces the verbatim 2026-08-10 LIVE reading, "one standing truck per player for
		# the whole game" — the symptom is derivable from the composition arithmetic alone.
		# A CONSTANT CAN ONLY PICK ONE OF THE TWO FAILURES: 2 buys trucks at t=0 (57(a)), 0 starves the fleet
		# for the rest of the match (66). The floor is now min(cap, customers/per), so it is ZERO while there
		# is no infantry — 57(a) cannot return — and non-zero once there is an army to feed, so 66 cannot
		# either. Exactly the medic fix (UnitFloorPer), reusing the same SupportFloorMath.EffectiveFloor.
		# THE DENOMINATOR IS INFANTRY AS A FACT ABOUT THE RULESET, not a modelling choice: `RearmActors` naming
		# `truk` appears only on infantry (rules/ingame/infantry.yaml) — vehicles rearm from logisticscenter,
		# aircraft from hpad/afld — so no vehicle or aircraft can ever be a truck customer.
		# PILOT IS A CUSTOMER THE OFFLINE MODEL CANNOT SEE. `^PILOT` (ejected aircrew, infantry.yaml:2442) has
		# `RearmActors: truk, logisticscenter` and a matching AmmoPool, so it counts in the LIVE denominator —
		# but it is absent from UnitTargetShares because nothing ever buys one, so --composition-plan never
		# counts it. The live floor therefore phases in slightly EARLIER than every number below says.
		# 10, NOT 6: SupplyCustomersPerTruck (6) sizes the SURGE from men who are already dry; this sizes the
		# STANDING RESERVE from men who might become dry. A reserve as dense as the surge rate never shrinks.
		# 10 IS MEASURED, NOT PICKED, and both 8 and 12 were tried and rejected on the same numbers. The
		# instrument that decides it is `[composition] supply fleet over the run: dry N/200` — the count of
		# cycles with NO truck at all, which is what the user's complaint is about. The end-of-run `standing`
		# column CANNOT decide this: for a type replaced ~12 times in 200 cycles it is near a coin flip on
		# whether one happened to be alive at cycle 199, and an earlier cut of this branch shipped 8 on exactly
		# that artefact. Measured, america / russia:
		#            dry @ attrition 15      dry @ attrition 35      mean fleet @ 35
		#   per 8        12% / 12%                6% / 6%              2.43 / 2.33
		#   per 10       19% / 13%                7% / 6%              1.71 / 1.72
		#   per 12       30% / 16%                9% / 7%              1.55 / 1.57
		# 10 DOMINATES 12: it costs 0.15 of a standing truck and halves the worst dry fraction (30% -> 19%).
		# 8 costs 0.72 of a standing truck permanently — a 5.75x-over-target spike at attrition 35 — to buy
		# 7 further points of availability, which is the wrong trade for a type that drives into fire.
		# `dry` HAS AN IRREDUCIBLE RAMP FLOOR AND IS NOT ALL OUTAGE — read this before quoting the numbers.
		# The opening cycles before the first truck is bought are counted dry, so `dry` can never fall below
		# that ramp: 14 cycles after this change (first buy cycle 13), 16 before it (first buy 15) for america,
		# 13 for russia. The shipped config reports dry 14 at attrition 0, 30, 35, 40, 50 AND 80 — identically
		# — because across that whole band it is SATURATED at the ramp and cannot discriminate at all. Only
		# attrition 15/20/25 carry signal. That does not affect the per-ratio comparison above (ramp differs by
		# 1-2 cycles between 8 and 12), but every absolute figure overstates outage by ~7 points.
		# Also slightly pessimistic: the sample is taken BEFORE each cycle's buy, so a truck that dies and is
		# replaced within one cycle still counts as dry. Consistent across configs, so comparisons are fair.
		# WHAT THE FIX ACTUALLY BUYS. Raw dry %, then MID-MATCH outage with the ramp subtracted, which is the
		# honest number (america / russia):
		#                  raw dry %            mid-match outage        mean fleet (am)
		#   attrition 0    8/6  ->  7/6         0% -> 0%                1.44 -> 2.60
		#   attrition 15  86/34 -> 19/13        78%/28% -> 12%/7%       0.14 -> 0.81
		#   attrition 35  11/9  ->  7/6         3%/3%   ->  0%/0%       0.89 -> 1.71
		#   attrition 40  10/8  ->  7/6         2%/2%   ->  0%/0%       0.90 -> 2.01
		# The attrition-15 america row is the headline and survives the correction: the bot used to have NO
		# truck for 78% of the match after the opening. At attrition 35 and 40 mid-match outage reaches ZERO.
		# CAP 3, not 6: the cap binds the reserve only; demand sizing can still climb to the ceiling when men
		# are actually starving.
		# THE RICH END DOES MOVE, and an earlier revision of this comment wrongly said it did not — that claim
		# came from the end-of-run `standing` column, which reads 3 both before and after at attrition 0 and
		# hid the change. On the run-integrated metric the mean fleet there goes 1.44 -> 2.60, i.e. the bot now
		# REACHES and HOLDS its three trucks instead of sawtoothing up to them. That is ~2,600 of a
		# 57,750-value army, or 45 per-mille against the 40 per-mille target, so it is at target rather than
		# over it — acceptable, but it is a change and it should not be described as none.
		# NO CASH TERM, and that is required rather than incidental (user ruling 2026-08-17: "the bot should of
		# course be able to adapt to any settings"). V_fit is a share of army VALUE, so the ceiling closes the
		# deficit route identically at 1,000 and at 20,000 starting cash; the floor that reopens it must be
		# cash-free too or it would only work at one end of the range.
		# THIS FLOOR SWITCHES GateResupplyOnAmmoNeed OFF, AND THAT IS UNRESOLVED — stated here because the file
		# must describe what it does, not what it was meant to do. UnitBuilderBotModule.cs:846 and :1932 both
		# read `... && !SupplyFleetUnderDesired(name) && !AnyFieldedUnitNeedsResupply()`, so a fleet shortfall
		# SHORT-CIRCUITS the ammo gate. With the floor at 0 that never fired at zero starving customers and the
		# gate was effective; with a scaled floor it fires as soon as the bot owns 10 customers, all at full
		# ammo — first truck at cycle 13, tick ~390, about 17 seconds in.
		# So the guard against the 57(a) t=0 complaint is really "10 infantry / ~17 s", NOT "somebody is dry".
		# The USER RULING cited above is "no supply truck until at least one unit is below full ammo", and this
		# does not literally honour it. Whether that ruling should be read as a hard precondition or as a
		# rejection of the t=0 buy is WITH THE USER as of 2026-08-17; behaviour deliberately unchanged pending
		# that answer. If it must be honoured literally, the fix is to stop the floor satisfying the gate — not
		# to move this ratio.
		# WHEN SupplyTruckFloorPer IS 0 THE PATH IS THE PRE-FEATURE ONE, by construction rather than by
		# argument: EffectiveFloor returns its flatFloor argument literally, so the module passes exactly what
		# it passed before. That holds for any profile at any value, so no claim about which profiles set
		# which flags is needed to support it.
		SupplyTruckFloor: 3
		SupplyTruckFloorPer: 10
		SupplyTruckCeiling: 6
		# ===== RESUPPLY PRECEDENCE (user ruling 2026-08-15) =====
		# "There are a lot of soldiers now that are out of ammo but still I see almost no supply trucks being
		# built... soldiers out of ammo are useless. That should be the first priority to solve at all times."
		# MEASURED on tournament-arena-composition-2p before this change: ZERO trucks ordered by any lane for
		# a whole match, while ammo-need=True held continuously from tick 1240. Two routes were closed at
		# once, which is why six merges aimed at truck behaviour never touched it:
		#  (1) SIZING. DesiredTrucks was fed CountStarvingCustomers (below 25% ammo), which read 0 at EVERY
		#      snapshot, while the ammo-need boolean reads SupplyProvider's own service bar and read True.
		#      One fact, two predicates, and the blind one held the purse. SupplySizeFromNeed switches the
		#      sizing input to the serving bar.
		#      WHY NOT JUST LOWER SupplyStarvingThresholdPerMille — the earlier answer here was FALSE and is
		#      corrected: it claimed that value is also the truck's SEEK threshold. It is not.
		#      SupplyStarvingThresholdPerMille lives on UnitBuilderBotModule and is read at exactly ONE site;
		#      the seek threshold is SupplyFollowerBotModuleInfo.HuntStarvingThresholdPerMille, a different
		#      field on a different trait, set independently at ai.yaml. They only share the value 250 and a
		#      helper family, so lowering the procurement one would NOT have retargeted delivery. The real
		#      reason to size from the service bar is that it cannot drift out of agreement with the supply
		#      system, which is precisely how these two came to disagree.
		#      SCOPE HONESTY: on the paired seed below this route was NOT what blocked the truck (see the
		#      baseline note under (2)). It is a real divergence — measured needy=13 against starving=1 in the
		#      same snapshot — but it is a robustness fix, not the thing that unblocked the purchase.
		#  (2) AFFORDABILITY, and on the measured seed this was the ONLY binding constraint. The paired
		#      baseline arm (flags off, needy=-1 in the census confirming it) already showed trucks-desired=2
		#      from the very first ammo-need=True snapshot at tick 1200 — so the demand gate was open and
		#      correctly sized, owned=0 < desired=2, and the pre-empt was reached and skipped PURELY on price
		#      for 110 consecutive snapshots while cash sawtoothed 92/158/124/190/256/166/72 against a
		#      1000-cost truck. A pre-empt that merely SKIPS when broke is not a priority — the cycle falls
		#      through and spends the truck's money on a rifleman. SupplyPrecedenceStallCycles lets the path
		#      buy NOTHING and bank instead, which is the only move that expresses precedence.
		# THE BOUND IS ON PROGRESS, NOT ON TIME — a correction from adversarial review, and the reasoning is
		# worth keeping because a cycle count is the intuitive choice and it is wrong three ways.
		# A cycle-count bound was built and measured first, at 20 and then 30. It fails because:
		#   (a) IT DOES NOT TERMINATE. The counter resets on any non-banking cycle, INCLUDING when patience is
		#       spent — so hitting the cap inserts one purchase and restarts the bank. For any player whose
		#       income over the cap's span is under the truck price the steady state is: N silent cycles, one
		#       buy, N silent cycles, forever. The truck is never bought.
		#   (b) THE FALL-THROUGH BUY IS PRICED BY THE SAVINGS. Composition eligibility is affordability-
		#       filtered, so a fat balance PROMOTES expensive slots into the argmax. Measured at bound 20: the
		#       cap fired at cash=819 (181 short of the truck) and the very next cycle bought a 450 humvee,
		#       819 -> 203. A cap below the price does not delay the purchase, it DESTROYS the savings.
		#   (c) A CYCLE COUNT CANNOT ENCODE A PER-MAP, PER-PLAYER ECONOMY RATE. The same constant is a safety
		#       limit for a rich player and the engine of loop (a) for a poor one.
		# So the bank now continues only while the balance SETS NEW HIGHS, and abandons after this many
		# consecutive cycles without one. That terminates by construction — a balance that keeps setting new
		# highs reaches a fixed price in finite time — and it is self-calibrating across economies.
		# 4, not 1, because income arrives in lumps and upkeep nibbles between them: the measured healthy
		# spell ran 92/92/158/224/224/290/.../554/521/521/587, i.e. two flat cycles and a dip while climbing
		# overall, with a longest non-new-high run of 2. 4 clears that with margin.
		# IT ALSO ABSORBS A DEFECT IT DOES NOT FIX. This bank silences only the composition lane; the request
		# drains (CaptureCoordinator, AdaptiveProduction) go through the single-name BuildUnit overload before
		# the queue loop and never consult it, and the .heli UnitBuilder twins are separate trait instances
		# that never set SupplyDemandSizing — all spending the same treasury. Silencing those from here would
		# override other modules' own guarantees (the capture-supply floor is a correctness contract), so
		# instead this NOTICES the drain: no new high, stall climbs, spell ends. Measured shape of exactly
		# that — a player banked 30 consecutive cycles with cash pinned at 3-9, flat and never climbing, which
		# is a drain rather than poverty (a merely poor player's cash still creeps up during silence).
		# The cost, stated: while logistics is owed the army grows more slowly. That is the trade the ruling
		# asks for, and it is visible in the census best=/stalled= fields rather than silent.
		# NOT a restored SupplyTruckFloor: gated on live measured demand, so with a full-ammo army at t=0 —
		# the two-trucks-at-the-start bug the user reported FIRST — both knobs are inert.
		# @stable is UNAFFECTED: both are read only under SupplyDemandSizing, which @stable does not set, and
		# both default to baseline (false / 0) in C# regardless.
		SupplySizeFromNeed: true
		SupplyPrecedenceStallCycles: 4
		# Early-econ behaviour 2: vehicle AA proportionate to observed air (aa.america ungated picket).
		ScaleAntiAirToThreat: true
		AntiAirUnitTypes: strykershorad
		AntiAirBaseline: 0
		AntiAirPerObservedAir: 1
		# ===== COMPOSITION-DIRECTED PURCHASING (experimental-only; C# default is false) =====
		# Fixes "the army drifts to mortars". Both @experimental SquadManagers run IgnoreGroundUnits, so
		# idleUnitCount never rises above 0, so buildRandom is ALWAYS true and every ground call-in was a
		# UNIFORM lottery over the buildable list. A uniform BUY rate with unequal lifetimes settles the
		# STANDING army proportional to lifetime — long-lived rear-line mortars pile up while frontline
		# armour is eaten. With this on, the module censuses what it owns (per-mille of army VALUE, with
		# pending call-ins credited and evacuating units excluded) and buys the type furthest below target.
		CompositionDirected: true
		# Stops the two lanes that bought PAST the targets. It does NOT change the deficit pick — that argmax
		# already never picks an over-target class while any class is still short (restricting it to
		# under-target slots is a provable no-op; see ForceCompositionMath.SelectDeficit). The two real
		# effects: (1) a cycle where composed types are buildable but all priced out or at their UnitLimit
		# DECLINES instead of falling back to the uniform lottery — a bot spends to zero routinely, so the
		# affordability gate made that fallback frequent enough to dominate; (2) the counter-buy FIFO from
		# AdaptiveProductionBotModule is folded under the targets.
		CompositionEnforceTargetCeiling: true
		# The capture-supply floor is exempt on the FIFO lane: "a capturer must be obtainable when there is
		# something to capture" outranks the composition shape, and CaptureCoordinator's own alive-or-pending
		# floor already bounds it. Named explicitly rather than leaning on TecnRequestPriority being true in
		# ai.yaml — that flag is in another file, and its FIFO fall-back path would be silently ceiling-bounded
		# the moment someone turned it off.
		CompositionCeilingExemptTypes: tecn.america
		# TARGETS (not the ceilings UnitsToBuild weights are): per-mille of army VALUE. Sums to 1000.
		# Only types listed here are eligible for this pick — helicopters are deliberately absent (deferred
		# to their own lane) and so are never chosen by it.
		#
		# PROVISIONAL RETUNE (2026-08-05, baseline-bulk direction) — REVIEW AT MERGE. The infantry block is
		# unchanged in TOTAL (450, vehicles keep 550); only its internal split moved. Shares are per VALUE but
		# the design intent is per HEAD, and line infantry is the cheap end of the roster (rifle/LMG/grenadier
		# 100, mortar/AT/AA 300, sniper 400), so a value share converts to very different head counts. The old
		# split put line infantry at 65% of infantry HEADS; this one puts it at 80%, i.e. ~2.5 support per 10
		# line instead of ~5.2. Per 10 line infantry the support tail is now AT 0.9, mortar 0.5, AA 0.4,
		# medic 0.4, sniper 0.1, engineer 0.1, technician 0.1.
		UnitTargetShares:
			# Armour core — the force that actually takes and holds ground.
			abrams: 190
			bradley: 140
			# Screen / lift.
			humvee: 40
			m113: 30
			# Indirect fire.
			m109: 60
			# Air defence (strykershorad additionally stays capped by ScaleAntiAirToThreat above).
			strykershorad: 50
			truk: 40
			# ===== Line infantry — the BULK of the foot force (80% of infantry head count) =====
			e3.america: 95
			ar.america: 78
			tl.america: 62
			e2.america: 47
			# ===== Support infantry — small fractions of the line, not a second army =====
			# Anti-armour infantry — the cheap answer to a believed enemy tank push, and the largest support
			# share; the armor>antitank counter bias can lift it further when armour is actually believed.
			at.america: 66
			# mt.america is the type that was drifting; this is the deliberate cap-by-target.
			mt.america: 37
			aa.america: 28
			# Specialists and logistics (each additionally bounded by UnitLimits above).
			sn.america: 12
			# 17, was 9. USER RULING 2026-08-14: "in a platoon sized group of infantry (20 or so soldiers),
			# there should be one medic". That is a RATIO, which is exactly what a target share is — so it
			# belongs here rather than in a flat floor, and the old 9 was simply too low to express it.
			#
			# DERIVATION (corrected 2026-08-14 — the first version of this comment divided the WHOLE infantry
			# share by the LINE infantry cost, which is a category error: support infantry costs 2.5-4x line,
			# so that inflates the head count and the answer it produced was right only by luck).
			# Head count has to be summed per type, not averaged: soldiers = V/1000 * SUM(share_i / cost_i)
			# over the infantry block. With e3 95/100, ar 78/100, tl 62/200, e2 47/100, at 66/300, mt 37/300,
			# aa 28/300, sn 12/400, e6 8/250, tecn 8/250 that sum is 3.031 (medics excluded — they are what we
			# are sizing), i.e. 0.00303*V non-medic soldiers. One per 20 wants 0.0001515*V medics, and at cost
			# 100 that is 15.2 per-mille. So the honest figure is ~15; 17 is kept because it lands at one medic
			# per ~17.8 soldiers, comfortably inside "20 or so", and a slightly rich medic is cheap at 100.
			# For scale, the old 9 per-mille worked out at one medic per ~34 soldiers.
			# NOT redundant with the UnitFloors entry: the floor binds below ~11.8k army value, this binds above.
			# The vector now sums to 1008 rather than 1000. That is deliberate and harmless: InitializeComposition
			# runs SharesPerMille over these targets, which renormalises to exactly 1000, so the extra 8 is taken
			# proportionally from every other slot (<1% each) instead of being carved out of one arbitrary donor.
			medi.america: 17
			e6.america: 8
			tecn.america: 8
		# Role tokens — the row/column keys for CounterMatrixPct below. A type with no role simply
		# receives no counter bias. The armour line and the foot line are SEPARATE tokens on purpose:
		# sharing one "frontline" token would make believed enemy infantry raise the Abrams target by
		# exactly as much as the rifleman target, which is not what an infantry threat warrants. Same
		# reason mt (infantry mortar) is split from m109 (self-propelled artillery) — both are indirect
		# fire, but only one of them is the type that was drifting.
		UnitRoles:
			abrams: armorline
			bradley: armorline
			e3.america: infantryline
			ar.america: infantryline
			tl.america: infantryline
			e2.america: infantryline
			at.america: antitank
			strykershorad: antiair
			aa.america: antiair
			mt.america: mortar
			m109: artillery
			humvee: recon
			sn.america: recon
			m113: support
			truk: support
			medi.america: support
			e6.america: support
			tecn.america: support
		# Counter bias (v1, minimal): believed enemy class -> own role, as a percent contribution scaled
		# by that class's SHARE of the believed enemy force. Fog-legal — the believed composition comes
		# from the same belief store AdaptiveProduction reads, never ground truth. Clamped to
		# +/-CounterBiasMaxPct and renormalised, so it nudges the shape above without replacing it.
		# Believed enemy infantry answers the FOOT line (buy more of our own infantry), not the armour line.
		CounterMatrixPct:
			air>antiair: 60
			armor>antitank: 40
			infantry>infantryline: 20
