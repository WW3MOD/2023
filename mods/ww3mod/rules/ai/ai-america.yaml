			# call-in. At 600 it is the most expensive infantry purchase on the roster — six line
			# riflemen (e3 costs 100) of early tempo spent before there is a line to spend it for.
			# That is the defect this file has already shipped twice (two t=0 medics, two t=0 supply
			# trucks, PIPELINE 57(a)) and it runs straight into the user's ruling that "at the start
			# we need lots of soldiers to be able to defend ourselves".
			# WHY 3000 SPECIFICALLY: it is mnly's constant, and mnly is the true comparable — the
