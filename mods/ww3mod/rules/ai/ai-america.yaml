	# ===== Ground production — America, @stable twin =====
	# Split (early-econ PIPELINE 12): Experimental uses the @america.experimental twin below.
	# THIS is the @stable twin, despite the legacy `.normal` key (kept to avoid churn in DOCS/bots/
	# and in the NUnit fixtures that name it). Its gate was `enable-ai-player &&
	# !enable-ai-experimental` until the 2026-09-02 promotion re-stated it as the explicit
	# `enable-ai-stable` — the same resolved set, since enable-ai-player is granted only to
	# experimental+stable. Exactly one UnitBuilder is still enabled per player.
	# NO LONGER FROZEN: synced to the @experimental twin at that promotion, so the early-econ gates
	# (need-gated trucks + threat-scaled AA) now apply to @stable too.
	UnitBuilderBotModule@america.normal:
		RequiresCondition: enable-ai-stable && player.nato
		# 2026-09-02 promotion — full @experimental parity. Fields below are a verbatim copy of the
