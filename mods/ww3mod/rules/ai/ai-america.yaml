Player:
	# ===== Baseline ground production — America (enable-ai-player, non-Experimental) =====
	# Split (early-econ PIPELINE 12): Experimental uses the @america.experimental twin below
	# (need-gated trucks + threat-scaled AA). The `!enable-ai-experimental` guard keeps exactly
	# one UnitBuilder enabled per player — Stable holds this frozen block (it has
	# enable-ai-player but not enable-ai-experimental). Mirrors the HelicopterSquad split.
	UnitBuilderBotModule@america.normal:
		RequiresCondition: enable-ai-player && !enable-ai-experimental && player.nato
		UnitQueues: Vehicle, Infantry
		UnitsToBuild:
			# Conscripts -- low priority, mainly for capturing
			tecn.america: 500

			# Core infantry -- high priority mix
			e3.america: 120
			ar.america: 100
			tl.america: 80
			e2.america: 60

			# Support infantry
			at.america: 50
			mt.america: 40
			medi.america: 40
			aa.america: 30
			sn.america: 25
			e6.america: 20

			# Vehicles -- balanced force composition
			humvee: 30
			bradley: 25
			abrams: 20
			m113: 15
			m109: 15
			strykershorad: 10

			# Supply trucks for field resupply
			truk: 20

		UnitLimits:
			truk: 4
			tecn.america: 3
			e6.america: 2
			m109: 3
			strykershorad: 2
			sn.america: 3

	# ===== Experimental AI — America ground production (early-econ PIPELINE 12) =====
	# Byte-for-byte copy of @america.normal's UnitsToBuild/UnitLimits PLUS three default-off
	# early-econ gates (behaviours 1 & 2). Experimental-only condition; Stable keeps the
	# frozen twin above. The engine flags default false, so this block is the ONLY place they turn on.
	#   * GateResupplyOnAmmoNeed — no supply trucks while every truck-rearmable unit has full ammo.
	#   * ScaleAntiAirToThreat — cap vehicle AA (strykershorad) to OBSERVED enemy air; aa.america
	#     (cheap AA infantry) stays ungated as the baseline picket.
	UnitBuilderBotModule@america.experimental:
		RequiresCondition: enable-ai-experimental && player.nato
		UnitQueues: Vehicle, Infantry
		# ===== CAPTURE <-> COMBAT BUDGET SPLIT (combat-quality lever 3, production side) =====
		# These weights + UnitLimits are the STRATEGIC half of the capture/combat budget split (the tactical half —
		# capturer floor + escort reservation — is on CaptureCoordinatorBotModule@experimental in ai.yaml). The
		# capturer share is tecn.america here; every other type is combat force. NOTE (engine): a UnitsToBuild weight
		# is a share CEILING, not a priority — any weight >= 100 never binds, so it only marks a type "always eligible"
		# (picked uniformly), and the REAL cap on simultaneous capturers is UnitLimits.tecn.america below. To move
		# budget toward combat: lower UnitLimits.tecn.america (fewer capturers on the map) and/or raise combat-type
		# weights that currently sit below the roster average (throttled). Values below are unchanged (no behaviour
		# change until tuned).
		UnitsToBuild:
			# Conscripts -- low priority, mainly for capturing (the capture side of the budget split)
			tecn.america: 500

			# Core infantry -- high priority mix
			e3.america: 120
			ar.america: 100
			tl.america: 80
			e2.america: 60

			# Support infantry
			at.america: 50
			mt.america: 40
			medi.america: 40
			aa.america: 30
			sn.america: 25
			e6.america: 20

			# Vehicles -- balanced force composition
			humvee: 30
			bradley: 25
			abrams: 20
			m113: 15
			m109: 15
			strykershorad: 10

			# Supply trucks for field resupply (need-gated below)
			truk: 20

		UnitLimits:
			# 12, not 4: this is now only the absolute backstop above SupplyTruckCeiling (6) — see
			# SupplyDemandSizing below. It must sit clear of the ceiling or it, not demand, sizes the fleet.
			# The headroom over 6 is for SPENT HULLS: this limit counts every truk actor, while the fleet
			# target counts only trucks that still hold supply, and a drained truck lingers until the
			# follower's evac/sell path removes it. Too little headroom and a few hulls freeze procurement.
			truk: 12
			tecn.america: 3
			e6.america: 2
			m109: 3
			strykershorad: 2
			sn.america: 3
		# ===== STANDING-POPULATION FLOORS (experimental-only; C# default is unset) =====
		# USER RULING 2026-08-14: "build medics", and "there is always an AA soldier or two on the field".
		# A UnitTargetShares entry CANNOT deliver either, and the reason is arithmetic, not tuning. Shares are
		# per-mille of army VALUE, so one unit of a type only fits under its target once the army is worth
		# 1000*cost/target: medi.america at 9 per-mille needs a 11,111-value army before a SINGLE medic is
		# under target, and the starting platoon is worth 2,900 — so the one medic you start with is already
		# 34 per-mille, the ceiling strikes the slot, and it stays struck. Worse under losses: MEASURED offline
		# (--composition-plan, 200 cycles) medics are bought 4x with no losses and ZERO times at a
		# 1-in-40-per-cycle loss rate, because the big slots (abrams 190, e3 95) stay permanently in deficit
		# and the argmax never descends to a 9-per-mille slot. Live @experimental match, 6 sim-minutes: the
		# surviving bot ended with medi.america=0+0 — dead and never replaced.
		# aa.america is the AA SOLDIER and is ungated; it rides the same argmax and fails the same way. It is
		# NOT what ScaleAntiAirToThreat covers — that gate names strykershorad, the AA VEHICLE, and it is a CAP
		# not a floor (see AntiAirBaseline below).
		# The floor pre-empts the deficit pick, so it outranks the target ceiling and the demand gates. It
		# counts owned + IN-CARGO + pending: aa/medi are both PassengerTypes on MountedTransportBotModule and
		# boarding REMOVES a passenger from world.Actors, so a world-only count would buy replacements forever
		# to feed transports.
		# NOT LISTED HERE, DELIBERATELY: tecn.america. A technician floor ALREADY EXISTS, in another module —
		# CaptureCoordinatorBotModule.MaintainTecnFloor (TecnFloor / TecnFloorMax / ScaleTecnFloorToPois),
		# which requests through IBotRequestUnitProduction and so is invisible from this trait's vantage. It is
		# a capture-DEMAND floor, not a standing-population one: it is reached only from the
		# `idleCapturers.Length == 0` branch and returns early on `!CaptureTargetExists()` — "we never spend
		# budget on a TECN with nothing to capture." That is the correct mechanism for a consumable capture
		# tool, and both live matches ended with tecn=1 alive, so it works. A UnitFloors entry here would be a
		# SECOND floor on the same population, and which one won would depend on module ordering nobody wrote
		# down. (The offline --composition-plan replay reports tecn NEVER BOUGHT under attrition; that is an
		# artefact of the replay modelling only this module's lane, not a defect.)
		# CROWDING-OUT, MEASURED — a floor pre-empts the deficit pick, so it necessarily spends budget the
		# target vector wanted elsewhere, and that cost belongs here next to the knob rather than in a report.
		# At 1-in-40 attrition (--composition-plan, 200 cycles) the two floored types settle at medi 14 + aa 42
		# = 56 per-mille against a combined target of 17 + 28 = 45, i.e. the specialist allocation runs ~1.24x
		# its share. An earlier cut of this branch also floored the sniper at 2 and measured ~1.9x (109 against
		# 57) — the sniper was dropped precisely because it was the expensive third of that, 800 of pinned
		# budget driving its slot to 4.5x target on the strength of an unanchored delay constant. At 1-in-15
		# the ratio rises to ~2.3x, but that is an army collapsing to 7,700 value where two floored men are
		# unavoidably a large share; the floor is doing its job there, not misbehaving.
		# The overshoot is ALL in aa (42 vs 28); medi actually lands UNDER its target at 14 vs 17, so the floor
		# and the share are complementary rather than additive there — the floor binds below ~11.8k army value
		# and the share takes over above it.
		UnitFloors:
			medi.america: 2
			aa.america: 2
		# Unconditional [composition] census into debug.log every 40 bot ticks. C# default is 0; this is
		# the opt-in. Observability only — reads state, changes no decision.
		CensusLogInterval: 40
		# READ THIS AS A HARD BAN, NOT AS FLOOR SCHEDULING. UnitDelays is consulted at all THREE call-in sites —
		# BuildUnit, IsCompositionCandidateEligible and ChooseBelowFloor — so before tick 2000 no AA soldier can
		# be called in by ANY lane: not the floor, not the deficit pick, not an external request. It is a
		# capability ban on the type for the first ~80 seconds, not merely a delayed floor.
		# WHY THAT IS THE RIGHT CALL: `^AA` carries exactly ONE armament (MANPAD, `ValidTargets: Air`) and
		# inherits ^AutoTargetAir, so an AA soldier CANNOT engage ground at all, and BOTH factions gate every
		# attack helicopter behind `UnitDelays: 2500` (`ai.yaml` heli/littlebird/hind/mi28). Tick 2500 is
		# therefore the earliest an enemy airframe can even be ORDERED, before call-in and the flight over —
		# so an AA soldier bought before 2000 is strictly wasted budget with nothing it could legally shoot.
		# 2000 is derived from that gate, not guessed. A medic is useful from first contact, so it has no delay.
		# THE COST, STATED: the starting platoon ships ZERO AA soldiers, so the shipped behaviour against the
		# user's "there is always an AA soldier or two on the field" is honestly "NONE for the first ~80
		# seconds, then two". That is a deliberate trade of early coverage for early tempo, not an oversight.
		# SCOPE: this bounds a BOT opponent. A human can rush a helicopter earlier and this does not protect
		# against that. The follow-up the user asked for is a COMPUTED time-to-threat (enemy income vs airframe
		# cost, plus flight time from their SR to ours) rather than a static tick; filed with the build-order
		# design.
		UnitDelays:
			aa.america: 2000
		# Early-econ behaviour 1: don't call in trucks while no fielded unit needs ammo.
		GateResupplyOnAmmoNeed: true
		ResupplyUnitTypes: truk
		# ===== DEMAND-SIZED SUPPLY FLEET =====
		# Measured 2026-08-10 (user's 30-minute match, debug.log): ONE standing truck per player for the whole
		# game, with a large fraction of the infantry out of ammo. 14 truck actor-ids appear across the match,
		# but their lifespans only overlap ACROSS the two AI players — every new id is a replacement for a dead
		# one, never fleet growth.
		#
		# The cap was never UnitLimits (4, never reached). It was UnitTargetShares: truk: 40 below. Shares are
		# per-mille of army VALUE, so a 1000-cost truck at 40 per-mille is one truck per 25,000 value of army —
		# and a realistic mid-game army is ~15-22k. CompositionEnforceTargetCeiling then strikes the truk slot
		# the instant the first truck puts the census over 40 per-mille, so the second is never bought. A
		# budget SHARE is the wrong question for logistics: a truck's workload scales with the number of
		# CUSTOMERS, not with how expensive the army defending them happens to be.
		#
		# Deliberately over-provisioned (200%) on the user's explicit instruction — trucks drive toward the
		# fighting and get shot, so a fleet sized to the exact requirement is short the moment one dies.
		# TO TUNE DOWN once several trucks are visibly moving at once: lower
		# SupplyDemandOvercompensationPercent, NOT SupplyCustomersPerTruck (that one is a physical fact about
		# the truck: TotalSupply 750 over a ~125-supply typical full reload).
		SupplyDemandSizing: true
		SupplyStarvingThresholdPerMille: 250
		SupplyCustomersPerTruck: 6
		SupplyDemandOvercompensationPercent: 200
		# 0, was 2. USER RULING 2026-08-14: "no supply truck until at least one unit is below full ammo."
		# MEASURED live, @experimental vs @experimental, tick 40 of the match: the census read
		# `truk=0+0/909v40` — 90.9% of everything the bot had committed was supply trucks, against a 40
		# per-mille target, because the floor's two trucks are the FIRST two call-ins of the match, ahead of
		# every combat unit. Offline (--composition-plan): 2000 budget against a 2900-value starting platoon.
		# This DELETES a deliberate design decision and the cost is real, so state it rather than bury it: the
		# floor existed so the first unit to run dry does not wait a full procurement cycle for a truck to be
		# ordered, called in and driven out. That latency is now paid on first ammo demand instead of pre-paid
		# at t=0. The bet is that this is the better trade, because at t=0 nobody has fired a shot — every unit
		# spawns full — so the pre-payment buys idle trucks during the one window where tempo (POI capture, map
		# control) compounds. GateResupplyOnAmmoNeed + AnyFieldedUnitNeedsResupply now do the work they were
		# written for, and demand sizing still grows the fleet once anyone is actually dry.
		# @stable is UNAFFECTED: it sets neither SupplyDemandSizing nor SupplyTruckFloor, and
		# SupplyFleetUnderDesired returns false outright when the flag is off — @stable never had a truck floor.
		SupplyTruckFloor: 0
		SupplyTruckCeiling: 6
		# Early-econ behaviour 2: vehicle AA proportionate to observed air (aa.america ungated picket).
		ScaleAntiAirToThreat: true
		AntiAirUnitTypes: strykershorad
		AntiAirBaseline: 0
		AntiAirPerObservedAir: 1
		# ===== COMPOSITION-DIRECTED PURCHASING (experimental-only; C# default is false) =====
		# Fixes "the army drifts to mortars". Both @experimental SquadManagers run IgnoreGroundUnits, so
		# idleUnitCount never rises above 0, so buildRandom is ALWAYS true and every ground call-in was a
		# UNIFORM lottery over the buildable list. A uniform BUY rate with unequal lifetimes settles the
		# STANDING army proportional to lifetime — long-lived rear-line mortars pile up while frontline
		# armour is eaten. With this on, the module censuses what it owns (per-mille of army VALUE, with
		# pending call-ins credited and evacuating units excluded) and buys the type furthest below target.
		CompositionDirected: true
		# Stops the two lanes that bought PAST the targets. It does NOT change the deficit pick — that argmax
		# already never picks an over-target class while any class is still short (restricting it to
		# under-target slots is a provable no-op; see ForceCompositionMath.SelectDeficit). The two real
		# effects: (1) a cycle where composed types are buildable but all priced out or at their UnitLimit
		# DECLINES instead of falling back to the uniform lottery — a bot spends to zero routinely, so the
		# affordability gate made that fallback frequent enough to dominate; (2) the counter-buy FIFO from
		# AdaptiveProductionBotModule is folded under the targets.
		CompositionEnforceTargetCeiling: true
		# The capture-supply floor is exempt on the FIFO lane: "a capturer must be obtainable when there is
		# something to capture" outranks the composition shape, and CaptureCoordinator's own alive-or-pending
		# floor already bounds it. Named explicitly rather than leaning on TecnRequestPriority being true in
		# ai.yaml — that flag is in another file, and its FIFO fall-back path would be silently ceiling-bounded
		# the moment someone turned it off.
		CompositionCeilingExemptTypes: tecn.america
		# TARGETS (not the ceilings UnitsToBuild weights are): per-mille of army VALUE. Sums to 1000.
		# Only types listed here are eligible for this pick — helicopters are deliberately absent (deferred
		# to their own lane) and so are never chosen by it.
		#
		# PROVISIONAL RETUNE (2026-08-05, baseline-bulk direction) — REVIEW AT MERGE. The infantry block is
		# unchanged in TOTAL (450, vehicles keep 550); only its internal split moved. Shares are per VALUE but
		# the design intent is per HEAD, and line infantry is the cheap end of the roster (rifle/LMG/grenadier
		# 100, mortar/AT/AA 300, sniper 400), so a value share converts to very different head counts. The old
		# split put line infantry at 65% of infantry HEADS; this one puts it at 80%, i.e. ~2.5 support per 10
		# line instead of ~5.2. Per 10 line infantry the support tail is now AT 0.9, mortar 0.5, AA 0.4,
		# medic 0.4, sniper 0.1, engineer 0.1, technician 0.1.
		UnitTargetShares:
			# Armour core — the force that actually takes and holds ground.
			abrams: 190
			bradley: 140
			# Screen / lift.
			humvee: 40
			m113: 30
			# Indirect fire.
			m109: 60
			# Air defence (strykershorad additionally stays capped by ScaleAntiAirToThreat above).
			strykershorad: 50
			truk: 40
			# ===== Line infantry — the BULK of the foot force (80% of infantry head count) =====
			e3.america: 95
			ar.america: 78
			tl.america: 62
			e2.america: 47
			# ===== Support infantry — small fractions of the line, not a second army =====
			# Anti-armour infantry — the cheap answer to a believed enemy tank push, and the largest support
			# share; the armor>antitank counter bias can lift it further when armour is actually believed.
			at.america: 66
			# mt.america is the type that was drifting; this is the deliberate cap-by-target.
			mt.america: 37
			aa.america: 28
			# Specialists and logistics (each additionally bounded by UnitLimits above).
			sn.america: 12
			# 17, was 9. USER RULING 2026-08-14: "in a platoon sized group of infantry (20 or so soldiers),
			# there should be one medic". That is a RATIO, which is exactly what a target share is — so it
			# belongs here rather than in a flat floor, and the old 9 was simply too low to express it.
			#
			# DERIVATION (corrected 2026-08-14 — the first version of this comment divided the WHOLE infantry
			# share by the LINE infantry cost, which is a category error: support infantry costs 2.5-4x line,
			# so that inflates the head count and the answer it produced was right only by luck).
			# Head count has to be summed per type, not averaged: soldiers = V/1000 * SUM(share_i / cost_i)
			# over the infantry block. With e3 95/100, ar 78/100, tl 62/200, e2 47/100, at 66/300, mt 37/300,
			# aa 28/300, sn 12/400, e6 8/250, tecn 8/250 that sum is 3.031 (medics excluded — they are what we
			# are sizing), i.e. 0.00303*V non-medic soldiers. One per 20 wants 0.0001515*V medics, and at cost
			# 100 that is 15.2 per-mille. So the honest figure is ~15; 17 is kept because it lands at one medic
			# per ~17.8 soldiers, comfortably inside "20 or so", and a slightly rich medic is cheap at 100.
			# For scale, the old 9 per-mille worked out at one medic per ~34 soldiers.
			# NOT redundant with the UnitFloors entry: the floor binds below ~11.8k army value, this binds above.
			# The vector now sums to 1008 rather than 1000. That is deliberate and harmless: InitializeComposition
			# runs SharesPerMille over these targets, which renormalises to exactly 1000, so the extra 8 is taken
			# proportionally from every other slot (<1% each) instead of being carved out of one arbitrary donor.
			medi.america: 17
			e6.america: 8
			tecn.america: 8
		# Role tokens — the row/column keys for CounterMatrixPct below. A type with no role simply
		# receives no counter bias. The armour line and the foot line are SEPARATE tokens on purpose:
		# sharing one "frontline" token would make believed enemy infantry raise the Abrams target by
		# exactly as much as the rifleman target, which is not what an infantry threat warrants. Same
		# reason mt (infantry mortar) is split from m109 (self-propelled artillery) — both are indirect
		# fire, but only one of them is the type that was drifting.
		UnitRoles:
			abrams: armorline
			bradley: armorline
			e3.america: infantryline
			ar.america: infantryline
			tl.america: infantryline
			e2.america: infantryline
			at.america: antitank
			strykershorad: antiair
			aa.america: antiair
			mt.america: mortar
			m109: artillery
			humvee: recon
			sn.america: recon
			m113: support
			truk: support
			medi.america: support
			e6.america: support
			tecn.america: support
		# Counter bias (v1, minimal): believed enemy class -> own role, as a percent contribution scaled
		# by that class's SHARE of the believed enemy force. Fog-legal — the believed composition comes
		# from the same belief store AdaptiveProduction reads, never ground truth. Clamped to
		# +/-CounterBiasMaxPct and renormalised, so it nudges the shape above without replacing it.
		# Believed enemy infantry answers the FOOT line (buy more of our own infantry), not the armour line.
		CounterMatrixPct:
			air>antiair: 60
			armor>antitank: 40
			infantry>infantryline: 20
