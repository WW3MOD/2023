kinzhalmissile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.8

# The two Phase 2 missile-power bodies. Both reuse the Iskander missile art, as kinzhalmissile
# above does -- the mod has no bespoke sprite for either and CheckSequences requires the image to
# resolve. Scale is the only thing distinguishing them in flight: the GBU-57 is a 13-tonne
# penetrator, so it renders largest once RenderSprites.Scale is applied on top (1.1 x 0.9 = 0.99
# effective, against the Kinzhal 0.95 x 0.8 = 0.76); the tactical nuke sits between them at 0.89.
gbu57bomb:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.9

tacnukemissile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.85

# The Oreshnik re-entry vehicle. Same Iskander art again, for the same reason the four bodies above
# give -- the mod has no bespoke RV sprite and CheckSequences requires the image to resolve. This
# block exists because the gate caught its absence: an actor whose Image nothing defines is an
# ERROR, not a warning, and the branch could not run the linter that says so.
#
# SMALLEST OF THE SET at 0.6 here x RenderSprites.Scale 0.85 = 0.51 effective, against the
# Kinzhal's 0.76 and the high-yield body's 2.24. That is deliberate and is not only about realism:
# one warhead off a six-warhead bus IS a small object, and a small body is what makes the plasma
# read as the thing you are looking at rather than as a coat of paint on a missile sprite.
oreshnikrv:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.6

# The high-yield strategic warhead's body. Same Iskander art again for the same reason -- the mod
# has no bespoke sprite and CheckSequences requires the image to resolve -- but 1.4 here against
# tacnukemissile's 0.85, and RenderSprites.Scale 1.6 against its 1.05 on top (vehicles.yaml), for
# 2.24 effective versus 0.89. Scale is the ONLY thing that says "this one is much larger" in
# flight, so it is doing real work rather than decorating.
highyieldnukemissile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 1.4

# The nuclear-arsenal delivery bodies (rules/ingame/nuclear-arsenal.yaml). Same Iskander art as every
# other missile-power body -- the mod has no bespoke sprite for any of them and CheckSequences requires
# the image to resolve. Scale is the only thing separating them in flight, and it is multiplied by each
# actor's own RenderSprites.Scale on top: the two B61 dial settings share a body and so share a scale,
# and tsarbombamissile is the largest thing in the mod at 1.8 x 2.4 = 4.32 effective against
# tacnukemissile's 0.89.
b61lowmissile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.7

b61maxmissile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.7

w76missile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.85

sarmatmissile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 1.3

b83missile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 1.4

tsarbombamissile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 1.8

# The four Russian nuclear delivery bodies (rules/ingame/nuclear-arsenal.yaml, added 2026-09-07).
# Same iskander-missile art as every other missile-power body in the mod, for the same two reasons:
# there is no bespoke sprite for any of them, and CheckSequences requires the image to resolve. For
# rukinzhalnmissile the reuse is exact rather than approximate -- the Kh-47M2 is Iskander-derived
# and kinzhalmissile above already draws the conventional version with this art at this same 0.8.
#
# Scale here is multiplied by each actor's own RenderSprites.Scale. Effective sizes:
#   ru9m729missile     0.65 x 0.80 = 0.52   smallest body in the mod; a GLCM
#   ruiskandermissile  0.80 x 0.95 = 0.76   identical to kinzhalmissile, because it is that missile
#   rukinzhalnmissile  0.80 x 0.95 = 0.76   likewise, and deliberately the same as the line above
#   rukalibrmissile    0.70 x 0.90 = 0.63   long and thin against the W76 RV's 0.89 at equal yield
ru9m729missile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.65

ruiskandermissile:
	idle: iskander-missile
		Facings: 32
		ZOffset: 1023
		Scale: 0.8

