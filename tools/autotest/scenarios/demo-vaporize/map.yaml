Visibility: MissionSelector

Categories: Test

# WHAT THIS IS FOR: looking at. It is a DEMO, so nothing here is asserted - no AssertWithin, no
# Test.Pass, no result.json.
#
# THE SUBJECT IS THE BOUNDARY, not the effect. Two identical target fields, each a bullseye of five
# concentric rings at 2, 4, 6, 8 and 10 cells from ground zero. One weapon detonates at each centre
# and does two things at once: it VAPORISES everything inside a small radius, and it kills everything
# out to 12 cells the ordinary way. So each site shows both outcomes side by side, separated by a
# crisp circle - inside it units cease to exist, outside it they leave the husks they always have.
# That contrast is the whole point; a demo that vaporised everything would prove nothing, because a
# dead unit and a vanished one look identical once the smoke clears.
#
# THE TWO SITES ARE THE TWO SHIPPING MODES, and they exist because fireball size decides which one is
# honest. Radius scales as roughly Y^0.40, so at 20 kt the fireball is about 0.7 cells across the
# radius and at 6 Mt about 6.8 - a twentyfold difference in area.
#
#   LEFT  (17,18)  radius 2c0, WhiteoutFraction 1.0, Duration 10.
#                  The SMALL-yield answer. The sprite superheats and is simply gone; there is no
#                  dissolve, because inside a sub-cell fireball nobody could see one. This is the
#                  "hide the removal behind the flash" approach, and the palette flash fired by the
#                  same weapon is what it hides behind.
#
#   RIGHT (48,18)  radius 6c0, WhiteoutFraction 0.35, Duration 30.
#                  The LARGE-yield answer. Thirteen cells of fireball is a lot of screen, so the
#                  removal is worth watching: each unit heats, turns into a white silhouette, and
#                  the silhouette fades over about a second and a half.
#
# Both sites use the SAME warhead type with different numbers. Nothing here is nuclear - the weapon
# lives in this scenario's own weapons.yaml and the shipped nuclear warheads are untouched.
#
# The terrain is demo-light-events', copied unchanged; essentially every playable cell is passable, so
# actor placement is unconstrained.

