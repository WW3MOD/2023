	# --- Southern lane: the control, identical but reachable ---
	# 16 cells of clear ground south of the ring, so the two lanes cannot interact: the nearest Centre
	# to each truck is its own (21 cells) rather than the other lane's (~26), which matters because an
	# emptied truck picks a restock host by distance on its own.
	TruckOpen: truk
		Owner: USA
		Location: 10,26
		Supply: 50
	OpenLC: logisticscenter
		Owner: USA
		Location: 30,26
		Supply: 2250

	# Off the trucks' cells, but NOTHING DEPENDS ON THAT — corrected 2026-09-01. The marker was put
	# here because nav-guard read a co-located mpspawn as blocking the truck's own start cell. That
	# was a bug in nav-guard, not a fact about the map: `mpspawn` sets `Immobile: OccupiesSpace:
	# false` (misc.yaml:245), so the engine gives it no occupied cells at all (Immobile.cs:41) and
	# never adds it to the ActorMap (ActorMap.cs:413-415). The sibling scenarios co-locate marker
	# and truck and always did work — that was the tell. Fixed in modload.py `actor_shape`.
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 10,18
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 60,30
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

