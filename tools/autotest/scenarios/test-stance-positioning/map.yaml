# Phase 2 positioning executor (§4 Defensive), tested in ISOLATION. A single AR is placed a few
# cells SOUTH of a treeline (tank-trap density row at y=16, x=10..16) with an enemy tank sighted
# further south. The AR is human-owned so NO bot module can move it — the ONLY thing that can is the
# StancePositioningExecutor, which the test enables via `enable-tactical-positioning` (the real
# Phase-3 human-activation path, granted from Lua). This deliberately keeps the assertion about the
# executor's decision pipeline, not the strategic layer.
#
# Expected (GREEN, grant present): the AR walks NORTH to the treeline's threat-facing (south) cover
# edge (y=17), a cell inside its 4-cell leash of the spawn anchor (13,19), and HOLDS there without
# oscillating. RED (grant withheld): the executor stays disabled and the AR never leaves the spawn.
