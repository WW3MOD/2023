MapFormat: 12

RequiresMod: ww3mod

Title: DEMO: nuclear fireball over a fog boundary -- the seam is gone

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 128,128

Bounds: 1,1,126,126

Visibility: MissionSelector

Categories: Test

# WHAT THIS IS FOR: looking at ONE THING -- whether the nuclear fireball still shows a brightness
# seam where it crosses a fog boundary. It is a DEMO, so nothing here is asserted: no AssertWithin,
# no Test.Pass, no result.json.
#
# THE BUG THIS EXISTS TO SHOW. Fog in OpenRA is COMPOSITED, not tinted. ShroudRenderer paints a
# stack of black quads over the world (WorldRenderer.Draw) AFTER every sprite has been drawn, so a
# sprite wide enough to span cells of different visibility gets darkened cell-by-cell and reads as
# one object with a hard brightness step across it. SpriteRenderable.Render carries no fog term at
# all, which is why `VisibleThroughFog: true` never helped: that flag only stops the effect being
# CULLED, and it is a single point test on the effect's centre.
#
# THE ARRANGEMENT, and every part of it is deliberate:
#
#   * The map is PRE-EXPLORED (ExploredMapCheckboxEnabled) and FOG IS ON. So there is no shroud
#     anywhere on this map -- every cell is explored -- and the only thing modulating brightness is
#     fog. That isolates the variable: anything dark here is fog and nothing else.
#
#   * ONE CAMERA actor at 58,64, six cells west of ground zero, owned by USA. CAMERA is the right
#     actor and not merely a convenient one: it inherits ^StandardVision, so it sees with exactly
#     the shipped ten-band ramp, and it carries NO Health and NO Targetable (misc.yaml:150), so the
#     detonation cannot kill it. A normal unit here would be vaporised by Warhead@ThermalVaporize
#     on the first tick and take the bright region with it -- the fog boundary would vanish at the
#     exact moment the fireball appeared, which is the one frame this demo exists to show.
#
#   * ^StandardVision is a RAMP, not a switch: strength 10 out to 4c0, then a step every 3 cells
#     down to strength 1 at 32c0 (defaults.yaml:109). Ground zero is 6 cells from the camera, so it
#     sits at visibility 9, and visibility falls one band every 3 cells eastward from there --
#     reaching full fog about 26 cells out. The fireball is therefore crossed by a fan of
#     concentric bands rather than by a single line, which is exactly the "some parts have less
#     visibility" the report describes.
#
#   * CameraRange is forced to 0 in rules.yaml. The shipped power reveals 55 cells around the aim
#     point shortly BEFORE detonation, which would wipe out the fog arrangement moments before the
#     fireball arrived and leave nothing to look at.
#
# WHAT TO LOOK FOR: the fireball should be ONE uniform brightness from edge to edge, sitting over
# ground that is plainly still fogged in bands underneath it. Before the fix the same frame showed
# the cloud stepping darker towards the east. The GROUND must still be banded -- if the terrain
# under the cloud brightened too, the change lifted fog rather than reordering a draw, and that is
# a bug and not a fix.
#
# The terrain and the 481-actor starburst are demo-highyield-nuke's, copied unchanged, so every
# actor placement here is one already known to sit on valid ground. They are scenery for this
# demo: they give the fog bands something to fall across so the boundary is readable.

