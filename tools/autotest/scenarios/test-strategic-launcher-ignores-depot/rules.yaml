Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-strategic-launcher-ignores-depot.lua

HIMARS:
	# ONE round, so the pool empties on the first shot and INotifyAttack.Attacking reaches
	# AutoRearmIfDry immediately (AmmoPool.cs:770). Ammo stays 2 -- the shipped value -- so nothing
	# about the pool's identity changes: Essential: true and SupplyValue: 1500 are untouched, which
	# matters because the depot's affordability arithmetic is part of what is asserted below.
	#
	# THE LUA ASSERTS THIS RESOLVED TO 1, and that is not defensive padding. A pin on the branch that
	# shipped 9e46f141 resolved a value to zero through inheritance and passed happily with the bug
	# sabotaged in. A launcher starting at 0 evacuates from OnBecomingIdle without ever firing, which
	# would make this scenario pass while measuring nothing at all.
	AmmoPool@1:
		InitialAmmo: 1
	# ==========================================================================================
	# THE RED ARM, RUN AND OBSERVED 2026-08-30, left here armed-by-comment.
	#
	# Uncomment the two fields below to restore the pre-ruling stance and change NOTHING else -- the
	# Rearmable stays absent, exactly as it now ships. The launcher must then FAIL to leave.
	#
	# OBSERVED, not predicted. Run 260830_065529_p44302, seed 123361560, result.json status=fail:
	#
	#     fail: the launcher is still on the map after 1200 ticks, holding 0 round(s) beside a depot
	#     still holding 2250. It neither rearmed nor left.
	#
	# The two numbers in that sentence are what make the RED ATTRIBUTABLE rather than merely red.
	# "holding 0" proves it fired and genuinely entered the dry path -- had it read 1 the launcher
	# never shot and nothing about resupply was exercised. "depot still holding 2250" proves it took
	# nothing on the way. So the unit was wholly dry, standing beside a full depot it was entitled to
	# ignore, and it did neither of the two things a dry unit may do. That is HoldAndFlag and nothing
	# else. The green arm on the same build is run 260830_065814_p44619, seed 1689462810, status=pass.
	#
	# WHY THIS IS THE RIGHT RED, AND A REARMABLE-RESTORING ONE IS NOT. The interesting failure of this
	# change is not "it rearmed", it is "it did nothing" -- and that failure is invisible to any test
	# that merely checks the unit did not rearm. With no Rearmable, NamesRearmActors is false, so
	# SupplyHuntMath.DecideAutoDisposition returns HoldAndFlag at :269 before it ever reaches the
	# evacuation conjunction. The unit then stands on the field forever, combat-inert, flagging
	# NeedsResupply for a rescue no provider in this ruleset can perform -- the flag's only reader is
	# a Hunt-stance provider that must DRIVE to the client, and the Centre is a building.
	#
	# So this arm sabotages the mechanism the fix actually turns on -- the explicit Evacuate stance --
	# rather than the one everyone assumes it turns on. Restoring Rearmable would test a different,
	# louder and much less dangerous mistake.
	#
	# Kept as commented FIELDS inside this entry rather than a second `HIMARS:` block: a duplicate
	# top-level key in one file is exactly the adjacent-entry merge hazard CLAUDE.md warns about.
	AutoTarget:
		#InitialResupplyBehavior: Auto
		#InitialResupplyBehaviorAI: Auto
