# AUDIT PACKAGE 4 (audit/260921-release-readiness.md §2.6 U2): "Infantry give no selection
# feedback at all — box-select six riflemen, nothing changes."
#
# The staging answers that as a PICTURE, because the static read says the finding's premise is
# half true and the interesting half is not the half it names:
#
#   * TRUE — no corner-bracket selection box is ever drawn on infantry. ^Infantry sets
#     SelectionDecorations ShowNever: true (infantry.yaml:56-57, the only ShowNever under mods/)
#     and SelectionDecorationsBase.cs:109 gates the box on `selected && !Info.ShowNever`.
#   * FALSE as written — ^Soldier DOES carry a selection-only mark: WithDecoration@Selected
#     (infantry.yaml:232-237), RequiresSelection: true, drawing selected_infantry/pip-selected
#     (sequences-infantry.yaml:61-64; art bits/units/pips/pip-selected.shp).
#   * THE LIVE SUSPECT — that pip is authored at Position: Top, Margin: 0,6, which is the
#     EXACT anchor of WithDecoration@Class (infantry.yaml:226-231, e3_class on ^E3). Decorations
#     carry no z-order at all (every renderable reports ZOffset 0; iteration order is whatever
#     TraitsImplementing<IDecoration> returned at Created, SelectionDecorationsBase.cs:42-43),
#     so which of the two is on top is unauthored. WORKSPACE/indicator-audit.md:271 records the
#     same collision. If the class pictogram wins, the shipped selection mark is invisible and
#     the user's report is exactly right for a reason nobody has written down.
#
# ARM A vs ARM B ARE THE SAME SPRITE ON PURPOSE. e3r1.america inherits e3.america wholesale
# (infantry-america.yaml:24-30) and therefore renders image e3.america, carries the identical
# Selectable bounds from ^Infantry (500,700,65,-128) and the identical decoration stack. The
# only shipped difference is ProducibleWithLevel: InitialLevels: 2, which would put a rank
# chevron on arm B and nothing on arm A — so rules.yaml strips it. After that the two arms are
# pixel-comparable and the ONLY authored difference between them is ShowNever.
#
# Every group has an UNSELECTED CONTROL two rows below it. That is what makes each frame
# self-contained: a mark that appears on the top row and not the bottom row is selection-gated;
# a mark on both rows is not. It also inoculates the frames against the capture harness's own
# distortion — TestModeLogic.cs:31 nulls RenderPlayer, so every ValidRelationships gate is off
# and MORE decorations draw than a player would see (SCREENSHOT.md). The control row absorbs
# that: both rows are equally over-decorated, so the DIFFERENCE is still honest.
#
# THE VEHICLE PAIR IS NOT DECORATION. DOCS/reference/architecture.md §Widget/chrome authoring
# gotchas currently states that own vehicles draw their corner brackets on the UNSELECTED path
# "so the bracket is not a selection indicator at all", citing
# `renderDecorations = selected ? selectedDecorations : decorations` (SelectionDecorationsBase.cs:129).
# That line governs IDecoration traits (pips, glyphs) and cannot emit a bracket: the bracket is
# a SelectionBoxAnnotationRenderable, constructed at exactly one site in the mod's render path
# (SelectionDecorations.cs:75, reached only from :110 under `selected && !Info.ShowNever`). One
# selected abrams beside one unselected abrams settles a curated claim for the cost of two actors.

