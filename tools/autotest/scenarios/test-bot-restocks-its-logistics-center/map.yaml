		Location: 58,16

	# The Centre under test, ALREADY OWNED so the purchase gate is out of the picture entirely.
	BotCentre: logisticscenter
		Owner: USA-bot
		Location: 20,16

	# The near truck — the one the distance-dominant ranking must choose.
	NearTruck: truk
		Owner: USA-bot
		Location: 24,16
		Facing: 768

	# The far truck. Present ONLY so that "a truck was dispatched" is not the same statement as "the
	# right truck was dispatched".
	FarTruck: truk
		Owner: USA-bot
		Location: 10,22
		Facing: 768

	# A small force so the bot runs its ordinary module set rather than an empty one, and so
