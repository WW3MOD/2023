# Focused capture assertion (companion to test-experimental-poi-harness, which is the
# broad observation scenario). Isolates capture EXECUTION from distance/frontline
# confounds: a single high-value derrick (BIO, the top PoiMap pick) placed CLOSE
# (~8c) to the USA-bot SR and far from any enemy, with a minimal pre-placed force
# (1 TECN + 2 escorts, no army pool) so nothing drags the capturer forward. If
# the PoiMap→capture→goal-guard pipeline captures anything, it captures this.
#
#   Left  (6,16)  = USA-bot experimental   — pre-placed TECN + 2 escorts
#   Right (58,16) = Russia normal — far away, does not reach the derrick in-window
Players:
	PlayerReference@Neutral:
