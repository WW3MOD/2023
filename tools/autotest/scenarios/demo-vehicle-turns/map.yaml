MapFormat: 12

RequiresMod: ww3mod

Title: DEMO: vehicle turn feel — sweeping serpentine turns

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# YAML-only turn tuning (PIPELINE item 27). Four representative USA vehicles each run a looping
# horizontal serpentine of 90-degree corners so the viewer can feel the post-tuning behaviour:
# vehicles carry speed through the arcs (TurnSpeedLoss 1->0 on ^Vehicle) and swing onto the new
# heading faster (raised Mobile TurnSpeed). Everything is HoldFire and scripted from Lua, so the
# ONLY motion on screen is the turn behaviour under test.
#   Lane 1 (top)     abrams column x3   — MBT, heavytracked. Watch the COLUMN read less robotic.
#   Lane 2           bradley            — IFV, lighttracked.
#   Lane 3           humvee             — fast wheeled scout, lightwheeled.
#   Lane 4 (bottom)  TRUK               — unarmed supply truck on the ^Vehicle template default turn.
Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	OwnSR: supplyroute
		Owner: USA
		Location: 3,3
	OpponentSR: supplyroute
		Owner: Russia
		Location: 62,30
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 3,3
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 62,30

	# ===================================================================
	# Lane 1 — abrams column (MBT, heavytracked). Base row y=4, jog to y=8.
