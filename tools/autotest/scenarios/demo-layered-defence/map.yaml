MapFormat: 12

RequiresMod: ww3mod

Title: DEMO: experimental layered defence — InfluenceMap-driven positioning

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 0,0,66,34

Visibility: MissionSelector

Categories: Test

# DEMO: Stage B.1 layered defence — viewing scenario.
#   Left position  (6,16)  = USA-bot, faction=america, Bot=experimental     ← watch this
#   Right position (58,16) = Russia-bot, faction=russia, Bot=normal
#
# 4 neutral capturables in the middle band. Same map as
# tournament-capture-arena but no time limit + extra starting cash so
# the experimental bot has plenty of units to position into layers.
#
# Toggle `/frontline` to see the contested band; watch experimental's units form
# a screen (light infantry forward) + main line (vehicles standoff
# behind) over the first 90+ sim-sec.
Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@Observer:
		Name: Observer
		Playable: True
		Spectating: True
		LockFaction: True
		Faction: america
	PlayerReference@USA-bot:
		Name: USA-bot
		LockFaction: True
		Faction: america
		Bot: experimental
		Color: 4488FF
		Enemies: Russia-bot
	PlayerReference@Russia-bot:
		Name: Russia-bot
		LockFaction: True
		Faction: russia
		Bot: normal
		Color: FF4444
		Enemies: USA-bot

Actors:
	OwnSR: supplyroute
		Owner: USA-bot
		Location: 6,16
	OpponentSR: supplyroute
		Owner: Russia-bot
		Location: 58,16

	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 6,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 58,16

	# Neutral income capturables in the contested middle. Symmetric placement
	# so neither bot has positional advantage.
	NeutralBio: bio
		Owner: Neutral
		Location: 32,10
	NeutralFcom: fcom
		Owner: Neutral
		Location: 32,22
	NeutralOilb1: oilb
		Owner: Neutral
		Location: 22,16
	NeutralOilb2: oilb
		Owner: Neutral
		Location: 42,16

Rules: rules.yaml
