# Demo overrides for Stage B layered-defence viewing.
# Higher starting cash so the v2 bot has units to position quickly,
# and the demo Lua adds further pre-spawn around the bot's SR.

Player:
	-ConquestVictoryConditions:
	PlayerResources:
		DefaultCash: 15000
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false

World:
	-StartGameNotification:
	-MapStartingLocations:
	-CrateSpawner:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, demo-layered-defence.lua
