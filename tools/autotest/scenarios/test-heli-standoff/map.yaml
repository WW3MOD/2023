MapFormat: 12

RequiresMod: ww3mod

Title: TEST: Attack-Heli Standoff / No Overflight (auto)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	# Apache (HELI) is spawned airborne by the Lua script at col 12. The tank
	# sits at col 26 (14 cells east) directly on the attack-move path; the
	# attack-move destination is col 55, well past the tank. Hellfire range 25c
	# so the tank is in weapon range from the start — a correct standoff engage
	# holds ~col 12 and never advances over the tank at col 26.
	Target: t90
		Owner: Russia
		Location: 26,17
	# One Supply Route per side so neither faction can be eliminated mid-test
	# (a mission-end overlay short-circuits the Lua verdict poller).
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 12,17
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 26,17

Rules: rules.yaml
