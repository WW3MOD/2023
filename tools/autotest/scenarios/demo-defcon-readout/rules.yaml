# DEMO overrides for the DEFCON readout capture. Nothing here is asserted; see
# demo-defcon-readout.lua for the schedule and map.yaml for the layout.

World:
	# THE WHOLE POINT OF THIS SCENARIO. Escalation rather than the shipped Skirmish default,
	# and LOCKED so no lobby default or saved session can move it out from under the run.
	#
	# THE CLOCK IS COMPRESSED TO 300 TICKS = 18 s, from the shipped 5000 = 300 s. A capture
	# has ~200 s of wall clock and has to pass through THREE levels plus a nuclear gate; at
	# shipped pace the run would end during DEFCON 3.
	#
	# BOTH FIELDS ARE OVERRIDES AND THEIR SENTINELS DIFFER (2026-09-13). Each clock is a lobby
	# dropdown in MINUTES now, so a scenario cannot reach 18 s through the dropdown at all --
	# these fields win outright instead, as TimeLimitManager.TimeLimitTicks does. 0 is
	# "not in play" for the no-rush override; the warhead one reserves -1 for that, because 0
	# is a real setting there (open the gate the instant DEFCON 1 is reached).
	#
	# 16.67 ticks/second (60 ms timestep) -- NOT 25. 300 ticks = 18.0 s; 1200 = 72.0 s.
	DefconEscalation:
		ModeDefault: Escalation
		ModeLocked: true
		StartAtDefault: 3
		NoRushTicksOverride: 300
		# The release gate, compressed from the shipped 10 minutes (10000 ticks) so the countdown
		# is both VISIBLE and still counting when the last frame is taken. 1200 ticks = 72 s, and
		# the frame lands about 30 s in, so the readout should show roughly RELEASE IN 0:40.
		NuclearReleaseDelayTicksOverride: 1200

	# THE RETALIATION WINDOW, AT THE SHORTEST SETTING THE LOBBY OFFERS. One minute = 1000 ticks, and
	# that is a FLOOR rather than a choice: the dropdown is in MINUTES, RulesetLoaded refuses a
	# default that is not in RetaliationWindowOptions, and every option is a positive minute count.
	# So the lapse frame cannot land sooner than 1000 ticks after the shot however this is written,
	# which is what sets the length of the second half of this capture.
	NuclearExchange:
		RetaliationWindowDefault: 1

		# THE 1 kt REGENERATION, COMPRESSED FROM 3000 TICKS (3:00) TO 900 (54 s). Added at the
		# `cc1cbe78` merge, which made Escalation's bands free and put them on per-band timers.
		#
		# WHAT THIS BUYS THE CAPTURE is the Charging cell, which nothing else in this schedule would
		# ever show: Russia fires at K+1260 and its own 1 kt box goes from lit to lit-with-a-clock on
		# that tick. At 900 it is still counting at frame 08 (~0:28 left) and is BACK by frame 09, so
		# the two frames together show the state and its recovery. At the shipped 3000 it would still
		# be counting when the run ends, and the recovery -- which is the half that says the mode has
		# no ammunition economy in it -- would never appear.
		#
		# THE OTHER THREE BANDS ARE LEFT ALONE deliberately. Nothing in this demo fires above 1 kt,
		# so compressing them would be tuning a number no frame looks at.
		KilotonRegenTicks: 900

	# THE DERIVED WALL IS OFF FOR THIS CAPTURE, deliberately. world.yaml turns DeriveFromSpawns on
	# mod-wide, and this scenario authors HomeLocation 16,6 and 81,76 -- so it WOULD derive a
	# diagonal line, and this is a shipped capture whose framing was tuned before the wall existed.
	# The line would pass about 22 cells from the staging ground at 49,10, i.e. plausibly inside a
	# frame taken at zoom 2, and the readout demo is about the READOUT.
	#
	# Turning this back on is a one-line revert and is worth doing deliberately: a capture showing
	# the border actually standing while the strip claims it is closed would be a better demo than
	# one showing the claim alone. That is a framing decision, not a correctness one.
	DefconWall:
		DeriveFromSpawns: False

	# BOTH HALVES OF THE ARSENAL GATE, added 2026-09-13 with the ledger capture. `nuclear-arsenal`
	# is the host's checkbox over all thirteen warheads; `powers-sandbox` is what supplies the
	# `powers.event` prerequisite that no faction has. WITHOUT THESE THERE IS NO NUCLEAR POWER TO
	# GRANT, so the release would open, the ledger would light, and the shot this demo is built
	# around would return "not ready" with nothing on screen saying why.
	#
	# powers-sandbox IS NOT DefconGameMode.Sandbox. Different mechanisms, similar names: this
	# supplies prerequisites, the game mode above decides whether the exchange runs at all. It does
	# NOT grant nuclear-release-unrestricted and does not put the Tsar Bomba in play.
	PowersLobbyOptions:
		NuclearArsenalCheckboxEnabled: true
		NuclearArsenalCheckboxLocked: true
		PowersSandboxCheckboxEnabled: true
		PowersSandboxCheckboxLocked: true

	-StartGameNotification:
	# No starting units: the two combatants are spawned by the script at known cells, so the
	# first kill happens where the camera is looking and at a tick this file can predict.
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, demo-defcon-readout.lua

Player:
	# The match must not end when the truck dies -- the whole second half of the capture happens
	# after that kill.
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
	PlayerResources:
		DefaultCash: 20000
