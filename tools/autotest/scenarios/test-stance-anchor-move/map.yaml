# B1 (stale anchor) + S3 (arrival tolerance) regression, executor in ISOLATION (human-owned units,
# no bot module). Three zones:
#   Zone A (x=10..16): the Rifle spawns south of a treeline with an enemy sighted further south; the
#     executor relocates it to the south cover edge (y=17) and anchors there — exactly test-stance-
#     positioning. The Lua then issues a scripted Move 27 cells EAST to zone B.
#   Zone B (x=37..43): a second treeline + sighted enemy. After the relocation the FIXED executor must
#     re-anchor to the NEW location and, if it repositions at all, target a cover edge within leash of
#     zone B — and must NEVER walk the Rifle back toward the abandoned zone-A anchor (the B1 bug).
#   Zone S3 (x=23..27, south): two ARs near one treeline + one enemy. Both relocate to cover edges and
#     must then HOLD without oscillation (the S3 1-cell arrival tolerance guards the shove case).
