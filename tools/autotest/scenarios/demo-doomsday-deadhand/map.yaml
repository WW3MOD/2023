	# ---- OIL DERRICKS. The outliers, and the opening wave's targets, and after the 2026-09-07 retune
	# they are very nearly the whole of it: clusters too small to be a city no longer draw a warhead of
	# their own, so the salvo here is four derricks plus one warhead per city. Deliberately spread
	# further apart than MinSeparation (10 cells, down from 12) so none of them is culled and all four
	# fire; the west pair at 12 cells apart used to be the exact boundary case and now clears it.
	Derrick1: oilb
		Owner: Neutral
		Location: 5,27
	Derrick2: oilb
		Owner: Neutral
		Location: 30,4
	Derrick3: oilb
		Owner: Neutral
		Location: 58,6
	Derrick4: oilb
		Owner: Neutral
		Location: 33,31

	# ---- FORCES. Two purposes. They are something visibly alive for the annihilation to take, and
	# they generate a REAL SCORE DIFFERENCE before the clock expires, which is what the frozen-score
	# verdict is supposed to be decided on.
	#
	# USA gets three units against one Russian BMP, in contact from the first tick, so USA banks kill
	# experience inside the 250-tick window and leads at the freeze. Russia's remaining pair sits out of
	# range in the north-east and survives to the salvo -- so at the moment the warheads land, the player
	# who is AHEAD ON SCORE is not the player with the most units left alive. That is the discrimination
	# the mode exists to make, and a demo where both were the same player would not show it.
	UsaA: abrams
		Owner: USA
		Location: 26,17
	UsaB: abrams
		Owner: USA
		Location: 25,19
	UsaC: bradley
		Owner: USA
		Location: 27,19
