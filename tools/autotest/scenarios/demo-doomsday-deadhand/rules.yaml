Player:
	# FOG IS ON HERE, and it is on so that the reveal is visible. DoomsdayStrike sets
	# MapLayers.Disabled on every player when the clock expires, which is a no-op in a session that
	# had no fog to begin with — this scenario used to set FogCheckboxEnabled false and would have
	# demonstrated nothing. The map stays EXPLORED, so terrain is visible throughout and what pops in
	# at the trigger is the far side's units and structures, which is the change worth seeing without
	# blacking out the first 250 ticks of the demo.
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: true

	# DEAD AIR, SHORTENED FROM THE SHIPPED 500 TO 120 TICKS ON BOTH GAME-ENDERS. SpawnActorEffect
	# holds the actor out of the world and renders nothing while it waits (SpawnActorEffect.cs:44-49),
	# so every one of those ticks is an empty sky with a beacon on it.
	#
	# BOTH, NOT JUST AMERICA'S, AND THAT IS NEW AS OF 2026-09-20. Russia's Sarmat is no longer a
	# weapon this demo can ignore: the side that places nothing is now AUTO-FIRED with its own
	# national ender, so the Sarmat's 500 ticks would sit inside the cascade's flight budget and
	# push FinalExchangeFlightTicks (World node, below) back up with it.
	#
	# 120 AGAINST A FLIGHT OF ~128 on this 64x32 map: b83missile is Speed 700, Acceleration 0, so
	# EstimateArcTicks is hDist/speed and hDist is the standoff, sqrt(64^2+32^2) + 16 = ~88 cells.
	# sarmatmissile at Speed 1600 is roughly half that. FinalExchangeFlightTicks must cover the
	# larger of the two sums; see its note below.
	#
	# THESE ARE IN THIS `Player:` NODE rather than a second one at the foot of the file: MiniYaml
	# treats two top-level entries with the same key as a duplicate, not a merge, within one file.
	MissileStrikePower@TridentW88:
		MissileDelay: 120

	MissileStrikePower@Sarmat:
		MissileDelay: 120

	# NOT SET, ON PURPOSE: PowersLobbyOptions' sandbox switch. demo-nuke-arsenal needs it because
	# powers.event is otherwise provided by nobody -- and the whole point HERE is that the final
	# exchange provides the two game-enders itself, for fifteen seconds, with the arsenal in its
	# shipped configuration. Turning sandbox on would hide the thing being demonstrated.

World:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	-StartGameNotification:
	MusicPlaylist:
		DisableWorldSounds: false

	# 250 ticks = 15.0 s at the mod's 60 ms timestep. The lobby dropdown's finest grain is one whole
	# minute, which is four times longer than this entire demo, so the scenario uses the absolute
	# tick override instead. Zero (the default) leaves the dropdown behaving exactly as it always has.
	# 80 TICKS, DOWN FROM 250 (2026-09-13). This is only the run-up to the window, and it used to be
	# 250 so that the USA/Russia contact banked enough kill experience to stage a SCORE DIFFERENCE
	# for the frozen-score verdict. That verdict cannot be shown here at all -- a demo runs under
	# TestMode, where ConquestVictoryConditions never assigns an objective -- so the scenario was
	# paying 170 ticks for something invisible, on a machine where two runs were CPU-starved into a
	# 300 s watchdog kill. The units are kept: they are what the annihilation takes.
	TimeLimitManager:
		TimeLimitTicks: 80
		SkipTimeRemainingNotifications: true

	# DECLARED, and that declaration is the whole of whether the script runs at all. A rules.yaml the
	# map never references is silently ignored (Map.cs:102-107) and a LuaScript with no Scripts is
	# skipped by the one engine lint that would have caught it (Lint/CheckLuaScript.cs:21-23) -- the
	# scenario then loads, draws, writes a zero-byte lua.log and does nothing. `.\make.ps1 lua-gate`
	# checks for exactly that shape; run it after touching this block.
	LuaScript:
		Scripts: test-helpers.lua, demo-doomsday-deadhand.lua

	# Demo timings are COMPRESSED against the shipped values in mods/ww3mod/rules/world.yaml, so the
	# whole sequence fits in one sitting. The two that are NOT compressed are the ones a viewer is
	# actually looking at: the window itself, and ImpactSpacingTicks, which is the rhythm of the
	# cascade.
	#
	# THREE KNOBS THIS BLOCK USED TO SET NO LONGER EXIST (2026-09-20): LeadInTicks,
	# OutlierToCityPauseTicks and WithinWaveTicks all described the map-wide Dead Hand salvo's wave
	# structure, and there is no salvo. Leaving any of them here would fail the map load outright
	# with "unknown field", which is the intended way a stale override announces itself.
	DoomsdayStrike:
		# Required: a demo runs under TestMode, where the ending is off by default so that the
		# existing timed tournament and autotest configurations keep ending the way they always did.
		RunInTestMode: true
		# 260, DOWN FROM THE SHIPPED 800, and it is the compressed MissileDelay above that makes
		# this correct rather than merely convenient. It must cover MissileDelay plus the slowest
		# game-ender's flight, or a warhead placed on the window's last tick would be scheduled
		# into the past and would arrive outside the cascade: 120 + ~128 = 248, so 260.
		#
		# IT IS ALSO THE DEMO'S PACING KNOB. The window closes at 330 and the anchor is therefore
		# at 590; every frame after 03 is derived from that number.
		#
		# THE PRE-LAUNCH COUNTDOWN IS THE MOD-WIDE FinalExchangeMissileDelay 100 AS OF 2026-09-20,
		# so the MissileDelay overrides in the Player node above are now INERT INSIDE THE EXCHANGE
		# and are kept only for a launch outside one (there is none here). The anchor was already
		# this floor rather than any natural tick, so every asserted tick below is unchanged.
		FinalExchangeFlightTicks: 260
		AnnihilationDelayTicks: 30
		ResolutionDelayTicks: 15
		# THE WINDOW AT FULL LENGTH, deliberately NOT compressed WHILE EVERYTHING AROUND IT WAS.
		# It is the one stage of the sequence a player is inside rather than watching, and it is
		# what this demo is FOR: a six-second "fifteen seconds" would be demonstrating a deadline
		# nobody is going to ship. 250 ticks = 15.0 s at the 60 ms timestep -- NOT 25 tps, which
		# would read this as 10 s. The three values above are the ones that gave up ticks instead.
		FinalExchangeWindowTicks: 250

^Combatant:
	AutoTarget:
		ScanRadius: 30
		InitialStance: FireAtWill
		InitialStanceAI: FireAtWill
		InitialEngagementStance: Hunt
		InitialEngagementStanceAI: Hunt
		MinimumScanTimeInterval: 8
		MaximumScanTimeInterval: 16
