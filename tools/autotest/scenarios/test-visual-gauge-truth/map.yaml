MapFormat: 12

RequiresMod: ww3mod

Title: TEST: Does the concealment ring tell the truth (captures)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# THE DECISIVE CAPTURE. The gauge draws a radius; the red "!" (WithSpottedDecoration)
# lights when an enemy really can see the unit. If the tier ladder is right those two
# events coincide. If the ladder is still one band too wide — the pre-fix state — the "!"
# lights about three cells INSIDE the drawn ring.
#
# The capture request has the rifleman walking toward a fixed observer. This scenario
# inverts that, and the inversion is what makes the result readable:
#
#   * A WALKING rifleman is on tier 2 (moving = -1) with a 25c0 ring; the instant he
#     stops to be photographed he is on tier 3 with a 22c0 ring. The subject's own ring
#     would change size between the shots that are supposed to be measuring it.
#   * Rifle stays PUT and never moves, so his tier — and therefore the drawn radius — is
#     the same constant in all five frames, and the only thing that changes across the
#     ladder is the observer's distance. That is the variable under test.
#
# Rifle is map-placed and never ordered, so he never gets `dugin` either (the still-timer
# is armed only by a stop transition — GrantConditionOnMovement.cs:53-70). He sits on
# tier 3 for the whole run: ring 25c0, and reveal needs observer strength >= 3, i.e. the
# ^StandardVision S3 band whose outer range is 25c0. Ring and truth are the same 25 cells,
# by construction — both moved out one band together when reveal became non-strict.
#
# Rifle is at x=32, the map's centre column, so a 50-cell-wide circle keeps both its east
# and west edges inside the 64-cell playable width. The observer is teleported along the
# centre row east of him to 27, 26, 24, 21 and 16 cells. 25 is deliberately NOT sampled:
# gotcha #8 in AUTOTEST.md is that a visibility assertion sitting exactly on a band edge
# flips between runs on posture alone.
#
# WATCHER, not a standard rifleman. Two reasons, both load-bearing:
#   * WithSpottedDecoration only lights for an enemy WE CAN SEE ("an enemy that we are
#     aware of" — the asymmetry rule). A standard Russian rifleman 21 cells away is
#     Detectable Vision 3, and our own vision has decayed to strength 3 or 4 out there,
#     so whether we see HIM is itself borderline — the mark would be gated on a coin
#     flip rather than on the thing under test. Watcher is Detectable Vision 1, which our
#     vision resolves comfortably anywhere inside 28 cells.
#   * Its ^StandardVision is untouched, so how it SEES Rifle follows the ordinary ladder
#     and the 25-cell prediction stands.

Players:
	PlayerReference@Neutral:
