# Killable-economy autotest overrides. Shape copied from test-tacnuke-delivers, which is the
# scenario that proved this delivery path; only the notes that differ are restated.

World:
	# The tactical nuke ships lobby-gated and OFF, so without this the power's trait is disabled by
	# `RequiresCondition: !tacnuke-disabled` and there is nothing to fire. Enabled AND locked, so no
	# lobby default or saved session can move it out from under the run.
	#
	# THE SANDBOX SWITCH IS THE SECOND HALF OF THE SAME GATE, added 2026-09-07. The tactical nuke is
	# now EVENT TIER (`Prerequisites: powers.event`, player.yaml) and powers.event is provided by no
	# faction -- only by the unfiltered ProvidesPrerequisite traits gated on
	# `!powers-sandbox-disabled`. With the checkbox on and sandbox off the power is still not
	# Permitted, so it is absent from the buy tab and the purchase is refused.
	PowersLobbyOptions:
		TacticalNukeCheckboxEnabled: true
		TacticalNukeCheckboxLocked: true
		PowersSandboxCheckboxEnabled: true
		PowersSandboxCheckboxLocked: true
	-StartGameNotification:
	-SpawnStartingUnits:
	# Removed so Player.HomeLocation falls back to the pinned PlayerReference value rather than a
	# spawn assignment -- the edge derivation in map.yaml depends on it.
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-heavy-strike-wrecks-economy.lua

Player:
	# `MissileStrikePower@TacNuke: ChargeInterval: 1 / StartFullyCharged: true` USED TO SIT HERE AND
	# DID NOTHING: SupportPowerInstance's constructor forces TotalTicks and remainingSubTicks to 0
	# whenever RequiresPurchase is set (SupportPowerManager.cs:228-229), so the power stayed at zero
	# charges and the order was refused with 'not-ready:0' every time. The shot is BOUGHT instead --
	# see power.tacnuke at the bottom of this file.
	# The blast reaches most of the map; without this the match could end on elimination before the
	# poller writes a verdict.
	-ConquestVictoryConditions:
	# Fog off and the map pre-explored, so nothing the poller reads is a visibility artefact. This
	# matters more here than in the sibling scenario: the husk assertions walk Map.ActorsInWorld,
	# and a frozen-under-fog replacement would be a different actor to count.
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
	PlayerResources:
		# DefaultCash 0 does NOT freeze a force on its own (economy.md), so the income stream is shut
		# off explicitly as well -- BOTH lines, because the value that reaches PassiveIncomeAmount is
		# read back from the lobby option and the option registers PassiveIncome.ToString() as its
		# own default. Without the lock, zeroing the field alone leaves the engine constant live.
		#
		# THIS IS WHAT MAKES THE REPORTED CASH NUMBERS MEAN SOMETHING. The verdict prints USA's purse
		# before and after the strike; with passive income running, that delta would be
		# income-minus-derricks and would move whether or not a derrick died. With it off, the
		# CashTricklers on the three derricks are the only thing in the game that can move that purse.
		#
		# DEFAULTCASH IS 20000 RATHER THAN 0 SINCE 2026-09-07, and it does NOT weaken the reading
		# above. The nuke is bought now (15000, power.tacnuke), so a zero purse means no strike at
		# all. Starting cash is a CONSTANT OFFSET on both of the numbers the verdict subtracts, so
		# the delta is untouched; PassiveIncome is still zeroed and still locked, and the purse this
		# scenario measures belongs to USA while the money that buys the nuke is spent by Russia.
		DefaultCash: 20000
		PassiveIncome: 0
		PassiveIncomeDropdownLocked: True

# THE PURCHASE. 5 ticks instead of the shipped 1500 (90 s). The strike is ordered at the end of the
# husk-settle phase, hundreds of ticks in, so the magazine is long since loaded by then and the
# 1400-tick budget is unaffected.
power.tacnuke:
	Buildable:
		BuildDuration: 5
