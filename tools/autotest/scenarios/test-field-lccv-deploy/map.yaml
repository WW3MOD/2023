MapFormat: 12

RequiresMod: ww3mod

Title: TEST: an LCCV can deploy its logistics centre on field cells

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# THE BUG: ww3mod tiles crop fields as one 1x1 Building actor PER CELL. 73996d96 taught the
# ActorMap-based occupancy tests to see through them (World.BlockingActorsAt) and routed
# BuildingUtils.IsCellBuildable through it -- but fields, being Building actors, are ALSO
# registered in the SEPARATE BuildingInfluence layer, and the very next line of that method
# asked BuildingInfluence.AnyBuildingAt. So the filter was a no-op at that call site and
# placement on a field stayed refused. Transforms.CanDeploy -> World.CanPlaceBuilding ->
# IsCellBuildable is the LCCV's deploy check, so the LCCV refuses with BuildingCannotPlaceAudio.
#
# LOGISTICSCENTER is Dimensions 3,3 with Footprint "=+= +++ =+=" -- every one of the nine
# cells is in Tiles() -- and Transforms.Offset is -1,-1, so the tested footprint is the 3x3
# block CENTRED on the LCCV. One field anywhere in that block is enough to refuse, which is
# why the refusal also happens standing *next to* a field, not only on one.
#
# GEOMETRY (row 16 is the lane; each LCCV's tested footprint is the 3x3 centred on it)
#   x=4          Supply Route + spawn
#   x=18..26     A 9x9 patch of v14 field actors, y=12..20
#   x=22,y=16    A: LCCV dead centre of the field patch      -> MUST deploy (the bug)
#   x=44,y=16    B: LCCV with a v19 Oil Pump at 44,15        -> MUST refuse (over-fix guard)
#   x=52,y=16    C: LCCV on bare ground, nothing in footprint -> MUST deploy (control for B)
#
# C is load-bearing. Without it a B that refused because of TERRAIN rather than because of
# the Oil Pump would read as a pass, and the over-fix guard would be measuring nothing. C
# sits on the same bare row as B, so if the terrain out there were unbuildable C fails and
# says so.

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@Observer:
		Name: Observer
		Playable: True
		Spectating: True
		LockFaction: True
		Faction: america
	PlayerReference@Me:
		Name: Me
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america

Actors:
	OwnSR: supplyroute
		Owner: Me
		Location: 4,16
	SpawnMe: mpspawn
		Owner: Neutral
		Location: 4,16

	# A -- the case under test. Centre of the field patch; all nine footprint cells are fields.
	# Facing 384 matches Transforms.Facing, so no turn is needed before the transform starts.
	LccvField: lccv
		Owner: Me
		Location: 22,16
		Facing: 384

	# B -- over-fix guard. A v19 Oil Pump (^BasicBuilding: Dimensions 1,1, Footprint x, and no
	# Passable/GroundCover) sits at 44,15, a '+' cell of B's footprint. A real building must
	# still refuse the deploy after the fix.
	LccvBlocked: lccv
		Owner: Me
		Location: 44,16
		Facing: 384
	Blocker: v19
		Owner: Neutral
		Location: 44,15

	# C -- bare-ground control for B, same row and terrain, empty footprint.
	LccvBare: lccv
		Owner: Me
		Location: 52,16
		Facing: 384

