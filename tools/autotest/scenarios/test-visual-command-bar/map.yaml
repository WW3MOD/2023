MapFormat: 12

RequiresMod: ww3mod

Title: TEST: Command bar reflow and the renamed garrison buttons (captures)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# Two chrome subjects that both need a selection to appear, so one run covers both.
#
# 1. The command bar after Button@TAKE_COVER was deleted. It sat at container-X 358 in the
#    middle of the right-hand panel; removing it pulled AUTO_ENTER and EVACUATE left by
#    34px, narrowed CMD_BG_B (188->154) and COMMAND_BAR (460->426), and shifted all four
#    right-hand panels and their stance bars left by 34. Every one of those is an absolute
#    literal with nothing tying it to its neighbour, so the only way to know the bar still
#    lines up is to look at it. Infantry are what must be selected: TAKE_COVER's disabled
#    state keyed off InfantryStatesInfo, so infantry-selected is exactly the state it used
#    to render ungreyed in.
#
# 2. The eleven garrison and cargo buttons that used to be labelled "X" with no tooltip.
#    Eight of them are EJECT_PORT_0-7, one per manned firing position, plus EJECT_ALL —
#    all inside GARRISON_PANEL, which needs a garrison with occupied ports selected.
#    (The remaining two, UNLOAD_ALL_TROOPS and DROP_SUPPLY, live in CARGO_PANEL and are
#    photographed by test-visual-cargo-panel instead.)
#
#    House is v01, the church: MaxWeight 10 and EIGHT ports (north, northwest, west,
#    southwest, south, southeast, east, northeast) -- wide enough to populate all eight port
#    rows at once. The defence structures carry two ports and the guard tower four, so
#    neither would show that the eighth row is laid out correctly.
#
#    PORTS ARE PER-BUILDING SINCE 2026-09-15 and v01 is one of only five actors that still
#    carries eight of them (with v24, v25, v37 and rushouse -- the largest and most
#    fenestrated). ^CivBuilding no longer declares a shared ring, so "any civilian building"
#    is no longer a safe substitute here: most of them now have two or four ports and would
#    leave the later EJECT_PORT rows empty, which is the thing this test exists to photograph.
#    Its occupants arrive through Cargo InitialUnits rather than by walking men in, so
#    they are aboard at tick 0 and GarrisonManager only has to deploy them to ports.
#
# There is no enemy. Garrison ports deploy on their own and hold; adding a target would
# start a firefight over the frame being photographed.

