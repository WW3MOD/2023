MapFormat: 12

RequiresMod: ww3mod

Title: TEST: a dropped supply crate can still be attacked manually

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 0,0,66,34

Visibility: MissionSelector

Categories: Test

# An ENEMY-owned SUPPLYCACHE (Crate) 4 cells from MyTank. The Lua issues an ordinary
# attack order with allowMove=false, so the tank fires from where it stands and never
# enters proximity-capture range (which would take the crate instead of shooting it).
# NoAutoTarget must not reach this path: an explicit order binds through weapon
# ValidTargets, which the crate still satisfies via `Ground`.
#   PASS = Crate takes damage (the manual order bound).
#   FAIL = Crate untouched — the exclusion broke manual attack too.
Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@Observer:
		Name: Observer
		Playable: True
		Spectating: True
		LockFaction: True
		Faction: america
	PlayerReference@Me:
		Name: Me
		LockFaction: True
		Faction: america
		Enemies: Enemy
	PlayerReference@Enemy:
		Name: Enemy
		LockFaction: True
		Faction: america
		Enemies: Me

Actors:
	MySR: supplyroute
		Owner: Me
		Location: 4,4
	EnemySR: supplyroute
		Owner: Enemy
		Location: 60,30

	SpawnMe: mpspawn
		Owner: Neutral
		Location: 4,4
	SpawnEnemy: mpspawn
		Owner: Neutral
		Location: 60,30

	# The enemy's dropped supply crate — the thing the player wants to deny.
	Crate: supplycache
		Owner: Enemy
		Location: 20,16

	# The player's MBT, 4 cells east. Ordered to attack the crate at t=0.
	MyTank: abrams
		Owner: Me
		Location: 24,16
		Facing: 768

Rules: rules.yaml
