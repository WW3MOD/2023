# Auto-seek-supplies autotest overrides. Pre-placed rifleman + truck, no economy.

# No cash -> no production; the only actors are the pre-placed Customer + Truck.
Player:
	PlayerResources:
		DefaultCash: 0

World:
	-StartGameNotification:
	# UnitDefaultsManager applies this machine's saved per-type stance defaults to
	# human-owned units in Created (AutoTarget.cs). The behaviour under test is
	# stance-gated, so a dev who once set riflemen to Ambush or Resupply-Hold would
	# otherwise silently fail this test. Strip it so the stances are the YAML ones.
	-UnitDefaultsManager:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-infantry-seek-supplies.lua

# The master flag ships OFF. Turn it on for the scenario only.
^Soldier:
	AutoSeekSupplies:
		Enabled: true
