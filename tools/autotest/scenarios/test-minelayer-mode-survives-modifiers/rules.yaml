Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-minelayer-mode-survives-modifiers.lua

# Fog is off deliberately. MinefieldOrderGenerator.RenderAboveShroud draws the UNKNOWN tile for any
# fogged cell and the BLOCKED tile for any shrouded one (Minelayer.cs:334-343), so under fog a
# working selector and a broken one both look wrong and the verdict question becomes unanswerable.
