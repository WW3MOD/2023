Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-tree-indestructible.lua

# The gun. Only the shell changes: TankRound.Abrams cannot damage a tree at all (see weapons.yaml),
# so leaving it would give a vacuous green. Everything else about the Abrams is left stock --
# AmmoPool 40 rounds, VehicleCrew, AttackTurreted -- because those are the parts that make a
# map-placed tank actually shoot, and test-balance-tank-1v1 already demonstrates they work
# untouched. 40 rounds x 12000 = 480000, which is 192x the tree's 2500 HP; ammo is not the limit.
abrams:
	Armament@1:
		Weapon: TreeGuardShell

# ------------------------------------------------------------------------------------------
# THE TWO CONTROL TREES. Both are ordinary shipped tree actors with the invulnerability put
# BACK to a no-op, which is what makes this scenario unable to pass vacuously.
#
# Modifier: 100 rather than `-DamageMultiplier@Indestructible:`. The removal form would work
# today but breaks the RED procedure: with the `Inherits@Indestructible:` line on ^Tree
# commented out there is no such trait to remove, and the sabotage run would be testing the
# removal syntax instead of the mechanism. Setting Modifier: 100 behaves identically in BOTH
# states -- it overrides the trait where it exists and adds an inert one where it does not.
#
# WHY A DESTRUCTIBLE TREE AND NOT SOME OTHER WITNESS. The failure this guards against is a
# fixture that cannot hurt a TREE specifically -- a warhead whose ValidTargets lost `Trees`
# leaves every non-tree witness bleeding normally while every tree on the map sits at full HP,
# and the scenario would report "trees are indestructible" for entirely the wrong reason. Only
# a tree that DOES die rules that out.
# ------------------------------------------------------------------------------------------

# WITNESS: dies on the first shell, and its T02.Husk is the census baseline. Its husk is left
# INTACT on purpose. A husk count of exactly one, of a type this scenario knows the name of,
# proves the census can see a husk at all -- a bare "zero husks" assertion is satisfied just as
# well by a broken detector as by a working guard.
t02:
	DamageMultiplier@Indestructible:
		Modifier: 100

# SPONGE: the shell counter. Same falloff position as the witness, so it takes exactly 12000 per
# shell, and 6000000 HP means it cannot die inside 40 rounds (500 would be needed). Its HP loss
# divided by 12000 is the number of shells that landed -- the quantity the verdict reports, and
# the thing that makes "enough damage to have destroyed it before" arithmetic instead of a claim.
# SpawnActorOnDeath removed as belt-and-braces: if it somehow did die it must not pollute the
# husk census, which would turn a real finding into an unreadable one.
t03:
	DamageMultiplier@Indestructible:
		Modifier: 100
	Health:
		HP: 6000000
	-SpawnActorOnDeath:
