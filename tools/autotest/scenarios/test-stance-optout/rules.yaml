World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	# Strip per-type persisted stance overrides so the human AR is deterministically Defensive
	# (its YAML default) regardless of this machine's saved unit defaults — otherwise a locally
	# saved AR default (Hunt / HoldPosition) would silently change the executor's behavior.
	-UnitDefaultsManager:
	LuaScript:
		Scripts: test-helpers.lua, test-stance-optout.lua

# Let the test grant the `deployed` condition from Lua (the scripting GrantCondition API requires an
# ExternalCondition source). Declared on ^Combatant (proven-overridable template) rather than the
# ar.america actor key, which double-defines under this mod's map-rules merge. The executor gates on
# this exact condition; granting it stands in for a real deploy. Additive with GrantConditionOnDeploy.
^Combatant:
	ExternalCondition@testdeploy:
		Condition: deployed
