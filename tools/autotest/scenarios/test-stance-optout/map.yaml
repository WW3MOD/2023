# Phase-3 opt-out (option b, stance-decoupled). Both zones reproduce the exact geometry that makes a
# Defensive AR relocate to cover (test-stance-positioning proves it moves): treeline + a sighted enemy
# just south. The units here must NOT move, because each is opted out of tactical positioning:
#   Zone A: HoldUnit has EngagementStance HoldPosition (init) — executor declines by stance.
#   Zone B: DeployUnit is Defensive but carries the `deployed` condition (granted from Lua) — executor
#           declines because a deployed unit's placement is deliberate (S2).
# Both are human-owned (executor auto-enabled via GrantConditionOnHumanOwner). Assertion: neither unit
# ever leaves its spawn cell for the full hold window ⇒ zero executor Move orders.
