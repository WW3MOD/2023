MapFormat: 12

RequiresMod: ww3mod

Title: TEST: A Pre-empted Restock Drive Does Not Disable The Truck (auto)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	# 40 is BELOW RestockThreshold (50) and above zero. That is the cheapest trigger there is for
	# SupplyProvider.TryRestock -- the "reserve my remainder for the drive home" branch in Tick fires
	# on the very first tick and needs no soldiers, no unaffordable customer and no timing. With the
	# Auto resupply stance set in rules.yaml, ShouldSelfRestock says yes and the truck sets off for
	# the Logistics Centre unprompted.
	Truck: truk
		Owner: USA
		Location: 10,16
		Supply: 40
	# 40 cells east, so the drive is long enough to be interrupted well before it completes.
	# Owner USA rather than Neutral: TryRestock filters restock hosts on a.Owner == self.Owner.
	Depot: logisticscenter
		Owner: USA
		Location: 50,16
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 10,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 60,30
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

Rules: rules.yaml
