Actors:
	# THE DIVERGENCE LEVER, and it is terrain-like rather than destructible on purpose.
	# Locomotor@FOOT lists sandbag in Passes (world.yaml:29), so infantry walks through these
	# cells untouched. Every vehicle locomotor lists only `Passes: field`, and the two that
	# name sandbag under Crushes only crush it when SBAG.Passable.CrushedByRelationships is
	# satisfied — that is `Enemy` (structures-defenses.yaml:365-368), and these are NEUTRAL.
	# So no unit in this scenario can crush them: the block is stable for the whole run, and
	# nothing is destroyed that could open a hole mid-test and move the answer under us.
	# Neutral also keeps them off every AutoTarget list, so no unit stops to shoot them.
	#
	# 5x5 over x14..18, y14..18. The clicked cell (16,16) is the centre, so Chebyshev rings 1
	# and 2 around it are entirely sandbag and a blocked unit cannot answer nearer than ring 3.
