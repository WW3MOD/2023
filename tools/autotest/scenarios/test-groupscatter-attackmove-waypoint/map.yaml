	# The two units under test. Both are given the SAME attack-move click, and they disagree
	# about what cell that click means: Rifle can stand on it, Truck cannot.
	# Rifle is listed first and is nearer the clicked cell than the far cell, which is what
	# makes GroupScatter's closest-unassigned-waypoint assignment deterministic.
	Rifle: e1
		Owner: USA
		Location: 12,16
		Facing: 512
	Truck: humvee
		Owner: USA
		Location: 12,26
		Facing: 512
	# SETUP CONTROLS. Neither takes part in the scatter; both exist so that a run which
	# proves nothing says so instead of reading green. They demonstrate, in the same run and
	# in BOTH arms, that the premise the whole scenario rests on actually holds: that
	# infantry can stand inside this block and vehicles cannot.
	SentinelInf: e1
		Owner: USA
		Location: 12,21
		Facing: 512
	SentinelVeh: humvee
		Owner: USA
		Location: 12,11
		Facing: 512
	OwnSR: supplyroute
		Owner: USA
		Location: 2,30
	# Parked in the far corner, ~32 cells from the farthest point any unit under test
	# travels, so no attack-move scan can acquire it and stall a unit short of its cell.
	OpponentSR: supplyroute
		Owner: Russia
		Location: 64,2
	SpawnUSA: mpspawn
