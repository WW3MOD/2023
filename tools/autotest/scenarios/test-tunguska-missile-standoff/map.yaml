Actors:
	# Both combatants are spawned by the Lua script: the Tunguska at col 10 and the
	# Littlebird airborne at col 34, 24 cells apart. That gap is the test — inside the
	# 9M311's 28c0, outside the 30mm AA gun's 18c0 — so only the missile can reach and
	# any eastward movement is the unit picking the worse weapon.
	# One Supply Route per side so neither faction can be eliminated mid-test
	# (a mission-end overlay short-circuits the Lua verdict poller).
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 34,17
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 10,17

