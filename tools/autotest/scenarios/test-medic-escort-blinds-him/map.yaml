MapFormat: 12

RequiresMod: ww3mod

Title: TEST: a healthy escort must not blind the medic to a casualty out of notice

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# The medic has TWO radii and they disagree by a factor of 2.5:
#   HealerAutoTarget.SearchRange   8c0   — how far he NOTICES a casualty
#   AutoFollowAlly.SearchRange    20c0   — how far he will trail a squadmate
#
# The follow radius is what MOVES him, so it decides where the notice radius is
# centred. AutoFollowAlly.FindNearestAlly used to pick the nearest ally without
# looking at health at all: a healthy man standing closer than a wounded one took
# the medic's escort duty, parked him at FollowDistance (3c0), and everything past
# 8c0 stayed invisible — the casualty was never a candidate, not merely outranked.
# It now ranks anyone the healer would treat strictly above any healthy ally, so
# the medic walks to the casualty and his notice radius arrives with him.
#
# Escort is unhurt and 2 cells away — already inside FollowDistance, so under the
# old ranking the medic had no reason to take a single step.
# Stranded is at 40% and 10 cells away — OUTSIDE the 8-cell notice radius but
# well inside the 20-cell follow radius, and below StabilizeThreshold (50) so he
# is bleeding out the whole time (ChangesHealth@BleedOut, -1% per 50 ticks).
#
# Escort stays ALIVE for the whole run. His presence has to be irrelevant, so the
# assertion is that Stranded is treated with the healthy man still standing there.
Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@Me:
		Name: Me
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF

Actors:
	OwnSR: supplyroute
		Owner: Me
		Location: 4,16
	SpawnMe: mpspawn
		Owner: Neutral
		Location: 4,16

	Medic: medi
		Owner: Me
		Location: 18,16
		Facing: 768

	# 2 cells east, unhurt. Inside FollowDistance, so the medic stands still.
	Escort: e1
		Owner: Me
		Location: 20,16
		Facing: 768

	# 10 cells east. Outside the 8-cell notice radius, inside the 20-cell follow
	# radius. Drained to 40% in Lua, so he is bleeding from the first tick.
	Stranded: e1
		Owner: Me
		Location: 28,16
		Facing: 768

Rules: rules.yaml
