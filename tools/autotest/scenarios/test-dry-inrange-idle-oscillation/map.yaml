Actors:
	# Hunter starts empty (rules.yaml) and only 8 cells from the target — INSIDE the AR's 14c0 reach,
	# which is the whole point. Every other scenario on this branch halts its dry unit OUTSIDE weapon
	# range, where AutoTarget's in-range armament filter finds no candidate and the unit simply rests.
	# This is the case none of them cover: a dry man who can still SEE a target he could shoot if he
	# had rounds, so AutoTarget keeps re-issuing the attack the guard keeps ending.
	Hunter: ar
		Owner: USA
		Location: 8,16
		Facing: 768
	Target: e1
		Owner: Russia
		Location: 16,16
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 8,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 16,16
	# Deliberately NO truk and NO logisticscenter anywhere: with a resupplier in reach the very first
	# pass through idle dispatches the man and the cycle ends, which is the case that already works.
	# The unbounded-churn worry only exists when there is nowhere to go.
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

Rules: rules.yaml
