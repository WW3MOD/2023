Player:
	# Low on purpose. This scenario measures ONE engineer's employment, and every unit the bot buys is
	# another actor that can be recruited, can wander through the measurement, or can pull the screen
	# centroid around mid-run. 1000 leaves the economy well-formed (a zero-cash bot is a state nothing
	# else in the suite exercises) while keeping production down to a trickle.
	PlayerResources:
		DefaultCash: 1000

# ── THE STAGED ACTORS ARE SCENARIO-LOCAL CLONES, RE-ROLED SO NOTHING DRAFTS THEM (2026-09-22) ──
#
# WHY THIS EXISTS, and without it the scenario cannot measure what it claims to. The casualty is an
# abrams, which resolves to UnitRole.MainBattle, and PoiOffensiveBotModule's own free pool accepts
# exactly `MainBattle || IndirectFire` (PoiOffensiveBotModule.cs:3230) — so the bot DRAFTED ITS OWN
# CASUALTY INTO AN OFFENSIVE AXIS and drove it at the enemy Supply Route, 38 cells east. The engineer
# is then chasing a tank at infantry speed, re-aimed at a stale cell once per OrderSettleTicks (200),
# and whether he ever lands a repair burst is decided by where the tank happened to be when the
# module first evaluated — i.e. by the wall-clock RNG seed.
#
# BOTH RECORDED RUNS SHOW THE CHASE; only the verdicts differ, which is what makes this a measurement
# fault rather than a bug the scenario caught:
#   260921_213228 (pass) — axis ordered at t37, casualty crossed ONTO the engineer's own cell at t100,
#                          one burst landed (+280 hp), then it outran him to 56,6. Coincidence.
#   260922_063223 (fail) — axis ordered at t89, casualty left from 22,16 and reached 38 cells away.
#                          delta 0. Same mechanism, unluckier phase.
# The `[engineer]` anchor cell tracks the casualty east in BOTH logs (24,16 -> 36,16 -> 47,14 -> 56,6).
#
# THE MECHANISM USED HERE IS THE MOD'S OWN EXCLUSION, not a new one. ^E6 is kept out of every combat
# pool by `AIUnitRole: Role: Logistics` (infantry.yaml:1913-1914) — that is precisely why an engineer
# parks at the Supply Route for a whole match and why this module had to be written. Applying the same
# override to the staged actors makes them invisible to EVERY free-pool module in one stroke: the role
# filter is shared by PoiOffensiveBotModule, LayeredDefenceBotModule (IsLineEligibleByRole),
# PoiGarrisonBotModule (IsEligibleCombatUnit) and LaneAmbushBotModule (IsEligibleAmbusher), all of
# which set UseUnitRoles: true on @experimental. Grepped, not assumed: NOTHING recruits Logistics —
# `UnitRole.Logistics` appears nowhere in the engine outside UnitRoleResolver, UnitRoleResolverTest and
# CheckUnitRoleTable, so this cannot hand the casualty to some logistics module instead.
#
# WHY NOT RAISE THE AXIS FLOORS, the way test-ambush-lane-share constructs its opening. That works for
# offense and offense alone; the layered-defence and garrison pools would still take these three
# actors. Excluding by role closes all four with one predicate.
#
# WHAT IT DOES NOT AFFECT, checked individually:
#   * Repair eligibility — FindRepairTarget filters on GetAllTargetTypes() overlapping
#     {VehicleRepair, BuildingRepair}, which is conditional on `damaged` and has no role term.
#   * The screen discriminator — FindScreenAnchor requires AttackBase + Mobile and a distance from the
#     SR, never a role, so the two riflemen still anchor a live screen 14 cells east of the casualty.
#     They are held still too, which makes that anchor STABLE rather than drifting as it is drafted.
#   * Production — the bot's OWN abrams and E3.america are untouched by this file now that the
#     re-role lives on the clones, so newly-bought units keep their derived roles and still form axes.
#     The offensive module is exercised rather than switched off; it just cannot touch the staged three.
#
# ── WHY CLONES, AND NOT THE ROLE OVERRIDE WRITTEN ONTO `abrams` / `E3.america` THEMSELVES ──
#
# 5f8fed03 first wrote `AIUnitRole: Role: Logistics` straight onto the shipped actor keys. That is
# wrong twice over, and the first one is RED:
#   * CheckUnitRoleTable PINS `abrams` to MainBattle (CheckUnitRoleTable.cs:34) and the pin loop
#     (:134-145) runs over the RESOLVED RULESET OF EVERY MAP, scenarios included — CheckYaml.cs:103
#     walks the map list and calls the same ILintRulesPass set per map. So a per-scenario re-role of a
#     pinned unit is a NEW lint error above the baseline floor:
#       `test-experimental-engineer-repairs | CheckUnitRoleTable: `abrams` derived role Logistics,
#       expected MainBattle.`
#     The lint is RIGHT and must stay right: reclassifying the mod's main battle tank is precisely the
#     silent-AI-regression class it was written for (see its header), and nothing about a map being a
#     test map makes `abrams` a logistics unit.
#   * It re-roled the TYPE, so every abrams and every E3.america the BOT BOUGHT during the run was
#     Logistics too — which quietly contradicts the "production is still exercised" note below and
#     emptied the offensive module's own pools of the units it would otherwise field.
# Cloning puts the re-role on actors that exist only inside this scenario. The exclusion mechanism is
# unchanged (same trait, same value, same four pools); no statement is made about the shipped units.
# Precedent for scenario-local clones: `pauperabrams` (test-evac-refund-indicator/rules.yaml:63) and
# the humvee/m113/abrams families in test-burn-compare/rules.yaml.
#
# TWO THINGS ARE MANDATORY ON A CLONE AND BOTH HAVE COST A RUN BEFORE:
#   * `RenderSprites: Image:` — sprites resolve by ACTOR NAME and NOT through Inherits, so a clone
#     otherwise gets its parent's traits and none of its artwork and the engine dies at world load
#     with "Image `<clone>` does not have any sequences defined". No static gate catches it; the
#     sequence set is not resolved until world load (two instruments burned a launch slot each on
#     2026-09-01 learning this).
#   * `-Buildable:` — an inherited Buildable would put a Logistics-roled tank in the live Vehicle
#     queue for the whole run. Stripped, the clone can only ever exist because map.yaml placed it.
#
# CASE IS LOAD-BEARING ON THE `Inherits:` VALUES AND THEY DO NOT MATCH EACH OTHER: `abrams` lowercase
# (vehicles-america.yaml:464) and `E3.america` with a capital E3 (infantry-america.yaml:18). Unlike a
# mis-cased top-level KEY — which silently defines a new actor and overrides nothing — a mis-cased
# PARENT is loud: MiniYaml.cs:461-464 throws `Parent type ... not found` at load. The Lua still reads
# the staged cell back at runtime anyway; see the drafted-casualty guard.

casualtyabrams:
	Inherits: abrams
	RenderSprites:
		Image: abrams
	AIUnitRole:
		Role: Logistics
	-Buildable:

screendecoye3:
	Inherits: E3.america
	RenderSprites:
		Image: e3.america
	AIUnitRole:
		Role: Logistics
	-Buildable:

World:
	-StartGameNotification:
	# The bot's own Supply Route is placed explicitly in map.yaml; letting the engine also spawn a
	# starting force would put unrecorded actors on the map and move the screen centroid.
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-experimental-engineer-repairs.lua
