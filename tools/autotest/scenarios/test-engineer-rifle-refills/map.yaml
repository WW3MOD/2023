Actors:
	# ---- WEST END: the subject. Engineer, full C4, spent rifle, stocked Centre. ----
	EngineerDepot: logisticscenter
		Owner: USA
		Location: 8,16
	# THREE cells from the Centre's Location and two from its edge — the identical geometry
	# test-who-pays-for-a-rearm proved is comfortably inside the 4c0 AuraRange
	# (structures.yaml:503). Staging him outside it is the trap this scenario is most likely to
	# fall into: he would gain nothing, the run would read as confirmation of the bug, and it
	# would have proved only that he was standing too far away. Asserted at evaluation time.
	Engineer: e6
		Owner: USA
		Location: 11,16
	# ---- EAST END: the positive control. Same building, same distance, a soldier whose pool IS
	# listed in his Rearmable. ----
	#
	# TWO CENTRES rather than one, and the separation is load-bearing. The aura arm serves ONE
	# client at a time, chosen by greatest need (SupplyProvider.FindGreatestNeedTarget:629-691), and
	# a dry AR scores need 1.0 (one pool, 500 rounds, all missing) against the engineer's 0.4
	# (100 of 250 supply-weighted capacity missing). Sharing a Centre would let the control
	# monopolise the target slot and starve the subject of service for reasons that have nothing to
	# do with the defect — a false RED that would have blamed the fix.
	ControlDepot: logisticscenter
		Owner: USA
		Location: 58,16
	# EAST of its depot at +3, mirroring the engineer's offset EXACTLY rather than mirroring his
	# coordinates. That distinction cost a run on 2026-08-30. LOGISTICSCENTER is 3x3
	# (structures.yaml, `Dimensions: 3,3`) and SupplyProvider.InAuraRange measures from the
	# building's CenterPosition (SupplyProvider.cs:1399-1402), so a building at Location L has its
	# centre at L+(1.5,1.5) cells. Placed at 55,16 the control sat 4.74 cells from the centre of a
	# depot whose Location was only 3 cells away — OUTSIDE the 4c0 AuraRange — and the run failed as
	# "measured nothing" with the depot untouched at 2250. Same-sign offsets keep both subjects at
	# 2.12 cells from their own building's centre, symmetric by construction.
	Control: ar
		Owner: USA
		Location: 61,16
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 11,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 32,30
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

