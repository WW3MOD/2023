Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false
	# RankAccumulation is deliberately NOT overridden: this scenario runs the SHIPPED numbers
	# (base 2400 ticks + 2700 percent of sqrt(buildTime x 100), capped at 9000; each tier 3x rarer;
	# caps 3/2/1), so the abrams rank-1 interval is 2400 + 158 x 27 = 6666 ticks.
	#
	# That makes the run long, and staging a faster multiplier here to shorten it is exactly the
	# mistake below. If the runtime becomes unacceptable, shorten it by testing a CHEAPER unit --
	# under the compressed curve a 50-credit Conscript accrues in 2994 ticks, well under half the
	# abrams figure -- never by overriding the curve.
	#
	# An earlier version staged Rank1IntervalMultiplier to 400 so the schedule landed on round
	# thousands, and that cost a run: the verdict string quoted "400 percent" and was reasonably
	# read as the shipped value, which looks like a 20 percent deviation from the user's "every 5
	# units built can get rank 1". Round numbers in a schedule are not worth a scenario that grades
	# a configuration nothing ships.

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-rank-accumulation.lua

abrams:
	# The tank sold in phase C must survive the walk to the map edge, and ^EffectsWhenDamagedVehicles
	# bleeds a damaged vehicle to death by design. Nothing damages it here, but removing the bleed
	# costs nothing and forecloses the reading where phase C fails because the tank died rather than
	# because the evacuation credit did not land.
	-ChangesHealth@CriticalDamage:
