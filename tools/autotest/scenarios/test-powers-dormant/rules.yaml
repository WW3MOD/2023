# THE ONE OVERRIDE, and it is about the clock rather than the mechanism. The shipped Kinzhal proxy
# carries `BuildDuration: 3000` -- the ChargeInterval the power used to have, 180 s at Timestep 60 --
# because the purchase IS the wait in the shipped design. This scenario is measuring what happens
# AFTER the purchase completes, so leaving it would spend the entire launch slot watching a progress
# bar. 25 ticks is 1.5 s.
#
# NOTHING ELSE ABOUT THE PROXY IS TOUCHED. The price, the upkeep rate, the prerequisites and every
# field on the power are the shipped ones -- if any of them were re-declared here the run would be
# measuring this file rather than the mod.
#
# CASE MATTERS. Top-level keys merge case-SENSITIVELY, so `PowerProxy.Kinzhal:` here would define a
# SECOND, unrelated actor rather than overriding the shipped one, and would fail as
# "not constructible" rather than as "the override did nothing".
powerproxy.kinzhal:
	Buildable:
		BuildDuration: 25

Player:
	# 20000 buys the 4000-credit reservation with room to spare -- and then PassiveIncome 0 means
	# nothing ever replaces what upkeep takes. The scenario drives the purse to zero itself rather than
	# waiting out 1000 intervals of 20-per-interval drain; the income is what stops it refilling.
	#
	# WITHOUT `PassiveIncome: 0` THIS SCENARIO CANNOT FAIL. The shipped default is 100 per interval
	# against a 20-per-interval reservation, so the bill is always paid, no shortfall is ever recorded,
	# and the run would report "never went dormant" for a reason that has nothing to do with dormancy.
	PlayerResources:
		DefaultCash: 20000
		PassiveIncome: 0
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-powers-dormant.lua
