# GBU-57 asymmetry autotest overrides.
#
# DELIBERATELY MINIMAL, and for the same reason test-missile-strike-power's is: the point of the run
# is what the SHIPPED MOPPenetration warhead and gbu57bomb actor do, so nothing about the warhead,
# the flight or the entry point is restated here. A local copy of any damage number would go stale
# the moment weapons-superweapons.yaml moved, and the verdict would then be measuring this file.
#
# The overrides that ARE here are about reachability and about not measuring a timer.

Player:
	# Faction elimination would end the match before the Lua poller writes a verdict.
	-ConquestVictoryConditions:
	# Fog off and the map pre-explored, so neither victim's health readings nor the missile's
	# position are a visibility artefact.
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
	# No cash -> no production. The only actors in the world are the six placed ones plus the two
	# bombs the power delivers, so GetActorsByType("gbu57bomb") cannot pick up a third from anywhere.
	PlayerResources:
		DefaultCash: 0

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	# Removed so Player.HomeLocation falls back to the pinned PlayerReference value rather than a
	# spawn assignment -- see the geometry note in map.yaml.
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-gbu57-asymmetry.lua

# THE POWER MOVED OFF THE PLAYER ACTOR, AND THIS OVERRIDE MOVED WITH IT. The three strikes are now
# bought: each lives on a bodiless proxy sold from the `Powers` queue, because a reservation you can
# hold SEVERAL of has to be several ACTORS -- SupportPowerManager keys an AllowMultiple power
# `<OrderName>_<ActorID>`, and the Player actor is one actor forever.
#
# LEAVING THE BLOCK UNDER `Player:` WOULD NOT HAVE FAILED QUIETLY. With the shipped trait gone from
# that actor, a two-field override there CREATES a new MissileStrikePower with everything else at its
# C# default -- and MissileActor is [FieldLoader.Require], so the ruleset fails to load and the merge
# gate rejects the whole mod. That is the good version of this failure; it is recorded here because
# the bad version (a stub power that half-works) is what it looks like for any field that is not
# required.
#
# THIS SCENARIO IS ABOUT DELIVERY, NOT ABOUT THE ECONOMY, so it buys nothing: its WorldLoaded creates
# one proxy with Actor.Create, which needs only an Owner init and no Location because the proxy
# occupies no space. These four lines turn the banked purchase back into the always-available power
# the scenario was written against, and change NOTHING about the flight, the warhead or the entry
# point -- which is this file's whole principle.
#
#   AllowMultiple: False          keeps the key the BARE OrderName, so this scenario's OrderKey
#                                 constant still resolves. Shipped True makes it carry an ActorID
#                                 that cannot be known in advance.
#   OneShot: False                lets the power survive being fired, which the two-shot scenarios
#                                 need and which the shipped one-purchase-one-firing rule forbids.
#   DisposeSelfOnActivate: False  keeps the proxy in the world afterwards, for the same reason.
#   InfersUpkeep PermilleCost: 0  stops it billing. These scenarios deliberately run the player at
#                                 or near zero cash, and an unpayable bill would make the power
#                                 DORMANT and unfireable -- a failure with nothing to do with
#                                 delivery, arriving 50 ticks in.
powerproxy.gbu57:
	InfersUpkeep:
		PermilleCost: 0
	# The power's ONLY departure from shipping config, and it is the same one the Kinzhal scenario
	# makes: charged at t=0 and re-armed in a tick, instead of the shipped 3000-tick (180 s)
	# placeholder. Two things need it -- waiting out one interval would spend three minutes of a
	# launch slot, and the scenario fires TWICE in one run.
	MissileStrikePower@GBU57:
		ChargeInterval: 1
		StartFullyCharged: true
		AllowMultiple: False
		OneShot: False
		DisposeSelfOnActivate: False
