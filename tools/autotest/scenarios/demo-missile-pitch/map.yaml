MapFormat: 12

RequiresMod: ww3mod

Title: DEMO: ballistic missile nose tracks its own smoke trail

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 128,128

Bounds: 1,1,126,126

Visibility: MissionSelector

Categories: Test

# WHAT THIS IS FOR: looking at. It is a DEMO, so nothing here is asserted -- no AssertWithin, no
# Test.Pass, no result.json. Two Iskander launchers fire in turn and the viewer checks whether each
# missile's nose lies along the smoke trail behind it.
#
# THE COMPARISON THE VIEWER IS MAKING is nose against trail, because the trail is ground truth: it
# is a string of sprites dropped at the missile's own CenterPosition, so it marks exactly where the
# missile has been. If the nose is pitched further from horizontal than the trail, the missile is
# flying "belly first" -- which is the report this scenario exists to show the fix for.
#
# WHY TWO SHOTS AND WHY THESE TWO BEARINGS. The missile artwork is drawn from a camera 34.5
# degrees above the ground plane while the map grid is square (mod.yaml, TileSize 24,24 with
# Type: Rectangular), so the angle a facing is DRAWN at is not the angle you asked for. The two
# bearings here are the two ends of that:
#
#   SHOT B, due west (facing 256), is a cardinal. The artwork's y-squash has nothing to scale
#   because h.Y is zero, so the drawn angle equals the facing exactly and always has. THIS SHOT
#   LOOKED CORRECT UNDER THE MODEL THAT SHIPPED ON 2026-09-06 AND STILL DOES -- it is unchanged.
#   It is here as a control, and as a standing reminder that checking a cardinal proves nothing.
#
#   SHOT A, north-west (facing 128), is where the squash bites hardest. The ground vector (-1,-1)
#   sits at 225 degrees and the art draws it at (-1,-0.566), which is 209.5 -- so a LEVEL missile
#   on this heading is drawn 15.5 degrees off its own ground track. The 2026-09-06 model corrected
#   the pitch but not that, leaving a CONSTANT 15.5-degree error present at every point of the
#   flight including the apex. That is what the user saw as "tilts strangely for much of the
#   flight path", and it is what shot A is here to show fixed.
#
# The error was never slope-dependent, so do not expect it only on the climb: compare nose against
# trail at the apex too, where the arc is flat and the old model was at its most obviously wrong.
#
# TERRAIN. map.bin and map.png are twin-rivers-ww3's, copied unchanged from the sibling
# demo-highyield-nuke; only this actor list is new. Both launcher cells and both target cells were
# picked by decoding map.bin and requiring Clear or Road across a 5x5 footprint, so nothing here is
# placed on the rivers, rock or cliffs that terrain carries. What lies BETWEEN a launcher and its
# target was deliberately not constrained -- a ballistic missile flies over it.
#
# GEOMETRY. Both shots are 34 cells, comfortably inside IskanderTargeter's Range 50c0 and outside
# its MinRange 16c0, so neither launcher has to drive anywhere first. Both launchers start already
# facing their target so no turn delays the schedule. LaunchAngle 110 is 38.7 degrees, and a
# parabola's peak is range * tan(angle) / 4, so each arc tops out about 6.8 cells above the ground
# -- roughly 163 screen pixels of climb, which is what makes the pitch legible at all.
#
#   SHOT A  launcher 79,80 -> target 55,56   (dx -24, dy -24; 33.9 cells; facing 128, north-west)
#   SHOT B  launcher 81,66 -> target 47,66   (dx -34, dy   0; 34.0 cells; facing 256, due west)
#
# The two arcs cross near the middle of the map, which is deliberate: one camera position at 66,67
# frames both, so the demo never moves the camera out from under whoever is watching.

