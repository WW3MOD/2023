# Helicopter repair-at-pad autotest.
#
# Nothing here enables the behaviour under test. The rate lives on ^Airborne's Repairable
# (mods/ww3mod/rules/ingame/aircraft.yaml) in the shipped rules, and this file never names
# PercentageStep. Everything below is either determinism hygiene or the art workaround
# explained in map.yaml.

Player:
	PlayerResources:
		# PASSIVE INCOME OFF. This is not hygiene-by-habit, it is the correction for a
		# MEASURED wrong verdict. PlayerResources defaults to PassiveIncome 100 every
		# PassiveIncomeInterval 50 ticks after PassiveIncomeInitialDelay 50
		# (engine/OpenRA.Mods.Common/Traits/Player/PlayerResources.cs:63,66,69), and the
		# lobby option registers that same 100 as its default (:108-109), so a test that
		# measures cash as a before/after difference is really measuring income minus
		# spend. The 2026-09-05 run reported "billed -1496" — cash UP — which decodes
		# exactly as 20 payments x 100 = 2000 income minus the one 504-credit repair that
		# did happen. The repair was correct; the measurement was not.
		#
		# Locked as well as zeroed: the value that actually reaches PassiveIncomeAmount is
		# read from the lobby option (:167-170), so setting the field alone only moves the
		# DEFAULT and could still be overridden by a launcher that passes one.
		PassiveIncome: 0
		PassiveIncomeDropdownLocked: True
		# Engine default is 20000 already (:32); stated so the Lua's headroom claim does
		# not depend on an engine constant staying put. RepairTick's TakeCash failure path
		# sets remainingTicks = 1 and retries forever (Resupply.cs:665-669), which would
		# look exactly like the wedge this test detects — so the player must never be short.
		DefaultCash: 20000

World:
	-StartGameNotification:
	# UnitDefaultsManager applies THIS MACHINE's saved per-type stance defaults to
	# human-owned units in Created (AutoTarget.cs). Every actor here is human-owned, so
	# without this the verdict would depend on the dev's saved settings.
	-UnitDefaultsManager:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-heli-repairs-at-pad.lua

# ART WORKAROUND, NOT A BEHAVIOUR OVERRIDE. hpad.shp/hpadmake.shp do not exist
# (lint-baseline.txt:353-354), so a helicopter's shipped repair host cannot be placed on
# any map without a render-time failure. Widening the host list to include afld is the
# smallest edit that lets a real HELI dock at a real, drawable pad.
#
# THIS NODE MERGES, it does not replace: ^Helicopter declares `Repairable: RepairActors:
# hpad` and ^Airborne declares `RepairActors: afld` + `PercentageStep: 3`, so HELI's
# resolved Repairable is {RepairActors: hpad+afld, PercentageStep: 3} with the step
# arriving ONLY by inheritance. Do not add PercentageStep here — that would make this leg
# pass even if the inheritance were broken, which is half of what it measures.
#
# Case matters and is easy to get wrong: the defining node is `HELI:`
# (aircraft-america.yaml:286). A lowercase `heli:` here would override NOTHING, silently,
# because rules keys merge case-sensitively and the lowercasing happens after the merge.
HELI:
	Repairable:
		RepairActors: hpad, afld
