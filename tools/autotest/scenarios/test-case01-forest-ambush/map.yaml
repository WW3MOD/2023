Title: CASE-01: Forest ambush — concealed defenders vs equal-cost attacker

Author: WW3MOD case harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# CASE-01 measurement scenario (pipeline item 22). Composes item 26 (superlinear ground-shadow
# concealment + DensityModifiesDamage cover), item 21 (stance-aware cover positioning — one group
# order seats each Ambush slot in cover, VIEWER-INDEPENDENT), and ambush Stages 1-3 (spring machine,
# gated by enable-ambush-tactics, granted from Lua).
#
# KILL-CLEARING layout (N-S), tuned 260728 across several failed geometries:
#   - a dotted grove leaked diagonal sightlines -> defenders sprang at max range and lost;
#   - a solid 6-row wall buried the defenders so their OWN fire was tree-blocked -> lost;
#   - a COMPACT clearing (defenders ~5c from the attackers' emergence) let the attackers DETECT and
#     hit the defenders at close range, so per-seed hit-roll RNG decided it and defenders often LOST
#     (seeds 1001/2002 ratio 0.33/0.50). The defender's only ROBUST edge is being UNDETECTABLE, which
#     needs depth. Hence this DEEP form:
#     * WALL (concealment barrier): solid t01, x 24..40, trunk rows y 10..12 (3 rows).
#     * CLEARING (kill zone): open ground y 13..19 (deep) — attackers cross it EXPOSED and reach the
#       defenders only after most of them are already dead.
#     * COVER PATCH: solid t01, x 24..40, trunk rows y 20..21 — item-21 seats the Ambush defenders at
#       ~y22; their density gives the damage-taken cut AND drops their detectability to vis~1, so the
#       attackers cannot acquire them and take ~no return fire while being cut down in the clearing.
#
# COST PARITY: 5x e3.america (100cr) vs 5x e3.russia (100cr) — both inherit ^E3 (Valued.Cost 100).
#
# CALIBRATION MODE: the Lua verdict PASSES on sim resolution + loss capture; it does NOT gate on the
# provisional >=1:3 ratio (bar not ratified). After ratification, tighten the pass condition.
