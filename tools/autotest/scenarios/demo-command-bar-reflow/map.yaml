# A rifle squad and one APC, nothing else. The squad is what gets selected: infantry
# satisfy Passenger (AUTO_ENTER) and IMove (PATROL), so the right-hand panel comes up
# with live buttons rather than four greyed ones, which is the state the reflow has to
# look right in. The APC exists so AUTO_ENTER has a real transport to point at.

