# Kinzhal delivery autotest overrides.
#
# DELIBERATELY MINIMAL. The point of the run is what the SHIPPED MissileStrikePower and
# KinzhalMissile do, so nothing about the flight, the warhead or the entry point is restated
# here — a local copy of any of those numbers would go stale the moment player.yaml or
# vehicles-russia.yaml moved, and the verdict would then measure this file instead of the mod.
#
# The two overrides that ARE here are both about reachability, not behaviour.

Player:
	# `MissileStrikePower@Kinzhal: ChargeInterval: 1 / StartFullyCharged: true` USED TO SIT HERE AND
	# DID NOTHING -- see the note on power.kinzhal at the bottom of this file. The shot is bought.
	# Faction elimination would end the match before the Lua poller writes a verdict.
	-ConquestVictoryConditions:
	# Fog off and the map pre-explored, so the poller's view of the missile and the victim is
	# never a visibility artefact. The power's own CameraRange is irrelevant under this and is
	# deliberately not exercised — it reveals shroud, and there is none.
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
	# 10000 against the Kinzhal's 5000 price -- enough for the shots this scenario fires and no
	# more. This USED to read `DefaultCash: 0`, and that is exactly what killed the run: with the
	# power BOUGHT rather than charged, no cash means no shot, forever and silently. The property
	# the old note claimed -- that no stray missile can come from anywhere else -- still holds and
	# is now stronger: one purchase buys ONE shot (SupportPowerInstance.Activate calls
	# bank.Consume), nothing else on this map spends money, and there is no bot.
	PlayerResources:
		DefaultCash: 10000

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	# Removed so Player.HomeLocation falls back to the pinned PlayerReference value rather
	# than a spawn assignment — see the geometry note in map.yaml.
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-missile-strike-power.lua

# THE PURCHASE. Every shipped support power carries `RequiresPurchase: True`, so a shot has to be
# BOUGHT before it can be fired; ChargeInterval and StartFullyCharged are read and discarded under
# that flag (SupportPowerManager.cs:228-229). The whole chain is in the header of
# TestHarness.EnsurePower, mods/ww3mod/scripts/test-helpers.lua.
#
# 5 ticks instead of the shipped 500 (30 s): the load time is a PRICE and this scenario measures
# the missile, not the shop. Every tolerance in the Lua is anchored to the tick the ORDER issues
# rather than to t=0, so the ~12 ticks the purchase costs are free.
power.kinzhal:
	Buildable:
		BuildDuration: 5
