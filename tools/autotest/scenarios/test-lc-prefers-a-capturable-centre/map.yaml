Visibility: MissionSelector

Categories: Test

# USER REPORT 2026-09-03, watching a bot-vs-bot game on a map that already carried neutral Centres:
#   "On this particular map there are already a neutral LC on each side, so the bots should instead
#    capture the exisiting one."
#
# THIS SCENARIO IS THE COMPLEMENT OF test-lc-refuses-the-opening-buy, and the difference between the
# two maps is the whole experiment. That one refuses because there is NO DEMAND. This one deliberately
# CREATES the demand — a real forward army, far from the SR — so that the demand model says "buy",
# and then places a neutral Centre in reach so the capture veto is the only thing left refusing. If
# the veto is deleted, this scenario buys and fails; if the demand model is deleted, the OTHER
# scenario buys and fails. Neither can cover for the other.
#
# HOW THE DEMAND IS MANUFACTURED, since it must survive the gate on its own terms:
#   * SR at (6,16); the forward platoon stands at x=30..32, i.e. ~25 cells out — comfortably past
#     ForwardCustomerCells (12). TripSaving = 1000*(25-6)/25 ≈ 760 per mille.
#   * The forward group is 4 abrams (2500 each) plus 6 riflemen, ~11500 credits of forward army, so
#     the value term clears a 2500 tank by a wide margin once any ammo need exists.
#   * Ammo need is NOT scripted here and does not need to be: the forward platoon is placed in
#     contact with the Russian force, so it fights and spends ammo within the window. That is also
#     why this scenario runs a longer window than the opening one.
#
# THE NEUTRAL CENTRE at (20,16) is 14 cells from the USA SR — inside CaptureConsiderCells (40) and
# therefore a valid veto. It is placed BEHIND the forward platoon rather than between the two SRs, so
# it is plausibly capturable by this bot rather than contested at the midline.
#
# WHAT THE SECOND, ENEMY-SIDE CENTRE IS FOR. (52,16) is 46 cells from the USA SR, i.e. OUTSIDE
# CaptureConsiderCells. It reproduces the shipped maps' pairing (woodland-warfare, river-zeta and
# polar-disorder each place one per side) and it is the regression guard for the distance bound: if
# CaptureConsiderCells is ever removed or set map-wide, the enemy's Centre would veto this bot's
# purchase forever. That failure is invisible in this scenario's PASS — see the .lua, which reports
# the distance to whichever Centre it credits so the bound can be read off a passing run.
