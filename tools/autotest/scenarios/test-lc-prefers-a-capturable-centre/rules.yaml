# Scenario overrides. Deliberately minimal: the module under test runs on its SHIPPED ai.yaml
# configuration (RequireDemand true, ForwardCustomerCells 12, ResidualTripCells 6,
# CaptureConsiderCells 40), because a test that retunes the thing it is testing proves only that
# some other tuning works.

Player:
	# Rich ON PURPOSE, and more so than the opening scenario. The whole point here is that the bot
	# COULD buy a Centre — demand is real, the money is there, the `centre + tank` bar of 5500 is
	# cleared several times over — and declines only because a free one is in reach. A poor bot would
	# pass this test with the capture veto deleted.
	PlayerResources:
		DefaultCash: 25000

World:
	-StartGameNotification:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-lc-prefers-a-capturable-centre.lua
