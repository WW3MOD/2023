Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false

	# Enough that nothing here is decided by poverty. The armour is pre-placed, so this only keeps the
	# bot's ordinary production alive rather than starving its modules into unusual paths.
	PlayerResources:
		DefaultCash: 15000

	# THE LEVER UNDER TEST, STATED RATHER THAN INHERITED. ai.yaml sets it true for both profiles; the
	# scenario re-states it so the RED sabotage is a one-word edit HERE and nobody has to take the
	# shipped tuning down to run it.
	PoiOffensiveBotModule@experimental:
		BorderStagingEnabled: true

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-bot-defcon-wall.lua

	# Escalation rather than the shipped Skirmish default: Skirmish holds NoLevel and the wall never
	# stands at NoLevel. The no-rush clock is pinned far past the run so the level cannot fall to 2
	# mid-test and take the border down under the assertions -- 30000 ticks is 30 minutes at the 60 ms
	# timestep, against a run budget under two.
	#
	# NoRushTicksOverride, not the dropdown: the lobby option is registered with its own default
	# whatever a rules.yaml says, so only the override can win. Its "not in play" sentinel is 0.
	DefconEscalation:
		ModeDefault: Escalation
		StartAtDefault: 3
		NoRushTicksOverride: 30000

	# A vertical line down column 44 -- the midpoint of the two spawns at x 8 and x 80, so this
	# authored line is also the one the perpendicular-bisector derivation would produce.
	#
	# HalfWidth LEFT AT THE 1024 DEFAULT, deliberately unlike test-defcon-wall's 512. 512 seals an
	# AXIS-ALIGNED line and nothing else, and while this line IS vertical, the band width is also what
	# the staging clamp has to step over -- testing against the shipped width is the useful test.
	DefconWall:
		Start: 44,0
		End: 44,59
