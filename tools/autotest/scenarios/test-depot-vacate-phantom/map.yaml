Actors:
	# The depot is the whole point. UPDATED 2026-09-05: LOGISTICSCENTER is now Dimensions 2,2
	# with Footprint `++ =+`, so placed at 32,16 it covers 32..33 x 16..17 and exactly ONE of
	# those cells is stayable — 32,17, the bottom-left, under the crane, named by
	# ResupplyDock.Offset (-512,512,0). Resupply drives the client onto that cell and tests
	# arrival by cell equality.
	#
	# It USED to be Dimensions 3,3 with `=+= +++ =+=` covering 32..34 x 16..18, docking on the
	# CENTRE cell 33,17, which was a '+' — OccupiedPassableTransitOnly — so the tank came to rest
	# somewhere Locomotor.CanStayInCell reports false for and the idle handler shoved it off. That
	# accidental shove was load-bearing, and it is gone; Resupply.LeaveHost replaces it with an
	# explicit vacate. The Lua header spells out the whole handover.
	Depot: logisticscenter
		Owner: USA
		Location: 32,16
	# Lowercase actor name deliberately: overrides merge case-sensitively and the
	# shipped key is `abrams`. `Abrams` would define a NEW actor, not this one.
	# ^Vehicle carries Repairable (vehicles.yaml:57), so this docks rather than
	# standing off the way a RepairableNear unit would.
	# 12 cells west of the depot: far enough that the approach is a real drive, so a
	# failure to arrive is visible as a timeout rather than being masked by adjacency.
	Tank: abrams
		Owner: USA
		Location: 20,17
		Facing: 512
	# The SECOND customer, and the reason this scenario earns its run twice over. The suite has no
	# other two-vehicles-one-depot case: test-lc-rearm-partial-order's only contention is PairA/PairB,
	# both `ar` INFANTRY sharing a cell via subcells, and its lone vehicle has a depot to itself.
	# Without this actor, a change making the dock cell stayable would go green through the whole
	# suite while shipping a hard stall — MoveOnto.CalculatePathToTarget waits rather than stacking
	# when the dock is occupied (MoveOnto.cs:41-58), and the LC's isCloseEnough is WDist.Zero, so
	# there is no near-enough fallback to rescue it. THAT CHANGE HAS NOW HAPPENED (the 2x2's dock
	# cell IS stayable), which is exactly why this actor is now the most load-bearing thing here:
	# it is the only check in the suite that the explicit vacate actually frees the cell.
	# Offset one row south so the two do not contend for approach cells before the depot itself.
	Tank2: abrams
		Owner: USA
		Location: 20,20
		Facing: 512
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 20,17
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 60,30
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

