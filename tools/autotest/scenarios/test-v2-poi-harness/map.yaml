	# Neutral Supply Route — a deny/hold POI (decision #2: capturing it flips it
	# Neutral, cutting a would-be enemy lane; never a lane for us). PoiMap
	# discovers it as a DenyCapture target.
	NeutralSR: supplyroute
		Owner: Neutral
		Location: 42,16

	# ENEMY-owned income structures on the Russia side — Phase 3 OFFENSIVE POIs.
	# GetOffensiveTargets ranks these (Attack) alongside the enemy SR (Pressure),
	# giving the USA v2 bot >=2 distinct enemy objectives so PoiOffensiveBotModule
	# SPLITS its army across axes instead of one death-ball. Placed off the SR-to-SR
	# centre line (rows 10 / 22) so the two axes visibly diverge.
	EnemyFcom: fcom
		Owner: Russia-bot
		Location: 50,22
	EnemyOilb: oilb
