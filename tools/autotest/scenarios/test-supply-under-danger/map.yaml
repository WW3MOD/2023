MapFormat: 12

RequiresMod: ww3mod

Title: TEST: supply reaches a starving platoon under believed danger

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 0,0,66,34

Visibility: MissionSelector

Categories: Test

# DOCTRINE UNDER TEST: supplies have to reach the front one way or another. A platoon
# low on ammo dies if it is not resupplied, so a truck is expected to push in — serving
# from its aura where it is safe, or dropping a crate short and leaving where it is not.
# Danger may change HOW supply arrives; it must not change WHETHER it arrives.
#
# AND THE FRONT MUST STILL BE THE FRONT WHEN IT ARRIVES. Measured at 14499b0a, the ammo
# half alone passed while the doctrine was violated: AutoSeekSupplies walked the whole
# platoon nine cells west to meet the truck in open ground. Supply reaching the front and
# the front reaching supply are opposite outcomes, so the Lua asserts position too.
#
# GEOMETRY (row 16 is the lane; distances are map cells)
#   x=4    USA-bot Supply Route          — carries no supply aura; cannot rearm anyone
#   x=7    Truck (truk, full 750)        — starts OUTSIDE the believed danger
#   x=38   Platoon: 5x e3, drained to 10/100 primary in Lua
#   x=58   Two Russian grads             — the danger source, never fired (HoldFire)
#
# NOTHING ELSE CAN FEED THE PLATOON, which is what makes the verdict mean what it says.
# ^E3's Rearmable lists only `truk, logisticscenter` (infantry.yaml:1251-1253); there is no
# logistics centre on this map, and SUPPLYROUTE carries no SupplyProvider at all, so the
# beachhead cannot rearm them. The truck under test — or a crate it drops — is the only
# supply that exists.
#
# WHY grad: GradRockets is Range: 40c0 (rules/weapons/weapons-ballistics.yaml:702) and
# the danger kernel tapers LINEARLY over range/1024 + 2 cells, so a believed grad stamps
# out to ~42 cells. Core intensity for a believed armoured contact is ~5e5 against an
# EvacDangerUnits: 50 threshold that converts to ~1,706 raw at the measured ground
# reference of 3,412 — so essentially the ENTIRE envelope reads above the evac bar, not
# just its core. That reproduces the measured live condition (median cell 818 / 2,755
# danger units, i.e. above every threshold that gates on it) on a small deterministic
# map, rather than hoping a couple of tanks happen to clear it.
#
# The danger wall therefore starts around x=16 and covers everything east of it. The
# truck spawns clear of it at x=7; the platoon sits ~22 cells deep inside it. Reaching
# the platoon means entering danger, which is exactly the decision under test.
#
# Measured at d42e9371, the field at the cluster read danger=1348298 against an evac bar
# of 1,706 — ~790x. The wall is not marginal.
#
# The grads are held at HoldFire in Lua. They must be BELIEVED (fog is off in rules.yaml)
# so they paint the danger field, but they must not actually shell the platoon or the
# verdict would measure survival instead of resupply.

