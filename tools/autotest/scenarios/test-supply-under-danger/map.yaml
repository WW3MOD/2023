		Location: 7,16

	# The starving platoon. Five riflemen inside one 10-cell cluster radius, so they read as
	# a single cluster on every bot profile (MinNearbyFriendlies 4, or 2 under
	# SmallSquadCoverage).
	#
	# x=38 is 31 cells from the truck at x=7, INSIDE MaxFollowDistance: 35 (ai.yaml:805). At x=44
	# the cluster was 37 cells out, the follow filter dropped it, HuntLeashCells: 20 could not
	# reach either, and the truck was never dispatched at all — the run at 87faad44 measured that
	# and nothing else. Do not move the platoon back out past 35 cells from the truck.
	#
	# AN EARLIER VERSION OF THIS COMMENT CLAIMED x=38 ALSO KEEPS THE PLATOON OUTSIDE
	# AutoSeekSupplies' 20-CELL LEASH. That was wrong, and the run at 14499b0a disproved it: the
	# truck did not stop at the danger wall, it drove to x=29, which put the platoon 9 cells
	# inside the leash and pulled the whole front west to meet it. There is NO placement that
	# keeps the platoon out of a leash measured from a truck that is free to drive; the leash
	# follows the truck. So the scenario no longer tries to prevent that geometrically — the Lua
	# measures peak drift from spawn and fails the run if the platoon ever leaves its position.
