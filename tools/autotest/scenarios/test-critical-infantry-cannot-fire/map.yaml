MapFormat: 12

RequiresMod: ww3mod

Title: TEST: a critically wounded soldier does not fire (auto)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# Two Russian conscripts, identical in every respect except health, both looking
# at the same USA conscript from the same distance:
#   Wounded — drained to 15% HP in Lua, so `critical-damage` is granted
#   Control — untouched
# Victim is put on HoldFire so nothing shoots back and the run is decided only by
# what the two attackers do.
#
# The Control is the falsification arm: it shares the scenario's range, line of
# sight, stance, ammo and target, so if IT never fires the setup is broken and the
# run reports SETUP INVALID rather than a green that measured nothing.
#
# PASS = Control fires and Wounded does not.
Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
