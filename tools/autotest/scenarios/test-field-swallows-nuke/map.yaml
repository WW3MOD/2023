Title: TEST: a nuclear scar must cross a crop field (auto, screenshot)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# WHAT THIS STAGES, and why it did not exist until now. Sixteen scenarios carry crop fields and about
# nine detonate a nuke, and the two sets are DISJOINT -- so SmudgeLayer.GroundCoverOverlay, the
# feature whose entire purpose is to redraw a terrain scar ON TOP of a crop field after the actor
# pass, has never had a nuclear blast drawn over a field in any committed scenario.
#
# THE FEATURE. Smudges are a terrain-pass decal and actors are drawn in a later pass, so a scar on a
# cell holding a crop field is placed, is present, and is completely hidden by the field sprite on
# top of it -- farmland reading as immune to a nuclear blast. GroundCoverOverlay draws the same
# sprite at the same alpha a SECOND time, from IRenderAboveWorld, for those cells only
# (SmudgeLayer.cs:76-87, :285-320). All five Scar* layers opt in (world.yaml:505-540).
# The restriction is exact: a cell qualifies only when it holds at least one actor and EVERY actor
# in it is ground cover, so a scar can never appear on top of a tank, a soldier or a building; and an
# EMPTY cell is excluded, because the terrain pass already drew it and drawing it twice would
# composite the sprite onto itself and make bare ground darker than farmland.
#
# GEOMETRY -- and it is NOT the geometry the original brief specified, for a reason worth keeping.
# The brief said to graft the patch at x28-38 / y21-31 with ground zero at 33,26, "which fits the
# bounds". It does not: Atomic's outermost band is ScarRim at radius 12, so a burst at y=26 runs to
# y=38 against a map that ends at y=32 and the disc is clipped along the south edge. The patch is
# therefore lifted ten cells north and the burst with it. Nothing else about the arrangement changes.
#
#   Field patch   x28..38, y11..21   121 v14 actors, Neutral, one per cell (^CivField is tiled)
#   Probe         33,16              bradley at the centre of the patch; rules.yaml gives it an
#                                    Explodes: Atomic gated on an ExternalCondition, so the
#                                    detonation lands on a tick this scenario chooses rather than on
#                                    one a ballistic flight happens to produce
#   WitnessField  36,14              humvee standing ON a field cell, bucket 4 -> ScarCrater band.
#                                    The cell WOULD have taken the overlay; the vehicle is what must
#                                    stop it. This is the "never over a unit" half of the criteria.
#   WitnessBare   42,16              humvee on BARE ground, bucket 9 -> ScarBurn band, just east of
#                                    the patch. The comparison reference.
#
# THE BANDS, and why the disc is continuous. Map.FindTilesInAnnulus buckets an offset by
# ceil(sqrt(dx^2+dy^2)) (MapGrid.CreateTilesByDistance), so every offset lands in exactly one bucket
# and Atomic's five LeaveSmudge warheads -- 0..2 core, 3..4 crater, 5..7 char, 8..10 burn, 11..12
# rim -- tile the whole disc with no gaps. The patch's farthest cell is a corner at sqrt(50) = 7.07,
# bucket 8, so the WHOLE patch is inside the burn band or tighter and every band that touches it
# carries Chance 100. ScarRim is the only one with Chance: 60 and it lands at radius 11-12, entirely
# OFF the patch -- if the outermost ring is missing from a capture that is the 40%, not a defect.
#
# THE SEAM TO LOOK AT is y=16, where x38 is the last field cell (bucket 5) and x39 and x40 are bare
# ground (buckets 6 and 7). All three are in the SAME ScarChar band, so they must read as the same
# darkness. The full criteria are in README.md and are the manager's to judge; the scenario's own
# verdict is only that it ran to the captures with its witnesses alive.
