MapFormat: 12

RequiresMod: ww3mod

Title: TEST: husk facing while it finishes a corner

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# A vehicle killed mid-move keeps dragging to the centre of the cell it had already reserved. On a
# STRAIGHT leg the facing it died with already points down that drag, so nothing looks wrong -- which
# is why this scenario corners. Each truck drives east along its own row and then jogs south, and is
# killed part-way through the 90-degree arc, where the facing it dies holding is the arc tangent
# (pointing at the cell it is leaving) while the husk's drag runs straight to the cell it never
# entered. That gap is the sideways slide.
#
# THREE arc lanes killed at three different offsets into the arc, not one: a single offset is a bet
# that the chosen tick lands inside an arc lasting about twenty ticks, and a run slot is too expensive
# to bet. The spread guarantees at least one wreck dies mid-arc even if the speed arithmetic is off.
#
# A FOURTH lane is the control, killed on the straight approach where the fix must be a no-op. See the
# TruckD comment below -- that lane is the one that can catch a regression, and the regression it
# catches would be more visible to players than the bug being fixed.
#
# All four lanes share x=30 so one fixed camera frames them together and a single screenshot burst
# covers every lane.
Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	OwnSR: supplyroute
		Owner: USA
		Location: 3,3
	OpponentSR: supplyroute
		Owner: Russia
		Location: 62,30
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 3,3
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 62,30

	# Three supply trucks, one per lane. Facing 768 is East (WAngle is counterclockwise), so each
	# starts already pointing down its straight leg and the only turn in the run is the corner.
	TruckA: truk
		Owner: USA
		Location: 14,10
		Facing: 768
	TruckB: truk
		Owner: USA
		Location: 14,16
		Facing: 768
	TruckC: truk
		Owner: USA
		Location: 14,22
		Facing: 768

	# CONTROL LANE. Same L-shaped course as the other three, but killed on the STRAIGHT approach well
	# before the arc opens. This is the arm that can catch a regression rather than the reported bug:
	# if SmoothSegmentTarget is corner-cutting the living unit's path while the husk drag always aims
	# at the cell centre, then the facing correction is not a no-op on an ordinary straight-leg kill
	# and shows up as a facing POP at the moment of death -- which players would see far more often
	# than the corner case that was actually reported. Expect crab=0 here and no visible rotation.
	TruckD: truk
		Owner: USA
		Location: 14,13
		Facing: 768

Rules: rules.yaml
