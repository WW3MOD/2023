MapFormat: 12

RequiresMod: ww3mod

Title: TEST: a supply truck can drop its cache on a field cell

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# THE BUG: ww3mod tiles crop fields as one 1x1 Building actor PER CELL (3187 of them on
# river-zeta). Movement over them works, because Passable/PassClasses is honoured by
# Locomotor. But DropsSupplyCache.CanDropCache asks "is this cell clear?" with a raw
# ActorMap.GetActorsAt query that knows nothing about Passable — so the truck drives onto
# the field it is allowed to drive onto, arrives, and then silently refuses to drop
# (logging reason=cell-blocked). The crate never reaches the front.
#
# GEOMETRY (row 16 is the lane)
#   x=4          Supply Route + spawn
#   x=12         Truck (truk, full 750) — starts on BARE GROUND, outside the field
#   x=18..26     A 9x9 patch of v14 field actors, y=12..20 — the field
#   x=22,y=16    The ordered drop cell, dead centre of the field patch
#
# The truck starting outside the patch and driving in is load-bearing: it proves movement
# over the field is fine and isolates the failure to the occupancy test on arrival. If the
# truck could not even reach x=22 this test would be measuring pathing, not the drop.

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@Observer:
		Name: Observer
		Playable: True
		Spectating: True
		LockFaction: True
		Faction: america
	PlayerReference@Me:
		Name: Me
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america

Actors:
	OwnSR: supplyroute
		Owner: Me
		Location: 4,16
	SpawnMe: mpspawn
		Owner: Neutral
		Location: 4,16

	# The truck under test. Full supply, starts on bare ground west of the field.
	Truck: truk
		Owner: Me
		Location: 12,16
		Facing: 768

