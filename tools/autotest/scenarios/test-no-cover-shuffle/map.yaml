MapFormat: 12

RequiresMod: ww3mod

Title: TEST: no cover shuffle for human players (auto)

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

# Bounds inset by one cell on every side so the map defines a valid cordon. The sibling stance
# scenarios this geometry was copied from use 0,0,66,34 and are recorded as lint debt in
# mods/ww3mod/lint-baseline.txt for exactly that; there was no reason to inherit the debt. Every
# actor here sits at x 5..60, y 16..26, so nothing is near the inset edge.
Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# REGRESSION GUARD for the 2026-08-30 removal of human tactical positioning.
#
# The geometry is a byte-for-byte copy of test-stance-positioning — the arrangement PROVEN to make
# StancePositioningExecutor relocate a unit: a single AR a few cells SOUTH of a treeline (tank-trap
# density row at y=16, x=10..16), with an enemy tank sighted further south so the threat layer has a
# clear bearing and MinThreatIntensity is satisfied. That sibling test asserts the AR DOES walk to
# the y=17 cover edge; this one asserts it does NOT.
#
# The difference between the two scenarios is one block in rules.yaml. test-stance-positioning
# re-adds `enable-tactical-positioning` to the executor's gate and grants it to human owners;
# this scenario adds nothing, so it runs the SHIPPED configuration, in which no human-owned unit
# satisfies the gate at all.
#
# Expected (GREEN): the AR holds its spawn cell (13,19) for the whole window. RED (paste the
# enablement block into rules.yaml): the executor relocates it to y=17 and the run fails.
#
# The AR is human-owned, so no bot module can move it either; combined with the enemy being made
# non-auto-targetable in rules.yaml, the executor is the ONLY thing on the map that could.
