MapFormat: 12

RequiresMod: ww3mod

Title: TEST: a shift-queued deploy fires at the END of the waypoints (auto)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# THE GEOMETRY IS THE ASSERTION. Everything on this map exists to make "the deploy ran now"
# and "the deploy ran at the end of the queue" land 20 cells apart, so the verdict cannot be
# read two ways and no tolerance can blur them.
#
#   x=8    Truck (truk, full 750 supply) — where an UNqueued deploy drops its crate
#   x=18   first shift-waypoint
#   x=28   last shift-waypoint — where a correctly QUEUED deploy drops its crate
#
# Row 16 is clear ground the whole way, so the drive is uneventful and the only thing that
# decides where the crate lands is whether the deploy order respected its queued flag.
#
# NO BOT PLAYER, on purpose. SupplyFollowerBotModule issues DropSupplyCacheAt errands of its
# own, and a crate it dropped would be indistinguishable from the crate this test is asking
# about. USA is a human slot, so the only deploy on this map is the one the Lua issues.
#
# NOTHING ELSE CAN PUT A SUPPLYCACHE ON THE MAP: no crate spawner (removed in rules.yaml), no
# second supply-bearing actor, and no enemy to provoke a danger-evac drop. A `supplycache`
# appearing anywhere is therefore this truck's, and its cell is the whole verdict.

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	Truck: truk
		Owner: USA
		Location: 8,16

	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 8,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 58,16

	# One SR per faction per AUTOTEST.md — Russia owns no units, and an actorless faction ends
	# the match with a Mission-Accomplished overlay before the Lua poller can write a verdict.
	# Both are parked well off row 16 so neither footprint touches the truck's lane.
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

Rules: rules.yaml
