MapFormat: 12

RequiresMod: ww3mod

Title: TEST: a transport helicopter can land on a field cell to unload

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# THE BUG: ww3mod tiles crop fields as one 1x1 Building actor PER CELL. Aircraft.CanLand
# iterates ActorMap.GetActorsAt and asks Aircraft.IsBlockedBy, which can only un-block an
# actor the aircraft would CRUSH — AircraftInfo has Crushes but no `Passes` counterpart to
# LocomotorInfo's. ww3mod aircraft declare `Crushes: crate, mine, infantry`, which does not
# include `field`, so a field actor blocks the touchdown outright. Cargo.CanUnload calls
# CanLand directly, so a loaded transport hovers over the field forever.
#
# GEOMETRY (row 16 is the lane)
#   x=4          Supply Route + spawn
#   x=16..28     A 13x13 patch of v14 field actors, y=10..22 — the field. It is sized so
#                that EVERY cell within the 5-cell range UnloadCargo hands to Land is field:
#                a smaller patch lets the helicopter sidestep to bare ground just outside it
#                and unload there, passing the test without ever exercising the bug.
#   x=22,y=16    Tran (transport helicopter), parked over the middle of the field
#   x=22,y=16    Two riflemen, teleport-loaded into the Tran by the Lua at world load
#
# The helicopter STARTS over the drop zone, so no flight is involved: the only thing
# between it and a successful unload is the landing-occupancy test.

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@Observer:
		Name: Observer
		Playable: True
		Spectating: True
		LockFaction: True
		Faction: america
	PlayerReference@Me:
		Name: Me
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america

Actors:
	OwnSR: supplyroute
		Owner: Me
		Location: 4,16
	SpawnMe: mpspawn
		Owner: Neutral
		Location: 4,16

	# The transport under test, sitting over the centre of the field patch.
	Tran: tran
		Owner: Me
		Location: 22,16
		Facing: 768

	# The passengers are NOT placed here. They are built out-of-world in Lua and loaded
	# straight into the Tran, so their starting cell can never be what makes the unload
	# succeed or fail — and so nothing is ever in the world and in cargo at once.

	# The field: one actor per cell, exactly how the map editor lays them down.
