MapFormat: 12

RequiresMod: ww3mod

Title: DEMO: the nuclear arsenal, six warheads fired in ascending yield at one aim point

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 128,128

Bounds: 1,1,126,126

Visibility: MissionSelector

Categories: Test

# WHAT THIS IS FOR: looking at. It is a DEMO -- no AssertWithin, no Test.Pass, no result.json. USA
# fires all six weapons of the nuclear arsenal at the SAME cell, smallest first, and the viewer
# watches each one reach further than the last.
#
# WHY ONE AIM POINT RATHER THAN SIX. Spreading the shots across the map sounds tidier and is much
# worse, because the arsenal spans 4.5 to 246 cells of blast radius: from the fourth weapon onward a
# single detonation covers the whole playfield, so "one patch each" stops being possible before it is
# even half shown. Firing them all at cell 64,64 in ascending order turns that problem into the
# demonstration -- EACH SHOT KILLS A RING THE PREVIOUS ONE COULD NOT REACH, and the ring is visible
# as a fresh band of destruction with intact targets beyond it. Nothing needs respawning; the
# survivors of shot N are the targets of shot N+1.
#
#   shot 1  B61-12 (0.3 kt)     4.5 cells    kills ring 3 only
#   shot 2  B61-12 (50 kt)     24.6 cells    kills rings 7 through 23 -- the same bomb, dialled up
#   shot 3  W76-1             31.0 cells    kills ring 28
#   shot 4  RS-28 Sarmat      60.7 cells x SIX warheads scattered over 21 cells -- rings 33 to 57,
#                                           and unlike every other shot it does NOT arrive as one
#                                           circle: watch for six separate fireballs
#   shot 5  B83-1             71.0 cells    kills ring 65
#   shot 6  Tsar Bomba       246.1 cells    everything, twice over, with a 25-second fireball
#
# THE TERRAIN is twin-rivers-ww3's, copied unchanged; only the actor list is new. It was picked over
# the other nine shipped maps by decoding all of them: of the four largest it is the one that is
# almost entirely land (12294 Clear cells against 315 Water) AND has a clear centre, which the
# nominally-bigger x-lake-ww3 does not.
#
# WHAT WILL AND WILL NOT VISIBLY CHANGE. Structures and infantry burn, take damage states and die.
# Vehicles take damage and die. TREES DO NOTHING AT ALL at any range -- every T##/TC0# actor carries
# ^TreeIndestructible (DamageMultiplier: Modifier: 0, decoration.yaml:135-137) and
# Health.InflictDamage applies damage modifiers, so both the vaporise warheads and the fire ticks
# resolve to zero mod-wide. They are here for scale and for the look of the thing. Do not read "the
# trees are still standing" as a weapon underperforming; read the structures and the infantry.
#
# GEOMETRY OF THE STRIKES, all six identical because they all come from the same Supply Route:
#   CORRECTED 2026-09-07 -- engine b69681d2 REPLACED THIS RULE and every tick below it moves.
#   Map.ChooseClosestEdgeCell is gone; the spawn is now
#     entry    = aimPoint - unit(home -> salvoCentroid) * standoff
#     standoff = mapDiagonal + ApproachMargin = 185363 + 16384 = 201747 wdist = 197.0 cells
#   USA home 64,118 -> aim 64,64 is due NORTH, so the entry is cell 64,261: off-map SOUTH, 143
#   cells beyond USA's own base rather than 9 cells short of it on the map's south edge. The
#   bearing is unchanged (still straight up the centreline) because home and aim share x=64; what
#   changed is that the missile is born far off-map and the flight is ~3.1x longer.
#   THE OLD DERIVATION, recorded once so nobody rebuilds it:
#     du = |127-64| = 63, dv = |127-118| = 9, dv < du -> edge = (64, 127), 63 cells = 64512 wdist,
#     giving B61 (900) 71t | W76 (1400) 46t | Sarmat (1600) 40t | B83 (700) 92t | Tsar (400) 161t.
#   NOW flight time is exactly 201747 / Speed, because no arsenal missile sets TerminalAcceleration:
#     B61 bodies (900) 224t | W76 (1400) 144t | Sarmat (1600) 126t | B83 (700) 288t | Tsar (400) 504t
#   Every tick in the timeline below shifts accordingly and has NOT been re-measured. Nothing here
#   is asserted, so this is a stale caption rather than a failing run.
#
#   THE SARMAT IS THE ONE TO WATCH AFTER THIS CHANGE: it is the only shipped power with AimPoints
#   above one (6), and b69681d2 is what stopped its six warheads fanning outward from a single
#   point. They now fly one shared bearing, parallel, spaced exactly as the player clicked.
#
# WHY MapStartingLocations IS REMOVED IN rules.yaml: USA is the playable client player, so
# Player.HomeLocation would otherwise come from a spawn assigner (Player.cs:182) and the edge
# derivation above would depend on which mpspawn it picked.

