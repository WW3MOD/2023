# Nuclear-arsenal DEMO overrides. Nothing here is asserted; see map.yaml for the layout and
# demo-nuke-arsenal.lua for the firing schedule.

World:
	# THE SANDBOX SWITCH, AND IT IS WHAT MAKES THIS DEMO FIRE AT ALL SINCE 2026-09-07.
	# Three of the six warheads below are EVENT TIER -- Sarmat, B83 and Tsar Bomba all carry
	# `Prerequisites: powers.event` (player.yaml) -- and powers.event is provided by NO faction,
	# only by the three unfiltered ProvidesPrerequisite traits gated on `!powers-sandbox-disabled`.
	# The other three are `powers.america`, which USA does provide. Without this block the demo
	# would fire half its arsenal and silently skip the interesting half.
	#
	# THE EVENT TIER IS NOT THE WHOLE GATE, AND THIS NOTE USED TO IMPLY IT WAS (corrected
	# 2026-09-21). @Sarmat and @TsarBomba each carry a SECOND prerequisite -- `player.russia`
	# (player.yaml:238-239, :262-263) -- and NOTHING here grants it: ProvidesPrerequisite@Russia is
	# `Factions: russia` (player.yaml:1168-1170) and the sandbox block below it has no `player.*`
	# member at all. So this switch alone left USA two warheads short, and the demo skipped them in
	# silence. THE FIX IS A SEAT, NOT A WIDER SWITCH: demo-nuke-arsenal.lua now fires those two
	# from the Russia map combatant. Do not "fix" it by granting player.russia here -- that would
	# make an America seat able to launch a Sarmat, which is the exact asymmetry the faction tiering
	# exists to state.
	#
	# @B83 keeps working from the USA seat because `player.america` was REMOVED from it on
	# 2026-09-20 (player.yaml:260-261): it is event-tier and names NO owner, so under this switch
	# either seat can fire it.
	#
	# THE `nuclear-arsenal` CHECKBOX IS STILL NOT OVERRIDDEN, which is the property the note here
	# used to protect. It ships defaulting ON (PowersLobbyOptions.cs), so all six powers are still
	# exercised in their shipped configuration; only the FACTION lock is suspended. If that default
	# is ever flipped to off before release, add `NuclearArsenalCheckboxEnabled: true` to the block
	# below, and the symptom will be a support-power bin missing six icons.
	PowersLobbyOptions:
		PowersSandboxCheckboxEnabled: true
		PowersSandboxCheckboxLocked: true
	-StartGameNotification:
	-SpawnStartingUnits:
	# Removed so Player.HomeLocation falls back to the pinned PlayerReference value rather than a
	# spawn assignment -- the edge derivation in map.yaml depends on it.
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, demo-nuke-arsenal.lua

Player:
	# ALL SIX ARE BOUGHT, NOT CHARGED, and the six-line block that used to sit here
	# (`ChargeInterval: 1` + `StartFullyCharged: true` on each) DID NOTHING AT ALL.
	# SupportPowerInstance's constructor forces TotalTicks and remainingSubTicks to 0 whenever
	# RequiresPurchase is set (SupportPowerManager.cs:228-229), so both values were read and
	# discarded on every one of the six, all six stayed at zero charges -- Disabled, therefore not
	# Ready -- and all six Test.ActivateSupportPower calls returned 'not-ready:0'. This demo has
	# fired nothing since the powers became purchasable. DO NOT PUT THOSE LINES BACK; the shots are
	# bought instead, see the six proxy overrides at the bottom of this file.
	#
	# THE SIX MissileDelay OVERRIDES BELOW ARE INERT UNDER THIS SCENARIO'S OWN SANDBOX SWITCH, and
	# saying so is the whole of this note (2026-09-21). MissileStrikePower reads
	#     baseMissileDelay = sandbox != null && sandbox.SandboxRemovesLaunchDelay ? 0 : info.MissileDelay
	# (MissileStrikePower.cs:624-626), and SandboxRemovesLaunchDelay DEFAULTS TRUE
	# (PowersLobbyOptions.cs:168). PowersSandboxCheckboxEnabled is locked on above, so every one of
	# these six resolves to 0, not 60. The old note here claimed the value was "still live and
	# still an override"; it is neither, and the demo's old tick table was 60 ticks early on every
	# shot as a result.
	#
	# THEY ARE KEPT RATHER THAN DELETED, deliberately: SandboxRemovesLaunchDelay is a default that a
	# future change could flip, and at that point 60 is the number this demo wants -- the public
	# countdown is a real mechanic and is deliberately NOT what this demo is about, and six shipped
	# waits of 200 to 600 ticks back to back would add two and a half minutes of watching beacons.
	# Delete a line from any entry to see its real approach, once the delay is applied at all.
	MissileStrikePower@B61Low:
		MissileDelay: 60
	MissileStrikePower@B61Max:
		MissileDelay: 60
	MissileStrikePower@W76:
		MissileDelay: 60
	MissileStrikePower@Sarmat:
		MissileDelay: 60
	MissileStrikePower@B83:
		MissileDelay: 60
	MissileStrikePower@TsarBomba:
		MissileDelay: 60
	# 665 actors die here. Without this the match ends on elimination somewhere around shot 3, while
	# three more weapons are still waiting to be fired.
	-ConquestVictoryConditions:
	# THE REAL ANSWER TO THE CAMERA CEILING, and the reason it lives here rather than in a power.
	# CameraRange cannot exceed 55c0: it reaches MapGrid.MaximumTileSearchRange (MapGrid.cs:113,
	# default 56) through RevealShroudEffect -> MapLayers.ProjectedCellsInRange ->
	# Map.FindTilesInAnnulus, which THROWS rather than clamping (Map.cs:1993-1995). Tsar Bomba's
	# blast reaches 246 cells, so its own camera can never show more than 22% of it.
	#
	# Pre-exploring the map and turning fog off makes the strike camera irrelevant -- there is no
	# shroud left for it to reveal -- and the viewer sees the whole detonation. ANY SHOWPIECE
	# SCENARIO FOR A MULTI-MEGATON WEAPON WANTS THIS BLOCK. In a real match the ceiling stands.
	#
	# The other option, which is NOT taken here and is not a weapon-level decision, is to raise the
	# ceiling globally by adding one line to mod.yaml's MapGrid block:
	#     MapGrid:
	#         TileSize: 24,24
	#         Type: Rectangular
	#         MaximumTileSearchRange: 128
	# That is read by FieldLoader and MapGrid precomputes TilesByDistance up to it
	# (MapGrid.cs:201-215), so the cost is one-off memory: the table holds every CVec inside the
	# radius, which is ~pi*R^2 entries -- 9,857 at the default 56 and 51,471 at 128, so about 400 KB
	# of int pairs. It is shared by every tile search in the mod, which is why it is flagged here for
	# a human rather than changed by a worker adding a weapon.
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
	# 250000 against an arsenal that costs 175000 to buy outright (6000 + 15000 + 32000 + 30000 +
	# 32000 + 60000), leaving 75000 for the viewer to re-buy whichever warhead they want to see
	# again.
	#
	# THIS BLOCK IS ON `Player:`, SO IT FUNDS EVERY PLAYER, AND THAT IS NOW LOAD-BEARING RATHER
	# THAN INCIDENTAL: since 2026-09-21 the Russia map combatant buys and fires the Sarmat (30000)
	# and the Tsar Bomba (60000) from its own Supply Route at 10,10. Russia spends 90000 of its own
	# 250000; USA spends 85000 of its own. Neither seat can be shorted by the other. This USED to read `DefaultCash: 0` with the note "no cash, so nothing can be produced",
	# which was true and is precisely what killed the demo: with the powers BOUGHT rather than
	# charged, no cash means no shots, silently. Nothing else on this map can spend it -- no bot, no
	# starting units (-SpawnStartingUnits), and nothing issues a build order but the demo script.
	PlayerResources:
		DefaultCash: 250000

# =============================================================================================
# THE PURCHASES -- six proxies, six load times cut to 5 ticks each.
# =============================================================================================
# Every shipped support power carries `RequiresPurchase: True`, so a shot must be BOUGHT before it
# can be fired. The full chain is in the header of TestHarness.EnsurePower
# (mods/ww3mod/scripts/test-helpers.lua); the short version is that ChargeInterval is read and
# discarded under that flag and the magazine is the only gate.
#
# THE SHIPPED LOADS ARE 500 TO 4500 TICKS -- the Tsar Bomba alone is 4.5 minutes, longer than this
# whole demo. Those numbers are a PRICE, and the price is not what anyone is here to look at.
#
# THESE SIX ARE ALSO INERT UNDER THE SANDBOX SWITCH, for the same reason the MissileDelays are:
# SupportPowerProductionQueue.GetBuildTime returns 0 outright when SandboxRemovesPurchaseDelay is
# set (SupportPowerProductionQueue.cs:157-163), which it is by default, so a purchase completes on
# the next queue tick whatever this says. Kept for the same reason -- if that default is ever
# flipped, 5 is the number this demo wants.
#
# THE ORDER SCHEDULE NO LONGER EXISTS TO BE PRESERVED. This note used to justify 5 by saying "not
# one tick of the order schedule moved" against a table of absolute capture ticks
# (t=360, t=1100, t=2450, t=3000). That table is gone: demo-nuke-arsenal.lua is event-driven now --
# it buys warhead N, fires it, WATCHES for the detonation, and only then starts the settle before
# warhead N+1 -- so there is no absolute schedule for a build time to shift. A larger value here
# costs the demo wall-clock and nothing else.
power.b61low:
	Buildable:
		BuildDuration: 5

power.b61max:
	Buildable:
		BuildDuration: 5

power.w76:
	Buildable:
		BuildDuration: 5

power.sarmat:
	Buildable:
		BuildDuration: 5

power.b83:
	Buildable:
		BuildDuration: 5

power.tsarbomba:
	Buildable:
		BuildDuration: 5
