Actors:
	# The user's report staged directly: a dry soldier walks off to a supply source, somebody ELSE
	# rearms him on the way, and the errand should end there.
	#
	# Hunter starts dry (AR: InitialAmmo 0 below), so nothing here issues an order -- the shipped
	# traits pick the destination and queue SeekSupplyProvider.
	Hunter: ar
		Owner: USA
		Location: 34,16
		Facing: 768
	# The ERRAND TARGET. 28 cells west, which is inside AutoSeekSupplies' 30-cell
	# ReturnWhenEmptyLeashCells (Chebyshev), so the break-off is dispatched; and its 5c0 push aura
	# is nowhere near the Hunter, so he genuinely has to walk.
	Supply: truk
		Owner: USA
		Location: 6,16
	# The PASSING PROVIDER -- "a supply truck drove by to rearm him".
	#
	# A cache rather than a second truck, and that choice is load-bearing: no RearmActors list
	# anywhere names supplycache (economy.md), so AmmoPool.ChooseResupplier CANNOT pick it as the
	# errand target even though it is much nearer than Supply. It is push-only, which is exactly
	# the "somebody topped me up without my asking" the report is about. A second truck would
	# simply have been chosen as the destination and the scenario would measure nothing.
	#
	# One cell off the walking line so it does not block the path (Building, Footprint x). Its 4c0
	# aura therefore covers the line for x in [23,29]: the Hunter is served at about x=29, five
	# cells into a walk that would otherwise run to x~11.
	Cache: supplycache
		Owner: USA
		Location: 26,17
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 34,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 60,30
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

Rules: rules.yaml
