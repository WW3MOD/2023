MapFormat: 12

RequiresMod: ww3mod

Title: TEST: Aircraft Rearm At A Captured Logistics Centre (auto)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	# A DRY APACHE, 40 cells from the only rearm host on the map.
	#
	# Both its pools start empty (rules.yaml), so there is nothing to shoot with and nothing this
	# airframe can do about it on its own: every AmmoPool.AutoRearm entry point refuses AircraftInfo
	# (AutoRearmIfAllEmpty, AutoRearmIfAnyNotFull, PoiOffensiveBotModule.IsOutOfAmmoSweepCandidate),
	# so no trait dispatches it. ReturnToBase is the ONLY route an aircraft has to a host, which is
	# why the script issues exactly that and nothing else.
	Heli: heli
		Owner: USA
		Location: 50,16
		Facing: 512
	# THE HOST, and the whole point of this scenario. Owned by USA rather than Neutral because
	# ReturnToBase.ChooseResupplier filters on `a.Owner == self.Owner` -- in a real match this is the
	# state after the player has CAPTURED one of the three pre-placed Neutral logistics centres, and
	# a captured LC is the only way an aircraft host ever comes to exist in this mod.
	#
	# It must carry Reservable for this test to mean anything: ChooseResupplier walks
	# ActorsHavingTrait<Reservable>() (ReturnToBase.cs:45-50), so an LC without it is invisible to
	# aircraft no matter what Rearmable.RearmActors says. That trait is the fix under test.
	Depot: logisticscenter
		Owner: USA
		Location: 10,16
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 50,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 60,30
	OwnSR: supplyroute
		Owner: USA
		Location: 60,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

Rules: rules.yaml
