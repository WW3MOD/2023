MapFormat: 12

RequiresMod: ww3mod

Title: TEST: one shot spends the whole band, for the whole side

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# WHAT THIS MEASURES -- two 2026-09-14 rulings that meet in one reading, neither of which the
# sibling scenario test-nuclear-exchange can see because it runs every player on its own side with
# `powers-sandbox` on.
#
#   THE FACTION LOCK -- America holds the American ladder and Russia the Russian one. Asserted as an
#              ABSENCE in the support bin: USA's `Ru9M729Strike` must read `hidden`, and Volga's
#              `B61LowStrike` must read `hidden`, while each faction's own 1 kt warhead reads
#              `ready`. `powers-sandbox` IS DELIBERATELY OFF HERE (see rules.yaml) -- it hands every
#              player all three tiers, which is exactly what would make this assertion vacuous.
#
#   THE BAND    -- firing ANY weapon in a band puts that band on its regeneration timer for the
#              whole SIDE. USA fires its 0.3 kt B61; Volga's 1 kt 9M729 must then read `charging:`.
#              Before the ruling regeneration was per POWER, so the teammate's warhead stayed
#              `ready` and the side fired the 1 kt band twice.
#
# WHY A TEAM, AND WHY A MIXED ONE. After the faction lock a single player holds exactly one warhead
# per band, so a same-side pair in one band only exists across a TEAM -- and the pair is only two
# DIFFERENT weapons if the teammates are different factions. USA + Volga is therefore the smallest
# arrangement in which the ruling is observable at all. It also exercises the part of the
# implementation most likely to be got wrong: NuclearExchange.PutBandOnRegen walks every combatant
# on the firing side, not just the firer.
#
# `Team: 1` / `Team: 2` IS THE SIDE KEY. NuclearExchange.SideKeyFor takes the lobby client's team
# when there is one and falls back to PlayerReference.Team, which is what a map-authored player has
# (ConquestVictoryConditions reads the same two sources). A scenario that left Team unset would get
# three sides from a negative-index fallback, USA and Volga would be opponents, and the central
# reading here would be measuring nothing. Check debug.log's `NUCLEAR EXCHANGE sides:` line first if
# this run fails everywhere at once: it prints every combatant with its side key.
#
# ONLY USA IS `Playable`, AND THAT IS BOTH A REQUIREMENT AND COVERAGE. The requirement:
# `--check-yaml` fails a map with no playable slot outright -- "Error: Found no playable player" --
# which is how the first version of this file was caught. The coverage: PlayerReference.Playable
# defaults to false and NuclearExchange deliberately does NOT test it (a map-authored combatant is a
# side), so leaving Volga and Enemy without the line keeps that open as a live case. Volga in
# particular is a non-Playable player whose warhead the central assertion below reads.
#
# NOTHING IS AIMED AT ANYTHING THAT MATTERS. The exchange arms on the launch order and not on the
# impact, so the aim point is empty ground in the middle of the map, far from all three Supply
# Routes. Their survival is the target-type table rather than the distance: SUPPLYROUTE carries
# `Targetable.TargetTypes: NoAutoTarget`, which no Atomic warhead lists.

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		LockTeam: True
		Team: 1
		Faction: america
		Color: 4488FF
		Enemies: Enemy
		HomeLocation: 6,17
	PlayerReference@Volga:
		Name: Volga
		LockFaction: True
		LockColor: True
		LockTeam: True
		Team: 1
		Faction: russia
		Color: 44FF88
		Enemies: Enemy
		HomeLocation: 6,26
	PlayerReference@Enemy:
		Name: Enemy
		LockFaction: True
		LockColor: True
		LockTeam: True
		Team: 2
		Faction: russia
		Color: FF4444
		Enemies: USA, Volga
		HomeLocation: 58,17

Actors:
	# One Supply Route per combatant so nobody is eliminated before the poller writes a verdict
	# (AUTOTEST.md map.yaml rule 6). Every cell on this map is Clear -- the whole 66x34 grid is
	# template 255 -- so these three locations are terrain-safe by construction, not by survey.
	OwnSR: supplyroute
		Owner: USA
		Location: 6,17
	AllySR: supplyroute
		Owner: Volga
		Location: 6,26
	OpponentSR: supplyroute
		Owner: Enemy
		Location: 58,17

	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 6,17
	SpawnVolga: mpspawn
		Owner: Neutral
		Location: 6,26
	SpawnEnemy: mpspawn
		Owner: Neutral
		Location: 58,17

Rules: rules.yaml
