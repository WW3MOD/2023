MapFormat: 12

RequiresMod: ww3mod

Title: TEST: Dry Launcher Evacuates and Drops the Queued Order (auto)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	# The reported unit, staged exactly as reported: an iskander on its shipped stance, and there is
	# deliberately NO logisticscenter anywhere on this map, for either side.
	#
	# WHICH ARM RUNS CHANGED ON 2026-08-30, so the comment is rewritten rather than left to rot. It
	# used to read "the shipped default InitialResupplyBehavior: Auto (defaults.yaml:375), whose
	# Rearmable names `logisticscenter` alone ... the Auto arm reaches Evacuate". The
	# strategic-launcher ruling removed the iskander's Rearmable entirely and set
	# InitialResupplyBehavior/AI: Evacuate on the actor, so today it is the EVACUATE arm:
	# ChooseResupplier returns null with no RearmableInfo (AmmoPool.RearmCandidates) and it falls
	# straight through to EvacuateForRefund. The Auto arm could no longer reach Evacuate here even in
	# principle -- DecideAutoDisposition returns HoldAndFlag for an actor naming no rearm actors
	# (SupplyHuntMath.cs:269), which is exactly why the stance had to be set explicitly.
	#
	# What this test measures is UNAFFECTED: both arms end at the same EvacuateForRefund, which queues
	# RotateToEdge with QueueActivity(false, ...). The cancellation semantics under test are identical.
	#
	# x=10 puts it 9 cells from the western bound, so the evacuation drive is short.
	Launcher: iskander
		Owner: USA
		Location: 10,16
		Facing: 512
	# NO enemy units anywhere on this map, and that is load-bearing twice over:
	#   * nothing can shoot the Launcher, so Actor.IsDead becoming true can ONLY mean
	#     RotateToEdge disposed it (RotateToEdge.cs:407). That is what makes IsDead a clean
	#     evacuation detector rather than an ambiguous one.
	#   * the Launcher is staged at FULL health, so ChangesHealth@CriticalDamage
	#     (vehicles.yaml:153, StartIfBelow: 50, irreversible) never starts. A vehicle staged
	#     under half health dies on its own clock with nothing shooting it and the verdict would
	#     not say so.
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 10,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 60,30
	# One supplyroute per faction: keeps both alive so faction elimination cannot end the match
	# before the Lua poller writes a verdict. USA's sits WEST, which is also the direction
	# RotateToEdge.FindClosestSpawnAreaForOwner sends the evacuation -- away from the queued
	# move order's destination, so the two dispositions cannot be confused.
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

Rules: rules.yaml
