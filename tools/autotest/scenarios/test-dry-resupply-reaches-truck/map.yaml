	# The user's headline symptom, staged directly: a dry rifleman, a supply truck he is sent to
	# on his own, and an enemy still in weapon range of him. test-queued-attackmove-survives-
	# resupply already stages the first two and passes -- it has NO enemy on the map, which is
	# exactly why it never saw this. The enemy is the whole difference.
	Hunter: ar
		Owner: USA
		Location: 14,16
		Facing: 768
	# 9 cells west, and TRUK's push aura is Range: 5c0 (vehicles.yaml) -- comfortably out of
	# reach, so the truck cannot serve him where he stands. He has to walk, which is the thing
	# being measured. SeekSupplyProvider closes to within 5c (about x=10), and from there the
	# Bait is still ~12c away, inside the AR's 14c0 reach -- so the interrupt is live for the
	# entire trip and cannot be escaped by distance.
	Supply: truk
		Owner: USA
		Location: 5,16
	Bait: e1
		Owner: Russia
		Location: 22,16
