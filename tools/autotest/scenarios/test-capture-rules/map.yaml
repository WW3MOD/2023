MapFormat: 12

RequiresMod: ww3mod

Title: TEST: Capture rules — TECN vs soldier vs neutrals/enemy

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# Verifies the capture rule fixes (260512; wording updated 2026-08-14):
#   1. TECN CAN capture neutral OILB
#   2. TECN CAN capture enemy-owned OILB
#   3. Rifleman (ar) CANNOT target neutral OILB      ← post-fix rule
#   4. Rifleman (ar) CAN target enemy-owned OILB — to CLEAR it to Neutral, not to own it
#   5. Engineer (e6) CANNOT capture anything (no Captures trait)
#   6. TECN CAN capture a NEUTRALISED AFLD   ← the reclaim itself (added 2026-08-14)
#   7. Rifleman CANNOT target a neutralised AFLD
#   8. Rifleman CAN target an ENEMY AFLD     ← the eviction that CREATES a reclaim target
# 6-8 carry the same rules off the money structures onto a non-income building, which is the
# precondition the bot's reclaim pass depends on and was asserted nowhere before.
# These are targeting assertions only (CanCapture reads capture types x relationships,
# never the effect). The clear EFFECT is not asserted anywhere.
Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	# Capturers — USA-owned
	Tecn: tecn.america
		Owner: USA
		Location: 10,16
	Soldier: ar.america
		Owner: USA
		Location: 10,18
	Engineer: e6.america
		Owner: USA
		Location: 10,20

	# Capture targets
	NeutralOilb: oilb
		Owner: Neutral
		Location: 30,16
	EnemyOilb: oilb
		Owner: Russia
		Location: 50,16

	# A NEUTRALISED non-income structure — the state every building in a cleared base is
	# left in once a soldier has walked through it. An airfield specifically, because it is
	# the case the eviction commit calls out by name and because nothing outside the money
	# structures was ever asserted technician-capturable.
	NeutralAfld: afld
		Owner: Neutral
		Location: 30,24

	# The OTHER end of the same rule, and the event that manufactures every reclaim target: a soldier must be
	# able to clear an ENEMY airfield to Neutral. Asserted only for an oil derrick until 2026-08-14, so a
	# ^Defense-style `-Capturable@occupied` landing on ^Building would have left the reclaim feature with an
	# input that never arrives -- silent in play, because "the bot never reclaims" looks identical to "the bot
	# has no reclaim logic".
	EnemyAfld: afld
		Owner: Russia
		Location: 50,24

	# SRs so the engine doesn't eliminate either side at map load
	OwnSR: supplyroute
		Owner: USA
		Location: 3,32
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,32

	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 3,32
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 60,32

Rules: rules.yaml
