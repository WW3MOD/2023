MapFormat: 12

RequiresMod: ww3mod

Title: TEST: Tunguska fires one 9M311 per kill

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	# Empty arena. Every combatant is spawned from Lua so each ladder rung gets a
	# FRESH Tunguska -- reusing one across rungs would carry its 8-missile
	# secondary pool (vehicles-russia.yaml:906) forward, and in the RED direction
	# (two missiles per rung) that pool runs dry partway down the ladder.
	#
	# One Supply Route per side so neither faction can be eliminated while the
	# script is between rungs with no units alive; mission-end would
	# short-circuit the poller and leave no result file.
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 8,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 56,16

Rules: rules.yaml
