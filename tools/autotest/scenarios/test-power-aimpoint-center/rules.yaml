# Aim-point snap autotest overrides — the ON half of the pair.
#
# DELIBERATELY MINIMAL, and in particular SnapToActorCenter IS NOT SET HERE. Its shipped default is
# true, and this scenario exists to measure the shipped default; writing it out would turn a
# regression test into a test of this file. Its sibling test-power-aimpoint-unsnapped sets it false,
# and that one line is the entire difference between the two scenarios' rules.

Player:
	# TWO SHOTS ARE FIRED IN ONE RUN, so the RE-load matters as much as the first: one purchase is
	# one shot (SupportPowerInstance.Activate calls bank.Consume), and the script buys again between
	# them.
	# `MissileStrikePower@Kinzhal: ChargeInterval: 1 / StartFullyCharged: true` USED TO SIT HERE AND
	# DID NOTHING -- see the note on power.kinzhal at the bottom of this file. Both shots are bought.
	# Faction elimination would end the match before the Lua poller writes a verdict. Both Logistics
	# Centers may well die in this run, and USA owns nothing else but its Supply Route.
	-ConquestVictoryConditions:
	# Fog off and the map pre-explored, so the poller's view of the missiles and the victims is never
	# a visibility artefact.
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
	# No cash -> no production, so GetActorsByType("kinzhalmissile") cannot pick up a missile from
	# anywhere but the two shots this scenario fires.
	# 20000 -- 5000 apiece for the two shots this scenario fires, with slack. This USED to read
	# `DefaultCash: 0`, and that is exactly what killed the run: with the power BOUGHT rather than
	# charged, no cash means no shot, forever and silently. The property the old note claimed --
	# that `GetActorsByType("kinzhalmissile")` cannot pick up a missile from anywhere but these two
	# shots -- still holds: nothing else on this map spends money and there is no bot.
	PlayerResources:
		DefaultCash: 20000

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	# Removed so Player.HomeLocation falls back to the pinned PlayerReference value rather than a
	# spawn assignment — see the geometry note in map.yaml.
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-power-aimpoint-center.lua

# THE PURCHASE, TWICE. Every shipped support power carries `RequiresPurchase: True`, so a shot has
# to be BOUGHT before it can be fired, and ONE PURCHASE IS ONE SHOT -- SupportPowerInstance.Activate
# calls bank.Consume, so this scenario's two orders are two purchases. ChargeInterval and
# StartFullyCharged are read and discarded under that flag (SupportPowerManager.cs:228-229); the
# whole chain is in the header of TestHarness.EnsurePower, mods/ww3mod/scripts/test-helpers.lua.
#
# 5 ticks instead of the shipped 500 (30 s): the load time is a PRICE and this scenario measures
# where a warhead lands, not the shop. Every tolerance in the Lua is anchored to the tick its own
# order issues rather than to t=0, so the ~12 ticks before the first shot and the ~7 before the
# second are free.
power.kinzhal:
	Buildable:
		BuildDuration: 5
