Title: DEMO: local light events - seven envelopes, two emitters, one dark map

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# WHAT THIS IS FOR: looking at. It is a DEMO, so nothing here is asserted - no AssertWithin, no
# Test.Pass, no result.json.
#
# The subject is the GENERIC local-light system, not any one light. Seven different envelopes fire in
# sequence at seven spaced-out positions, all written in one vocabulary (LightEventDefinition) and
# reached through two different emitters - an actor trait six times, a weapon warhead once. See
# rules.yaml for the envelopes and demo-light-events.lua for the schedule.
#
# THE MAP IS DARK ON PURPOSE. rules.yaml sets the world's TerrainLighting to Intensity 0.28 with a cool
# tint, which puts the ambient at about (0.24, 0.25, 0.32). At the mod's shipped Intensity 1 every
# sprite is already at full brightness and a light event would be invisible, so a demo run at daylight
# would prove nothing. That override is the only thing this scenario changes about the ambient.
#
# THE LAYOUT is a row of five sites along y=16 at x = 8, 20, 32, 44 and 56, plus two off-row: a looping
# flicker at 32,5 and the wide ceiling probe at 32,26. Every site on the row carries the same props -
# two guard towers, two Abrams, four infantry and two trees - so the only variable between one site and
# the next is the envelope lighting it. Structures and vehicles are tall and catch a light differently
# from the flat ground under them, which is the point: TerrainLighting has TWO consumers and they take
# completely different code paths (SpriteRenderable per sprite per frame; TerrainSpriteLayer via dirty
# vertex rows), and both have to look right.
#
# Everything is Neutral and HoldFire. Nothing on this map moves or shoots; the only thing that changes
# between frames is light.
#
# The terrain is demo-heli-weapons', copied unchanged - 2036 of 2048 playable cells are passable for
# every locomotor, so actor placement is unconstrained.

