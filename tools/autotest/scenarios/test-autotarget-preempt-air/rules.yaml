Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-autotarget-preempt-air.lua

# NOTE: PreemptScanInterval is deliberately NOT set here — the test must exercise
# the value that ships in rules/defaults.yaml. Setting it to 0 here is the way to
# reproduce the original RED.
#
# WHAT THE RED CONTROL NOW PROVES, and what it did not before. Pinning this to 0
# disables BOTH preemption phases: TickPreemption returns early on PreemptionDue, and
# the yield inside ScanForTarget's override loop is gated on the same predicate. What it
# does NOT disable is the unaided re-acquisition — the attack activity lapses,
# AttackFollow.cs:176 wipes opportunityTargetIsPersistentTarget, and the next free
# ChooseTarget finds the helicopter anyway. That is why the control PASSED on 2026-08-12
# against an outcome-only assertion. The test now asserts attribution via
# Test.GetUncommittedScanCount, which counts exactly the uncommitted scans that unaided
# route requires and preemption never produces, so the control fails on the attribution
# clause even when the helicopter does get shot.
#
# PITFALL, learned while running that control on 2026-08-12: pin it on the ACTOR, not
# on ^Combatant. strykershorad lists Inherits@AutoTarget: ^AutoTargetAAIFV AFTER
# Inherits@Combatant, and that chain reaches ^AutoTargetGround's PreemptScanInterval: 25,
# so a ^Combatant override loses the merge and the "control" quietly runs the shipped
# value instead. A control that never applied is indistinguishable from a fix that does
# nothing — which is how this test has produced false greens before. Uncomment:
#
# strykershorad:
# 	AutoTarget:
# 		PreemptScanInterval: 0
^Combatant:
	AutoTarget:
		ScanRadius: 30
		InitialStance: FireAtWill
		InitialStanceAI: FireAtWill
		InitialEngagementStance: Defensive
		InitialEngagementStanceAI: Defensive
		MinimumScanTimeInterval: 16
		MaximumScanTimeInterval: 32
