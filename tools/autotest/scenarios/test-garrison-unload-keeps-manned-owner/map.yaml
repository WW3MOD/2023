Actors:
	# Starts NEUTRAL so DynamicOwnership flips it to USA on the first boarding — which is also the
	# setup proof that a man got in, and is not confounded by the IsDead ambiguity a Cargo passenger
	# carries. v09 is 1x1 (civilian.yaml:400) so ten men converge on one cell and nobody blocks.
	House: v09
		Owner: Neutral
		Location: 20,12
	# TEN, deliberately: ^CivBuilding is MaxWeight: 10 with 8 firing ports (civilian.yaml:61, :79-119).
	# Deploying to a port REMOVES a man from the Cargo hold, so the hold keeps making room and all ten
	# board. The end state this scenario needs is "some at ports, the rest in the hold" — which is the
	# ordinary steady state of a garrison under fire, not a contrived one.
	Man0: e1
		Owner: USA
		Location: 19,11
