Title: TEST: Crew dismount from the rear and fan out (auto)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# Terrain is the flat, empty plate copied from test-crew-instakill: no obstacles anywhere near the
# tank, so a crew member's walk-away leg is a straight line and his final cell is the one the fan
# chose rather than one a detour happened to reach. That matters here more than in most scenarios,
# because the whole assertion is positional.
#
# GEOMETRY THE ASSERTION DEPENDS ON. Facing: 0 is NORTH (WAngle is counterclockwise — 0 N, 256 W,
# 512 S, 768 E; DOCS/reference/conventions.md). The rear of a north-facing hull therefore points
# SOUTH, which in OpenRA screen space (north = -Y) is +Y. So "behind the tank" is exactly
# "Location.Y >= 16", and the fan's ±90 degree bound means no crew member may ever finish north of
# the hull. The tank sits at 33,16 with 16 clear cells of map south of it, far more than the 2-3
# cell walk needs.

