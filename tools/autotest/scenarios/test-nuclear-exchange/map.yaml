		Location: 6,17
	OpponentSR: supplyroute
		Owner: Russia
		Location: 58,17

	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 6,17
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 58,17

Rules: rules.yaml
