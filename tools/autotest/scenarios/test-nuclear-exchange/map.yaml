MapFormat: 12

RequiresMod: ww3mod

Title: TEST: firing raises the enemy's level and puts your whole side on cooldown

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# WHAT THIS MEASURES: the three edges of the 2026-09-15 nuclear exchange ruling (decision 03, spec
# 02) that nothing else in the tree can see, all read off the SUPPORT POWER BIN rather than off any
# new binding.
#
#   RATCHET  -- USA fires 1 kt; Russia's 20 kt power must become READY, and USA's own 20 kt power
#               must NOT. Under decision 06's shared pressure ladder both would have opened
#               together, so this single pair of readings is what separates the two models.
#   COOLDOWN -- firing silences the firer's WHOLE SIDE, at every band, not the band it fired from.
#               Under v1 a 1 kt shot left 20/50/100 kt loaded, which is the "too many nukes in
#               flight" the user ruled against after a real match.
#   THE TWO GATES ARE SEPARATE -- a side escalated WHILE RELOADING gets the new band DRAWN and NOT
#               FIREABLE. Being shot at while you reload is the normal case in this model, and the
#               natural implementation of a level rise (make the new bands ready) opens a free shot
#               the cooldown was meant to deny. Phases D and G2 are that assertion, at the bottom
#               of the ladder and at the top, where two different code paths do the arming.
#
# WHY THE BIN AND NOT A TRAIT READ. Test.GetSupportPowerState reads SupportPowerInstance.Disabled,
# which is the same predicate SupportPowersWidget filters its icon list on
# (SupportPowersWidget.cs:136) — so 'ready' here means a player would see a cameo they could click,
# which is the thing the ruling is actually about. It also folds in the half of the feature a state
# read would miss: every nuclear power in the mod is RequiresPurchase, so a band that is merely
# PERMITTED is a shop entry and a bill. 'ready' means the exchange handed over a loaded warhead.
#
# THE COOLDOWNS ARE COMPRESSED IN rules.yaml (300/320/340/360 against a shipped 5000/7000/9000/
# 12000) and the four are kept DISTINCT on purpose — see that file's note. The SHIPPED defaults are
# pinned by NuclearExchangeStateTest.TheShippedCooldownsAreTheUsersRuling, not here.
#
# THE MATCH STARTS AT DEFCON 1 with a 10-tick first-warheads delay, because the release gate is not
# what is under test here and ten real minutes of DEFCON 3 would be ten minutes of nothing.
#
# NO VICTIM ACTOR AND NOTHING IS AIMED AT ANYTHING THAT MATTERS. The exchange escalates the other
# side "wherever it lands" — there is no damage attribution in this model, which is exactly what
# decision 01 rejected from decision 14 and which v2 keeps — so the aim point is deliberately empty
# ground. A scenario that shot something would be asserting a rule this model does not have.
#
# FIVE WARHEADS LAND ON THIS MAP, where the v1 version of this scenario fired one. Both Supply
# Routes still survive all five, for the target-type reason below rather than for distance.
#
# BOTH SUPPLY ROUTES SURVIVE whatever lands, and that is the target-type table rather than the
# distance: SUPPLYROUTE carries `Targetable.TargetTypes: NoAutoTarget`, which no Atomic warhead
# lists. Do NOT "fix" a future version of this by moving them further apart.

# RUSSIA IS DELIBERATELY NOT `Playable`, AND THAT IS NOW COVERAGE RATHER THAN AN OVERSIGHT.
# PlayerReference.Playable defaults to FALSE (`PlayerReference.cs:24`), and the first version of
# NuclearExchange required it before treating a player as a side -- so the first run of this
# scenario registered ONE side, logged "NUCLEAR RELEASE: all 1 sides", and left every Russian
# nuclear power dark for the whole match while DefconWall, reading the same players with the
# shipped combatant predicate, logged "derived from 2 home(s) in 2 group(s)" on the same tick.
# Leaving the line off keeps a map-authored combatant in the tree as a live case. DO NOT ADD IT.

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
		HomeLocation: 6,17
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA
		HomeLocation: 58,17

Actors:
