MapFormat: 12

RequiresMod: ww3mod

Title: TEST: Queued AttackMove Survives Resupply (auto)

Author: WW3MOD test harness

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	# Hunter starts with an empty magazine (rules.yaml) and a supply truck 4 cells WEST. The truck's
	# direction matters: every resupply route ends at or back near the truck, so only the queued
	# attack-move can carry the man EAST past the assertion line. Nothing else on the map can.
	Hunter: ar
		Owner: USA
		Location: 12,16
		Facing: 768
	Supply: truk
		Owner: USA
		Location: 8,16
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 12,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 54,16
	# No enemy units: this test is about whether the ORDER survives, not about engaging. One SR per
	# faction per AUTOTEST.md, which is also what keeps Russia alive with no units of its own.
	OwnSR: supplyroute
		Owner: USA
		Location: 4,4
	OpponentSR: supplyroute
		Owner: Russia
		Location: 60,30

Rules: rules.yaml
