# Residual-B1 regression, executor in ISOLATION (one human-owned AR, no bot module).
#   Zone A (x=10..16, treeline y=16): the Rifle spawns 4 cells SOUTH of the treeline (13,21) with an
#     enemy sighted further south. The executor (Defensive) relocates it NORTH to the south cover edge
#     (13,17) — a 4-cell adjustment, ~164 ticks, the recorded trigger window. WHILE that adjustment is
#     in flight (State == Adjusting) the Lua injects a scripted single-unit Move ~9 cells EAST to zone B.
#   Zone B (x=22, no cover, no enemy): the redirect target. With the FIX the executor detects — mid-move,
#     in ITick — that the unit has left the leash+margin band around the zone-A anchor, aborts the stale
#     adjust and CLEARS the cohesion slot, so on arrival at B nothing drags the Rifle back. With the BUG
#     the Adjusting-time ITick guard skips, the slot stays pointed at (13,17), and CohesionSlotMemory's
#     return-to-slot walks the Rifle ~9 cells back west to the abandoned cover cell ONCE. The redirect is
#     kept short enough (~9 cells ≈ 450 ticks) that the round trip finishes inside ForgetAfterTicks(750),
#     so the slot stays FRESH — this is the non-self-healing window the residual bug lives in.
