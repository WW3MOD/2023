World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	# Strip per-type persisted stance overrides so the human AR is deterministically Defensive
	# (its YAML default) regardless of this machine's saved unit defaults — otherwise a locally
	# saved AR default (Hunt / HoldPosition) would silently change the executor's behavior.
	-UnitDefaultsManager:
	LuaScript:
		Scripts: test-helpers.lua, test-stance-redirect-midadjust.lua

# The sighted enemy exists only to give the threat layer a bearing; the Rifle must never shoot at or
# chase it, because the executor evaluates in TickIdle only (S5). Dropping the auto-targetable types
# (leaving the inert NoAutoTarget marker) means no AutoTargetPriority ValidTargets list matches it,
# so no attack activity is ever queued — the supplyroute idiom from DOCS/recipes/AUTOTEST.md. The t90
# keeps its AttackBase/AutoTarget traits, so SightingThreatLayer still counts it as an armed contact
# (SightingThreatLayer.cs:201) and the threat bearing is unchanged.
t90:
	Targetable:
		TargetTypes: NoAutoTarget

# RESTORES THE HUMAN ENABLEMENT THIS TEST DEPENDS ON. GrantConditionOnHumanOwner@tacpos was deleted
# from ^Combatant in mods/ww3mod/rules/defaults.yaml on 2026-08-30 to stop the cover shuffle for human
# players, and `enable-tactical-positioning` left the executor's gate at the same time (leaving a token
# in the gate with no granter anywhere is a CheckConditions ERROR, not a warning). This scenario
# exercises the executor itself — which still ships for experimental bots — on a human-owned unit, so
# it re-adds BOTH halves locally: the token in the gate, and the granter that satisfies it. Granting
# `enable-ai-experimental` instead would be wrong; that token also drives ClusterTargetingCondition
# (defaults.yaml:454,472) and would change artillery behaviour alongside the executor.
^Combatant:
	StancePositioningExecutor:
		RequiresCondition: enable-tactical-positioning || enable-ai-experimental
	GrantConditionOnHumanOwner@tacpos:
		Condition: enable-tactical-positioning
