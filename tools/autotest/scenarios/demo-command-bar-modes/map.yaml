MapFormat: 12

RequiresMod: ww3mod

Title: DEMO: command bar held-mode glyph highlight

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# Same staging as demo-command-bar-reflow, and for the same reason: infantry satisfy
# both Passenger (AUTO_ENTER) and IMove (PATROL), so the right-hand command panel comes
# up with live buttons instead of greyed ones. That matters more here than there -- a
# greyed button draws its `-disabled` glyph regardless of highlight state, so if PATROL
# and AUTO_ENTER were dead the discriminating shot would show two grey glyphs and look
# exactly like an inert change. The APC gives AUTO_ENTER a real transport to point at.

