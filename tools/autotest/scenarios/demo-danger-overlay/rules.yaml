Player:
	-ConquestVictoryConditions:
	MapLayers:
		# Fog ON is essential: the §3a layer and the overlay are fog-respecting.
		# Explored ON so the enemy frozen structures ghost immediately (=> GPS dots).
		FogCheckboxEnabled: true
		ExploredMapCheckboxEnabled: true

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, demo-danger-overlay.lua

^Combatant:
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: HoldFire
		InitialEngagementStance: HoldPosition
		InitialEngagementStanceAI: HoldPosition
