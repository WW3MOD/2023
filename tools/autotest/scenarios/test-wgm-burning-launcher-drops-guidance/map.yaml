Actors:
	# Two independent lanes, fired STRICTLY SEQUENTIALLY so the MissileTrace record
	# order is deterministic: record 1 is the control, record 2 is the test.
	#
	# Lane separation is load-bearing. Bradley<->own-target is 22 cells, inside WGM's
	# 25c range and outside the 25mm's 20c, so only the WGM can reach — the same
	# isolation test-wgm-target-dies-midflight relies on. Bradley<->OTHER lane's target
	# is sqrt(22^2 + 18^2) = 28.4 cells, outside WGM range, so neither Bradley can
	# acquire across lanes and the operator-retarget path cannot quietly rescue the
	# test missile by swinging it onto the control lane.
	#
	# One Supply Route per side, parked mid-map away from both lanes: required so
	# neither faction is eliminated mid-run (that ends the match in Mission
	# Accomplished and the Lua poller never returns a verdict). SR carries
	# Targetable.TargetTypes=NoAutoTarget so it cannot become a retarget candidate.
	# Always include one SR per active faction in test maps — see DOCS/recipes/AUTOTEST.md.
	OwnSR: supplyroute
		Owner: USA
		Location: 3,17
	OpponentSR: supplyroute
		Owner: Russia
		Location: 62,17
