MapFormat: 12

RequiresMod: ww3mod

Title: TEST: tactical nuke arrives on the player's own bearing and levels the aim point

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 1,1,64,32

Visibility: MissionSelector

Categories: Test

# WHAT THIS MEASURES: that the tactical nuclear strike, once the host has switched it ON in the
# lobby, actually delivers. Its sibling test-tacnuke-lobby-gated-off asserts the other half — that
# with the lobby option at its shipped default the power is not in the bin at all. The two are
# separate scenarios rather than one because they need OPPOSITE lobby state, which is a rules-level
# fact fixed before the first tick, not something a script can toggle mid-run.
#
# THE ONE OVERRIDE THAT MATTERS is in rules.yaml: `PowersLobbyOptions: TacticalNukeCheckboxEnabled:
# true` + `Locked: true`. That is the same lever the shipped Kinzhal scenario already uses for
# MapLayers' explored/fog checkboxes, so the mechanism is precedented rather than novel here.
#
# WHY THE VICTIM IS A t90 AND NOT A BUILDING. This scenario is about DELIVERY, not about warhead
# shape — the Atomic warhead is reused unchanged from mslo's NukePower and was not written by this
# work. A tank is the cleanest possible read on "the warhead went off where it was aimed": Atomic's
# ThermalVaporize alone is 200,000 at Spread 2c768 against a t90's 24,000 HP, so arrival means death
# and non-arrival means a live tank, with no ambiguous middle. (Spread was 3c0 until the 2026-09-06
# yield rebuild shrank every Atomic radius to what 20 kt actually produces. The victim sits AT the
# aim point, so nothing asserted here depends on that number.)
#
# THE BLAST IS STILL LARGE AND THE MAP IS SMALL, so placement is constrained rather than free:
# Warhead@BlastWave has MaxRadius 15c0 and its outermost suppression band reaches 17c0. On a 64x32
# playfield essentially everything is inside it.
# That is fine for what is asserted — `-ConquestVictoryConditions` in rules.yaml stops an
# elimination from ending the match early, and SUPPLYROUTE carries
# `Targetable.TargetTypes: NoAutoTarget`, which no Atomic warhead lists, so both Supply Routes are
# untouched however close the detonation lands. Do NOT "fix" a future version of this by moving the
# Supply Routes further away: the reason they survive is the target-type table, not the distance.
#
# GEOMETRY. REWRITTEN 2026-09-07: engine b69681d2 replaced the spawn rule, and the
# ChooseClosestEdgeCell derivation that stood here is DEAD. Recorded in one line so nobody rebuilds
# it: Map.ChooseClosestEdgeCell(home 6,17) resolved to the west edge cell 1,17.
#
#   THE SHIPPED RULE (MissileStrikeApproach.cs):
#     entry    = aimPoint - unit(home -> salvoCentroid) * standoff
#     standoff = mapDiagonal + ApproachMargin = sqrt(66^2 + 34^2) + 16 = 90.2 cells
#   The bearing runs from the launching player's OWN position toward what they aimed at, so the
#   player chooses WHERE the warhead lands and never WHICH WAY it arrives -- the property the old
#   map-edge rule protected, kept by other means. The spawn is deliberately well off-map.
#
#   Russia HomeLocation 6,17; victim at 40,17, axis 34 cells; entry cell -50,17, which is 56.2
#   cells BEHIND home on the home->victim ray. A live run on 2026-09-07 reported -49,17 -- that
#   spawn plus one tick of flight.
#   Flight: the whole 90.2-cell standoff = 92408 wdist at Speed 900 -> ~100 ticks, measured 96,
#   against 44 before. It is now the SAME length wherever the player aims, which is the deliberate
#   balance change in b69681d2.
#
#   HOME, VICTIM AND ENTRY ARE ALL ON ROW 17, so on this map the bearing reading cannot separate
#   the shipped rule from any other eastward one; what fails the old edge-cell rule here is the
#   DISTANCE, by 51 cells. test-missile-strike-power carries the sharp bearing test.
#
# WHY RUSSIA FIRES rather than America: nothing about the power requires it — MissileStrikePower
# @TacNuke carries NO Prerequisites, because §1's table lists this entry's faction as "both", and
# that absence is itself worth exercising. Russia was picked so that a run of this scenario and a
# run of test-gbu57-asymmetry between them prove the unlocked power works from a faction that is
# NOT the one the other new power is locked to.
#
# WHY MapStartingLocations IS REMOVED IN rules.yaml: Russia is the playable client player, so
# Player.HomeLocation would otherwise come from a spawn assigner (Player.cs:182) and the edge
# derivation above would depend on which mpspawn it picked.

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@Russia:
		Name: Russia
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA
		HomeLocation: 6,17
	PlayerReference@USA:
		Name: USA
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
		HomeLocation: 58,17

Actors:
	# One Supply Route per side so neither faction is eliminated before the poller writes a verdict
	# (AUTOTEST.md map.yaml rule 6). Both are inside the 30-cell blast and both survive it, for the
	# target-type reason in the header.
	OwnSR: supplyroute
		Owner: Russia
		Location: 6,17
	OpponentSR: supplyroute
		Owner: USA
		Location: 58,17

	# THE VICTIM. t90: 24,000 HP, Heavy armour, Thickness 280 (vehicles-russia.yaml:289). Atomic's
	# ThermalVaporize is 200,000 at Penetration 5000, so this is a binary read.
	Victim: t90
		Owner: USA
		Location: 40,17
		Facing: 256

	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 6,17
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 58,17

Rules: rules.yaml
