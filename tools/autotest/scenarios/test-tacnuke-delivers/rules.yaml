# Tactical nuclear strike delivery autotest overrides.

World:
	# THE OVERRIDE THIS SCENARIO IS BUILT AROUND, AND SINCE 2026-09-15 IT IS THE ONLY ONE. The
	# tactical nuke is EVENT TIER (`Prerequisites: powers.event`, player.yaml) and powers.event is
	# provided by NO faction -- only by the three unfiltered ProvidesPrerequisite traits gated on
	# `!powers-sandbox-disabled`. Without sandbox the power is never Permitted, so it is absent from
	# the buy tab, the purchase below is refused and the run fails at the very first assertion.
	# Locked so no lobby default, host setting or saved session can move it out from under the run.
	#
	# `TacticalNukeCheckboxEnabled: true` + `Locked: true` USED TO SIT HERE TOO and was described as
	# the override this scenario was built around. That checkbox was RETIRED on 2026-09-15: it gated
	# this one power and nothing else, and since the power is event tier the checkbox only ever
	# decided anything inside the sandbox -- where a host had to tick two boxes to reach one weapon.
	# Its removal cannot make this scenario pass on a broken build: the gate it used to open is now
	# permanently open, so everything this file asserts is decided by the tier above and by the
	# missile itself. Its sibling test-tacnuke-lobby-gated-off, which existed to measure that
	# checkbox at its shipped default, was deleted in the same change.
	PowersLobbyOptions:
		PowersSandboxCheckboxEnabled: true
		PowersSandboxCheckboxLocked: true
		# AND THE ONE PIECE OF SANDBOX THIS SCENARIO MUST OPT OUT OF, 2026-09-08. Sandbox now
		# zeroes MissileStrikePower's MissileDelay as well as the purchase wait, which is the
		# point of the option -- but assertion 6 below is precisely that the shipped MissileDelay
		# of 500 IS applied, and it is the only guard in the tree against that value being
		# dropped or routed around SpawnActorEffect. With the flag left at its default the run
		# would measure ~0 and fail on correct behaviour, and turning the assertion off instead
		# would retire the guard. So the scenario keeps the launch delay and keeps sandbox's
		# other half, which is the half it actually needs (powers.event, above).
		SandboxRemovesLaunchDelay: false
	-StartGameNotification:
	-SpawnStartingUnits:
	# Removed so Player.HomeLocation falls back to the pinned PlayerReference value rather than a
	# spawn assignment -- see the geometry note in map.yaml.
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-tacnuke-delivers.lua

Player:
	# `MissileStrikePower@TacNuke: ChargeInterval: 1 / StartFullyCharged: true` USED TO SIT HERE AND
	# DID NOTHING. SupportPowerInstance's constructor forces TotalTicks and remainingSubTicks to 0
	# whenever RequiresPurchase is set (SupportPowerManager.cs:228-229), so both were read and
	# discarded, the power stayed at zero charges -- Disabled, therefore not Ready -- and
	# Test.ActivateSupportPower returned 'not-ready:0' for the whole 900-tick budget. This scenario
	# has been unable to fire since the power became purchasable. DO NOT PUT THEM BACK: the shot is
	# BOUGHT now, through the same Powers queue a player uses. See power.tacnuke at the bottom of
	# this file, and the header of TestHarness.EnsurePower for the whole chain.
	# The 30-cell blast will kill everything USA owns except its Supply Route; without this the
	# match would end on elimination before the poller writes a verdict.
	-ConquestVictoryConditions:
	# Fog off and the map pre-explored, so the poller's view of the missile and the victim is never
	# a visibility artefact. The power's own 20c0 CameraRange is irrelevant under this and is
	# deliberately not exercised -- it reveals shroud, and there is none.
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
	# 20000 against the nuke's 15000 price -- enough for exactly one, which is what this scenario
	# fires. This USED to read `DefaultCash: 0` with the note "no cash -> no production, so
	# GetActorsByType('tacnukemissile') cannot pick up a second missile from anywhere". The
	# second-missile property still holds and is now stronger, not weaker: one purchase buys ONE
	# shot (SupportPowerInstance.Activate calls bank.Consume), and 20000 credits cannot buy a
	# second. Nothing else on this map spends money -- no bot, no starting units.
	PlayerResources:
		DefaultCash: 20000

# THE PURCHASE. 5 ticks instead of the shipped 1500 (90 s): the load time is a price and this
# scenario measures the missile, not the shop. Every tolerance in the Lua is anchored to the tick
# the ORDER issues, not to t=0, so shifting the order later by the purchase costs nothing -- and
# the 900-tick budget has room for both.
power.tacnuke:
	Buildable:
		BuildDuration: 5
