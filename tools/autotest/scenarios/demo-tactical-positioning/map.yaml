MapFormat: 12

RequiresMod: ww3mod

Title: DEMO: tactical positioning — cover-seek, threat response, opt-out freeze

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 66,34

Bounds: 0,0,66,34

Visibility: MissionSelector

Categories: Test

# Phase-3 StancePositioningExecutor, staged to be PLAYED (no verdict). Three zones on one map, all
# USA (human) infantry so the ONLY thing that can move an idle unit is the executor (auto-enabled via
# GrantConditionOnHumanOwner). Same treeline+sighted-enemy geometry as test-stance-positioning.
#   ZONE A (left, top)    cover-seek: Defensive ARs south of a treeline with an enemy sighted further
#                         south → they walk NORTH to the threat-facing (south) cover edge and hold.
#   ZONE B (right)        threat response: Defensive ARs sit idle with NO nearby threat; a scripted
#                         enemy probe approaches from the south → once inside scan range they take the
#                         cover edge facing it. The probe loops (approach → retreat) so it repeats.
#   ZONE C (left, bottom) opt-out freeze: same geometry as A, but the group is opted out — three ARs
#                         on HoldPosition + one Defensive AR carrying the `deployed` condition → none
#                         of them ever reposition.
