# RU-vs-RU mirror for the faction parity audit (WORKSPACE/balance/260802-parity-audit.md §6).
# Purpose: same noise-floor / side-bias baseline as tournament-parity-mirror-us but with
# the Russia roster and RU AI profile, so faction-specific harness effects (e.g. the RU
# attack-heli-heavy bot fleet, A1 in the audit) show up in the baseline rather than being
# misread as cross-faction imbalance.
#
# Terrain, SR/spawn placement, and player layout cloned from
# tournament-arena-skirmish-2p; only names/factions differ.
