Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-aa-overkill-cadence.lua

AA:
	AutoTarget:
		ScanRadius: 30
		InitialStance: FireAtWill
		InitialEngagementStance: Defensive
	# Ample ammo: a shooter that runs dry stops engaging and its neighbours are
	# freed for a reason that has nothing to do with the mark, which would look
	# exactly like the result this test is trying to measure.
	AmmoPool@1:
		Ammo: 30

# The RangeLimit cut that makes a multi-cycle fight possible lives in
# weapons.yaml, where weapon overrides belong. It is explained in full there,
# including why it REPLACED the old payload split on 2026-08-20.

# Stock 600 HP is required -- it is what makes the mark reach 100, i.e. exactly
# OverkillThreshold. Raising it would put the claim UNDER the threshold and
# switch the mechanism off entirely. Nothing damages the aircraft now (missiles
# expire ~16 cells short), but these two stay removed anyway: a descending or
# crashing aircraft would move the geometry underneath the measurement.

HALO:
	-HeliEmergencyLanding:
	-ChangesHealth@CrashBurn:
