# =====================================================================
# 2026-08-20: THIS FILE'S PREVIOUS MECHANISM WAS DEAD AND THE SCENARIO HAD
# BEEN MEASURING NOTHING SINCE 2026-08-12.
#
# It used to split the MANPAD payload into a real Air warhead (Damage 20) and
# a Ground warhead (Damage 3000) that the damage path would refuse to apply to
# an airborne target but that EstimatePercentDamage would count anyway, on the
# stated grounds that the estimate "does NOT check ValidTargets at all". That
# was true when it was written and stopped being true the same week: afa18718
# added
#     if (!warhead.IsValidAgainst(target.Actor, attacker)) continue;
# to the estimate's warhead walk (AutoTarget.cs:1623), which is exactly the
# over-count that split was exploiting.
#
# Arithmetic after that commit: the Ground warhead is skipped, the estimate
# collapses from 3020 to 20, and the mark against a 600-HP Halo becomes
# 20 * 100 / 600 = 3 -- against an OverkillThreshold of 100. Suppression is
# simply OFF. The scenario would have shown all four AA firing promptly and
# read as "re-marking does not sustain suppression", which is the precise
# false-green shape this file's own PITFALL block used to warn about. It was
# never re-run after afa18718, so nobody saw it.
#
# THE REPLACEMENT DOES NOT DEPEND ON ANY ESTIMATE/DAMAGE DIVERGENCE.
# Only the projectile's RangeLimit is cut, 24c0 -> 4c0. Missiles launch, fly
# four cells and expire ~16 cells short of a target 20 cells away, so no damage
# is ever dealt and the helicopter survives indefinitely -- which is strictly
# better for a cadence measurement than the twelve hits the old split bought.
# The warheads are untouched, so the estimate is the SHIPPED arithmetic:
# 3000 damage, Penetration 15 vs the Halo's Armor Thickness 3 (^Airborne,
# aircraft.yaml:22-23), no Versus table, min(3000 * 100 / 600, 100) = 100,
# i.e. exactly OverkillThreshold. The scenario now exercises the real claim
# rather than a 503-point reconstruction of it.
#
# NOTE for anyone reading the older commentary in this scenario: it states the
# Halo's Thickness as 10. The value on ^Airborne at HEAD is 3. The conclusion
# is unaffected -- Penetration 15 exceeds both, so no armour reduction applies
# either way -- but do not carry the 10 forward.
#
# The same reasoning, at greater length, is in the sibling scenario
# test-aa-battery-volleys/weapons.yaml, which is the ASSERTING test for this
# behaviour. This one remains a pure diagnostic and cannot fail on it.
#
# STATUS: COMMITTED UNRUN. The repair is derived from source, not measured --
# see the entry in WORKSPACE/bugs/discovered.md.
#
# PITFALL: weapon overrides belong in the map's `Weapons:` file, NOT in
# `Rules:`. In rules.yaml the loader reads MANPAD as an ACTOR and its children
# as traits, failing with "Cannot locate type: WarheadInfo" and hanging the
# test until the 300s runner timeout.
#
# PITFALL, and it voided an earlier run of this scenario: overriding a
# composite node REPLACES it rather than merging into it, so every field the
# override omits reverts to the ENGINE default -- not to the mod's value. Every
# child of Projectile is therefore restated below verbatim from
# rules/weapons/weapons-missiles.yaml:479-495, with RangeLimit the only edit.
# Dropping MaximumLaunchAngle alone would be enough to break this: the engine
# default sends a launch pitch below the horizon on a weapon that only shoots
# upward.
# =====================================================================

MANPAD:
	Projectile: Missile
		MaximumLaunchSpeed: 20
		MaximumLaunchAngle: 252
		Acceleration: 25
		Speed: 450
		Inaccuracy: 256
		CloseEnough: 192
		# THE EDIT. 24c0 -> 4c0.
		RangeLimit: 4c0
		HorizontalRateOfTurn: 20
		Arm: 5
		Blockable: false
		ExplodeWhenEmpty: true
		Image: dragon
		TrailImage: smokey
		TrailScalePercent: 50
		ContrailLength: 40
		ContrailStartWidth: 8
