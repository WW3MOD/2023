MapFormat: 12

RequiresMod: ww3mod

Title: TEST: DEFCON 3 dividing wall — no aircraft crosses the line

Author: WW3MOD

Tileset: TEMPERAT

MapSize: 100,60

Bounds: 1,1,98,58

Visibility: MissionSelector

Categories: Test

ShellmapScenario:

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: america
	PlayerReference@USA:
		Name: USA
		Playable: True
		LockFaction: True
		LockColor: True
		Faction: america
		Color: 4488FF
		Enemies: Russia
	PlayerReference@Russia:
		Name: Russia
		LockFaction: True
		LockColor: True
		Faction: russia
		Color: FF4444
		Enemies: USA

Actors:
	# The two Supply Routes fix each player's HomeLocation, which is what DefconWall
	# resolves each player's SIDE of the line from. Without them both players would
	# resolve to the same half and the wall would be one-directional.
	OwnSR: supplyroute
		Owner: USA
		Location: 3,55
	OpponentSR: supplyroute
		Owner: Russia
		Location: 94,55

	# Spawns at x 8 and x 80. Their midpoint is x 44, which is exactly where
	# rules.yaml authors the line -- so this map's authored line is also the line the
	# perpendicular-bisector derivation would produce. That is deliberate: it makes
	# this scenario a check on the derivation as well as on the enforcement.
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 8,28
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 80,28

Rules: rules.yaml
