Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false

	# Enough that nothing here is decided by poverty. Carriers and infantry are pre-placed, so this
	# only keeps the bot's ordinary production alive rather than starving its modules into unusual
	# paths -- and in particular keeps the composition lane from competing for the same cash.
	PlayerResources:
		DefaultCash: 15000

	# THE LEVER UNDER TEST, STATED RATHER THAN INHERITED. ai.yaml sets it true for both profiles; the
	# scenario re-states it so the RED sabotage is a one-word edit HERE and nobody has to take the
	# shipped tuning down to run it. Same device test-bot-defcon-wall uses for the offensive twin.
	MountedTransportBotModule@experimental:
		BorderStagingEnabled: true

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-bot-transport-wall.lua

	# Escalation rather than the shipped Skirmish default: Skirmish holds NoLevel and the wall never
	# stands at NoLevel. The no-rush clock is pinned far past the run so the level cannot fall to 2
	# mid-test and take the border down under the assertions -- which here would not merely weaken the
	# test but INVERT it, since the fix's whole self-healing behaviour is "resume to the objective once
	# the wall lifts" and the carrier would then legitimately drive east past the old line.
	#
	# NoRushTicksOverride, not the dropdown: the lobby option is registered with its own default
	# whatever a rules.yaml says, so only the override can win. Its "not in play" sentinel is 0.
	DefconEscalation:
		ModeDefault: Escalation
		StartAtDefault: 3
		NoRushTicksOverride: 30000

	# A vertical line down column 44 -- the midpoint of the two spawns at x 8 and x 80, so this
	# authored line is also the one the perpendicular-bisector derivation would produce.
	# HalfWidth left at the 1024 default: the band the staging clamp must step back over is the
	# shipped width, and testing against anything else tests a wall this mod does not build.
	DefconWall:
		Start: 44,0
		End: 44,59
