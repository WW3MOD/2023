# Safe-front supply autotest overrides.
#
# THREE overrides, each argued where it sits: TWO behavioural keys under Player —
# IgnoreDangerForDelivery, which makes the mode under test reachable at all, and
# ForwardStagingEnabled, which stops a DIFFERENT bot module from repositioning the platoon the
# instant the resupply succeeds — and ONE instrumentation key on TRUK (at the bottom) that makes
# clause 3 readable. Everything else the
# module reads — ScanInterval, MaxFollowDistance, the follow leash, the drop demand gates, the
# danger thresholds — comes from ai.yaml exactly as shipped, because a test that retunes the thing
# it is testing proves only that some other tuning works.
#
# THIS HEADER USED TO SAY "Nothing here touches SupplyFollowerBotModule". That was true, and it was
# why the scenario could not pass: the mode it asserts is switched off in shipped content. The
# block under Player is the correction, and the reasoning is there rather than here.

Player:
	# Faction elimination would end the match before the Lua poller writes a verdict — and
	# here it would fire immediately, since Russia owns no actors at all.
	-ConquestVictoryConditions:
	# Fog OFF and the map pre-explored. Kept for parity with test-supply-under-danger so the
	# two scenarios differ in exactly one thing (the presence of the enemy). It is inert here
	# in the belief sense — there is nothing on the map to see — but leaving it identical means
	# a difference in verdicts cannot be blamed on visibility.
	MapLayers:
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
	# No cash -> no production, so the only actors are the pre-placed ones and the platoon
	# cannot be reinforced into passing.
	PlayerResources:
		DefaultCash: 0

	# THE MODE UNDER TEST IS SWITCHED OFF IN SHIPPED CONTENT, AND THIS BLOCK IS WHAT REACHES IT.
	# Added 2026-09-06. Without it this scenario cannot pass for its own reason, and the red it
	# produced was read as a selector defect for three weeks (bugs/discovered.md 2026-08-14,
	# PIPELINE items 51 and 56) when it was a configuration fact.
	#
	# THE GATE. The safe branch is selected at SupplyFollowerBotModule.cs:1662:
	#
	#     if (drop && Info.DropRequiresDanger && !Info.IgnoreDangerForDelivery && !dispatched && cluster != null)
	#
	# ai.yaml sets DropRequiresDanger: true (:1882) — the principled configuration — and then
	# IgnoreDangerForDelivery: true (:1676), which short-circuits the whole conjunct. So on shipped
	# content `reason = "SafeFront"` is UNREACHABLE, the drop mode is unconditional, and the truck
	# unloads its whole 750 as a crate on any front including this one. That is the SHIPPED CONTRACT
	# and it is deliberate: the user pre-authorised bypassing danger awareness for trucks entirely,
	# and the bypass is documented in place at SupplyFollowerBotModule.cs:1646-1659. Clause 2 of this
	# scenario fails a run in which any crate appears, so at shipped config the scenario could only
	# ever have gone green by the truck failing to deliver at all.
	#
	# WHY THIS SCENARIO IS NOT SIMPLY RE-SPECCED TO ASSERT THE SHIPPED CONTRACT INSTEAD. That
	# contract is already under test: test-supply-under-danger sets REQUIRE_CRATE = true and asserts
	# a crate is placed. With the bypass on, both maps take the same unconditional-drop path, so a
	# re-specced safe-front scenario would assert a second time what the sibling already asserts,
	# and the serve-in-place branch — the documented half of the doctrine
	# (DOCS/reference/supply-route.md §"Forward delivery"), and the branch item 40's danger-scale
	# rework exists to restore — would be under test nowhere at all. Keeping the assertion and
	# reaching the mode keeps a real, distinct behaviour measured; inverting it would not.
	#
	# WHY ONE KEY AND NOT SEVEN. IgnoreDangerForDelivery is a bypass switch over seven sites (its
	# own Desc, :131-145), so clearing it here re-arms all seven, not just the one under test. On
	# THIS map that is acceptable rather than a hidden side effect, because no enemy actor exists
	# anywhere and believed ground danger is 0 in every cell — and at 0 the other six are inert or
	# off-path. Each was read at 9cb423d4:
	#
	#   1  SelectServableClusters (:1039)  — keeps clusters with Danger < releaseLevel; releaseLevel
	#                                        is level(EvacDangerUnits 50) - level(20) > 0 and this
	#                                        cluster's Danger is 0, so it survives. The bypass branch
	#                                        it replaces (:1025-1031) applies the same need filter.
	#   2  the need filter (:1030)         — reapplied identically by SelectServableClusters. Inert.
	#   3  evac (:969)                     — becomes live (DangerEvac: true is shipped). Fires at
	#                                        EvacDangerUnits: 50 against a field reading 0. Inert BY
	#                                        THRESHOLD rather than structurally — the weakest of the
	#                                        six arguments, and the one to check first if a run
	#                                        surprises you.
	#   4  DangerSelectsDrop (:1662)       — THE POINT. Cluster danger 0 < DropDangerFloorUnits 25;
	#                                        the floor limb is evaluated first and can only declare
	#                                        SAFE, so drop = false and reason = SafeFront.
	#   5  SR-descent guard (:2000)        — becomes a real threshold instead of -1, but it guards
	#                                        the FALLBACK anchor only (no cluster selected). A
	#                                        cluster exists here. Off-path.
	#   6  Stage-E reroute (:1352)         — routeViaDanger becomes true, but DetourWaypoint returns
	#                                        null whenever the straight path's max danger is <= the
	#                                        safe threshold (GroundDangerNav.cs:98-100), which at 0
	#                                        it always is; the else at :1419-1433 then issues the
	#                                        same single damped direct Move as the flag-off branch.
	#                                        Provably inert.
	#   7  FindSafeFollowPosition (:2484)  — GENUINELY LIVE, and the one thing here that reading
	#                                        cannot settle. It scores a +/-3 box by -GetThreat, i.e.
	#                                        friendlyValue - enemyValue (ThreatMapManager.cs:197-227);
	#                                        with no enemy that is friendlyValue argmaxed, so it
	#                                        walks the follow cell TOWARD the friendliest-dense cell
	#                                        — into the platoon, never away from it. The direction
	#                                        helps clauses 1 and 4 rather than hurting them, but the
	#                                        cell is no longer exactly the centroid. If this scenario
	#                                        ever fails clause 4 with the truck short of aura range,
	#                                        look here first.
	#
	# WHAT A READER MUST NOT CONCLUDE FROM A GREEN RUN. Clauses 1-4 can all hold without the safe
	# branch ever firing: any drop decline (NoDemand, Covered, LowLoad, NoAnchor) also leaves
	# drop = false, and the truck then takes the follow path, drives to the platoon and serves from
	# its aura with no crate and its cargo intact. A pass is evidence about the mode selector ONLY
	# if debug.log carries `[supply] drop-declined ... reason=SafeFront` (:1730). Green with
	# `reason=NoDemand` is a false pass, and means the demand gates rather than the mode gate
	# produced it.
	#
	# Precedent for a scenario-local bot-module field override with a named reason:
	# test-experimental-lccv-logistics/rules.yaml (RequireDemand: false, so the siting descent that
	# scenario asserts can be reached at all).
	SupplyFollowerBotModule@supply:
		IgnoreDangerForDelivery: false

	# FORWARD STAGING OFF — WITHOUT THIS, CLAUSE 4 IS UNREACHABLE BY CONSTRUCTION AND A RED RUN SAYS
	# NOTHING ABOUT SUPPLY. Measured on run 260906_092137_p10284 (main @ 10b4a88c), which failed clause 4
	# alone at peak drift 6 with the truck correctly closed to x=40:
	#
	#   tick  15 — [exp-ammo] withhold module=offense unit=e3#10..14 reason=starving
	#              All five are held OUT of PoiOffensiveBotModule's free pool BECAUSE they are starving.
	#   tick 815 — [exp-ammo] release module=offense unit=e3#10..14 cell=44,14..18
	#              Fed, therefore no longer starving, therefore released — each at his SPAWN cell.
	#   tick 815 — [exp-staging] anchor=43,17 idle=5 staged=5   (the SAME tick)
	#              StageFreePool (PoiOffensiveBotModule.cs:2787) AttackMoves each man to
	#              ForwardStagingMath.SpreadSlot around anchor 43,17, one order per unit.
	#
	# So SUCCEEDING AT THE THING UNDER TEST IS WHAT TRIGGERS THE MOVE THAT FAILS THE CLAUSE. It is not a
	# near miss: with StagingStandoffCells: 6 / StagingSpreadStepCells: 2 (ai.yaml:732, :734) the widest
	# ring is Chebyshev 4 from the anchor — the observed finals were x = 47/43/39 — and even slot 0, the
	# bare anchor 43,17, is Chebyshev 3 from the man spawned at 44,14. NO assignment staging can make
	# satisfies HOLD_DRIFT = 1. The clause is correct and is deliberately left alone; the map was wrong to
	# leave a second mover running.
	#
	# THE KEY, VERIFIED RATHER THAN GUESSED. The field is ForwardStagingEnabled, declared
	# PoiOffensiveBotModule.cs:563 with an engine default of FALSE, and switched on for this profile at
	# ai.yaml:731 inside `PoiOffensiveBotModule@experimental:` (block opens ai.yaml:366). map.yaml:119
	# pins `Bot: experimental`, so that keyed instance is the one that runs here; @stable's copy
	# (ai.yaml:2988) sits behind RequiresCondition: enable-ai-stable and is never enabled on this map, so
	# overriding it too would be dead weight that misdescribes the scenario. The trait key must match
	# ai.yaml's CASE-SENSITIVELY — a bare `PoiOffensiveBotModule:` or a mis-cased suffix DEFINES A SECOND
	# INSTANCE instead of overriding this one, and that failure is SILENT. The run-side guard is that
	# `[exp-staging]` must be ABSENT from debug.log.
	#
	# THIS IS NOT RETUNING THE THING UNDER TEST. Every SupplyFollowerBotModule key except the mode gate
	# above still comes from ai.yaml as shipped. What is switched off is the OFFENSE layer's muster, a
	# different module that has no part in the doctrine this scenario asserts and only ever competed with
	# it for the same five men. StageFreePool returns at its first line when the flag is false
	# (PoiOffensiveBotModule.cs:2789), and nothing else in that module walks an idle unit: rallyCell is
	# read only on the axis-retreat path and inside the staging fallback itself, so turning staging off
	# does NOT reroute the platoon to the Supply Route instead.
	PoiOffensiveBotModule@experimental:
		ForwardStagingEnabled: false

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	# UnitDefaultsManager applies this machine's saved per-type stance defaults (AutoTarget.cs).
	# The crate-collect half of the doctrine runs through AutoSeekSupplies, which is stance
	# gated (Resupply Hold / Evacuate, HoldPosition, Ambush all veto it), so a dev who once
	# set riflemen to Ambush would otherwise change what this test measures.
	-UnitDefaultsManager:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, test-supply-safe-front-keeps-cargo.lua

# INSTRUMENTATION — the only other behavioural line in this file, and it is provably inert above
# zero supply.
#
# WHY IT IS NEEDED. Clause 3 asserts the truck still HOLDS supply at verdict time, and there
# is no Lua binding that reads SupplyProvider.CurrentSupply — the scripting API has no supply
# property at all. RemoveBelowSupply turns the one value the test needs into the one thing Lua
# can always see: whether the actor is still there.
#
# WHY IT CANNOT CHANGE THE DECISION UNDER TEST. RemoveBelowSupply is read at exactly two sites
# (SupplyProvider.cs:221 and :947) and both compare `currentSupply < RemoveBelowSupply`. At 1
# that is `currentSupply == 0`, and at zero supply the immediately adjacent `currentSupply <= 0`
# branch already returns the same answer at both sites. So for every supply level the truck
# actually makes decisions at — 750 down to 1 — this field is a no-op, and it cannot influence
# whether the truck drives, serves, or drops.
#
# WHAT IT DOES CHANGE, stated plainly: an emptied truck self-Disposes at once instead of
# reaching CountsAsEmpty and being driven to the map edge and sold (EvacuateOnUnusableResidue,
# vehicles.yaml). Both paths remove the truck; this one removes it promptly and for exactly one
# reason, which is what makes "truck gone" readable as "truck emptied itself". The Lua records
# the truck's last cell anyway, so the remote residue-evac case stays distinguishable in the
# failure text rather than being silently misread.

TRUK:
	SupplyProvider:
		RemoveBelowSupply: 1
