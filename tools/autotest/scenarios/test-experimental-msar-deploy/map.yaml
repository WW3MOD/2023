# NOTHING HERE IS AN MSAR, DELIBERATELY, AND THE TEST IS WORTHLESS IF THAT CHANGES.
# The predicate is "USA-bot owns exactly one deployed msar". A pre-placed one satisfies it without
# the bot doing anything, which would turn a procurement-and-siting test into a test that the
# harness can count actors. Same reason the Lua never calls Test.IssueDeploy: the bot must issue
# that order itself. The two Supply Routes are the call-in beachheads (one per player, as shipped)
# and are what the siting module measures its rear band from.
Actors:
	OwnSR: supplyroute
		Owner: USA-bot
		Location: 6,16
	OpponentSR: supplyroute
		Owner: Russia-bot
		Location: 58,16
	SpawnUSA: mpspawn
		Owner: Neutral
		Location: 6,16
	SpawnRussia: mpspawn
		Owner: Neutral
		Location: 58,16

Rules: rules.yaml
