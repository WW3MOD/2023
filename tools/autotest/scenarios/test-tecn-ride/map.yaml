MapSize: 66,34

Bounds: 0,0,66,34

Visibility: MissionSelector

Categories: Test

# Bug 3.2 (playtest, user priority): technicians WALK to distant captures — mounting
# was never wired. CaptureCoordinatorBotModule@experimental.tecn now requests a ride
# from MountedTransportBotModule@experimental (TryReserveCaptureFerry) for any capture
# farther than TransportCaptureMinDistanceCells (12); the carrier drives the TECN there
# and, on unload, hands it back its CaptureActor.
#
#   USA-bot (6,16) experimental  — owns one TECN + one bradley (carrier) near its SR.
#   Russia-bot                   — enemy, kept alive by its own SR so the game doesn't
#                                  end on faction elimination before the verdict fires.
#
# A NEUTRAL oil derrick sits ~39 cells east of the TECN — well past the 12-cell ferry
# gate, so WITHOUT the fix the TECN walks and the carrier never gets a passenger (RED).
# WITH the fix the TECN boards the bradley and is driven to the derrick.
#
# Verdict: PASS the instant the carrier has carried a passenger AND arrived within a few
# cells of the derrick (mounted + delivered). No cash anywhere, so nothing is produced —
# the only actors are the pre-placed ones.
