# The game-ender level autotest's overrides.

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	# Removed so each player's HomeLocation falls back to the pinned PlayerReference value rather
	# than a spawn assignment -- which is what fixes the two SIDES on this map.
	-MapStartingLocations:
	-CrateSpawner:
	LuaScript:
		Scripts: test-helpers.lua, test-nuclear-ender-level.lua

	# THE MODE. Escalation, DEFCON 1, ten-tick release. The gate is not under test here; the top of
	# the ladder is. Same three settings and the same reasons as test-nuclear-exchange.
	DefconEscalation:
		ModeDefault: Escalation
		StartAtDefault: 1
		NuclearReleaseDelayTicksOverride: 10

	NuclearExchange:
		# THE SIDE COOLDOWNS, COMPRESSED TO 60 TICKS FLAT against a shipped 5000/7000/9000/12000
		# (5/7/9/12 minutes, the 2026-09-15 user ruling). This scenario measures WHAT reaching a
		# level grants and to WHOM, never the cooldown -- so the cooldown is set as far out of the
		# way as it can be without being zero.
		#
		# NOT ZERO, AND THAT IS DELIBERATE RATHER THAN CAUTIOUS. NuclearExchangeInfo.RulesetLoaded
		# REFUSES a non-positive cooldown ("0 would let it fire every tick"), so the mod would not
		# load; and a cooldown of zero would also stop this file being able to say anything about
		# the top rung's arming path honouring one. It does not assert that -- that is
		# test-nuclear-exchange's phase G2 -- but a scenario configured so the property could not
		# hold is a scenario that would pass over its removal.
		#
		# EVERY LAUNCH BY ONE SIDE IS >= 140 TICKS AFTER THAT SIDE'S PREVIOUS ONE, so 60 never blocks
		# a scripted shot.
		#
		# AND 60 IS THE UPPER BOUND ON THE .lua's CHECK GAP, WHICH IS THE LESS OBVIOUS CONSTRAINT.
		# Every phase there reads its band 40 ticks after the rise that granted it, and 40 has to be
		# BELOW this number: a band that was never granted counts down its own constructed interval,
		# so if the gap exceeded 60 it would have reached zero on its own and read `ready` whether the
		# grant ran or not. Raising this value is safe; LOWERING it below ~45 silently makes four
		# phases of that file vacuous. Found at review, 2026-09-15, after the gap had been 65.
		KilotonCooldownTicks: 60
		TwentyKilotonCooldownTicks: 60
		FiftyKilotonCooldownTicks: 60
		HundredKilotonCooldownTicks: 60

	# ==== SHIPPED LOBBY CONFIGURATION, PINNED. THE ABSENT LINE IS THE POINT OF THE FILE ====
	# Every value below is the trait's own shipped default; they are written out and LOCKED so no
	# saved session or host default can move one out from under the run, not to change anything.
	#
	# PowersSandboxCheckboxEnabled IS FALSE AND MUST STAY FALSE. ProvidesPrerequisite@SandboxEvent
	# grants `powers.event` while that option is on (player.yaml), which is the one prerequisite the
	# three game-enders declare and no faction provides. Turn it on and every assertion here passes
	# on a build with the defect fully intact -- which is exactly why test-nuclear-exchange cannot
	# see this bug: its rules.yaml sets it for unrelated reasons.
	#
	# TWO MORE PINS USED TO LIVE HERE AND WERE REMOVED ON 2026-09-15 WITH THE OPTIONS THEY PINNED.
	# `high-yield-nuke` and `tactical-nuke` were retired that day; each gated exactly one event-tier
	# power. Neither removal weakens a phase of this scenario, and the reasoning differs per power,
	# so both halves are written out:
	#
	#   * HighYieldNuke WAS PINNED ON, and that was what made phases F and H evidence: they assert
	#     it reads `hidden` at an OPEN END LEVEL because it names no nation, and a negative
	#     assertion is only evidence while every OTHER gate on the power is open. With the checkbox
	#     gone that gate is now open UNCONDITIONALLY -- the power's RequiresCondition is
	#     `nuclear-release-gameender` alone, satisfied at an open END level -- so the reading is
	#     still about attribution and no longer depends on this file remembering to tick a box.
	#     STRICTLY STRONGER. What refuses it is NuclearGameEnders.ArmableBy: subtract the overridden
	#     `powers.event` and its owner set is EMPTY.
	#     (PHASE A also asserts `hidden` on this power but is NOT an attribution reading and never
	#     was: it reads at RELEASE, which is level 1, so the game-ender band is ungranted and the
	#     band alone explains it. It is the baseline F and H are measured against. The pin made no
	#     difference there either way.)
	#
	#   * TacticalNuke WAS PINNED OFF, and phase C's negative control USED TO REST ON THAT. It no
	#     longer does, and this is the one place in the change where a control's claim NARROWED
	#     rather than held: TacNuke is band 2, its RequiresCondition is now `nuclear-release-20kt`
	#     alone and IS satisfied at level 2. What keeps it dark is the EVENT TIER -- band 2 is below
	#     the GameEnder rung, so NuclearExchangeInfo.OverriddenPrerequisites never waives
	#     `powers.event` for it (ArmableAtTopRung), and sandbox is locked off above. The control
	#     therefore still binds, but on "the prerequisite override did not reach below the top rung"
	#     rather than on "the grant path re-checked the power's own condition". The .lua says the
	#     same thing at TACNUKE; keep the two in step.
	PowersLobbyOptions:
		NuclearArsenalCheckboxEnabled: true
		NuclearArsenalCheckboxLocked: true
		PowersSandboxCheckboxEnabled: false
		PowersSandboxCheckboxLocked: true

	# THE FINAL EXCHANGE STAYS OFF, by leaving DoomsdayStrikeInfo.RunInTestMode at its default false
	# (DoomsdayStrike.cs:100-104, :458-459). Stated as a comment rather than written as
	# `RunInTestMode: false`, which would be a no-op restating the default -- but the reason is load
	# bearing and belongs beside the launch that would otherwise trigger it: phase G fires a real
	# game-ender, and with the salvo live that call freezes statistics, reveals the map and
	# annihilates the world while this scenario's poller is still trying to write a verdict.

Player:
	# The warheads land on empty ground, but a 100 kt blast on a 64x32 playfield reaches most of it.
	# Removed so an elimination cannot end the match before the poller writes a verdict.
	-ConquestVictoryConditions:
	# Fog off and the map pre-explored, so nothing the poller reads is a visibility artefact.
	MapLayers:
		ExploredMapCheckboxEnabled: true
		ExploredMapCheckboxLocked: true
		FogCheckboxEnabled: false
		FogCheckboxLocked: true
	# NO CASH. Since decision 02 nothing nuclear is purchasable in Escalation at all, so this is
	# belt-and-braces rather than the only guard -- but it is what makes every `ready` below mean
	# "the exchange loaded this" rather than "somebody could have bought it".
	PlayerResources:
		DefaultCash: 0

# Nothing initiates on its own: the scenario issues every order it measures.
^Combatant:
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: HoldFire
		InitialEngagementStance: HoldPosition
		InitialEngagementStanceAI: HoldPosition
